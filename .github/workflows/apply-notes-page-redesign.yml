name: Apply notes page redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-notes-page-redesign.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply notes redesign
        run: python3 scripts/apply-notes-redesign-temp.py
      - name: Focused regression tests
        run: |
          node --check js/modules/communication.js
          node --test tests/notes-page-redesign.test.js
          node tests/quick-note-launcher.test.js
          node --test tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit verified change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-notes-page-redesign.yml
          rm -f scripts/apply-notes-redesign-temp.py
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: redesign notes page and fix theme colors'
          git push
