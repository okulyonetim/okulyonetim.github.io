name: Fix menu customization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-menu-customization.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply repair
        run: python scripts/tmp-fix-menu-customization.py
      - name: Syntax
        run: |
          node --check js/app-loader.js
          node --check js/core/shell-ui.js
          node --check js/modules/settings.js
          git diff --check
      - name: Focused contracts
        run: |
          node tests/menu-customization-v2.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/settings-separate-pages.test.js
          node tests/service-worker-precache-smoke.test.js
      - name: Build and audit
        run: |
          node scripts/build-client-bundles.mjs
          node tests/module-bundles-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-menu-customization.yml scripts/tmp-fix-menu-customization.py
          git add -A
          git commit -m "fix: repair menu customization and compact layout"
          git push origin HEAD:main
