name: Temporary Dashboard Refresh News Fix V3
on:
  push:
    branches: [fix/dashboard-refresh-news-stability]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-refresh-news-stability
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply final patch
        shell: python
        run: |
          from pathlib import Path
          core=Path('js/core/core.js'); s=core.read_text()
          s=s.replace("let tracking=false,armed=false,startX=0,startY=0,indicator=null,reloading=false;","let tracking=false,armed=false,startX=0,startY=0,indicator=null,reloading=false,staleTimer=null,reloadFallbackTimer=null;")
          s=s.replace("function reset(){tracking=false;armed=false;const el=indicator;if(el&&!reloading){el.classList.remove('is-armed','is-refreshing');el.style.setProperty('--ka-pull-y','0px');el.hidden=true}}","function reset(){clearTimeout(staleTimer);staleTimer=null;tracking=false;armed=false;const el=indicator;if(el&&!reloading){el.classList.remove('is-armed','is-refreshing');el.style.setProperty('--ka-pull-y','0px');el.hidden=true}}\n  function scheduleStaleReset(){clearTimeout(staleTimer);staleTimer=setTimeout(()=>{if(tracking&&!reloading)reset()},900)}")
          s=s.replace("tracking=true;armed=false;startX=e.touches[0].clientX;startY=e.touches[0].clientY;","tracking=true;armed=false;startX=e.touches[0].clientX;startY=e.touches[0].clientY;scheduleStaleReset();")
          s=s.replace("if(dy<=DEAD_ZONE)return;e.preventDefault();draw(dy);","if(dy<=DEAD_ZONE)return;e.preventDefault();draw(dy);scheduleStaleReset();")
          old="reloading=true;const el=ensureIndicator();el.hidden=false;el.classList.remove('is-armed');el.classList.add('is-refreshing');el.style.setProperty('--ka-pull-y','74px');const label=el.querySelector('span');if(label)label.textContent='Yenileniyor…';setTimeout(()=>window.location.reload(),120);"
          assert old in s
          s=s.replace(old,"clearTimeout(staleTimer);staleTimer=null;reloading=true;const el=ensureIndicator();el.hidden=false;el.classList.remove('is-armed');el.classList.add('is-refreshing');el.style.setProperty('--ka-pull-y','74px');const label=el.querySelector('span');if(label)label.textContent='Yenileniyor…';clearTimeout(reloadFallbackTimer);reloadFallbackTimer=setTimeout(()=>{reloading=false;reset()},3500);setTimeout(()=>window.location.reload(),100);")
          anchor="document.addEventListener('touchcancel',reset,{capture:true,passive:true});"
          assert anchor in s
          s=s.replace(anchor,anchor+"\n  window.addEventListener('pageshow',()=>{clearTimeout(reloadFallbackTimer);reloading=false;reset()},{passive:true});\n  window.addEventListener('blur',()=>{if(!reloading)reset()},{passive:true});\n  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!reloading)reset()},{passive:true});")
          core.write_text(s)

          dash=Path('js/modules/dashboard.js'); s=dash.read_text()
          old="return `<div class=\"kh-news\" data-home-section=\"news\" data-news-signature=\"${esc(signature)}\" style=\"--kh-ticker-time:${Math.max(22,items.length*8)}s\"><button"
          assert old in s
          s=s.replace(old,"const tickerTime=Math.max(22,items.length*8),tickerDelay=-((Date.now()/1000)%tickerTime);return `<div class=\"kh-news\" data-home-section=\"news\" data-news-signature=\"${esc(signature)}\" style=\"--kh-ticker-time:${tickerTime}s;--kh-ticker-delay:${tickerDelay.toFixed(2)}s\"><button")
          oldrender="const oldNews=root.querySelector('.kh-news'),oldNewsSignature=oldNews?.dataset.newsSignature||'',scrollY=window.scrollY;parent.innerHTML=shell();bindPresentation(parent);const freshNews=parent.querySelector('.kh-news');if(oldNews&&freshNews&&oldNewsSignature&&freshNews.dataset.newsSignature===oldNewsSignature)freshNews.replaceWith(oldNews);stabilizeNewsTicker(parent);"
          assert oldrender in s
          s=s.replace(oldrender,"const scrollY=window.scrollY;parent.innerHTML=shell();bindPresentation(parent);stabilizeNewsTicker(parent);")
          dash.write_text(s)

          css=Path('css/design-system.css'); s=css.read_text()
          oldcss=".ka-home .kh-news-track{display:flex;align-items:center;gap:0;width:max-content;animation:khTicker var(--kh-ticker-time,28s) linear infinite;animation-play-state:running;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden;contain:paint}"
          assert oldcss in s
          s=s.replace(oldcss,".ka-home .kh-news-track{display:flex;align-items:center;gap:0;width:max-content;animation:khTicker var(--kh-ticker-time,28s) linear infinite;animation-delay:var(--kh-ticker-delay,0s);animation-play-state:running;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden;contain:paint}")
          s=s.replace("@media(hover:hover) and (pointer:fine){.ka-home .kh-news:hover .kh-news-track{animation-play-state:paused}}","")
          css.write_text(s)

          index=Path('index.html'); s=index.read_text().replace('css/design-system.css?v=941','css/design-system.css?v=942').replace('js/core/core.js?v=905','js/core/core.js?v=906'); index.write_text(s)
          sw=Path('service-worker.js'); s=sw.read_text().replace("const CACHE_ADI='oy-cache-v944';","const CACHE_ADI='oy-cache-v945';").replace('css/design-system.css?v=941','css/design-system.css?v=942').replace('js/core/core.js?v=905','js/core/core.js?v=906'); sw.write_text(s)

          t=Path('tests/android-pull-refresh-guard.test.js'); s=t.read_text().replace("'window.location.reload()','.ka-app-nav.ka-bottom-nav'","'window.location.reload()','scheduleStaleReset','pageshow','reloadFallbackTimer','.ka-app-nav.ka-bottom-nav'"); t.write_text(s)
          t=Path('tests/dashboard-card-routes-smoke.test.js'); s=t.read_text()
          oldline="assert(css.includes('.ka-home .kh-news-track{display:flex;align-items:center;gap:0;width:max-content;animation:khTicker var(--kh-ticker-time,28s) linear infinite;animation-play-state:running')&&!css.includes('.ka-home .kh-news.is-ready .kh-news-track{animation:khTicker')&&css.includes('@media(hover:hover) and (pointer:fine){.ka-home .kh-news:hover .kh-news-track{animation-play-state:paused}}'),'Haber bandı DOMa gelir gelmez akmalı; is-ready beklememeli ve dokunmatik cihazlarda sticky hover nedeniyle durmamalı.');"
          assert oldline in s
          newline="assert(css.includes('animation:khTicker var(--kh-ticker-time,28s) linear infinite')&&css.includes('animation-delay:var(--kh-ticker-delay,0s)')&&!css.includes('.ka-home .kh-news.is-ready .kh-news-track{animation:khTicker')&&!css.includes('.kh-news:hover .kh-news-track{animation-play-state:paused}'),'Haber bandı DOMa gelir gelmez ve yeniden render sonrasında kesintisiz akmalı.');"
          s=s.replace(oldline,newline); t.write_text(s)
          Path('tests/dashboard-refresh-news-stability.test.js').write_text("""const fs=require('fs');const assert=require('assert');\nconst core=fs.readFileSync('js/core/core.js','utf8'),dash=fs.readFileSync('js/modules/dashboard.js','utf8'),css=fs.readFileSync('css/design-system.css','utf8'),sw=fs.readFileSync('service-worker.js','utf8');\nassert(core.includes('scheduleStaleReset')&&core.includes("window.addEventListener('pageshow'")&&core.includes('reloadFallbackTimer'));\nassert(dash.includes('--kh-ticker-delay:${tickerDelay.toFixed(2)}s')&&!dash.includes('freshNews.replaceWith(oldNews)'));\nassert(css.includes('animation-delay:var(--kh-ticker-delay,0s)')&&!css.includes('.kh-news:hover .kh-news-track{animation-play-state:paused}'));\nassert(sw.includes("const CACHE_ADI='oy-cache-v945';"));\nconsole.log('dashboard refresh/news stability regression ok');\n""")
      - name: Verify
        run: |
          node --check js/core/core.js
          node --check js/modules/dashboard.js
          node tests/android-pull-refresh-guard.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-motion-regression.test.js
          node tests/dashboard-refresh-news-stability.test.js
      - name: Commit and clean temporary workflows
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/core/core.js js/modules/dashboard.js css/design-system.css index.html service-worker.js tests/android-pull-refresh-guard.test.js tests/dashboard-card-routes-smoke.test.js tests/dashboard-refresh-news-stability.test.js
          git commit -m "fix: stabilize pull refresh and dashboard ticker"
          git rm -f .github/workflows/tmp-dashboard-refresh-news-fix.yml .github/workflows/tmp-dashboard-refresh-news-fix-v2.yml .github/workflows/tmp-dashboard-refresh-news-fix-v3.yml
          git commit -m "chore: remove temporary dashboard stability workflows"
          git push
