name: One-shot Remove Duplicate Diploma Menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-remove-duplicate-diploma-menu.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove duplicate lower Diploma menu block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('js/app-loader.js')
          text = app.read_text(encoding='utf-8')
          old = "[['Personeller','🧑‍💼','management','staff'],['Maaş Değişikliği','💵','payroll'],['Tebliğ-Tebellüğ İmza Sirküsü','🔔','documents','teblig'],['Puantaj & İmza Sirküsü','🕘','management','puantaj'],['Dilekçe & İzinler','📄','management','dilekce'],['Devamsızlık Çizelgesi','📅','tools','attendance']],subLabel:'Diploma İşlemleri',subItems:[['Diploma Kayıt Talep Dilekçesi','📄','management','diploma-request'],['Diploma Okul Dilekçesi','📄','management','diploma-response']]"
          new = "[['Personeller','🧑‍💼','management','staff'],['Maaş Değişikliği','💵','payroll'],['Tebliğ-Tebellüğ İmza Sirküsü','🔔','documents','teblig'],['Puantaj & İmza Sirküsü','🕘','management','puantaj'],['Dilekçe & İzinler','📄','management','dilekce'],['Devamsızlık Çizelgesi','📅','tools','attendance']]"
          if old not in text:
              raise SystemExit('expected duplicate Diploma submenu block not found')
          text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          if "const CACHE_ADI='oy-cache-v848';" not in sw_text:
              raise SystemExit('expected cache v848 not found')
          sw.write_text(sw_text.replace("const CACHE_ADI='oy-cache-v848';", "const CACHE_ADI='oy-cache-v849';", 1), encoding='utf-8')
          PY
      - name: Validate duplicate cleanup
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const assert=require('assert');
          const app=fs.readFileSync('js/app-loader.js','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');
          new Function(app);
          assert(!app.includes("subLabel:'Diploma İşlemleri'"),'Alt Diploma İşlemleri tekrar bloğu kaldırılmalı.');
          assert(app.includes("registerPageRoute('diploma-request'")&&app.includes("registerPageRoute('diploma-response'"),'Diploma route kayıtları korunmalı.');
          assert(sw.includes("const CACHE_ADI='oy-cache-v849';"),'Cache v849 olmalı.');
          console.log('Diploma menü tekrar temizliği başarılı.');
          NODE
          node tests/modules-local-first-boundary.test.js
      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/one-shot-remove-duplicate-diploma-menu.yml
          git config user.name "sedonet23"
          git config user.email "sedonet23@gmail.com"
          git add js/app-loader.js service-worker.js .github/workflows/one-shot-remove-duplicate-diploma-menu.yml
          git commit -m "fix: remove duplicate diploma menu entries"
          git push origin main
