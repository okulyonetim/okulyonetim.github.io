name: Performance PDF Export Patch
permissions:
  contents: write
on:
  push:
    branches: [agent/performance-lazy-pdf-export]
    paths: ['.github/workflows/perf-pdf-export-patch.yml']

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-lazy-pdf-export
      - name: jsPDF autoTable html2canvas kullanım anına taşı
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Ortak loader uygulama script zincirine eklenir.
          p=Path('js/akademik-takvim.js'); s=p.read_text()
          anchor="/* Dökümanlar ekranının ağır PDF araçları ayrı dosyada tutulur ve\n   dokumanlar.js'den sonra yüklenir. Böylece ana modül bozulmadan düzeltilebilir. */"
          loader="""/* PDF üretiminde kullanılan jsPDF/autoTable/html2canvas ortak lazy loader. */\n(function pdfExportKutuphaneleriniYukle(){\n  if (document.querySelector('script[data-pdf-export-libs]')) return;\n  const s = document.createElement('script');\n  s.src = 'js/pdf-export-libs.js';\n  s.async = false;\n  s.dataset.pdfExportLibs = '1';\n  document.head.appendChild(s);\n})();\n\n"""+anchor
          assert anchor in s
          p.write_text(s.replace(anchor,loader,1))

          # Döküman resim -> PDF yolu jsPDF'yi kullanım anında bekler.
          p=Path('js/dokuman-pdf-tools.js'); s=p.read_text()
          old="""window.dokumanResimlerdenPdfOlustur = async function dokumanResimlerdenPdfOlusturV2(){\n  if (!_dokResimListe.length) { toast('Önce resim seçin.'); return; }\n  if (!window.jspdf || !window.jspdf.jsPDF) { toast('PDF kütüphanesi yüklenemedi.'); return; }"""
          new="""window.dokumanResimlerdenPdfOlustur = async function dokumanResimlerdenPdfOlusturV2(){\n  if (!_dokResimListe.length) { toast('Önce resim seçin.'); return; }\n  try {\n    if (!window.PdfExportLibs) throw new Error('PDF yükleyicisi bulunamadı.');\n    await window.PdfExportLibs.hazir();\n  } catch(e) { toast('PDF kütüphanesi yüklenemedi: '+e.message); return; }"""
          assert old in s
          p.write_text(s.replace(old,new,1))

          # Sınıf oturma PDF'i jsPDF + html2canvas'ı yalnız Yazdır/PDF anında yükler.
          p=Path('js/sinif-oturma.js'); s=p.read_text()
          old="""  async function yazdir(){\n    const btn = ov.querySelector('#btnSoYazdir');"""
          new="""  async function yazdir(){\n    try {\n      if (!window.PdfExportLibs) throw new Error('PDF yükleyicisi bulunamadı.');\n      await window.PdfExportLibs.hazir({html2canvas:true});\n    } catch(e) { toast('PDF bileşenleri yüklenemedi: '+e.message); return; }\n    const btn = ov.querySelector('#btnSoYazdir');"""
          assert old in s
          p.write_text(s.replace(old,new,1))

          # Öğretmen liste PDF'i jsPDF + autoTable'ı yalnız PDF'e Aktar anında yükler.
          p=Path('js/ogretmen-liste-olusturucu.js'); s=p.read_text()
          old="""  if (!sutunlar.length) { toast('En az bir sütun seçin.'); return; }\n  if (typeof window.jspdf === 'undefined') { toast('PDF kütüphanesi yüklenemedi.'); return; }"""
          new="""  if (!sutunlar.length) { toast('En az bir sütun seçin.'); return; }\n  try {\n    if (!window.PdfExportLibs) throw new Error('PDF yükleyicisi bulunamadı.');\n    await window.PdfExportLibs.hazir({autoTable:true});\n  } catch(e) { toast('PDF kütüphanesi yüklenemedi: '+e.message); return; }"""
          assert old in s
          p.write_text(s.replace(old,new,1))

          # Başlangıçtan üç ağır script çıkarılır.
          p=Path('index.html'); s=p.read_text()
          tags=[
            '<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>\n',
            '<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>\n',
            '<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>\n',
          ]
          for tag in tags:
            assert tag in s, tag
            s=s.replace(tag,'',1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/akademik-takvim.js js/dokuman-pdf-tools.js js/sinif-oturma.js js/ogretmen-liste-olusturucu.js
          git commit -m "jsPDF autoTable html2canvas kütüphanelerini lazy-load yap"
          git push origin HEAD:agent/performance-lazy-pdf-export
