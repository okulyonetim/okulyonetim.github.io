name: One-shot Diploma Redesign
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-diploma-redesign.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Redesign diploma form and preserve keyboard focus
        shell: python
        run: |
          from pathlib import Path

          p=Path('js/modules/personnel-documents.js')
          s=p.read_text(encoding='utf-8')
          old="""function requestForm(okul){return `<div class=\"ka-grid\"><label class=\"ka-field\"><span class=\"ka-field__label\">Adı ve Soyadı</span><input name=\"adSoyad\"></label><label class=\"ka-field\"><span class=\"ka-field__label\">T.C. Kimlik No</span><input name=\"tc\" maxlength=\"11\" inputmode=\"numeric\"></label></div><div class=\"ka-grid\"><label class=\"ka-field\"><span class=\"ka-field__label\">Baba Adı</span><input name=\"babaAdi\"></label><label class=\"ka-field\"><span class=\"ka-field__label\">Anne Adı</span><input name=\"anneAdi\"></label></div><label class=\"ka-field\"><span class=\"ka-field__label\">Doğum Yeri</span><input name=\"dogumYeri\" placeholder=\"Örn: Koruk – Merkez/Elazığ\"></label><div class=\"ka-grid\"><label class=\"ka-field\"><span class=\"ka-field__label\">Doğum Tarihi</span><input name=\"dogumTarihi\" type=\"date\"></label><label class=\"ka-field\"><span class=\"ka-field__label\">Mezuniyet Tarihi</span><input name=\"mezuniyetTarihi\" type=\"date\"></label></div><label class=\"ka-field\"><span class=\"ka-field__label\">Mezun Olduğu Sınıf</span><input name=\"mezunSinif\" placeholder=\"Örn: 5. Sınıf\"></label><label class=\"ka-field\"><span class=\"ka-field__label\">Adres</span><input name=\"adres\"></label><label class=\"ka-field\"><span class=\"ka-field__label\">Okul Adı</span><input name=\"okulAdi\" value=\"${esc(okul.okulAdi||'')}\"></label>`}
function responseForm(okul){return `<div class=\"ka-grid\"><label class=\"ka-field\"><span class=\"ka-field__label\">Adı ve Soyadı</span><input name=\"adSoyad\"></label><label class=\"ka-field\"><span class=\"ka-field__label\">T.C. Kimlik No</span><input name=\"tc\" maxlength=\"11\" inputmode=\"numeric\"></label></div><div class=\"ka-grid\"><label class=\"ka-field\"><span class=\"ka-field__label\">Baba Adı</span><input name=\"babaAdi\"></label><label class=\"ka-field\"><span class=\"ka-field__label\">Kız/Oğul</span><select name=\"kizOglu\"><option value=\"kızı\">kızı</option><option value=\"oğlu\">oğlu</option></select></label></div><label class=\"ka-field\"><span class=\"ka-field__label\">Doğum Tarihi</span><input name=\"dogumTarihi\" type=\"date\"></label><div class=\"ka-grid\"><label class=\"ka-field\"><span class=\"ka-field__label\">Öğrenim Süresi (yıllık)</span><input name=\"ogrenimSuresi\" type=\"number\" min=\"1\" max=\"12\"></label><label class=\"ka-field\"><span class=\"ka-field__label\">Diploma Tarihi</span><input name=\"diplomaTarihi\" type=\"date\"></label></div><label class=\"ka-field\"><span class=\"ka-field__label\">Diploma Sayısı</span><input name=\"diplomaSayisi\"></label><div class=\"ka-grid\"><label class=\"ka-field\"><span class=\"ka-field__label\">Adres</span><input name=\"adres\"></label><label class=\"ka-field\"><span class=\"ka-field__label\">Cep No</span><input name=\"cepNo\" inputmode=\"tel\"></label></div><label class=\"ka-field\"><span class=\"ka-field__label\">Okul Müdürü Adı Soyadı</span><input name=\"mudurAdi\" value=\"${esc(principalName())}\"></label><label class=\"ka-field\"><span class=\"ka-field__label\">Okul Adı</span><input name=\"okulAdi\" value=\"${esc(okul.okulAdi||'')}\"></label>`}
async function open(type='request',root=document.getElementById('v2ModuleRoot')){
  if(!root)return false;
  if(!canView()){global.toast?.('Bu belgeyi görüntüleme yetkiniz yok.');return false}
  await prepareLocal();
  const response=type==='response',okul=schoolInfo();
  root.innerHTML=`<section class=\"ka-stack\" data-personnel-document-page=\"${response?'response':'request'}\"><div><h2>${response?'Diploma Kayıt Örneği — Okul Cevabı':'Diploma Kayıt Örneği Talep Dilekçesi'}</h2><p class=\"ka-muted\">${response?'Resmî okul cevabı belgesini':'Diploma kayıt örneği talep dilekçesini'} mevcut okul bilgileriyle hazırlayın.</p></div><form class=\"ka-card\" data-personnel-document-form><div class=\"ka-card__body ka-stack\">${response?responseForm(okul):requestForm(okul)}</div><div class=\"ka-card__footer\"><button class=\"ka-btn\" type=\"submit\">A4 Önizle / Yazdır</button></div></form></section>`;
  const form=root.querySelector('[data-personnel-document-form]');
  form?.addEventListener('submit',async e=>{e.preventDefault();const b=form.querySelector('button[type=\"submit\"]'),old=b?.textContent;if(b){b.disabled=true;b.textContent='Hazırlanıyor…'}try{await print(response?'response':'request',form)}catch(err){console.error('[PersonnelDocuments]',err);global.toast?.('Belge önizlemesi açılamadı: '+(err?.message||err))}finally{if(b){b.disabled=false;b.textContent=old}}});
  global.PermissionService?.apply?.(root);
  return true;
}
"""
          new=r'''const drafts={request:Object.create(null),response:Object.create(null)};
function section(icon,title,help,body){return `<section class="ka-card"><div class="ka-card__header"><div class="ka-row"><span class="ka-avatar" aria-hidden="true">${icon}</span><div><h3>${esc(title)}</h3><p class="ka-muted">${esc(help)}</p></div></div></div><div class="ka-card__body ka-stack">${body}</div></section>`}
function requestForm(okul){
  const kisi=`<div class="ka-grid"><label class="ka-field"><span class="ka-field__label">Adı ve Soyadı</span><input name="adSoyad" autocomplete="name" autocapitalize="words" enterkeyhint="next"></label><label class="ka-field"><span class="ka-field__label">T.C. Kimlik No</span><input name="tc" maxlength="11" inputmode="numeric" autocomplete="off" enterkeyhint="next"></label></div><div class="ka-grid"><label class="ka-field"><span class="ka-field__label">Baba Adı</span><input name="babaAdi" autocapitalize="words" enterkeyhint="next"></label><label class="ka-field"><span class="ka-field__label">Anne Adı</span><input name="anneAdi" autocapitalize="words" enterkeyhint="next"></label></div><label class="ka-field"><span class="ka-field__label">Doğum Yeri</span><input name="dogumYeri" placeholder="Örn: Koruk – Merkez/Elazığ" autocapitalize="words" enterkeyhint="next"></label><label class="ka-field"><span class="ka-field__label">Doğum Tarihi</span><input name="dogumTarihi" type="date"></label>`;
  const diploma=`<div class="ka-grid"><label class="ka-field"><span class="ka-field__label">Mezuniyet Tarihi</span><input name="mezuniyetTarihi" type="date"></label><label class="ka-field"><span class="ka-field__label">Mezun Olduğu Sınıf</span><input name="mezunSinif" placeholder="Örn: 5. Sınıf" enterkeyhint="next"></label></div>`;
  const iletisim=`<label class="ka-field"><span class="ka-field__label">Adres</span><textarea name="adres" rows="3" autocomplete="street-address" autocapitalize="sentences" enterkeyhint="done"></textarea></label>`;
  const okulBilgisi=`<details class="ka-card"><summary class="ka-card__header"><strong>Belge / Okul Bilgileri</strong><p class="ka-muted">Okul ayarlarından otomatik doldurulur; gerekirse değiştirilebilir.</p></summary><div class="ka-card__body ka-stack"><label class="ka-field"><span class="ka-field__label">Okul Adı</span><input name="okulAdi" value="${esc(okul.okulAdi||'')}"></label></div></details>`;
  return section('👤','Kişi Bilgileri','Dilekçe sahibinin kimlik ve doğum bilgileri.',kisi)+section('🎓','Mezuniyet Bilgileri','Mezuniyet tarihini ve sınıf bilgisini girin.',diploma)+section('📍','İletişim','Dilekçede gösterilecek adres bilgisi.',iletisim)+okulBilgisi;
}
function responseForm(okul){
  const kisi=`<div class="ka-grid"><label class="ka-field"><span class="ka-field__label">Adı ve Soyadı</span><input name="adSoyad" autocomplete="name" autocapitalize="words" enterkeyhint="next"></label><label class="ka-field"><span class="ka-field__label">T.C. Kimlik No</span><input name="tc" maxlength="11" inputmode="numeric" autocomplete="off" enterkeyhint="next"></label></div><div class="ka-grid"><label class="ka-field"><span class="ka-field__label">Baba Adı</span><input name="babaAdi" autocapitalize="words" enterkeyhint="next"></label><label class="ka-field"><span class="ka-field__label">Kız/Oğul</span><select name="kizOglu"><option value="kızı">kızı</option><option value="oğlu">oğlu</option></select></label></div><label class="ka-field"><span class="ka-field__label">Doğum Tarihi</span><input name="dogumTarihi" type="date"></label>`;
  const diploma=`<div class="ka-grid"><label class="ka-field"><span class="ka-field__label">Öğrenim Süresi (yıl)</span><input name="ogrenimSuresi" type="number" min="1" max="12" inputmode="numeric" enterkeyhint="next"></label><label class="ka-field"><span class="ka-field__label">Diploma Tarihi</span><input name="diplomaTarihi" type="date"></label></div><label class="ka-field"><span class="ka-field__label">Diploma Sayısı</span><input name="diplomaSayisi" enterkeyhint="next"></label>`;
  const iletisim=`<label class="ka-field"><span class="ka-field__label">Adres</span><textarea name="adres" rows="3" autocomplete="street-address" autocapitalize="sentences"></textarea></label><label class="ka-field"><span class="ka-field__label">Cep No</span><input name="cepNo" inputmode="tel" autocomplete="tel" placeholder="05xx xxx xx xx" enterkeyhint="done"></label>`;
  const okulBilgisi=`<details class="ka-card"><summary class="ka-card__header"><strong>Belge / Okul Bilgileri</strong><p class="ka-muted">Müdür ve okul adı mevcut okul ayarlarından otomatik gelir.</p></summary><div class="ka-card__body ka-stack"><label class="ka-field"><span class="ka-field__label">Okul Müdürü Adı Soyadı</span><input name="mudurAdi" value="${esc(principalName())}" autocapitalize="words"></label><label class="ka-field"><span class="ka-field__label">Okul Adı</span><input name="okulAdi" value="${esc(okul.okulAdi||'')}"></label></div></details>`;
  return section('👤','Kişi Bilgileri','Diploma kayıt örneği hazırlanacak kişinin bilgileri.',kisi)+section('🎓','Diploma Bilgileri','Diploma tarihi, sayısı ve öğrenim süresini girin.',diploma)+section('📍','İletişim ve Onay','Belgede yer alacak adres ve telefon bilgileri.',iletisim)+okulBilgisi;
}
function restoreDraft(pageKey,form){const draft=drafts[pageKey]||{};form?.querySelectorAll?.('[name]')?.forEach(el=>{if(Object.prototype.hasOwnProperty.call(draft,el.name))el.value=draft[el.name]})}
function bindForm(pageKey,form){
  if(!form||form.dataset.personnelDocumentBound==='true')return;
  form.dataset.personnelDocumentBound='true';
  const sync=e=>{const target=e.target;if(target?.name)drafts[pageKey][target.name]=target.value;e.stopPropagation()};
  form.addEventListener('input',sync);
  form.addEventListener('change',sync);
  form.addEventListener('submit',async e=>{e.preventDefault();const b=form.querySelector('button[type="submit"]'),old=b?.textContent;if(b){b.disabled=true;b.textContent='Hazırlanıyor…'}try{await print(pageKey,form)}catch(err){console.error('[PersonnelDocuments]',err);global.toast?.('Belge önizlemesi açılamadı: '+(err?.message||err))}finally{if(b){b.disabled=false;b.textContent=old}}});
}
async function open(type='request',root=document.getElementById('v2ModuleRoot')){
  if(!root)return false;
  if(!canView()){global.toast?.('Bu belgeyi görüntüleme yetkiniz yok.');return false}
  const pageKey=type==='response'?'response':'request';
  const existing=root.querySelector?.(`[data-personnel-document-page="${pageKey}"]`);
  if(existing?.querySelector?.('[data-personnel-document-form]'))return true;
  await prepareLocal();
  const response=pageKey==='response',okul=schoolInfo(),title=response?'Diploma Okul Dilekçesi':'Diploma Kayıt Talep Dilekçesi',subtitle=response?'Resmî okul cevabını hızlıca hazırlayın.':'Diploma kayıt örneği talep dilekçesini hazırlayın.';
  root.innerHTML=`<section class="ka-stack ka-home" data-personnel-document-page="${pageKey}"><div class="ka-plan-hero"><div><span class="ka-plan-hero__icon" aria-hidden="true">🎓</span><div><span class="ka-badge">DİPLOMA İŞLEMLERİ</span><h2>${title}</h2><p>${subtitle} Alanlar yazarken yeniden çizilmez; bilgileriniz ekranda korunur.</p></div></div></div><form class="ka-stack" data-personnel-document-form autocomplete="on">${response?responseForm(okul):requestForm(okul)}<section class="ka-card"><div class="ka-card__body ka-stack"><div><strong>Belgeyi oluştur</strong><p class="ka-muted">Bilgileri kontrol edin ve A4 önizlemeyi açın.</p></div><button class="ka-btn ka-btn--lg" type="submit">A4 Önizle / Yazdır</button></div></section></form></section>`;
  const form=root.querySelector('[data-personnel-document-form]');
  restoreDraft(pageKey,form);
  bindForm(pageKey,form);
  global.PermissionService?.apply?.(root);
  return true;
}
'''
          if old not in s:
              raise SystemExit('Diploma form marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          t=Path('tests/payroll-change-v2-smoke.test.js')
          ts=t.read_text(encoding='utf-8')
          anchor="assert(personnelDocs.includes('ReportEngine.printReport(title,body'),'Diploma çıktıları merkezi ReportEngine kullanmalı.');"
          addition="""
assert(personnelDocs.includes('const existing=root.querySelector?.(`[data-personnel-document-page=\"${pageKey}\"]`)'),'Aynı diploma sayfası yeniden açıldığında form DOM\'u korunmalı; klavye odağı düşmemeli.');
assert(personnelDocs.includes("form.addEventListener('input',sync)")&&personnelDocs.includes('drafts[pageKey][target.name]=target.value'),'Diploma formu input sırasında yalnız draft güncellemeli; yeniden render etmemeli.');
for(const text of ['Kişi Bilgileri','Diploma Bilgileri','İletişim ve Onay','Belge / Okul Bilgileri','Diploma Okul Dilekçesi']) assert(personnelDocs.includes(text),`Diploma yeniden tasarım bölümü eksik: ${text}`);
assert(personnelDocs.includes('textarea name=\"adres\"'),'Adres alanı mobil kullanım için çok satırlı olmalı.');
assert(sw.includes("const CACHE_ADI='oy-cache-v848';"),'Diploma form güncellemesi cache v848 ile dağıtılmalı.');
"""
          if anchor not in ts:
              raise SystemExit('Diploma test anchor not found')
          ts=ts.replace(anchor,anchor+addition,1)
          t.write_text(ts,encoding='utf-8')

          sw=Path('service-worker.js')
          ws=sw.read_text(encoding='utf-8')
          if "const CACHE_ADI='oy-cache-v847';" not in ws:
              raise SystemExit('cache marker not found')
          sw.write_text(ws.replace("const CACHE_ADI='oy-cache-v847';","const CACHE_ADI='oy-cache-v848';",1),encoding='utf-8')
      - name: Validate diploma package
        run: |
          node --check js/modules/personnel-documents.js
          node tests/payroll-change-v2-smoke.test.js
          node tests/management-separate-pages.test.js
          node tests/modules-local-first-boundary.test.js
      - name: Commit diploma redesign
        run: |
          git config user.name sedonet23
          git config user.email sedonet23@gmail.com
          git add js/modules/personnel-documents.js tests/payroll-change-v2-smoke.test.js service-worker.js
          git commit -m "fix: redesign diploma form and preserve keyboard focus"
          git push origin HEAD:main
