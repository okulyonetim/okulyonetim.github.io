name: Poll Voter Details Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-poll-voter-details.mjs'
      - '.github/workflows/poll-voter-details-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded poll voter migration
        run: node scripts/migrate-poll-voter-details.mjs
      - name: Verify communication and architecture
        run: |
          node tests/communication-admin-actions.test.js
          node tests/communication-local-first-contract.test.js
          node scripts/build-client-bundles.mjs
          node scripts/check-client-architecture.mjs
      - name: Commit production migration and cleanup
        run: |
          rm scripts/migrate-poll-voter-details.mjs .github/workflows/poll-voter-details-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/communication.js scripts/migrate-poll-voter-details.mjs .github/workflows/poll-voter-details-migration.yml
          git commit -m 'feat(polls): restore admin voter details'
          git push
