name: Performance Leaflet Patch
permissions:
  contents: write
on:
  push:
    branches: [agent/performance-lazy-leaflet]
    paths: ['.github/workflows/perf-leaflet-patch.yml']

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-lazy-leaflet
      - name: Leaflet kullanım anına taşı
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Loader ana modül zincirinde küçük bir yerel script olarak bulunur.
          p=Path('js/akademik-takvim.js'); s=p.read_text()
          anchor='/* PDF üretiminde kullanılan jsPDF/autoTable/html2canvas ortak lazy loader. */'
          loader="""/* Harita modüllerinde kullanılan Leaflet ortak lazy loader. */\n(function haritaKutuphaneleriniYukle(){\n  if (document.querySelector('script[data-map-libs]')) return;\n  const s = document.createElement('script');\n  s.src = 'js/map-libs.js';\n  s.async = false;\n  s.dataset.mapLibs = '1';\n  document.head.appendChild(s);\n})();\n\n"""+anchor
          assert anchor in s
          p.write_text(s.replace(anchor,loader,1))

          # Ana Harita ekranı Leaflet'i yalnız ilk açılışta bekler.
          p=Path('js/harita.js'); s=p.read_text()
          old="""function haritaBaslat() {\n  if (haritaBaslatildi) {"""
          new="""async function haritaBaslat() {\n  if (haritaBaslatildi) {"""
          assert old in s
          s=s.replace(old,new,1)
          old="""  // Türkiye merkezi\n  haritaOrnek = L.map('haritaKonteyner', { zoomControl: true }).setView([39.0, 35.0], 6);"""
          new="""  try {\n    if (!window.MapLibs) throw new Error('Harita yükleyicisi bulunamadı.');\n    await window.MapLibs.hazir();\n  } catch(e) { toast('Harita bileşeni yüklenemedi: '+e.message); return; }\n  if (haritaBaslatildi) { haritaOrnek && haritaOrnek.invalidateSize(); return; }\n\n  // Türkiye merkezi\n  haritaOrnek = L.map('haritaKonteyner', { zoomControl: true }).setView([39.0, 35.0], 6);"""
          assert old in s
          p.write_text(s.replace(old,new,1))

          # Yönetici konum haritası da aynı loader'ı bekler; filtre map hazır olduktan sonra uygulanır.
          p=Path('js/kullanici-yonetimi.js'); s=p.read_text()
          old=".then(snap => {\n      _konumTumKayitlar = snap.docs.map(d => ({ id: d.id, ...d.data() }));\n      _konumHaritaOlustur();\n      konumFiltreUygula(_konumFiltre);"
          new=".then(async snap => {\n      _konumTumKayitlar = snap.docs.map(d => ({ id: d.id, ...d.data() }));\n      await _konumHaritaOlustur();\n      konumFiltreUygula(_konumFiltre);"
          assert old in s
          s=s.replace(old,new,1)
          old="""function _konumHaritaOlustur(){\n  const kap = document.getElementById('konumHaritaKap');"""
          new="""async function _konumHaritaOlustur(){\n  try {\n    if (!window.MapLibs) throw new Error('Harita yükleyicisi bulunamadı.');\n    await window.MapLibs.hazir();\n  } catch(e) {\n    const kapHata=document.getElementById('konumHaritaKap');\n    if(kapHata) kapHata.innerHTML='<p style=\"padding:16px;color:var(--ink-muted);\">Harita yüklenemedi: '+e.message+'</p>';\n    return;\n  }\n  const kap = document.getElementById('konumHaritaKap');"""
          assert old in s
          p.write_text(s.replace(old,new,1))

          # Leaflet JS+CSS artık ilk açılışta parser/render bloklamaz.
          p=Path('index.html'); s=p.read_text()
          tags=[
            '<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">\n',
            '<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>\n',
          ]
          for tag in tags:
            assert tag in s, tag
            s=s.replace(tag,'',1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/akademik-takvim.js js/harita.js js/kullanici-yonetimi.js
          git commit -m "Leaflet kütüphanesini harita açılışında lazy-load yap"
          git push origin HEAD:agent/performance-lazy-leaflet
