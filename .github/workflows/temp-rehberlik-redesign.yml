name: Temporary Rehberlik Redesign
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rehberlik-redesign.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Rehberlik canonical redesign
        run: python3 scripts/temp-rehberlik-redesign.py
      - name: Verify Rehberlik and architecture contracts
        run: |
          node --check js/modules/rubric-settings.js
          node tests/rehberlik-page-redesign.test.js
          node tests/teacher-grouped-period-visible-parity.test.js
          node tests/tools-separate-pages.test.js
          node tests/cizelge-report-detail-visible-parity.test.js
          node tests/maarif-matrix-visible-parity.test.js
          node tests/social-club-class-quick-select-parity.test.js
          node tests/rubric-settings-v2-smoke.test.js
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit canonical changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/rubric-settings.js css/design-system.css tests/rehberlik-page-redesign.test.js service-worker.js
          git commit -m 'feat: redesign Rehberlik page responsively'
          git push origin main
