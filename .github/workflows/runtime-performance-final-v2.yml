name: Runtime Performance Final V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-performance-final-v2.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify expected parent
        run: test "$(git rev-parse HEAD^)" = 'd0bdbf3917700e7bb35ab5a4088b9cc9eeebe70b'
      - name: Apply patch
        run: python3 scripts/tmp-runtime-performance-final.py
      - name: Build client bundles
        run: npm run build:client
      - name: Check syntax
        run: |
          node --check js/core/core.js
          node --check js/modules/dashboard.js
          node --check service-worker.js
      - name: Run all tests
        run: |
          set -euo pipefail
          for f in tests/*.test.js; do
            echo "--- $f"
            node "$f"
          done
      - name: Audit architecture
        run: npm run audit:client
      - name: Commit and cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/runtime-performance-pass.yml \
            .github/workflows/runtime-performance-pass-v2.yml \
            .github/workflows/runtime-performance-pass-v3.yml \
            .github/workflows/runtime-performance-pass-v4.yml \
            .github/workflows/runtime-performance-final.yml \
            .github/workflows/runtime-performance-final-v2.yml \
            scripts/tmp-runtime-performance-final.py \
            tests/.tmp-module-contract-error.txt
          git add js/core/core.js css/design-system.css service-worker.js index.html tests scripts/check-client-architecture.mjs
          git commit -m 'perf: speed up local runtime and smooth news ticker'
          git push origin HEAD:main
