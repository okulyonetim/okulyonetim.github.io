name: fix-core-direct3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch
        shell: python
        run: |
          from pathlib import Path
          core=Path('js/core/core.js')
          s=core.read_text(encoding='utf-8')
          old="function remoteTimestamp(row){const v=row?.guncellenmeTarihi||row?.updatedAt||row?.updated_at||row?.createdAt||row?.created_at;if(v==null)return 0;if(typeof v==='number')return v;try{const d=v?.toDate?v.toDate():new Date(v);const n=d.getTime();return Number.isFinite(n)?n:0}catch(_){return 0}}"
          helper="function remoteTimestamp(row){const v=row?.guncellenmeTarihi||row?.updatedAt||row?.updated_at||row?.createdAt||row?.created_at;if(v==null)return 0;if(typeof v==='number')return v;try{const d=v?.toDate?v.toDate():new Date(v);const n=d.getTime();return Number.isFinite(n)?n:0}catch(_){return 0}}\nfunction timestampValue(v){if(v==null)return 0;if(typeof v==='number')return Number.isFinite(v)?v:0;try{const d=v?.toDate?v.toDate():new Date(v);const n=d.getTime();return Number.isFinite(n)?n:0}catch(_){return 0}}"
          if 'function timestampValue(v)' not in s:
              if old not in s: raise SystemExit('remoteTimestamp exact text not found')
              s=s.replace(old,helper,1)
          core.write_text(s,encoding='utf-8')
          idx=Path('index.html'); h=idx.read_text(encoding='utf-8'); import re; h=re.sub(r'js/core/core\\.js\\?v=\\d+','js/core/core.js?v=1039',h,count=1); idx.write_text(h,encoding='utf-8')
          sw=Path('service-worker.js'); w=sw.read_text(encoding='utf-8'); w=re.sub(r"const CACHE_ADI='oy-cache-v\\d+';","const CACHE_ADI='oy-cache-v1236';",w,count=1); w=w.replace('./js/core/core.js?v=1037','./js/core/core.js?v=1039',1); sw.write_text(w,encoding='utf-8')
          for name in ['fix-core-direct.yml','fix-first-login-timestamp.yml','fix-core-direct2.yml','fix-core-direct3.yml']:
              Path('.github/workflows',name).unlink(missing_ok=True)
      - name: Verify and commit
        shell: bash
        run: |
          set -e
          node --check js/core/core.js
          grep -q "function timestampValue(v)" js/core/core.js
          grep -q "core.js?v=1039" index.html
          grep -q "core.js?v=1039" service-worker.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/core.js index.html service-worker.js .github/workflows
          git commit -m 'Fix first-login Firestore sync'
          git push origin main
