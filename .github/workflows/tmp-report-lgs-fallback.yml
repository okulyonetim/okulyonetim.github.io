name: Apply report LGS fallback
on:
  push:
    branches:
      - fix/report-lgs-fallback-20260912
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply focused patch
        run: python scripts/tmp-fix-report-lgs-fallback.py
      - name: Focused tests
        run: |
          node tests/exam-lgs-result-ranking.test.js
          node tests/exam-lgs-report-fallback-fixture.test.js
          node tests/academic-separate-pages.test.js
      - name: Full client regression
        run: node scripts/run-client-tests.mjs
      - name: Architecture audit
        run: node scripts/audit-client-architecture.mjs
      - name: Diff sanity
        run: git diff --check
      - name: Commit clean target diff
        run: |
          rm -f scripts/tmp-fix-report-lgs-fallback.py .github/workflows/tmp-report-lgs-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: calculate missing LGS score in trial report"
          git push origin HEAD:fix/report-lgs-fallback-20260912
