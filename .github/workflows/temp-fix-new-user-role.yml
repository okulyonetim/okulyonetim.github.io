name: Temporary user creation fix
on:
  push:
    branches: [fix/new-user-role-reference]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/new-user-role-reference
      - name: Fix role variable reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/auth.js')
          s=p.read_text()
          old="adminYeniKullaniciOlustur(username,pw,{ad:teacher?`${teacher.ad||''} ${teacher.soyad||''}`.trim():username,rolId,bagliOgretmenId:teacherId"
          new="adminYeniKullaniciOlustur(username,pw,{ad:teacher?`${teacher.ad||''} ${teacher.soyad||''}`.trim():username,rolId:roleId,bagliOgretmenId:teacherId"
          assert old in s, 'target not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/auth.js
          git commit -m "fix: correct role reference when creating user"
          git push origin HEAD:fix/new-user-role-reference
