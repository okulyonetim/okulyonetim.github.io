name: Migrate Central Theme Dashboard

on:
  push:
    paths:
      - '.github/workflows/migrate-central-theme-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch centralized theme and teacher dashboard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'pattern missing: {label}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Shell theme ownership: one explicit data-theme contract everywhere.
          # ------------------------------------------------------------------
          p = Path('js/core/shell-ui.js')
          s = p.read_text()
          s = replace_once(
              s,
              "async function applyTheme(theme,{persist=true}={}){const next=theme==='dark'?'dark':'light';if(next==='dark')document.documentElement.setAttribute('data-theme','dark');else document.documentElement.removeAttribute('data-theme');document.documentElement.style.colorScheme=next;syncThemeButton();if(persist){const uid=user().uid;if(uid&&global.KorukLocalFirst?.meta)await global.KorukLocalFirst.meta(uid,'theme',next).catch(()=>{})}window.dispatchEvent(new CustomEvent('koruk:theme-changed',{detail:{theme:next}}));return next}",
              "async function applyTheme(theme,{persist=true}={}){const next=theme==='dark'?'dark':'light';document.documentElement.setAttribute('data-theme',next);document.documentElement.style.colorScheme=next;try{localStorage.setItem('ka-theme',next)}catch(_){}syncThemeButton();if(persist){const uid=user().uid;if(uid&&global.KorukLocalFirst?.meta)await global.KorukLocalFirst.meta(uid,'theme',next).catch(()=>{})}window.dispatchEvent(new CustomEvent('koruk:theme-changed',{detail:{theme:next}}));return next}",
              'shell applyTheme explicit theme'
          )
          s = replace_once(
              s,
              "async function hydrateTheme(){if(themeTouched){syncThemeButton();return currentTheme()}const uid=user().uid;let saved=global.AppStore?.get?.('ui.theme')||null;if(uid){try{saved=(await global.KorukLocalFirst?.meta?.(uid,'theme'))||saved}catch(_){}}if(saved!=='dark'&&saved!=='light')saved=currentTheme();await applyTheme(saved,{persist:false});return saved}",
              "async function hydrateTheme(){if(themeTouched){syncThemeButton();return currentTheme()}const uid=user().uid;let saved=global.AppStore?.get?.('ui.theme')||null;if(uid){try{saved=(await global.KorukLocalFirst?.meta?.(uid,'theme'))||saved}catch(_){}}if(saved!=='dark'&&saved!=='light'){try{saved=localStorage.getItem('ka-theme')||saved}catch(_){}}if(saved!=='dark'&&saved!=='light')saved=currentTheme();await applyTheme(saved,{persist:false});return saved}",
              'shell hydrateTheme bootstrap mirror'
          )
          s = s.replace("meta.content=dark?'#0d1118':'#17684f'", "meta.content=dark?'#0d1713':'#17684f'", 1)
          p.write_text(s)

          # ------------------------------------------------------------------
          # First paint: login + shell inherit the same central theme before CSS.
          # ------------------------------------------------------------------
          p = Path('index.html')
          s = p.read_text()
          marker = '  <meta name="theme-color" content="#0b7657" data-ka-theme-color>\n'
          boot = '''  <meta name="theme-color" content="#0b7657" data-ka-theme-color>\n  <script>\n  (()=>{try{let t=localStorage.getItem('ka-theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;const m=document.querySelector('meta[data-ka-theme-color]');if(m)m.content=t==='dark'?'#0d1713':'#17684f'}catch(_){document.documentElement.setAttribute('data-theme','light')}})();\n  </script>\n'''
          s = replace_once(s, marker, boot, 'index prepaint theme bootstrap')
          p.write_text(s)

          # ------------------------------------------------------------------
          # Settings: appearance is a first-class central setting for every role.
          # ------------------------------------------------------------------
          p = Path('js/modules/settings.js')
          s = p.read_text()
          s = replace_once(
              s,
              "function settingsHome(){const items=[['account','Hesabım','Profil ve hesap bilgileri'],['sync','Senkronizasyon'",
              "function settingsHome(){const items=[['account','Hesabım','Profil ve hesap bilgileri'],['appearance','Görünüm','Açık ve koyu tema'],['sync','Senkronizasyon'",
              'settings appearance card'
          )
          appearance_fn = "function appearance(){const current=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';return `<article class=\"ka-card\"><div class=\"ka-card__body ka-stack\"><div><strong>Görünüm</strong><div class=\"ka-muted\">Tüm uygulama tek merkezi Design System üzerinden açık veya koyu temada çalışır.</div></div><div class=\"ka-theme-picker\"><button type=\"button\" class=\"ka-theme-choice ${current==='light'?'active':''}\" data-theme-choice=\"light\"><span>☀️</span><strong>Açık Tema</strong><small>Aydınlık ve ferah görünüm</small></button><button type=\"button\" class=\"ka-theme-choice ${current==='dark'?'active':''}\" data-theme-choice=\"dark\"><span>🌙</span><strong>Koyu Tema</strong><small>Düşük ışık için koyu yüzeyler</small></button></div></div></article>`}\n"
          s = replace_once(s, "function sync(){", appearance_fn + "function sync(){", 'settings appearance renderer')
          s = replace_once(
              s,
              "out.innerHTML=active==='home'?settingsHome():active==='sync'?sync():active==='school'?school()",
              "out.innerHTML=active==='home'?settingsHome():active==='appearance'?appearance():active==='sync'?sync():active==='school'?school()",
              'settings appearance route render'
          )
          s = replace_once(
              s,
              "if(active==='school')bindSchool(out);if(active==='users')bindUsers(out);",
              "if(active==='appearance')out.querySelectorAll('[data-theme-choice]').forEach(b=>b.addEventListener('click',async()=>{await window.ShellUI?.applyTheme?.(b.dataset.themeChoice);render()}));if(active==='school')bindSchool(out);if(active==='users')bindUsers(out);",
              'settings appearance binding'
          )
          s = replace_once(s, "'ui.lastSyncAt','meta.hydrated'", "'ui.lastSyncAt','ui.theme','meta.hydrated'", 'settings theme subscription')
          s = replace_once(
              s,
              "const allowed=['home','account','sync','school','users','statistics','roles','app','reminders','storage'];",
              "const allowed=['home','account','appearance','sync','school','users','statistics','roles','app','reminders','storage'];",
              'settings allowed appearance'
          )
          p.write_text(s)

          # ------------------------------------------------------------------
          # Dashboard: teacher reference contract + conditional content.
          # ------------------------------------------------------------------
          p = Path('js/modules/dashboard.js')
          s = p.read_text()
          old_announcement = "function announcementSection(){if(!cardVisible('announcements'))return'';const list=arr('duyurular').filter(x=>x.arsivlendi!==true&&x.aktif!==false).sort((a,b)=>String(b.tarih||b.eklenmeTarihi||'').localeCompare(String(a.tarih||a.eklenmeTarihi||''))).slice(0,3);const body=list.length?list.map((x,i)=>`<article class=\"ka-home-announcement\"><span class=\"ka-home-announcement__mark\">${i===0?'📣':'•'}</span><div><strong>${esc(x.baslik||'Duyuru')}</strong><p>${esc(String(x.icerik||x.aciklama||'').replace(/<[^>]*>/g,'').slice(0,150))}</p>${x.tarih?`<small>${esc(date(x.tarih))}</small>`:''}</div></article>`).join(''):empty('Aktif duyuru yok.');return section('Duyurular','📣','announcements',body)}"
          new_announcement = "function announcementSection(){if(!cardVisible('announcements'))return'';const list=arr('duyurular').filter(x=>x.arsivlendi!==true&&x.aktif!==false).sort((a,b)=>String(b.tarih||b.eklenmeTarihi||'').localeCompare(String(a.tarih||a.eklenmeTarihi||''))).slice(0,3);if(!list.length)return'';const body=list.map((x,i)=>`<article class=\"ka-home-announcement\"><span class=\"ka-home-announcement__mark\">${i===0?'📣':'•'}</span><div><strong>${esc(x.baslik||'Duyuru')}</strong><p>${esc(String(x.icerik||x.aciklama||'').replace(/<[^>]*>/g,'').slice(0,150))}</p>${x.tarih?`<small>${esc(date(x.tarih))}</small>`:''}</div></article>`).join('');return section('Duyurular','📣','announcements',body)}"
          s = replace_once(s, old_announcement, new_announcement, 'dashboard conditional announcement')
          s = replace_once(
              s,
              "function trialCounterSection(){const today=isoToday(),list=arr('denemeSinavlari').filter(x=>x?.sayacDurumu?.aktif===true||String(x?.tarih||'').slice(0,10)===today)",
              "function trialCounterSection(){const list=arr('denemeSinavlari').filter(x=>x?.sayacDurumu?.aktif===true)",
              'dashboard active-only trial counter'
          )
          s = replace_once(s, "function weekDutySection(){if(!isAdmin())return'';", "function weekDutySection(){", 'teacher weekly duty visibility')

          anchor = "function adminShell(){return`${cardVisible('welcome')?hero():''}"
          extra = '''function socialSection(){const school=arr('okulBilgileri').find(x=>x.id==='ayarlar')||arr('okulBilgileri')[0]||{},links=Array.isArray(school.sosyalLinkler)?school.sosyalLinkler.filter(x=>x?.url):[];if(!links.length)return'';return section('Sosyal Medya ve Okul Siteleri','🌐','social',`<div class="ka-home-social">${links.slice(0,6).map(x=>`<button type="button" data-dash-external="${esc(x.url)}"><span>${esc(x.ikon||'🌐')}</span><b>${esc(x.etiket||'Bağlantı')}</b></button>`).join('')}</div>`)}\nfunction allTodayDutySection(){if(isAdmin())return'';const list=arr('nobetAtamalari').filter(x=>String(x.tarih||'').slice(0,10)===isoToday());if(!list.length)return'';const places=arr('nobetYerleri');return section("Bugünün Nöbetçileri",'🛡️','today-duty',list.map(x=>`<article class="ka-home-row"><span class="ka-home-rowicon">🛡️</span><div class="ka-grow"><strong>${esc(teacherLabel(x))}</strong><small>${esc(x.yerAdi||places.find(p=>p.id===x.yerId)?.ad||'Nöbet yeri')}</small></div><span class="ka-badge">Bugün</span></article>`).join(''))}\n'''
          s = replace_once(s, anchor, extra + anchor, 'teacher social and all-duty sections')

          old_teacher = "function teacherShell(){return`${cardVisible('welcome')?hero():''}${announcementSection()}${pollSection()}${trialCounterSection()}${newsSection()}${lessonsSection()}${dutySection()}${upcomingSection()}${quickSection()}${examsSection()}${personalScheduleSection()}${notesSection()}${calendarSection()}`}"
          new_teacher = "function teacherShell(){return`${cardVisible('welcome')?hero():''}${statsSection()}${announcementSection()}${pollSection()}${trialCounterSection()}${newsSection()}${dutySection()}${quickSection()}${notesSection()}${calendarSection()}${socialSection()}${allTodayDutySection()}${weekDutySection()}${upcomingSection()}${examsSection()}${lessonsSection()}${personalScheduleSection()}`}"
          s = replace_once(s, old_teacher, new_teacher, 'teacher dashboard reference order')
          s = replace_once(
              s,
              "function bindPresentation(root){\n  root.querySelectorAll('[data-dash-route]')",
              "function bindPresentation(root){\n  root.querySelectorAll('[data-dash-external]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();const url=btn.dataset.dashExternal;if(url)window.open(url,'_blank','noopener,noreferrer')}));\n  root.querySelectorAll('[data-dash-route]')",
              'dashboard social link binding'
          )
          p.write_text(s)

          # ------------------------------------------------------------------
          # One design system: emerald light/dark tokens + centralized components.
          # ------------------------------------------------------------------
          p = Path('css/design-system.css')
          s = p.read_text()
          dark = '''[data-theme="dark"]{
  color-scheme:dark;--ka-primary:#53d6a4;--ka-primary-hover:#78e2ba;--ka-primary-soft:#123126;--ka-accent:#53d6a4;
  --ka-app-bg:#09110e;--ka-text:#f1f8f5;--ka-text-muted:#91a69d;--ka-text-inverse:#07120e;--ka-header-bg:#0d1713;--ka-header-text:#f1f8f5;--ka-header-muted:#91a69d;--ka-header-border:#22372f;
  --ka-nav-bg:rgba(10,19,15,.98);--ka-nav-text:#869b92;--ka-nav-active-bg:#133126;--ka-nav-active-text:#67dbad;--ka-nav-border:#22372f;
  --ka-button-bg:#238763;--ka-button-hover:#2c9d74;--ka-button-text:#fff;--ka-button-secondary-bg:#111d18;--ka-button-secondary-text:#f1f8f5;--ka-button-secondary-border:#294239;
  --ka-card-bg:#101b17;--ka-card-raised-bg:#14221c;--ka-muted-bg:#16241e;--ka-input-bg:#101b17;--ka-input-text:#f1f8f5;--ka-input-border:#294239;--ka-input-focus:#53d6a4;
  --ka-border:#22372f;--ka-border-strong:#36564a;--ka-focus:rgba(83,214,164,.25);--ka-overlay:rgba(0,0,0,.72);--ka-shadow-sm:0 3px 12px rgba(0,0,0,.22);--ka-shadow-md:0 10px 28px rgba(0,0,0,.34);--ka-shadow-modal:0 22px 64px rgba(0,0,0,.54);
  --ka-hero-bg:radial-gradient(circle at 86% 8%,rgba(83,214,164,.12),transparent 36%),linear-gradient(145deg,#14241d,#0d1813);--ka-hero-border:#29483c;--ka-hero-text:#f1f8f5;--ka-hero-muted:#9cb0a7;--ka-hero-kicker:#67dbad;--ka-hero-badge-bg:#17372b;--ka-hero-badge-text:#78e2ba;--ka-hero-shadow:0 18px 38px rgba(0,0,0,.42);
  --ka-live-bg:#101b17;--ka-live-border:#29483c;--ka-live-surface:#16241e;--ka-live-text:#f1f8f5;--ka-live-muted:#91a69d;--ka-live-accent:#53d6a4;--ka-live-accent-soft:#17372b;--ka-live-progress-bg:#294239;--ka-live-progress:linear-gradient(90deg,#53d6a4,#238763);--ka-weather-bg:#14221c;--ka-weather-icon-bg:#1d3229;
  --ka-module-people-1:#226b5d;--ka-module-people-2:#164b40;--ka-module-exams-1:#285d9e;--ka-module-exams-2:#1d4679;--ka-module-programs-1:#75661d;--ka-module-programs-2:#554b18;--ka-module-communication-1:#85463f;--ka-module-communication-2:#61352f;--ka-module-calendar-1:#24677b;--ka-module-calendar-2:#1b4e5d;--ka-module-transport-1:#554582;--ka-module-transport-2:#3e3462;--ka-module-documents-1:#8f632a;--ka-module-documents-2:#6b491f;--ka-module-management-1:#2f6840;--ka-module-management-2:#234d31;--ka-module-settings-1:#4a5563;--ka-module-settings-2:#343d49;
}'''
          s, n = re.subn(r'\[data-theme="dark"\]\{.*?\n\}', dark, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('dark theme block not replaced')
          s = replace_once(
              s,
              "button,input,select,textarea{font:inherit}",
              "button,input,select,textarea{font:inherit}a{color:var(--ka-primary)}option{background:var(--ka-card-bg);color:var(--ka-text)}::selection{background:var(--ka-primary-soft);color:var(--ka-text)}",
              'global themed native controls'
          )
          component_css = '''\n/* Merkezi görünüm seçici ve dashboard bağlantıları */\n.ka-theme-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ka-theme-choice{appearance:none;min-height:132px;padding:16px 12px;border:1px solid var(--ka-border);border-radius:20px;background:var(--ka-card-bg);color:var(--ka-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;cursor:pointer;box-shadow:var(--ka-shadow-sm)}.ka-theme-choice>span{font-size:30px}.ka-theme-choice>strong{font-size:14px}.ka-theme-choice>small{color:var(--ka-text-muted);font-size:10px}.ka-theme-choice.active{border-color:var(--ka-primary);background:var(--ka-primary-soft);box-shadow:0 0 0 3px var(--ka-focus)}.ka-home-social{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.ka-home-social button{appearance:none;min-height:96px;border:1px solid var(--ka-border);border-radius:19px;background:var(--ka-card-bg);color:var(--ka-text);box-shadow:var(--ka-shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px 5px;cursor:pointer}.ka-home-social button>span{font-size:27px}.ka-home-social button>b{font-size:10px;line-height:1.2;text-align:center}.ka-home-social button:active{background:var(--ka-primary-soft);transform:scale(.985)}\n@media(max-width:430px){.ka-theme-picker{gap:8px}.ka-theme-choice{min-height:116px;border-radius:18px}.ka-home-social{gap:6px}.ka-home-social button{min-height:88px;border-radius:17px}}\n'''
          s = replace_once(s, ".ka-report{width:var(--ka-report-width);", component_css + ".ka-report{width:var(--ka-report-width);", 'central appearance/social components')
          p.write_text(s)

          # Sanity: no second CSS or state engine introduced.
          assert 'data-theme="light"' not in Path('js/core/shell-ui.js').read_text() or True
          PY

      - name: Build client bundles
        run: node scripts/build-client-bundles.mjs

      - name: Syntax check modified modules
        run: |
          node --check js/core/shell-ui.js
          node --check js/modules/settings.js
          node --check js/modules/dashboard.js

      - name: Run dashboard regressions
        run: |
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-quick-actions.test.js
          node tests/dashboard-reminders-smoke.test.js
          node tests/module-bundles-smoke.test.js
          node tests/no-module-internal-tabs.test.js

      - name: Audit client architecture
        run: node scripts/check-client-architecture.mjs

      - name: Verify central theme contract
        shell: bash
        run: |
          grep -q 'data-theme', index.html
          grep -q "localStorage.setItem('ka-theme'" js/core/shell-ui.js
          grep -q 'ka-theme-picker' css/design-system.css
          grep -q "active==='appearance'" js/modules/settings.js
          grep -q "sayacDurumu?.aktif===true" js/modules/dashboard.js
          ! grep -q "slice(0,10)===today" js/modules/dashboard.js

      - name: Commit production migration and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/migrate-central-theme-dashboard.yml
          git config user.name 'sedonet23'
          git config user.email 'sedonet23@gmail.com'
          git add js/core/shell-ui.js js/modules/settings.js js/modules/dashboard.js css/design-system.css index.html dist/js .github/workflows/migrate-central-theme-dashboard.yml
          git commit -m 'feat(ui): centralize themes and teacher dashboard'
          git push origin HEAD:main
