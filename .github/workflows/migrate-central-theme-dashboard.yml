name: Migrate Central Theme Dashboard

on:
  push:
    paths:
      - '.github/workflows/migrate-central-theme-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply guarded migration
        run: python3 scripts/migrate-central-theme-dashboard.py

      - name: Align teacher dashboard regression with approved reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/dashboard-card-routes-smoke.test.js')
          s=p.read_text()
          old="assert(dash.includes(\"function teacherShell(){return`${cardVisible('welcome')?hero():''}${announcementSection()}${pollSection()}${trialCounterSection()}\"),'Öğretmen ana sayfası aktif anketleri ve deneme sayacını göstermeli.');"
          new="assert(dash.includes(\"function teacherShell(){return`${cardVisible('welcome')?hero():''}${statsSection()}${announcementSection()}${pollSection()}${trialCounterSection()}\"),'Öğretmen ana sayfası referans sırasıyla okul özeti, duyuru, anket ve aktif deneme sayacını göstermeli.');"
          if old not in s: raise SystemExit('teacher dashboard regression pattern missing')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Build client bundles
        run: node scripts/build-client-bundles.mjs

      - name: Syntax check modified modules
        run: |
          node --check js/core/shell-ui.js
          node --check js/modules/settings.js
          node --check js/modules/dashboard.js

      - name: Run dashboard regressions
        run: |
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-quick-actions.test.js
          node tests/dashboard-reminders-smoke.test.js
          node tests/module-bundles-smoke.test.js
          node tests/no-module-internal-tabs.test.js

      - name: Audit client architecture
        run: node scripts/check-client-architecture.mjs

      - name: Verify central theme contract
        run: |
          grep -q 'ka-theme-picker' css/design-system.css
          grep -q "active==='appearance'" js/modules/settings.js
          grep -q "sayacDurumu?.aktif===true" js/modules/dashboard.js
          grep -q 'data-dash-external' js/modules/dashboard.js

      - name: Commit production migration and remove temporary files
        run: |
          rm -f .github/workflows/migrate-central-theme-dashboard.yml scripts/migrate-central-theme-dashboard.py
          git config user.name 'sedonet23'
          git config user.email 'sedonet23@gmail.com'
          git add -A
          git commit -m 'feat(ui): centralize themes and teacher dashboard'
          git push origin HEAD:main
