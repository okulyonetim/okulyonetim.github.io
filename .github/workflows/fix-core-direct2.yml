name: fix-core-direct2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact replacements
        shell: python
        run: |
          from pathlib import Path
          core=Path('js/core/core.js')
          s=core.read_text(encoding='utf-8')
          old="function remoteTimestamp(row){const v=row?.guncellenmeTarihi||row?.updatedAt||row?.updated_at||row?.createdAt||row?.created_at;if(v==null)return 0;if(typeof v==='number')return v;try{const d=v?.toDate?v.toDate():new Date(v);const n=d.getTime();return Number.isFinite(n)?n:0}catch(_){return 0}}"
          helper="""function remoteTimestamp(row){const v=row?.guncellenmeTarihi||row?.updatedAt||row?.updated_at||row?.createdAt||row?.created_at;if(v==null)return 0;if(typeof v==='number')return v;try{const d=v?.toDate?v.toDate():new Date(v);const n=d.getTime();return Number.isFinite(n)?n:0}catch(_){return 0}}
function timestampValue(v){
  if(v==null)return 0;
  if(typeof v==='number')return Number.isFinite(v)?v:0;
  try{
    const d=v?.toDate?v.toDate():new Date(v);
    const n=d.getTime();
    return Number.isFinite(n)?n:0;
  }catch(_){return 0}
}"""
          if 'function timestampValue(v)' not in s:
              if old not in s: raise SystemExit('exact remoteTimestamp text not found')
              s=s.replace(old,helper,1)
          old_batch="async function fetchRemoteBatch(names,{u,lastByType={},forceFull=false}={}){const settled=await Promise.allSettled(names.map(async name=>{const def=registered.get(name);if(!def)return{name,rows:null,delta:false};const result=await fetchCollection(def,{u,lastSync:Number(lastByType[name]||0),forceFull});return{name,rows:result.rows,delta:result.delta}})),fetched={};for(const result of settled){if(result.status==='fulfilled'){const{name,rows,delta}=result.value;if(Array.isArray(rows))fetched[name]={rows,delta}}else console.warn('[SyncEngine]',result.reason?.message||result.reason)}return fetched}"
          new_batch="async function fetchRemoteBatch(names,{u,lastByType={},forceFull=false}={}){const settled=await Promise.allSettled(names.map(async name=>{const def=registered.get(name);if(!def)return{name,rows:null,delta:false};const result=await fetchCollection(def,{u,lastSync:Number(lastByType[name]||0),forceFull});return{name,rows:result.rows,delta:result.delta}})),fetched={},errors=[];for(const result of settled){if(result.status==='fulfilled'){const{name,rows,delta}=result.value;if(Array.isArray(rows))fetched[name]={rows,delta}}else{const message=String(result.reason?.message||result.reason||'sync-error');errors.push(message);console.warn('[SyncEngine]',message)}}if(errors.length&&window.AppStore?.set)AppStore.set('ui.syncError',errors.join(' | '));return fetched}"
          if 'errors=[];for(const result of settled)' not in s:
              if old_batch not in s: raise SystemExit('exact fetchRemoteBatch text not found')
              s=s.replace(old_batch,new_batch,1)
          core.write_text(s,encoding='utf-8')

          idx=Path('index.html'); h=idx.read_text(encoding='utf-8');
          if 'core.js?v=1039' not in h:
              import re; h=re.sub(r'js/core/core\\.js\\?v=\\d+','js/core/core.js?v=1039',h,count=1)
          idx.write_text(h,encoding='utf-8')
          sw=Path('service-worker.js'); w=sw.read_text(encoding='utf-8');
          import re; w=re.sub(r"const CACHE_ADI='oy-cache-v\\d+';","const CACHE_ADI='oy-cache-v1236';",w,count=1); w=w.replace('./js/core/core.js?v=1037','./js/core/core.js?v=1039',1); sw.write_text(w,encoding='utf-8')

          for name in ['fix-core-direct.yml','fix-first-login-timestamp.yml','fix-core-direct2.yml']:
              Path('.github/workflows',name).unlink(missing_ok=True)
      - name: Verify
        run: |
          node --check js/core/core.js
          grep -q "function timestampValue(v)" js/core/core.js
          grep -q "AppStore.set('ui.syncError'" js/core/core.js
          grep -q "core.js?v=1039" index.html
          grep -q "core.js?v=1039" service-worker.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/core.js index.html service-worker.js .github/workflows
          git commit -m 'Fix first-login Firestore sync'
          git push origin main
