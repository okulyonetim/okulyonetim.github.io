name: Apply runtime offline cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Consolidate CSS and optimize offline cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path=Path('css/design-system.css')
          css=css_path.read_text(encoding='utf-8')
          v2='/* ===== DASHBOARD SCHOOL SUMMARY READABILITY V2 ===== */'
          notes='/* ===== NOTES PAGE REDESIGN V2 ===== */'
          v3='/* ===== DASHBOARD SCHOOL SUMMARY READABILITY V3 ===== */'
          assert css.count(v2)==1 and css.count(v3)==1
          start=css.index(v2); end=css.index(notes,start)
          css=css[:start]+css[end:]
          h3='.ka-school-summary-section>.ka-home-section__head h3{font-size:18px}\n'
          card='.ka-school-summary-card{min-height:140px;padding:13px 11px 11px;border-radius:19px}\n'
          icon='.ka-school-summary-section>.ka-home-section__head .ka-home-section__icon{font-size:20px}\n'
          deco='.ka-school-summary-card::after{width:60px;height:60px;right:-19px;top:-19px}\n'
          tail=css[css.index(v3):]
          assert h3 in tail and card in tail
          if icon not in tail: css=css.replace(h3,h3+icon,1)
          if deco not in css[css.index(v3):]: css=css.replace(card,card+deco,1)
          assert v2 not in css
          css_path.write_text(css,encoding='utf-8')

          Path('tests/dashboard-school-summary-readability.test.js').write_text("""const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const css=fs.readFileSync('css/design-system.css','utf8');
          const v2='/* ===== DASHBOARD SCHOOL SUMMARY READABILITY V2 ===== */';
          const v3='/* ===== DASHBOARD SCHOOL SUMMARY READABILITY V3 ===== */';
          test('obsolete school summary css layer is retired',()=>{
            assert.equal(css.includes(v2),false);
            assert.equal((css.match(/DASHBOARD SCHOOL SUMMARY READABILITY V3/g)||[]).length,1);
          });
          test('v3 keeps the visual details formerly inherited from v2',()=>{
            const block=css.slice(css.indexOf(v3));
            assert.match(block,/\\.ka-school-summary-section>\\.ka-home-section__head \\.ka-home-section__icon\\{font-size:20px\\}/);
            assert.match(block,/\\.ka-school-summary-card::after\\{width:60px;height:60px;right:-19px;top:-19px\\}/);
          });
          """.replace('          ','').lstrip(),encoding='utf-8')

          index=Path('index.html'); html=index.read_text(encoding='utf-8')
          assert 'css/design-system.css?v=897' in html
          index.write_text(html.replace('css/design-system.css?v=897','css/design-system.css?v=898'),encoding='utf-8')

          sw_path=Path('service-worker.js'); sw=sw_path.read_text(encoding='utf-8')
          assert "const CACHE_ADI='oy-cache-v899';" in sw
          assert "'./css/design-system.css?v=897'" in sw
          sw=sw.replace("const CACHE_ADI='oy-cache-v899';","const CACHE_ADI='oy-cache-v900';")
          sw=sw.replace("'./css/design-system.css?v=897'","'./css/design-system.css?v=898'")
          marker="];\n\nself.addEventListener('install'"
          assert marker in sw
          dedupe="];\n\n// Sürümlü ve sürümsüz aynı JS/CSS yolunu ilk kurulumda iki kez indirme.\n// İlk görülen URL tutulur; runtime kod cache eşleşmesi query-string'i yok sayar.\nconst ONBELLEGE_TEKIL=ONBELLEGE_ALINACAKLAR.filter((url,index,list)=>{\n  const path=String(url).split('?')[0];\n  return list.findIndex(item=>String(item).split('?')[0]===path)===index;\n});\n\nself.addEventListener('install'"
          sw=sw.replace(marker,dedupe,1)
          sw=sw.replace('ONBELLEGE_ALINACAKLAR.map(url=>cache.add(url)','ONBELLEGE_TEKIL.map(url=>cache.add(url)',1)
          old="const cached=await caches.match(event.request);\n  const yenile=fetch(event.request,{cache:'no-store'})"
          new="const cached=await caches.match(event.request,{ignoreSearch:true});\n  const yenile=fetch(event.request,{cache:'no-store'})"
          assert old in sw
          sw=sw.replace(old,new,1)
          sw_path.write_text(sw,encoding='utf-8')

          sw_test=Path('tests/service-worker-precache-smoke.test.js'); st=sw_test.read_text(encoding='utf-8')
          st=st.replace("assert(sw.includes('caches.match(event.request)'), 'Çevrimdışı cache fallback kullanılmalı.');",
            "assert(sw.includes('caches.match(event.request,{ignoreSearch:true})'), 'JS/CSS cache eşleşmesi sürüm query-stringinden bağımsız olmalı.');\nassert(sw.includes('const ONBELLEGE_TEKIL=ONBELLEGE_ALINACAKLAR.filter'), 'İlk kurulum precache listesi aynı fiziksel yolu tekilleştirmeli.');\nassert(sw.includes('ONBELLEGE_TEKIL.map(url=>cache.add(url)'), 'Kurulum tekilleştirilmiş precache listesini kullanmalı.');")
          sw_test.write_text(st,encoding='utf-8')

          no_reload=Path('tests/service-worker-no-forced-reload.test.js'); nr=no_reload.read_text(encoding='utf-8')
          old_nr='  assert.ok(sw.includes("const CACHE_ADI=\'oy-cache-v899\'"));'
          new_nr="  assert.match(sw,/const CACHE_ADI='oy-cache-v\\d+'/,'Service Worker sürümlü cache anahtarı kullanmalı.');"
          assert old_nr in nr
          no_reload.write_text(nr.replace(old_nr,new_nr,1),encoding='utf-8')
          PY
      - name: Syntax checks
        run: |
          node --check service-worker.js
          node --check js/app-loader.js
          node --check js/core/core.js
      - name: Full client regression suite
        run: node scripts/run-client-tests.mjs
      - name: Client architecture audit
        run: node scripts/check-client-architecture.mjs
      - name: Commit verified cleanup
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/design-system.css index.html service-worker.js tests/dashboard-school-summary-readability.test.js tests/service-worker-precache-smoke.test.js tests/service-worker-no-forced-reload.test.js
          git commit -m 'perf: consolidate styles and dedupe offline cache'
          git push origin main
