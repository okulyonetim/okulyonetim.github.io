name: First login sync fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply focused fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def r(p,a,b):
            x=Path(p); s=x.read_text();
            if a not in s: raise SystemExit(f'pattern not found: {p}')
            x.write_text(s.replace(a,b,1))
          r('js/core/core.js','function syncNames(types){return requestedSyncNames(types)}','function syncNames(types,options={}){return requestedSyncNames(types,options)}')
          r('js/core/core.js','const started=options?.baseline||((options&&Object.keys(options).length)?(()=>{const x={...options};delete x.force;return x})():revisionSnapshot(names));','const started=options?.baseline||((options&&Object.keys(options).length)?(()=>{const x={...options};delete x.force;delete x.full;delete x.manual;delete x.baseline;return x})():revisionSnapshot(names));')
          r('js/core/core.js','async function sync(types,options={}){if(syncPromise)return syncPromise;syncPromise=(async()=>{const names=syncNames(types),baseline=revisionSnapshot(names);await flushWrites();return pull(names,baseline)})().finally(()=>{syncPromise=null});return syncPromise}','async function sync(types,options={}){if(syncPromise)return syncPromise;syncPromise=(async()=>{const names=syncNames(types,options),baseline=revisionSnapshot(names);await flushWrites();return pull(names,{...options,baseline})})().finally(()=>{syncPromise=null});return syncPromise}')
          r('js/core/core.js','if(!window.AKTIF_KULLANICI?.uid)return false','if(!window.AKTIF_KULLANICI?.uid){bootPromise=null;return false}')
          r('js/firebase-init.js',"  const TTL=5*60*1000,KEY='ka:firestore-read-sync:v2:';let installed=false;","  const TTL=5*60*1000,KEY='ka:firestore-read-sync:v2:',CRITICAL_TYPES=['ogretmenler','siniflar','veliler'];let installed=false;")
          r('js/firebase-init.js','  const fresh=()=>{const t=getStamp();return !!t&&(Date.now()-t<TTL)};',"  const fresh=()=>{const t=getStamp();return !!t&&(Date.now()-t<TTL)};\n  const criticalCacheReady=async()=>{const u=uid();if(!u||!window.KorukLocalFirst?.cached)return false;for(const type of CRITICAL_TYPES){const marker=await window.KorukLocalFirst.cached(u,type,'__ka_missing__');if(marker==='__ka_missing__')return false}return true};")
          r('js/firebase-init.js',"if(typeof originalSchedule==='function')window.SyncEngine.schedule=function readGuardedSchedule(ms=1200){if(fresh())return;return originalSchedule(ms)};","if(typeof originalSchedule==='function')window.SyncEngine.schedule=async function readGuardedSchedule(ms=1200,options={}){if(fresh()&&await criticalCacheReady())return;return originalSchedule(ms,options)};")
          r('js/firebase-init.js',"if(!uid()||!fresh()){const result=await originalStart();if(result)setTimeout(()=>{if(window.AppStore?.get?.('ui.lastSyncAt'))setStamp()},1500);return result}","if(!uid()||!fresh()||!(await criticalCacheReady())){const result=await originalStart();if(result)setTimeout(async()=>{if(window.AppStore?.get?.('ui.lastSyncAt')&&await criticalCacheReady())setStamp()},1500);return result}")
          for fn in ['index.html','service-worker.js']:
            p=Path(fn); s=p.read_text()
            s=re.sub(r'(js/core/core\.js\?v=)(\d+)([^0-9])',lambda m:m.group(1)+str(int(m.group(2))+1)+m.group(3),s,count=1)
            s=re.sub(r'(js/firebase-init\.js\?v=)(\d+)([^0-9])',lambda m:m.group(1)+str(int(m.group(2))+1)+m.group(3),s,count=1)
            if fn=='service-worker.js': s=re.sub(r'(oy-cache-v)(\d+)',lambda m:m.group(1)+str(int(m.group(2))+1),s,count=1)
            p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          node --check js/core/core.js
          node --check js/firebase-init.js
          node - <<'NODE'
          const fs=require('fs'),a=require('assert'); const c=fs.readFileSync('js/core/core.js','utf8'),g=fs.readFileSync('js/firebase-init.js','utf8');
          a(c.includes('function syncNames(types,options={}){return requestedSyncNames(types,options)}'));
          a(c.includes('const names=syncNames(types,options)'));
          a(c.includes('return pull(names,{...options,baseline})'));
          a(c.includes('delete x.force;delete x.full;delete x.manual;delete x.baseline;'));
          a(c.includes("if(!window.AKTIF_KULLANICI?.uid){bootPromise=null;return false}"));
          a(g.includes("CRITICAL_TYPES=['ogretmenler','siniflar','veliler']"));
          a(g.includes("KorukLocalFirst.cached(u,type,'__ka_missing__')"));
          console.log('focused first-login sync fix passed');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/core.js js/firebase-init.js index.html service-worker.js
          git rm .github/workflows/first-login-fix-once.yml
          git commit -m 'Fix first-login Firestore bootstrap sync'
          git push origin main
