name: Temp Map Page Redesign
on:
  push:
    branches: [work/map-page-redesign-20260831]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/map-page-redesign-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply canonical map redesign
        run: python .github/map-redesign-patch.py
      - name: Verify map redesign
        run: |
          node tests/map-page-redesign.test.js
          node tests/map-consolidation-smoke.test.js
          node tests/tools-separate-pages.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node scripts/check-client-architecture.mjs
          git diff --check
      - name: Commit verified redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/map-ui.js js/modules/tools.js css/design-system.css service-worker.js tests/map-page-redesign.test.js
          git commit -m "Redesign interactive map workspace [skip ci]"
          git push origin HEAD:work/map-page-redesign-20260831
