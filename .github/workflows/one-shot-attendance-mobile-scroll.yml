name: One-shot Attendance Mobile Scroll
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-attendance-mobile-scroll.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch mobile attendance columns
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path=Path('css/design-system.css')
          css=css_path.read_text(encoding='utf-8')
          marker='@media(min-width:900px){.ka-attendance-toolbar'
          rule='@media(max-width:720px){.ka-attendance-personnel-table .ka-att-name,.ka-attendance-personnel-table .ka-att-role,.ka-attendance-personnel-table thead .ka-att-name,.ka-attendance-personnel-table thead .ka-att-role{position:static;left:auto;z-index:auto}.ka-attendance-personnel-table .ka-att-no{box-shadow:4px 0 10px rgba(18,69,52,.06)}}\n'
          if rule not in css:
              if marker not in css:
                  raise SystemExit('attendance desktop media marker not found')
              css=css.replace(marker,rule+marker,1)
              css_path.write_text(css,encoding='utf-8')

          sw_path=Path('service-worker.js')
          sw=sw_path.read_text(encoding='utf-8')
          if "const CACHE_ADI='oy-cache-v846';" not in sw:
              raise SystemExit('expected cache v846 not found')
          sw_path.write_text(sw.replace("const CACHE_ADI='oy-cache-v846';","const CACHE_ADI='oy-cache-v847';",1),encoding='utf-8')

          test_path=Path('tests/tools-attendance-v2-smoke.test.js')
          test=test_path.read_text(encoding='utf-8')
          test=test.replace("assert(sw.includes(\"const CACHE_ADI='oy-cache-v846';\"),'Attendance güncellemesi cache v846 ile dağıtılmalı.');","assert(css.includes('@media(max-width:720px){.ka-attendance-personnel-table .ka-att-name,.ka-attendance-personnel-table .ka-att-role'),'Mobilde Adı Soyadı ve Görevi sütunları tabloyla birlikte kaymalı.');\nassert(sw.includes(\"const CACHE_ADI='oy-cache-v847';\"),'Attendance mobil kaydırma düzeltmesi cache v847 ile dağıtılmalı.');")
          test_path.write_text(test,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node tests/tools-attendance-v2-smoke.test.js
          node tests/tools-separate-pages.test.js
          node tests/modules-local-first-boundary.test.js
      - name: Commit fix
        run: |
          rm .github/workflows/one-shot-attendance-mobile-scroll.yml
          git config user.name "sedonet23"
          git config user.email "sedonet23@gmail.com"
          git add css/design-system.css service-worker.js tests/tools-attendance-v2-smoke.test.js .github/workflows/one-shot-attendance-mobile-scroll.yml
          git commit -m "fix: unfreeze attendance columns on mobile"
          git push origin main
