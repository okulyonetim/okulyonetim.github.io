name: Apply duty holiday range update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/duty-holiday-range-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply duty holiday and report changes
        env:
          APPLY_PY_B64: ''
        run: echo "$APPLY_PY_B64" | base64 -d | python3
      - name: Verify focused duty package
        run: |
          node --check js/modules/management.js
          node tests/classic-duty-v2-smoke.test.js
          node tests/duty-report-full-parity.test.js
          node tests/management-separate-pages.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit verified package and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/duty-holiday-range-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/management.js js/app-loader.js index.html service-worker.js tests/classic-duty-v2-smoke.test.js tests/duty-report-full-parity.test.js .github/workflows/duty-holiday-range-once.yml
          git commit -m 'feat: add duty holiday date ranges'
          git push origin HEAD:main
