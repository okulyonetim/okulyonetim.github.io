name: Apply transport holiday sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-transport-holidays.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply transport holiday integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old[:90]}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          transport=Path('js/modules/transport.js')
          text=transport.read_text(encoding='utf-8')
          old="function holiday(iso){const t=arr('resmiTatiller').find(x=>x.tarih===iso);return t?(t.aciklama||t.ad||'Resmî Tatil'):null}"
          new="function holiday(iso){const list=arr('resmiTatiller'),t=global.NobetService?.tatilMi?.(list,iso)||list.find(x=>x.tarih===iso);return t?(t.aciklama||t.ad||'Resmî Tatil'):null}"
          count=text.count(old)
          if count != 2:
              raise SystemExit(f'transport holiday helper: expected 2 matches, found {count}')
          text=text.replace(old,new)

          old_prepare="const defs={servisOturma:COL.servisOturma,sinifOturma:COL.sinifOturma},types=[];"
          new_prepare="const defs={servisOturma:COL.servisOturma,sinifOturma:COL.sinifOturma,resmiTatiller:COL.resmiTatiller},types=[];"
          if text.count(old_prepare)!=1:
              raise SystemExit('transport prepareLocal signature not found exactly once')
          text=text.replace(old_prepare,new_prepare)

          old_sub="['data.servisler','data.veliler','data.siniflar','data.servisOturma','data.sinifOturma']"
          new_sub="['data.servisler','data.veliler','data.siniflar','data.servisOturma','data.sinifOturma','data.resmiTatiller']"
          if text.count(old_sub)!=1:
              raise SystemExit('transport subscription list not found exactly once')
          text=text.replace(old_sub,new_sub)
          transport.write_text(text,encoding='utf-8')

          replace_exact('js/app-loader.js', "define('transport',['js/modules/report-engine.js','js/modules/transport.js?v=892']);", "define('transport',['js/modules/report-engine.js','js/modules/transport.js?v=893']);")
          replace_exact('index.html', '<script src="js/app-loader.js?v=892" defer></script>', '<script src="js/app-loader.js?v=893" defer></script>')
          replace_exact('service-worker.js', "const CACHE_ADI='oy-cache-v893';", "const CACHE_ADI='oy-cache-v894';")
          replace_exact('service-worker.js', "'./css/design-system.css?v=893','./js/app-loader.js?v=892'", "'./css/design-system.css?v=893','./js/app-loader.js?v=893'")
          replace_exact('service-worker.js', "'./js/modules/transport.js?v=892'", "'./js/modules/transport.js?v=893'")

          test=Path('tests/transport-monthly-holidays.test.js')
          test.write_text(r'''const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const root=path.resolve(__dirname,'..');
          const source=fs.readFileSync(path.join(root,'js/modules/transport.js'),'utf8');

          test('transport hydrates and observes duty holiday data locally',()=>{
            assert.match(source,/servisOturma:COL\.servisOturma,sinifOturma:COL\.sinifOturma,resmiTatiller:COL\.resmiTatiller/);
            assert.match(source,/\['data\.servisler','data\.veliler','data\.siniflar','data\.servisOturma','data\.sinifOturma','data\.resmiTatiller'\]/);
          });

          test('monthly transport report uses the same canonical holiday matcher as duty',()=>{
            const matcher="global.NobetService?.tatilMi?.(list,iso)||list.find(x=>x.tarih===iso)";
            assert.equal(source.split(matcher).length-1,2);
            assert.match(source,/h=!weekend&&holiday\(dateIso\(y,m,d\)\)/);
            assert.match(source,/trp-holiday/);
          });
          ''',encoding='utf-8')
          PY
      - name: Syntax and focused tests
        run: |
          node --check js/modules/transport.js
          node --test tests/transport-monthly-holidays.test.js
          node --test tests/transport-separate-pages.test.js
          node --test tests/modules-local-first-boundary.test.js
          node --test tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit verified change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-transport-holidays.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: sync duty holidays with transport tracking'
          git push
