name: Apply profile and search polish

on:
  push:
    branches:
      - tmp-profile-search-polish-20260902d
    paths:
      - '.github/workflows/apply-profile-search-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-profile-search-polish-20260902d
          fetch-depth: 0
      - name: Patch canonical shell UI
        run: python3 scripts/tmp-profile-search-polish.py
      - name: Validate focused shell regressions
        run: |
          node --check js/core/shell-ui.js
          node --test tests/quick-note-launcher.test.js tests/classic-shell-v2-smoke.test.js
          git diff --check
          test "$(git diff --name-only | grep -E '\.css$' | wc -l)" -eq 0
          grep -q 'class="ka-profile-page"' js/core/shell-ui.js
          grep -q 'data-search-service' js/core/shell-ui.js
          grep -q "localeCompare(String(b.title||''),'tr'" js/core/shell-ui.js
          grep -q "classList.add('ka-layer-open')" js/core/shell-ui.js
          grep -q "view.kind==='profile-detail'" js/core/shell-ui.js
      - name: Commit canonical result
        run: |
          rm -f .github/workflows/apply-profile-search-polish.yml scripts/tmp-profile-search-polish.py
          git config user.name 'koruk-asistan-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/core/shell-ui.js .github/workflows/apply-profile-search-polish.yml scripts/tmp-profile-search-polish.py
          git commit -m 'fix: polish profile and advanced search filters'
          git push origin HEAD:tmp-profile-search-polish-20260902d
