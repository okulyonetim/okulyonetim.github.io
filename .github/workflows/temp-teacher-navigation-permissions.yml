name: Temporary Teacher Navigation Permissions Gate

on:
  push:
    branches: [work/teacher-navigation-permissions-20260830]
    paths:
      - '.github/workflows/temp-teacher-navigation-permissions.yml'
      - '.github/staging/teacher-groups/**'
      - '.github/staging/teacher-shell-missing3/**'

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct and apply candidate groups
        shell: bash
        run: |
          set -euo pipefail
          check_apply() {
            local prefix="$1" patchsha="$2" out="$3"
            cat ${prefix}* | base64 -d > "/tmp/${out}.patch.xz"
            xz -t "/tmp/${out}.patch.xz"
            xz -d -c "/tmp/${out}.patch.xz" > "/tmp/${out}.patch"
            echo "${patchsha}  /tmp/${out}.patch" | sha256sum -c -
            git apply --check "/tmp/${out}.patch"
            git apply "/tmp/${out}.patch"
          }

          check_apply '.github/staging/teacher-groups/shell0' 'f899f805d3b1331fb29239db8261479501965c4e6fe4d74d062b472dd9000b02' 'shell'
          check_apply '.github/staging/teacher-groups/people-mgmt0' 'dd26840b38c30ad51e4b9d2e95bbdf0e76f0a05688aba490fe4484fb0b65eb15' 'people-mgmt'
          check_apply '.github/staging/teacher-shell-missing3/part0' 'f90935187b0047945d46f16d221d2adfa01c1f7cf33d86daaf171f420e7869fd' 'seating'
          check_apply '.github/staging/teacher-groups/tests0' 'c2945b05c3de509a37ef8d1f7d5952dbd0d377bd98d9128dd6c3d81ed1a6cba1' 'tests'

          python - <<'PY'
          from pathlib import Path
          p = Path('firestore.rules')
          s = p.read_text(encoding='utf-8')
          own_teacher = "    function kendiOgretmenIdsi() {\n      return kendiBelgemVarMi() ? kullaniciBelgesi().data.bagliOgretmenId : null;\n    }\n"
          own_class = "\n    function kendiSinifiMi(sinifId) {\n      return girisYapmis()\n        && kendiOgretmenIdsi() != null\n        && exists(/databases/$(database)/documents/oy_siniflar/$(sinifId))\n        && get(/databases/$(database)/documents/oy_siniflar/$(sinifId)).data.sinifOgretmeniId == kendiOgretmenIdsi();\n    }\n"
          old_rule = "    match /oy_sinifOturma/{sinifId} {\n      allow read: if girisYapmis();\n      allow create, update, delete: if moduluDuzenleyebilir('siniflar');\n    }\n"
          new_rule = "    match /oy_sinifOturma/{sinifId} {\n      allow read: if girisYapmis();\n      allow create, update, delete: if moduluDuzenleyebilir('siniflar') || kendiSinifiMi(sinifId);\n    }\n"
          if s.count(own_teacher) != 1:
              raise SystemExit('kendiOgretmenIdsi anchor exactly once bulunamadı')
          if s.count(old_rule) != 1:
              raise SystemExit('oy_sinifOturma anchor exactly once bulunamadı')
          s = s.replace(own_teacher, own_teacher + own_class, 1).replace(old_rule, new_rule, 1)
          p.write_text(s, encoding='utf-8')
          PY

          node --check js/app-loader.js
          node --check js/auth.js
          node --check js/core/shell-ui.js
          node --check js/modules/class-seating.js
          node --check js/modules/management.js
          node --check js/modules/people-classic-ui.js
          node --check js/modules/people.js
          node --check js/modules/transport.js
      - name: Verify full client architecture
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-client-bundles.mjs
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/lazy-firebase-storage-smoke.test.js
          node tests/web-mobile-engine-separation.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/classic-people-v2-smoke.test.js
          node tests/classes-mobile-parity-smoke.test.js
          node tests/classic-duty-v2-smoke.test.js
          node tests/classic-schedule-v2-smoke.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-quick-actions.test.js
          node tests/calendar-month-view.test.js
          node tests/quick-note-launcher.test.js
          node tests/communication-admin-actions.test.js
          node tests/transport-separate-pages.test.js
          node tests/no-module-internal-tabs.test.js
          node tests/report-engine-a4-smoke.test.js
          node tests/report-native-print-routing-smoke.test.js
          node tests/android-print-plugin-smoke.test.js
          node tests/dashboard-reminders-smoke.test.js
          node tests/teacher-list-core-contract.test.js
          node tests/teacher-list-local-first-service.test.js
          node tests/student-tool-routing-smoke.test.js
          node tests/people-separate-pages.test.js
          node tests/academic-separate-pages.test.js
          node tests/management-separate-pages.test.js
          node tests/communication-separate-pages.test.js
          node tests/settings-separate-pages.test.js
          node tests/tools-separate-pages.test.js
          node tests/communication-local-first-contract.test.js
          node tests/retired-legacy-roots-smoke.test.js
          node tests/root-js-inventory-smoke.test.js
          node tests/widget-platform-adapter-smoke.test.js
          node tests/teblig-v2-smoke.test.js
          node tests/documents-viewer-v2-smoke.test.js
          node tests/document-viewer-smoke.test.js
          node tests/lazy-document-libs-smoke.test.js
          node tests/payroll-change-v2-smoke.test.js
          node tests/assistant-v2-smoke.test.js
          node tests/legislation-engine-v2-smoke.test.js
          node tests/map-consolidation-smoke.test.js
          node tests/rubric-tools-v2-smoke.test.js
          node tests/rubric-settings-v2-smoke.test.js
          node tests/rubric-legacy-retirement-readiness.test.js
          node tests/pwa-push-smoke.test.js
          node scripts/check-client-architecture.mjs
          cat dist/js/manifest.json
      - name: Commit validated application changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/design-system.css js/app-loader.js js/auth.js js/core/shell-ui.js js/modules/class-seating.js js/modules/management.js js/modules/people-classic-ui.js js/modules/people.js js/modules/transport.js firestore.rules tests/classes-mobile-parity-smoke.test.js tests/classic-people-v2-smoke.test.js tests/classic-shell-v2-smoke.test.js tests/dashboard-card-routes-smoke.test.js tests/management-separate-pages.test.js tests/oturma-planlari-role-rules.test.js tests/transport-separate-pages.test.js
          git diff --cached --quiet && { echo 'No application changes to commit'; exit 1; }
          git commit -m 'Tighten teacher navigation and seating permissions'
          git push
