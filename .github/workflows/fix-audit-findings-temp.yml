name: Apply application audit fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-audit-findings-temp.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply audit fixes
        run: python3 scripts/fix-audit-contracts.py
      - name: Build client bundles
        run: node scripts/build-client-bundles.mjs
      - name: Validate production JavaScript syntax
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find js scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Run complete client regression suite
        run: node scripts/run-client-tests.mjs
      - name: Audit client architecture
        run: node scripts/check-client-architecture.mjs
      - name: Verify Service Worker contract
        run: node tests/service-worker-precache-smoke.test.js
      - name: Commit verified audit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/fix-audit-contracts.py .github/workflows/app-audit-temp.yml .github/workflows/fix-audit-findings-temp.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'test: repair stale regression contracts and broaden client audit'
          git push
