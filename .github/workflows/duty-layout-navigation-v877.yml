name: Duty layout navigation v877

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/duty-layout-navigation-v877.yml'

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify baseline
        run: test "$(git rev-parse HEAD^)" = '69dff447dd9ff475380a45b8efd166dde0273170'
      - name: Apply focused fixes
        run: |
          python3 scripts/tmp-duty-layout-navigation-v877.py
          python3 scripts/tmp-duty-layout-testfix-v877.py
      - name: Validate syntax regressions and architecture
        run: |
          set -euo pipefail
          node --check js/modules/management.js
          node --check js/modules/settings.js
          node --check js/core/shell-ui.js
          node --check js/app-loader.js
          node --check service-worker.js
          node tests/duty-report-full-parity.test.js
          node tests/classic-duty-v2-smoke.test.js
          node tests/settings-separate-pages.test.js
          node tests/menu-customization-v2.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/teacher-access-results-duty.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/module-bundles-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/web-mobile-engine-separation.test.js
          npm run audit:client
          npm run build:client
      - name: Commit verified package and cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/duty-layout-navigation-v877.yml scripts/tmp-duty-layout-navigation-v877.py scripts/tmp-duty-layout-testfix-v877.py
          git add js/modules/management.js js/modules/settings.js js/core/shell-ui.js js/app-loader.js css/design-system.css index.html service-worker.js tests
          git commit -m 'fix: rebalance duty report and redesign app layout'
          git push origin HEAD:main
