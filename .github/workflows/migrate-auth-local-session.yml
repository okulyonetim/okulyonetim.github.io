name: migrate-auth-local-session
on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-auth-local-session.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply local auth session restore
        run: python scripts/migrate-auth-local-session.py
      - name: Syntax checks
        run: |
          node --check js/auth.js
          node --check js/app-loader.js
      - name: Shell and architecture checks
        run: |
          node tests/classic-shell-v2-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Cleanup temporary migration files
        run: rm -f scripts/migrate-auth-local-session.py .github/workflows/migrate-auth-local-session.yml
      - name: Commit production migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(auth): restore active session from IndexedDB' || exit 0
          git push
