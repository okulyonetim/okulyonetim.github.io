name: Apply academic single-owner navigation repair

on:
  push:
    branches:
      - fix/academic-single-owner-profile-back-20260912
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          def replace_once(path, old, new, label):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != 1: raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')
          def replace_n(path, old, new, expected, label):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != expected: raise SystemExit(f'{label}: expected {expected} matches, found {count}')
              p.write_text(text.replace(old,new),encoding='utf-8')
          def regex_once(path, pattern, repl, label):
              p=Path(path); text=p.read_text(encoding='utf-8'); new,count=re.subn(pattern,repl,text,count=1,flags=re.S)
              if count != 1: raise SystemExit(f'{label}: expected 1 regex match, found {count}')
              p.write_text(new,encoding='utf-8')

          # Classic parity no longer owns any Academic summary/modal surface.
          p=Path('js/modules/classic-parity.js'); text=p.read_text(encoding='utf-8')
          start=text.find('function dayDiff('); end=text.find('function teacherIdFromCard',start)
          if start < 0 or end <= start: raise SystemExit('classic Academic parity block not found')
          text=text[:start]+text[end:]
          old="function enhance(){scheduled=false;injectAcademicSummary();injectAcademicModalIntro();enhanceTeacherCards();enhanceTeacherBranchOptions();enhanceProfile()}"
          if old not in text: raise SystemExit('classic enhance Academic calls not found')
          text=text.replace(old,"function enhance(){scheduled=false;enhanceTeacherCards();enhanceTeacherBranchOptions();enhanceProfile()}",1)
          text=text.replace("['sinavlar','denemeSinavlari','dersProgrami','dersListesi','bransListesi','sosyalKulupler','rehberlik','belirliGunler','nobetAtamalari']","['dersProgrami','dersListesi','bransListesi','sosyalKulupler','rehberlik','belirliGunler','nobetAtamalari']",1)
          p.write_text(text,encoding='utf-8')

          # Academic reads/writes only the host owned by v2ModuleRoot.
          academic='js/modules/academic.js'
          anchor="const match=vals=>{const q=norm(query.trim());return!q||norm(vals.filter(Boolean).join(' ')).includes(q)};"
          helper=anchor+"\nfunction ownedAcademicHost(){const root=document.getElementById('v2ModuleRoot');if(!root)return null;document.querySelectorAll('[data-academic-module]').forEach(host=>{if(!root.contains(host))host.remove()});const hosts=[...root.querySelectorAll('[data-academic-module]')];hosts.slice(1).forEach(host=>host.remove());return hosts[0]||null}"
          replace_once(academic,anchor,helper,'Academic owned host helper')
          regex_once(academic,r"function applyAcademicMeta\(title=''\)\{.*?\}\nfunction canEditExams\(\)","function applyAcademicMeta(title=''){const meta=ACADEMIC_PAGE_META[active]||{title:'Akademik',description:'Ders programı, sınavlar ve planlar önce cihaz verisinden gösterilir.'},host=ownedAcademicHost(),h=host?.querySelector('[data-academic-title]'),d=host?.querySelector('[data-academic-description]');if(h)h.textContent=title||meta.title;if(d)d.textContent=meta.description}\nfunction canEditExams()",'Academic meta scope')
          replace_once(academic,"const academicHost=document.querySelector('[data-academic-module]');academicHost?.classList.toggle","const academicHost=ownedAcademicHost();if(!academicHost)return;academicHost.classList.toggle",'Academic render host')
          replace_once(academic,"const searchWrap=document.querySelector('[data-academic-search-wrap]');","const searchWrap=academicHost.querySelector('[data-academic-search-wrap]');",'Academic search scope')
          replace_n(academic,"const out=document.getElementById('academicContent'),c=document.getElementById('academicCount');","const out=academicHost.querySelector('#academicContent'),c=academicHost.querySelector('#academicCount');",2,'Academic content scope')
          replace_once(academic,"window.PermissionService?.apply?.(document.getElementById('v2ModuleRoot')||document)","window.PermissionService?.apply?.(academicHost)",'Academic permission scope')
          replace_once(academic,"function bind(){document.getElementById('academicSearch')?.addEventListener('input',e=>{query=e.target.value;render()})}","function bind(){ownedAcademicHost()?.querySelector('#academicSearch')?.addEventListener('input',e=>{query=e.target.value;render()})}",'Academic search binding scope')
          replace_once(academic,"async function mount(root=document.getElementById('v2ModuleRoot')){if(!root)return false;mounted=true;ready=false;root.innerHTML=shell();bind();","async function mount(root=document.getElementById('v2ModuleRoot')){if(!root)return false;mounted=true;ready=false;document.querySelectorAll('[data-academic-module]').forEach(host=>{if(!root.contains(host))host.remove()});root.innerHTML=shell();bind();",'Academic mount cleanup')
          replace_once(academic,"const h=document.querySelector('[data-academic-module] > .ka-row h2');if(h)h.textContent='Yıllık Plan';","const h=ownedAcademicHost()?.querySelector('[data-academic-title]');if(h)h.textContent='Yıllık Plan';",'Academic plan title scope')

          # Teacher profile exam ownership follows ogretmenId; creator fallback is legacy-only.
          shell='js/core/shell-ui.js'
          replace_once(shell,"function profileOwnExams(uid=user().uid||''){if(!uid)return[];return arr('sinavlar').filter(x=>String(x.sahipUid||'')===String(uid)).slice().sort((a,b)=>String(b.tarih||'').localeCompare(String(a.tarih||''))||String(a.ders||'').localeCompare(String(b.ders||''),'tr',{sensitivity:'base'}))}","function profileOwnExams(tid=profileTeacherId(),uid=user().uid||''){if(!tid&&!uid)return[];return arr('sinavlar').filter(x=>(tid&&String(x.ogretmenId||'')===String(tid))||(!x.ogretmenId&&uid&&String(x.sahipUid||'')===String(uid))).slice().sort((a,b)=>String(b.tarih||'').localeCompare(String(a.tarih||''))||String(a.ders||'').localeCompare(String(b.ders||''),'tr',{sensitivity:'base'}))}",'Profile assigned exams')
          replace_once(shell,"'Sınavlarım','Oluşturduğunuz yazılı sınavlar'","'Sınavlarım','Size atanmış yazılı sınavlar'",'Profile exam action text')
          replace_once(shell,"exams:['Sınavlarım','Yalnız sizin oluşturduğunuz yazılı sınavlar gösteriliyor.']","exams:['Sınavlarım','Yalnız size atanmış yazılı sınavlar gösteriliyor.']",'Profile exam detail text')
          replace_once(shell,"Sizin oluşturduğunuz yazılı sınav kaydı bulunamadı.","Size atanmış yazılı sınav kaydı bulunamadı.",'Profile exam empty text')

          # Shell-owned pages suspend the route module before replacing the shared root.
          marker="function setBottomActive(action){activeAction=action;$$('[data-ka-shell-action]').forEach(b=>{const on=b.dataset.kaShellAction===action;b.classList.toggle('active',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')})}"
          replace_once(shell,marker,marker+"\nfunction suspendModuleForShellSurface(){global.AppLoader?.suspendActiveModule?.()}",'Shell surface suspend helper')
          replace_once(shell,"function renderProfile({remember=true}={}){\n  closeHeaderPopover();closeMenu();setBottomActive('profile');","function renderProfile({remember=true}={}){\n  closeHeaderPopover();closeMenu();suspendModuleForShellSurface();setBottomActive('profile');",'Profile module suspension')
          replace_once(shell,"function renderProfileDetail(kind,{remember=true}={}){closeHeaderPopover();closeMenu();setBottomActive('profile');","function renderProfileDetail(kind,{remember=true}={}){closeHeaderPopover();closeMenu();suspendModuleForShellSurface();setBottomActive('profile');",'Profile detail module suspension')
          replace_once(shell,"function renderSearch({remember=true}={}){\n  closeHeaderPopover();closeMenu();setBottomActive('search');","function renderSearch({remember=true}={}){\n  closeHeaderPopover();closeMenu();suspendModuleForShellSurface();setBottomActive('search');",'Search module suspension')

          old="function sameView(a,b){return !!a&&!!b&&a.kind===b.kind&&a.name===b.name&&a.bottom===b.bottom&&a.page===b.page&&a.title===b.title&&(a.parentMenu||'')===(b.parentMenu||'')}\nfunction rememberView(view){if(!view)return;const top=navStack[navStack.length-1];if(sameView(top,view))return;navStack.push(view);if(navStack.length>30)navStack.splice(0,navStack.length-30)}"
          new="function sameView(a,b){return !!a&&!!b&&a.kind===b.kind&&a.name===b.name&&a.bottom===b.bottom&&a.page===b.page&&a.title===b.title&&(a.parentMenu||'')===(b.parentMenu||'')}\nfunction sameSurface(a,b){if(!a||!b||a.kind!==b.kind)return false;if(a.kind==='route')return a.name===b.name&&(a.page||'')===(b.page||'');if(a.kind==='profile-detail')return a.page===b.page;return ['profile','search'].includes(a.kind)}\nfunction rememberView(view){if(!view)return;const top=navStack[navStack.length-1];if(sameView(top,view))return;if(sameSurface(top,view)){navStack[navStack.length-1]=view;return}navStack.push(view);if(navStack.length>30)navStack.splice(0,navStack.length-30)}"
          replace_once(shell,old,new,'Visible route history dedupe')
          regex_once(shell,r"function installBackNavigation\(\)\{.*?\}\nfunction back\(\)","function installBackNavigation(){if(!browserBackBound){browserBackBound=true;history.replaceState({kaShellGuard:'root'},'');history.pushState({kaShellGuard:'active'},'');window.addEventListener('popstate',()=>{if(browserExitApproved){browserExitApproved=false;history.back();return}handleAppBack({fromPop:true})})}}\nfunction back()",'Single native back owner')

          # Regression tests.
          p=Path('tests/academic-separate-pages.test.js'); text=p.read_text(encoding='utf-8')
          text=text.replace("const core=fs.readFileSync('js/core/core.js','utf8');","const core=fs.readFileSync('js/core/core.js','utf8');\nconst classicParity=fs.readFileSync('js/modules/classic-parity.js','utf8');",1)
          marker="assert(!css.includes('.ka-written-hero')&&!css.includes('.ka-trial-hero'),'Emekli ikinci sınav hero tasarımları merkezi CSS içinde yama/ölü katman olarak kalmamalı.');"
          add=marker+"\nassert(!classicParity.includes('injectAcademicSummary')&&!classicParity.includes('data-classic-written-summary')&&!classicParity.includes('data-classic-trial-summary')&&!classicParity.includes('injectAcademicModalIntro'),'Classic parity Academic ekranına ikinci özet veya modal katmanı eklememeli.');\nfor(const token of ['function ownedAcademicHost()','if(!root.contains(host))host.remove()','const academicHost=ownedAcademicHost();if(!academicHost)return',\"academicHost.querySelector('#academicContent')\"])assert(academic.includes(token),`Academic tek DOM sahibi sözleşmesi eksik: ${token}`);"
          if marker not in text: raise SystemExit('Academic test marker missing')
          p.write_text(text.replace(marker,add,1).replace('academic.js?v=878','academic.js?v=879'),encoding='utf-8')

          p=Path('tests/profile-page-redesign.test.js'); text=p.read_text(encoding='utf-8')
          marker="assert(block.includes(\"action('schedule'\")&&block.includes(\"action('duty'\")&&block.includes(\"action('exams'\")&&block.includes(\"action('tasks'\"),'Dört kişisel çalışma alanı davranışı korunmalı.');"
          add=marker+"\nassert(ui.includes(\"function profileOwnExams(tid=profileTeacherId(),uid=user().uid||'')\")&&ui.includes(\"String(x.ogretmenId||'')===String(tid)\")&&ui.includes(\"!x.ogretmenId&&uid&&String(x.sahipUid||'')===String(uid)\"),'Profil Sınavlarım ogretmenId üzerinden, yalnız eski kayıtlarda sahipUid fallback ile çalışmalı.');\nassert(block.includes('Size atanmış yazılı sınavlar'),'Profil Sınavlarım atanmış sınavları açıklamalı.');\nassert(block.includes('suspendModuleForShellSurface()'),'Profil görünümü önce aktif modülü askıya almalı.');"
          if marker not in text: raise SystemExit('Profile test marker missing')
          p.write_text(text.replace(marker,add,1),encoding='utf-8')

          p=Path('tests/native-back-holiday-regression.test.js'); text=p.read_text(encoding='utf-8')
          text=text.replace("const runtime=fs.readFileSync('js/core/platform/mobile-runtime-fixes.js','utf8');","const runtime=fs.readFileSync('js/core/platform/mobile-runtime-fixes.js','utf8');\nconst shell=fs.readFileSync('js/core/shell-ui.js','utf8');",1)
          marker="assert(activity.includes(\"window.ShellUI && typeof window.ShellUI.back==='function'\"),'Android geri tuşu ShellUI geçmişine devredilmiyor.');"
          add=marker+"\nassert(!shell.includes(\"addListener('backButton'\"),'Android geri tuşu MainActivity ve Capacitor listener tarafından iki kez sahiplenilmemeli.');\nassert(shell.includes('function sameSurface(a,b)')&&shell.includes('if(sameSurface(top,view))'),'Aynı görünür route geçmişte üst üste birikmemeli.');"
          if marker not in text: raise SystemExit('Native back test marker missing')
          p.write_text(text.replace(marker,add,1),encoding='utf-8')

          replace_once('js/app-loader.js',"'js/modules/academic.js?v=878'","'js/modules/academic.js?v=879'",'Academic loader version')
          replace_once('index.html','js/core/shell-ui.js?v=883','js/core/shell-ui.js?v=884','Shell version')
          replace_once('service-worker.js',"const CACHE_ADI='oy-cache-v925';","const CACHE_ADI='oy-cache-v926';",'SW cache version')
          replace_once('service-worker.js','./js/core/shell-ui.js?v=883','./js/core/shell-ui.js?v=884','SW shell version')
          replace_once('service-worker.js','./js/modules/academic.js?v=878','./js/modules/academic.js?v=879','SW Academic version')
          PY
      - name: Focused tests
        run: |
          git diff --check -- js/modules/academic.js js/modules/classic-parity.js js/core/shell-ui.js js/app-loader.js index.html service-worker.js tests/academic-separate-pages.test.js tests/profile-page-redesign.test.js tests/native-back-holiday-regression.test.js
          node --check js/modules/academic.js
          node --check js/modules/classic-parity.js
          node --check js/core/shell-ui.js
          node tests/academic-separate-pages.test.js
          node tests/profile-page-redesign.test.js
          node tests/native-back-holiday-regression.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
      - name: Full client regressions
        run: node scripts/run-client-tests.mjs
      - name: Architecture audit
        run: node scripts/check-client-architecture.mjs
      - name: Commit final files
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/notify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/academic.js js/modules/classic-parity.js js/core/shell-ui.js js/app-loader.js index.html service-worker.js tests/academic-separate-pages.test.js tests/profile-page-redesign.test.js tests/native-back-holiday-regression.test.js
          git diff --cached --check
          git commit -m 'fix: make academic pages single-owner and repair teacher profile back flow'
          git push origin HEAD:fix/academic-single-owner-profile-back-20260912
