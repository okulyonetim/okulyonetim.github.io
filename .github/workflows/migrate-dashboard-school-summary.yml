name: Migrate Dashboard School Summary

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-dashboard-school-summary.cjs'
      - '.github/workflows/migrate-dashboard-school-summary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply school summary migration
        run: node scripts/migrate-dashboard-school-summary.cjs
      - name: Verify dashboard behavior
        run: |
          node --check js/modules/dashboard.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-reminders-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Build client bundles
        run: node scripts/build-client-bundles.mjs
      - name: Commit production package and cleanup
        run: |
          rm -f scripts/migrate-dashboard-school-summary.cjs
          rm -f .github/workflows/migrate-dashboard-school-summary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/dashboard.js css/design-system.css tests/dashboard-card-routes-smoke.test.js scripts/migrate-dashboard-school-summary.cjs .github/workflows/migrate-dashboard-school-summary.yml
          git commit -m "feat(dashboard): enrich school summary with real demographics"
          git push
