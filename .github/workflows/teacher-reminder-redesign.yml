name: Teacher reminder redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/teacher-reminder-redesign.yml'
      - '.github/temp-reminder-redesign.py'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current development baseline
        run: git merge-base --is-ancestor a260e84c176bb1a8c30719aee9ffc4cb4c40b35d HEAD
      - name: Apply teacher reminder redesign
        run: python3 .github/temp-reminder-redesign.py
      - name: Validate reminder UI and local-first architecture
        run: |
          set -euo pipefail
          node --check js/modules/dashboard.js
          node --check js/app-loader.js
          node --check service-worker.js
          node tests/dashboard-reminders-smoke.test.js
          node tests/dashboard-reminder-redesign.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-quick-actions.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/notification-popover-redesign.test.js
          node tests/runtime-performance-smoke.test.js
          node tests/web-mobile-engine-separation.test.js
          npm run build:client
          node tests/module-bundles-smoke.test.js
          test "$(find css -maxdepth 1 -type f -name '*.css' -printf '%f\n' | sort)" = 'design-system.css'
          ! grep -q 'db.collection(' js/modules/dashboard.js
          ! grep -q 'onSnapshot' js/modules/dashboard.js
      - name: Commit verified redesign and remove temporary files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/teacher-reminder-redesign.yml .github/temp-reminder-redesign.py
          git add js/modules/dashboard.js css/design-system.css js/app-loader.js index.html service-worker.js tests
          git commit -m 'feat: redesign teacher startup reminders'
          git push origin HEAD:main
