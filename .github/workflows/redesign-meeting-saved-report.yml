name: Redesign meeting saved cards and report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redesign-meeting-saved-report.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Verify staged base
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="8c1e260f2bf2be05a6e80604be501820b8469cf7"
          test "$(git rev-parse HEAD~3)" = "$EXPECTED"

      - name: Apply meeting redesign
        run: python scripts/tmp-meeting-redesign.py

      - name: Validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check js/modules/meeting-schedule.js
          node --check service-worker.js
          node tests/meeting-schedule-v1-smoke.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/trial-counter-scroll-stability.test.js
          node tests/web-mobile-engine-separation.test.js

      - name: Commit verified redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/meeting-schedule.js css/design-system.css index.html service-worker.js tests/meeting-schedule-v1-smoke.test.js tests/trial-counter-scroll-stability.test.js
          git commit -m "feat: redesign saved meetings and clean report"
          git push origin main
