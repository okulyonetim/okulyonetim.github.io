name: Temporary Dashboard Motion Test Fix
on:
  push:
    branches: [fix/dashboard-weather-news-motion]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-weather-news-motion
      - name: Update stale ticker assertion
        shell: python
        run: |
          from pathlib import Path
          p=Path('tests/dashboard-card-routes-smoke.test.js')
          s=p.read_text()
          old="assert(css.includes('.ka-home .kh-news.is-ready .kh-news-track{animation:khTicker var(--kh-ticker-time,28s) linear infinite;animation-play-state:running}')&&css.includes('@media(hover:hover) and (pointer:fine){.ka-home .kh-news:hover .kh-news-track{animation-play-state:paused}}'),'Haber bandı dokunmatik cihazlarda sticky hover nedeniyle durmamalı; duraklatma yalnız gerçek hover cihazlarında çalışmalı.');"
          new="assert(css.includes('.ka-home .kh-news-track{display:flex;align-items:center;gap:0;width:max-content;animation:khTicker var(--kh-ticker-time,28s) linear infinite;animation-play-state:running')&&!css.includes('.ka-home .kh-news.is-ready .kh-news-track{animation:khTicker')&&css.includes('@media(hover:hover) and (pointer:fine){.ka-home .kh-news:hover .kh-news-track{animation-play-state:paused}}'),'Haber bandı DOMa gelir gelmez akmalı; is-ready beklememeli ve dokunmatik cihazlarda sticky hover nedeniyle durmamalı.');"
          if old not in s: raise SystemExit('stale ticker assertion not found')
          p.write_text(s.replace(old,new,1))
      - name: Verify focused tests
        run: |
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-motion-regression.test.js
      - name: Commit and self-remove
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/dashboard-card-routes-smoke.test.js
          git commit -m "test: expect immediate dashboard news ticker"
          git push origin fix/dashboard-weather-news-motion
          git rm .github/workflows/tmp-dashboard-motion-test-fix.yml
          git commit -m "chore: remove temporary dashboard ticker test workflow"
          git push origin fix/dashboard-weather-news-motion
