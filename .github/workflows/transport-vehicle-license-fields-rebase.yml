name: Transport vehicle fields rebase patch
on:
  push:
    branches: [fix/transport-vehicle-license-fields-rebase-work]
    paths:
      - '.github/workflows/transport-vehicle-license-fields-rebase.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transport-vehicle-license-fields-rebase-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply rebased transport fixes
        run: python .github/scripts/transport_vehicle_license_fields_rebase.py
      - name: Validate focused changes
        run: |
          node --check js/modules/transport.js
          node tests/transport-separate-pages.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/dashboard-refresh-news-stability.test.js
          node tests/dashboard-motion-regression.test.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/transport.js tests/transport-separate-pages.test.js js/app-loader.js index.html service-worker.js tests/dashboard-refresh-news-stability.test.js tests/dashboard-motion-regression.test.js
          git commit -m 'fix: add service vehicle and driver licence fields' || exit 0
          git push origin HEAD:fix/transport-vehicle-license-fields-rebase-work
