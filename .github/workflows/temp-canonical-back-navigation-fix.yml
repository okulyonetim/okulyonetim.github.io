name: Temporary canonical back navigation fix
on:
  push:
    paths:
      - '.github/workflows/temp-canonical-back-navigation-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix canonical shell back navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/core/shell-ui.js')
          s=p.read_text()
          old="if(!handled&&current?.kind==='route'&&current.name==='settings'&&global.SettingsModule?.currentPage?.()==='home'&&navStack.length===1){openMenu();renderMenuGrid();handled=true}"
          new="if(!handled&&current?.kind==='route'&&current.name==='settings'&&global.SettingsModule?.currentPage?.()==='home'&&navStack.length===1){navStack=[{kind:'route',name:'dashboard',bottom:'home',page:'',title:'Ana Sayfa'}];handled=await routeModule('dashboard',{bottom:'home',remember:false})}"
          assert old in s, 'settings root target not found'
          s=s.replace(old,new,1)
          old2="function installBackNavigation(){if(!browserBackBound){browserBackBound=true;history.replaceState({kaShellGuard:'root'},'');history.pushState({kaShellGuard:'active'},'');window.addEventListener('popstate',()=>{if(browserExitApproved){browserExitApproved=false;history.back();return}handleAppBack({fromPop:true})})}}"
          new2="function installBackNavigation(){if(!browserBackBound){browserBackBound=true;history.replaceState({kaShellGuard:'root'},'');history.pushState({kaShellGuard:'active'},'');window.addEventListener('popstate',()=>{if(browserExitApproved){browserExitApproved=false;history.back();return}handleAppBack({fromPop:true})})}const app=global.Capacitor?.Plugins?.App;if(!nativeBackBound&&app?.addListener){nativeBackBound=true;app.addListener('backButton',()=>{handleAppBack()})}}"
          assert old2 in s, 'back navigation installer target not found'
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Validate
        run: |
          node --check js/core/shell-ui.js
          grep -q "name:'dashboard',bottom:'home'" js/core/shell-ui.js
          grep -q "addListener('backButton'" js/core/shell-ui.js
      - name: Commit canonical fix and remove workflow
        run: |
          rm -f .github/workflows/temp-canonical-back-navigation-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: make Android back navigation follow shell stack"
          git push
