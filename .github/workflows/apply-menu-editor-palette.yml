name: Apply expanded menu editor palette

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-menu-editor-palette.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Apply palette and icon expansion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('js/core/shell-ui.js'); s=p.read_text(encoding='utf-8')
          old="const MENU_CARD_COLOR_PRESETS=Object.freeze(['#7554d8','#2f80ed','#18a77f','#d7b226','#ed922c','#ef5b50','#2fa8c8','#64717f']);\nconst MENU_CARD_ICON_PRESETS=Object.freeze(['👥','📝','📅','💬','📆','🚌','📁','🧑‍💼','⚙️','🗂️']);"
          new="const MENU_CARD_COLOR_PRESETS=Object.freeze(['#2F80ED','#7554D8','#18A77F','#D7B226','#ED922C','#EF5B50','#2FA8C8','#64717F','#E91E63','#9C27B0','#3F51B5','#00BCD4','#009688','#4CAF50','#FF9800','#795548']);\nconst MENU_CARD_ICON_PRESETS=Object.freeze(['👥','👩‍🏫','🎓','🏫','🧑‍💼','📝','✏️','📋','✅','☑️','📅','📆','⏰','🕘','💬','📣','🔔','📰','✉️','☎️','🚌','💺','🗺️','🧭','📁','📂','📄','📖','📚','🗂️','🗄️','🏢','⚙️','🔧','🧰','🛡️','🔒','🏅','🎯','⭐','🌟','📊','📈','🧪','📏','💼','💵','🧩']);"
          if old not in s: raise SystemExit('preset block missing')
          s=s.replace(old,new,1)
          marker="function menuEditorColors(current){return [...new Set([current,...MENU_CARD_COLOR_PRESETS].filter(validMenuColor))]}"
          helpers="function menuColorHexToHsv(hex){const v=validMenuColor(hex);if(!v)return{h:0,s:0,v:1};const n=parseInt(v.slice(1),16),r=((n>>16)&255)/255,g=((n>>8)&255)/255,b=(n&255)/255,max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;if(d){if(max===r)h=60*(((g-b)/d)%6);else if(max===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4)}if(h<0)h+=360;return{h,s:max?d/max:0,v:max}}\nfunction menuColorHsvToHex(h,s,v){h=((Number(h)||0)%360+360)%360;s=Math.max(0,Math.min(1,Number(s)||0));v=Math.max(0,Math.min(1,Number(v)||0));const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}const f=n=>Math.round((n+m)*255).toString(16).padStart(2,'0').toUpperCase();return`#${f(r)}${f(g)}${f(b)}`}"
          if marker not in s: raise SystemExit('color helper marker missing')
          s=s.replace(marker,marker+'\n'+helpers,1)

          a=s.index('function renderMenuCardEditor(key){'); b=s.index('function bindMenuCardEditor',a)
          render=r'''function renderMenuCardEditor(key){const layer=$('#kaMenuLayer'),g=customizedVisibleGroups().find(x=>x.key===key),base=MENU_GROUPS.find(x=>x.key===key);if(!layer||!g||!base||!canEditMenu())return;const color=g.__menuColor||menuCardDefaultColor(key),icons=menuEditorIcons(g.icon),colors=menuEditorColors(color),hsv=menuColorHexToHsv(color);layer.innerHTML=`<div class="ka-menu-editor-screen"><section class="ka-menu-editor-sheet" role="dialog" aria-modal="true" aria-labelledby="kaMenuEditorTitle"><div class="ka-menu-editor-grip" aria-hidden="true"></div><header class="ka-menu-editor-head"><div><small>KART ÖZELLEŞTİRME</small><h2 id="kaMenuEditorTitle">Menü Kartını Düzenle</h2></div><button class="ka-icon-button" type="button" data-menu-editor-cancel aria-label="Kapat">${SVG.close}</button></header><div class="ka-menu-editor-body"><section class="ka-menu-editor-section"><span class="ka-menu-editor-label">ÖNİZLEME</span><article class="ka-menu-editor-preview" style="--ka-menu-editor-color:${color}"><span class="ka-menu-editor-preview__icon" data-menu-editor-preview-icon>${g.icon}</span><strong data-menu-editor-preview-label>${esc(g.label)}</strong><span class="ka-menu-editor-preview__badge">${menuCount(g)}</span></article></section><section class="ka-menu-editor-section"><label class="ka-menu-editor-label" for="kaMenuEditorLabel">MENÜ ADI</label><div class="ka-menu-editor-input-wrap"><input id="kaMenuEditorLabel" data-menu-editor-label-input maxlength="36" value="${esc(g.label)}"><small data-menu-editor-counter>${String(g.label||'').length}/36</small></div></section><section class="ka-menu-editor-section"><span class="ka-menu-editor-label">İKON / ŞEKİL</span><div class="ka-menu-editor-icon-grid">${icons.map(icon=>`<button type="button" class="ka-menu-editor-icon-option ${icon===g.icon?'is-selected':''}" data-menu-editor-icon="${esc(icon)}">${icon}</button>`).join('')}</div><label class="ka-menu-editor-custom-icon"><span>Özel ikon / emoji</span><input data-menu-editor-icon-input maxlength="8" value="${esc(g.icon)}"></label></section><section class="ka-menu-editor-section"><span class="ka-menu-editor-label">RENK</span><div class="ka-menu-editor-color-row">${colors.map(c=>`<button type="button" class="ka-menu-editor-color-swatch ${c.toLowerCase()===color.toLowerCase()?'is-selected':''}" data-menu-editor-color="${c}" style="--ka-swatch:${c}"></button>`).join('')}</div><div class="ka-menu-editor-palette"><div class="ka-menu-editor-sv" data-menu-editor-sv role="slider" tabindex="0" aria-label="Renk doygunluğu ve parlaklığı" style="--ka-picker-hue:${hsv.h};--ka-picker-x:${hsv.s*100}%;--ka-picker-y:${(1-hsv.v)*100}%"><span class="ka-menu-editor-sv__cursor"></span></div><input class="ka-menu-editor-hue" type="range" min="0" max="360" step="1" value="${Math.round(hsv.h)}" data-menu-editor-hue aria-label="Renk tonu"><label class="ka-menu-editor-native-color"><span>Tam renk seçici</span><input type="color" data-menu-editor-color-input value="${color}"></label></div><div class="ka-menu-editor-hex"><span class="ka-menu-editor-hex__swatch" data-menu-editor-hex-swatch style="--ka-swatch:${color}"></span><input data-menu-editor-hex-input value="${color.toUpperCase()}" maxlength="7" inputmode="text" aria-label="Renk kodu"></div></section></div><footer class="ka-menu-editor-actions"><button class="ka-btn ka-btn--secondary" type="button" data-menu-editor-cancel>Vazgeç</button><button class="ka-btn ka-btn--secondary" type="button" data-menu-editor-reset>↶ Varsayılana Dön</button><button class="ka-btn" type="button" data-menu-editor-save>Kaydet</button></footer></section></div>`;bindMenuCardEditor(layer,key,g,base,color)}'''
          s=s[:a]+render+'\n'+s[b:]

          a=s.index('function bindMenuCardEditor('); b=s.index('function openMenu()',a)
          bind=r'''function bindMenuCardEditor(layer,key,g,base,initialColor){const label=layer.querySelector('[data-menu-editor-label-input]'),counter=layer.querySelector('[data-menu-editor-counter]'),iconInput=layer.querySelector('[data-menu-editor-icon-input]'),colorInput=layer.querySelector('[data-menu-editor-color-input]'),hexInput=layer.querySelector('[data-menu-editor-hex-input]'),preview=layer.querySelector('.ka-menu-editor-preview'),previewIcon=layer.querySelector('[data-menu-editor-preview-icon]'),previewLabel=layer.querySelector('[data-menu-editor-preview-label]'),hexSwatch=layer.querySelector('[data-menu-editor-hex-swatch]'),sv=layer.querySelector('[data-menu-editor-sv]'),hue=layer.querySelector('[data-menu-editor-hue]');let hsv=menuColorHexToHsv(initialColor),drag=false;const picker=c=>{const n=menuColorHexToHsv(c);hsv=n;if(hue)hue.value=String(Math.round(hsv.h));if(sv){sv.style.setProperty('--ka-picker-hue',hsv.h);sv.style.setProperty('--ka-picker-x',`${hsv.s*100}%`);sv.style.setProperty('--ka-picker-y',`${(1-hsv.v)*100}%`)}};const apply=c=>{c=validMenuColor(c)||validMenuColor(hexInput?.value)||validMenuColor(colorInput?.value)||initialColor;if(preview)preview.style.setProperty('--ka-menu-editor-color',c);if(hexSwatch)hexSwatch.style.setProperty('--ka-swatch',c);if(colorInput)colorInput.value=c;if(previewIcon)previewIcon.textContent=iconInput?.value.trim()||base.icon||g.icon;if(previewLabel)previewLabel.textContent=label?.value.trim()||base.label||g.label;if(counter)counter.textContent=`${label?.value.length||0}/36`;return c};const choose=(c,sync=true)=>{c=validMenuColor(c);if(!c)return;if(hexInput)hexInput.value=c.toUpperCase();if(colorInput)colorInput.value=c;if(sync)picker(c);layer.querySelectorAll('[data-menu-editor-color]').forEach(x=>x.classList.toggle('is-selected',x.dataset.menuEditorColor?.toLowerCase()===c.toLowerCase()));apply(c)};const svEvent=e=>{const r=sv.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left)),y=Math.max(0,Math.min(r.height,e.clientY-r.top));hsv.s=r.width?x/r.width:0;hsv.v=r.height?1-y/r.height:1;sv.style.setProperty('--ka-picker-x',`${hsv.s*100}%`);sv.style.setProperty('--ka-picker-y',`${(1-hsv.v)*100}%`);choose(menuColorHsvToHex(hsv.h,hsv.s,hsv.v),false)};label?.addEventListener('input',()=>apply());iconInput?.addEventListener('input',()=>{layer.querySelectorAll('[data-menu-editor-icon]').forEach(x=>x.classList.toggle('is-selected',x.dataset.menuEditorIcon===iconInput.value));apply()});layer.querySelectorAll('[data-menu-editor-icon]').forEach(x=>x.addEventListener('click',()=>{iconInput.value=x.dataset.menuEditorIcon||'';layer.querySelectorAll('[data-menu-editor-icon]').forEach(y=>y.classList.toggle('is-selected',y===x));apply()}));layer.querySelectorAll('[data-menu-editor-color]').forEach(x=>x.addEventListener('click',()=>choose(x.dataset.menuEditorColor||'')));colorInput?.addEventListener('input',()=>choose(colorInput.value));hexInput?.addEventListener('input',()=>{let v=String(hexInput.value||'').trim().toUpperCase();if(v&&!v.startsWith('#'))v='#'+v;hexInput.value=v.slice(0,7);if(validMenuColor(hexInput.value))choose(hexInput.value)});sv?.addEventListener('pointerdown',e=>{drag=true;sv.setPointerCapture?.(e.pointerId);svEvent(e)});sv?.addEventListener('pointermove',e=>{if(drag)svEvent(e)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>sv?.addEventListener(t,()=>drag=false));hue?.addEventListener('input',()=>{hsv.h=Number(hue.value)||0;sv?.style.setProperty('--ka-picker-hue',hsv.h);choose(menuColorHsvToHex(hsv.h,hsv.s,hsv.v),false)});layer.querySelectorAll('[data-menu-editor-cancel]').forEach(x=>x.addEventListener('click',()=>{menuEditing=true;renderMenuGrid()}));layer.querySelector('[data-menu-editor-save]')?.addEventListener('click',async e=>{const btn=e.currentTarget,c=validMenuColor(hexInput?.value)||initialColor;btn.disabled=true;try{const cfg=menuLayoutConfig(),groups={...(cfg.groups||{})},prev={...(groups[key]||{})};groups[key]={...prev,label:label?.value.trim()||base.label,icon:iconInput?.value.trim()||base.icon,color:c};menuEditing=true;await global.AppConfig?.save?.({menuLayout:{...cfg,groups}});global.toast?.('Menü kartı güncellendi.');renderMenuGrid()}catch(err){console.error('[Shell/menu-editor-save]',err);global.toast?.('Menü kartı kaydedilemedi.');btn.disabled=false}});layer.querySelector('[data-menu-editor-reset]')?.addEventListener('click',async e=>{const btn=e.currentTarget;btn.disabled=true;try{const cfg=menuLayoutConfig(),groups={...(cfg.groups||{})},prev={...(groups[key]||{})};delete prev.label;delete prev.icon;delete prev.color;groups[key]=prev;menuEditing=true;await global.AppConfig?.save?.({menuLayout:{...cfg,groups}});renderMenuGrid()}catch(err){btn.disabled=false}});picker(initialColor);apply(initialColor)}'''
          s=s[:a]+bind+'\n'+s[b:]; p.write_text(s,encoding='utf-8')

          p=Path('css/design-system.css'); c=p.read_text(encoding='utf-8')
          c=c.replace('.ka-menu-editor-icon-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}', '.ka-menu-editor-icon-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;max-height:228px;overflow:auto;padding:2px;scrollbar-width:thin}',1)
          a=c.index('.ka-menu-editor-color-row{'); b=c.index('.ka-menu-editor-actions{',a)
          palette='''.ka-menu-editor-color-row{display:flex;align-items:center;gap:9px;overflow-x:auto;padding:4px 3px 7px;scrollbar-width:none}.ka-menu-editor-color-row::-webkit-scrollbar{display:none}.ka-menu-editor-color-swatch{width:37px;height:37px;flex:0 0 37px;border-radius:50%;border:2px solid var(--ka-card-bg);outline:1px solid var(--ka-border);background:var(--ka-swatch);cursor:pointer}.ka-menu-editor-color-swatch.is-selected{outline:3px solid var(--ka-primary);outline-offset:2px}.ka-menu-editor-palette{display:grid;gap:9px;padding:10px;border:1px solid var(--ka-border);border-radius:16px;background:var(--ka-muted-bg)}.ka-menu-editor-sv{position:relative;height:176px;border-radius:14px;border:1px solid var(--ka-border-strong);overflow:hidden;cursor:crosshair;touch-action:none;background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(var(--ka-picker-hue,0) 100% 50%))}.ka-menu-editor-sv__cursor{position:absolute;left:var(--ka-picker-x,100%);top:var(--ka-picker-y,0%);width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.65),0 2px 5px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none}.ka-menu-editor-hue{width:100%;height:24px;min-height:24px;padding:0;border:0;border-radius:999px;appearance:none;-webkit-appearance:none;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);cursor:pointer}.ka-menu-editor-hue::-webkit-slider-runnable-track{height:18px;background:transparent}.ka-menu-editor-hue::-webkit-slider-thumb{-webkit-appearance:none;width:25px;height:25px;margin-top:-4px;border-radius:50%;border:3px solid #fff;background:transparent;box-shadow:0 0 0 1px rgba(0,0,0,.55)}.ka-menu-editor-native-color{display:grid;grid-template-columns:1fr 54px;align-items:center;gap:10px;color:var(--ka-text-muted);font-size:11px;font-weight:800}.ka-menu-editor-native-color input[type="color"]{width:54px;height:38px;padding:2px;border:1px solid var(--ka-border);border-radius:11px;background:var(--ka-card-bg)}.ka-menu-editor-hex{display:grid;grid-template-columns:42px minmax(0,1fr);gap:9px;align-items:center}.ka-menu-editor-hex__swatch{width:42px;height:42px;border-radius:13px;background:var(--ka-swatch);border:1px solid var(--ka-border)}.ka-menu-editor-hex input{text-transform:uppercase;font-family:var(--ka-font-mono)}
'''
          c=c[:a]+palette+c[b:]; p.write_text(c,encoding='utf-8')

          p=Path('service-worker.js'); sw=p.read_text(encoding='utf-8').replace("const CACHE_ADI='oy-cache-v827';","const CACHE_ADI='oy-cache-v828';",1); p.write_text(sw,encoding='utf-8')
          p=Path('tests/menu-customization-v2.test.js'); t=p.read_text(encoding='utf-8'); t=t.replace("oy-cache-v827","oy-cache-v828"); t=t.replace("assert(shell.includes('MENU_CARD_COLOR_PRESETS')&&shell.includes('data-menu-editor-color-input')&&shell.includes('data-menu-editor-hex-input'),'Kart editörü hazır renkler, özel renk ve HEX girişi sunmalı.');", "assert(shell.includes('MENU_CARD_COLOR_PRESETS')&&shell.includes('data-menu-editor-color-input')&&shell.includes('data-menu-editor-hex-input'),'Kart editörü hazır renkler, özel renk ve HEX girişi sunmalı.');\nassert(shell.includes('data-menu-editor-sv')&&shell.includes('data-menu-editor-hue')&&shell.includes('menuColorHsvToHex'),'Kart editörü görünür tam renk paleti taşımalı.');\nassert(shell.includes('🎯')&&shell.includes('🧭')&&shell.includes('🧩'),'Kart editörü geniş ikon/şekil seti taşımalı.');"); t=t.replace("assert(design.includes('.ka-menu-edit-toggle')&&design.includes('.ka-menu-editor-sheet')&&design.includes('.ka-menu-editor-preview'),'Yeni global düzenleme ve önizleme yüzeyi design-system sahibi olmalı.');", "assert(design.includes('.ka-menu-edit-toggle')&&design.includes('.ka-menu-editor-sheet')&&design.includes('.ka-menu-editor-preview'),'Yeni global düzenleme ve önizleme yüzeyi design-system sahibi olmalı.');\nassert(design.includes('.ka-menu-editor-sv')&&design.includes('.ka-menu-editor-hue')&&design.includes('.ka-menu-editor-palette'),'Tam renk paleti canonical design-system içinde olmalı.');"); p.write_text(t,encoding='utf-8')
          PY
      - name: Verify
        run: |
          node --check js/core/shell-ui.js
          git diff --check -- js/core/shell-ui.js css/design-system.css tests/menu-customization-v2.test.js service-worker.js
          node tests/menu-customization-v2.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/shell-ui.js css/design-system.css tests/menu-customization-v2.test.js service-worker.js
          git commit -m "feat: expand menu icons and full color palette"
          git push origin HEAD:main
