name: Mevzuat Worker Check

on:
  pull_request:
    paths:
      - 'worker/mevzuat-ai/**'
      - '.github/workflows/mevzuat-worker-check.yml'
  push:
    branches: [main]
    paths:
      - 'worker/mevzuat-ai/**'
      - '.github/workflows/mevzuat-worker-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker/mevzuat-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
