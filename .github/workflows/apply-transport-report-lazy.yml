name: Apply transport report lazy optimization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lazy load Transport ReportEngine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          loader=Path('js/app-loader.js')
          s=loader.read_text(encoding='utf-8')
          old="define('transport',['js/modules/report-engine.js','js/modules/transport.js?v=893']);"
          new="define('transport',['js/modules/transport.js?v=894']);"
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('AppLoader v47','AppLoader v48',1)
          loader.write_text(s,encoding='utf-8')

          transport=Path('js/modules/transport.js')
          t=transport.read_text(encoding='utf-8')
          marker="/* Koruk Asistan — Transport tek modül\n * Veri/repository/service + araç yerleşim şeması + rapor + UI aynı dosyada.\n * Veri akışı: DeviceData/IndexedDB -> AppStore -> UI; Firestore yalnız arka plan senkronizasyonudur.\n */\n"
          assert marker in t
          helper="""(function(global){
          'use strict';
          if(global.transportReportEngineHazirla)return;
          global.transportReportEngineHazirla=async function(){
            if(!global.ReportEngine?.printReport){
              if(!global.AppLoader?.loadScript)throw new Error('report-engine-loader-yok');
              await global.AppLoader.loadScript('js/modules/report-engine.js');
            }
            if(!global.ReportEngine?.printReport)throw new Error('report-engine-hazir-degil');
            return global.ReportEngine;
          };
          })(window);

          """.replace('          ','').lstrip()
          assert 'transportReportEngineHazirla' not in t
          t=t.replace(marker,marker+helper,1)

          old_base_den="async function denetim(servisId){await prepareReports();"
          new_base_den="async function denetim(servisId){await global.transportReportEngineHazirla();await prepareReports();"
          assert old_base_den in t
          t=t.replace(old_base_den,new_base_den,1)
          old_base_month="async function takip(servisId,yil=new Date().getFullYear(),ay=new Date().getMonth()){await prepareReports();"
          new_base_month="async function takip(servisId,yil=new Date().getFullYear(),ay=new Date().getMonth()){await global.transportReportEngineHazirla();await prepareReports();"
          assert old_base_month in t
          t=t.replace(old_base_month,new_base_month,1)

          old_list="$(\'[data-print]\',ov).onclick=()=>{const keys=$$(\'[data-col]:checked\',ov).map(x=>x.value);"
          new_list="$(\'[data-print]\',ov).onclick=async()=>{const keys=$$(\'[data-col]:checked\',ov).map(x=>x.value);"
          assert old_list in t
          t=t.replace(old_list,new_list,1)
          old_list_print="window.ReportEngine?.printReport?.('Servis Öğrenci Listesi',head+table,{fileName:`${s.plaka||serviceName(s)}_Ogrenci_Listesi`,yon:$(\'[data-orientation]\',ov).value||'dikey'});"
          new_list_print="await window.transportReportEngineHazirla();await window.ReportEngine.printReport('Servis Öğrenci Listesi',head+table,{fileName:`${s.plaka||serviceName(s)}_Ogrenci_Listesi`,yon:$(\'[data-orientation]\',ov).value||'dikey'});"
          assert old_list_print in t
          t=t.replace(old_list_print,new_list_print,1)

          old_bus="async function busPrintReport(s){if(!window.ReportEngine?.printReport){toast?.('Rapor motoru hazır değil.');return}const {body,extra}=busReportBody(s);"
          new_bus="async function busPrintReport(s){try{await window.transportReportEngineHazirla()}catch(e){toast?.('Rapor motoru yüklenemedi.');return}const {body,extra}=busReportBody(s);"
          assert old_bus in t
          t=t.replace(old_bus,new_bus,1)

          old_fidelity_den="async function denetim(servisId){requireReport('transport.report.inspection');await prepare();"
          new_fidelity_den="async function denetim(servisId){requireReport('transport.report.inspection');await global.transportReportEngineHazirla();await prepare();"
          assert old_fidelity_den in t
          t=t.replace(old_fidelity_den,new_fidelity_den,1)
          old_fidelity_month="async function takip(servisId,yil=new Date().getFullYear(),ay=new Date().getMonth()){requireReport('transport.report.monthly');await prepare();"
          new_fidelity_month="async function takip(servisId,yil=new Date().getFullYear(),ay=new Date().getMonth()){requireReport('transport.report.monthly');await global.transportReportEngineHazirla();await prepare();"
          assert old_fidelity_month in t
          t=t.replace(old_fidelity_month,new_fidelity_month,1)
          transport.write_text(t,encoding='utf-8')

          build=Path('scripts/build-client-bundles.mjs')
          b=build.read_text(encoding='utf-8')
          assert "'transport.js':['js/modules/report-engine.js','js/modules/transport.js']" in b
          b=b.replace("'transport.js':['js/modules/report-engine.js','js/modules/transport.js']","'transport.js':['js/modules/transport.js']",1)
          b=b.replace('const manifest={version:30,','const manifest={version:31,',1)
          build.write_text(b,encoding='utf-8')

          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          assert 'js/app-loader.js?v=896' in html
          index.write_text(html.replace('js/app-loader.js?v=896','js/app-loader.js?v=897',1),encoding='utf-8')

          swp=Path('service-worker.js')
          sw=swp.read_text(encoding='utf-8')
          assert "const CACHE_ADI='oy-cache-v903';" in sw
          assert "'./js/app-loader.js?v=896'" in sw
          assert "'./js/modules/transport.js?v=893'" in sw
          assert "'./js/modules/report-engine.js'" in sw
          sw=sw.replace("const CACHE_ADI='oy-cache-v903';","const CACHE_ADI='oy-cache-v904';",1)
          sw=sw.replace("'./js/app-loader.js?v=896'","'./js/app-loader.js?v=897'",1)
          sw=sw.replace("'./js/modules/transport.js?v=893'","'./js/modules/transport.js?v=894'",1)
          swp.write_text(sw,encoding='utf-8')

          # Known implementation-specific regression contracts: update to lazy behavior.
          mb=Path('tests/module-bundles-smoke.test.js')
          m=mb.read_text(encoding='utf-8')
          old="assert(registry('transport').includes(\"'js/modules/report-engine.js'\"),'Transport ortak ReportEngine kullanmalı.');"
          new="assert(!registry('transport').includes(\"'js/modules/report-engine.js'\"),'Transport normal açılışta ReportEngine yükünü taşımamalı.');\nassert(source.transport.includes(\"loadScript('js/modules/report-engine.js')\")&&source.transport.includes('transportReportEngineHazirla'),'Transport rapor motorunu yalnız rapor eyleminde lazy hazırlamalı.');"
          assert old in m
          mb.write_text(m.replace(old,new,1),encoding='utf-8')

          ts=Path('tests/transport-separate-pages.test.js')
          x=ts.read_text(encoding='utf-8')
          old1="assert(loader.includes(\"define('transport',['js/modules/report-engine.js','js/modules/transport.js?v=893'])\"),'Transport yalnız canonical UI + ortak ReportEngine ile lazy yüklenmeli.');"
          new1="assert(loader.includes(\"define('transport',['js/modules/transport.js?v=894'])\"),'Transport normal açılışı yalnız canonical UI dosyasını yüklemeli.');\nassert(transport.includes('transportReportEngineHazirla')&&transport.includes(\"loadScript('js/modules/report-engine.js')\"),'Transport ReportEngine yalnız rapor eyleminde lazy yüklenmeli.');"
          assert old1 in x
          x=x.replace(old1,new1,1)
          old2="assert(build.includes(\"'transport.js':['js/modules/report-engine.js','js/modules/transport.js']\"),'Üretim Transport bundle tek canonical UI kaynağını içermeli.');"
          new2="assert(build.includes(\"'transport.js':['js/modules/transport.js']\"),'Üretim Transport bundle normal açılışta yalnız canonical UI kaynağını içermeli.');"
          assert old2 in x
          x=x.replace(old2,new2,1)
          ts.write_text(x,encoding='utf-8')

          cs=Path('tests/classic-shell-v2-smoke.test.js')
          c=cs.read_text(encoding='utf-8')
          oldc="assert(transportBundle.includes(\"'js/modules/report-engine.js'\")&&transportBundle.includes(\"'js/modules/transport.js'\")&&!transportBundle.includes('transport-service-parity.js')&&transportBundle.indexOf(\"'js/modules/report-engine.js'\")<transportBundle.indexOf(\"'js/modules/transport.js'\"),'Transport modülü ReportEngine + tek canonical Transport sırasını lazy bundle içinde korumalı.');"
          newc="assert(transportBundle.includes(\"'js/modules/transport.js'\")&&!transportBundle.includes(\"'js/modules/report-engine.js'\")&&!transportBundle.includes('transport-service-parity.js'),'Transport normal bundle yalnız canonical Transport kaynağını taşımalı; ReportEngine etkileşim anında yüklenmeli.');"
          assert oldc in c
          cs.write_text(c.replace(oldc,newc,1),encoding='utf-8')

          perf=Path('tests/runtime-performance-smoke.test.js')
          p=perf.read_text(encoding='utf-8')
          if "const transport=fs.readFileSync('js/modules/transport.js','utf8');" not in p:
              p=p.replace("const dashboard=fs.readFileSync('js/modules/dashboard.js','utf8');","const dashboard=fs.readFileSync('js/modules/dashboard.js','utf8');\nconst transport=fs.readFileSync('js/modules/transport.js','utf8');",1)
          anchor="assert(shellUi.includes('async function ensureToolsPageDependencies(page)'),'Tools rota companionları ShellUI tarafından ihtiyaç anında hazırlanmalı.');"
          add="\nassert(loader.includes(\"define('transport',['js/modules/transport.js?v=894'])\"),'Transport açılışı ReportEngine'i eager yüklememeli.');\nassert(transport.includes('async function(){')&&transport.includes(\"await global.AppLoader.loadScript('js/modules/report-engine.js')\"),'Transport rapor motorunu ihtiyaç anında yüklemeli.');\nassert(sw.includes(\"'./js/modules/report-engine.js'\"),'Lazy ReportEngine çevrimdışı PWA kabuğunda kalmalı.');"
          assert anchor in p
          perf.write_text(p.replace(anchor,anchor+add,1),encoding='utf-8')
          PY
      - name: Syntax checks
        run: |
          node --check js/app-loader.js
          node --check js/modules/transport.js
          node --check service-worker.js
          node --check scripts/build-client-bundles.mjs
      - name: Build bundle smoke
        run: |
          node scripts/build-client-bundles.mjs
          node tests/module-bundles-smoke.test.js
      - name: Full client regression suite
        run: node scripts/run-client-tests.mjs
      - name: Client architecture audit
        run: node scripts/check-client-architecture.mjs
      - name: Commit verified optimization
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app-loader.js js/modules/transport.js scripts/build-client-bundles.mjs index.html service-worker.js tests/module-bundles-smoke.test.js tests/transport-separate-pages.test.js tests/classic-shell-v2-smoke.test.js tests/runtime-performance-smoke.test.js
          git commit -m 'perf: lazy load transport report engine'
          git push origin main
