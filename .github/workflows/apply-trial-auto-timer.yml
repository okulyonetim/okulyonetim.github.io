name: Apply automatic trial timer redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-trial-auto-timer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical trial timer surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def between(text, start, end, replacement, label):
              i=text.find(start)
              if i<0:
                  raise SystemExit(f'{label}: start marker not found')
              j=text.find(end,i)
              if j<0:
                  raise SystemExit(f'{label}: end marker not found')
              return text[:i]+replacement+text[j:]

          # ---------------- Academic canonical module ----------------
          path=Path('js/modules/academic.js')
          text=path.read_text(encoding='utf-8')

          old="function canEditExams(){return global.PermissionService?.can?.('academic.exams.edit','edit')??(typeof duzenleyebilir==='function'&&duzenleyebilir('sinavIslemleri'))}"
          new="""function canEditExams(){
          const scoped=global.PermissionService?.can?.('academic.exams.edit','edit');
          const legacy=typeof duzenleyebilir==='function'&&duzenleyebilir('sinavIslemleri');
          return scoped===true||legacy===true;
          }"""
          if old not in text: raise SystemExit('canEditExams marker not found')
          text=text.replace(old,new,1)

          timer_repl=r'''function timerState(d){
          const state=trialCounterState(d),valid=state.totalSeconds>0&&d?.tarih===today();
          return{run:state.running,valid,remaining:state.remaining,label:state.label,status:state.status,automatic:state.automatic,secondsUntilStart:state.secondsUntilStart||0};
          }
          '''
          text=between(text,'function timerState(d){','\nconst syncDefs=',timer_repl,'timerState')

          state_repl=r'''function trialClockMs(d,timeValue){
          const raw=String(timeValue||'').trim();
          if(!d?.tarih||!/^\d{1,2}:\d{2}/.test(raw))return 0;
          const clock=raw.slice(0,5),ms=new Date(`${d.tarih}T${clock}:00`).getTime();
          return Number.isNaN(ms)?0:ms;
          }
          function trialAutomaticStartMs(d){
          const first=trialSchedule(d)[0]||{},clock=first.start&&first.start!=='—'?first.start:d?.baslamaSaati;
          return trialClockMs(d,clock);
          }
          function trialCounterState(d,nowMs=Date.now()){
          const schedule=trialSchedule(d),totalSeconds=Math.max(0,schedule.reduce((t,x)=>t+(Number(x.minutes)||0),0)*60),manualActive=d?.sayacDurumu?.aktif===true,manualRaw=manualActive&&d?.sayacDurumu?.baslatmaTarihi?new Date(d.sayacDurumu.baslatmaTarihi).getTime():0,manualStart=Number.isFinite(manualRaw)?manualRaw:0,autoStart=trialAutomaticStartMs(d),startMs=manualStart||autoStart,automatic=!manualStart&&!!autoStart,endMs=startMs&&totalSeconds?startMs+totalSeconds*1000:0;
          if(!totalSeconds)return{running:false,status:'invalid',label:'Süre bilgisi eksik',remaining:0,totalSeconds:0,progress:0,segmentIndex:-1,segmentRemaining:0,startMs,endMs,automatic,secondsUntilStart:0};
          if(!startMs)return{running:false,status:'ready',label:'Başlangıç saati bekleniyor',remaining:totalSeconds,totalSeconds,progress:0,segmentIndex:-1,segmentRemaining:totalSeconds,startMs:0,endMs:0,automatic:false,secondsUntilStart:0};
          const secondsUntilStart=(startMs-nowMs)/1000;
          if(secondsUntilStart>0)return{running:false,status:'scheduled',label:'Başlamayı bekliyor',remaining:totalSeconds,totalSeconds,progress:0,segmentIndex:-1,segmentRemaining:totalSeconds,startMs,endMs,automatic,secondsUntilStart};
          const elapsed=Math.max(0,(nowMs-startMs)/1000),remaining=Math.max(0,totalSeconds-elapsed),progress=Math.max(0,Math.min(100,elapsed/totalSeconds*100));
          if(remaining<=0)return{running:false,status:'done',label:'Tamamlandı',remaining:0,totalSeconds,progress:100,segmentIndex:schedule.length-1,segmentRemaining:0,startMs,endMs,automatic,secondsUntilStart:0};
          let cursor=0,index=0,segmentElapsed=0;
          for(let i=0;i<schedule.length;i++){const seg=Math.max(0,(Number(schedule[i].minutes)||0)*60);if(elapsed<cursor+seg||i===schedule.length-1){index=i;segmentElapsed=Math.max(0,elapsed-cursor);break}cursor+=seg}
          const segmentSeconds=Math.max(0,(Number(schedule[index]?.minutes)||0)*60),segmentRemaining=Math.max(0,segmentSeconds-segmentElapsed),isBreak=schedule[index]?.name==='Ara';
          return{running:true,status:isBreak?'break':'active',label:schedule[index]?.name||'Sınav',remaining,totalSeconds,progress,segmentIndex:index,segmentRemaining,startMs,endMs,automatic,secondsUntilStart:0};
          }
          '''
          text=between(text,'function trialCounterState(d){','\nfunction trialDateStatus',state_repl,'trialCounterState')

          trials_repl=r'''function trials(){
          const list=trialSort(arr('denemeSinavlari').filter(s=>match([s.ad,s.sinflar,s.siniflar,s.tarih,s.oturumTuru,s.notlar]))),soon=list.filter(s=>{const d=examDayDiff(s.tarih);return d!==null&&d>=0&&d<=7}).length,activeCount=list.filter(s=>trialCounterState(s).running).length;
          const add=canEditExams()?'<button class="ka-btn ka-trial-add" type="button" data-trial-new data-ka-permission="academic.exams.edit" data-ka-write="academic.exams.edit">＋ Deneme Sınavı Ekle</button>':'';
          return{count:list.length,html:`<section class="ka-stack ka-trial-page"><article class="ka-trial-hero"><div><span class="ka-trial-hero__icon">⌛</span><div><h2>Deneme Sınavları</h2><p>Deneme takvimini, oturumları ve otomatik canlı sınav sayacını tek ekrandan yönetin.</p></div></div>${add}</article><div class="ka-trial-summary"><article><b>${list.length}</b><span>Toplam deneme</span></article><article><b>${soon}</b><span>7 gün içinde</span></article><article><b>${activeCount}</b><span>Aktif sayaç</span></article></div><div class="ka-trial-list">${list.length?list.map(s=>{const counter=trialCounterState(s),editable=SinavlarService?.denemeDuzenlenebilirMi?.(s),running=counter.running,ds=trialDateStatus(s),schedule=trialSchedule(s),total=totalMin(s),first=schedule[0]||{},stateText=running?counter.label:counter.status==='scheduled'?`Başlangıç ${first.start||'—'}`:counter.status==='done'?'Tamamlandı':'Sayaç hazır';return`<article class="ka-trial-card ${ds.tone} ${running?'is-live':''}" data-trial-open="${esc(s.id)}"><div class="ka-trial-card__icon">⌛</div><div class="ka-trial-card__main"><div class="ka-trial-card__head"><div><strong>${esc(s.ad||'Deneme Sınavı')}</strong><div class="ka-row ka-row--wrap"><span class="ka-badge">${esc(s.oturumTuru||'Tek Oturum')}</span>${running?'<span class="ka-trial-live"><i></i> CANLI</span>':''}</div></div><span class="ka-trial-date ${ds.tone}">${esc(ds.label)}</span></div><div class="ka-trial-info"><div><span>📅</span><b>${esc(date(s.tarih))}</b></div>${schedule.map(x=>`<div><span>${x.icon}</span><b>${esc(x.name)}:</b> ${esc(`${x.start}–${x.end}`)}${x.minutes?` <small>(${trialMinutesText(x.minutes)})</small>`:''}</div>`).join('')}${s.sinflar||s.siniflar?`<div><span>👥</span><b>Sınıflar:</b> ${esc(s.sinflar||s.siniflar)}</div>`:''}${s.notlar?`<div><span>💬</span>${esc(s.notlar)}</div>`:''}</div>${running?`<div class="ka-trial-card__live"><div><strong>${esc(fmtSec(counter.remaining))}</strong><span>${esc(counter.label)}</span></div><progress max="100" value="${Math.round(counter.progress)}"></progress></div>`:`<div class="ka-trial-card__footnote"><span>${esc(stateText)}</span><span>${counter.status==='done'?'Sınav sona erdi':`Toplam ${esc(trialMinutesText(total))} · Sayaç detayları ›`}</span></div>`}</div><div class="ka-trial-card__actions">${editable?`<button class="ka-btn ka-btn--secondary ka-btn--sm" type="button" data-trial-edit="${esc(s.id)}">Düzenle</button>`:''}</div></article>`}).join(''):'<div class="ka-empty">Henüz deneme sınavı eklenmedi. “Deneme Sınavı Ekle” ile başlayın.</div>'}</div></section>`};
          }
          '''
          text=between(text,'function trials(){','\nlet trialCounterId',trials_repl,'trials')

          counter_repl=r'''function trialCounterScheduleHtml(d,state){
          const schedule=trialSchedule(d);return`<section class="ka-trial-counter__section"><div class="ka-trial-counter__section-title">OTURUM TAKVİMİ</div><div class="ka-trial-counter__schedule">${schedule.map((x,i)=>{const current=state.running&&i===state.segmentIndex,done=state.status==='done'||(state.running&&i<state.segmentIndex);return`<div class="ka-trial-counter__row ${current?'is-current':''}"><span class="ka-trial-counter__num">${i+1}</span><div><b>${esc(x.name)}</b><small>${esc(x.start)}–${esc(x.end)} · ${esc(trialMinutesText(x.minutes))}</small></div><span class="ka-trial-counter__tag">${current?'AKTİF':done?'BİTTİ':'SIRADA'}</span></div>`}).join('')}</div></section>`;
          }
          function trialCounterFollowHtml(d){
          const schedule=trialSchedule(d),first=schedule[0]||{},last=schedule[schedule.length-1]||{};return`<section class="ka-trial-counter__section"><div class="ka-trial-counter__section-title">SINAVI TAKİP ET</div><div class="ka-trial-counter__follow"><div><span>📋</span><small>Toplam Süre</small><b>${esc(trialMinutesText(totalMin(d)))}</b></div><div><span>▶️</span><small>Başlangıç</small><b>${esc(first.start||'—')}</b></div><div><span>🏁</span><small>Bitiş</small><b>${esc(last.end||'—')}</b></div></div></section>`;
          }
          function trialCounterMainHtml(d,state){
          if(state.status==='invalid'||state.status==='ready')return`<section class="ka-trial-counter__main"><div class="ka-trial-counter__ready"><span>⚠️</span><h3>Sayaç bilgisi eksik</h3><p>Tarih, başlangıç saati ve sınav süresi bilgilerini kontrol edin.</p></div></section>`;
          if(state.status==='scheduled')return`<section class="ka-trial-counter__main"><div class="ka-trial-counter__ready is-scheduled"><span>⏳</span><h3>Sınava ${esc(fmtSec(state.secondsUntilStart))} kaldı</h3><p>Sayaç ${esc(trialSchedule(d)[0]?.start||'—')} saatinde otomatik başlayacak.</p></div></section>`;
          if(state.status==='done')return`<section class="ka-trial-counter__main"><div class="ka-trial-counter__ready is-done"><span>✓</span><h3>Sınav tamamlandı</h3><p>Toplam süre: ${esc(trialMinutesText(totalMin(d)))}</p></div></section>`;
          const schedule=trialSchedule(d),seg=schedule[state.segmentIndex]||schedule[0]||{},segmentTotal=Math.max(1,(Number(seg.minutes)||0)*60),segmentRemaining=Math.max(0,state.segmentRemaining),segmentProgress=Math.max(0,Math.min(100,100-segmentRemaining/segmentTotal*100)),last=schedule[schedule.length-1]||{},classes=d.sinflar||d.siniflar||'—';
          return`<section class="ka-trial-counter__main"><div class="ka-trial-counter__session"><i></i><span>AKTİF OTURUM</span><b>${esc(String(state.label||'Sınav').toLocaleUpperCase('tr'))}</b></div><div class="ka-trial-counter__focus"><div class="ka-trial-counter__ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52" pathLength="100"></circle><circle class="value" cx="60" cy="60" r="52" pathLength="100" stroke-dasharray="${Math.round(segmentProgress)} 100"></circle></svg><div><small>KALAN SÜRE</small><strong>${esc(fmtSec(segmentRemaining))}</strong><span>SAAT · DAKİKA · SANİYE</span></div></div><div class="ka-trial-counter__meta"><div><span>◷</span><small>BİTİŞ SAATİ</small><b>${esc(seg.end||last.end||'—')}</b></div><div><span>▣</span><small>BUGÜN</small><b>${esc(date(d.tarih))}</b></div><div><span>👥</span><small>SINIFLAR</small><b>${esc(classes)}</b></div></div></div></section>`;
          }
          function trialCounterOverviewHtml(d,state){
          const schedule=trialSchedule(d),seg=schedule[state.segmentIndex]||schedule[0]||{},last=schedule[schedule.length-1]||{};
          if(state.status==='done')return`<div class="ka-trial-counter__overview is-done"><div><small>SINAV DURUMU</small><strong>Tamamlandı</strong></div><div><small>BİTİŞ</small><strong>${esc(last.end||'—')}</strong></div></div>`;
          if(state.status==='scheduled')return`<div class="ka-trial-counter__overview is-scheduled"><div><small>BAŞLAMASINA</small><strong>${esc(fmtSec(state.secondsUntilStart))}</strong></div><div><small>BAŞLANGIÇ</small><strong>${esc(schedule[0]?.start||'—')}</strong></div></div>`;
          if(!state.running)return'';
          const overall=Math.round(state.progress);return`<div class="ka-trial-counter__overview"><div><small>${esc(String(seg.name||'Oturum').toLocaleUpperCase('tr'))}</small><strong>${esc(fmtSec(state.segmentRemaining))}</strong><span>Kalan süre</span></div><div><small>TOPLAM SINAV</small><strong class="is-total">${esc(fmtSec(state.remaining))}</strong><span>Kalan süre</span></div><div class="ka-trial-counter__mini"><svg viewBox="0 0 48 48" aria-hidden="true"><circle class="track" cx="24" cy="24" r="19" pathLength="100"></circle><circle class="value" cx="24" cy="24" r="19" pathLength="100" stroke-dasharray="${overall} 100"></circle></svg><b>%${overall}</b></div></div>`;
          }
          function renderTrialCounter(){
          const ov=document.getElementById('kaTrialCounterOverlay');if(!ov||!trialCounterId)return;const d=arr('denemeSinavlari').find(x=>x.id===trialCounterId);if(!d){closeTrialCounter();return}const state=trialCounterState(d),status=state.status==='done'?'✓ Sınav tamamlandı':state.status==='scheduled'?'◷ Başlamayı bekliyor':state.running?'● Sınav devam ediyor':'Sayaç hazır';ov.innerHTML=`<div class="ka-trial-counter__top"><button class="ka-icon-button" type="button" data-trial-counter-close aria-label="Geri">←</button><div><strong>${esc(d.ad||'Deneme Sınavı')}</strong><span class="ka-trial-counter__state ${state.running?'is-live':''}">${esc(status)}</span></div></div><div class="ka-trial-counter__scroll"><div class="ka-trial-counter__shell">${trialCounterMainHtml(d,state)}${trialCounterScheduleHtml(d,state)}${trialCounterFollowHtml(d)}</div></div>${trialCounterOverviewHtml(d,state)}`;ov.querySelector('[data-trial-counter-close]')?.addEventListener('click',closeTrialCounter);
          }
          function openTrialCounter(id){const d=arr('denemeSinavlari').find(x=>x.id===id);if(!d)return;trialCounterId=id;let ov=document.getElementById('kaTrialCounterOverlay');if(!ov){ov=document.createElement('section');ov.id='kaTrialCounterOverlay';ov.className='ka-trial-counter';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');document.body.appendChild(ov)}document.body.classList.add('ka-trial-counter-open');renderTrialCounter()}
          '''
          text=between(text,'function trialCounterScheduleHtml','\nconst YPL_AY_NO',counter_repl,'counter view')

          old_interval="timer=setInterval(()=>{if(mounted&&active==='trial'&&arr('denemeSinavlari').some(x=>x.sayacDurumu?.aktif)){render();renderTrialCounter()}},1000);"
          new_interval="timer=setInterval(()=>{if(!mounted||active!=='trial')return;const needsTick=arr('denemeSinavlari').some(x=>{const s=trialCounterState(x);return s.running||(s.status==='scheduled'&&s.secondsUntilStart<=60)});if(needsTick)render();if(trialCounterId)renderTrialCounter()},1000);"
          if old_interval not in text: raise SystemExit('academic timer interval marker not found')
          text=text.replace(old_interval,new_interval,1)
          path.write_text(text,encoding='utf-8')

          # ---------------- Dashboard canonical module ----------------
          path=Path('js/modules/dashboard.js')
          text=path.read_text(encoding='utf-8')
          dash_repl=r'''function trialTotalMin(d){return d?.oturumTuru==='İki Oturum'?(Number(d.sozelSuresiDk)||0)+(Number(d.araSureDk)||0)+(Number(d.sayisalSuresiDk)||0):Number(d?.sinavSuresiDk)||0}
          function trialStartClock(d){return d?.oturumTuru==='İki Oturum'?(d.sozelBaslama||d.baslamaSaati||''):d?.baslamaSaati||''}
          function trialStartMs(d){const clock=String(trialStartClock(d)||'').slice(0,5);if(!d?.tarih||!/^\d{1,2}:\d{2}$/.test(clock))return 0;const ms=new Date(`${d.tarih}T${clock}:00`).getTime();return Number.isNaN(ms)?0:ms}
          function trialTimerState(d,nowMs=Date.now()){
          const mins=trialTotalMin(d),total=Math.max(0,mins*60),manualActive=d?.sayacDurumu?.aktif===true,manualRaw=manualActive&&d?.sayacDurumu?.baslatmaTarihi?new Date(d.sayacDurumu.baslatmaTarihi).getTime():0,manualStart=Number.isFinite(manualRaw)?manualRaw:0,start=manualStart||trialStartMs(d),end=start&&total?start+total*1000:0;
          if(!start||total<=0)return{run:false,status:'ready',remaining:Math.max(0,total),label:total>0?'Başlangıç bekleniyor':'Süre eksik',progress:0,start,end,secondsUntilStart:0};
          const until=(start-nowMs)/1000;if(until>0)return{run:false,status:'scheduled',remaining:total,label:'Başlamayı bekliyor',progress:0,start,end,secondsUntilStart:until};
          const elapsed=Math.max(0,(nowMs-start)/1000),remaining=Math.max(0,total-elapsed),progress=Math.max(0,Math.min(100,elapsed/total*100));if(remaining<=0)return{run:false,status:'done',remaining:0,label:'Tamamlandı',progress:100,start,end,secondsUntilStart:0};
          if(d.oturumTuru==='İki Oturum'){const verbal=(Number(d.sozelSuresiDk)||0)*60,br=(Number(d.araSureDk)||0)*60;if(elapsed<verbal)return{run:true,status:'active',remaining,label:'Sözel oturum',progress,start,end,secondsUntilStart:0};if(elapsed<verbal+br)return{run:true,status:'break',remaining,label:'Ara',progress,start,end,secondsUntilStart:0};return{run:true,status:'active',remaining,label:'Sayısal oturum',progress,start,end,secondsUntilStart:0}}
          return{run:true,status:'active',remaining,label:'Sınav sürüyor',progress,start,end,secondsUntilStart:0};
          }
          function trialFmt(sec){sec=Math.max(0,Math.floor(Number(sec)||0));return`${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor((sec%3600)/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
          function trialLiveRows(){return arr('denemeSinavlari').map(exam=>({exam,state:trialTimerState(exam)})).filter(x=>x.state.run&&x.state.remaining>0).sort((a,b)=>a.state.end-b.state.end)}
          function trialCounterSection(){const list=trialLiveRows().slice(0,1);if(!list.length)return'';const exam='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l3 3v17H6z"/><path d="M14 2v4h4M9 11h6M9 15h6"/></svg>';return `<section class="kh-trial-live" data-home-section="trial-counter">${list.map(({exam:x,state:st})=>{const finish=x.oturumTuru==='İki Oturum'?(x.sayisalBitis||x.bitisSaati||'—'):(x.bitisSaati||'—'),classes=x.sinflar||x.siniflar||'—',pct=Math.round(st.progress);return`<button type="button" class="kh-trial-live__card" data-dash-route="academic" data-dash-page="trial" data-dash-title="Deneme Sınavları"><span class="kh-trial-live__head"><span class="kh-trial-live__badge"><i></i> AKTİF DENEME SINAVI</span><span class="kh-trial-live__detail">Detaylar ›</span></span><span class="kh-trial-live__title">${esc(x.ad||x.baslik||'Deneme sınavı')}</span><span class="kh-trial-live__session" data-dash-trial-label="${esc(x.id)}">${esc(st.label)}</span><span class="kh-trial-live__body"><span class="kh-trial-live__ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52" pathLength="100"></circle><circle class="value" data-dash-trial-progress="${esc(x.id)}" cx="60" cy="60" r="52" pathLength="100" stroke-dasharray="${pct} 100"></circle></svg><span><small>KALAN SÜRE</small><strong data-dash-trial-timer="${esc(x.id)}">${esc(trialFmt(st.remaining))}</strong></span></span><span class="kh-trial-live__meta"><span><small>◷ BİTİŞ</small><b>${esc(finish)}</b></span><span><small>▣ TARİH</small><b>${esc(date(x.tarih))}</b></span><span><small>👥 SINIFLAR</small><b>${esc(classes)}</b></span></span></span></button>`}).join('')}</section>`}
          function refreshTrialTimers(root=document){const live=trialLiveRows().slice(0,1),nodes=[...root.querySelectorAll?.('[data-dash-trial-timer]')||[]],wanted=live.map(x=>String(x.exam.id)).join('|'),shown=nodes.map(x=>String(x.dataset.dashTrialTimer||'')).join('|');if(wanted!==shown){if(mounted)queueRender();return}nodes.forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialTimer));if(item)el.textContent=trialFmt(item.state.remaining)});root.querySelectorAll?.('[data-dash-trial-label]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialLabel));if(item)el.textContent=item.state.label});root.querySelectorAll?.('[data-dash-trial-progress]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialProgress));if(item)el.setAttribute('stroke-dasharray',`${Math.round(item.state.progress)} 100`)})}
          '''
          text=between(text,'function trialTotalMin(d){','\nfunction schoolClassLevel',dash_repl,'dashboard trial')
          path.write_text(text,encoding='utf-8')

          # ---------------- Central design system only ----------------
          path=Path('css/design-system.css')
          text=path.read_text(encoding='utf-8')
          marker='/* DENEME AUTO TIMER — CANONICAL 2026 */'
          if marker in text: raise SystemExit('trial timer CSS marker already exists')
          css=r'''
          /* DENEME AUTO TIMER — CANONICAL 2026 */
          .kh-trial-live{width:100%;min-width:0}.kh-trial-live__card{width:100%;display:block;padding:16px;border:1px solid color-mix(in srgb,var(--ka-module-transport-1) 28%,var(--ka-border));border-radius:22px;background:radial-gradient(circle at 88% 12%,color-mix(in srgb,var(--ka-primary) 14%,transparent),transparent 34%),linear-gradient(145deg,color-mix(in srgb,var(--ka-module-transport-1) 9%,var(--ka-card-bg)),color-mix(in srgb,var(--ka-module-exams-1) 6%,var(--ka-card-bg)));color:var(--ka-text);box-shadow:var(--ka-shadow-md);text-align:left;cursor:pointer}.kh-trial-live__head{display:flex;align-items:center;justify-content:space-between;gap:10px}.kh-trial-live__badge{display:inline-flex;align-items:center;gap:7px;color:var(--ka-module-transport-1);font-size:10px;font-weight:900;letter-spacing:.07em}.kh-trial-live__badge i{width:7px;height:7px;border-radius:50%;background:var(--ka-success);box-shadow:0 0 0 5px color-mix(in srgb,var(--ka-success) 12%,transparent)}.kh-trial-live__detail{color:var(--ka-primary);font-size:11px;font-weight:850}.kh-trial-live__title{display:block;margin-top:10px;font-size:20px;font-weight:900;line-height:1.2}.kh-trial-live__session{display:block;margin-top:4px;color:var(--ka-text-muted);font-size:12px;font-weight:750}.kh-trial-live__body{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);gap:18px;align-items:center;margin-top:14px}.kh-trial-live__ring{position:relative;width:min(190px,42vw);aspect-ratio:1;display:grid;place-items:center}.kh-trial-live__ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.kh-trial-live__ring circle{fill:none;stroke-width:8}.kh-trial-live__ring .track{stroke:color-mix(in srgb,var(--ka-border) 75%,transparent)}.kh-trial-live__ring .value{stroke:var(--ka-module-transport-1);stroke-linecap:round}.kh-trial-live__ring>span{position:relative;z-index:1;text-align:center}.kh-trial-live__ring small{display:block;color:var(--ka-text-muted);font-size:8px;font-weight:850;letter-spacing:.09em}.kh-trial-live__ring strong{display:block;margin-top:5px;font-family:var(--ka-font-mono);font-size:20px;letter-spacing:.03em}.kh-trial-live__meta{display:grid;gap:8px}.kh-trial-live__meta>span{display:grid;gap:2px;padding:10px 11px;border:1px solid var(--ka-border);border-radius:13px;background:color-mix(in srgb,var(--ka-muted-bg) 82%,transparent)}.kh-trial-live__meta small{color:var(--ka-text-muted);font-size:8px;font-weight:850;letter-spacing:.05em}.kh-trial-live__meta b{font-size:12px;overflow-wrap:anywhere}
          .ka-trial-add{box-shadow:0 10px 22px color-mix(in srgb,var(--ka-primary) 18%,transparent)}
          .ka-trial-counter{background:radial-gradient(circle at 50% -10%,color-mix(in srgb,var(--ka-primary) 11%,transparent),transparent 34%),var(--ka-app-bg)}.ka-trial-counter__top{grid-template-columns:44px minmax(0,1fr);background:color-mix(in srgb,var(--ka-app-bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.ka-trial-counter__top>div{display:flex;flex-direction:column;align-items:flex-start}.ka-trial-counter__main{background:linear-gradient(145deg,color-mix(in srgb,var(--ka-module-transport-1) 6%,var(--ka-card-bg)),var(--ka-card-bg));border-color:color-mix(in srgb,var(--ka-module-transport-1) 20%,var(--ka-border))}.ka-trial-counter__session{justify-content:flex-start;flex-wrap:wrap;margin-bottom:16px}.ka-trial-counter__session i{width:7px;height:7px;border-radius:50%;background:var(--ka-success);box-shadow:0 0 0 5px color-mix(in srgb,var(--ka-success) 12%,transparent)}.ka-trial-counter__session span{padding:5px 8px;border-radius:8px;background:color-mix(in srgb,var(--ka-module-transport-1) 13%,var(--ka-card-bg));color:var(--ka-module-transport-1);font-size:9px;font-weight:900;letter-spacing:.08em}.ka-trial-counter__session b{flex-basis:100%;margin-top:7px;color:var(--ka-module-transport-1);font-size:17px;letter-spacing:.02em}.ka-trial-counter__focus{display:grid;grid-template-columns:minmax(250px,1.15fr) minmax(180px,.85fr);gap:20px;align-items:center}.ka-trial-counter__ring{width:min(330px,72vw)}.ka-trial-counter__ring .value{stroke:var(--ka-module-transport-1)}.ka-trial-counter__ring strong{font-size:34px}.ka-trial-counter__meta{grid-template-columns:1fr;gap:9px;margin-top:0}.ka-trial-counter__meta>div{display:grid;grid-template-columns:36px minmax(0,1fr);grid-template-rows:auto auto;column-gap:9px;align-items:center;text-align:left;padding:11px}.ka-trial-counter__meta>div>span{grid-row:1/3;width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:var(--ka-primary-soft);color:var(--ka-primary);font-size:18px}.ka-trial-counter__meta small{margin:0}.ka-trial-counter__meta b{margin:2px 0 0;font-size:13px}.ka-trial-counter__section{background:color-mix(in srgb,var(--ka-card-bg) 94%,var(--ka-muted-bg))}.ka-trial-counter__overview{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 62px;gap:10px;align-items:center;padding:12px max(14px,var(--ka-safe-right)) calc(12px + var(--ka-safe-bottom)) max(14px,var(--ka-safe-left));border-top:1px solid color-mix(in srgb,var(--ka-module-transport-1) 22%,var(--ka-border));background:color-mix(in srgb,var(--ka-card-bg) 95%,transparent);box-shadow:0 -10px 28px color-mix(in srgb,var(--ka-text) 9%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.ka-trial-counter__overview>div:not(.ka-trial-counter__mini){min-width:0;padding-right:10px;border-right:1px solid var(--ka-border)}.ka-trial-counter__overview small,.ka-trial-counter__overview span{display:block;color:var(--ka-text-muted);font-size:8px;font-weight:800;letter-spacing:.05em}.ka-trial-counter__overview strong{display:block;margin:4px 0 2px;font-family:var(--ka-font-mono);font-size:18px;color:var(--ka-module-transport-1)}.ka-trial-counter__overview strong.is-total{color:var(--ka-success)}.ka-trial-counter__mini{position:relative;width:52px;height:52px;display:grid;place-items:center}.ka-trial-counter__mini svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.ka-trial-counter__mini circle{fill:none;stroke-width:6}.ka-trial-counter__mini .track{stroke:var(--ka-border)}.ka-trial-counter__mini .value{stroke:var(--ka-success);stroke-linecap:round}.ka-trial-counter__mini b{position:relative;z-index:1;font-size:9px}.ka-trial-counter__overview.is-scheduled,.ka-trial-counter__overview.is-done{grid-template-columns:1fr 1fr}.ka-trial-counter__ready.is-scheduled>span{color:var(--ka-warning)}.ka-trial-counter__ready.is-done>span{color:var(--ka-success)}
          [data-theme="dark"] .kh-trial-live__card{background:radial-gradient(circle at 86% 10%,color-mix(in srgb,var(--ka-primary) 13%,transparent),transparent 35%),linear-gradient(145deg,color-mix(in srgb,var(--ka-module-transport-1) 16%,var(--ka-card-bg)),color-mix(in srgb,var(--ka-module-exams-2) 11%,var(--ka-card-bg)));box-shadow:0 16px 34px rgba(0,0,0,.32)}[data-theme="dark"] .ka-trial-counter__main{background:linear-gradient(145deg,color-mix(in srgb,var(--ka-module-transport-1) 10%,var(--ka-card-bg)),var(--ka-card-bg))}
          @media(max-width:640px){.kh-trial-live__card{padding:14px}.kh-trial-live__title{font-size:18px}.kh-trial-live__body{grid-template-columns:145px minmax(0,1fr);gap:11px}.kh-trial-live__ring{width:142px}.kh-trial-live__ring strong{font-size:17px}.kh-trial-live__meta>span{padding:8px}.ka-trial-counter{bottom:calc(var(--ka-bottom-nav-height) + var(--ka-safe-bottom))}.ka-trial-counter__scroll{padding-top:10px}.ka-trial-counter__focus{grid-template-columns:1fr;gap:12px}.ka-trial-counter__ring{width:min(270px,72vw)}.ka-trial-counter__ring strong{font-size:29px}.ka-trial-counter__meta{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.ka-trial-counter__meta>div{display:block;text-align:center;padding:9px 5px}.ka-trial-counter__meta>div>span{margin:0 auto 5px}.ka-trial-counter__meta b{font-size:10px}.ka-trial-counter__overview{grid-template-columns:1fr 1fr 52px;padding-top:10px;padding-bottom:10px}.ka-trial-counter__overview strong{font-size:15px}.ka-trial-counter__mini{width:46px;height:46px}}
          @media(max-width:390px){.kh-trial-live__body{grid-template-columns:1fr}.kh-trial-live__ring{width:165px;margin:0 auto}.kh-trial-live__meta{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.kh-trial-live__meta>span{min-width:0;padding:7px 5px;text-align:center}.kh-trial-live__meta small{font-size:7px}.kh-trial-live__meta b{font-size:10px}.ka-trial-counter__meta{grid-template-columns:1fr}.ka-trial-counter__overview{grid-template-columns:1fr 1fr 46px;gap:6px}.ka-trial-counter__overview>div:not(.ka-trial-counter__mini){padding-right:6px}.ka-trial-counter__overview small,.ka-trial-counter__overview span{font-size:7px}.ka-trial-counter__overview strong{font-size:13px}}
          '''
          text=text.rstrip()+"\n"+css.strip()+"\n"
          path.write_text(text,encoding='utf-8')

          # ---------------- Dashboard smoke expectation: automatic state ----------------
          path=Path('tests/dashboard-card-routes-smoke.test.js')
          text=path.read_text(encoding='utf-8')
          old1="assert(dash.includes(\"arr('denemeSinavlari')\")&&dash.includes('sayacDurumu?.aktif')&&dash.includes('baslatmaTarihi'),'Dashboard deneme sayacı gerçek denemeSinavlari.sayacDurumu modelini kullanmalı.');"
          new1="assert(dash.includes(\"arr('denemeSinavlari')\")&&dash.includes('trialStartMs')&&dash.includes(\"status:'scheduled'\")&&dash.includes('sayacDurumu?.aktif'),'Dashboard deneme sayacı kayıtlı tarih/saatten otomatik çalışmalı ve legacy manuel sayaçla uyumlu kalmalı.');"
          old2="assert(dash.includes(\"function trialCounterSection(){const list=arr('denemeSinavlari').filter(x=>x?.sayacDurumu?.aktif===true)\"),'Dashboard deneme kartı yalnız başlatılmış gerçek sayaç için görünmeli.');"
          new2="assert(dash.includes(\"function trialCounterSection(){const list=trialLiveRows().slice(0,1)\")&&dash.includes(\".filter(x=>x.state.run&&x.state.remaining>0)\"),'Dashboard deneme kartı yalnız zaman aralığı gerçekten aktifken görünmeli.');"
          if old1 not in text or old2 not in text: raise SystemExit('dashboard smoke trial markers not found')
          text=text.replace(old1,new1,1).replace(old2,new2,1)
          path.write_text(text,encoding='utf-8')

          # ---------------- Focused regression test ----------------
          Path('tests/trial-auto-timer.test.js').write_text(r'''const fs=require('fs');
          const assert=require('assert');
          const academic=fs.readFileSync('js/modules/academic.js','utf8');
          const dash=fs.readFileSync('js/modules/dashboard.js','utf8');
          const css=fs.readFileSync('css/design-system.css','utf8');
          new Function(academic);new Function(dash);
          assert(academic.includes('function trialAutomaticStartMs')&&academic.includes("status:'scheduled'")&&academic.includes("activeCount=list.filter(s=>trialCounterState(s).running).length"),'Academic deneme sayacı tarih+saat üzerinden otomatik duruma geçmeli.');
          assert(academic.includes("return scoped===true||legacy===true"),'Deneme ekleme butonu canonical ve legacy sınav düzenleme yetkisini birlikte tanımalı.');
          assert(academic.includes('ka-trial-counter__overview')&&academic.includes('Sınav devam ediyor')&&academic.includes('Sınav tamamlandı'),'Detay sayaç görünümü aktif, bekleyen ve tamamlanan durumlarını taşımalı.');
          assert(dash.includes('function trialLiveRows()')&&dash.includes(".filter(x=>x.state.run&&x.state.remaining>0)"),'Ana sayfa kartı yalnız gerçek zaman aralığında aktif denemeyi göstermeli.');
          assert(dash.includes('wanted!==shown')&&dash.includes('queueRender()'),'Ana sayfa kartı sınav başında eklenip bitişte otomatik kaldırılmalı.');
          for(const token of ['.kh-trial-live__card','.kh-trial-live__ring','.ka-trial-counter__overview','[data-theme="dark"] .kh-trial-live__card'])assert(css.includes(token),`Açık/koyu deneme tasarım sözleşmesi eksik: ${token}`);
          for(const source of [academic,dash])for(const forbidden of ['db.collection','firebase.firestore','localStorage.setItem'])assert(!source.includes(forbidden),`Deneme local-first sınırı ihlal edildi: ${forbidden}`);
          console.log('Deneme otomatik sayaç + ana sayfa canlı kart sözleşmesi başarılı.');
          ''',encoding='utf-8')

          # PWA cache bust
          path=Path('service-worker.js')
          text=path.read_text(encoding='utf-8')
          if "const CACHE_ADI='oy-cache-v829';" not in text: raise SystemExit('service worker cache marker not found')
          path.write_text(text.replace("const CACHE_ADI='oy-cache-v829';","const CACHE_ADI='oy-cache-v830';",1),encoding='utf-8')
          PY

          node --check js/modules/academic.js
          node --check js/modules/dashboard.js
          node --test tests/trial-auto-timer.test.js
          node --test tests/academic-separate-pages.test.js
          node --test tests/dashboard-card-routes-smoke.test.js
          node --test tests/modules-local-first-boundary.test.js
          node --test tests/service-worker-precache-smoke.test.js
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-trial-auto-timer.yml
          git add js/modules/academic.js js/modules/dashboard.js css/design-system.css tests/dashboard-card-routes-smoke.test.js tests/trial-auto-timer.test.js service-worker.js .github/workflows/apply-trial-auto-timer.yml
          git commit -m "feat: add automatic trial countdown experience"
          git push origin HEAD:main
