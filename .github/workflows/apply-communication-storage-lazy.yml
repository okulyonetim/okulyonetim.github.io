name: Apply communication storage lazy optimization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lazy load Firebase Storage for communication uploads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          loader=Path('js/app-loader.js')
          s=loader.read_text(encoding='utf-8')
          old="define('communication',[FIREBASE_STORAGE_SDK,'js/modules/communication.js?v=838','js/modules/assistant.js']);"
          new="define('communication',['js/modules/communication.js?v=839','js/modules/assistant.js']);"
          assert old in s
          s=s.replace(old,new,1)
          assert "if(name==='academic'||name==='communication'||name==='documents')window.firebaseStorageHazirla?.();" in s
          s=s.replace("if(name==='academic'||name==='communication'||name==='documents')window.firebaseStorageHazirla?.();","if(name==='academic'||name==='documents')window.firebaseStorageHazirla?.();",1)
          s=s.replace('AppLoader v45','AppLoader v46',1)
          loader.write_text(s,encoding='utf-8')

          comm=Path('js/modules/communication.js')
          c=comm.read_text(encoding='utf-8')
          marker="/* ========================= MESSAGING DATA ========================= */"
          assert marker in c
          helper="""const COMMUNICATION_STORAGE_SDK='https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js';
          async function communicationStorageHazirla(){
            if(window.storage)return window.storage;
            if(typeof window.firebase?.storage!=='function'){
              if(!window.AppLoader?.loadScript)throw new Error('firebase-storage-loader-yok');
              await window.AppLoader.loadScript(COMMUNICATION_STORAGE_SDK);
            }
            const storage=window.firebaseStorageHazirla?.()||window.storage;
            if(!storage)throw new Error('firebase-storage-hazir-degil');
            return storage;
          }

          """.replace('          ','').lstrip()
          assert 'COMMUNICATION_STORAGE_SDK' not in c
          c=c.replace(marker,helper+marker,1)
          old_upload="dosyaYukle(konusmaId,dosya,cb){return new Promise((resolve,reject)=>{const yol=`mesajDosyalari/${konusmaId}/${Date.now()}_${dosya.name}`,ref=storage.ref().child(yol),g=ref.put(dosya);g.on('state_changed',s=>cb?.(Math.round(s.bytesTransferred/s.totalBytes*100)),reject,async()=>resolve({url:await g.snapshot.ref.getDownloadURL(),storagePath:yol}));});},"
          new_upload="async dosyaYukle(konusmaId,dosya,cb){const storage=await communicationStorageHazirla();return new Promise((resolve,reject)=>{const yol=`mesajDosyalari/${konusmaId}/${Date.now()}_${dosya.name}`,ref=storage.ref().child(yol),g=ref.put(dosya);g.on('state_changed',s=>cb?.(Math.round(s.bytesTransferred/s.totalBytes*100)),reject,async()=>resolve({url:await g.snapshot.ref.getDownloadURL(),storagePath:yol}));});},"
          assert old_upload in c
          c=c.replace(old_upload,new_upload,1)
          old_delete="dosyaSil(path){return storage.ref().child(path).delete();},"
          new_delete="async dosyaSil(path){const storage=await communicationStorageHazirla();return storage.ref().child(path).delete();},"
          assert old_delete in c
          c=c.replace(old_delete,new_delete,1)
          old_img="resimYukle(dosya,cb){return new Promise((resolve,reject)=>{const ad=String(dosya?.name||'gorsel').replace(/[\\/]+/g,'_'),yol=`duyurular/${Date.now()}_${ad}`,ref=storage.ref().child(yol),g=ref.put(dosya);g.on('state_changed',snap=>cb?.(Math.round(snap.bytesTransferred/snap.totalBytes*100)),reject,async()=>resolve({url:await g.snapshot.ref.getDownloadURL(),storagePath:yol}));});}"
          new_img="async resimYukle(dosya,cb){const storage=await communicationStorageHazirla();return new Promise((resolve,reject)=>{const ad=String(dosya?.name||'gorsel').replace(/[\\/]+/g,'_'),yol=`duyurular/${Date.now()}_${ad}`,ref=storage.ref().child(yol),g=ref.put(dosya);g.on('state_changed',snap=>cb?.(Math.round(snap.bytesTransferred/snap.totalBytes*100)),reject,async()=>resolve({url:await g.snapshot.ref.getDownloadURL(),storagePath:yol}));});}"
          assert old_img in c
          c=c.replace(old_img,new_img,1)
          old_img_delete="resimSil:path=>storage.ref().child(path).delete()"
          new_img_delete="resimSil:async path=>(await communicationStorageHazirla()).ref().child(path).delete()"
          assert old_img_delete in c
          c=c.replace(old_img_delete,new_img_delete,1)
          comm.write_text(c,encoding='utf-8')

          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          assert 'js/app-loader.js?v=894' in html
          index.write_text(html.replace('js/app-loader.js?v=894','js/app-loader.js?v=895'),encoding='utf-8')

          swp=Path('service-worker.js')
          sw=swp.read_text(encoding='utf-8')
          assert "const CACHE_ADI='oy-cache-v901';" in sw
          assert "'./js/app-loader.js?v=894'" in sw
          assert "'./js/modules/communication.js?v=838'" in sw
          sw=sw.replace("const CACHE_ADI='oy-cache-v901';","const CACHE_ADI='oy-cache-v902';",1)
          sw=sw.replace("'./js/app-loader.js?v=894'","'./js/app-loader.js?v=895'",1)
          sw=sw.replace("'./js/modules/communication.js?v=838'","'./js/modules/communication.js?v=839'",1)
          swp.write_text(sw,encoding='utf-8')

          test=Path('tests/lazy-firebase-storage-smoke.test.js')
          t=test.read_text(encoding='utf-8')
          old_assert="assert(/define\\('communication',\\[FIREBASE_STORAGE_SDK,'js\\/modules\\/communication\\.js(?:\\?v=\\d+)?','js\\/modules\\/assistant\\.js'\\]\\)/.test(loader),'Mesajlaşma Storage SDK yüklenmeden açılmamalı.');"
          new_assert="assert(/define\\('communication',\\['js\\/modules\\/communication\\.js(?:\\?v=\\d+)?','js\\/modules\\/assistant\\.js'\\]\\)/.test(loader),'İletişim açılışı Storage SDK yükünü taşımamalı.');\nassert(!/define\\('communication',\\[FIREBASE_STORAGE_SDK/.test(loader),'Communication bundle Storage SDK ile eager başlamamalı.');\nassert(loader.includes(\"if(name==='academic'||name==='documents')window.firebaseStorageHazirla?.();\"),'Storage başlangıç hazırlığı yalnız gerçekten eager Storage kullanan modüllerde kalmalı.');\nassert(communication.includes(\"const COMMUNICATION_STORAGE_SDK='https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js'\")&&communication.includes('async function communicationStorageHazirla()'),'Communication kendi dosya işlemlerinde Storage capabilitysini lazy hazırlamalı.');\nassert(communication.includes('await window.AppLoader.loadScript(COMMUNICATION_STORAGE_SDK)'),'Storage SDK yalnız dosya/resim işlemi gerektiğinde yüklenmeli.');"
          assert old_assert in t
          t=t.replace(old_assert,new_assert,1)
          test.write_text(t,encoding='utf-8')
          PY
      - name: Syntax checks
        run: |
          node --check js/app-loader.js
          node --check js/modules/communication.js
          node --check service-worker.js
      - name: Full client regression suite
        run: node scripts/run-client-tests.mjs
      - name: Client architecture audit
        run: node scripts/check-client-architecture.mjs
      - name: Commit verified optimization
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app-loader.js js/modules/communication.js index.html service-worker.js tests/lazy-firebase-storage-smoke.test.js
          git commit -m 'perf: lazy load communication storage capability'
          git push origin main
