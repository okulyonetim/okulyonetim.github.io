name: Migrate Teacher Calendar Personal Counts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-teacher-calendar-personal-counts.cjs'
      - '.github/workflows/migrate-teacher-calendar-personal-counts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply personal calendar count migration
        run: node scripts/migrate-teacher-calendar-personal-counts.cjs
      - name: Verify dashboard behavior
        run: |
          node --check js/modules/dashboard.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-reminders-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Build client bundles
        run: node scripts/build-client-bundles.mjs
      - name: Commit production package and cleanup
        run: |
          rm -f scripts/migrate-teacher-calendar-personal-counts.cjs
          rm -f .github/workflows/migrate-teacher-calendar-personal-counts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/dashboard.js tests/dashboard-card-routes-smoke.test.js scripts/migrate-teacher-calendar-personal-counts.cjs .github/workflows/migrate-teacher-calendar-personal-counts.yml
          git commit -m "fix(dashboard): personalize teacher calendar counts"
          git push
