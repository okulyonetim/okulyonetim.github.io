name: Apply menu v3 redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-menu-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply menu redesign
        run: python scripts/tmp-apply-menu-v3.py
      - name: Syntax and focused tests
        run: |
          node --check js/core/shell-ui.js
          node --check js/modules/settings.js
          node --check js/app-loader.js
          git diff --check
          node tests/menu-customization-v2.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/settings-separate-pages.test.js
          node tests/service-worker-precache-smoke.test.js
      - name: Build and architecture audit
        run: |
          node scripts/build-client-bundles.mjs
          node tests/module-bundles-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-menu-v3.yml scripts/tmp-apply-menu-v3.py
          git add -A
          git commit -m "feat: replace card gears with focused menu editor"
          git push origin HEAD:main
