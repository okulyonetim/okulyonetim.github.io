name: Apply unified pull refresh
# verification retry 4 — static design-system styling

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-unified-pull-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply unified pull refresh patch
        run: python3 scripts/tmp-unify-pull-refresh.py

      - name: Syntax and focused checks
        run: |
          node --check js/core/core.js
          node tests/android-pull-refresh-guard.test.js
          node tests/web-mobile-engine-separation.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/profile-photo.test.js

      - name: Full client regression suite
        run: node scripts/run-client-tests.mjs

      - name: Client architecture audit
        run: node scripts/check-client-architecture.mjs

      - name: Commit verified fix and clean temporary files
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-unified-pull-refresh.yml scripts/tmp-unify-pull-refresh.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/core.js css/design-system.css android/app/src/main/java/com/koruk/okul/MainActivity.java index.html service-worker.js tests/android-pull-refresh-guard.test.js tests/profile-photo.test.js .github/workflows scripts
          git diff --cached --check
          git commit -m 'fix: unify pull to refresh behavior'
          git push origin main
