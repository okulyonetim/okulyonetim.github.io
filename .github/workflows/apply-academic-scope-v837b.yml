name: Apply academic scope root fix v837b

on:
  push:
    branches:
      - fix-academic-scope-v837
    paths:
      - .github/workflows/apply-academic-scope-v837b.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix-academic-scope-v837
          fetch-depth: 0

      - name: Apply root-cause patch
        run: python3 scripts/apply-academic-scope-v837b.py

      - name: Static syntax checks
        run: |
          git diff --check
          node --check js/modules/academic.js
          node --check js/modules/communication.js
          node --check js/app-loader.js
          node --check service-worker.js

      - name: Verify canonical ownership
        run: |
          ! grep -q 'stabilizeExamRecords' js/modules/academic.js
          ! grep -q 'ACADEMIC EXAM MOBILE VISIBILITY' css/design-system.css
          ! grep -q 'academicRecordsVisible' js/modules/academic.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('js/modules/academic.js').read_text()
          ui=s.split('/* ========================= ACADEMIC UI ========================= */',1)[1]
          assert not re.search(r'\bglobal\.',ui)
          assert 'globalThis.PermissionService' in ui
          print('Academic UI scope contract OK')
          PY

      - name: Run focused regression tests
        run: |
          node --test \
            tests/calendar-month-view.test.js \
            tests/academic-separate-pages.test.js \
            tests/classic-shell-v2-smoke.test.js \
            tests/module-bundles-smoke.test.js \
            tests/modules-local-first-boundary.test.js \
            tests/service-worker-precache-smoke.test.js
          for t in tests/deneme-auto-timer.test.js tests/dashboard-route.test.js; do
            if [ -f "$t" ]; then node --test "$t"; fi
          done

      - name: Commit clean result to main
        run: |
          rm -f \
            scripts/apply-academic-scope-v837.py \
            scripts/apply-academic-scope-v837b.py \
            .github/workflows/apply-academic-scope-v837.yml \
            .github/workflows/apply-academic-scope-v837b.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair academic browser scope without visibility patches'
          git push origin HEAD:main
