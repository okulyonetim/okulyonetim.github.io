name: Temp Schedule Page Reports
on:
  push:
    branches: [work/schedule-page-reports-20260831]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/schedule-page-reports-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply schedule redesign
        run: python .github/schedule-redesign-patch.py
      - name: Verify schedule redesign
        run: |
          set -e
          node --check js/modules/academic.js
          node --check js/modules/classic-excel-parity.js
          node tests/schedule-report-visible-parity.test.js
          node tests/academic-separate-pages.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/classic-people-v2-smoke.test.js
          node scripts/check-client-architecture.mjs
          git diff --check
      - name: Commit verified schedule redesign
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/academic.js js/modules/classic-excel-parity.js css/design-system.css service-worker.js tests/schedule-report-visible-parity.test.js
          git commit -m "feat: restore schedule reports and redesign page"
          git push origin HEAD:work/schedule-page-reports-20260831
