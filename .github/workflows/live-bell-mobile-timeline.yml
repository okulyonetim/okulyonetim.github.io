name: Apply live bell mobile timeline redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-bell-mobile-timeline.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify base main
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="607d1e41a51f51f166f9692a8411a4c7bb9a2f00"
          test "$(git rev-parse HEAD^)" = "$EXPECTED"

      - name: Apply live bell patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-live-bell-v2.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('stale_flow=')
          end=s.index("test_path.write_text(test,encoding='utf-8')",start)+len("test_path.write_text(test,encoding='utf-8')")
          replacement='''timeline_flow="assert(dash.includes('function bellModel')&&dash.includes('function bellTimeline(live)')&&dash.includes('kh-bell-timeline')&&dash.includes('kh-bell-progress-v2'),'Gün içi akış yatay kaydırma ve pulse yerine mobil zaman çizgisi ve gerçek ilerleme göstergesi kullanmalı.');"\nflow_lines=[line for line in test.splitlines() if 'Gün içi akış tek yatay kaydırılabilir satır olmalı' in line]\nif len(flow_lines)!=1:\n    raise SystemExit(f'stale bell flow assertion count={len(flow_lines)}')\ntest=test.replace(flow_lines[0],timeline_flow,1)\ntest_path.write_text(test,encoding='utf-8')'''
          p.write_text(s[:start]+replacement+s[end:],encoding='utf-8')
          PY
          python scripts/apply-live-bell-v2.py

      - name: Validate syntax and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check js/modules/dashboard.js
          node --check service-worker.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/meeting-schedule-v1-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/trial-counter-scroll-stability.test.js
          node tests/web-mobile-engine-separation.test.js

      - name: Commit verified package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-live-bell-v2.py
          git add js/modules/dashboard.js css/design-system.css index.html js/app-loader.js service-worker.js tests/dashboard-card-routes-smoke.test.js tests/trial-counter-scroll-stability.test.js
          git commit -m "feat: redesign live bell timeline cards"
          git push origin main
