name: Android APK Build
# Current client payload: access-results-duty-v876

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Build generated client bundles
        run: npm run build:client

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Capacitor dependencies
        working-directory: android-app
        run: npm ci

      - name: Sync web assets into Android app
        working-directory: android-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: okul-yonetim-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk okul-yonetim.apk
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest okul-yonetim.apk --clobber
          else
            gh release create android-latest okul-yonetim.apk --title "Okul Yönetim Android (Güncel)" --notes "Otomatik üretilen güncel Android APK."
          fi
