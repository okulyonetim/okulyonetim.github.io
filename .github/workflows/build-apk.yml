name: Android APK Build
# Native widget değişiklikleri de her main APK build'inde doğrulanır.
# Her başarılı main APK build'i hem test artefaktı olarak saklanır hem de
# uygulama içi güncelleme sistemi için GitHub Release olarak latest yayınlanır.

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'manifest.json'
      - 'service-worker.js'
      - 'capacitor.config.json'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-client-bundles.mjs'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Kalıcı rapor ve öğretmen liste düzeltmelerini uygula
        if: ${{ !contains(github.event.head_commit.message, '[report-fix-applied]') }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Target not found in {path}: {old[:120]}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          replace('js/app-loader.js','js/modules/management.js?v=888','js/modules/management.js?v=889')
          replace('service-worker.js',"const CACHE_ADI='oy-cache-v1230';","const CACHE_ADI='oy-cache-v1231';")
          replace('service-worker.js','./js/modules/management.js?v=888','./js/modules/management.js?v=889')

          # Personel raporları: iframe içinde tema değişkenine bağlı kalmadan gerçek çizgi üret.
          replace('js/modules/management.js','.signature{width:100%;border-collapse:collapse;table-layout:fixed;border:2.5px solid var(--ka-text)}','.signature{width:100%;border-collapse:collapse;table-layout:fixed;border:2.5px solid #111827 !important}')
          replace('js/modules/management.js','.signature td,.signature th{border:1px solid var(--ka-text);padding:2px 4px;overflow:hidden}', '.signature td,.signature th{border:1px solid #111827 !important;padding:2px 4px;overflow:hidden}')
          replace('js/modules/management.js','.signature .date-head{border-right:1.5px solid var(--ka-text);','.signature .date-head{border-right:1.5px solid #111827 !important;')
          replace('js/modules/management.js','.signature .time-head{padding:3px 2px;border-bottom:2px solid var(--ka-text);','.signature .time-head{padding:3px 2px;border-bottom:2px solid #111827 !important;')
          replace('js/modules/management.js','.signature tbody td{border-bottom-color:var(--ka-text-muted)}','.signature tbody td{border-bottom:1px solid #111827 !important}')
          replace('js/modules/management.js','.signature td.date{padding-left:6px;border-right:1.5px solid var(--ka-text);','.signature td.date{padding-left:6px;border-right:1.5px solid #111827 !important;')
          replace('js/modules/management.js','.head,.payroll{width:100%;table-layout:fixed;border:2.5px solid var(--ka-text)}','.head,.payroll{width:100%;table-layout:fixed;border:2.5px solid #111827 !important}')
          replace('js/modules/management.js','.head td{border:1.5px solid var(--ka-text)}','.head td{border:1.5px solid #111827 !important}')
          replace('js/modules/management.js','.payroll th,.payroll td{border:1px solid var(--ka-text);','.payroll th,.payroll td{border:1px solid #111827 !important;')
          replace('js/modules/management.js','.approval{width:62mm;border:2.5px solid var(--ka-text);','.approval{width:62mm;border:2.5px solid #111827 !important;')

          # Öğretmen liste şablonu: öğretmenin kaydettiği düzen tüm sınıflarda ortak kullanılır.
          core=Path('js/modules/teacher-list-core.js')
          s=core.read_text(encoding='utf-8')
          old="""sablonGetir(ogretmenId,sinif){const id=templateId(ogretmenId,sinif);return Promise.resolve(device().list('ogretmenListeSablon').find(x=>x.id===id)||null);},
sablonKaydet(ogretmenId,sinif,veri){const id=templateId(ogretmenId,sinif);return device().set('ogretmenListeSablon',COL.ogretmenListeSablon,id,{...veri,ogretmenId,sinif:safeClass(sinif),guncellenme:new Date().toISOString()},{merge:false});},"""
          new="""sablonGetir(ogretmenId,sinif){const rows=device().list('ogretmenListeSablon').filter(x=>x.ogretmenId===ogretmenId);const globalTpl=rows.find(x=>String(x.sinif||'')==='__GENEL__');if(globalTpl)return Promise.resolve(globalTpl);const classTpl=rows.find(x=>x.id===templateId(ogretmenId,sinif));const fallback=classTpl||rows.slice().sort((a,b)=>String(b.guncellenme||'').localeCompare(String(a.guncellenme||'')))[0]||null;if(fallback){const data={...fallback};delete data.id;delete data.sinif;return device().set('ogretmenListeSablon',COL.ogretmenListeSablon,templateId(ogretmenId,'__GENEL__'),{...data,ogretmenId,sinif:'__GENEL__',guncellenme:new Date().toISOString()},{merge:false}).then(()=>data).catch(()=>data);}return Promise.resolve(null);},
sablonKaydet(ogretmenId,sinif,veri){const id=templateId(ogretmenId,'__GENEL__');return device().set('ogretmenListeSablon',COL.ogretmenListeSablon,id,{...veri,ogretmenId,sinif:'__GENEL__',guncellenme:new Date().toISOString()},{merge:false});},"""
          if old not in s:
              raise SystemExit('Teacher-list template repository target not found')
          core.write_text(s.replace(old,new,1),encoding='utf-8')
          replace('js/modules/teacher-list.js',"const CORE='js/modules/teacher-list-core.js?v=1066';","const CORE='js/modules/teacher-list-core.js?v=1067';")
          PY

          node --check js/modules/management.js
          node --check js/modules/teacher-list-core.js
          node --check js/modules/teacher-list.js
          node --check js/app-loader.js
          node --check service-worker.js

      - name: Düzeltilmiş kaynakları kalıcı olarak kaydet
        if: ${{ !contains(github.event.head_commit.message, '[report-fix-applied]') }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/management.js js/modules/teacher-list-core.js js/modules/teacher-list.js js/app-loader.js service-worker.js
          git rm -f .github/workflows/fix-report-template-cache.yml 2>/dev/null || true
          git commit -m "Fix report borders and global teacher list templates [report-fix-applied]" || true
          git push

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Koruk v2 istemci bundle'larını üret
        run: |
          npm run build:client
          node tests/module-bundles-smoke.test.js

      - name: Web dosyalarını www/ klasörüne kopyala
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp app-v2.html www/ 2>/dev/null || true
          cp -r css www/ 2>/dev/null || true
          cp -r js www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp service-worker.js www/ 2>/dev/null || true

      - name: Firebase SDK'yı APK içine yerel paketle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www/vendor/firebase
          for sdk in app firestore auth messaging storage; do
            file="firebase-${sdk}-compat.js"
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://www.gstatic.com/firebasejs/10.12.2/${file}" \
              -o "www/vendor/firebase/${file}"
          done
          python3 - <<'PY'
          from pathlib import Path
          root=Path('www')
          base='https://www.gstatic.com/firebase/10.12.2/'
          files=[f'firebase-{name}-compat.js' for name in ('app','firestore','auth','messaging','storage')]
          targets=[root/'index.html',root/'service-worker.js',*root.joinpath('js').rglob('*.js')]
          for path in targets:
              if not path.exists():
                  continue
              text=path.read_text(encoding='utf-8')
              changed=text
              for name in files:
                  changed=changed.replace(base+name,'./vendor/firebase/'+name)
              if changed!=text:
                  path.write_text(changed,encoding='utf-8')
          for name in files:
              p=root/'vendor'/'firebase'/name
              if not p.exists() or p.stat().st_size < 1000:
                  raise SystemExit(f'Firebase SDK yerel paketlenemedi: {name}')
          if base in (root/'index.html').read_text(encoding='utf-8'):
              raise SystemExit('APK index.html içinde uzak Firebase SDK bağımlılığı kaldı')
          print('Firebase SDK APK içine yerel olarak paketlendi.')
          PY

      - name: Sürüm numarasını göm (uygulama içi güncelleme kontrolü için)
        run: |
          echo "{\"kod\": ${{ github.run_number }}, \"surum\": \"1.3.${{ github.run_number }}\"}" > www/version.json

      - name: Android versionCode / versionName güncelle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('android/app/build.gradle')
          text=path.read_text(encoding='utf-8')
          build='${{ github.run_number }}'
          text,n1=re.subn(r'(?m)^(\s*)versionCode\s+\d+\s*$',lambda m:f'{m.group(1)}versionCode {build}',text,count=1)
          text,n2=re.subn(r'(?m)^(\s*)versionName\s+"[^"]*"\s*$',lambda m:f'{m.group(1)}versionName "1.3.{build}"',text,count=1)
          if n1!=1 or n2!=1:
              raise SystemExit('Android versionCode/versionName güncellenemedi')
          path.write_text(text,encoding='utf-8')
          print(f'Android sürümü: versionCode={build}, versionName=1.3.{build}')
          PY

      - name: google-services.json oluştur
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Keystore ve şifreyi sırlardan hazırla (görünmez/geçersiz karakterler temizlenir)
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -dc 'A-Za-z0-9+/=' | base64 -d > android/app/koruk-okul.jks
          TEMIZ_SIFRE=$(printf '%s' "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | tr -d '[:space:]')
          echo "::add-mask::$TEMIZ_SIFRE"
          echo "KEYSTORE_SIFRE_TEMIZ=$TEMIZ_SIFRE" >> "$GITHUB_ENV"

      - name: Keystore'u doğrula (build'i beklemeden erken hata ver)
        run: |
          echo "Keystore dosya boyutu:"
          ls -la android/app/koruk-okul.jks
          echo "---"
          if keytool -list -keystore android/app/koruk-okul.jks -storepass "$KEYSTORE_SIFRE_TEMIZ" -alias koruk > /dev/null 2>&1; then
            echo "✅ Keystore ve şifre DOĞRU — build'e devam ediliyor."
          else
            echo "❌ HATA: Keystore açılamadı veya şifre yanlış."
            exit 1
          fi

      - name: Gradle wrapper oluştur
        run: |
          cd android
          gradle wrapper --gradle-version 8.7

      - name: Capacitor sync
        run: npx cap sync android

      - name: Gradle izni ver
        run: chmod +x android/gradlew

      - name: Release APK derle
        working-directory: android
        env:
          KEYSTORE_PATH: koruk-okul.jks
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_SIFRE_TEMIZ }}
          KEY_ALIAS: koruk
          KEY_PASSWORD: ${{ env.KEYSTORE_SIFRE_TEMIZ }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK test artefaktı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: koruk-okul-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Başarılı main APK'sını güncelleme olarak yayınla
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Sürüm 1.3.${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          generate_release_notes: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build / yayın bilgisi
        run: |
          echo "✅ APK başarıyla derlendi."
          echo "Build run id: ${{ github.run_id }}"
          echo "Build run number: ${{ github.run_number }}"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "✅ Sürüm 1.3.${{ github.run_number }} (v${{ github.run_number }}) GitHub Release olarak yayınlandı ve latest yapıldı."
          else
            echo "ℹ️ Main dışındaki manuel build yayınlanmadı."
          fi
