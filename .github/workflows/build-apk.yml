name: Android APK Build
# Current client payload: duty-report-v871

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Koruk v2 istemci bundle'larını üret
        run: |
          npm run build:client

      - name: Capacitor senkronizasyonu
        run: |
          npx cap sync android

      - name: Gradle izinleri
        run: chmod +x android/gradlew

      - name: Release APK oluştur
        run: |
          cd android
          ./gradlew assembleRelease

      - name: APK adını düzenle
        run: |
          mkdir -p release
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_PATH" release/okul-yonetim.apk

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: okul-yonetim-apk
          path: release/okul-yonetim.apk
          retention-days: 30

      - name: GitHub Release oluştur / güncelle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Okul Yönetim — Son Sürüm
          body: |
            Otomatik oluşturulan güncel Android APK.
            Aşağıdaki okul-yonetim.apk dosyasını indirip kurabilirsiniz.
          files: release/okul-yonetim.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
