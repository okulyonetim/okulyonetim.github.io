name: Temp Transport Button Polish
on:
  push:
    branches:
      - work/transport-button-polish-20260831
    paths:
      - .github/.transport-button-trigger
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/transport-button-polish-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply transport button polish
        env:
          CSS_BLOCK_B64: 
          TEST_B64: 
        run: |
          python -c "import os,base64,pathlib;p=pathlib.Path('css/design-system.css');s=p.read_text(encoding='utf-8');m='/* Taşıma — mobil buton düzeni v2 */';b=base64.b64decode(os.environ['CSS_BLOCK_B64']).decode();p.write_text(s.rstrip()+'\n\n'+b+'\n',encoding='utf-8') if m not in s else None"
          python -c "from pathlib import Path;p=Path('service-worker.js');s=p.read_text(encoding='utf-8');p.write_text(s.replace(\"CACHE_ADI='oy-cache-v811'\",\"CACHE_ADI='oy-cache-v812'\",1),encoding='utf-8') if \"CACHE_ADI='oy-cache-v811'\" in s else None"
          python -c "import os,base64,pathlib;pathlib.Path('tests/transport-button-layout.test.js').write_bytes(base64.b64decode(os.environ['TEST_B64']))"
      - name: Verify targeted regressions
        run: |
          node tests/transport-button-layout.test.js
          node tests/transport-separate-pages.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node scripts/check-client-architecture.mjs
          git diff --check
      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add css/design-system.css service-worker.js tests/transport-button-layout.test.js
          git commit -m "Polish transport mobile action buttons [skip ci]"
          git push origin HEAD:work/transport-button-polish-20260831
