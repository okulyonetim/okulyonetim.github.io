name: migrate-lazy-tool-test-contracts
on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-lazy-tool-test-contracts.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update lazy tool test contracts
        run: python scripts/migrate-lazy-tool-test-contracts.py
      - name: Verify optional tool contracts
        run: |
          node tests/payroll-change-v2-smoke.test.js
          node tests/assistant-v2-smoke.test.js
          node tests/legislation-engine-v2-smoke.test.js
          node tests/rubric-settings-v2-smoke.test.js
          node tests/rubric-tools-v2-smoke.test.js
          node tests/classic-shell-v2-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Cleanup temporary migration files
        run: rm -f scripts/migrate-lazy-tool-test-contracts.py .github/workflows/migrate-lazy-tool-test-contracts.yml
      - name: Commit production migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'test(startup): align optional tools with lazy loading'
          git push
