name: migrate-headless-school-live
on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-headless-school-live.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Retire legacy live hero decorator
        run: python scripts/migrate-headless-school-live.py
      - name: Syntax checks
        run: |
          node --check js/modules/school-live-status.js
          node --check js/modules/dashboard.js
      - name: Dashboard and architecture checks
        run: |
          node tests/classic-shell-v2-smoke.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Cleanup temporary migration files
        run: rm -f scripts/migrate-headless-school-live.py .github/workflows/migrate-headless-school-live.yml
      - name: Commit production migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'perf(live-status): retire legacy hero decorator'
          git push
