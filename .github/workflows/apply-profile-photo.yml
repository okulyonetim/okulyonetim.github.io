name: Apply profile photo feature

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-profile-photo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Apply profile photo patch
        run: python3 scripts/tmp-apply-profile-photo.py

      - name: Syntax and focused checks
        run: |
          node --check js/auth.js
          node --check js/core/shell-ui.js
          node --check service-worker.js
          node tests/profile-photo.test.js
          node tests/profile-page-redesign.test.js
          node tests/lazy-firebase-storage-smoke.test.js

      - name: Full client regression suite
        run: node scripts/run-client-tests.mjs

      - name: Client architecture audit
        run: node scripts/check-client-architecture.mjs

      - name: Storage ownership emulator test
        run: |
          npm install --no-save --package-lock=false firebase @firebase/rules-unit-testing firebase-tools
          npx firebase emulators:exec --only firestore,storage --project demo-okul-rules "node tests/storage-rules.test.js"

      - name: Commit verified feature and clean temporary files
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-profile-photo.yml .github/workflows/apply-transport-report-lazy.yml scripts/tmp-apply-profile-photo.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/auth.js js/core/shell-ui.js css/design-system.css index.html service-worker.js tests/profile-photo.test.js tests/storage-rules.test.js .github/workflows scripts
          git diff --cached --check
          git commit -m 'feat: add self-service profile photos'
          git push origin main
