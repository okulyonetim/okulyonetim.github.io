name: Apply attendance scroll and schedule sync fix

on:
  push:
    branches:
      - fix/attendance-scroll-schedule-sync

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/attendance-scroll-schedule-sync
          fetch-depth: 0
      - name: Patch attendance scroll preservation and schedule-backed auto fill
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[attendance-sync-applied\]'; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          path=Path('js/modules/tools.js')
          text=path.read_text()

          replacements=[]
          replacements.append((
          "  _aktifIzinKaydi(izinKayitlari,ogretmenId,iso){return(izinKayitlari||[]).find(k=>k.ogretmenId===ogretmenId&&k.baslangic<=iso&&iso<=k.bitis)||null;},",
          "  _izinTarihAnahtari(v){if(!v)return'';if(typeof v==='string')return v.slice(0,10);if(v?.toDate)v=v.toDate();const d=v instanceof Date?v:new Date(v);if(Number.isNaN(d.getTime()))return'';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;},\n  _aktifIzinKaydi(izinKayitlari,ogretmenId,iso){return(izinKayitlari||[]).find(k=>{if(String(k.ogretmenId||k.personelId||'')!==String(ogretmenId||''))return false;const bas=this._izinTarihAnahtari(k.baslangicTarihi||k.baslangic),bit=this._izinTarihAnahtari(k.bitisTarihi||k.bitis)||bas;return !!bas&&bas<=iso&&iso<=bit})||null;},"
          ))
          replacements.append((
          "let mounted=false,active='checklists',unsubs=[],attendanceDate=new Date();",
          "let mounted=false,active='checklists',unsubs=[],attendanceDate=new Date(),attendanceScrollLeft=0;"
          ))
          replacements.append((
          "function attWeeklyHours(teacherId){const out={pzt:0,sal:0,car:0,per:0,cum:0};arr('dersProgrami').filter(d=>String(d.ogretmenId||'')===String(teacherId||'')).forEach(d=>{const key=ATT_DAY_KEYS[String(d.gun||'').trim()];if(key)out[key]++});return out}",
          "function attWeeklyHours(teacherId){const out={pzt:0,sal:0,car:0,per:0,cum:0};let rows=arr('dersProgrami').filter(d=>String(d.ogretmenId||'')===String(teacherId||''));const unique=global.KorukScheduleDataIntegrity?.dedupeRows?.(rows);if(Array.isArray(unique?.rows))rows=unique.rows;rows.forEach(d=>{const key=ATT_DAY_KEYS[String(d.gun||'').trim()];if(key)out[key]++});return out}"
          ))
          old_auto="async function attAutoRefresh(){const doc=monthDoc();if(!doc||!attCanEdit())return;if(!global.confirm?.('Elle değiştirilmemiş günler güncel izin, resmi tatil ve haftalık ders saatlerine göre yeniden hesaplanacak. Elle yaptığınız değişiklikler korunacak. Devam edilsin mi?'))return;const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1;try{for(const original of Object.values(doc.ogretmenler||{})){const o=structuredClone(original),fresh=global.DevamsizlikCizelgesiService.ogretmenAyiniOtomatikUret(o,y,m,arr('resmiTatiller'),arr('ogretmenIzinleri')),manual=o.elleGunler||{},merged={...(o.gunler||{})};for(const g of Object.keys(fresh))if(!manual[g])merged[g]=fresh[g];for(let g=1;g<=global.DevamsizlikCizelgesiService.gunSayisi(y,m);g++)if(!manual[g]&&!(g in fresh))delete merged[g];o.gunler=merged;await global.DevamsizlikCizelgesiService.ogretmenVerisiGuncelle(y,m,o.ogretmenId,o)}global.toast?.('Otomatik günler tazelendi.')}catch(e){global.toast?.(e?.message||'Otomatik doldurma başarısız.')}}"
          new_auto="async function attAutoRefresh(){const doc=monthDoc();if(!doc||!attCanEdit())return;if(!global.confirm?.('Elle değiştirilmemiş günler güncel izin, resmi tatil ve ders programına göre yeniden hesaplanacak. Elle yaptığınız değişiklikler korunacak. Devam edilsin mi?'))return;const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,teacherIds=new Set(arr('ogretmenler').map(t=>String(t.id||'')));try{for(const original of Object.values(doc.ogretmenler||{})){const o=structuredClone(original);if(teacherIds.has(String(o.ogretmenId||'')))o.haftalikSaatler=attWeeklyHours(o.ogretmenId);const fresh=global.DevamsizlikCizelgesiService.ogretmenAyiniOtomatikUret(o,y,m,arr('resmiTatiller'),arr('ogretmenIzinleri')),manual=o.elleGunler||{},merged={...(o.gunler||{})};for(const g of Object.keys(fresh))if(!manual[g])merged[g]=fresh[g];for(let g=1;g<=global.DevamsizlikCizelgesiService.gunSayisi(y,m);g++)if(!manual[g]&&!(g in fresh))delete merged[g];o.gunler=merged;await global.DevamsizlikCizelgesiService.ogretmenVerisiGuncelle(y,m,o.ogretmenId,o)}global.toast?.('Otomatik günler ders programından tazelendi.')}catch(e){global.toast?.(e?.message||'Otomatik doldurma başarısız.')}}"
          replacements.append((old_auto,new_auto))

          old_render="function renderAttendance(){const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,doc=monthDoc(),teachers=attSortedTeachers(doc),content=document.getElementById('toolsContent'),count=document.getElementById('toolsCount');if(count)count.textContent=`${teachers.length} personel`;if(!content)return;content.innerHTML=`<section class=\"ka-stack ka-attendance-page\" data-attendance-page>${attToolbarHtml(doc,y,m)}${doc&&teachers.length?attTableHtml(doc,y,m,true)+attLegendHtml():`<div class=\"ka-card ka-attendance-empty\"><div class=\"ka-card__body ka-stack\"><strong>${ATT_MONTHS[m-1]} ${y} için henüz çizelge oluşturulmamış.</strong><span class=\"ka-muted\">Öğretmen listesinden otomatik oluşturabilir veya Excel dosyasından içe aktarabilirsiniz.</span>${attCanEdit()?'<button class=\"ka-btn\" type=\"button\" data-att-create>Öğretmen Listesinden Oluştur</button>':''}</div></div>`}</section>`;bindAttendance()}"
          new_render="function renderAttendance(){const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,doc=monthDoc(),teachers=attSortedTeachers(doc),content=document.getElementById('toolsContent'),count=document.getElementById('toolsCount');if(count)count.textContent=`${teachers.length} personel`;if(!content)return;const oldGrid=content.querySelector('.ka-attendance-grid-wrap');if(oldGrid)attendanceScrollLeft=oldGrid.scrollLeft;content.innerHTML=`<section class=\"ka-stack ka-attendance-page\" data-attendance-page>${attToolbarHtml(doc,y,m)}${doc&&teachers.length?attTableHtml(doc,y,m,true)+attLegendHtml():`<div class=\"ka-card ka-attendance-empty\"><div class=\"ka-card__body ka-stack\"><strong>${ATT_MONTHS[m-1]} ${y} için henüz çizelge oluşturulmamış.</strong><span class=\"ka-muted\">Öğretmen listesinden otomatik oluşturabilir veya Excel dosyasından içe aktarabilirsiniz.</span>${attCanEdit()?'<button class=\"ka-btn\" type=\"button\" data-att-create>Öğretmen Listesinden Oluştur</button>':''}</div></div>`}</section>`;bindAttendance();const nextGrid=content.querySelector('.ka-attendance-grid-wrap');if(nextGrid){const restore=()=>{if(!nextGrid.isConnected)return;nextGrid.scrollLeft=Math.min(attendanceScrollLeft,Math.max(0,nextGrid.scrollWidth-nextGrid.clientWidth))};restore();global.requestAnimationFrame?.(restore)}}"
          replacements.append((old_render,new_render))

          old_bind="function bindAttendance(){const content=document.getElementById('toolsContent');if(!content)return;content.querySelector('[data-att-year]')?.addEventListener('change',e=>{attendanceDate=new Date(Number(e.target.value),attendanceDate.getMonth(),1);renderAttendance()});content.querySelector('[data-att-month]')?.addEventListener('change',e=>{attendanceDate=new Date(attendanceDate.getFullYear(),Number(e.target.value)-1,1);renderAttendance()});content.querySelector('[data-att-create]')?.addEventListener('click',attCreateMonth);content.querySelector('[data-att-auto]')?.addEventListener('click',attAutoRefresh);content.querySelector('[data-att-print]')?.addEventListener('click',attPrint);const file=content.querySelector('[data-att-file]');content.querySelector('[data-att-import]')?.addEventListener('click',()=>file?.click());file?.addEventListener('change',async e=>{const f=e.target.files?.[0];if(f)await attImportExcel(f);e.target.value=''});content.querySelectorAll('[data-att-cell]').forEach(b=>b.addEventListener('click',()=>openAttCellModal(b.dataset.attTeacher,Number(b.dataset.attDay))));content.querySelectorAll('[data-att-hours]').forEach(b=>b.addEventListener('click',()=>openAttHoursModal(b.dataset.attHours)));content.querySelectorAll('[data-att-note]').forEach(b=>b.addEventListener('click',()=>openAttNoteModal(b.dataset.attNote)))}"
          new_bind="function bindAttendance(){const content=document.getElementById('toolsContent');if(!content)return;const grid=content.querySelector('.ka-attendance-grid-wrap');grid?.addEventListener('scroll',()=>{attendanceScrollLeft=grid.scrollLeft},{passive:true});content.querySelector('[data-att-year]')?.addEventListener('change',e=>{attendanceScrollLeft=0;attendanceDate=new Date(Number(e.target.value),attendanceDate.getMonth(),1);renderAttendance()});content.querySelector('[data-att-month]')?.addEventListener('change',e=>{attendanceScrollLeft=0;attendanceDate=new Date(attendanceDate.getFullYear(),Number(e.target.value)-1,1);renderAttendance()});content.querySelector('[data-att-create]')?.addEventListener('click',attCreateMonth);content.querySelector('[data-att-auto]')?.addEventListener('click',attAutoRefresh);content.querySelector('[data-att-print]')?.addEventListener('click',attPrint);const file=content.querySelector('[data-att-file]');content.querySelector('[data-att-import]')?.addEventListener('click',()=>file?.click());file?.addEventListener('change',async e=>{const f=e.target.files?.[0];if(f)await attImportExcel(f);e.target.value=''});content.querySelectorAll('[data-att-cell]').forEach(b=>b.addEventListener('click',()=>openAttCellModal(b.dataset.attTeacher,Number(b.dataset.attDay))));content.querySelectorAll('[data-att-hours]').forEach(b=>b.addEventListener('click',()=>openAttHoursModal(b.dataset.attHours)));content.querySelectorAll('[data-att-note]').forEach(b=>b.addEventListener('click',()=>openAttNoteModal(b.dataset.attNote)))}"
          replacements.append((old_bind,new_bind))

          for old,new in replacements:
            if old not in text:
              raise SystemExit('Expected source block not found: '+old[:100])
            text=text.replace(old,new,1)
          path.write_text(text)

          sw=Path('service-worker.js')
          sw_text=sw.read_text()
          if "const CACHE_ADI='oy-cache-v932';" not in sw_text:
            raise SystemExit('Expected cache version v932 not found')
          sw.write_text(sw_text.replace("const CACHE_ADI='oy-cache-v932';","const CACHE_ADI='oy-cache-v933';",1))

          test=Path('tests/attendance-schedule-scroll-regression.test.js')
          test.write_text("""const fs=require('fs');\nconst assert=require('assert');\nconst src=fs.readFileSync('js/modules/tools.js','utf8');\nconst sw=fs.readFileSync('service-worker.js','utf8');\nnew Function(src);\nassert(src.includes("o.haftalikSaatler=attWeeklyHours(o.ogretmenId)"),'Otomatik tazeleme güncel ders programını yeniden okumalı.');\nassert(src.includes("KorukScheduleDataIntegrity?.dedupeRows?.(rows)"),'Ders saati hesabında mükerrer program satırları tekilleştirilmeli.');\nassert(src.includes("attendanceScrollLeft=oldGrid.scrollLeft"),'Yeniden çizimde yatay konum yakalanmalı.');\nassert(src.includes("nextGrid.scrollLeft=Math.min(attendanceScrollLeft"),'Yeniden çizim sonrası yatay konum geri yüklenmeli.');\nassert(src.includes("addEventListener('scroll',()=>{attendanceScrollLeft=grid.scrollLeft}"),'Kullanıcının yatay kaydırma konumu izlenmeli.');\nassert(src.includes("k.baslangicTarihi||k.baslangic")&&src.includes("k.bitisTarihi||k.bitis"),'Otomatik doldurma yeni ve eski izin tarih alanlarını desteklemeli.');\nassert(sw.includes("const CACHE_ADI='oy-cache-v933';"),'Yeni attendance kodu yeni PWA cache sürümüyle dağıtılmalı.');\nconsole.log('Devamsızlık çizelgesi ders programı + yatay kaydırma regresyon testi başarılı.');\n""")
          PY
          node tests/attendance-schedule-scroll-regression.test.js
          node tests/tools-attendance-v2-smoke.test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/modules/tools.js service-worker.js tests/attendance-schedule-scroll-regression.test.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: sync attendance from lesson schedule and preserve scroll [attendance-sync-applied]'
          git push origin HEAD:fix/attendance-scroll-schedule-sync
