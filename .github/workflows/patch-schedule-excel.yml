name: Patch schedule excel feature
on:
  push:
    branches: [feat/schedule-excel-template-import]
    paths:
      - scripts/patch_schedule_excel.py
      - .github/workflows/patch-schedule-excel.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/schedule-excel-template-import
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_schedule_excel.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/modules/schedule-excel-tools.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add schedule excel template import tools"
          git push
