name: Temporary Class Seating Student Picker Fix
on:
  push:
    branches:
      - fix/class-seating-student-picker-touch
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/class-seating-student-picker-touch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply seating picker fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/modules/class-seating.js')
          s=p.read_text()
          old="  const available=students();"
          new="  const available=students().filter(v=>v.id===current||!used.has(v.id));"
          if old not in s: raise SystemExit('available anchor not found')
          s=s.replace(old,new,1)
          pattern=r"    \}else if\(!dragged\)\{\n      const seat=startTarget\?\.closest\?\.\('\[data-so-seat\]'\);\n      if\(seat\)\{\n        seat\.dataset\.soSuppressClick='true';\n        setTimeout\(\(\)=>\{if\(seat\.isConnected\)delete seat\.dataset\.soSuppressClick\},350\);\n        chooseStudent\(seat\);\n      \}else if\(startTarget\?\.closest\?\.\('\[data-so-teacher-name\]'\)\)\{"
          repl="    }else if(!dragged){\n      const seat=startTarget?.closest?.('[data-so-seat]');\n      if(!seat&&startTarget?.closest?.('[data-so-teacher-name]')){"
          s,n=re.subn(pattern,repl,s,count=1)
          if n!=1: raise SystemExit('pointer tap anchor not found')
          p.write_text(s)
          test=Path('tests/class-seating-student-picker-regression.test.js')
          lines=["const fs=require('fs');","const assert=require('assert');","const src=fs.readFileSync('js/modules/class-seating.js','utf8');","new Function(src);","assert(src.includes(\"const available=students().filter(v=>v.id===current||!used.has(v.id));\"),'Öğrenci seçici başka sıraya atanmış öğrencileri tekrar sunmamalı.');","const bind=src.match(/function bindDrag\\(el\\)\\{[\\s\\S]*?function createObject/)?.[0]||'';","const tapBranch=bind.match(/\\}else if\\(!dragged\\)\\{[\\s\\S]*?group=\\[\\];/)?.[0]||'';","assert(tapBranch.includes(\"const seat=startTarget?.closest?.('[data-so-seat]');\"),'Tap hedefi sıra koltuğu olarak ayrıştırılmalı.');","assert(!tapBranch.includes('chooseStudent(seat)'),'pointerup öğrenci seçiciyi açmamalı; sentetik click-through riski yaratır.');","assert(!tapBranch.includes(\"seat.dataset.soSuppressClick='true'\"),'Normal tap sonrası gerçek click olayı bastırılmamalı.');","assert(src.includes(\"seat.addEventListener('click',e=>{\")&&src.includes(\"if(seat.dataset.soSuppressClick==='true')return;\")&&src.includes('chooseStudent(seat);'),'Öğrenci seçici yalnız tamamlanmış click üzerinden açılmalı; sürükleme sonrası click bastırılmalı.');","assert(bind.includes(\"if(dragged&&dragSeat){\")&&bind.includes(\"dragSeat.dataset.soSuppressClick='true'\"),'Sürükleme sonrası yanlış öğrenci seçimi engellenmeli.');","console.log('Sınıf oturma planı öğrenci seçici touch/click regresyon testi başarılı.');"]
          test.write_text('\n'.join(lines)+'\n')
          sw=Path('service-worker.js')
          w=sw.read_text()
          if "CACHE_ADI='oy-cache-v941'" not in w: raise SystemExit('cache version anchor not found')
          sw.write_text(w.replace("CACHE_ADI='oy-cache-v941'","CACHE_ADI='oy-cache-v942'",1))
          Path('.github/workflows/tmp-class-seating-student-picker-fix.yml').unlink()
          PY
          node --check js/modules/class-seating.js
          node tests/class-seating-student-picker-regression.test.js
          node tests/classes-mobile-parity-smoke.test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: prevent accidental student moves in class seating"
          git push origin HEAD:fix/class-seating-student-picker-touch
