name: Migrate Dashboard Click Isolation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-dashboard-click-isolation.cjs'
      - '.github/workflows/migrate-dashboard-click-isolation.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply click isolation migration
        run: node scripts/migrate-dashboard-click-isolation.cjs
      - name: Verify dashboard behavior
        run: |
          node -c js/modules/dashboard.js
          node -c js/core/shell-ui.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-reminders-smoke.test.js
          node tests/no-module-internal-tabs.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit production fix and cleanup
        run: |
          rm -f scripts/migrate-dashboard-click-isolation.cjs .github/workflows/migrate-dashboard-click-isolation.yml
          git config user.name "sedonet23"
          git config user.email "sedonet23@gmail.com"
          git add js/modules/dashboard.js js/core/shell-ui.js tests/dashboard-card-routes-smoke.test.js scripts/migrate-dashboard-click-isolation.cjs .github/workflows/migrate-dashboard-click-isolation.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(dashboard): isolate nested card actions"
          git push origin main
