name: Migrate Dashboard Reference Surfaces

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-dashboard-reference-surfaces.yml'
      - 'scripts/migrate-dashboard-reference-surfaces.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply reference surfaces migration
        run: python3 scripts/migrate-dashboard-reference-surfaces.py
      - name: Verify dashboard and shell
        run: |
          node --check js/modules/dashboard.js
          node --check js/core/shell-ui.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-reminders-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Build client bundles
        run: node scripts/build-client-bundles.mjs
      - name: Commit production package and cleanup
        run: |
          rm -f scripts/migrate-dashboard-reference-surfaces.py .github/workflows/migrate-dashboard-reference-surfaces.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/dashboard.js js/core/shell-ui.js css/design-system.css tests/dashboard-card-routes-smoke.test.js scripts/migrate-dashboard-reference-surfaces.py .github/workflows/migrate-dashboard-reference-surfaces.yml
          git commit -m 'feat(ui): match duty news and profile references'
          git push
