name: Fix static completed bell icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-static-completed-bell.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify base main
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="5b03b815ab77c71bad219bc8d9241b085c299883"
          test "$(git rev-parse HEAD^)" = "$EXPECTED"

      - name: Remove completed bell icon animation
        shell: python
        run: |
          from pathlib import Path

          css_path=Path('css/design-system.css')
          css=css_path.read_text(encoding='utf-8')
          old='.kh-bell-orb.is-live,.kh-bell-special-icon{animation:khIconOrb 1.7s ease-in-out infinite}'
          new='.kh-bell-orb.is-live{animation:khIconOrb 1.7s ease-in-out infinite}.kh-bell-special-icon,.kh-bell-special-icon svg{animation:none!important;transition:none!important;transform:none!important}'
          if css.count(old)!=1:
              raise SystemExit(f'legacy special icon animation count={css.count(old)}')
          css=css.replace(old,new,1)
          css_path.write_text(css,encoding='utf-8')

          test_path=Path('tests/dashboard-card-routes-smoke.test.js')
          test=test_path.read_text(encoding='utf-8')
          anchor="assert(dash.includes('function bellModel')&&dash.includes('function bellTimeline(live)')&&dash.includes('kh-bell-timeline')&&dash.includes('kh-bell-progress-v2'),'Gün içi akış yatay kaydırma ve pulse yerine mobil zaman çizgisi ve gerçek ilerleme göstergesi kullanmalı.');"
          added="assert(css.includes('.kh-bell-special-icon,.kh-bell-special-icon svg{animation:none!important;transition:none!important;transform:none!important}'),'Ders tamamlandı ve diğer özel zil durumlarının ikonları sürekli animasyon taşımamalı.');"
          if anchor not in test:
              raise SystemExit('live bell smoke anchor missing')
          if added not in test:
              test=test.replace(anchor,anchor+'\n'+added,1)
          test_path.write_text(test,encoding='utf-8')

          index_path=Path('index.html')
          index=index_path.read_text(encoding='utf-8')
          if 'css/design-system.css?v=859' not in index:
              raise SystemExit('index css v859 not found')
          index=index.replace('css/design-system.css?v=859','css/design-system.css?v=860',1)
          index_path.write_text(index,encoding='utf-8')

          sw_path=Path('service-worker.js')
          sw=sw_path.read_text(encoding='utf-8')
          if "const CACHE_ADI='oy-cache-v859'" not in sw:
              raise SystemExit('service worker v859 not found')
          sw=sw.replace("const CACHE_ADI='oy-cache-v859'","const CACHE_ADI='oy-cache-v860'",1)
          if './css/design-system.css?v=859' not in sw:
              raise SystemExit('service worker css v859 precache not found')
          sw=sw.replace('./css/design-system.css?v=859','./css/design-system.css?v=860',1)
          sw_path.write_text(sw,encoding='utf-8')

          trial_path=Path('tests/trial-counter-scroll-stability.test.js')
          trial=trial_path.read_text(encoding='utf-8')
          trial=trial.replace("css/design-system.css?v=859')&&index.includes('js/app-loader.js?v=859","css/design-system.css?v=860')&&index.includes('js/app-loader.js?v=859",1)
          trial=trial.replace("const CACHE_ADI='oy-cache-v859'","const CACHE_ADI='oy-cache-v860'",1)
          trial_path.write_text(trial,encoding='utf-8')

      - name: Validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check js/modules/dashboard.js
          node --check service-worker.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/meeting-schedule-v1-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/trial-counter-scroll-stability.test.js
          node tests/web-mobile-engine-separation.test.js

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/design-system.css index.html service-worker.js tests/dashboard-card-routes-smoke.test.js tests/trial-counter-scroll-stability.test.js
          git commit -m "fix: stop completed bell icon animation"
          git push origin main
