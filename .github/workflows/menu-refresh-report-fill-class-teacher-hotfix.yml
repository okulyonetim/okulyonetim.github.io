name: Menu refresh and report readability hotfix
on:
  push:
    branches: [fix/menu-refresh-report-fill-class-teacher]
    paths:
      - '.github/workflows/menu-refresh-report-fill-class-teacher-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/menu-refresh-report-fill-class-teacher
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply focused fixes
        run: python .github/scripts/menu_refresh_report_hotfix.py
      - name: Validate focused changes
        run: |
          node --check js/core/core.js
          node --check js/modules/report-engine.js
          node --check js/modules/academic.js
          node --check js/core/schedule-report-redesign.js
          node tests/menu-refresh-report-fill-class-teacher.test.js
          node tests/report-engine-a4-smoke.test.js
          node tests/schedule-report-redesign.test.js
          node tests/schedule-report-column-zebra.test.js
          node tests/android-pull-refresh-guard.test.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/core.js js/modules/report-engine.js js/modules/academic.js js/core/schedule-report-redesign.js index.html js/app-loader.js js/firebase-init.js service-worker.js tests/menu-refresh-report-fill-class-teacher.test.js tests/schedule-report-redesign.test.js tests/schedule-report-column-zebra.test.js
          git commit -m 'fix: enable menu refresh and soften report fills' || exit 0
          git push origin HEAD:fix/menu-refresh-report-fill-class-teacher
