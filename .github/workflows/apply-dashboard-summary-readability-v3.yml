name: Apply dashboard school summary readability v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dashboard-summary-readability-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply school summary readability v3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path=Path('css/design-system.css')
          css=css_path.read_text(encoding='utf-8')
          marker='/* ===== DASHBOARD SCHOOL SUMMARY READABILITY V3 ===== */'
          if marker in css:
              raise SystemExit('V3 marker already exists')
          lines=[
              '',marker,
              '/* Mobilde 2x2 yapı korunurken küçük metinler erişilebilir okunabilirlik seviyesine çıkarılır. */',
              '.ka-school-summary-section>.ka-home-section__head{padding:3px 3px 10px}',
              '.ka-school-summary-section>.ka-home-section__head h3{font-size:18px}',
              '.ka-school-summary-grid{gap:9px}',
              '.ka-school-summary-card{min-height:140px;padding:13px 11px 11px;border-radius:19px}',
              '.ka-school-summary-icon{width:40px;height:40px;border-radius:12px;font-size:20px;margin-bottom:6px}',
              '.ka-school-summary-card>small{font-size:10.5px;line-height:1.25;font-weight:800}',
              '.ka-school-summary-card>b{margin:3px 0 6px;font-size:29px;line-height:1}',
              '.ka-school-summary-meta{min-height:20px;gap:7px;font-size:11.5px;line-height:1.3;font-weight:750;font-variant-numeric:tabular-nums}',
              '.ka-school-summary-card.is-student{padding-inline:10px}',
              '.ka-school-summary-card.is-student .ka-school-summary-meta{margin-top:2px;padding-top:7px}',
              '.ka-school-stage{gap:3px;padding:0 3px}',
              '.ka-school-stage-icon{width:22px;height:22px;border-radius:7px;font-size:11px}',
              '.ka-school-stage>small{font-size:9.8px;letter-spacing:.02em;line-height:1.2;font-weight:800}',
              '.ka-school-stage>strong{font-size:18px;line-height:1.05}',
              '.ka-school-stage>div{gap:6px;font-size:10.8px;line-height:1.25;font-weight:900;font-variant-numeric:tabular-nums}',
              '.ka-school-unassigned{margin-top:4px;font-size:9px;line-height:1.3}',
              '@media(max-width:390px){',
              '  .ka-school-summary-grid{gap:8px}',
              '  .ka-school-summary-card{min-height:136px;padding:12px 9px 10px;border-radius:18px}',
              '  .ka-school-summary-icon{width:38px;height:38px;font-size:19px;margin-bottom:5px}',
              '  .ka-school-summary-card>small{font-size:10px}',
              '  .ka-school-summary-card>b{font-size:27px}',
              '  .ka-school-summary-meta{gap:6px;font-size:10.8px}',
              '  .ka-school-summary-card.is-student .ka-school-summary-meta{padding-top:6px}',
              '  .ka-school-stage{padding-inline:2px}',
              '  .ka-school-stage>small{font-size:9.3px}',
              '  .ka-school-stage>strong{font-size:17px}',
              '  .ka-school-stage>div{gap:5px;font-size:10.3px}',
              '  .ka-school-unassigned{font-size:8.7px}',
              '}',
              '@media(min-width:700px){.ka-school-summary-card{min-height:140px}}'
          ]
          css_path.write_text(css.rstrip()+'\n'+'\n'.join(lines)+'\n',encoding='utf-8')

          index=Path('index.html')
          text=index.read_text(encoding='utf-8')
          old='<link rel="stylesheet" href="css/design-system.css?v=895">'
          new='<link rel="stylesheet" href="css/design-system.css?v=896">'
          if text.count(old)!=1:
              raise SystemExit(f'index css version contract changed: {text.count(old)}')
          index.write_text(text.replace(old,new),encoding='utf-8')

          sw=Path('service-worker.js')
          text=sw.read_text(encoding='utf-8')
          for old,new in [("const CACHE_ADI='oy-cache-v897';","const CACHE_ADI='oy-cache-v898';"),("'./css/design-system.css?v=895'","'./css/design-system.css?v=896'")]:
              if text.count(old)!=1:
                  raise SystemExit(f'service worker contract changed: {old} => {text.count(old)}')
              text=text.replace(old,new)
          sw.write_text(text,encoding='utf-8')

          test=Path('tests/dashboard-school-summary-readability-v3.test.js')
          test_lines=[
              "const test=require('node:test');",
              "const assert=require('node:assert/strict');",
              "const fs=require('node:fs');",
              "const path=require('node:path');",
              "const root=path.resolve(__dirname,'..');",
              "const css=fs.readFileSync(path.join(root,'css/design-system.css'),'utf8');",
              "const marker='/* ===== DASHBOARD SCHOOL SUMMARY READABILITY V3 ===== */';",
              "const block=css.slice(css.lastIndexOf(marker));",
              "test('school summary v3 raises general mobile readability',()=>{",
              "  assert.ok(block.startsWith(marker));",
              "  assert.match(block,/\\.ka-school-summary-card\\{min-height:140px/);",
              "  assert.match(block,/\\.ka-school-summary-card>small\\{font-size:10\\.5px/);",
              "  assert.match(block,/\\.ka-school-summary-meta\\{min-height:20px;gap:7px;font-size:11\\.5px/);",
              "});",
              "test('gender and stage text do not collapse on narrow phones',()=>{",
              "  assert.match(block,/\\.ka-school-stage>small\\{font-size:9\\.8px/);",
              "  assert.match(block,/\\.ka-school-stage>div\\{gap:6px;font-size:10\\.8px/);",
              "  assert.match(block,/@media\\(max-width:390px\\)[\\s\\S]*?\\.ka-school-summary-meta\\{gap:6px;font-size:10\\.8px/);",
              "  assert.match(block,/@media\\(max-width:390px\\)[\\s\\S]*?\\.ka-school-stage>div\\{gap:5px;font-size:10\\.3px/);",
              "});"
          ]
          test.write_text('\n'.join(test_lines)+'\n',encoding='utf-8')
          PY
      - name: Regression checks
        run: |
          node --check js/modules/dashboard.js
          node --test tests/dashboard-school-summary-readability.test.js tests/dashboard-school-summary-readability-v3.test.js tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit verified change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-dashboard-summary-readability-v3.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: strengthen school summary mobile readability'
          git push
