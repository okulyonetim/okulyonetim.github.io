name: Patch Retired Mevzuat Test

on:
  push:
    branches:
      - feat/remove-mevzuat

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/remove-mevzuat
      - name: Patch shell contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/classic-shell-v2-smoke.test.js')
          s=p.read_text()
          s=s.replace("\n  ['Mevzuat','documents','mevzuat'],['Akademik Takvim'","\n  ['Akademik Takvim'",1)
          s=s.replace("&&ui.includes(\"global.LegislationModule.mount(root)\")",'',1)
          s=s.replace("assert(ui.includes(\"loadScript?.('js/modules/legislation.js')\")&&ui.includes(\"loadScript?.('js/modules/legislation-ui.js')\"),'Mevzuat özel route motor ve UI scriptlerini ihtiyaç anında yüklemeli.');\n",'',1)
          if "['Mevzuat','documents','mevzuat']" in s or 'global.LegislationModule.mount(root)' in s or "loadScript?.('js/modules/legislation.js')" in s or "loadScript?.('js/modules/legislation-ui.js')" in s:
              raise SystemExit('Retired Mevzuat expectations remain')
          p.write_text(s)
          PY
          node tests/classic-shell-v2-smoke.test.js
      - name: Commit patch
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/classic-shell-v2-smoke.test.js
          git commit -m "test: retire Mevzuat shell expectations"
          git push origin HEAD:feat/remove-mevzuat
