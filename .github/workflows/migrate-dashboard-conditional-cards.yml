name: migrate-dashboard-conditional-cards
on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-dashboard-conditional-cards.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply dashboard conditional cards migration
        run: python scripts/migrate-dashboard-conditional-cards.py
      - name: Syntax checks
        run: node --check js/modules/dashboard.js
      - name: Dashboard checks
        run: |
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-reminders-smoke.test.js
      - name: Architecture checks
        run: node scripts/check-client-architecture.mjs
      - name: Cleanup temporary migration files
        run: rm -f scripts/migrate-dashboard-conditional-cards.py .github/workflows/migrate-dashboard-conditional-cards.yml
      - name: Commit production migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(dashboard): show only teacher leave cards when active'
          git push
