name: Apply dashboard lazy communication optimization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Remove eager communication module from dashboard startup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          loader=Path('js/app-loader.js')
          s=loader.read_text(encoding='utf-8')
          old="define('dashboard',['js/modules/school-live-status.js','js/modules/communication.js?v=838','js/modules/dashboard.js?v=872']);"
          new="define('dashboard',['js/modules/school-live-status.js','js/modules/dashboard.js?v=873']);"
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('AppLoader v44','AppLoader v45',1)
          loader.write_text(s,encoding='utf-8')

          dash=Path('js/modules/dashboard.js')
          d=dash.read_text(encoding='utf-8')
          old_ok='const ok=!!window.DuyurularService?.benOkudumMu?.(d)'
          new_ok="const ok=!!d?.okuyanlar?.[user().uid||'']"
          assert old_ok in d
          d=d.replace(old_ok,new_ok,1)
          old_write='await window.DuyurularService?.okunduIsaretle?.(box.dataset.dashAnnouncementRead);'
          new_write="if(!window.DuyurularService?.okunduIsaretle)await window.AppLoader?.load?.('communication');if(!window.DuyurularService?.okunduIsaretle)throw new Error('Duyuru servisi yüklenemedi.');await window.DuyurularService.okunduIsaretle(box.dataset.dashAnnouncementRead);"
          assert old_write in d
          d=d.replace(old_write,new_write,1)
          dash.write_text(d,encoding='utf-8')

          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          assert 'js/app-loader.js?v=893' in html
          index.write_text(html.replace('js/app-loader.js?v=893','js/app-loader.js?v=894'),encoding='utf-8')

          swp=Path('service-worker.js')
          sw=swp.read_text(encoding='utf-8')
          assert "const CACHE_ADI='oy-cache-v900';" in sw
          assert "'./js/app-loader.js?v=893'" in sw
          assert "'./js/modules/dashboard.js?v=872'" in sw
          sw=sw.replace("const CACHE_ADI='oy-cache-v900';","const CACHE_ADI='oy-cache-v901';",1)
          sw=sw.replace("'./js/app-loader.js?v=893'","'./js/app-loader.js?v=894'",1)
          sw=sw.replace("'./js/modules/dashboard.js?v=872'","'./js/modules/dashboard.js?v=873'",1)
          swp.write_text(sw,encoding='utf-8')

          perf=Path('tests/runtime-performance-smoke.test.js')
          p=perf.read_text(encoding='utf-8')
          if "const loader=fs.readFileSync('js/app-loader.js','utf8');" not in p:
              p=p.replace("const dashboard=fs.readFileSync('js/modules/dashboard.js','utf8');", "const dashboard=fs.readFileSync('js/modules/dashboard.js','utf8');\nconst loader=fs.readFileSync('js/app-loader.js','utf8');")
          anchor="assert(dashboard.includes('renderFrame=requestAnimationFrame'),'Dashboard veri güncellemelerini frame bazında birleştirmeli.');"
          add="\nassert(loader.includes(\"define('dashboard',['js/modules/school-live-status.js','js/modules/dashboard.js?v=873'])\"),'Dashboard başlangıcı ağır communication modülünü eager yüklememeli.');\nassert(dashboard.includes(\"AppLoader?.load?.('communication')\"),'Duyuru yazma servisi yalnız etkileşim anında lazy yüklenmeli.');\nassert(dashboard.includes(\"d?.okuyanlar?.[user().uid||'']\"),'Duyuru okundu görünümü local-first kayıttan hesaplanmalı.');"
          assert anchor in p
          p=p.replace(anchor,anchor+add,1)
          perf.write_text(p,encoding='utf-8')

          # Eski regresyon sözleşmeleri communication.js'in dashboard açılışında eager yüklenmesini
          # zorunlu kılıyordu. Yeni sözleşme: veri IndexedDB/AppStore'dan okunur, servis sadece yazma anında lazy yüklenir.
          classic=Path('tests/classic-shell-v2-smoke.test.js')
          c=classic.read_text(encoding='utf-8')
          old_c="assert(dashboardBundleNormalized.includes(\"'js/modules/school-live-status.js'\")&&dashboardBundleNormalized.includes(\"'js/modules/communication.js'\")&&dashboardBundleNormalized.includes(\"'js/modules/dashboard.js'\")&&dashboardBundleNormalized.indexOf(\"'js/modules/school-live-status.js'\")<dashboardBundleNormalized.indexOf(\"'js/modules/communication.js'\")&&dashboardBundleNormalized.indexOf(\"'js/modules/communication.js'\")<dashboardBundleNormalized.indexOf(\"'js/modules/dashboard.js'\"),'Dashboard açılmadan önce SchoolLiveStatus ve mevcut tek duyuru servis sahibi lazy bundle içinde yüklenmeli.');"
          new_c="assert(dashboardBundleNormalized.includes(\"'js/modules/school-live-status.js'\")&&dashboardBundleNormalized.includes(\"'js/modules/dashboard.js'\")&&!dashboardBundleNormalized.includes(\"'js/modules/communication.js'\")&&dashboardBundleNormalized.indexOf(\"'js/modules/school-live-status.js'\")<dashboardBundleNormalized.indexOf(\"'js/modules/dashboard.js'\"),'Dashboard açılışı SchoolLiveStatus + Dashboard ile hafif kalmalı; Communication yalnız etkileşimde yüklenmeli.');"
          assert old_c in c
          classic.write_text(c.replace(old_c,new_c,1),encoding='utf-8')

          routes=Path('tests/dashboard-card-routes-smoke.test.js')
          r=routes.read_text(encoding='utf-8')
          old_r1="assert(dash.includes(\"DuyurularService?.benOkudumMu?.(d)\")&&dash.includes('data-dash-announcement-read'),'Duyuru kartı mevcut local-first okundu servisini kullanmalı.');"
          new_r1="assert(dash.includes(\"d?.okuyanlar?.[user().uid||'']\")&&dash.includes('data-dash-announcement-read'),'Duyuru kartı okundu durumunu hydrate edilmiş local-first kayıttan hesaplamalı.');"
          old_r2="assert(dash.includes(\"DuyurularService?.okunduIsaretle?.(box.dataset.dashAnnouncementRead)\"),'Dashboard Okudum işlemi mevcut DuyurularService üzerinden yazmalı.');"
          new_r2="assert(dash.includes(\"AppLoader?.load?.('communication')\")&&dash.includes('DuyurularService.okunduIsaretle(box.dataset.dashAnnouncementRead)'),'Dashboard Okudum işlemi mevcut DuyurularService sahibini ihtiyaç anında lazy yükleyip kullanmalı.');"
          assert old_r1 in r and old_r2 in r
          r=r.replace(old_r1,new_r1,1).replace(old_r2,new_r2,1)
          routes.write_text(r,encoding='utf-8')

          lazy=Path('tests/lazy-firebase-storage-smoke.test.js')
          l=lazy.read_text(encoding='utf-8')
          old_l="assert(/define\\('dashboard',\\['js\\/modules\\/school-live-status\\.js','js\\/modules\\/communication\\.js(?:\\?v=\\d+)?','js\\/modules\\/dashboard\\.js(?:\\?v=\\d+)?'\\]\\)/.test(loader),'Dashboard duyuru okundu işlemi için mevcut tek Communication servis sahibini kullanmalı; ikinci DuyurularService üretmemeli.');"
          new_l="assert(/define\\('dashboard',\\['js\\/modules\\/school-live-status\\.js','js\\/modules\\/dashboard\\.js(?:\\?v=\\d+)?'\\]\\)/.test(loader)&&!loader.match(/define\\('dashboard',\\[[^\\]]*communication\\.js/),'Dashboard başlangıcı Communication/Storage zincirini eager yüklememeli.');\nassert(communication.includes('global.DuyurularService=')&&!fs.readFileSync('js/modules/dashboard.js','utf8').includes('global.DuyurularService='),'DuyurularService tek sahibi Communication modülü olarak kalmalı.');"
          assert old_l in l
          lazy.write_text(l.replace(old_l,new_l,1),encoding='utf-8')
          PY
      - name: Syntax checks
        run: |
          node --check js/app-loader.js
          node --check js/modules/dashboard.js
          node --check service-worker.js
      - name: Full client regression suite
        run: node scripts/run-client-tests.mjs
      - name: Client architecture audit
        run: node scripts/check-client-architecture.mjs
      - name: Commit verified optimization
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app-loader.js js/modules/dashboard.js index.html service-worker.js tests/runtime-performance-smoke.test.js tests/classic-shell-v2-smoke.test.js tests/dashboard-card-routes-smoke.test.js tests/lazy-firebase-storage-smoke.test.js
          git commit -m 'perf: lazy load communication after dashboard startup'
          git push origin main
