name: Fix stale shell css owner test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-classic-shell-css-owner-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Make CSS owner assertion version agnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/classic-shell-v2-smoke.test.js')
          s=p.read_text()
          old='''assert((shell.match(/<link\\s+rel=\\"stylesheet\\"/g)||[]).length===1&&shell.includes('<link rel=\\"stylesheet\\" href=\\"css/design-system.css?v=878\\">'),'Production shell yalnız tek merkezi css/design-system.css yüklemeli.');'''
          new='''const styleHrefs=[...shell.matchAll(/<link\\s+rel=["']stylesheet["'][^>]*href=["']([^"']+)["'][^>]*>/gi)].map(m=>m[1]);\nassert(styleHrefs.length===1&&/^css\\/design-system\\.css(?:\\?v=\\d+)?$/.test(styleHrefs[0]),'Production shell yalnız tek merkezi css/design-system.css yüklemeli.');'''
          if old not in s:
              raise SystemExit('Stale CSS owner assertion anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify focused shell contract
        run: node tests/classic-shell-v2-smoke.test.js
      - name: Commit focused test debt fix
        run: |
          git rm .github/workflows/fix-classic-shell-css-owner-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/classic-shell-v2-smoke.test.js
          git commit -m 'test: make shell css owner check version agnostic'
          git push origin HEAD:main
