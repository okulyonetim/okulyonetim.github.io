name: fix-core-direct
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch core
        shell: python
        run: |
          from pathlib import Path
          import re
          core=Path('js/core/core.js')
          s=core.read_text(encoding='utf-8')
          if 'function timestampValue(v)' not in s:
              pattern=r'function remoteTimestamp\(row\)\{[\s\S]*?\n\}'
              m=re.search(pattern,s)
              if not m:
                  raise SystemExit('remoteTimestamp function not found')
              helper="""\nfunction timestampValue(v){\n  if(v==null)return 0;\n  if(typeof v==='number')return Number.isFinite(v)?v:0;\n  try{\n    const d=v?.toDate?v.toDate():new Date(v);\n    const n=d.getTime();\n    return Number.isFinite(n)?n:0;\n  }catch(_){return 0}\n}\n"""
              s=s[:m.end()]+helper+s[m.end():]
              core.write_text(s,encoding='utf-8')
          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=re.sub(r'js/core/core\.js\?v=\d+','js/core/core.js?v=1039',h,count=1)
          idx.write_text(h,encoding='utf-8')
          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8')
          w=re.sub(r"const CACHE_ADI='oy-cache-v\d+';","const CACHE_ADI='oy-cache-v1236';",w,count=1)
          w=w.replace('./js/core/core.js?v=1037','./js/core/core.js?v=1039',1)
          sw.write_text(w,encoding='utf-8')
          Path('.github/workflows/fix-core-direct.yml').unlink()
          Path('.github/workflows/fix-first-login-timestamp.yml').unlink(missing_ok=True)
      - name: Verify and commit
        shell: bash
        run: |
          set -e
          node --check js/core/core.js
          grep -q "function timestampValue(v)" js/core/core.js
          grep -q "core.js?v=1039" index.html
          grep -q "core.js?v=1039" service-worker.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/core.js index.html service-worker.js .github/workflows/fix-core-direct.yml .github/workflows/fix-first-login-timestamp.yml
          git commit -m 'Fix first-login Firestore sync'
          git push origin main
