name: Switch Mevzuat live Worker
on:
  push:
    branches: [feat/switch-mevzuat-live-worker]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/switch-mevzuat-live-worker
      - shell: python
        run: |
          from pathlib import Path
          p=Path('js/modules/legislation.js')
          s=p.read_text()
          old="https://koruk-mevzuat-asistan.sedonet23.workers.dev/"
          new="https://empty-base-2bc6.sedonet23.workers.dev/"
          if old not in s: raise SystemExit('Old Worker URL not found')
          p.write_text(s.replace(old,new,1))
          sw=Path('service-worker.js')
          t=sw.read_text()
          if "oy-cache-v935" not in t: raise SystemExit('Expected cache version not found')
          sw.write_text(t.replace("oy-cache-v935","oy-cache-v936",1))
          Path('.github/workflows/switch-mevzuat-live-worker.yml').unlink()
      - run: |
          grep -F "https://empty-base-2bc6.sedonet23.workers.dev/" js/modules/legislation.js
          grep -F "oy-cache-v936" service-worker.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/legislation.js service-worker.js .github/workflows/switch-mevzuat-live-worker.yml
          git commit -m "feat: connect Mevzuat Asistanı to live Worker"
          git push origin HEAD:feat/switch-mevzuat-live-worker
