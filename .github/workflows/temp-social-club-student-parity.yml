name: temp-social-club-student-parity
on:
  push:
    branches: [work/social-clubs-student-parity-20260831]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply canonical social club student parity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path('js/modules/rubric-settings.js')
          src=path.read_text(encoding='utf-8')

          social_pattern=re.compile(r"function socialCard\(r\)\{.*?\}\nfunction belirliCard",re.S)
          social_replacement=r'''function clubStudents(id){return arr('veliler').filter(v=>v.kulupId===id)}
          function canManageClubStudents(r){if(!r?.id)return false;const u=global.AKTIF_KULLANICI||global.AppStore?.get?.('session.user')||{},tid=u.bagliOgretmenId||u.ogretmenId||'',advisor=!!(tid&&Array.isArray(r.ogretmenIdler)&&r.ogretmenIdler.includes(tid));if(u.admin===true||advisor)return true;try{return !!(global.PermissionService?.can?.('people.students.edit','edit')||global.PermissionService?.can?.('people.classes','edit'))}catch(_){return false}}
          function socialCard(r){const a=checkArray('sosyalKulupler',r),done=a.filter(Boolean).length,classes=Array.isArray(r.sinifIdler)&&r.sinifIdler.length?r.sinifIdler.map(className).join(', '):'Sınıf kısıtı yok — tüm sınıflar seçebilir',studentCount=clubStudents(r.id).length,studentManage=canManageClubStudents(r);return `<article class="ka-card"><div class="ka-card__body ka-stack"><div class="ka-row ka-row--between"><div class="ka-grow"><div class="ka-row ka-wrap"><strong>${esc(r.ad||'İsimsiz Kulüp')}</strong><span class="ka-badge">${r.aktif===false?'Pasif':'Aktif'}</span></div></div><div class="ka-row"><span class="ka-badge">${done}/12</span>${editButton('sosyalKulupler',r.id)}</div></div>${teacherBadges(r.ogretmenIdler)}<div class="ka-muted">${esc(classes)}</div>${r.yillikPlanTarihi||r.toplumHizmetiTarihi?`<div class="ka-muted">${r.yillikPlanTarihi?`Yıllık plan: ${esc(trDate(r.yillikPlanTarihi))}`:''}${r.yillikPlanTarihi&&r.toplumHizmetiTarihi?' · ':''}${r.toplumHizmetiTarihi?`Toplum hizmeti: ${esc(trDate(r.toplumHizmetiTarihi))}`:''}</div>`:''}<div class="ka-row ka-wrap" style="justify-content:flex-end">${studentManage?`<button class="ka-btn ka-btn--secondary ka-btn--sm" type="button" data-cizelge-club-students="${esc(r.id)}">➕ Öğrenci Ekle</button>`:''}<button class="ka-btn ka-btn--secondary ka-btn--sm" type="button" data-cizelge-club-print="${esc(r.id)}">👥 Öğrenciler (${studentCount})</button></div>${controlGrid('sosyalKulupler',r)}</div></article>`}
          function belirliCard'''
          src,n=social_pattern.subn(lambda m:social_replacement,src,count=1)
          assert n==1,'socialCard replacement failed'

          bind_pattern=re.compile(r"function bindPage\(root\)\{.*?\}\nasync function toggleControl",re.S)
          bind_replacement=r'''function bindPage(root){root.querySelector('[data-cizelge-add]')?.addEventListener('click',()=>openEdit(currentType));root.querySelectorAll('[data-cizelge-edit]').forEach(b=>b.addEventListener('click',()=>openEdit(currentType,b.dataset.cizelgeEdit)));root.querySelectorAll('[data-cizelge-check]').forEach(cb=>cb.addEventListener('change',()=>toggleControl(cb)));root.querySelectorAll('[data-cizelge-club-students]').forEach(b=>b.addEventListener('click',()=>openClubStudents(b.dataset.cizelgeClubStudents)));root.querySelectorAll('[data-cizelge-club-print]').forEach(b=>b.addEventListener('click',()=>printClubStudents(b.dataset.cizelgeClubPrint)));root.querySelector('[data-cizelge-bulk]')?.addEventListener('click',()=>openBulk(currentType));root.querySelector('[data-cizelge-report]')?.addEventListener('click',()=>printReport(currentType));root.querySelector('[data-cizelge-excel]')?.addEventListener('click',()=>chooseExcel(currentType))}
          async function toggleControl'''
          src,n=bind_pattern.subn(lambda m:bind_replacement,src,count=1)
          assert n==1,'bindPage replacement failed'

          marker="function teachersChecks(name,selected=[]){"
          assert src.count(marker)==1,'teachersChecks marker mismatch'
          helpers=r'''async function ensureClubStudentService(){if(global.SiniflarService)return global.SiniflarService;if(global.AppLoader?.load)await global.AppLoader.load('people');if(!global.SiniflarService)throw new Error('Öğrenci servisi hazır değil.');return global.SiniflarService}
          function clubEligibleClasses(club){const limited=Array.isArray(club?.sinifIdler)&&club.sinifIdler.length?new Set(club.sinifIdler):null;return arr('siniflar').filter(s=>!limited||limited.has(s.id)).sort((a,b)=>String(a.ad||'').localeCompare(String(b.ad||''),'tr',{numeric:true}))}
          async function openClubStudents(id){const club=arr('sosyalKulupler').find(x=>x.id===id);if(!club){global.toast?.('Kulüp bulunamadı.');return}let svc;try{svc=await ensureClubStudentService()}catch(e){global.toast?.(e?.message||'Öğrenci servisi hazır değil.');return}let allowed=false;try{allowed=!!(svc._yetkiKontrolSessiz?.()||svc._kulupDanismaniMi?.(id))}catch(_){}if(!allowed){global.toast?.('Bu kulübün öğrencilerini değiştirme yetkiniz yok.');return}const selected=new Set(clubStudents(id).map(v=>v.id)),classes=clubEligibleClasses(club),students=arr('veliler');const groups=classes.map(s=>{const rows=students.filter(v=>v.sinifId===s.id).sort((a,b)=>String(a.ogrenciAdi||'').localeCompare(String(b.ogrenciAdi||''),'tr'));return `<details class="ka-card"><summary class="ka-card__body ka-row ka-row--between"><strong>${esc(s.ad||'Sınıf')}</strong><span class="ka-badge">${rows.length} öğrenci</span></summary><div class="ka-card__body ka-stack">${rows.map(v=>`<label class="ka-row"><input type="checkbox" name="ogrenciIds" value="${esc(v.id)}" ${selected.has(v.id)?'checked':''}><span class="ka-grow">${esc(v.ogrenciAdi||'Öğrenci')}${v.kulupId&&v.kulupId!==id&&v.kulupAdi?` <span class="ka-muted">(${esc(v.kulupAdi)} kulübünde)</span>`:''}</span></label>`).join('')||'<span class="ka-muted">Bu sınıfta öğrenci yok.</span>'}</div></details>`}).join('');closeModal();document.body.insertAdjacentHTML('beforeend',`<div class="ka-modal-backdrop" data-cizelge-modal style="z-index:1400"><form class="ka-modal" data-cizelge-club-form data-club-id="${esc(id)}"><div class="ka-modal__header"><h2>➕ ${esc(club.ad||'Kulüp')} — Öğrenci Ekle</h2></div><div class="ka-modal__body ka-stack"><p class="ka-muted">Kulübe dahil etmek istediğiniz öğrencileri işaretleyin. İşareti kaldırılan mevcut üyeler kulüpten çıkarılır. Başka bir kulüpteki öğrenci seçilirse bu kulübe taşınır.</p>${groups||'<div class="ka-empty">Uygun sınıf bulunamadı.</div>'}</div><div class="ka-modal__footer"><button class="ka-btn ka-btn--secondary" type="button" data-cizelge-cancel>Vazgeç</button><span class="ka-grow"></span><button class="ka-btn" type="submit">Kaydet</button></div></form></div>`);const modal=$('[data-cizelge-modal]');modal?.addEventListener('click',e=>{if(e.target===modal)closeModal()});modal?.querySelector('[data-cizelge-cancel]')?.addEventListener('click',closeModal);modal?.querySelector('[data-cizelge-club-form]')?.addEventListener('submit',saveClubStudents)}
          async function saveClubStudents(e){e.preventDefault();const form=e.currentTarget,id=form.dataset.clubId,club=arr('sosyalKulupler').find(x=>x.id===id);if(!club)return;const svc=await ensureClubStudentService(),before=new Set(clubStudents(id).map(v=>v.id)),after=new Set(new FormData(form).getAll('ogrenciIds').map(String)),added=[...after].filter(x=>!before.has(x)),removed=[...before].filter(x=>!after.has(x)),submit=form.querySelector('[type="submit"]');if(!added.length&&!removed.length){global.toast?.('Değişiklik yapılmadı.');closeModal();return}try{if(submit)submit.disabled=true;await Promise.all([...added.map(studentId=>global.SiniflarService.ogrenciKulupGuncelle(studentId,club.id,club.ad||'')),...removed.map(studentId=>global.SiniflarService.ogrenciKulupGuncelle(studentId,'',''))]);global.toast?.(`Kaydedildi — ${added.length} eklendi, ${removed.length} çıkarıldı.`);closeModal();render(true)}catch(err){global.toast?.(err?.message==='yetkisiz'?'Bu işlem için yetkiniz yok.':'Kulüp öğrencileri kaydedilemedi.')}finally{if(submit)submit.disabled=false}}
          async function printClubStudents(id){const club=arr('sosyalKulupler').find(x=>x.id===id);if(!club){global.toast?.('Kulüp bulunamadı.');return}try{await ensureReport();const rows=clubStudents(id).slice().sort((a,b)=>String(className(a.sinifId)).localeCompare(String(className(b.sinifId)),'tr',{numeric:true})||String(a.ogrenciAdi||'').localeCompare(String(b.ogrenciAdi||''),'tr')),advisors=Array.isArray(club.ogretmenIdler)&&club.ogretmenIdler.length?club.ogretmenIdler.map(teacherName).join(', '):'Öğretmen atanmadı',table=`<p><strong>Danışman Öğretmenler:</strong> ${esc(advisors)}</p><table><thead><tr><th>Sıra</th><th>Öğrenci</th><th>Sınıf</th></tr></thead><tbody>${rows.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.ogrenciAdi||'')}</td><td>${esc(className(v.sinifId))}</td></tr>`).join('')||'<tr><td colspan="3">Kulübe atanmış öğrenci yok.</td></tr>'}</tbody></table>`;await global.ReportEngine.printReport(`${club.ad||'Kulüp'} — Öğrenci Listesi`,table,{yon:'dikey',compact:true,fileName:`${club.ad||'Kulüp'} Öğrenci Listesi`})}catch(e){global.toast?.('Öğrenci listesi açılamadı: '+(e?.message||e))}}
          '''
          src=src.replace(marker,helpers+marker,1)
          path.write_text(src,encoding='utf-8')

          test=Path('tests/rubric-settings-v2-smoke.test.js')
          t=test.read_text(encoding='utf-8')
          needle='  "global.CizelgelerService.cokluKayitOlustur",\n'
          assert t.count(needle)==1,'test insertion marker mismatch'
          addition=(needle+"  'data-cizelge-club-students',\n  'data-cizelge-club-print',\n  \"global.AppLoader.load('people')\",\n  'global.SiniflarService.ogrenciKulupGuncelle',\n  \"arr('veliler').filter(v=>v.kulupId===id)\",\n")
          t=t.replace(needle,addition,1)
          test.write_text(t,encoding='utf-8')
          PY
      - name: Syntax and focused contracts
        run: |
          node --check js/modules/rubric-settings.js
          node tests/rubric-settings-v2-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/classes-mobile-parity-smoke.test.js
          node tests/module-bundles-smoke.test.js
          node tests/root-js-inventory-smoke.test.js
      - name: Build and architecture audit
        run: |
          node scripts/build-client-bundles.mjs
          node scripts/check-client-architecture.mjs
          git diff --check
      - name: Commit canonical files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/rubric-settings.js tests/rubric-settings-v2-smoke.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Restore social club student assignment parity [skip ci]"
          git push
