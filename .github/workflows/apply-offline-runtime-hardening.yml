name: Apply offline runtime hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-offline-runtime-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare safe runtime patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-offline-runtime-hardening-v2.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('# CSS: remove superseded dashboard override and stop browser/PWA overscroll-refresh globally.')
          end=s.index('# Service worker: retain offline cache-first behavior, but never hard-reload live clients during activation.')
          css_patch="""# CSS: preserve existing page-specific design blocks; add only the global overscroll boundary.\ncss=Path('css/design-system.css')\ntext=css.read_text(encoding='utf-8')\nscroll_marker='/* ===== GLOBAL SCROLL / PULL-TO-REFRESH GUARD ===== */'\nif scroll_marker not in text:\n    text+='\\n\\n'+scroll_marker+'\\nhtml,body,.ka-app-shell{overscroll-behavior-y:none}\\n.ka-app-content{overscroll-behavior-y:contain}\\n.ka-app-nav.ka-bottom-nav{overscroll-behavior:none;touch-action:manipulation}\\n'\ncss.write_text(text,encoding='utf-8')\n\n"""
          s=s[:start]+css_patch+s[end:]
          s=s.replace("\nif v2 in css.read_text(encoding='utf-8'): raise SystemExit('dashboard V2 CSS still present')\n",'\n')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply Android and offline hardening fixes
        run: |
          python3 scripts/apply-offline-runtime-hardening-v2.py
          python3 <<'PY'
          from pathlib import Path
          p=Path('tests/service-worker-precache-smoke.test.js')
          s=p.read_text(encoding='utf-8')
          old="assert(sw.includes(\"self.clients.matchAll({type:'window',includeUncontrolled:true})\")&&sw.includes('client.navigate(client.url)'), 'Yeni Service Worker eski runtime kullanan açık PWA pencerelerini yeni belgeye taşımalı.');"
          new="assert(sw.includes('await self.clients.claim()')&&!sw.includes('windows.map(client=>client.navigate(client.url))'), 'Yeni Service Worker canlı local-first oturumu zorla yenilemeden istemciyi devralmalı.');"
          if old not in s: raise SystemExit('stale service-worker reload assertion not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Check all JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify focused regressions
        run: |
          node tests/android-pull-refresh-guard.test.js
          node tests/service-worker-no-forced-reload.test.js
          node tests/legislation-engine-v2-smoke.test.js
          node tests/dashboard-school-summary-readability.test.js
          node tests/dashboard-school-summary-readability-v3.test.js
          node tests/notes-page-redesign.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/modules-local-first-boundary.test.js
      - name: Run complete client regression suite
        run: node scripts/run-client-tests.mjs
      - name: Audit client architecture
        run: node scripts/check-client-architecture.mjs
      - name: Verify bundle generation
        run: node scripts/build-client-bundles.mjs
      - name: Commit verified hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'fix: harden offline runtime and Android scrolling'
          git push origin main
