name: Apply offline runtime hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-offline-runtime-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare safe hardening script
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-offline-runtime-hardening.py')
          s=p.read_text(encoding='utf-8')
          a=s.index('# Consolidate legislation engine + presentation: always opened together.')
          b=s.index('# Service worker: no forced client navigation on activation; preserve unrelated caches.')
          s=s[:a]+s[b:]
          s=s.replace("text=text.replace(,\"./js/modules/legislation-ui.js'\",'',1)\n",'')
          s=s.replace("text=text.replace(,\'./js/modules/legislation-ui.js\'\",'',1)\n",'')
          s=s.replace("text=text.replace(,\'./js/modules/legislation-ui.js\'",'',1)\n",'')
          s=s.replace("text=text.replace(,\'./js/modules/legislation-ui.js\'\",'',1)",'')
          # Exact source line is easier to remove by filtering.
          lines=[]
          for line in s.splitlines(True):
              if "legislation-ui.js" in line and ("text.replace" in line or "raise SystemExit('service-worker still references" in line):
                  continue
              lines.append(line)
          s=''.join(lines)
          a=s.index('# Update legislation contract test to single-file source.')
          b=s.index('# Superseded V2 typography regression is replaced by V3.')
          s=s[:a]+s[b:]
          a=s.index('# Consolidation must not leave runtime/test references to retired file.')
          s=s[:a]+"if v2 in css.read_text(encoding='utf-8'): raise SystemExit('Superseded dashboard V2 CSS still present')\n"
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply Android, offline and consolidation fixes
        run: python3 scripts/apply-offline-runtime-hardening.py
      - name: Check all JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify Android pull-to-refresh guard
        run: node tests/android-pull-refresh-guard.test.js
      - name: Verify service worker live-session stability
        run: node tests/service-worker-no-forced-reload.test.js
      - name: Verify legislation architecture
        run: node tests/legislation-engine-v2-smoke.test.js
      - name: Verify dashboard V3 readability
        run: node tests/dashboard-school-summary-readability-v3.test.js
      - name: Verify service worker precache
        run: node tests/service-worker-precache-smoke.test.js
      - name: Verify local-first boundaries
        run: node tests/modules-local-first-boundary.test.js
      - name: Run complete client regression suite
        run: node scripts/run-client-tests.mjs
      - name: Audit client architecture
        run: node scripts/check-client-architecture.mjs
      - name: Verify bundle generation
        run: node scripts/build-client-bundles.mjs
      - name: Commit verified hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'fix: harden offline runtime and Android scrolling'
          git push origin main
