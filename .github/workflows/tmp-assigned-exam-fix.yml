name: Apply assigned teacher exam edit and profile deep link

on:
  push:
    branches:
      - fix/assigned-teacher-exam-edit-open-20260912
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once('js/modules/academic.js',
          "  sinavDuzenlenebilirMi(s){if(!duzenleyebilir('sinavIslemleri'))return false;const u=activeUser();return !!(u.admin||!s?.sahipUid||s.sahipUid===u.uid)},\n  denemeDuzenlenebilirMi(d){if(!duzenleyebilir('sinavIslemleri'))return false;const u=activeUser();return !!(u.admin||!d?.sahipUid||d.sahipUid===u.uid)},\n  sinavKaydet(id,m,v){if(!this._yetkiKontrol())return Promise.reject(new Error('yetkisiz'));if(id){if(!this.sinavDuzenlenebilirMi(m))return Promise.reject(new Error('sahip-degil'));return SinavlarRepository.sinavGuncelle(id,v)}const u=activeUser();return SinavlarRepository.sinavEkle(u.uid?{...v,sahipUid:u.uid}:v)},\n  sinavSil(id,m){if(!this._yetkiKontrol()||!this.sinavDuzenlenebilirMi(m))return Promise.reject(new Error('yetkisiz'));return SinavlarRepository.sinavSil(id)},",
          "  sinavDuzenlenebilirMi(s){if(!duzenleyebilir('sinavIslemleri'))return false;const u=activeUser(),tid=String(u.bagliOgretmenId||u.ogretmenId||'');return !!(u.admin||!s?.sahipUid||s.sahipUid===u.uid||(tid&&String(s?.ogretmenId||'')===tid))},\n  sinavSilinebilirMi(s){if(!duzenleyebilir('sinavIslemleri'))return false;const u=activeUser();return !!(u.admin||!s?.sahipUid||s.sahipUid===u.uid)},\n  denemeDuzenlenebilirMi(d){if(!duzenleyebilir('sinavIslemleri'))return false;const u=activeUser();return !!(u.admin||!d?.sahipUid||d.sahipUid===u.uid)},\n  sinavKaydet(id,m,v){if(!this._yetkiKontrol())return Promise.reject(new Error('yetkisiz'));if(id){if(!this.sinavDuzenlenebilirMi(m))return Promise.reject(new Error('sahip-degil'));return SinavlarRepository.sinavGuncelle(id,v)}const u=activeUser();return SinavlarRepository.sinavEkle(u.uid?{...v,sahipUid:u.uid}:v)},\n  sinavSil(id,m){if(!this._yetkiKontrol()||!this.sinavSilinebilirMi(m))return Promise.reject(new Error('yetkisiz'));return SinavlarRepository.sinavSil(id)},",
          'Academic assigned teacher edit ownership')

          replace_once('js/modules/academic.js',
          "toast?.(e?.message==='sahip-degil'?'Bu kaydı yalnızca ekleyen kişi düzenleyebilir.':e?.message==='yetkisiz'?'Bu işlem için yetkiniz yok.':'Kayıt hatası: '+(e?.message||e))",
          "toast?.(e?.message==='sahip-degil'?'Bu sınavı yalnızca ekleyen kişi, yönetici veya atanmış öğretmen düzenleyebilir.':e?.message==='yetkisiz'?'Bu işlem için yetkiniz yok.':'Kayıt hatası: '+(e?.message||e))",
          'Written edit error copy')

          replace_once('js/modules/academic.js',
          "</textarea></label>`,!!existing);ov.classList.add('ka-written-modal-backdrop')",
          "</textarea></label>`,!!existing&&SinavlarService?.sinavSilinebilirMi?.(existing));ov.classList.add('ka-written-modal-backdrop')",
          'Assigned teacher delete button visibility')

          replace_once('js/modules/academic.js',
          "function openPage(page,title=''){const allowed=['schedule','written','trial','results','plans','calendar'];if(!allowed.includes(page))return false;if(active==='plans'&&page!=='plans')releasePlanWake();if(page!=='trial')closeTrialCounter();if(page!=='results'){ssOpen=null;ssOpenTur=null}active=page;query='';if(page==='plans')planView={planId:'',weekIndex:0};document.body.classList.remove('ka-plan-week-open');applyAcademicMeta(title);render();if(page==='calendar')requestAnimationFrame(()=>openAcademicCalendar(calendarMeta()));else closeAcademicCalendar();return true}\nfunction unmount()",
          "function openPage(page,title=''){const allowed=['schedule','written','trial','results','plans','calendar'];if(!allowed.includes(page))return false;if(active==='plans'&&page!=='plans')releasePlanWake();if(page!=='trial')closeTrialCounter();if(page!=='results'){ssOpen=null;ssOpenTur=null}active=page;query='';if(page==='plans')planView={planId:'',weekIndex:0};document.body.classList.remove('ka-plan-week-open');applyAcademicMeta(title);render();if(page==='calendar')requestAnimationFrame(()=>openAcademicCalendar(calendarMeta()));else closeAcademicCalendar();return true}\nfunction openWrittenExam(id){const exam=arr('sinavlar').find(x=>String(x.id)===String(id));if(!exam)return false;active='written';query='';render();if(!SinavlarService?.sinavDuzenlenebilirMi?.(exam)){toast?.('Bu sınavı düzenleme yetkiniz yok.');return false}writtenModal(exam.id);return true}\nfunction unmount()",
          'Academic direct written exam API')

          replace_once('js/modules/academic.js',
          "window.AcademicModule={mount,unmount,render,prepareLocal,timerState,openPage,openPlanForLesson,openAcademicCalendar,closeAcademicCalendar,openTrialCounter,closeTrialCounter,openSchedule(){return openPage('schedule','Ders Programı')}};",
          "window.AcademicModule={mount,unmount,render,prepareLocal,timerState,openPage,openWrittenExam,openPlanForLesson,openAcademicCalendar,closeAcademicCalendar,openTrialCounter,closeTrialCounter,openSchedule(){return openPage('schedule','Ders Programı')}};",
          'Academic API export')

          replace_once('js/core/shell-ui.js',
          "function profileExamBody(rows){return rows.length?rows.map(x=>`<article class=\"ka-card\"><div class=\"ka-card__body ka-row\"><span class=\"ka-avatar\">📝</span><div class=\"ka-grow\"><strong>${esc(x.ders||x.ad||'Yazılı sınav')}</strong><div class=\"ka-muted\">${esc([x.siniflar||x.sinif,x.donem,x.yaziliSirasi].filter(Boolean).join(' · ')||'Sınıf bilgisi yok')}</div></div><span class=\"ka-badge\">${esc(profileFmtDate(x.tarih))}</span></div></article>`).join(''):'<div class=\"ka-empty\">Size atanmış yazılı sınav kaydı bulunamadı.</div>'}",
          "function profileExamBody(rows){return rows.length?rows.map(x=>`<button type=\"button\" class=\"ka-profile-action\" data-profile-exam-open=\"${esc(x.id)}\"><span class=\"ka-profile-action__icon\" aria-hidden=\"true\">📝</span><span class=\"ka-profile-action__copy\"><strong>${esc(x.ders||x.ad||'Yazılı sınav')}</strong><small>${esc([x.siniflar||x.sinif,x.donem,x.yaziliSirasi,profileFmtDate(x.tarih)].filter(Boolean).join(' · ')||'Sınıf bilgisi yok')}</small></span><span class=\"ka-profile-action__chevron\" aria-hidden=\"true\">›</span></button>`).join(''):'<div class=\"ka-empty\">Size atanmış yazılı sınav kaydı bulunamadı.</div>'}",
          'Profile exam clickable rows')

          replace_once('js/core/shell-ui.js',
          "function profileTaskBody(rows){return rows.length?rows.map(x=>`<article class=\"ka-card\"><div class=\"ka-card__body ka-row\"><span class=\"ka-avatar\">${x.icon}</span><div class=\"ka-grow\"><strong>${esc(x.title)}</strong><div class=\"ka-muted\">${esc(x.meta||x.label)}</div></div><span class=\"ka-badge\">${esc(x.label)}</span></div></article>`).join(''):'<div class=\"ka-empty\">Size bağlı ŞÖK, zümre, belirli gün/hafta, rehberlik, Maarif Model veya yıllık/BEP kaydı bulunamadı.</div>'}\nfunction renderProfileDetail(kind,{remember=true}={})",
          "function profileTaskBody(rows){return rows.length?rows.map(x=>`<article class=\"ka-card\"><div class=\"ka-card__body ka-row\"><span class=\"ka-avatar\">${x.icon}</span><div class=\"ka-grow\"><strong>${esc(x.title)}</strong><div class=\"ka-muted\">${esc(x.meta||x.label)}</div></div><span class=\"ka-badge\">${esc(x.label)}</span></div></article>`).join(''):'<div class=\"ka-empty\">Size bağlı ŞÖK, zümre, belirli gün/hafta, rehberlik, Maarif Model veya yıllık/BEP kaydı bulunamadı.</div>'}\nasync function openProfileExam(id){if(!id)return false;const ok=await routeModule('academic',{bottom:'profile',page:'written',title:'Yazılı Sınavlar'});if(!ok)return false;const opened=global.AcademicModule?.openWrittenExam?.(id);if(opened===false)global.toast?.('Sınav kaydı açılamadı.');return opened!==false}\nfunction renderProfileDetail(kind,{remember=true}={})",
          'Profile deep link helper')

          replace_once('js/core/shell-ui.js',
          "root.innerHTML=`<section class=\"ka-stack\">${profileDetailHead(def[0],def[1])}${body}</section>`;root.querySelector('[data-profile-back]')?.addEventListener('click',()=>back())}",
          "root.innerHTML=`<section class=\"ka-stack\">${profileDetailHead(def[0],def[1])}${body}</section>`;root.querySelector('[data-profile-back]')?.addEventListener('click',()=>back());if(kind==='exams')root.querySelectorAll('[data-profile-exam-open]').forEach(b=>b.addEventListener('click',()=>openProfileExam(b.dataset.profileExamOpen)))}",
          'Profile detail exam binding')

          replace_once('firestore.rules',
          "      allow update: if adminMi() || (moduluDuzenleyebilir('sinavIslemleri')\n        && (('sahipUid' in resource.data && resource.data.sahipUid == request.auth.uid)\n          || !('sahipUid' in resource.data))\n        && !request.resource.data.diff(resource.data).affectedKeys().hasAny(['sahipUid', 'herkeseAcik']));",
          "      allow update: if adminMi() || (moduluDuzenleyebilir('sinavIslemleri')\n        && (((('sahipUid' in resource.data && resource.data.sahipUid == request.auth.uid)\n            || !('sahipUid' in resource.data))\n          && !request.resource.data.diff(resource.data).affectedKeys().hasAny(['sahipUid', 'herkeseAcik']))\n        || (kendiOgretmenIdsi() != null\n          && 'ogretmenId' in resource.data\n          && resource.data.ogretmenId == kendiOgretmenIdsi()\n          && request.resource.data.ogretmenId == kendiOgretmenIdsi()\n          && !request.resource.data.diff(resource.data).affectedKeys().hasAny(['sahipUid', 'herkeseAcik', 'ogretmenId']))));",
          'Firestore assigned written exam update')

          replace_once('tests/sinav-islemleri-owner-rules.test.js',
          "      await setDoc(doc(db,'oy_kullanicilar','otherUid'),{uid:'otherUid',admin:false,aktif:true,rolId:'sinav-editor'});",
          "      await setDoc(doc(db,'oy_kullanicilar','otherUid'),{uid:'otherUid',admin:false,aktif:true,rolId:'sinav-editor',bagliOgretmenId:'teacher-1'});",
          'Rules linked teacher fixture')
          replace_once('tests/sinav-islemleri-owner-rules.test.js',
          "      await setDoc(doc(db,'oy_sinavlar','legacyWritten'),{sinif:'6-A',ders:'Matematik'});",
          "      await setDoc(doc(db,'oy_sinavlar','legacyWritten'),{sinif:'6-A',ders:'Matematik'});\n      await setDoc(doc(db,'oy_sinavlar','adminAssignedWritten'),{sinif:'5-A',ders:'Bilişim',sahipUid:'adminUid',ogretmenId:'teacher-1',herkeseAcik:false});",
          'Rules admin assigned fixture')
          replace_once('tests/sinav-islemleri-owner-rules.test.js',
          "    await assertFails(updateDoc(doc(other,'oy_sinavlar','ownedWritten'),{ders:'Yetkisiz'}));\n    await assertFails(deleteDoc(doc(other,'oy_denemeSinavlari','ownedTrial')));",
          "    await assertFails(updateDoc(doc(other,'oy_sinavlar','ownedWritten'),{ders:'Yetkisiz'}));\n    await assertSucceeds(updateDoc(doc(other,'oy_sinavlar','adminAssignedWritten'),{ders:'Bilişim Teknolojileri ve Yazılım'}));\n    await assertFails(updateDoc(doc(other,'oy_sinavlar','adminAssignedWritten'),{ogretmenId:'teacher-2'}));\n    await assertFails(deleteDoc(doc(other,'oy_sinavlar','adminAssignedWritten')));\n    await assertFails(deleteDoc(doc(other,'oy_denemeSinavlari','ownedTrial')));",
          'Rules assigned teacher assertions')

          replace_once('tests/academic-separate-pages.test.js',
          "assert(academic.includes('sahipUid:u.uid'),'Yazılı kaydının oluşturan hesap sahipliği korunmalı.');",
          "assert(academic.includes('sahipUid:u.uid'),'Yazılı kaydının oluşturan hesap sahipliği korunmalı.');\nassert(academic.includes(\"tid=String(u.bagliOgretmenId||u.ogretmenId||'')\")&&academic.includes(\"String(s?.ogretmenId||'')===tid\"),'Adminin oluşturduğu yazılı atanmış öğretmen tarafından düzenlenebilmeli.');\nassert(academic.includes('sinavSilinebilirMi(s)')&&academic.includes('sinavSilinebilirMi(m)'),'Atanmış öğretmen düzenleme hakkı yazılı silme hakkını otomatik genişletmemeli.');\nassert(academic.includes('function openWrittenExam(id)')&&academic.includes('openWrittenExam,openPlanForLesson'),'AcademicModule profil derin bağlantısı için belirli yazılıyı açma API sağlamalı.');",
          'Academic ownership tests')
          replace_once('tests/academic-separate-pages.test.js',
          "define('academic',[FIREBASE_STORAGE_SDK,'js/modules/report-engine.js','js/modules/academic.js?v=879'])",
          "define('academic',[FIREBASE_STORAGE_SDK,'js/modules/report-engine.js','js/modules/academic.js?v=880'])",
          'Academic loader test version')

          replace_once('tests/profile-page-redesign.test.js',
          "assert(block.includes('suspendModuleForShellSurface()'),'Profil görünümü önce aktif modülü askıya almalı.');",
          "assert(block.includes('suspendModuleForShellSurface()'),'Profil görünümü önce aktif modülü askıya almalı.');\nassert(ui.includes('data-profile-exam-open')&&ui.includes(\"async function openProfileExam(id)\")&&ui.includes(\"routeModule('academic',{bottom:'profile',page:'written',title:'Yazılı Sınavlar'})\")&&ui.includes('AcademicModule?.openWrittenExam?.(id)'),'Profil Sınavlarım kartına dokununca Yazılı Sınavlar ve seçilen kayıt doğrudan açılmalı.');",
          'Profile deep link test')

          replace_once('js/app-loader.js',"js/modules/academic.js?v=879","js/modules/academic.js?v=880",'Academic loader version')
          replace_once('index.html',"js/core/shell-ui.js?v=884","js/core/shell-ui.js?v=885",'Shell version')
          replace_once('service-worker.js',"const CACHE_ADI='oy-cache-v926';","const CACHE_ADI='oy-cache-v927';",'SW cache version')
          replace_once('service-worker.js',"js/modules/academic.js?v=879","js/modules/academic.js?v=880",'SW Academic version')
          replace_once('service-worker.js',"js/core/shell-ui.js?v=884","js/core/shell-ui.js?v=885",'SW Shell version')
          PY
      - name: Verify focused client regressions
        run: |
          git diff --check -- js/modules/academic.js js/core/shell-ui.js js/app-loader.js index.html service-worker.js firestore.rules tests/academic-separate-pages.test.js tests/profile-page-redesign.test.js tests/sinav-islemleri-owner-rules.test.js
          node --check js/modules/academic.js
          node --check js/core/shell-ui.js
          node tests/academic-separate-pages.test.js
          node tests/profile-page-redesign.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
      - name: Run complete client regressions
        run: node scripts/run-client-tests.mjs
      - name: Audit client architecture
        run: node scripts/check-client-architecture.mjs
      - name: Commit clean target diff
        shell: bash
        run: |
          git rm -f .github/workflows/tmp-assigned-exam-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check -- js/modules/academic.js js/core/shell-ui.js js/app-loader.js index.html service-worker.js firestore.rules tests/academic-separate-pages.test.js tests/profile-page-redesign.test.js tests/sinav-islemleri-owner-rules.test.js
          git commit -m 'fix: allow assigned teachers to edit and open written exams'
          git push origin HEAD:fix/assigned-teacher-exam-edit-open-20260912
