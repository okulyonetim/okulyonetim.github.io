name: Apply calendar exam v836 fix

on:
  push:
    branches:
      - work/fix-calendar-exam-v836-20260901
    paths:
      - '.github/workflows/apply-calendar-exam-v836.yml'
      - 'scripts/apply-calendar-exam-v836.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted fixes
        run: python scripts/apply-calendar-exam-v836.py
      - name: Verify syntax and contracts
        run: |
          git diff --check
          node --check js/modules/communication.js
          node --check js/modules/academic.js
          node --check js/app-loader.js
          node --check service-worker.js
          node --test tests/calendar-month-view.test.js
          node --test tests/academic-separate-pages.test.js
          node --test tests/classic-shell-v2-smoke.test.js
          node --test tests/module-bundles-smoke.test.js
          node --test tests/modules-local-first-boundary.test.js
          node --test tests/service-worker-precache-smoke.test.js
      - name: Commit verified fix
        run: |
          rm -f .github/workflows/apply-calendar-exam-v836.yml scripts/apply-calendar-exam-v836.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair calendar save and stabilize exam records'
          git push origin HEAD:work/fix-calendar-exam-v836-20260901
