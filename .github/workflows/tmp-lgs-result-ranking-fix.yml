name: Apply LGS result ranking and report fix

on:
  push:
    branches:
      - fix/lgs-result-ranking-report-20260912
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused LGS result patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # Academic: canonical LGS score extraction, deterministic ranking, detail table and report.
          replace_once('js/modules/academic.js',
          "function ssToplamNet(sonuc,sinav){if(!sonuc?.dersSonuclari)return 0;return Object.entries(sonuc.dersSonuclari).reduce((t,[,v])=>t+ssNetHesapla(v.dogru,v.yanlis,sinav?.yanlisKatsayisi),0)}",
          "function ssToplamNet(sonuc,sinav){if(!sonuc?.dersSonuclari)return 0;return Object.entries(sonuc.dersSonuclari).reduce((t,[,v])=>t+ssNetHesapla(v.dogru,v.yanlis,sinav?.yanlisKatsayisi),0)}\nfunction ssNum(v){if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null}\nfunction ssPuanTuru(sonuc,sinav){return String(sonuc?.puanTuru||sinav?.puanTuru||'').trim().toUpperCase()}\nfunction ssLgsPuani(sonuc,sinav){return ssNum(sonuc?.lgsPuani??sonuc?.lgsPuan??(ssPuanTuru(sonuc,sinav)==='LGS'?sonuc?.puan:null))}\nfunction ssFmt(v,d=2){const n=ssNum(v);return n==null?'—':new Intl.NumberFormat('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n)}\nfunction ssSiraliSonuclar(sinav,tur){const rows=[...(sinav?.sonuclar||[])];if(tur!=='deneme')return rows.sort((a,b)=>(a.ogrenciAdi||'').localeCompare(b.ogrenciAdi||'','tr'));return rows.sort((a,b)=>{const ap=ssLgsPuani(a,sinav),bp=ssLgsPuani(b,sinav);if(ap!=null||bp!=null){if(ap==null)return 1;if(bp==null)return -1;if(bp!==ap)return bp-ap}const netDiff=ssToplamNet(b,sinav)-ssToplamNet(a,sinav);return netDiff||(a.ogrenciAdi||'').localeCompare(b.ogrenciAdi||'','tr')})}",
          'Academic LGS helpers')

          old_detail="""function ssDetayHtml(sinav,tur){
  const sonuclar=(sinav.sonuclar||[]).slice().sort((a,b)=>(a.ogrenciAdi||'').localeCompare(b.ogrenciAdi||'','tr'));
  const dersler=sinav.dersler?.length?sinav.dersler:DERSLER_LGS.map(ad=>({ad,soruSayisi:20}));
  if(!sonuclar.length)return`<div class=\"ka-results-empty\"><div class=\"ka-results-empty__icon\">📊</div><strong>Henüz öğrenci sonucu yok</strong><p>Sonuç girişine başlayarak öğrenci doğru, yanlış ve net bilgilerini ekleyin.</p><button class=\"ka-btn\" type=\"button\" data-ss-add-result=\"${esc(sinav.id)}\" data-ss-tur=\"${esc(tur)}\">+ Sonuç Ekle</button></div>`;
  const rows=sonuclar.map(s=>{const net=ssToplamNet(s,sinav);return`<tr><td class=\"ka-results-student\"><strong>${esc(s.ogrenciAdi||'—')}</strong><small>${esc(s.sinif||'—')}</small></td>${dersler.map(d=>{const ds=s.dersSonuclari?.[d.ad]||{};const n=ssNetHesapla(ds.dogru,ds.yanlis,sinav.yanlisKatsayisi);return`<td><span class=\"ka-results-dy\">${ds.dogru||0}D / ${ds.yanlis||0}Y</span><strong class=\"ka-results-net\">${n.toFixed(2)}</strong></td>`}).join('')}<td class=\"ka-results-total\">${net.toFixed(2)}</td></tr>`});
  return`<div class=\"ka-results-table-wrap\"><table class=\"ka-results-table\"><thead><tr><th>Öğrenci</th>${dersler.map(d=>`<th>${esc(d.ad)}</th>`).join('')}<th>Toplam Net</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`
}"""
          new_detail="""function ssDetayHtml(sinav,tur){
  const deneme=tur==='deneme',sonuclar=ssSiraliSonuclar(sinav,tur);
  const dersler=sinav.dersler?.length?sinav.dersler:DERSLER_LGS.map(ad=>({ad,soruSayisi:20}));
  if(!sonuclar.length)return`<div class=\"ka-results-empty\"><div class=\"ka-results-empty__icon\">📊</div><strong>Henüz öğrenci sonucu yok</strong><p>Sonuç girişine başlayarak öğrenci doğru, yanlış ve net bilgilerini ekleyin.</p><button class=\"ka-btn\" type=\"button\" data-ss-add-result=\"${esc(sinav.id)}\" data-ss-tur=\"${esc(tur)}\">+ Sonuç Ekle</button></div>`;
  const rows=sonuclar.map((s,index)=>{const net=ssToplamNet(s,sinav),score=ssLgsPuani(s,sinav);return`<tr><td class=\"ka-results-student\"><strong>${esc(s.ogrenciAdi||'—')}</strong><small>${esc(s.sinif||'—')}</small></td>${deneme?`<td class=\"ka-results-rank\"><strong>${index+1}</strong></td>`:''}${dersler.map(d=>{const ds=s.dersSonuclari?.[d.ad]||{};const n=ssNetHesapla(ds.dogru,ds.yanlis,sinav.yanlisKatsayisi);return`<td><span class=\"ka-results-dy\">${ds.dogru||0}D / ${ds.yanlis||0}Y${ssNum(ds.bos)!=null?` / ${ds.bos}B`:''}</span><strong class=\"ka-results-net\">${ssFmt(n)}</strong></td>`}).join('')}<td class=\"ka-results-total\">${ssFmt(net)}</td>${deneme?`<td class=\"ka-results-total ka-results-lgs\">${ssFmt(score)}</td>`:''}</tr>`});
  return`<div class=\"ka-results-table-wrap\"><table class=\"ka-results-table\"><thead><tr><th>Öğrenci</th>${deneme?'<th>Sıra</th>':''}${dersler.map(d=>`<th>${esc(d.ad)}</th>`).join('')}<th>Toplam Net</th>${deneme?'<th>LGS Puanı</th>':''}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`
}"""
          replace_once('js/modules/academic.js',old_detail,new_detail,'Academic result detail')

          old_print="out.querySelectorAll('[data-ss-print]').forEach(b=>b.addEventListener('click',()=>{const tur=b.dataset.ssTur,sid=b.dataset.ssPrint,s=ssExamSource(tur,sid);if(!s||!globalThis.ReportEngine)return;const dersler=s.dersler?.length?s.dersler:DERSLER_LGS.map(ad=>({ad,soruSayisi:20}));const rows=(s.sonuclar||[]).map(r=>`<tr><td>${esc(r.ogrenciAdi||'—')}</td><td>${esc(r.sinif||'—')}</td>${dersler.map(d=>{const ds=r.dersSonuclari?.[d.ad]||{};return`<td>${ds.dogru||0}D/${ds.yanlis||0}Y<br>${ssNetHesapla(ds.dogru,ds.yanlis,s.yanlisKatsayisi)}</td>`}).join('')}<td>${ssToplamNet(r,s).toFixed(2)}</td></tr>`);const body=`<h1>${esc(s.ad||'Sınav')} — Sonuçlar</h1><p>Tarih: ${esc(s.tarih||'—')}</p><table><thead><tr><th>Öğrenci</th><th>Sınıf</th>${dersler.map(d=>`<th>${esc(d.ad)}</th>`).join('')}<th>Toplam Net</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;globalThis.ReportEngine.printReport(`${s.ad||'Sınav'} Sonuç Listesi`,body,{fileName:`Sonuclar_${s.ad||'sinav'}`,yon:'landscape'})}));"
          new_print="out.querySelectorAll('[data-ss-print]').forEach(b=>b.addEventListener('click',()=>{const tur=b.dataset.ssTur,sid=b.dataset.ssPrint,s=ssExamSource(tur,sid);if(!s||!globalThis.ReportEngine)return;const deneme=tur==='deneme',dersler=s.dersler?.length?s.dersler:DERSLER_LGS.map(ad=>({ad,soruSayisi:20})),sonuclar=ssSiraliSonuclar(s,tur);const rows=sonuclar.map((r,index)=>`<tr>${deneme?`<td>${index+1}</td>`:''}<td>${esc(r.ogrenciAdi||'—')}</td><td>${esc(r.sinif||'—')}</td>${dersler.map(d=>{const ds=r.dersSonuclari?.[d.ad]||{},bos=ssNum(ds.bos);return`<td>${ds.dogru||0}D/${ds.yanlis||0}Y${bos!=null?`/${bos}B`:''}<br>${ssFmt(ssNetHesapla(ds.dogru,ds.yanlis,s.yanlisKatsayisi))}</td>`}).join('')}<td>${ssFmt(ssToplamNet(r,s))}</td>${deneme?`<td><strong>${ssFmt(ssLgsPuani(r,s))}</strong></td>`:''}</tr>`);const body=`<h1>${esc(s.ad||'Sınav')} — Sonuçlar</h1><p>Tarih: ${esc(s.tarih||'—')}</p><table><thead><tr>${deneme?'<th>Sıra</th>':''}<th>Öğrenci</th><th>Sınıf</th>${dersler.map(d=>`<th>${esc(d.ad)}</th>`).join('')}<th>Toplam Net</th>${deneme?'<th>LGS Puanı</th>':''}</tr></thead><tbody>${rows.join('')}</tbody></table>`;globalThis.ReportEngine.printReport(`${s.ad||'Sınav'} Sonuç Listesi`,body,{fileName:`Sonuclar_${s.ad||'sinav'}`,yon:'landscape'})}));"
          replace_once('js/modules/academic.js',old_print,new_print,'Academic LGS report')

          # People: round net safely and surface latest real LGS score on the profile shell.
          replace_once('js/modules/people.js',
          "function resultNet(entry){const r=entry?.result||{};if(Number.isFinite(Number(r.net)))return Number(r.net);const vals=Object.values(r.dersSonuclari||{});const nets=vals.map(x=>Number(x?.net)).filter(Number.isFinite);return nets.length?Math.round(nets.reduce((a,b)=>a+b,0)*100)/100:null}",
          "function resultNumber(v){if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null}\nfunction resultFmt(v,d=2){const n=resultNumber(v);return n==null?'—':new Intl.NumberFormat('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n)}\nfunction resultNet(entry){const r=entry?.result||{},direct=resultNumber(r.net);if(direct!=null)return Math.round(direct*100)/100;const vals=Object.values(r.dersSonuclari||{});const nets=vals.map(x=>resultNumber(x?.net)).filter(x=>x!=null);return nets.length?Math.round(nets.reduce((a,b)=>a+b,0)*100)/100:null}\nfunction resultScore(entry){const r=entry?.result||{},puanTuru=String(r.puanTuru||entry?.exam?.puanTuru||'').trim().toUpperCase();return resultNumber(r.lgsPuani??r.lgsPuan??(puanTuru==='LGS'?r.puan:null))}",
          'People result number helpers')
          replace_once('js/modules/people.js',
          "lastNet=all.map(resultNet).find(x=>x!==null&&x!==undefined),att=attendanceStats(v);",
          "lastNet=all.map(resultNet).find(x=>x!==null&&x!==undefined),lastLgs=deneme.map(resultScore).find(x=>x!==null&&x!==undefined),att=attendanceStats(v);",
          'People last LGS calculation')
          replace_once('js/modules/people.js',
          "<article class=\"ka-card\"><small>SON NET</small><b>${lastNet??'—'}</b><span>Son sınav</span></article><article class=\"ka-card\"><small>DURUM</small><b class=\"is-success\">Aktif</b><span>Öğrenci</span></article>",
          "<article class=\"ka-card\"><small>SON NET</small><b>${resultFmt(lastNet)}</b><span>Son sınav</span></article><article class=\"ka-card\"><small>SON LGS</small><b class=\"is-success\">${resultFmt(lastLgs)}</b><span>Son deneme</span></article>",
          'People profile summary')
          replace_once('js/modules/people.js',
          "function resultCard(x){const n=resultNet(x);return `<article class=\"ka-card ka-result-card\"><div class=\"ka-card__body ka-row\"><span class=\"ka-result-icon\">✓</span><div class=\"ka-grow\"><strong>${esc(x.ad)}</strong><small>${esc(x.type)}${x.tarih?' · '+esc(x.tarih):''}</small></div>${n!==null?`<span class=\"ka-result-net\"><b>${esc(n)}</b><small>Net</small></span>`:''}</div></article>`}",
          "function resultCard(x){const n=resultNet(x),score=resultScore(x),isTrial=x.type==='Deneme',value=isTrial?resultFmt(score):resultFmt(n),label=isTrial?'LGS':'Net';return `<article class=\"ka-card ka-result-card\"><div class=\"ka-card__body ka-row\"><span class=\"ka-result-icon\">✓</span><div class=\"ka-grow\"><strong>${esc(x.ad)}</strong><small>${esc(x.type)}${x.tarih?' · '+esc(x.tarih):''}</small></div><span class=\"ka-result-net\"><b>${esc(value)}</b><small>${label}</small></span></div></article>`}",
          'People result card')

          # Detail enhancer: exam-level score type fallback, compact profile card, no duplicate Academic columns.
          replace_once('js/core/student-exam-result-details.js',
          "function scoreOf(r){return num(r?.lgsPuani??r?.lgsPuan??(String(r?.puanTuru||'').toUpperCase()==='LGS'?r?.puan:null))}",
          "function scoreOf(r,exam){const puanTuru=String(r?.puanTuru||exam?.puanTuru||'').trim().toUpperCase();return num(r?.lgsPuani??r?.lgsPuan??(puanTuru==='LGS'?r?.puan:null))}",
          'Detail score fallback')
          old_profile="function profileCardHtml(e){const r=e.result||{},n=netOf(e),score=scoreOf(r),rank=rankOf(r),crank=classRankOf(r),count=participantCount(r,e.exam),ls=lessonRows(e),date=String(e.tarih||'').slice(0,10),stats=[];if(score!=null)stats.push(statCard('LGS PUANI',fmt(score),'is-success'));if(n!=null)stats.push(statCard('TOPLAM NET',fmt(n),'is-success'));if(rank!=null)stats.push(statCard('GENEL SIRA',`${intFmt(rank)}${count!=null?' / '+intFmt(count):''}`));if(crank!=null)stats.push(statCard('SINIF SIRA',intFmt(crank)));return `<div class=\"ka-card__body\"><div class=\"ka-row\"><span class=\"ka-result-icon\">✓</span><div class=\"ka-grow\"><strong>${esc(e.ad)}</strong><small>${esc(e.type)}${date?' · '+esc(date):''}</small></div>${n!=null?`<span class=\"ka-result-net\"><b>${esc(fmt(n))}</b><small>Net</small></span>`:''}</div>${stats.length?`<div class=\"ka-people-summary-grid ka-student-result-stats\">${stats.join('')}</div>`:''}${ls.length?`<div class=\"ka-results-table-wrap ka-student-result-table-wrap\"><table class=\"ka-results-table ka-student-result-table\"><thead><tr><th>Ders</th><th>D</th><th>Y</th><th>B</th><th>Net</th></tr></thead><tbody>${ls.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(intFmt(x.d))}</td><td>${esc(intFmt(x.y))}</td><td>${x.b==null?'—':esc(intFmt(x.b))}</td><td class=\"ka-results-total\">${esc(fmt(x.n))}</td></tr>`).join('')}</tbody></table></div>`:''}</div>`}"
          new_profile="function profileCardHtml(e){const r=e.result||{},n=netOf(e),score=scoreOf(r,e.exam),rank=rankOf(r),crank=classRankOf(r),count=participantCount(r,e.exam),ls=lessonRows(e),date=String(e.tarih||'').slice(0,10),stats=[],ranks=[];if(e.type==='Deneme'||score!=null)stats.push(statCard('LGS PUANI',fmt(score),'is-success'));if(n!=null)stats.push(statCard('TOPLAM NET',fmt(n),'is-success'));if(rank!=null)ranks.push(`<span><small>GENEL SIRA</small><b>${esc(intFmt(rank))}${count!=null?' / '+esc(intFmt(count)):''}</b></span>`);if(crank!=null)ranks.push(`<span><small>SINIF SIRA</small><b>${esc(intFmt(crank))}</b></span>`);return `<div class=\"ka-card__body\"><div class=\"ka-row ka-student-result-head\"><span class=\"ka-result-icon\">✓</span><div class=\"ka-grow\"><strong>${esc(e.ad)}</strong><small>${esc(e.type)}${date?' · '+esc(date):''}</small></div></div>${stats.length?`<div class=\"ka-people-summary-grid ka-student-result-stats\">${stats.join('')}</div>`:''}${ranks.length?`<div class=\"ka-student-result-ranks\">${ranks.join('')}</div>`:''}${ls.length?`<div class=\"ka-results-table-wrap ka-student-result-table-wrap\"><table class=\"ka-results-table ka-student-result-table\"><thead><tr><th>Ders</th><th>D</th><th>Y</th><th>B</th><th>Net</th></tr></thead><tbody>${ls.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(intFmt(x.d))}</td><td>${esc(intFmt(x.y))}</td><td>${x.b==null?'—':esc(intFmt(x.b))}</td><td class=\"ka-results-total\">${esc(fmt(x.n))}</td></tr>`).join('')}</tbody></table></div>`:''}</div>`}"
          replace_once('js/core/student-exam-result-details.js',old_profile,new_profile,'Compact profile result card')
          replace_once('js/core/student-exam-result-details.js',
          "const sig=[e.exam?.id||'',e.result?.optikTaramaId||'',e.tarih,e.ad,JSON.stringify(e.result?.dersSonuclari||{}),scoreOf(e.result),rankOf(e.result),classRankOf(e.result),netOf(e)].join('|');",
          "const sig=[e.exam?.id||'',e.result?.optikTaramaId||'',e.tarih,e.ad,JSON.stringify(e.result?.dersSonuclari||{}),scoreOf(e.result,e.exam),rankOf(e.result),classRankOf(e.result),netOf(e)].join('|');",
          'Detail signature score')
          old_academic="function enhanceAcademic(scope){const exam=academicExam(scope),table=scope.querySelector('.ka-results-table');if(!exam||!table)return;const results=Array.isArray(exam.sonuclar)?exam.sonuclar:[];if(!results.length)return;if(!table.dataset.lgsDetailsEnhanced){const hasScore=results.some(r=>scoreOf(r)!=null),hasRank=results.some(r=>rankOf(r)!=null),hasClassRank=results.some(r=>classRankOf(r)!=null),head=table.tHead?.rows?.[0];if(head){if(hasScore){const th=document.createElement('th');th.textContent='LGS Puanı';head.appendChild(th)}if(hasRank){const th=document.createElement('th');th.textContent='Genel Sıra';head.appendChild(th)}if(hasClassRank){const th=document.createElement('th');th.textContent='Sınıf Sıra';head.appendChild(th)}[...table.tBodies[0]?.rows||[]].forEach(row=>{const name=row.querySelector('.ka-results-student strong')?.textContent?.trim()||'',r=results.find(x=>norm(x.ogrenciAdi)===norm(name));if(hasScore){const td=document.createElement('td');td.className='ka-results-total';const s=r?scoreOf(r):null;td.textContent=s!=null?fmt(s):'—';row.appendChild(td)}if(hasRank){const td=document.createElement('td');const rk=r?rankOf(r):null,c=r?participantCount(r,exam):null;td.textContent=rk!=null?`${intFmt(rk)}${c!=null?' / '+intFmt(c):''}`:'—';row.appendChild(td)}if(hasClassRank){const td=document.createElement('td');const rk=r?classRankOf(r):null;td.textContent=rk!=null?intFmt(rk):'—';row.appendChild(td)}})}table.dataset.lgsDetailsEnhanced='1'}labelAcademicCells(table)}"
          new_academic="function enhanceAcademic(scope){const table=scope.querySelector('.ka-results-table');if(!table)return;labelAcademicCells(table)}"
          replace_once('js/core/student-exam-result-details.js',old_academic,new_academic,'Canonical Academic owns LGS columns')
          replace_once('js/core/student-exam-result-details.js',
          ".ka-student-result-stats{grid-template-columns:repeat(2,minmax(0,1fr))!important;margin-top:12px}.ka-student-result-stats .ka-card{padding:12px;text-align:center}.ka-student-result-stats .ka-card small{display:block}.ka-student-result-stats .ka-card b{display:block;margin-top:4px;font-size:20px}.ka-student-result-table-wrap",
          ".ka-student-result-head{align-items:center}.ka-student-result-stats{grid-template-columns:repeat(2,minmax(0,1fr))!important;margin-top:12px}.ka-student-result-stats .ka-card{padding:12px;text-align:center}.ka-student-result-stats .ka-card small{display:block}.ka-student-result-stats .ka-card b{display:block;margin-top:4px;font-size:20px}.ka-student-result-ranks{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ka-student-result-ranks>span{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--ka-border);border-radius:999px;background:var(--ka-muted-bg)}.ka-student-result-ranks small{color:var(--ka-text-muted);font-weight:700}.ka-student-result-table-wrap",
          'Detail compact rank styles')

          # Cache-bust the affected runtime assets.
          replace_once('js/firebase-init.js',"student-exam-result-details.js?v=924","student-exam-result-details.js?v=925",'Detail runtime version')
          replace_once('js/app-loader.js',"js/modules/academic.js?v=880","js/modules/academic.js?v=881",'Academic runtime version')
          replace_once('index.html',"js/app-loader.js?v=898","js/app-loader.js?v=899",'App loader shell version')
          replace_once('service-worker.js',"const CACHE_ADI='oy-cache-v927';","const CACHE_ADI='oy-cache-v928';",'Service worker cache version')
          replace_once('service-worker.js',"./js/app-loader.js?v=898","./js/app-loader.js?v=899",'SW app loader version')
          replace_once('service-worker.js',"./js/modules/academic.js?v=880","./js/modules/academic.js?v=881",'SW academic version')
          replace_once('service-worker.js',
          "'./js/firebase-init.js','./js/core/core.js?v=905'",
          "'./js/firebase-init.js','./js/core/student-exam-result-details.js?v=925','./js/core/core.js?v=905'",
          'SW detail precache')
          replace_once('tests/academic-separate-pages.test.js',"js/modules/academic.js?v=880","js/modules/academic.js?v=881",'Academic test runtime version')

          Path('tests/exam-lgs-result-ranking.test.js').write_text(r'''const fs=require('fs');
          const assert=require('assert');
          const academic=fs.readFileSync('js/modules/academic.js','utf8');
          const people=fs.readFileSync('js/modules/people.js','utf8');
          const details=fs.readFileSync('js/core/student-exam-result-details.js','utf8');
          const firebaseInit=fs.readFileSync('js/firebase-init.js','utf8');
          const loader=fs.readFileSync('js/app-loader.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');

          for(const token of ['function ssLgsPuani(sonuc,sinav)','function ssSiraliSonuclar(sinav,tur)','bp-ap',"deneme?'<th>Sıra</th>':''","deneme?'<th>LGS Puanı</th>':''","sonuclar=ssSiraliSonuclar(s,tur)","ssLgsPuani(r,s)"]){
            assert(academic.includes(token),`Canonical deneme LGS/sıralama sözleşmesi eksik: ${token}`);
          }
          assert(academic.includes("sonuc?.lgsPuani??sonuc?.lgsPuan")&&academic.includes("ssPuanTuru(sonuc,sinav)==='LGS'?sonuc?.puan:null"),'LGS puanı OMR alias alanlarından ve LGS puan fallbackinden okunmalı.');
          assert(academic.includes("const deneme=tur==='deneme',sonuclar=ssSiraliSonuclar(sinav,tur)"),'Deneme sonuç ekranı LGS puan sırasını canonical olarak kullanmalı.');
