name: Cleanup academic CSS owner

on:
  push:
    branches:
      - work/academic-single-render-20260901
    paths:
      - '.github/workflows/cleanup-academic-css-owner.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove retired exam hero CSS
        run: python scripts/cleanup-academic-css-owner.py
      - name: Verify
        run: |
          git diff --check
          node --check js/modules/academic.js
          node --check js/core/shell-ui.js
          node --test tests/academic-separate-pages.test.js
          node --test tests/classic-shell-v2-smoke.test.js
          node --test tests/modules-local-first-boundary.test.js
          node --test tests/service-worker-precache-smoke.test.js
      - name: Commit cleanup
        run: |
          rm -f .github/workflows/cleanup-academic-css-owner.yml scripts/cleanup-academic-css-owner.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: keep exam styling under one canonical CSS owner'
          git push origin HEAD:work/academic-single-render-20260901
