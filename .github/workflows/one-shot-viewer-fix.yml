name: One-shot viewer fix

on:
  push:
    branches: [ka-viewer-fix-candidate]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ka-viewer-fix-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact viewer patch
        shell: python
        run: |
          from pathlib import Path

          css_path=Path('css/design-system.css')
          css=css_path.read_text(encoding='utf-8')
          css_old='.dv3pdfstage,.dv3wordstage,.dv3sheetstage{position:absolute;left:0;top:0;transform-origin:top left}.dv3pdfpage{'
          css_new='.dv3pdfstage,.dv3wordstage,.dv3sheetstage{position:absolute;left:0;top:0;transform-origin:top left}.dv3pdfstage{display:flex;flex-direction:column;align-items:flex-start;gap:18px}.dv3pdfpage{'
          assert css.count(css_old)==1, f'CSS anchor count: {css.count(css_old)}'
          css_path.write_text(css.replace(css_old,css_new),encoding='utf-8')

          test_path=Path('tests/document-viewer-smoke.test.js')
          test=test_path.read_text(encoding='utf-8')
          import_old="const platform = fs.readFileSync('js/core/platform/widget-adapter.js','utf8');\n"
          import_new=import_old+"const design = fs.readFileSync('css/design-system.css','utf8');\n"
          viewport_old="assert(viewer.includes('.dv3pdfviewport{flex:1 1 auto;min-height:0;overflow:auto;width:100%'), 'PDF scroll yalnız viewport alanında olmalı.');"
          viewport_new="assert(design.includes('.dv3pdfviewport,.dv3sheetviewport,.dv3wordviewport{flex:1 1 auto;min-height:0;overflow:auto;width:100%'), 'PDF scroll yalnız merkezi design-system viewport alanında olmalı.');"
          gap_old="assert(viewer.includes('gap:18px'), 'PDF sayfaları arasında görünür ayrım bulunmalı.');"
          gap_new="assert(design.includes('.dv3pdfstage{display:flex;flex-direction:column;align-items:flex-start;gap:18px}'), 'PDF sayfaları arasındaki 18px ayrım merkezi design-system içinde korunmalı.');"
          for old in (import_old,viewport_old,gap_old):
              assert test.count(old)==1, f'Test anchor count: {test.count(old)} for {old[:40]}'
          test=test.replace(import_old,import_new).replace(viewport_old,viewport_new).replace(gap_old,gap_new)
          test_path.write_text(test,encoding='utf-8')

          sw_path=Path('service-worker.js')
          sw=sw_path.read_text(encoding='utf-8')
          sw_old="const CACHE_ADI='oy-cache-v798';"
          sw_new="const CACHE_ADI='oy-cache-v799';"
          assert sw.count(sw_old)==1, f'SW cache anchor count: {sw.count(sw_old)}'
          sw_path.write_text(sw.replace(sw_old,sw_new),encoding='utf-8')
      - name: Verify targeted contracts
        run: |
          node tests/document-viewer-smoke.test.js
          node tests/lazy-document-libs-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          git diff --check
      - name: Commit candidate tree
        run: |
          rm .github/workflows/one-shot-viewer-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/design-system.css tests/document-viewer-smoke.test.js service-worker.js .github/workflows/one-shot-viewer-fix.yml
          git commit -m "fix(viewer): restore centralized PDF page spacing"
          git push origin HEAD:ka-viewer-fix-candidate
