name: migrate-offline-lazy-shell
on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-offline-lazy-shell.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache all AppLoader lazy modules
        run: python scripts/migrate-offline-lazy-shell.py
      - name: Syntax checks
        run: |
          node --check js/app-loader.js
          node --check service-worker.js
      - name: Shell and architecture checks
        run: |
          node tests/classic-shell-v2-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Cleanup temporary migration files
        run: rm -f scripts/migrate-offline-lazy-shell.py .github/workflows/migrate-offline-lazy-shell.yml
      - name: Commit production migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(pwa): cache every lazy app module for offline use'
          git push
