name: Apply LGS result ranking fix v2

on:
  push:
    branches:
      - fix/lgs-result-ranking-report-20260912
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused patch
        run: python scripts/tmp-apply-lgs-result-fix.py
      - name: Focused regressions
        run: node tests/exam-lgs-result-ranking.test.js && node tests/academic-separate-pages.test.js && node tests/profile-page-redesign.test.js
      - name: Complete client regression suite
        run: node scripts/run-client-tests.mjs
      - name: Client architecture audit
        run: node scripts/check-client-architecture.mjs
      - name: Diff sanity
        run: git diff --check && git status --short
      - name: Commit clean target diff
        shell: bash
        run: |
          git rm .github/workflows/tmp-lgs-result-ranking-fix.yml .github/workflows/tmp-lgs-result-ranking-fix-v2.yml scripts/tmp-apply-lgs-result-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/academic.js js/modules/people.js js/core/student-exam-result-details.js js/firebase-init.js js/app-loader.js index.html service-worker.js tests/academic-separate-pages.test.js tests/exam-lgs-result-ranking.test.js
          git commit -m 'fix: show LGS scores and rank trial reports'
          git push origin HEAD:fix/lgs-result-ranking-report-20260912
