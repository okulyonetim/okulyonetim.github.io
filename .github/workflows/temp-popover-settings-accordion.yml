name: Temporary Popover Settings Accordion Gate

on:
  push:
    branches: [work/popover-settings-accordion-20260831]
    paths:
      - '.github/workflows/temp-popover-settings-accordion.yml'

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update canonical popover and Settings owners
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          shell=Path('js/core/shell-ui.js'); text=shell.read_text(encoding='utf-8')
          text,count=re.subn(r"function openProfilePopover\(\)\{.*?\nfunction dateOf",lambda m:"""function openProfilePopover(){const anchor=$('[data-ka-header-profile]');if(!anchor)return;const {name,username,photo}=profileInfo(),p=popoverBase(anchor,226),dark=currentTheme()==='dark';p.classList.add('ka-profile-popover','ka-profile-popover--compact');p.innerHTML=`<div class=\"ka-profile-popover__identity\"><span class=\"ka-avatar\">${photo?`<img src=\"${esc(photo)}\" alt=\"\">`:SVG.profile}</span><span><strong>${esc(name)}</strong><small>${esc(username)}</small></span></div><div class=\"ka-profile-popover__menu\"><button type=\"button\" data-hp-profile>${SVG.profile}<span>Profilim</span></button><button type=\"button\" data-hp-settings>${SVG.settings}<span>Ayarlar</span></button><button type=\"button\" data-hp-theme>${dark?SVG.sun:SVG.moon}<span>${dark?'Açık Tema':'Koyu Tema'}</span></button></div><div class=\"ka-profile-popover__logout\"><button type=\"button\" data-hp-logout>${SVG.logout}<span>Çıkış Yap</span></button></div>`;p.querySelector('[data-hp-profile]')?.addEventListener('click',()=>renderProfile());p.querySelector('[data-hp-settings]')?.addEventListener('click',()=>routeModule('settings',{bottom:'menu'}));p.querySelector('[data-hp-theme]')?.addEventListener('click',async()=>{await toggleTheme();openProfilePopover()});p.querySelector('[data-hp-logout]')?.addEventListener('click',()=>global.cikisYap?.())}\nfunction dateOf""",text,count=1,flags=re.S)
          if count!=1: raise SystemExit(f'shell profile replacement count {count}')
          old="function openNotifications(){const anchor=$('[data-ka-header-notification]');if(!anchor)return;const p=popoverBase(anchor,400)"
          if text.count(old)!=1: raise SystemExit(f'shell notification width match {text.count(old)}')
          text=text.replace(old,"function openNotifications(){const anchor=$('[data-ka-header-notification]');if(!anchor)return;const p=popoverBase(anchor,300)",1)
          shell.write_text(text,encoding='utf-8')

          settings=Path('js/modules/settings.js'); text=settings.read_text(encoding='utf-8')
          if "let active='home',mounted=false,unsubs=[];" not in text: raise SystemExit('settings state anchor missing')
          text=text.replace("let active='home',mounted=false,unsubs=[];","let active='home',mounted=false,unsubs=[],settingsAccordion='academic';",1)
          pattern=r"function settingsHome\(\)\{.*?\nfunction account"
          replacement="""function settingsHome(){const groups=[{key:'account',label:'Hesap ve Güvenlik',icon:'🔐',items:[['account','Hesabım','Profil ve hesap bilgileri'],['appearance','Görünüm','Açık ve koyu tema'],['sync','Senkronizasyon','Cihaz ve arka plan senkron durumu']]},{key:'academic',label:'Akademik Yapı',icon:'🎓',items:[['school','Okul Bilgileri','Okul kimliği ve sosyal bağlantılar'],['lesson-hours','Ders Saatleri','Zil saatleri, öğle arası ve tatil modu']]},{key:'system',label:'Sistem Yönetimi',icon:'⚙️',items:[['users','Kullanıcı İşlemleri','Kullanıcı hesapları ve roller'],['statistics','Kullanıcı İstatistikleri','Kullanım ve depolama istatistikleri'],['roles','Roller','Merkezi rol ve yetki yönetimi'],['app','Uygulama Düzeni','Navigasyon, menü ve dashboard kartları'],['reminders','Hatırlatmalar','Bildirim ve hatırlatma davranışları'],['storage','Depolama','Kullanıcı depolama sınırları']]}].map(g=>({...g,items:g.items.filter(x=>activeAllowed(x[0]))})).filter(g=>g.items.length);if(!groups.some(g=>g.key===settingsAccordion))settingsAccordion=groups[0]?.key||'';return `<div class=\"ka-settings-accordion\">${groups.map(g=>{const open=g.key===settingsAccordion;return `<section class=\"ka-settings-accordion__group ${open?'is-open':''}\" data-settings-accordion=\"${g.key}\"><button type=\"button\" class=\"ka-settings-accordion__toggle\" data-settings-accordion-toggle=\"${g.key}\" aria-expanded=\"${open?'true':'false'}\"><span class=\"ka-settings-accordion__icon\">${g.icon}</span><span class=\"ka-grow\"><strong>${esc(g.label)}</strong><small>${g.items.length} ayar</small></span><span class=\"ka-settings-accordion__chevron\">⌄</span></button><div class=\"ka-settings-accordion__body\" ${open?'':'hidden'}>${g.items.map(x=>`<button type=\"button\" class=\"ka-settings-accordion__item\" data-settings-open=\"${esc(x[0])}\"><span><strong>${esc(x[1])}</strong><small>${esc(x[2])}</small></span><span aria-hidden=\"true\">›</span></button>`).join('')}</div></section>`}).join('')}</div>`}\nfunction bindSettingsAccordion(out){out.querySelectorAll('[data-settings-accordion-toggle]').forEach(b=>b.addEventListener('click',()=>{const key=b.dataset.settingsAccordionToggle||'';settingsAccordion=settingsAccordion===key?'':key;render()}))}\nfunction account"""
          text,count=re.subn(pattern,lambda m:replacement,text,count=1,flags=re.S)
          if count!=1: raise SystemExit(f'settings home replacement count {count}')
          old="out.querySelectorAll('[data-settings-open]').forEach(b=>b.onclick=()=>openPage(b.dataset.settingsOpen,b.textContent.trim()));"
          new="out.querySelectorAll('[data-settings-open]').forEach(b=>b.onclick=()=>openPage(b.dataset.settingsOpen,b.querySelector('strong')?.textContent.trim()||b.textContent.trim()));if(active==='home')bindSettingsAccordion(out);"
          if text.count(old)!=1: raise SystemExit(f'settings render bind match {text.count(old)}')
          text=text.replace(old,new,1); settings.write_text(text,encoding='utf-8')

          css=Path('css/design-system.css'); c=css.read_text(encoding='utf-8')
          marker='.ka-notification-popover{padding:0!important;overflow:hidden!important}'
          if c.count(marker)!=1: raise SystemExit(f'notification css marker {c.count(marker)}')
          c=c.replace(marker,marker+'.ka-notification-popover{max-width:300px!important}.ka-notification-row__copy strong,.ka-notification-row__copy small{overflow-wrap:anywhere}',1)
          profile_marker='.ka-profile-popover{padding:0!important;border-radius:20px!important;overflow:hidden!important;background:var(--ka-card-raised-bg)!important}'
          if c.count(profile_marker)!=1: raise SystemExit(f'profile css marker {c.count(profile_marker)}')
          c=c.replace(profile_marker,profile_marker+'.ka-profile-popover{max-width:226px!important}',1)
          if '/* SETTINGS HOME ACCORDION — CANONICAL */' not in c:
              c += '''\n/* SETTINGS HOME ACCORDION — CANONICAL */\n.ka-settings-accordion{display:flex;flex-direction:column;gap:10px}.ka-settings-accordion__group{overflow:hidden;border:1px solid var(--ka-border);border-radius:18px;background:var(--ka-card-bg);box-shadow:var(--ka-shadow-sm)}.ka-settings-accordion__toggle{width:100%;min-height:72px;border:0;background:transparent;color:var(--ka-text);display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;cursor:pointer}.ka-settings-accordion__toggle:active{background:var(--ka-muted-bg)}.ka-settings-accordion__icon{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;background:var(--ka-primary-soft);font-size:20px}.ka-settings-accordion__toggle strong{display:block;font-size:14px}.ka-settings-accordion__toggle small{display:block;margin-top:2px;color:var(--ka-text-muted);font-size:10px}.ka-settings-accordion__chevron{font-size:20px;color:var(--ka-text-muted);transition:transform var(--ka-transition)}.ka-settings-accordion__group.is-open .ka-settings-accordion__chevron{transform:rotate(180deg)}.ka-settings-accordion__body{border-top:1px solid var(--ka-border);padding:4px 10px 9px}.ka-settings-accordion__item{width:100%;min-height:58px;border:0;border-bottom:1px solid var(--ka-border);background:transparent;color:var(--ka-text);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 7px;text-align:left;cursor:pointer}.ka-settings-accordion__item:last-child{border-bottom:0}.ka-settings-accordion__item:active{background:var(--ka-muted-bg)}.ka-settings-accordion__item strong{display:block;font-size:13px}.ka-settings-accordion__item small{display:block;margin-top:2px;color:var(--ka-text-muted);font-size:10px}.ka-settings-accordion__item>span:last-child{font-size:24px;color:var(--ka-text-muted)}\n'''
          css.write_text(c,encoding='utf-8')

          test=Path('tests/settings-separate-pages.test.js'); t=test.read_text(encoding='utf-8')
          anchor="assert(settings.includes('function settingsHome()'),'Settings kartlı ana yönetim ekranı sağlamalı.');"
          add=anchor+"\nassert(settings.includes('function bindSettingsAccordion(out)')&&settings.includes('data-settings-accordion-toggle')&&settings.includes(\"label:'Hesap ve Güvenlik'\")&&settings.includes(\"label:'Akademik Yapı'\")&&settings.includes(\"label:'Sistem Yönetimi'\"),'Settings ana ekranı tek canonical akordeon gruplarıyla çalışmalı.');\nassert(!settings.includes('ka-grid ka-settings-home'),'Eski düz Settings kart grid ana görünümü geri dönmemeli.');"
          if t.count(anchor)!=1: raise SystemExit('settings test anchor')
          test.write_text(t.replace(anchor,add,1),encoding='utf-8')

          shelltest=Path('tests/classic-shell-v2-smoke.test.js'); st=shelltest.read_text(encoding='utf-8')
          anchor2="assert(ui.includes('const MENU_GROUPS=['),'Menü kategori kataloğu V2 ShellUI içinde merkezi olmalı.');"
          add2=anchor2+"\nassert(ui.includes(\"popoverBase(anchor,300)\"),'Bildirim popoverı mobilde kompakt 300px genişliği kullanmalı.');\nassert(ui.includes(\"popoverBase(anchor,226)\")&&ui.includes(\"p.classList.add('ka-profile-popover','ka-profile-popover--compact')\"),'Profil popoverı tüm roller için tek kompakt 226px görünüm kullanmalı.');\nassert(design.includes('.ka-notification-popover{max-width:300px!important}')&&design.includes('.ka-profile-popover{max-width:226px!important}'),'Merkezi design system popover maksimum genişliklerini kilitlemeli.');"
          if st.count(anchor2)!=1: raise SystemExit('shell test anchor')
          shelltest.write_text(st.replace(anchor2,add2,1),encoding='utf-8')
          PY
      - name: Verify focused contracts
        run: |
          node --check js/core/shell-ui.js
          node --check js/modules/settings.js
          node tests/settings-separate-pages.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/web-mobile-engine-separation.test.js
          node tests/module-bundles-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit validated canonical changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/shell-ui.js js/modules/settings.js css/design-system.css tests/settings-separate-pages.test.js tests/classic-shell-v2-smoke.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Compact header popovers and group Settings in accordions'
          git push
