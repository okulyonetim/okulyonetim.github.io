name: temp-transport-consolidation
on:
  push:
    branches: [work/transport-detail-consolidation-20260831]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply canonical transport consolidation
        run: |
          python3 .github/temp_transport_consolidation.py
          python3 .github/temp_transport_postfix.py
      - name: Syntax and focused transport contracts
        run: |
          node --check js/modules/transport.js
          node --check js/app-loader.js
          node tests/transport-separate-pages.test.js
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/root-js-inventory-smoke.test.js
          node tests/servisler-role-rules.test.js
          node tests/oturma-planlari-role-rules.test.js
      - name: Build and architecture audit
        run: |
          node scripts/build-client-bundles.mjs
          node scripts/check-client-architecture.mjs
          git diff --check
      - name: Commit canonical consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A js/modules/transport.js js/modules/transport-service-parity.js css/design-system.css js/app-loader.js scripts/build-client-bundles.mjs service-worker.js tests/transport-separate-pages.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Consolidate transport service detail ownership [skip ci]"
          git push
