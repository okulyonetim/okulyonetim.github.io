name: Apply equal menu card sizing v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-menu-card-sizing-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resize menu cards
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('css/design-system.css')
          css = path.read_text(encoding='utf-8')
          replacements = [
              ('.ka-menu-grid{padding:14px max(14px,var(--ka-safe-right)) calc(22px + var(--ka-safe-bottom)) max(14px,var(--ka-safe-left));row-gap:11px;column-gap:11px}', '.ka-menu-grid{padding:14px max(12px,var(--ka-safe-right)) calc(22px + var(--ka-safe-bottom)) max(12px,var(--ka-safe-left));row-gap:10px;column-gap:10px;grid-auto-rows:146px}'),
              ('.ka-menu-card{position:relative;min-height:122px;aspect-ratio:auto;border-radius:20px;padding:13px 13px 12px;gap:8px;align-items:flex-start;justify-content:flex-start;text-align:left;overflow:hidden;border:1px solid color-mix(in srgb,#fff 14%,transparent);box-shadow:0 6px 18px color-mix(in srgb,var(--ka-text) 10%,transparent);transition:transform var(--ka-transition-fast),box-shadow var(--ka-transition-fast),filter var(--ka-transition-fast)}', '.ka-menu-card{position:relative;height:146px;min-height:146px;aspect-ratio:auto;border-radius:20px;padding:14px 13px 13px;gap:8px;align-items:flex-start;justify-content:flex-start;text-align:left;overflow:hidden;border:1px solid color-mix(in srgb,#fff 14%,transparent);box-shadow:0 6px 18px color-mix(in srgb,var(--ka-text) 10%,transparent);transition:transform var(--ka-transition-fast),box-shadow var(--ka-transition-fast),filter var(--ka-transition-fast)}'),
              ('.ka-menu-card[data-ka-menu-group="settings"]:last-child:nth-child(odd){grid-column:1/-1;width:100%;min-height:62px;justify-self:stretch;flex-direction:row;align-items:center;padding:9px 12px;gap:10px}.ka-menu-card[data-ka-menu-group="settings"]:last-child:nth-child(odd) .ka-menu-card__icon{width:38px;height:38px;flex-basis:38px;border-radius:12px;font-size:19px}.ka-menu-card[data-ka-menu-group="settings"]:last-child:nth-child(odd)>strong{margin:0;padding:0;flex:1}.ka-menu-card[data-ka-menu-group="settings"]:last-child:nth-child(odd)>.ka-badge{position:static;margin-left:auto}\n', ''),
              ('@media(max-width:380px){.ka-menu-grid{padding-inline:max(10px,var(--ka-safe-left));gap:9px}.ka-menu-card{min-height:112px;border-radius:18px;padding:11px}.ka-menu-card__icon{width:42px;height:42px;flex-basis:42px}.ka-menu-card strong{font-size:12.2px}.ka-menu-head{padding-inline:max(10px,var(--ka-safe-left))}.ka-menu-edit-toggle{padding-inline:9px}.ka-menu-editor-body{padding:12px 13px 14px}.ka-menu-editor-head{padding-inline:13px}.ka-menu-editor-actions{padding-inline:13px}.ka-menu-editor-actions .ka-btn{font-size:11px}.ka-menu-editor-icon-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}', '@media(max-width:380px){.ka-menu-grid{padding-inline:max(10px,var(--ka-safe-left));gap:9px;grid-auto-rows:136px}.ka-menu-card{height:136px;min-height:136px;border-radius:18px;padding:11px}.ka-menu-card__icon{width:42px;height:42px;flex-basis:42px}.ka-menu-card strong{font-size:12.2px}.ka-menu-head{padding-inline:max(10px,var(--ka-safe-left))}.ka-menu-edit-toggle{padding-inline:9px}.ka-menu-editor-body{padding:12px 13px 14px}.ka-menu-editor-head{padding-inline:13px}.ka-menu-editor-actions{padding-inline:13px}.ka-menu-editor-actions .ka-btn{font-size:11px}.ka-menu-editor-icon-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}')
          ]
          for old, new in replacements:
              if old not in css:
                  raise SystemExit(f'Expected menu CSS block not found: {old[:80]}')
              css = css.replace(old, new, 1)
          path.write_text(css, encoding='utf-8')
          PY
      - name: Verify focused contracts
        run: |
          git diff --check
          node tests/menu-customization-v2.test.js
          node tests/classic-shell-v2-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit menu sizing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/design-system.css
          git commit -m "style: enlarge and equalize menu cards"
          git push origin HEAD:main
