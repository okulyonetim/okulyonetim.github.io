pe=\"checkbox\" data-lesson-holiday ${cfg.tatilModu?'checked':''} ${disabled}> Tatil modunu etkinleştir</label><label class=\"ka-field\"><span class=\"ka-field__label\">Tatil açıklaması</span><input data-lesson-holiday-note value=\"${esc(cfg.tatilModuNotu||'')}\" placeholder=\"Örn. Ara tatil\" ${disabled}></label><div class=\"ka-muted\">Tatil modu açıkken canlı zil sayacı çalışmaz; ana sayfada tatil bilgisi gösterilir.</div></div></article>${editable?'<div class=\"ka-row\"><button class=\"ka-btn\" type=\"button\" data-lesson-hours-save>Ders Saatlerini Kaydet</button></div>':''}`}
