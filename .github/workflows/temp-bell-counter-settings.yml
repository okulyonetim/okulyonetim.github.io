          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if s.count(old)!=1:
                  raise SystemExit(f'{path}: anchor count {s.count(old)} != 1: {old[:90]}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          def sub_once(path, pattern, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              out,n=re.subn(pattern,lambda _m:new,s,count=1,flags=re.S)
              if n!=1:
                  raise SystemExit(f'{path}: regex anchor count {n} != 1: {pattern[:90]}')
