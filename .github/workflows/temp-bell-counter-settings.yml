async function saveLessonHours(){if(!systemSettingsEditable()){toast?.('Ders saatlerini düzenleme yetkiniz yok.');return}const rows=[...document.querySelectorAll('[data-lesson-hour-row]')],periods=rows.map((row,i)=>({saat:Number(row.dataset.period||i+1),baslangic:row.querySelector('[data-lesson-start]')?.value||'',bitis:row.querySelector('[data-lesson-end]')?.value||''}));if(!periods.length){toast?.('En az bir ders saati bulunmalı.');return}let previousEnd=-1;for(const x of periods){const a=lessonTimeMinutes(x.baslangic),b=lessonTimeMinutes(x.bitis);if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a){toast?.(`${x.saat}. ders saati geçersiz.`);return}if(a<previousEnd){toast?.(`${x.saat}. ders önceki ders bitmeden başlayamaz.`);return}previousEnd=b}const lunchEnabled=!!document.querySelector('[data-lesson-lunch-enabled]')?.checked,lunchStart=document.querySelector('[data-lesson-lunch-start]')?.value||'',lunchEnd=document.querySelector('[data-lesson-lunch-end]')?.value||'';if(lunchEnabled&&(!Number.isFinite(lessonTimeMinutes(lunchStart))||lessonTimeMinutes(lunchEnd)<=lessonTimeMinutes(lunchStart))){toast?.('Öğle arası saatleri geçersiz.');return}const current=lessonSettings(),{id:_id,...base}=current,payload={...base,donemler:periods,dersler:periods.map(x=>({...x})),ogleArasiVarMi:lunchEnabled,ogleArasi:{...(base.ogleArasi||{}),baslangic:lunchStart,bitis:lunchEnd},tatilModu:!!document.querySelector('[data-lesson-holiday]')?.checked,tatilModuNotu:document.querySelector('[data-lesson-holiday-note]')?.value.trim()||'',guncellenmeTarihi:new Date().toISOString()},btn=document.querySelector('[data-lesson-hours-save]');if(btn){btn.disabled=true;btn.textContent='Kaydediliyor…'}try{await DeviceData.set('dersSaatleri',COL.dersSaatleri,'ayarlar',payload,{merge:false});toast?.('Ders saatleri ve tatil modu kaydedildi.');render()}catch(e){toast?.('Ders saatleri kaydedilemedi: '+(e?.message||e));if(btn){btn.disabled=false;btn.textContent='Ders Saatlerini Kaydet'}}}
