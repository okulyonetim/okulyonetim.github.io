name: Temporary Bell Counter Settings Gate

on:
  push:
    branches:
      - work/bell-counter-settings-20260831
    paths:
      - '.github/workflows/temp-bell-counter-settings.yml'
      - '.github/temp-bell-source.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract and apply canonical patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          target = Path('js/modules/school-live-status.js')
          text = target.read_text(encoding='utf-8')
          schedule = "function schedule(){const s=settings()||fallbackSettings(),source=Array.isArray(s.donemler)&&s.donemler.length?s.donemler:(Array.isArray(s.dersler)?s.dersler:[]),lessons=source.map((x,i)=>{const period=Number(x.saat||i+1);return{type:'lesson',period,start:secOf(x.baslangic),end:secOf(x.bitis),label:`${period}. Ders`}}).filter(x=>x.start!=null&&x.end!=null).sort((a,b)=>a.start-b.start);const out=[];for(let i=0;i<lessons.length;i++){const l=lessons[i];out.push(l);const n=lessons[i+1];if(!n||n.start<=l.end)continue;const lunch=s.ogleArasiVarMi!==false&&s.ogleArasi&&secOf(s.ogleArasi.baslangic)===l.end&&secOf(s.ogleArasi.bitis)===n.start;out.push({type:lunch?'lunch':'break',start:l.end,end:n.start,label:lunch?'Öğle Arası':'Teneffüs',nextPeriod:n.period})}return out}\nfunction status"
          text, count = re.subn(r"function schedule\(\)\{.*?\}\nfunction status", lambda _m: schedule, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'school-live-status schedule anchor count {count} != 1')
          target.write_text(text, encoding='utf-8')
          src = Path('.github/temp-bell-source.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n", start)
          block = src[start:end]
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          first = block.index("replace_once('js/modules/school-live-status.js',")
          second = block.index("sub_once('js/modules/school-live-status.js'", first)
          block = block[:first] + block[second:]
          Path('/tmp/bell_patch.py').write_text(block, encoding='utf-8')
          PY
          python /tmp/bell_patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/dashboard-card-routes-smoke.test.js')
          s = p.read_text(encoding='utf-8').replace('Array.isArray(cfg.dersler)','Array.isArray(s.dersler)')
          old_route = "assert(dash.includes(\"window.SchoolLiveStatus?.status?.()\")&&dash.includes(\"data-dash-page=\\\"schedule\\\"\"),'Hero canlı kartı ikinci sayaç yerine canonical SchoolLiveStatus ve merkezi Ders Programı rotasını kullanmalı.');"
          new_route = "assert(dash.includes('id=\\\"khBell\\\"')&&dash.includes('data-dash-route=\\\"settings\\\" data-dash-page=\\\"lesson-hours\\\" data-dash-title=\\\"Ders Saatleri\\\"'),'Hero canlı kartı canonical SchoolLiveStatus üzerinden doğrudan Ders Saatleri ayarına gitmeli.');"
          old_surface = "assert(dash.includes('class=\\\"kh-bell-times\\\"')&&dash.includes('class=\\\"kh-bell-progress\\\"')&&dash.includes('GÜN İÇİ AKIŞ'),'Canlı zil kartı referanstaki Başlangıç/Kalan/Bitiş, ilerleme ve gün içi akış yüzeyini taşımalı.');"
          new_surface = "assert(dash.includes('class=\\\"ka-tabs\\\"')&&dash.includes('ka-tab kh-bell-node')&&dash.includes('GÜN İÇİ AKIŞ')&&!dash.includes('class=\\\"kh-bell-times\\\"')&&!dash.includes('class=\\\"kh-bell-progress\\\"'),'Canlı zil kartı kompakt olmalı; gün içi akış tek yatay kaydırılabilir satırda kalmalı.');"
          for old, new in ((old_route,new_route),(old_surface,new_surface)):
              if s.count(old) != 1:
                  raise SystemExit('dashboard stale contract anchor count != 1')
              s = s.replace(old,new,1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify targeted contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check js/modules/school-live-status.js
          node --check js/modules/dashboard.js
          node --check js/modules/settings.js
          node --check js/core/shell-ui.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/settings-separate-pages.test.js
      - name: Verify full client architecture
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-client-bundles.mjs
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/lazy-firebase-storage-smoke.test.js
          node tests/web-mobile-engine-separation.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/classic-people-v2-smoke.test.js
          node tests/classes-mobile-parity-smoke.test.js
          node tests/classic-duty-v2-smoke.test.js
          node tests/classic-schedule-v2-smoke.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-quick-actions.test.js
          node tests/calendar-month-view.test.js
          node tests/quick-note-launcher.test.js
          node tests/communication-admin-actions.test.js
          node tests/transport-separate-pages.test.js
          node tests/no-module-internal-tabs.test.js
          node tests/report-engine-a4-smoke.test.js
          node tests/report-native-print-routing-smoke.test.js
          node tests/android-print-plugin-smoke.test.js
          node tests/dashboard-reminders-smoke.test.js
          node tests/teacher-list-core-contract.test.js
          node tests/teacher-list-local-first-service.test.js
          node tests/student-tool-routing-smoke.test.js
          node tests/people-separate-pages.test.js
          node tests/academic-separate-pages.test.js
          node tests/management-separate-pages.test.js
          node tests/communication-separate-pages.test.js
          node tests/settings-separate-pages.test.js
          node tests/tools-separate-pages.test.js
          node tests/communication-local-first-contract.test.js
          node tests/retired-legacy-roots-smoke.test.js
          node tests/root-js-inventory-smoke.test.js
          node tests/widget-platform-adapter-smoke.test.js
          node tests/teblig-v2-smoke.test.js
          node tests/documents-viewer-v2-smoke.test.js
          node tests/document-viewer-smoke.test.js
          node tests/lazy-document-libs-smoke.test.js
          node tests/payroll-change-v2-smoke.test.js
          node tests/assistant-v2-smoke.test.js
          node tests/legislation-engine-v2-smoke.test.js
          node tests/map-consolidation-smoke.test.js
          node tests/rubric-tools-v2-smoke.test.js
          node tests/rubric-settings-v2-smoke.test.js
          node tests/rubric-legacy-retirement-readiness.test.js
          node tests/pwa-push-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/school-live-status.js js/modules/dashboard.js js/modules/settings.js js/core/shell-ui.js tests/dashboard-card-routes-smoke.test.js tests/settings-separate-pages.test.js
          git diff --cached --quiet && { echo 'No application changes'; exit 1; }
          git commit -m 'Compact bell counter and restore lesson hour settings'
          git push
