name: Add PDF tools to Documents menu
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update menu and restore tools module
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          # Restore tools.js to the last known-good repository state before the accidental placeholder write.
          subprocess.run(['git','checkout','1165f68d3a1ad453c641b3ee3c283aa0173291f3','--','js/modules/tools.js'], check=True)

          p=Path('js/core/shell-ui.js')
          s=p.read_text(encoding='utf-8')
          old="{key:'documents',label:'Belgeler',modernLabel:'Doküman & Evraklar',icon:'📁',tone:'amber',route:'documents',items:[['Evrak Takibi','📄','documents','evrak'],['Dokümanlar','📁','documents'],['Personel İşleri','👥','management','staff']]}"
          new="{key:'documents',label:'Belgeler',modernLabel:'Doküman & Evraklar',icon:'📁',tone:'amber',route:'documents',items:[['Evrak Takibi','📄','documents','evrak'],['Dokümanlar','📁','documents'],['Resimden PDF Oluştur','🖼️','documents','pdf-images'],['PDF Birleştir','📑','documents','pdf-merge'],['Personel İşleri','👥','management','staff']]}"
          if old not in s:
              raise SystemExit('Documents menu definition not found; no menu change made.')
          s=s.replace(old,new,1)

          marker='installButtonFeedback();\n'
          injection=r'''installButtonFeedback();
+document.addEventListener('click',async e=>{
+  const b=e.target.closest?.('button'); if(!b)return;
+  const text=String(b.innerText||b.textContent||'').replace(/\\s+/g,' ').trim();
+  const mode=text==='Resimden PDF Oluştur'?'images':text==='PDF Birleştir'?'merge':'';
+  if(!mode)return;
+  e.preventDefault(); e.stopImmediatePropagation();
+  try{
+    if(!global.ReportEngine?.openPdfTools){
+      if(global.AppLoader?.loadScript) await global.AppLoader.loadScript('js/modules/report-engine.js');
+      else await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='js/modules/report-engine.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});
+    }
+    if(!global.ReportEngine?.openPdfTools) throw new Error('PDF araçları hazır değil.');
+    global.ReportEngine.openPdfTools(mode);
+  }catch(err){ console.error('[PDF menu]',err); global.toast?.('PDF aracı açılamadı: '+(err?.message||err)); }
+},true);
-'''
          # Use a plain marker replacement without the diff +/- characters.
          injection=injection.replace('+','',1).replace("-''','", "''',") if False else injection
          # Construct the exact desired block explicitly.
          desired="""installButtonFeedback();
          document.addEventListener('click',async e=>{
            const b=e.target.closest?.('button'); if(!b)return;
            const text=String(b.innerText||b.textContent||'').replace(/\\s+/g,' ').trim();
            const mode=text==='Resimden PDF Oluştur'?'images':text==='PDF Birleştir'?'merge':'';
            if(!mode)return;
            e.preventDefault(); e.stopImmediatePropagation();
            try{
              if(!global.ReportEngine?.openPdfTools){
                if(global.AppLoader?.loadScript) await global.AppLoader.loadScript('js/modules/report-engine.js');
                else await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='js/modules/report-engine.js';sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc)});
              }
              if(!global.ReportEngine?.openPdfTools) throw new Error('PDF araçları hazır değil.');
              global.ReportEngine.openPdfTools(mode);
            }catch(err){ console.error('[PDF menu]',err); global.toast?.('PDF aracı açılamadı: '+(err?.message||err)); }
          },true);
          """
          if "text==='Resimden PDF Oluştur'" not in s:
              if marker not in s: raise SystemExit('Shell install marker not found.')
              s=s.replace(marker,desired,1)
          p.write_text(s,encoding='utf-8')

          # Keep the temporary workflow out of the repository after it has done its job.
          Path('.github/workflows/add-pdf-tools-to-documents.yml').unlink()

          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','js/core/shell-ui.js','js/modules/tools.js','.github/workflows/add-pdf-tools-to-documents.yml'],check=True)
          subprocess.run(['git','commit','-m','Add PDF tools to Documents menu'],check=True)
          subprocess.run(['git','push','origin','main'],check=True)
      - name: Validate
        run: |
          node --check js/core/shell-ui.js
          node --check js/modules/tools.js
          node tests/report-engine-a4-smoke.test.js
          node tests/module-bundles-smoke.test.js
