name: One-time Ders Programi Selection Repair
on:
  push:
    paths:
      - '.github/workflows/fix-ders-programi-select.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch report class selection
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/raporlama.js')
          s = p.read_text(encoding='utf-8')
          start = s.index('function raporDersProgrami()')
          end = s.index('function _raporDersProgramiGoster', start)
          chunk = s[start:end]
          old_select = '''<select id="sinifSec" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px;">'''
          new_select = '''<select id="dersProgramiSinifSec" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px;">'''
          if old_select not in chunk:
              raise SystemExit('Ders Programi select target not found')
          chunk = chunk.replace(old_select, new_select, 1)
          old_cb = "const sinifId = document.getElementById('sinifSec').value;"
          new_cb = "const secim = document.getElementById('dersProgramiSinifSec');\n    const sinifId = secim ? String(secim.value || '').trim() : '';"
          if old_cb not in chunk:
              raise SystemExit('Ders Programi callback target not found')
          chunk = chunk.replace(old_cb, new_cb, 1)
          s = s[:start] + chunk + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/raporlama.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve selected class in ders programi report"
          git push