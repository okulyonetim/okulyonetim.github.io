name: Temporary Lesson Hours Gate

on:
  push:
    branches: [work/lesson-hours-auto-distribution-20260831]
    paths:
      - '.github/workflows/temp-lesson-hours.yml'

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update canonical lesson hours owners
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(path, pattern, replacement):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              text,count=re.subn(pattern,lambda _m:replacement,text,count=1,flags=re.S)
              if count!=1:
                  raise SystemExit(f'{path}: replacement count {count} != 1')
              p.write_text(text,encoding='utf-8')

          settings_block=r'''function lessonDefaultSettings(){const donemler=[['08:30','09:10'],['09:20','10:00'],['10:10','10:50'],['11:00','11:40'],['12:30','13:10'],['13:20','14:00'],['14:10','14:50']].map((x,i)=>({saat:i+1,baslangic:x[0],bitis:x[1]}));return{donemler,dersler:donemler.map(x=>({...x})),ogleArasiVarMi:true,ogleArasi:{sonrakiDers:4,baslangic:'11:40',bitis:'12:30'},tatilModu:false,tatilModuNotu:'',okulAcilisTarihi:''}}
          function lessonSettings(){const def=lessonDefaultSettings(),cfg=arr('dersSaatleri').find(x=>x.id==='ayarlar')||arr('dersSaatleri')[0]||{},source=Array.isArray(cfg.donemler)&&cfg.donemler.length?cfg.donemler:(Array.isArray(cfg.dersler)&&cfg.dersler.length?cfg.dersler:def.donemler);return{...def,...cfg,donemler:source.map((x,i)=>({saat:Number(x.saat||i+1),baslangic:String(x.baslangic||''),bitis:String(x.bitis||'')})),ogleArasi:{...def.ogleArasi,...(cfg.ogleArasi||{})}}}
          function lessonTimeMinutes(v){const m=/^(\d{2}):(\d{2})$/.exec(String(v||''));if(!m)return NaN;const h=Number(m[1]),min=Number(m[2]);return h>=0&&h<24&&min>=0&&min<60?h*60+min:NaN}
          function lessonMinutesTime(v){const n=Number(v);if(!Number.isFinite(n)||n<0||n>=24*60)return'';return`${String(Math.floor(n/60)).padStart(2,'0')}:${String(Math.floor(n%60)).padStart(2,'0')}`}
          function lessonLocalDateValue(d=new Date()){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
          function lessonDistributionSettings(cfg){const periods=cfg.donemler||[],first=periods[0]||{},firstStart=first.baslangic||'08:30',firstDuration=Math.max(1,lessonTimeMinutes(first.bitis)-lessonTimeMinutes(first.baslangic)||40),lunchAfter=Math.max(1,Math.min(Math.max(1,periods.length-1),Number(cfg.ogleArasi?.sonrakiDers||4)||4));let breakDuration=10;for(let i=0;i<periods.length-1;i++){if(i+1===lunchAfter&&cfg.ogleArasiVarMi!==false)continue;const gap=lessonTimeMinutes(periods[i+1].baslangic)-lessonTimeMinutes(periods[i].bitis);if(Number.isFinite(gap)&&gap>=0){breakDuration=gap;break}}const lunchDuration=Math.max(1,lessonTimeMinutes(cfg.ogleArasi?.bitis)-lessonTimeMinutes(cfg.ogleArasi?.baslangic)||50);return{firstStart,firstDuration,breakDuration,lunchDuration,lunchAfter}}
          function lessonHours(){const cfg=lessonSettings(),editable=systemSettingsEditable(),disabled=editable?'':'disabled',dist=lessonDistributionSettings(cfg),today=lessonLocalDateValue(),rows=cfg.donemler.map((x,i)=>`<div class="ka-row" data-lesson-hour-row data-period="${Number(x.saat||i+1)}"><strong style="min-width:58px">${Number(x.saat||i+1)}. Ders</strong><label class="ka-field ka-grow"><span class="ka-field__label">Başlangıç</span><input type="time" data-lesson-start value="${esc(x.baslangic)}" ${disabled}></label><label class="ka-field ka-grow"><span class="ka-field__label">Bitiş</span><input type="time" data-lesson-end value="${esc(x.bitis)}" ${disabled}></label></div>`).join(''),afterOptions=cfg.donemler.slice(0,-1).map((x,i)=>`<option value="${i+1}" ${dist.lunchAfter===i+1?'selected':''}>${i+1}. dersten sonra</option>`).join('');return `<article class="ka-card"><div class="ka-card__body ka-stack"><div><strong>⚙️ Otomatik Dağıtım</strong><div class="ka-muted">İlk ders başlangıcını ve süreleri girin; tüm ders saatleri tek işlemle oluşturulsun.</div></div><div class="ka-grid"><label class="ka-field"><span class="ka-field__label">İlk Ders</span><input type="time" data-lesson-auto-first value="${esc(dist.firstStart)}" ${disabled}></label><label class="ka-field"><span class="ka-field__label">Ders Süresi (dk)</span><input type="number" min="1" max="180" inputmode="numeric" data-lesson-auto-duration value="${dist.firstDuration}" ${disabled}></label><label class="ka-field"><span class="ka-field__label">Teneffüs Süresi (dk)</span><input type="number" min="0" max="120" inputmode="numeric" data-lesson-auto-break value="${dist.breakDuration}" ${disabled}></label></div><label class="ka-check"><input type="checkbox" data-lesson-lunch-enabled ${cfg.ogleArasiVarMi!==false?'checked':''} ${disabled}> Öğle arası var</label><div class="ka-grid" data-lesson-lunch-options><label class="ka-field"><span class="ka-field__label">Öğle Arası Süresi (dk)</span><input type="number" min="1" max="240" inputmode="numeric" data-lesson-auto-lunch-duration value="${dist.lunchDuration}" ${disabled}></label><label class="ka-field"><span class="ka-field__label">Öğle Arası</span><select data-lesson-auto-lunch-after ${disabled}>${afterOptions}</select></label></div>${editable?'<button class="ka-btn" type="button" data-lesson-auto-distribute>↪ Otomatik Dağıt</button>':''}</div></article><article class="ka-card"><div class="ka-card__body ka-stack"><div class="ka-row ka-row--between"><strong>📚 Ders Saatleri</strong><span class="ka-badge">${editable?'DÜZENLENEBİLİR':'SALT OKUNUR'}</span></div><div class="ka-muted">Otomatik dağıtımdan sonra gerekirse tek tek saatleri düzenleyebilirsiniz.</div>${rows}</div></article><article class="ka-card"><div class="ka-card__body ka-stack"><div class="ka-row ka-row--between"><strong>🏖️ Tatil Modu</strong><span class="ka-badge ${cfg.tatilModu?'ka-badge--warning':''}">${cfg.tatilModu?'AKTİF':'KAPALI'}</span></div><label class="ka-check"><input type="checkbox" data-lesson-holiday ${cfg.tatilModu?'checked':''} ${disabled}> Tatil modunu etkinleştir</label><label class="ka-field" data-lesson-opening-wrap ${cfg.tatilModu?'':'hidden'}><span class="ka-field__label">Okulun Açılacağı Tarih</span><input type="date" min="${today}" data-lesson-opening-date value="${esc(cfg.okulAcilisTarihi||'')}" ${disabled}><small class="ka-muted">Bu tarih zorunludur. Açılış gününde canlı ders sayacı otomatik olarak yeniden devreye girer.</small></label></div></article>${editable?'<div class="ka-row"><button class="ka-btn" type="button" data-lesson-hours-save>💾 Kaydet</button></div>':''}`}
          function distributeLessonHours(out){if(!systemSettingsEditable())return;const rows=[...out.querySelectorAll('[data-lesson-hour-row]')],first=lessonTimeMinutes(out.querySelector('[data-lesson-auto-first]')?.value||''),duration=Number(out.querySelector('[data-lesson-auto-duration]')?.value),breakDuration=Number(out.querySelector('[data-lesson-auto-break]')?.value),lunchEnabled=!!out.querySelector('[data-lesson-lunch-enabled]')?.checked,lunchDuration=Number(out.querySelector('[data-lesson-auto-lunch-duration]')?.value),lunchAfter=Number(out.querySelector('[data-lesson-auto-lunch-after]')?.value);if(!rows.length)return toast?.('Dağıtılacak ders bulunamadı.');if(!Number.isFinite(first))return toast?.('İlk ders başlangıç saatini seçin.');if(!Number.isFinite(duration)||duration<1||duration>180)return toast?.('Ders süresi 1-180 dakika arasında olmalı.');if(!Number.isFinite(breakDuration)||breakDuration<0||breakDuration>120)return toast?.('Teneffüs süresi 0-120 dakika arasında olmalı.');if(lunchEnabled&&(!Number.isFinite(lunchDuration)||lunchDuration<1||lunchDuration>240))return toast?.('Öğle arası süresi 1-240 dakika arasında olmalı.');if(lunchEnabled&&(!Number.isInteger(lunchAfter)||lunchAfter<1||lunchAfter>=rows.length))return toast?.('Öğle arasının hangi dersten sonra olacağını seçin.');let cursor=first;const generated=[];for(let i=0;i<rows.length;i++){const period=Number(rows[i].dataset.period||i+1),start=cursor,end=start+duration;if(end>=24*60)return toast?.('Hesaplanan ders saatleri gün sonunu aşıyor.');generated.push({start,end});if(i<rows.length-1){cursor=end+(lunchEnabled&&period===lunchAfter?lunchDuration:breakDuration);if(cursor>=24*60)return toast?.('Hesaplanan ders saatleri gün sonunu aşıyor.')}}generated.forEach((x,i)=>{rows[i].querySelector('[data-lesson-start]').value=lessonMinutesTime(x.start);rows[i].querySelector('[data-lesson-end]').value=lessonMinutesTime(x.end)});toast?.('Ders saatleri otomatik dağıtıldı. Kaydetmeyi unutmayın.')}
          async function saveLessonHours(){if(!systemSettingsEditable()){toast?.('Ders saatlerini düzenleme yetkiniz yok.');return}const rows=[...document.querySelectorAll('[data-lesson-hour-row]')],periods=rows.map((row,i)=>({saat:Number(row.dataset.period||i+1),baslangic:row.querySelector('[data-lesson-start]')?.value||'',bitis:row.querySelector('[data-lesson-end]')?.value||''}));if(!periods.length){toast?.('En az bir ders saati bulunmalı.');return}let previousEnd=-1;for(const x of periods){const a=lessonTimeMinutes(x.baslangic),b=lessonTimeMinutes(x.bitis);if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a){toast?.(`${x.saat}. ders saati geçersiz.`);return}if(a<previousEnd){toast?.(`${x.saat}. ders önceki ders bitmeden başlayamaz.`);return}previousEnd=b}const lunchEnabled=!!document.querySelector('[data-lesson-lunch-enabled]')?.checked,lunchAfter=Number(document.querySelector('[data-lesson-auto-lunch-after]')?.value||4),lunchStart=lunchEnabled?(periods[lunchAfter-1]?.bitis||''):'',lunchEnd=lunchEnabled?(periods[lunchAfter]?.baslangic||''):'';if(lunchEnabled&&(!periods[lunchAfter]||!Number.isFinite(lessonTimeMinutes(lunchStart))||lessonTimeMinutes(lunchEnd)<=lessonTimeMinutes(lunchStart))){toast?.('Öğle arası dağılımı geçersiz.');return}const holiday=!!document.querySelector('[data-lesson-holiday]')?.checked,openingDate=document.querySelector('[data-lesson-opening-date]')?.value||'';if(holiday&&!openingDate){toast?.('Tatil modu için okulun açılacağı tarihi seçin.');return}if(holiday&&openingDate<lessonLocalDateValue()){toast?.('Okulun açılacağı tarih bugünden önce olamaz.');return}const current=lessonSettings(),{id:_id,...base}=current,payload={...base,donemler:periods,dersler:periods.map(x=>({...x})),ogleArasiVarMi:lunchEnabled,ogleArasi:{...(base.ogleArasi||{}),sonrakiDers:lunchAfter,baslangic:lunchStart,bitis:lunchEnd},tatilModu:holiday,okulAcilisTarihi:openingDate,guncellenmeTarihi:new Date().toISOString()},btn=document.querySelector('[data-lesson-hours-save]');if(btn){btn.disabled=true;btn.textContent='Kaydediliyor…'}try{await DeviceData.set('dersSaatleri',COL.dersSaatleri,'ayarlar',payload,{merge:false});toast?.('Ders saatleri ve tatil modu kaydedildi.');render()}catch(e){toast?.('Ders saatleri kaydedilemedi: '+(e?.message||e));if(btn){btn.disabled=false;btn.textContent='💾 Kaydet'}}}
          function bindLessonHours(out){const editable=systemSettingsEditable(),lunch=out.querySelector('[data-lesson-lunch-enabled]'),holiday=out.querySelector('[data-lesson-holiday]'),lunchSync=()=>{const off=!editable||!lunch?.checked;out.querySelectorAll('[data-lesson-auto-lunch-duration],[data-lesson-auto-lunch-after]').forEach(x=>x.disabled=off)},holidaySync=()=>{const wrap=out.querySelector('[data-lesson-opening-wrap]'),date=out.querySelector('[data-lesson-opening-date]'),on=!!holiday?.checked;if(wrap)wrap.hidden=!on;if(date){date.disabled=!editable||!on;date.required=on}};lunch?.addEventListener('change',lunchSync);holiday?.addEventListener('change',holidaySync);lunchSync();holidaySync();out.querySelector('[data-lesson-auto-distribute]')?.addEventListener('click',()=>distributeLessonHours(out));out.querySelector('[data-lesson-hours-save]')?.addEventListener('click',saveLessonHours)}'''

          sub_once('js/modules/settings.js',r"function lessonDefaultSettings\(\).*?\nfunction teacherOptions",settings_block+'\nfunction teacherOptions')

          live_helpers=r'''function holidayState(cfg,now,segments){if(!cfg?.tatilModu)return null;const raw=String(cfg.okulAcilisTarihi||'').trim(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),opening=/^\d{4}-\d{2}-\d{2}$/.test(raw)?new Date(`${raw}T00:00:00`):null;if(opening&&!Number.isNaN(opening.getTime())&&today>=opening)return null;let sub=cfg.tatilModuNotu||'Okul tatil modunda',remainingDays=null;if(opening&&!Number.isNaN(opening.getTime())){remainingDays=Math.ceil((opening-today)/86400000);const formatted=opening.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'});sub=remainingDays===1?`Okul yarın açılıyor · ${formatted}`:`Okulun açılmasına ${remainingDays} gün kaldı · ${formatted}`}return{mode:'holiday',label:'Tatil Modu',sub,openingDate:raw||'',remainingDays,segments}}
          function status(now=new Date()){const cfg=settings()||fallbackSettings(),segs0=schedule(),holiday=holidayState(cfg,now,segs0);if(holiday)return holiday;if(now.getDay()===0||now.getDay()===6)return{mode:'weekend',label:'Hafta sonu',sub:'Bugün ders bulunmuyor',segments:segs0};const segs=segs0,sec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();if(!segs.length)return{mode:'empty',label:'Ders saatleri yükleniyor',segments:[]};const first=segs.find(x=>x.type==='lesson')||segs[0],countdownLead=60*60;if(sec<first.start-countdownLead)return{mode:'idle',label:'Ders saatleri',nextPeriod:first.period||1,start:first.start-countdownLead,end:first.start,remaining:null,progress:0,segments:segs,index:-1};for(let i=0;i<segs.length;i++){const s=segs[i];if(sec>=s.start&&sec<s.end)return{mode:s.type,label:s.label,period:s.period,nextPeriod:s.nextPeriod,start:s.start,end:s.end,remaining:s.end-sec,progress:(sec-s.start)/(s.end-s.start),segments:segs,index:i};if(sec<s.start)return{mode:i===0?'before':'break',label:i===0?'Derslere hazırlanıyor':'Teneffüs',nextPeriod:s.period,start:i===0?s.start-countdownLead:segs[i-1].end,end:s.start,remaining:s.start-sec,progress:i===0?Math.max(0,Math.min(1,(sec-(s.start-countdownLead))/countdownLead)):(sec-segs[i-1].end)/(s.start-segs[i-1].end),segments:segs,index:i-1}}return{mode:'after',label:'Dersler tamamlandı',sub:'Bugünkü ders programı sona erdi',segments:segs,index:segs.length-1}}'''
          sub_once('js/modules/school-live-status.js',r"function status\(now=new Date\(\)\)\{.*?\}\nfunction user\(\)",live_helpers+'\nfunction user()')

          p=Path('tests/settings-separate-pages.test.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace("const shell=fs.readFileSync('js/core/shell-ui.js','utf8');","const shell=fs.readFileSync('js/core/shell-ui.js','utf8');\nconst live=fs.readFileSync('js/modules/school-live-status.js','utf8');",1)
          old="assert(settings.includes(\"['lesson-hours','Ders Saatleri','Zil saatleri, öğle arası ve tatil modu']\")&&settings.includes('data-lesson-holiday')&&settings.includes(\"DeviceData.set('dersSaatleri',COL.dersSaatleri,'ayarlar'\"),'Ders Saatleri ve Tatil Modu mevcut local-first dersSaatleri modeline bağlı olmalı.');"
          new="assert(settings.includes(\"['lesson-hours','Ders Saatleri','Zil saatleri, öğle arası ve tatil modu']\")&&settings.includes('data-lesson-auto-first')&&settings.includes('data-lesson-auto-duration')&&settings.includes('data-lesson-auto-break')&&settings.includes('data-lesson-auto-lunch-duration')&&settings.includes('data-lesson-auto-distribute'),'Ders Saatleri tek canonical ekranda otomatik dağıtım parametrelerini sağlamalı.');\nassert(settings.includes('function distributeLessonHours(out)')&&settings.includes('data-lesson-hour-row')&&settings.includes(\"DeviceData.set('dersSaatleri',COL.dersSaatleri,'ayarlar'\"),'Otomatik dağıtım mevcut donemler/dersler local-first modeline yazmalı; ikinci motor oluşturmamalı.');\nassert(settings.includes('data-lesson-holiday')&&settings.includes('data-lesson-opening-date')&&settings.includes('okulAcilisTarihi')&&settings.includes('Tatil modu için okulun açılacağı tarihi seçin.'),'Tatil modu açılış tarihini zorunlu seçtirmeli.');\nassert(live.includes('function holidayState(cfg,now,segments)')&&live.includes('okulAcilisTarihi')&&live.includes('remainingDays')&&live.includes('today>=opening'),'Canlı zil motoru tatil açılış tarihini tek kaynaktan okuyup açılış gününde yeniden devreye girmeli.');"
          if t.count(old)!=1:
              raise SystemExit('settings test anchor mismatch')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify canonical lesson hour contracts
        run: |
          set -euo pipefail
          node --check js/modules/settings.js
          node --check js/modules/school-live-status.js
          node tests/settings-separate-pages.test.js
          node tests/dashboard-card-routes-smoke.test.js
          git diff --check
      - name: Audit client architecture
        run: node scripts/check-client-architecture.mjs
      - name: Commit validated canonical changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/settings.js js/modules/school-live-status.js tests/settings-separate-pages.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Make lesson hours auto-distributed with dated holiday mode'
          git push
