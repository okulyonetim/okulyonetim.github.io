name: Wire unified report header
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[report-header-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load unified report header
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/report-header-unifier.js?v=1"></script>'
          if 'js/report-header-unifier.js' not in s:
              s=s.replace('<script src="js/raporlama.js"></script>', '<script src="js/raporlama.js"></script>\n'+tag)
              p.write_text(s,encoding='utf-8')
          sw=Path('service-worker.js')
          if sw.exists():
              w=sw.read_text(encoding='utf-8')
              import re
              m=re.search(r"const CACHE_ADI='oy-cache-v(\d+)';",w)
              if m:
                  w=w[:m.start()]+f"const CACHE_ADI='oy-cache-v{int(m.group(1))+1}';"+w[m.end():]
                  sw.write_text(w,encoding='utf-8')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "fix: use single logo header across reports [report-header-wired]"
          git push
