name: Optik Form PDF Patch
permissions:
  contents: write
on:
  push:
    branches: [agent/optik-form-filename-hardening]
    paths: ['.github/workflows/optik-form-patch.yml']

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optik-form-filename-hardening
      - name: Optik PDF dosya adlarını güvenli hale getir
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('optik/js/app.js')
          s=p.read_text()
          anchor="let _yzMod = null; // 'bos' | 'ogrenciler'"
          helper=anchor+"""

/* Optik PDF dosya adı standardı: Android/Windows'ta geçersiz karakterleri
   temizler; ç, ğ, ı, İ, ö, ş, ü gibi Türkçe karakterleri AYNEN korur. */
function _optikPdfDosyaAdi(ad, ek) {
    let temel = String(ad || 'Optik Form').trim()
        .replace(/[\\u0000-\\u001f<>:\"/\\\\|?*]+/g, '-')
        .replace(/\\s+/g, ' ')
        .replace(/[. ]+$/g, '');
    if (!temel) temel = 'Optik Form';
    temel = temel.replace(/\\s+/g, '_');
    return temel + (ek ? '_' + ek : '') + '.pdf';
}"""
          assert anchor in s
          s=s.replace(anchor,helper,1)
          old="_pdfKaydet(doc, sinav.ad.replace(/\\s+/g, '_') + '_bos.pdf')"
          new="_pdfKaydet(doc, _optikPdfDosyaAdi(sinav.ad, 'bos'))"
          assert old in s
          s=s.replace(old,new,1)
          old="_pdfKaydet(doc, sinav.ad.replace(/\\s+/g, '_') + '_ogrenciler.pdf')"
          new="_pdfKaydet(doc, _optikPdfDosyaAdi(sinav.ad, 'ogrenciler'))"
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace("durumEl.textContent = '✅ PDF indirildi.';", "durumEl.textContent = '✅ PDF kaydedildi.';", 1)
          s=s.replace("durumEl.textContent = `✅ ${ogrList.length} öğrenci için PDF indirildi.`;", "durumEl.textContent = `✅ ${ogrList.length} öğrenci için PDF kaydedildi.`;", 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add optik/js/app.js
          git commit -m "Optik Form PDF dosya adlarını güvenli hale getir"
          git push origin HEAD:agent/optik-form-filename-hardening
