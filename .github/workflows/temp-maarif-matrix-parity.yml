name: temp-maarif-matrix-parity
on:
  push:
    branches: [work/maarif-matrix-parity-20260831]
permissions:
  contents: write
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: npm install --no-save --package-lock=false firebase @firebase/rules-unit-testing firebase-tools
      - name: Restore Maarif teacher matrix visible parity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/modules/rubric-settings.js')
          s=p.read_text(encoding='utf-8')
          needle="function maarifCard(r){const a=checkArray('maarifRapor',r),done=a.filter(Boolean).length;return `<article class=\"ka-card\"><div class=\"ka-card__body ka-stack\"><div class=\"ka-row ka-row--between\"><div class=\"ka-grow\"><strong>${esc(r.ders||'Ders')} · ${esc(r.sinif||'Sınıf')}</strong><div class=\"ka-muted\">${esc(teacherName(r.ogretmenId))}${r.aciklama?' · '+esc(r.aciklama):''}</div></div><div class=\"ka-row\"><span class=\"ka-badge\">${done}/10</span>${editButton('maarifRapor',r.id)}</div></div>${controlGrid('maarifRapor',r)}</div></article>`}"
          assert s.count(needle)==1, ('maarif-card-contract',s.count(needle))
          matrix="function maarifMatrix(rows){const labels=CONTROLS.maarifRapor||[],groups=new Map;rows.forEach(r=>{if(!r.ogretmenId)return;const key=String(r.ogretmenId);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)});if(!groups.size)return'<div class=\"ka-empty\">Öğretmen atanmış kayıt yok.</div>';const disabled=!canEdit('maarifRapor');return `<div class=\"ka-stack\">${[...groups.entries()].sort((a,b)=>teacherName(a[0]).localeCompare(teacherName(b[0]),'tr')).map(([teacherId,records])=>{const sorted=records.slice().sort((a,b)=>String(a.ders||'').localeCompare(String(b.ders||''),'tr')||String(a.sinif||'').localeCompare(String(b.sinif||''),'tr',{numeric:true})),done=sorted.reduce((sum,r)=>sum+checkArray('maarifRapor',r).filter(Boolean).length,0),total=sorted.length*labels.length,body=sorted.map(r=>{const checks=checkArray('maarifRapor',r);return `<tr><td><strong>${esc(r.ders||'Ders')}</strong><div class=\"ka-muted\">${esc(r.sinif||'Sınıf')}${r.aciklama?' · '+esc(r.aciklama):''}</div></td>${labels.map((label,i)=>`<td style=\"text-align:center\"><input type=\"checkbox\" aria-label=\"${esc(label)}\" data-cizelge-check data-type=\"maarifRapor\" data-id=\"${esc(r.id)}\" data-index=\"${i}\" ${checks[i]?'checked':''} ${disabled?'disabled':''}></td>`).join('')}<td>${editButton('maarifRapor',r.id)}</td></tr>`}).join('');return `<section class=\"ka-card\"><div class=\"ka-card__header ka-row ka-row--between\"><div class=\"ka-grow\"><strong>${esc(teacherName(teacherId)||'Öğretmen')}</strong><div class=\"ka-muted\">${sorted.length} ders / sınıf kaydı</div></div><span class=\"ka-badge\">${done}/${total}</span></div><div class=\"ka-card__body\" style=\"padding:0\"><div class=\"ka-table-wrap\" style=\"border:0;border-radius:0 0 var(--ka-radius-lg) var(--ka-radius-lg)\"><table class=\"ka-table\" style=\"min-width:980px\"><thead><tr><th>DERS / SINIF</th>${labels.map(label=>`<th style=\"text-align:center\">${esc(label)}</th>`).join('')}<th>İŞLEM</th></tr></thead><tbody>${body}</tbody></table></div></div></section>`}).join('')}</div>`}"
          s=s.replace(needle,needle+'\n'+matrix,1)
          old="if(type==='maarifRapor')return `<div class=\"ka-stack\">${rows.map(maarifCard).join('')}</div>`;"
          assert s.count(old)==1, ('maarif-body-route',s.count(old))
          s=s.replace(old,"if(type==='maarifRapor')return maarifMatrix(rows);",1)
          p.write_text(s,encoding='utf-8')

          Path('tests/maarif-matrix-visible-parity.test.js').write_text("""const fs=require('fs');\nconst assert=require('assert');\nconst rubric=fs.readFileSync('js/modules/rubric-settings.js','utf8');\nassert(rubric.includes('function maarifMatrix(rows)'),'Maarif görünümü öğretmen bazlı canonical matris renderer kullanmalı.');\nassert(rubric.includes('DERS / SINIF')&&rubric.includes('CONTROLS.maarifRapor||[]'),'Maarif matrisi ders/sınıf ve 10 aylık kontrol başlıklarını kullanmalı.');\nassert(rubric.includes('groups=new Map')&&rubric.includes('if(!r.ogretmenId)return'),'Maarif kayıtları eski davranıştaki gibi öğretmen bazında gruplanmalı.');\nassert(rubric.includes("sorted.length*labels.length")&&rubric.includes("filter(Boolean).length"),'Öğretmen grup başlığı toplam ilerlemeyi göstermeli.');\nassert(rubric.includes("String(a.ders||'').localeCompare")&&rubric.includes("String(a.sinif||'').localeCompare"),'Maarif satırları ders ve sınıfa göre sıralanmalı.');\nassert(rubric.includes('data-cizelge-check data-type=\\\"maarifRapor\\\"')&&rubric.includes('data-index=\\\"${i}\\\"'),'Aylık hücreler mevcut canonical kontrol toggle akışını kullanmalı.');\nassert(rubric.includes("editButton('maarifRapor',r.id)"),'Maarif matrisinde mevcut düzenleme davranışı korunmalı.');\nassert(rubric.includes("if(type==='maarifRapor')return maarifMatrix(rows);"),'Maarif sayfası kart listesi yerine matris görünümüne yönlenmeli.');\nassert(rubric.includes('class=\\\"ka-table-wrap\\\"')&&rubric.includes('class=\\\"ka-table\\\"'),'Maarif matrisi merkezi design-system tablo yüzeyini kullanmalı.');\nconsole.log('Maarif teacher matrix visible parity OK');\n""",encoding='utf-8')
          PY
      - name: Run complete test suite in Firebase emulators
        run: |
          npx firebase emulators:exec --only firestore,storage --project demo-okul-rules "bash -lc 'set -e; for f in tests/*.test.js; do echo ==\> \$f; node \"\$f\"; done; node scripts/check-client-architecture.mjs; git diff --check'"
      - name: Commit verified parity package and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temp-maarif-matrix-parity.yml
          git add js/modules/rubric-settings.js tests/maarif-matrix-visible-parity.test.js .github/workflows/temp-maarif-matrix-parity.yml
          git diff --cached --quiet && exit 0
          git commit -m "Restore Maarif teacher matrix parity [skip ci]"
          git push
