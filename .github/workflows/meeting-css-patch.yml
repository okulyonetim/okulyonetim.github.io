name: One-time Meeting CSS Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meeting-css-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch central meeting CSS
        env:
          MEETING_CSS_B64: ""
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('css/design-system.css')
          source = path.read_text()
          marker = '/* TOPLANTI ÇİZELGESİ */'
          if marker not in source:
              raise SystemExit('meeting CSS marker not found')
          tail = base64.b64decode(os.environ['MEETING_CSS_B64']).decode('utf-8')
          path.write_text(source[:source.index(marker)] + tail)
          PY
      - name: Commit central CSS patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/design-system.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: refine mobile meeting table layout'
          git push origin HEAD:main
