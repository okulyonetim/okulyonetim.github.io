name: Temporary Popover Contract Correction
on:
  push:
    branches: [work/popover-settings-accordion-20260831]
    paths: ['.github/workflows/temp-fix-popover-contract.yml']
permissions:
  contents: write
jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrigger canonical consolidation gate
        run: |
          printf '\n# contract-corrected\n' >> .github/workflows/temp-settings-owner-consolidation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/temp-settings-owner-consolidation.yml
          git commit -m 'Retrigger Settings owner consolidation'
          git push
