name: Install report runtime enhancements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject runtime script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/core/report-runtime-enhancements.js?v=1" defer></script>'
          if tag not in s:
              marker='</head>'
              if marker not in s:
                  raise SystemExit('index.html head kapanışı bulunamadı')
              s=s.replace(marker,'  '+tag+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Remove installer workflow
        run: rm -f .github/workflows/install-report-runtime.yml
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/core/report-runtime-enhancements.js .github/workflows/install-report-runtime.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m "Rapor özelleştirme ve görsel paylaşımını etkinleştir"
          git push
