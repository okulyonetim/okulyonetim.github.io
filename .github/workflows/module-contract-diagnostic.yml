name: Module contract diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/module-contract-diagnostic.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture module contract failure
        run: |
          set +e
          node tests/module-bundles-smoke.test.js > tests/.tmp-module-contract-error.txt 2>&1
          code=$?
          echo "exit_code=$code" >> tests/.tmp-module-contract-error.txt
          cat tests/.tmp-module-contract-error.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/module-contract-diagnostic.yml
          git add tests/.tmp-module-contract-error.txt
          git commit -m 'chore: capture module contract diagnostic'
          git push origin HEAD:main
