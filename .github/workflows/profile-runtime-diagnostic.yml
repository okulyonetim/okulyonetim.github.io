name: Profile Contact Root Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-runtime-diagnostic.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify expected parent
        run: test "$(git rev-parse HEAD^)" = 'd98995194d74cb4cd53ec99ada6ffc7b12b0a50a'
      - name: Remove legacy profile contact injection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Beklenen parça bulunamadı: {path}: {old[:140]}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('js/modules/classic-parity.js'); s=p.read_text(encoding='utf-8')
          old="function enhanceProfile(){const page=$('.ka-profile-page');if(!page)return;const u=user(),id=u.bagliOgretmenId||u.ogretmenId||'',t=id?arr('ogretmenler').find(x=>x.id===id):null;if(!t||page.dataset.classicProfile==='1')return;page.dataset.classicProfile='1';const copy=$('.ka-profile-copy',page),name=fullName(t);if(copy){copy.querySelector('h2').textContent=name;copy.querySelector('p').textContent=t.brans||t.unvan||'Öğretmen';copy.querySelectorAll('small').forEach(x=>x.remove());if(t.telefon)copy.insertAdjacentHTML('beforeend',`<small>☎ ${esc(t.telefon)}</small>`);if(t.eposta||t.email)copy.insertAdjacentHTML('beforeend',`<small>✉ ${esc(t.eposta||t.email)}</small>`)}const av=$('.ka-profile-avatar',page);if(av&&!av.querySelector('img'))av.textContent=name.split(/\\s+/).slice(0,2).map(x=>x[0]||'').join('').toLocaleUpperCase('tr')}"
          new="function enhanceProfile(){const page=$('.ka-profile-page');if(!page)return;const u=user(),id=u.bagliOgretmenId||u.ogretmenId||'',t=id?arr('ogretmenler').find(x=>x.id===id):null;if(!t||page.dataset.classicProfile==='1')return;page.dataset.classicProfile='1';const copy=$('.ka-profile-copy',page),name=fullName(t);if(copy){copy.querySelector('h2').textContent=name;copy.querySelector('p').textContent=t.brans||t.unvan||'Öğretmen';copy.querySelectorAll(':scope > small').forEach(x=>x.remove())}const av=$('.ka-profile-avatar',page);if(av&&!av.querySelector('img'))av.textContent=name.split(/\\s+/).slice(0,2).map(x=>x[0]||'').join('').toLocaleUpperCase('tr')}"
          if old not in s: raise SystemExit('Legacy enhanceProfile bloğu bulunamadı')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Defense-in-depth: eski parity kodu bir cihaz cache'inde kalırsa bile raw <small> iletişim satırları görünmesin.
          p=Path('css/design-system.css'); s=p.read_text(encoding='utf-8')
          old='.ka-profile-contact{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}'
          new='.ka-profile-copy>small{display:none!important}.ka-profile-contact{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}'
          if old not in s: raise SystemExit('Profil contact CSS anchor bulunamadı')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          replace_once('index.html','css/design-system.css?v=869','css/design-system.css?v=870')
          p=Path('service-worker.js'); s=p.read_text(encoding='utf-8')
          if "const CACHE_ADI='oy-cache-v869';" not in s: raise SystemExit('SW v869 bulunamadı')
          s=s.replace("const CACHE_ADI='oy-cache-v869';","const CACHE_ADI='oy-cache-v870';",1)
          if "'./css/design-system.css?v=869'" not in s: raise SystemExit('SW CSS v869 bulunamadı')
          s=s.replace("'./css/design-system.css?v=869'","'./css/design-system.css?v=870'",1)
          p.write_text(s,encoding='utf-8')

          for p in Path('tests').glob('*.test.js'):
              s=p.read_text(encoding='utf-8')
              n=s.replace('css/design-system.css?v=869','css/design-system.css?v=870').replace("oy-cache-v869","oy-cache-v870")
              if n!=s: p.write_text(n,encoding='utf-8')

          p=Path('tests/profile-page-redesign.test.js'); s=p.read_text(encoding='utf-8')
          anchor="const sw=fs.readFileSync('service-worker.js','utf8');\n"
          if anchor not in s: raise SystemExit('Profil test sw anchor bulunamadı')
          if "const parity=fs.readFileSync('js/modules/classic-parity.js','utf8');" not in s:
              s=s.replace(anchor,anchor+"const parity=fs.readFileSync('js/modules/classic-parity.js','utf8');\n",1)
          insert="assert(!parity.includes(\"insertAdjacentHTML('beforeend',`<small>☎\")&&!parity.includes(\"insertAdjacentHTML('beforeend',`<small>✉\"),'Classic parity profil kartına ikinci telefon/e-posta satırı eklememeli.');\nassert(parity.includes(\"copy.querySelectorAll(':scope > small').forEach(x=>x.remove())\"),'Classic parity eski raw iletişim satırlarını temizlemeli.');\nassert(design.includes('.ka-profile-copy>small{display:none!important}'),'Merkezi CSS eski cache kaynaklı raw profil iletişim satırlarını da gizlemeli.');\n"
          marker="assert(!block.includes('phone?`<span class=\\\"ka-profile-contact__item')&&!block.includes('email?`<span class=\\\"ka-profile-contact__item'),'Eski inline telefon/e-posta rendererı geri dönmemeli.');\n"
          if marker not in s: raise SystemExit('Profil test marker bulunamadı')
          if 'Classic parity profil kartına ikinci telefon/e-posta satırı eklememeli.' not in s:
              s=s.replace(marker,marker+insert,1)
          p.write_text(s,encoding='utf-8')
          print('ClassicParity duplicate contact kök nedeni düzeltildi; CSS/SW v870 hazır.')
          PY
      - name: Validate syntax and profile contract
        run: |
          set -euo pipefail
          node --check js/modules/classic-parity.js
          node --check js/core/shell-ui.js
          node --check service-worker.js
          node tests/profile-page-redesign.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/runtime-performance-smoke.test.js
          node tests/modules-local-first-boundary.test.js
      - name: Run non-emulator regression suite
        run: |
          set -euo pipefail
          for f in tests/*.test.js; do
            case "$f" in
              *-rules.test.js|*/firestore-regression-extra.test.js) continue ;;
            esac
            node "$f" >/dev/null
          done
      - name: Audit architecture
        run: npm run audit:client
      - name: Commit verified root fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/classic-parity.js css/design-system.css index.html service-worker.js tests
          git commit -m 'fix: stop legacy profile contact duplication'
          git push origin HEAD:main
