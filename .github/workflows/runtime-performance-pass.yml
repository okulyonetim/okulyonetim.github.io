name: Runtime performance pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-performance-pass.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify expected main ancestry
        shell: bash
        run: |
          set -euo pipefail
          expected='536b21e7240789865124714be72b2e2ba0a0d89e'
          actual="$(git rev-parse HEAD^)"
          test "$actual" = "$expected" || { echo "Main advanced: $actual"; exit 1; }
      - name: Apply runtime performance package
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'Expected block not found: {path}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          core=Path('js/core/core.js')
          s=core.read_text(encoding='utf-8')
          old="function setData(type,value){state.data[type]=value;emit('data.'+type,value);return value}"
          new="function setData(type,value){state.data[type]=value;emit('data.'+type,value);return value}\nfunction setDataMany(data){if(!data||typeof data!=='object')return state.data;const changes=Object.entries(data);for(const [type,value] of changes)state.data[type]=value;for(const [type,value] of changes)emit('data.'+type,value);return data}"
          if old not in s: raise SystemExit('AppStore.setData block not found')
          s=s.replace(old,new,1)
          old="data:t=>state.data[t],setData,hydrate:hydrateStore"
          new="data:t=>state.data[t],setData,setDataMany,hydrate:hydrateStore"
          if old not in s: raise SystemExit('AppStore export block not found')
          s=s.replace(old,new,1)

          old="async function get(k,def=null){try{const d=await open();return await new Promise((res,rej)=>{const r=d.transaction(STORE,'readonly').objectStore(STORE).get(k);r.onsuccess=()=>res(r.result===undefined?def:r.result);r.onerror=()=>rej(r.error)})}catch(_){return def}}"
          new="async function get(k,def=null){try{const d=await open();return await new Promise((res,rej)=>{const r=d.transaction(STORE,'readonly').objectStore(STORE).get(k);r.onsuccess=()=>res(r.result===undefined?def:r.result);r.onerror=()=>rej(r.error)})}catch(_){return def}}\nasync function getMany(keys,defaults={}){const list=[...new Set(keys||[])];if(!list.length)return{};try{const d=await open();return await new Promise((res,rej)=>{const out={},t=d.transaction(STORE,'readonly'),store=t.objectStore(STORE);for(const k of list){const r=store.get(k);r.onsuccess=()=>{out[k]=r.result===undefined?defaults[k]:r.result}}t.oncomplete=()=>{for(const k of list)if(!Object.prototype.hasOwnProperty.call(out,k))out[k]=defaults[k];res(out)};t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('indexeddb-abort'))})}catch(_){return Object.fromEntries(list.map(k=>[k,defaults[k]]))}}"
          if old not in s: raise SystemExit('IndexedDB get block not found')
          s=s.replace(old,new,1)

          old="async function hydrateLocal(u,types,defaults={}){const out={};for(const type of types||[])out[type]=await cached(u,type,Object.prototype.hasOwnProperty.call(defaults,type)?defaults[type]:[]);return out}"
          new="async function hydrateLocal(u,types,defaults={}){const names=[...(types||[])],keys=names.map(type=>key(u,`cache:${type}`)),defs={};names.forEach((type,i)=>{defs[keys[i]]=Object.prototype.hasOwnProperty.call(defaults,type)?defaults[type]:[]});const values=await getMany(keys,defs),out={};names.forEach((type,i)=>{out[type]=values[keys[i]]});return out}"
          if old not in s: raise SystemExit('hydrateLocal block not found')
          s=s.replace(old,new,1)
          old="window.KorukLocalFirst={open,get,set,setMany,del,keys,uid,key,cached,cache,cacheMany,queue,pending,removeQueue,tombstone,tombstones,meta,profile,hydrateLocal,userSnapshot,clearUser,DB,STORE};"
          new="window.KorukLocalFirst={open,get,getMany,set,setMany,del,keys,uid,key,cached,cache,cacheMany,queue,pending,removeQueue,tombstone,tombstones,meta,profile,hydrateLocal,userSnapshot,clearUser,DB,STORE};"
          if old not in s: raise SystemExit('KorukLocalFirst export block not found')
          s=s.replace(old,new,1)

          pattern=r"async function pull\(types\)\{if\(!syncReady\(\)\|\|!navigator\.onLine\)return\{updated:0,skipped:true\};const names=types\?\.length\?types:Array\.from\(registered\.keys\(\)\);if\(!names\.length\)return\{updated:0\};syncing=true;AppStore\.set\('ui\.syncing',true\);let updated=0;try\{for\(const name of names\)\{const def=registered\.get\(name\);if\(!def\)continue;try\{const rows=await fetchCollection\(def\);await cache\(uid\(\),name,rows\);AppStore\.setData\(name,rows\);updated\+\+\}catch\(e\)\{console\.warn\('\[SyncEngine\]',name,e\?\.message\|\|e\)\}\}const now=Date\.now\(\);await meta\(uid\(\),'lastSyncAt',now\);AppStore\.set\('ui\.lastSyncAt',now\);return\{updated\}\}finally\{syncing=false;AppStore\.set\('ui\.syncing',false\)\}\}"
          repl="async function pull(types){if(!syncReady()||!navigator.onLine)return{updated:0,skipped:true};const names=types?.length?types:Array.from(registered.keys());if(!names.length)return{updated:0};syncing=true;AppStore.set('ui.syncing',true);let updated=0;try{const u=uid(),data={};for(const name of names){const def=registered.get(name);if(!def)continue;try{const rows=await fetchCollection(def);data[name]=rows;updated++}catch(e){console.warn('[SyncEngine]',name,e?.message||e)}}if(updated){await cacheMany(u,data);AppStore.setDataMany(data)}const now=Date.now();await meta(u,'lastSyncAt',now);AppStore.set('ui.lastSyncAt',now);return{updated}}finally{syncing=false;AppStore.set('ui.syncing',false)}}"
          s2,n=re.subn(pattern,repl,s,count=1)
          if n!=1: raise SystemExit(f'SyncEngine.pull block match count: {n}')
          core.write_text(s2,encoding='utf-8')

          design=Path('css/design-system.css')
          s=design.read_text(encoding='utf-8')
          pattern=r"\.ka-home \.kh-news-viewport\{[^}]*\}"
          repl=".ka-home .kh-news-viewport{overflow:hidden;white-space:nowrap;min-width:0;padding-inline:12px;contain:layout paint;transform:translateZ(0);backface-visibility:hidden}"
          s2,n=re.subn(pattern,repl,s,count=1)
          if n!=1: raise SystemExit(f'kh-news viewport match count: {n}')
          design.write_text(s2,encoding='utf-8')

          sw=Path('service-worker.js')
          s=sw.read_text(encoding='utf-8')
          s=s.replace("const CACHE_ADI='oy-cache-v867';","const CACHE_ADI='oy-cache-v868';",1)
          s=s.replace("'./css/design-system.css?v=867'","'./css/design-system.css?v=868'",1)
          old="""async function kodNetworkFirst(event){
            try{
              const response=await fetch(event.request,{cache:'no-store'});
              if(response&&response.status===200&&response.type!=='opaque'){
                const copy=response.clone();
                event.waitUntil(caches.open(CACHE_ADI).then(cache=>cache.put(event.request,copy)).catch(()=>{}));
              }
              return response;
            }catch(_){
              return await caches.match(event.request)||new Response('Kaynak çevrimdışı kullanılamıyor.',{status:503,headers:{'Content-Type':'text/plain; charset=utf-8'}});
            }
          }"""
          new="""async function kodCacheFirst(event){
            const cached=await caches.match(event.request);
            const yenile=fetch(event.request,{cache:'no-store'}).then(async response=>{
              if(response&&response.status===200&&response.type!=='opaque'){
                const copy=response.clone();
                await caches.open(CACHE_ADI).then(cache=>cache.put(event.request,copy)).catch(()=>{});
              }
              return response;
            }).catch(()=>null);
            if(cached){event.waitUntil(yenile);return cached;}
            return(await yenile)||new Response('Kaynak çevrimdışı kullanılamıyor.',{status:503,headers:{'Content-Type':'text/plain; charset=utf-8'}});
          }"""
          if old not in s: raise SystemExit('kodNetworkFirst block not found')
          s=s.replace(old,new,1)
          old="if(kodKaynakMi(event.request)){event.respondWith(kodNetworkFirst(event));return;}"
          new="if(kodKaynakMi(event.request)){event.respondWith(kodCacheFirst(event));return;}"
          if old not in s: raise SystemExit('code fetch route not found')
          s=s.replace(old,new,1)
          s=s.replace('statik kaynakları çevrimiçiyken güncel ağ sürümünden, çevrimdışıyken cache\'den sunmak','uygulama kodunu cache\'den anında sunup arka planda yenilemek',1)
          sw.write_text(s,encoding='utf-8')

          replace_once('index.html','css/design-system.css?v=867','css/design-system.css?v=868')

          p=Path('tests/service-worker-precache-smoke.test.js')
          s=p.read_text(encoding='utf-8')
          old="""assert(sw.includes("fetch(event.request,{cache:'no-store'})"), 'JS/CSS çevrimiçiyken cache yerine güncel ağ sürümünden alınmalı.');
          assert(sw.includes('kodNetworkFirst(event)'), 'JS/CSS fetch akışı network-first olmalı.');"""
          new="""assert(sw.includes('async function kodCacheFirst(event)'), 'JS/CSS için anlık cache-first + arka plan yenileme stratejisi bulunmalı.');
          assert(sw.includes("const yenile=fetch(event.request,{cache:'no-store'})"), 'Cache-first kod stratejisi arka planda HTTP cache dışından güncellenmeli.');
          assert(sw.includes('if(cached){event.waitUntil(yenile);return cached;}'), 'Önbellekteki JS/CSS ağ yanıtını beklemeden sunulmalı.');
          assert(sw.includes('kodCacheFirst(event)'), 'JS/CSS fetch akışı cache-first olmalı.');
          assert(!sw.includes('kodNetworkFirst(event)'), 'Eski ağ bekleten JS/CSS network-first yolu geri dönmemeli.');"""
          if old not in s: raise SystemExit('service worker test strategy block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          for p in Path('tests').glob('*.js'):
              s=p.read_text(encoding='utf-8')
              ns=s.replace('css/design-system.css?v=867','css/design-system.css?v=868').replace('oy-cache-v867','oy-cache-v868')
              if ns!=s:p.write_text(ns,encoding='utf-8')

          runtime=Path('tests/runtime-performance-smoke.test.js')
          runtime.write_text("""const fs=require('fs');
          const assert=require('assert');
          const core=fs.readFileSync('js/core/core.js','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');
          const css=fs.readFileSync('css/design-system.css','utf8');
          const dashboard=fs.readFileSync('js/modules/dashboard.js','utf8');
          const index=fs.readFileSync('index.html','utf8');

          new Function(core);
          assert(core.includes('async function getMany(keys,defaults={})'),'IndexedDB toplu okuma kapısı bulunmalı.');
          assert(core.includes('const values=await getMany(keys,defs)'),'İlk local hydrate tek toplu IndexedDB okumasını kullanmalı.');
          assert(!core.includes('for(const type of types||[])out[type]=await cached('),'İlk açılışta veri tipleri ayrı ayrı IndexedDB transaction beklememeli.');
          assert(core.includes('function setDataMany(data)'),'AppStore toplu veri güncellemesini desteklemeli.');
          assert(core.includes('await cacheMany(u,data);AppStore.setDataMany(data)'),'Arka plan pull sonuçları tek cache transactionı ve tek render burstü olarak uygulanmalı.');
          assert(!core.includes('await cache(uid(),name,rows);AppStore.setData(name,rows)'),'Sync pull her koleksiyonda ayrı cache/render tetiklememeli.');

          assert(sw.includes("const CACHE_ADI='oy-cache-v868'"),'Yeni runtime cache sürümü yayınlanmalı.');
          assert(sw.includes('async function kodCacheFirst(event)'),'JS/CSS cache-first stratejisi bulunmalı.');
          assert(sw.includes('if(cached){event.waitUntil(yenile);return cached;}'),'Önbellekteki kod ağ beklemeden dönmeli.');
          assert(!sw.includes('kodNetworkFirst(event)'),'Eski network-first kod bekleme yolu kaldırılmalı.');
          assert(index.includes('css/design-system.css?v=868'),'Merkezi CSS yeni cache anahtarıyla yüklenmeli.');

          const a=css.indexOf('.ka-home .kh-news-viewport{'),b=css.indexOf('}',a);
          assert(a>=0&&b>a,'Kayan haber viewport stili bulunmalı.');
          const viewport=css.slice(a,b+1);
          assert(!viewport.includes('mask-image')&&!viewport.includes('-webkit-mask-image'),'Kayan haber katmanında pahalı mask compositing kullanılmamalı.');
          assert(viewport.includes('contain:layout paint')&&viewport.includes('translateZ(0)'),'Kayan haber viewport compositor sınırında tutulmalı.');
          assert(css.includes('.ka-home .kh-news-track')&&css.includes('will-change:transform')&&css.includes('@keyframes khTicker'),'Ticker GPU transform animasyonunu korumalı.');
          assert(dashboard.includes('freshNews.replaceWith(oldNews)'),'Dashboard eş içerikte kayan haber DOMunu yeniden yaratmamalı.');
          assert(dashboard.includes('requestAnimationFrame(()=>render())'),'Dashboard veri güncellemelerini frame bazında birleştirmeli.');
          console.log('Runtime performans: toplu IndexedDB hydrate/sync + cache-first lazy kod + akıcı ticker sözleşmesi başarılı.');
          """.replace(/^          /gm,''),encoding='utf-8')
          PY
      - name: Validate focused performance and architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check js/core/core.js
          node --check js/modules/dashboard.js
          node tests/runtime-performance-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/trial-counter-scroll-stability.test.js
          npm run build:client
      - name: Commit verified performance package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/runtime-performance-pass.yml
          git add js/core/core.js css/design-system.css service-worker.js index.html tests
          git commit -m 'perf: smooth runtime navigation and news ticker'
          git push origin HEAD:main
