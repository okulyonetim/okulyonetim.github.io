name: Trigger dashboard motion stability

on:
  push:
    branches:
      - work/dashboard-motion-stability-20260901

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute staged refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source=Path('.github/workflows/apply-dashboard-motion-stability.yml').read_text(encoding='utf-8')
          match=re.search(r'\n        run: \|\n(.*)\Z',source,re.S)
          if not match:
              raise SystemExit('staged run block not found')
          lines=match.group(1).splitlines()
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          replacement="""new_section,new_refresh=new_card.split('\\nfunction refreshTrialTimers',1)
new_refresh='function refreshTrialTimers'+new_refresh
s=sub1(s,r"function trialCounterSection\\(\\).*?(?=\\nfunction refreshTrialTimers)",new_section,'trial-home-card')
s=sub1(s,r"function refreshTrialTimers\\(root=document\\).*?(?=\\nfunction )",new_refresh,'trial-home-refresh')"""
          script,n=re.subn(r'^s=sub1\(s,r"function trialCounterSection.*?\x27trial-home-bars\x27\)\s*$',lambda _:replacement,script,count=1,flags=re.M)
          if n!=1:
              raise SystemExit(f'trigger patch: expected 1 trial-home-bars line, got {n}')
          script=script.replace('rm -f .github/workflows/apply-dashboard-motion-stability.yml','rm -f .github/workflows/apply-dashboard-motion-stability.yml .github/workflows/apply-dashboard-motion-stability-v2.yml')
          Path('/tmp/apply-dashboard.sh').write_text(script,encoding='utf-8')
          PY
          bash /tmp/apply-dashboard.sh
