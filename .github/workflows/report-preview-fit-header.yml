name: Report preview fit header patch
on:
  push:
    branches: [fix/report-preview-fit-header]
    paths:
      - '.github/workflows/report-preview-fit-header.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-preview-fit-header
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply report preview fit/header fixes
        run: python .github/scripts/report_preview_fit_header.py
      - name: Validate focused changes
        run: |
          node --check js/modules/report-engine.js
          node tests/report-preview-print-layout-regression.test.js
          node tests/report-engine-a4-smoke.test.js
          node tests/report-native-print-routing-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/report-engine.js css/design-system.css index.html service-worker.js tests/report-preview-print-layout-regression.test.js
          git commit -m 'fix: fit report preview and polish mobile header' || exit 0
          git push origin HEAD:fix/report-preview-fit-header
