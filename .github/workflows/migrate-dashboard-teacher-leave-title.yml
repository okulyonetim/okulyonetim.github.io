name: migrate-dashboard-teacher-leave-title
on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-dashboard-teacher-leave-title.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply teacher leave card alignment
        run: python scripts/migrate-dashboard-teacher-leave-title.py
      - name: Syntax checks
        run: node --check js/modules/dashboard.js
      - name: Dashboard checks
        run: node tests/dashboard-card-routes-smoke.test.js
      - name: Architecture checks
        run: node scripts/check-client-architecture.mjs
      - name: Cleanup temporary migration files
        run: rm -f scripts/migrate-dashboard-teacher-leave-title.py .github/workflows/migrate-dashboard-teacher-leave-title.yml
      - name: Commit production migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(dashboard): align teacher leave card with canonical model'
          git push
