name: Student Tool Routing Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-student-tool-routing-patch.mjs'
      - '.github/workflows/student-tool-routing-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded student tool routing migration
        run: node scripts/apply-student-tool-routing-patch.mjs
      - name: Verify canonical student tool routing
        run: node tests/student-tool-routing-smoke.test.js
      - name: Verify teacher list contracts
        run: |
          node tests/teacher-list-core-contract.test.js
          node tests/teacher-list-local-first-service.test.js
      - name: Verify client architecture
        run: |
          node scripts/build-client-bundles.mjs
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit production migration
        run: |
          if git diff --quiet -- js/core/shell-ui.js js/modules/teacher-list.js; then
            echo 'No production diff generated.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/shell-ui.js js/modules/teacher-list.js
          git commit -m 'refactor(tools): route student tools to canonical UI engines'
          git push
