name: Temporary Annual Plan Patch

on:
  push:
    branches:
      - agent/yillik-plan-preview-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/yillik-plan-preview-fix
          fetch-depth: 0

      - name: Yıllık plan görünürlük düzeltmesini uygula
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('js/yillik-plan.js')
          s = p.read_text(encoding='utf-8')
          old = """  const mevcutGenislik = kaydirma.clientWidth - 40;\n  _yplTabanZoom = Math.min(1, mevcutGenislik / YPL_A4_YATAY_PX);\n"""
          new = """  // Overlay ilk DOM'a eklendiği anda bazı Android WebView sürümlerinde\n  // clientWidth kısa süreliğine 0 dönebiliyor. Eski hesap 0-40 ile NEGATİF\n  // zoom üretiyor ve tablo aslında oluşturulsa bile tamamen görünmez oluyordu.\n  // Kapsayıcı henüz ölçülemiyorsa viewport genişliğine düş; zoom hiçbir zaman\n  // sıfır/negatif olmasın.\n  const kapsayiciGenislik = kaydirma.clientWidth || document.documentElement.clientWidth || window.innerWidth || 360;\n  const mevcutGenislik = Math.max(240, kapsayiciGenislik - 40);\n  _yplTabanZoom = Math.max(0.2, Math.min(1, mevcutGenislik / YPL_A4_YATAY_PX));\n"""
          if old not in s:
              raise SystemExit('Beklenen yıllık plan zoom kodu bulunamadı; otomatik patch durduruldu.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/yillik-plan-preview-smoke.test.js')
          test.write_text("""const fs = require('fs');\nconst assert = require('assert');\n\nconst src = fs.readFileSync('js/yillik-plan.js', 'utf8');\n\nassert(src.includes('const kapsayiciGenislik = kaydirma.clientWidth || document.documentElement.clientWidth || window.innerWidth || 360;'), 'Sıfır genişlikte viewport fallback bulunmalı.');\nassert(src.includes('Math.max(240, kapsayiciGenislik - 40)'), 'Önizleme genişliği pozitif alt sınıra sahip olmalı.');\nassert(src.includes('Math.max(0.2, Math.min(1, mevcutGenislik / YPL_A4_YATAY_PX))'), 'Yıllık plan zoom değeri asla sıfır/negatif olmamalı.');\nassert(!src.includes('const mevcutGenislik = kaydirma.clientWidth - 40;'), 'Negatif zoom üretebilen eski hesap geri gelmemeli.');\n\nconsole.log('Yıllık plan önizleme smoke testleri başarılı.');\n""", encoding='utf-8')

          wf = Path('.github/workflows/frontend-smoke.yml')
          w = wf.read_text(encoding='utf-8')
          if "      - 'js/yillik-plan.js'\n" not in w:
              w = w.replace("      - 'js/dokuman-okuyucu.js'\n", "      - 'js/dokuman-okuyucu.js'\n      - 'js/yillik-plan.js'\n", 1)
          if "      - 'tests/yillik-plan-preview-smoke.test.js'\n" not in w:
              w = w.replace("      - 'tests/document-viewer-smoke.test.js'\n", "      - 'tests/document-viewer-smoke.test.js'\n      - 'tests/yillik-plan-preview-smoke.test.js'\n", 1)
          if 'Yıllık plan önizleme regresyon testi' not in w:
              w += "\n      - name: Yıllık plan önizleme regresyon testi\n        run: node tests/yillik-plan-preview-smoke.test.js\n"
          wf.write_text(w, encoding='utf-8')
          PY

          git rm .github/workflows/temporary-yillik-plan-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/yillik-plan.js tests/yillik-plan-preview-smoke.test.js .github/workflows/frontend-smoke.yml
          git commit -m "Yıllık plan önizlemesinde negatif zoomu engelle [skip ci]"
          git push origin HEAD:agent/yillik-plan-preview-fix
