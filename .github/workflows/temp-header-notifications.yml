name: Temporary Header Notifications Gate

on:
  push:
    branches: [work/header-notifications-20260831]
    paths:
      - '.github/temp-header-notifications.py'
      - '.github/workflows/temp-header-notifications.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply canonical patch
        run: python .github/temp-header-notifications.py
      - name: Verify targeted header contracts
        run: |
          set -euo pipefail
          node --check js/core/shell-ui.js
          node --check js/modules/school-live-status.js
          node tests/web-mobile-engine-separation.test.js
          node tests/dashboard-card-routes-smoke.test.js
          git diff --check
      - name: Audit client architecture
        run: node scripts/check-client-architecture.mjs
      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/shell-ui.js js/modules/school-live-status.js css/design-system.css tests/web-mobile-engine-separation.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Restore header notification center and profile popover'
          git push
