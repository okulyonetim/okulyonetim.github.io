name: One-shot Meeting Schedule Integration
"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-meeting-schedule.yml
      - tests/meeting-schedule-v1-smoke.test.js
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply integration
        run: python3 .github/scripts/apply-meeting-schedule.py
      - name: Validate
        run: |
          node --check js/modules/meeting-schedule.js
          node --check js/app-loader.js
          node --check js/core/shell-ui.js
          node --check js/firebase-init.js
          node tests/meeting-schedule-v1-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
      - name: Commit integration
        run: |
          rm .github/workflows/one-shot-meeting-schedule.yml
          rm .github/scripts/apply-meeting-schedule.py
          git config user.name "sedonet23"
          git config user.email "sedonet23@gmail.com"
          git add js/modules/meeting-schedule.js js/firebase-init.js js/app-loader.js js/core/shell-ui.js css/design-system.css service-worker.js firestore.rules .github/workflows/one-shot-meeting-schedule.yml .github/scripts/apply-meeting-schedule.py
          git commit -m "feat: integrate meeting schedule under personnel menu"
          git push origin main
