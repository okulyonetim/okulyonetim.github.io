name: Fix login touch
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-login-touch.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove login pointer lock
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('css/design-system.css')
          s=p.read_text(encoding='utf-8')
          old='/* AUTH RESTORE — mevcut Firebase oturumu çözülmeden login yüzeyi boyanmaz. */\nhtml:not(.ka-auth-resolved) #girisEkrani{visibility:hidden!important;pointer-events:none!important}\n'
          new='/* AUTH: giriş yüzeyi ağ/Firebase durumundan bağımsız olarak her zaman etkileşimlidir. */\n#girisEkrani{pointer-events:auto!important;touch-action:manipulation}\n#girisEkrani input,#girisEkrani button{pointer-events:auto!important;touch-action:manipulation}\n'
          if old not in s:
              raise SystemExit('login pointer lock target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          sw=Path('service-worker.js')
          t=sw.read_text(encoding='utf-8')
          if "const CACHE_ADI='oy-cache-v789';" not in t:
              raise SystemExit('cache version mismatch')
          sw.write_text(t.replace("const CACHE_ADI='oy-cache-v789';","const CACHE_ADI='oy-cache-v790';",1),encoding='utf-8')
          PY
      - name: Cleanup and commit
        shell: bash
        run: |
          rm .github/workflows/fix-login-touch.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add css/design-system.css service-worker.js .github/workflows/fix-login-touch.yml
          git commit -m "remove login pointer-event startup lock"
          git push
