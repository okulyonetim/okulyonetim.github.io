name: Firebase Rules Tests

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'tests/firestore-rules.test.js'
      - 'tests/firestore-regression-extra.test.js'
      - 'tests/duyuru-role-rules.test.js'
      - 'tests/haberler-role-rules.test.js'
      - 'tests/ders-saatleri-role-rules.test.js'
      - 'tests/ders-brans-listesi-role-rules.test.js'
      - 'tests/admin-settings-rules.test.js'
      - 'tests/ozel-menu-role-rules.test.js'
      - 'tests/anket-rules.test.js'
      - 'tests/storage-rules.test.js'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Test bağımlılıklarını kur
        run: npm install --no-save firebase @firebase/rules-unit-testing firebase-tools

      - name: Firestore ve Storage kurallarını emülatörde test et
        run: npx firebase emulators:exec --only firestore,storage --project demo-okul-rules "node tests/firestore-rules.test.js && node tests/firestore-regression-extra.test.js && node tests/duyuru-role-rules.test.js && node tests/haberler-role-rules.test.js && node tests/ders-saatleri-role-rules.test.js && node tests/ders-brans-listesi-role-rules.test.js && node tests/admin-settings-rules.test.js && node tests/ozel-menu-role-rules.test.js && node tests/anket-rules.test.js && node tests/storage-rules.test.js"
