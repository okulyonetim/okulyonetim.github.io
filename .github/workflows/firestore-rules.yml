name: Firestore Rules Tests

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/firestore-rules.test.js'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Test bağımlılıklarını kur
        run: npm install --no-save firebase @firebase/rules-unit-testing firebase-tools

      - name: Firestore kurallarını emülatörde test et
        run: npx firebase emulators:exec --only firestore --project demo-okul-rules "node tests/firestore-rules.test.js"
