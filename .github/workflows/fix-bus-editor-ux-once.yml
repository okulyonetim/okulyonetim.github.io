name: Fix bus editor UX once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-bus-editor-ux-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply bus editor UX fix
        run: |
          python .github/scripts/fix-bus-editor-ux.py
          sed -i 's/js\/app-loader.js?v=890/js\/app-loader.js?v=892/g' tests/transport-seating-classic-parity.test.js
          sed -i 's/transport.js?v=890/transport.js?v=892/g' tests/transport-seating-classic-parity.test.js
          sed -i 's/window.ServisOturmaService.planElementsKaydet(editor.servisId,editor.sablon,editor.elements,false)/window.ServisOturmaService.planElementsKaydet(servisId,sablon,elements,false)/g' tests/transport-seating-visual-editor.test.js
          sed -i "s#define('transport',\['js/modules/report-engine.js','js/modules/transport.js'\])#define('transport',['js/modules/report-engine.js','js/modules/transport.js?v=892'])#g" tests/transport-separate-pages.test.js
      - name: Check transport syntax
        run: node --check js/modules/transport.js
      - name: Test bus editor actions
        run: node tests/transport-seating-editor-actions.test.js
      - name: Test bus shell visibility
        run: node tests/transport-bus-shell-visible.test.js
      - name: Test classic mobile parity
        run: node tests/transport-seating-classic-parity.test.js
      - name: Test visual seating editor
        run: node tests/transport-seating-visual-editor.test.js
      - name: Test transport mobile layout
        run: node tests/transport-mobile-layout-v3.test.js
      - name: Test transport separate pages
        run: node tests/transport-separate-pages.test.js
      - name: Test local-first boundary
        run: node tests/modules-local-first-boundary.test.js
      - name: Test service worker
        run: node tests/service-worker-precache-smoke.test.js
      - name: Check client architecture
        run: node scripts/check-client-architecture.mjs
      - name: Commit verified fix and remove one-time files
        run: |
          rm -f .github/workflows/fix-bus-editor-ux-once.yml .github/scripts/fix-bus-editor-ux.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: streamline bus seating editor controls'
          git push origin HEAD:main
