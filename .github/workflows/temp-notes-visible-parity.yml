name: Temp Notes Visible Parity
on:
  push:
    branches: [work/notes-visible-parity-20260831]
    paths:
      - '.github/staging/notes-parity-*.b64'
      - '.github/workflows/temp-notes-visible-parity.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/notes-visible-parity-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 8cd6f00d1b2cea76eac211b6cbcd6f7ba8de1f90)" = "8cd6f00d1b2cea76eac211b6cbcd6f7ba8de1f90"
          cat .github/staging/notes-parity-00.b64 .github/staging/notes-parity-01.b64 > /tmp/notes.b64
          echo 'b0938fa799df2314f3674cd0ffc9ba6a9aee2a8df191211f81c0c1ea58bfb032  /tmp/notes.b64' | sha256sum -c -
          base64 -d /tmp/notes.b64 > /tmp/notes.patch.xz
          echo 'fdbc64f17d3c2529a9a4a29b8c446992eececabed4a04beaa14b0c5e491e53d3  /tmp/notes.patch.xz' | sha256sum -c -
          xz -t /tmp/notes.patch.xz
          xz -dc /tmp/notes.patch.xz > /tmp/notes.patch
          echo '670513551cfa7626120f8c9a18fb223505551bd264ea5833c9469b80c3f39e7b  /tmp/notes.patch' | sha256sum -c -
          git apply --check /tmp/notes.patch
          git apply /tmp/notes.patch
      - name: Validate notes package
        shell: bash
        run: |
          set -euo pipefail
          node --check js/modules/communication.js
          node --check js/core/shell-ui.js
          node tests/quick-note-launcher.test.js
          node tests/communication-separate-pages.test.js
          node tests/communication-admin-actions.test.js
          node tests/communication-local-first-contract.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/lazy-firebase-storage-smoke.test.js
          node tests/module-bundles-smoke.test.js
          node tests/root-js-inventory-smoke.test.js
          node tests/retired-legacy-roots-smoke.test.js
          node scripts/build-client-bundles.mjs
          node scripts/check-client-architecture.mjs
      - name: Commit validated canonical changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/communication.js css/design-system.css tests/quick-note-launcher.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Port reference notes visible workspace'
          git push origin HEAD:work/notes-visible-parity-20260831
