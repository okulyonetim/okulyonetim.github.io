name: App layout studio v878

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-layout-studio-v878.yml'

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify baseline
        run: test "$(git rev-parse HEAD^)" = '45383ac00c0c4204a14ceeb7529798f12306ede8'
      - name: Apply app layout studio redesign
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def between(text,start,end,replacement,path):
              a=text.find(start)
              if a<0: raise SystemExit(f'{path}: start not found: {start}')
              b=text.find(end,a)
              if b<0: raise SystemExit(f'{path}: end not found: {end}')
              return text[:a]+replacement+text[b:]

          p=Path('js/modules/settings.js')
          s=p.read_text(encoding='utf-8')
          old="let active='home',mounted=false,unsubs=[],settingsAccordion='',statisticsRefreshing=false;"
          new="let active='home',mounted=false,unsubs=[],settingsAccordion='',statisticsRefreshing=false,layoutSection='menus',layoutMenu='people';"
          if old not in s: raise SystemExit('settings state baseline not found')
          s=s.replace(old,new,1)

          menu_block=r'''function menuTargetGroups(){return(window.AppConfig?.CLASSIC_MENU_GROUPS||[]).filter(g=>g.hidden!==true)}
function menuTargetOptions(selected){return menuTargetGroups().map(g=>{const s=menuGroupSetting(g);return `<option value="${esc(g.key)}" ${String(selected||'')===String(g.key)?'selected':''}>${esc(s.icon||g.icon||'')} ${esc(s.label||g.label)}</option>`}).join('')}
function menuTargetRecords(targetKey){const out=[];menuTargetGroups().forEach(source=>{const all=[...(source.items||[]),...(source.subItems||[])];all.forEach((item,index)=>{const setting=menuItemSetting(source,item),target=String(setting.targetGroup||source.key);if(target===targetKey)out.push({source,item,index,setting})})});return out.sort((a,b)=>{const ao=Number(a.setting.order),bo=Number(b.setting.order);return(Number.isFinite(ao)?ao:(a.index+1)*10)-(Number.isFinite(bo)?bo:(b.index+1)*10)})}
function menuEditorItem(record,index){const {source:g,item,setting:s}=record,fallback=menuColorValue(menuGroupSetting(g)?.color,MENU_COLOR_DEFAULTS[g.key]||'#17684f'),order=Number(s.order),target=String(s.targetGroup||g.key),label=s.label||item[0],icon=s.icon||item[1]||'';return `<article class="ka-layout-subitem" data-menu-item-row="${esc(menuItemKey(g,item))}" data-menu-item-source="${esc(g.key)}"><div class="ka-layout-subitem__main"><span class="ka-layout-subitem__icon">${esc(icon||'•')}</span><div class="ka-grow"><strong>${esc(label)}</strong><small class="ka-muted">${esc(item[2]||'')}${item[3]?` · ${esc(item[3])}`:''}</small></div><label class="ka-layout-visible"><input type="checkbox" data-menu-item-visible ${s.visible!==false?'checked':''}><span>Göster</span></label></div><div class="ka-layout-subitem__fields"><label class="ka-field"><span class="ka-field__label">Ad</span><input data-menu-item-label value="${esc(label)}"></label><label class="ka-field ka-layout-icon-field"><span class="ka-field__label">İkon</span><input data-menu-item-icon value="${esc(icon)}" maxlength="8"></label><label class="ka-field ka-layout-move-field"><span class="ka-field__label">Başka menüye taşı</span><select data-menu-item-target>${menuTargetOptions(target)}</select></label><label class="ka-field ka-settings-color-field"><span class="ka-field__label">Renk</span><input type="color" data-menu-item-color value="${esc(menuColorValue(s.color,fallback))}"></label><label class="ka-field ka-layout-order-field"><span class="ka-field__label">Sıra</span><input type="number" min="1" step="1" data-menu-item-order value="${Number.isFinite(order)?order:(index+1)*10}"></label></div></article>`}
function menuEditorGroup(g,index){const s=menuGroupSetting(g),records=menuTargetRecords(g.key),order=Number(s.order),color=menuColorValue(s.color,MENU_COLOR_DEFAULTS[g.key]||'#17684f'),selected=g.key===layoutMenu;return `<article class="ka-layout-menu-panel" data-menu-group-row="${esc(g.key)}" data-layout-panel="${esc(g.key)}" ${selected?'':'hidden'}><section class="ka-card ka-layout-menu-config"><div class="ka-card__body"><div class="ka-layout-menu-config__head"><div class="ka-row"><span class="ka-settings-menu-swatch" style="--ka-settings-menu-color:${color}"></span><div><strong>${esc(s.icon||g.icon||'')} ${esc(s.label||g.label)}</strong><small class="ka-muted"><span data-layout-panel-count>${records.length}</span> alt menü</small></div></div><label class="ka-layout-visible"><input type="checkbox" data-menu-group-visible ${s.visible!==false?'checked':''}><span>Menüyü göster</span></label></div><div class="ka-layout-group-fields"><label class="ka-field"><span class="ka-field__label">Menü adı</span><input data-menu-group-label value="${esc(s.label||g.label)}"></label><label class="ka-field ka-layout-icon-field"><span class="ka-field__label">İkon</span><input data-menu-group-icon value="${esc(s.icon||g.icon||'')}" maxlength="8"></label><label class="ka-field ka-settings-color-field"><span class="ka-field__label">Kart rengi</span><input type="color" data-menu-group-color value="${esc(color)}"></label><label class="ka-field ka-layout-order-field"><span class="ka-field__label">Sıra</span><input type="number" min="1" step="1" data-menu-group-order value="${Number.isFinite(order)?order:(index+1)*10}"></label></div></div></section><div class="ka-layout-items-head"><div><h4>Alt menüler</h4><p class="ka-muted">Bir öğenin “Başka menüye taşı” alanını değiştirince kart anında hedef menüye geçer. Kaydet dediğinizde kalıcı olur.</p></div><span class="ka-badge"><span data-layout-list-count>${records.length}</span> öğe</span></div><div class="ka-layout-item-list" data-layout-item-list>${records.map(menuEditorItem).join('')||'<div class="ka-empty ka-layout-empty">Bu menüde alt öğe yok.</div>'}</div></article>`}
function menuLayoutEditor(){const groups=menuTargetGroups();if(!groups.length)return'<div class="ka-empty">Ana menü kataloğu hazırlanıyor.</div>';if(!groups.some(g=>g.key===layoutMenu))layoutMenu=groups[0].key;return `<section class="ka-layout-studio" data-layout-studio><nav class="ka-layout-picker" aria-label="Düzenlenecek ana menü">${groups.map(g=>{const s=menuGroupSetting(g),on=g.key===layoutMenu,count=menuTargetRecords(g.key).length;return `<button type="button" class="ka-layout-picker__item ${on?'is-active':''}" data-layout-menu-select="${esc(g.key)}" aria-pressed="${on?'true':'false'}"><span>${esc(s.icon||g.icon||'')}</span><strong>${esc(s.label||g.label)}</strong><small data-layout-picker-count>${count}</small></button>`}).join('')}</nav><div class="ka-layout-panels">${groups.map(menuEditorGroup).join('')}</div></section>`}
'''
          s=between(s,'function menuTargetGroups()','function moduleEditorRow(',menu_block,'settings.js')

          app_block=r'''function appLayout(){const cfg=window.AppConfig?.get?.();if(!cfg)return'<div class="ka-empty">Uygulama konfigürasyonu hazırlanıyor.</div>';const opts=cfg.modules.map(m=>`<option value="${esc(m.key)}" ${m.key===cfg.defaultModule?'selected':''}>${esc(m.label)}</option>`).join(''),sections=[['menus','▦','Menüler'],['modules','◫','Modüller'],['dashboard','⌂','Ana Sayfa']];return `<section class="ka-layout-page ka-stack"><article class="ka-card ka-layout-intro"><div class="ka-card__body"><div class="ka-layout-intro__copy"><span class="ka-badge">Uygulama Düzeni</span><h3>Menü ve ekran düzeni</h3><p class="ka-muted">Aynı anda yalnız seçtiğiniz bölüm görünür. Sayfa konumu değişmeden menüleri, alt menüleri ve ana sayfayı düzenleyebilirsiniz.</p></div><label class="ka-field ka-layout-default"><span class="ka-field__label">Varsayılan açılış</span><select id="appDefaultModule">${opts}</select></label></div></article><nav class="ka-layout-section-tabs" aria-label="Uygulama düzeni bölümleri">${sections.map(x=>`<button type="button" class="ka-layout-section-tab ${layoutSection===x[0]?'is-active':''}" data-layout-section-select="${x[0]}" aria-pressed="${layoutSection===x[0]?'true':'false'}"><span>${x[1]}</span><strong>${x[2]}</strong></button>`).join('')}</nav><div class="ka-layout-status" data-layout-status><span>✓</span><span>Bir değişiklik yaptığınızda burada belirtilir.</span></div><section class="ka-layout-section" data-layout-section-panel="menus" ${layoutSection==='menus'?'':'hidden'}><div class="ka-layout-section-head"><div><h3>Ana menüler</h3><p class="ka-muted">Kartı seçin; yalnız o menünün ayarları ve içindeki öğeler gösterilir.</p></div></div><div id="appClassicMenuEditor">${menuLayoutEditor()}</div></section><section class="ka-layout-section" data-layout-section-panel="modules" ${layoutSection==='modules'?'':'hidden'}><div class="ka-layout-section-head"><div><h3>Modül erişimi</h3><p class="ka-muted">Teknik modüllerin adını, ikonunu, görünürlüğünü ve sırasını yönetin.</p></div></div><div id="appModuleEditor" class="ka-stack ka-layout-module-list">${cfg.modules.map(moduleEditorRow).join('')}</div></section><section class="ka-layout-section" data-layout-section-panel="dashboard" ${layoutSection==='dashboard'?'':'hidden'}><div class="ka-layout-section-head"><div><h3>Ana sayfa kartları</h3><p class="ka-muted">Dashboard kartlarının görünürlüğünü ve sırasını ayarlayın.</p></div></div><div id="dashboardCardEditor" class="ka-stack ka-layout-dashboard-list">${cfg.dashboardCards.map(dashboardEditorRow).join('')}</div></section><div class="ka-layout-savebar"><button class="ka-btn ka-btn--secondary" type="button" data-app-reset data-ka-permission="settings.app.edit" data-ka-write="settings.app.edit">Varsayılana Dön</button><button class="ka-btn" type="button" data-app-save data-ka-permission="settings.app.edit" data-ka-write="settings.app.edit">Değişiklikleri Kaydet</button></div></section>`}
'''
          s=between(s,'function appLayout()','function moveRow(',app_block,'settings.js')

          old_start=s.find('function moveRow(button,dir)')
          old_end=s.find('async function saveAppLayout()',old_start)
          if old_start<0 or old_end<0: raise SystemExit('read layout block boundaries not found')
          move_read=r'''function moveRow(button,dir){const row=button.closest('[data-app-module-row],[data-dashboard-card-row]'),box=row?.parentElement;if(!row||!box)return;const target=dir<0?row.previousElementSibling:row.nextElementSibling;if(target)box.insertBefore(dir<0?row:target,dir<0?target:row);markLayoutDirty(document.getElementById('settingsContent'))}
function readMenuLayoutFromDom(){const groups={};[...document.querySelectorAll('[data-menu-group-row]')].forEach((row,gi)=>{const key=row.dataset.menuGroupRow,order=Number(row.querySelector('[data-menu-group-order]')?.value);groups[key]={label:row.querySelector('[data-menu-group-label]')?.value.trim()||key,icon:row.querySelector('[data-menu-group-icon]')?.value.trim()||'',color:menuColorValue(row.querySelector('[data-menu-group-color]')?.value,''),visible:!!row.querySelector('[data-menu-group-visible]')?.checked,order:Number.isFinite(order)?order:(gi+1)*10,items:{}}});[...document.querySelectorAll('[data-menu-item-row]')].forEach((item,ii)=>{const source=item.dataset.menuItemSource||item.closest('[data-menu-group-row]')?.dataset.menuGroupRow||'';if(!source||!groups[source])return;const order=Number(item.querySelector('[data-menu-item-order]')?.value);groups[source].items[item.dataset.menuItemRow]={label:item.querySelector('[data-menu-item-label]')?.value.trim()||'',icon:item.querySelector('[data-menu-item-icon]')?.value.trim()||'',color:menuColorValue(item.querySelector('[data-menu-item-color]')?.value,''),visible:!!item.querySelector('[data-menu-item-visible]')?.checked,order:Number.isFinite(order)?order:(ii+1)*10,targetGroup:item.querySelector('[data-menu-item-target]')?.value||source}});return{groups}}
function readAppConfigFromDom(){const current=window.AppConfig.get(),modules=[...document.querySelectorAll('[data-app-module-row]')].map((row,i)=>({key:row.dataset.appModuleRow,label:row.querySelector('[data-app-label]')?.value.trim()||row.dataset.appModuleRow,icon:row.querySelector('[data-app-icon]')?.value.trim()||'',visible:!!row.querySelector('[data-app-visible]')?.checked,order:(i+1)*10})),dashboardCards=[...document.querySelectorAll('[data-dashboard-card-row]')].map((row,i)=>{const old=current.dashboardCards.find(x=>x.key===row.dataset.dashboardCardRow)||{};return{...old,key:row.dataset.dashboardCardRow,visible:!!row.querySelector('[data-card-visible]')?.checked,order:(i+1)*10}});return{defaultModule:document.getElementById('appDefaultModule')?.value||'dashboard',modules,dashboardCards,menuLayout:readMenuLayoutFromDom()}}
'''
          s=s[:old_start]+move_read+s[old_end:]

          old_start=s.find('function selectLayoutMenu(out,key)')
          old_end=s.find('function activeAllowed(',old_start)
          if old_start<0 or old_end<0: raise SystemExit('layout bind boundaries not found')
          bind=r'''function selectLayoutSection(out,key){const root=out.querySelector('.ka-layout-page');if(!root)return;layoutSection=key;root.querySelectorAll('[data-layout-section-select]').forEach(b=>{const on=b.dataset.layoutSectionSelect===key;b.classList.toggle('is-active',on);b.setAttribute('aria-pressed',on?'true':'false')});root.querySelectorAll('[data-layout-section-panel]').forEach(panel=>{panel.hidden=panel.dataset.layoutSectionPanel!==key})}
function selectLayoutMenu(out,key){const root=out.querySelector('[data-layout-studio]');if(!root)return;layoutMenu=key;root.querySelectorAll('[data-layout-menu-select]').forEach(b=>{const on=b.dataset.layoutMenuSelect===key;b.classList.toggle('is-active',on);b.setAttribute('aria-pressed',on?'true':'false')});root.querySelectorAll('[data-layout-panel]').forEach(panel=>{panel.hidden=panel.dataset.layoutPanel!==key})}
function markLayoutDirty(out){const status=out?.querySelector?.('[data-layout-status]');if(!status)return;status.classList.add('is-dirty');status.innerHTML='<span>●</span><span>Kaydedilmemiş değişiklikler var.</span>'}
function refreshLayoutCounts(out){out.querySelectorAll('[data-layout-panel]').forEach(panel=>{const count=panel.querySelectorAll('[data-menu-item-row]').length;panel.querySelectorAll('[data-layout-panel-count],[data-layout-list-count]').forEach(x=>x.textContent=String(count));const picker=out.querySelector(`[data-layout-menu-select="${panel.dataset.layoutPanel}"] [data-layout-picker-count]`);if(picker)picker.textContent=String(count);const list=panel.querySelector('[data-layout-item-list]');if(list&&count===0&&!list.querySelector('.ka-layout-empty'))list.innerHTML='<div class="ka-empty ka-layout-empty">Bu menüde alt öğe yok.</div>';if(list&&count>0)list.querySelector('.ka-layout-empty')?.remove()})}
function moveMenuItemToTarget(out,select){const row=select.closest('[data-menu-item-row]');if(!row)return;const panel=[...out.querySelectorAll('[data-layout-panel]')].find(x=>x.dataset.layoutPanel===select.value),list=panel?.querySelector('[data-layout-item-list]');if(!list)return;list.querySelector('.ka-layout-empty')?.remove();list.appendChild(row);refreshLayoutCounts(out);markLayoutDirty(out)}
function bindAppEditor(out){out.querySelectorAll('[data-move-up]').forEach(b=>b.onclick=()=>moveRow(b,-1));out.querySelectorAll('[data-move-down]').forEach(b=>b.onclick=()=>moveRow(b,1));out.querySelectorAll('[data-layout-section-select]').forEach(b=>b.addEventListener('click',()=>selectLayoutSection(out,b.dataset.layoutSectionSelect)));out.querySelectorAll('[data-layout-menu-select]').forEach(b=>b.addEventListener('click',()=>selectLayoutMenu(out,b.dataset.layoutMenuSelect)));out.querySelectorAll('[data-menu-item-target]').forEach(s=>s.addEventListener('change',()=>moveMenuItemToTarget(out,s)));out.querySelectorAll('.ka-layout-page input,.ka-layout-page select').forEach(el=>{if(el.matches('[data-menu-item-target]'))return;el.addEventListener('input',()=>markLayoutDirty(out));el.addEventListener('change',()=>markLayoutDirty(out))});out.querySelector('[data-app-save]')?.addEventListener('click',saveAppLayout);out.querySelector('[data-app-reset]')?.addEventListener('click',resetAppLayout);refreshLayoutCounts(out)}
'''
          s=s[:old_start]+bind+s[old_end:]
          p.write_text(s,encoding='utf-8')

          # Central Design System: replace the v877 layout block with the new stable tabbed studio.
          p=Path('css/design-system.css'); css=p.read_text(encoding='utf-8')
          a=css.find('.ka-layout-page{gap:14px}')
          b=css.find('@media(max-width:380px){.ka-menu-list',a)
          if a<0 or b<0: raise SystemExit('design layout block boundaries not found')
          new_css=r'''.ka-layout-page{width:100%;max-width:900px;margin:0 auto;gap:12px}.ka-layout-intro>.ka-card__body{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,290px);align-items:end;gap:14px}.ka-layout-intro__copy h3{margin:7px 0 3px}.ka-layout-intro__copy p{margin:0;max-width:640px}.ka-layout-default{margin:0}.ka-layout-section-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px;border:1px solid var(--ka-border);border-radius:18px;background:var(--ka-muted-bg)}.ka-layout-section-tab{min-height:52px;border:0;border-radius:13px;background:transparent;color:var(--ka-text-muted);display:flex;align-items:center;justify-content:center;gap:7px;font:inherit;cursor:pointer}.ka-layout-section-tab>span{font-size:18px}.ka-layout-section-tab strong{font-size:12px}.ka-layout-section-tab.is-active{background:var(--ka-card-bg);color:var(--ka-primary);box-shadow:var(--ka-shadow-sm)}.ka-layout-status{min-height:34px;display:flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--ka-border);border-radius:12px;background:var(--ka-card-bg);color:var(--ka-text-muted);font-size:10.5px}.ka-layout-status>span:first-child{color:var(--ka-success);font-weight:900}.ka-layout-status.is-dirty{border-color:color-mix(in srgb,var(--ka-warning) 38%,var(--ka-border));background:color-mix(in srgb,var(--ka-warning) 8%,var(--ka-card-bg));color:var(--ka-text)}.ka-layout-status.is-dirty>span:first-child{color:var(--ka-warning)}.ka-layout-section{display:grid;gap:12px;min-width:0}.ka-layout-section[hidden]{display:none!important}.ka-layout-section-head h3{margin:0 0 2px}.ka-layout-section-head p{margin:0}.ka-layout-studio{display:grid;gap:12px;min-width:0}.ka-layout-picker{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 7px;scroll-snap-type:x proximity;scrollbar-width:none}.ka-layout-picker::-webkit-scrollbar{display:none}.ka-layout-picker__item{min-width:142px;max-width:190px;min-height:64px;display:grid;grid-template-columns:30px minmax(0,1fr) 24px;align-items:center;gap:7px;padding:8px 9px;border:1px solid var(--ka-border);border-radius:15px;background:var(--ka-card-bg);color:var(--ka-text);text-align:left;scroll-snap-align:start;cursor:pointer}.ka-layout-picker__item>span{font-size:20px}.ka-layout-picker__item strong{font-size:11px;line-height:1.15}.ka-layout-picker__item small{display:grid;place-items:center;width:24px;height:24px;border-radius:999px;background:var(--ka-muted-bg);color:var(--ka-text-muted);font-size:9px;font-weight:850}.ka-layout-picker__item.is-active{border-color:var(--ka-primary);background:var(--ka-primary-soft);box-shadow:0 0 0 2px color-mix(in srgb,var(--ka-primary) 14%,transparent)}.ka-layout-panels{min-width:0}.ka-layout-menu-panel{display:grid;gap:10px}.ka-layout-menu-panel[hidden]{display:none!important}.ka-layout-menu-config__head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.ka-layout-menu-config__head small{display:block;margin-top:2px}.ka-settings-menu-swatch{width:11px;height:42px;flex:0 0 11px;border-radius:999px;background:var(--ka-settings-menu-color)}.ka-layout-visible{display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ka-text);font-size:10.5px;font-weight:800}.ka-layout-visible input{width:19px;height:19px;accent-color:var(--ka-primary)}.ka-layout-group-fields{display:grid;grid-template-columns:minmax(0,1.5fr) 86px 80px 68px;gap:8px}.ka-layout-items-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 0}.ka-layout-items-head h4{margin:0 0 2px}.ka-layout-items-head p{margin:0;font-size:10px;max-width:640px}.ka-layout-item-list{display:grid;gap:8px}.ka-layout-subitem{padding:10px;border:1px solid var(--ka-border);border-radius:15px;background:var(--ka-card-bg);display:grid;gap:9px}.ka-layout-subitem__main{display:flex;align-items:center;gap:9px}.ka-layout-subitem__icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:11px;background:var(--ka-primary-soft);font-size:18px}.ka-layout-subitem__main strong{font-size:12px}.ka-layout-subitem__main small{display:block;margin-top:2px;font-size:8.8px}.ka-layout-subitem__fields{display:grid;grid-template-columns:minmax(0,1.2fr) 74px minmax(150px,.9fr) 72px 62px;gap:7px;padding-top:8px;border-top:1px solid var(--ka-border)}.ka-layout-subitem__fields .ka-field__label,.ka-layout-group-fields .ka-field__label{font-size:9px}.ka-layout-subitem__fields input,.ka-layout-subitem__fields select,.ka-layout-group-fields input{min-height:40px}.ka-settings-color-field input[type="color"]{padding:4px}.ka-layout-module-list>.ka-card,.ka-layout-dashboard-list>.ka-card{box-shadow:none}.ka-layout-savebar{position:sticky;bottom:calc(var(--ka-bottom-nav-h) + 6px);z-index:8;display:grid;grid-template-columns:1fr 1.35fr;gap:8px;padding:9px;border:1px solid var(--ka-border);border-radius:16px;background:color-mix(in srgb,var(--ka-card-raised-bg) 95%,transparent);box-shadow:var(--ka-shadow-md);backdrop-filter:blur(14px)}
@media(max-width:700px){.ka-layout-page{gap:10px}.ka-layout-intro>.ka-card__body{grid-template-columns:1fr;gap:10px}.ka-layout-section-tabs{position:sticky;top:4px;z-index:7}.ka-layout-section-tab{min-height:46px}.ka-layout-section-tab strong{font-size:10.5px}.ka-layout-picker__item{min-width:132px}.ka-layout-menu-config>.ka-card__body{padding:11px}.ka-layout-menu-config__head{align-items:flex-start}.ka-layout-group-fields{grid-template-columns:minmax(0,1fr) 82px}.ka-layout-group-fields .ka-settings-color-field,.ka-layout-group-fields .ka-layout-order-field{grid-column:auto}.ka-layout-subitem{padding:9px}.ka-layout-subitem__fields{grid-template-columns:minmax(0,1fr) 78px}.ka-layout-move-field{grid-column:1/-1}.ka-layout-savebar{bottom:calc(var(--ka-bottom-nav-h) + 5px)}}
@media(max-width:430px){.ka-layout-section-tabs{gap:4px;padding:5px}.ka-layout-section-tab{gap:5px}.ka-layout-section-tab>span{font-size:16px}.ka-layout-picker__item{min-width:124px}.ka-layout-subitem__main{gap:7px}.ka-layout-subitem__icon{width:34px;height:34px;flex-basis:34px}.ka-layout-visible span{display:none}.ka-layout-subitem__fields{grid-template-columns:minmax(0,1fr) 72px}.ka-layout-subitem__fields .ka-settings-color-field,.ka-layout-subitem__fields .ka-layout-order-field{grid-column:auto}}
'''
          css=css[:a]+new_css+css[b:]
          p.write_text(css,encoding='utf-8')

          # v878 cache bust only for the changed runtime owners.
          p=Path('index.html'); x=p.read_text(encoding='utf-8');
          x=x.replace('css/design-system.css?v=877','css/design-system.css?v=878').replace('js/app-loader.js?v=877','js/app-loader.js?v=878')
          p.write_text(x,encoding='utf-8')
          p=Path('js/app-loader.js'); x=p.read_text(encoding='utf-8'); x=x.replace("define('settings',['js/modules/settings.js?v=877']);","define('settings',['js/modules/settings.js?v=878']);",1); p.write_text(x,encoding='utf-8')
          p=Path('service-worker.js'); x=p.read_text(encoding='utf-8'); x=x.replace("const CACHE_ADI='oy-cache-v877';","const CACHE_ADI='oy-cache-v878';",1).replace("'./css/design-system.css?v=877'","'./css/design-system.css?v=878'",1).replace("'./js/app-loader.js?v=877'","'./js/app-loader.js?v=878'",1).replace("'./js/modules/settings.js?v=877'","'./js/modules/settings.js?v=878'",1); p.write_text(x,encoding='utf-8')

          # Update intentional current-generation pins, then strengthen the layout regression.
          for t in Path('tests').glob('*.js'):
              x=t.read_text(encoding='utf-8')
              n=x.replace('css/design-system.css?v=877','css/design-system.css?v=878').replace('js/app-loader.js?v=877','js/app-loader.js?v=878').replace('js/modules/settings.js?v=877','js/modules/settings.js?v=878').replace("const CACHE_ADI='oy-cache-v877';","const CACHE_ADI='oy-cache-v878';")
              if n!=x:t.write_text(n,encoding='utf-8')

          p=Path('tests/menu-customization-v2.test.js'); x=p.read_text(encoding='utf-8')
          marker="assert(settings.includes('data-layout-menu-select')&&settings.includes('data-layout-panel')&&!settings.includes('<details class=\\\"ka-card ka-settings-menu-group'),'Uygulama Düzeni akordiyon yerine tek panel seçici kullanmalı.');"
          if marker not in x: raise SystemExit('menu customization marker not found')
          extra="""assert(settings.includes('data-layout-section-select')&&settings.includes('data-layout-section-panel'),'Uygulama Düzeni Menüler / Modüller / Ana Sayfa sabit bölüm seçicisini kullanmalı.');
assert(settings.includes('data-menu-item-source')&&settings.includes('function moveMenuItemToTarget(out,select)'),'Alt menü taşıma source kimliğini koruyarak hedef menüye canlı taşınmalı.');
assert(settings.includes("layoutSection='menus'")&&settings.includes("layoutMenu='people'"),'Düzenleyici aktif bölüm ve menüyü renderlar arasında korumalı.');
assert(settings.includes('function markLayoutDirty(out)')&&settings.includes('Kaydedilmemiş değişiklikler var.'),'Kaydedilmemiş düzen değişiklikleri görünür durum mesajı üretmeli.');
assert(design.includes('.ka-layout-section-tabs')&&design.includes('.ka-layout-section[hidden]')&&design.includes('.ka-layout-subitem'),'Yeni mobil düzen stüdyosu yalnız merkezi Design System içinde tanımlanmalı.');
"""
          x=x.replace(marker,marker+'\n'+extra,1); p.write_text(x,encoding='utf-8')

          p=Path('tests/classic-shell-v2-smoke.test.js'); x=p.read_text(encoding='utf-8')
          old="assert(ui.includes(\"kind:'menu-list'\")&&ui.includes(\"if(view.kind==='menu-list'){openMenu();renderMenuList(view.page);return true}\"),'Alt menüden açılan sayfada geri önceki menü listesine dönmeli.');"
          if old not in x: raise SystemExit('back regression marker not found')
          new=old+"\nassert(ui.includes(\"rememberView({kind:'menu-list'\")&&ui.includes('rememberView({kind:\'route\''),'Menü öğesi açılırken önce kaynak alt menü sonra sayfa route geçmişe yazılmalı.');"
          x=x.replace(old,new,1); p.write_text(x,encoding='utf-8')
          PY
