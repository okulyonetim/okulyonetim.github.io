name: App layout studio v878

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-layout-studio-v878.yml'

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify baseline
        run: test "$(git rev-parse HEAD^)" = '31e36c27b3a1070d7a0197e10fe423fb09b240c2'
      - name: Apply app layout studio redesign
        run: |
          python3 scripts/tmp-app-layout-studio-v878.py
          python3 scripts/tmp-app-layout-studio-v878-testfix.py
          python3 scripts/tmp-app-layout-studio-v878-auditfix.py
      - name: Validate syntax, navigation, local-first and design contracts
        run: |
          set -euo pipefail
          node --check js/modules/settings.js
          node --check js/core/shell-ui.js
          node --check js/app-loader.js
          node --check service-worker.js
          node tests/settings-separate-pages.test.js
          node tests/menu-customization-v2.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/module-bundles-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/web-mobile-engine-separation.test.js
          npm run audit:client
          npm run build:client
      - name: Commit verified layout studio and cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/app-layout-studio-v878.yml scripts/tmp-app-layout-studio-v878.py scripts/tmp-app-layout-studio-v878-testfix.py scripts/tmp-app-layout-studio-v878-auditfix.py
          git add js/modules/settings.js js/core/shell-ui.js js/app-loader.js css/design-system.css index.html service-worker.js tests
          git commit -m 'feat: redesign app layout studio and preserve menu back history'
          git push origin HEAD:main
