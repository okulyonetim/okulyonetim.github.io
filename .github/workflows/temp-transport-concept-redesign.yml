name: Temp Transport Concept Redesign
on:
  push:
    branches:
      - work/transport-concept-redesign-20260831
    paths:
      - .github/.transport-concept-trigger
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/transport-concept-redesign-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply transport concept redesign
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          js = Path('js/modules/transport.js')
          s = js.read_text(encoding='utf-8')

          student_fn = r'''function serviceDetailStudentRow(v,presidents){
           const isPresident=presidents.has(String(v.id)),gender=String(v.cinsiyet||''),genderClass=norm(gender).includes('erkek')?'is-male':'is-female';
           return `<article class="ka-transport-student-row"><div class="ka-transport-student-avatar ${isPresident?'is-president':''}" aria-hidden="true">${isPresident?'👑':'👤'}</div><div class="ka-transport-student-main"><strong>${esc(v.ogrenciAdi||'Öğrenci')}</strong><div class="ka-transport-student-meta">${v.ogrenciNo?`<span class="ka-transport-student-no">No: ${esc(v.ogrenciNo)}</span>`:''}<span class="ka-transport-chip ka-transport-chip--class">${esc(className(v.sinifId))}</span>${gender?`<span class="ka-transport-chip ka-transport-chip--gender ${genderClass}">${esc(gender)}</span>`:''}${isPresident?'<span class="ka-transport-chip ka-transport-chip--president">Servis Başkanı</span>':''}</div></div>${canEditServices()?`<button class="ka-btn ka-btn--sm ka-transport-remove" type="button" data-transport-remove-student="${esc(v.id)}"><span aria-hidden="true">🗑</span><span>Çıkar</span></button>`:''}</article>`;
          }'''

          detail_fn = r'''function serviceDetail(){
           const s=service(serviceDetailId);if(!s){serviceDetailId='';return services()}
           const list=students(s.id),presidents=new Set((Array.isArray(s.baskanlar)?s.baskanlar:[]).map(String)),status=serviceStatus(s),statusClass=status==='Pasif'?'ka-badge--muted':'ka-badge--success';
           return{count:list.length,html:`<section class="ka-stack ka-transport-detail" data-transport-service-detail="${esc(s.id)}"><div class="ka-transport-detail__toolbar ka-transport-action-grid"><button class="ka-btn ka-btn--secondary ka-btn--sm" type="button" data-transport-list><span class="ka-transport-action__icon" aria-hidden="true">▣</span><span>Rapor</span></button>${canEditServices()?`<button class="ka-btn ka-btn--secondary ka-btn--sm" type="button" data-service-edit="${esc(s.id)}"><span class="ka-transport-action__icon" aria-hidden="true">✎</span><span>Düzenle</span></button><button class="ka-btn ka-btn--danger ka-btn--sm" type="button" data-transport-detail-delete><span class="ka-transport-action__icon" aria-hidden="true">⌫</span><span>Sil</span></button>`:''}<button class="ka-btn ka-btn--secondary ka-btn--sm" type="button" data-transport-detail-close><span class="ka-transport-action__icon" aria-hidden="true">×</span><span>Kapat</span></button></div><header class="ka-card ka-transport-service-hero"><div class="ka-transport-service-hero__icon" aria-hidden="true">🚌</div><div class="ka-transport-service-hero__main"><div class="ka-row ka-wrap"><h2>${esc(serviceName(s))}</h2><span class="ka-badge ${statusClass}">${esc(status)}</span></div><p>${esc([s.guzergah,status].filter(Boolean).join(' · '))}</p></div><span class="ka-transport-service-hero__count">${list.length} öğrenci</span></header><article class="ka-card ka-transport-info-card"><div class="ka-card__body ka-stack"><div class="ka-transport-section-title"><span aria-hidden="true">♢</span><h3>Servis Bilgileri</h3></div><div class="ka-transport-info-grid"><div class="ka-transport-info-item"><span class="ka-transport-info-icon" aria-hidden="true">👨‍✈️</span><div><small>Şoför</small><strong>${esc(s.soforAdi||'—')}</strong></div></div><div class="ka-transport-info-item"><span class="ka-transport-info-icon" aria-hidden="true">☎</span><div><small>Telefon</small>${s.soforTelefon?`<a href="tel:${esc(s.soforTelefon)}">${esc(s.soforTelefon)}</a>`:'<strong>—</strong>'}</div></div><div class="ka-transport-info-item"><span class="ka-transport-info-icon" aria-hidden="true">🚘</span><div><small>Plaka</small><strong>${esc(s.plaka||'—')}</strong></div></div><div class="ka-transport-info-item"><span class="ka-transport-info-icon" aria-hidden="true">◉</span><div><small>Durum</small><span class="ka-badge ${statusClass}">${esc(status)}</span></div></div><div class="ka-transport-info-item"><span class="ka-transport-info-icon" aria-hidden="true">🗺️</span><div><small>Güzergâh</small><strong>${esc(s.guzergah||'—')}</strong></div></div><div class="ka-transport-info-item"><span class="ka-transport-info-icon is-crown" aria-hidden="true">👑</span><div><small>Servis Başkanı</small><strong>${esc(presidentNames(s))}</strong></div></div></div><div class="ka-transport-report-actions"><button class="ka-btn ka-btn--secondary" type="button" data-transport-detail-report="monthly">📋 Aylık Takip</button><button class="ka-btn ka-btn--secondary" type="button" data-transport-detail-report="inspection">📄 Denetim Formu</button></div></div></article><section class="ka-card ka-transport-students-card"><div class="ka-card__body ka-stack"><div class="ka-transport-students-head"><div class="ka-transport-section-title"><span aria-hidden="true">👥</span><h3>Servis Öğrenci Listesi (${list.length})</h3></div><p>Sınıf, öğrenci no ve cinsiyet bilgileri cihazdaki öğrenci kayıtlarından gelir.</p></div><div class="ka-transport-detail-actions">${canEditServices()?'<button class="ka-btn ka-btn--secondary" type="button" data-transport-excel>▤ Excel\'den Ekle</button><button class="ka-btn" type="button" data-transport-add-student>＋ Öğrenci Ekle</button>':''}<button class="ka-btn ka-btn--secondary" type="button" data-transport-list>☷ Liste Oluştur</button>${canEditServices()?'<button class="ka-btn ka-btn--secondary" type="button" data-transport-presidents>👑 Başkanlar</button>':''}</div><div class="ka-transport-student-list">${list.length?list.map(v=>serviceDetailStudentRow(v,presidents)).join(''):'<div class="ka-empty">Bu serviste kayıtlı öğrenci yok.</div>'}</div></div></section></section>`}
          }'''

          s2, n1 = re.subn(r'function serviceDetailStudentRow\(v,presidents\)\{.*?\n\}\nfunction serviceDetail\(\)', student_fn + '\nfunction serviceDetail()', s, count=1, flags=re.S)
          if n1 != 1:
              raise SystemExit(f'serviceDetailStudentRow patch failed: {n1}')
          s3, n2 = re.subn(r'function serviceDetail\(\)\{.*?\nfunction openServiceDetail\(id\)', detail_fn + '\nfunction openServiceDetail(id)', s2, count=1, flags=re.S)
          if n2 != 1:
              raise SystemExit(f'serviceDetail patch failed: {n2}')
          js.write_text(s3, encoding='utf-8')

          css = Path('css/design-system.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* Taşıma — premium açık/koyu konsept v4 */'
          block = r'''
          /* Taşıma — premium açık/koyu konsept v4 */
          [data-transport-service-detail]{--tr-accent:var(--ka-primary);--tr-surface:var(--ka-card-bg);--tr-raised:var(--ka-card-raised-bg);--tr-line:var(--ka-border);--tr-soft:color-mix(in srgb,var(--ka-primary) 8%,var(--ka-card-bg));gap:14px!important}
          .ka-transport-action-grid{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:8px!important;width:100%!important}
          .ka-transport-action-grid>.ka-btn{width:100%!important;min-width:0!important;min-height:46px!important;padding:0 8px!important;gap:6px!important;border:1px solid var(--ka-border)!important;border-radius:15px!important;background:var(--ka-card-raised-bg)!important;color:var(--ka-text)!important;box-shadow:var(--ka-shadow-sm)!important;font-size:12.5px!important;font-weight:850!important;white-space:nowrap!important}
          .ka-transport-action-grid>.ka-btn:hover{border-color:color-mix(in srgb,var(--ka-primary) 45%,var(--ka-border))!important;background:var(--ka-primary-soft)!important;color:var(--ka-primary)!important}
          .ka-transport-action-grid .ka-transport-action__icon{font-size:17px;line-height:1;color:var(--ka-primary)}
          .ka-transport-action-grid>[data-transport-detail-delete]{background:color-mix(in srgb,var(--ka-danger) 7%,var(--ka-card-bg))!important;border-color:color-mix(in srgb,var(--ka-danger) 28%,var(--ka-border))!important;color:var(--ka-danger)!important}
          .ka-transport-action-grid>[data-transport-detail-delete] .ka-transport-action__icon{color:var(--ka-danger)}
          .ka-transport-action-grid>[data-transport-detail-delete]:hover{background:color-mix(in srgb,var(--ka-danger) 12%,var(--ka-card-bg))!important;border-color:var(--ka-danger)!important;color:var(--ka-danger)!important}

          .ka-transport-service-hero{display:grid;grid-template-columns:54px minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 16px;border-radius:20px!important;background:linear-gradient(135deg,var(--tr-soft),var(--ka-card-bg) 64%);border-color:color-mix(in srgb,var(--ka-primary) 20%,var(--ka-border))!important;box-shadow:var(--ka-shadow-sm)!important}
          .ka-transport-service-hero__icon{width:54px;height:54px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,var(--ka-primary),var(--ka-primary-hover));color:var(--ka-button-text);font-size:26px;box-shadow:0 8px 18px color-mix(in srgb,var(--ka-primary) 24%,transparent)}
          .ka-transport-service-hero__main{min-width:0}.ka-transport-service-hero__main .ka-row{gap:8px}.ka-transport-service-hero__main h2{font-size:20px}.ka-transport-service-hero__main p{margin-top:4px;color:var(--ka-text-muted);font-size:12px;line-height:1.45;overflow-wrap:anywhere}.ka-transport-service-hero__count{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:3px 10px;border-radius:999px;background:var(--ka-primary-soft);color:var(--ka-primary);font-size:11px;font-weight:850;white-space:nowrap}

          .ka-transport-info-card,.ka-transport-students-card{overflow:hidden;border-radius:20px!important;box-shadow:var(--ka-shadow-sm)!important}
          .ka-transport-info-card>.ka-card__body,.ka-transport-students-card>.ka-card__body{padding:16px!important}
          .ka-transport-section-title{display:flex;align-items:center;gap:8px;color:var(--ka-primary)}.ka-transport-section-title>span{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:var(--ka-primary-soft);font-size:15px}.ka-transport-section-title h3{color:var(--ka-primary);font-size:16px}
          .ka-transport-info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--ka-border);border-radius:16px;overflow:hidden;background:var(--ka-card-bg)}
          .ka-transport-info-item{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:10px;min-width:0;padding:12px 13px;border-bottom:1px solid var(--ka-border)}
          .ka-transport-info-item:nth-child(odd){border-right:1px solid var(--ka-border)}.ka-transport-info-item:nth-last-child(-n+2){border-bottom:0}
          .ka-transport-info-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:var(--ka-primary-soft);color:var(--ka-primary);font-size:15px}.ka-transport-info-icon.is-crown{background:color-mix(in srgb,var(--ka-warning) 12%,var(--ka-card-bg));color:var(--ka-warning)}
          .ka-transport-info-item>div{min-width:0;display:grid;gap:2px}.ka-transport-info-item small{color:var(--ka-text-muted);font-size:9.5px;font-weight:750}.ka-transport-info-item strong,.ka-transport-info-item a{min-width:0;color:var(--ka-text);font-size:12.5px;font-weight:800;line-height:1.35;overflow-wrap:anywhere}.ka-transport-info-item a{color:var(--ka-primary);text-decoration:none}.ka-transport-info-item .ka-badge{justify-self:start;min-height:22px;font-size:10px}
          .ka-transport-report-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}.ka-transport-report-actions>.ka-btn{min-height:40px!important;width:100%!important;padding:0 10px!important;border-radius:13px!important;background:var(--ka-card-raised-bg)!important;color:var(--ka-text)!important;border-color:var(--ka-border)!important;box-shadow:none!important;font-size:11.5px!important;font-weight:800!important;white-space:nowrap!important}

          .ka-transport-students-head{display:grid;gap:4px}.ka-transport-students-head p{color:var(--ka-text-muted);font-size:10.5px;line-height:1.45}
          .ka-transport-detail-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}.ka-transport-detail-actions>.ka-btn{width:100%!important;min-width:0!important;min-height:42px!important;padding:0 10px!important;border-radius:13px!important;box-shadow:none!important;font-size:12px!important;font-weight:850!important;white-space:nowrap!important}.ka-transport-detail-actions>.ka-btn--secondary{background:var(--ka-card-raised-bg)!important;color:var(--ka-primary)!important;border-color:var(--ka-border)!important}.ka-transport-detail-actions>[data-transport-add-student]{background:var(--ka-primary)!important;color:var(--ka-button-text)!important;border-color:var(--ka-primary)!important}
          .ka-transport-student-list{display:grid;border:1px solid var(--ka-border);border-radius:16px;overflow:hidden;background:var(--ka-card-bg)}
          .ka-transport-student-row{display:grid!important;grid-template-columns:36px minmax(0,1fr) auto!important;align-items:center!important;gap:10px!important;min-width:0!important;padding:10px 11px!important;border:0!important;border-bottom:1px solid var(--ka-border)!important;background:var(--ka-card-bg)}.ka-transport-student-row:last-child{border-bottom:0!important}
          .ka-transport-student-avatar{width:34px;height:34px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--ka-primary) 26%,var(--ka-border));border-radius:50%;background:var(--ka-primary-soft);font-size:15px}.ka-transport-student-avatar.is-president{background:color-mix(in srgb,var(--ka-warning) 10%,var(--ka-card-bg));border-color:color-mix(in srgb,var(--ka-warning) 34%,var(--ka-border))}
          .ka-transport-student-main{min-width:0;display:grid;gap:5px}.ka-transport-student-main>strong{min-width:0;font-size:12.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ka-transport-student-meta{display:flex;align-items:center;gap:5px;min-width:0;flex-wrap:wrap}.ka-transport-student-no{color:var(--ka-text-muted);font-size:9.5px;font-weight:750;white-space:nowrap}
          .ka-transport-chip{display:inline-flex;align-items:center;min-height:21px;padding:2px 7px;border-radius:999px;font-size:9px;font-weight:850;white-space:nowrap}.ka-transport-chip--class{background:var(--ka-primary-soft);color:var(--ka-primary)}.ka-transport-chip--gender.is-female{background:color-mix(in srgb,#df5a6d 12%,var(--ka-card-bg));color:#c6485a}.ka-transport-chip--gender.is-male{background:color-mix(in srgb,#2988d8 12%,var(--ka-card-bg));color:#2377bb}.ka-transport-chip--president{background:color-mix(in srgb,var(--ka-warning) 13%,var(--ka-card-bg));color:var(--ka-warning)}
          .ka-transport-remove{min-width:66px!important;min-height:32px!important;padding:0 9px!important;gap:4px!important;border:1px solid color-mix(in srgb,var(--ka-danger) 34%,var(--ka-border))!important;border-radius:11px!important;background:transparent!important;color:var(--ka-danger)!important;box-shadow:none!important;font-size:10px!important;font-weight:850!important;white-space:nowrap!important}
          .ka-transport-remove:hover{background:color-mix(in srgb,var(--ka-danger) 8%,var(--ka-card-bg))!important;border-color:var(--ka-danger)!important}

          [data-theme="dark"] [data-transport-service-detail]{--tr-soft:color-mix(in srgb,var(--ka-primary) 7%,#07110d)}
          [data-theme="dark"] .ka-transport-service-hero,[data-theme="dark"] .ka-transport-info-card,[data-theme="dark"] .ka-transport-students-card,[data-theme="dark"] .ka-transport-student-list,[data-theme="dark"] .ka-transport-info-grid{background:#0d1814}
          [data-theme="dark"] .ka-transport-action-grid>.ka-btn,[data-theme="dark"] .ka-transport-detail-actions>.ka-btn--secondary,[data-theme="dark"] .ka-transport-report-actions>.ka-btn{background:#101d18!important;border-color:#294239!important}
          [data-theme="dark"] .ka-transport-student-row{background:#0d1814}.ka-transport-service-hero,.ka-transport-info-card,.ka-transport-students-card{transition:border-color var(--ka-transition),background var(--ka-transition),box-shadow var(--ka-transition)}

          @media(max-width:560px){
            [data-transport-service-detail]{gap:12px!important}
            .ka-transport-action-grid{gap:6px!important}
            .ka-transport-action-grid>.ka-btn{min-height:44px!important;padding-inline:5px!important;font-size:11.5px!important;border-radius:13px!important}
            .ka-transport-action-grid .ka-transport-action__icon{font-size:16px}
            .ka-transport-service-hero{grid-template-columns:46px minmax(0,1fr) auto;gap:10px;padding:12px}.ka-transport-service-hero__icon{width:46px;height:46px;font-size:22px}.ka-transport-service-hero__main h2{font-size:18px}.ka-transport-service-hero__main p{font-size:10.5px}.ka-transport-service-hero__count{font-size:9.5px;padding-inline:8px}
            .ka-transport-info-card>.ka-card__body,.ka-transport-students-card>.ka-card__body{padding:13px!important}
            .ka-transport-info-item{grid-template-columns:30px minmax(0,1fr);gap:8px;padding:10px}.ka-transport-info-icon{width:29px;height:29px;font-size:13px}.ka-transport-info-item strong,.ka-transport-info-item a{font-size:11.5px}.ka-transport-section-title h3{font-size:15px}
            .ka-transport-detail-actions>.ka-btn{min-height:40px!important;font-size:11.5px!important;padding-inline:7px!important}.ka-transport-report-actions>.ka-btn{font-size:10.5px!important;padding-inline:7px!important}
            .ka-transport-student-row{grid-template-columns:34px minmax(0,1fr) auto!important;gap:8px!important;padding:9px 9px!important}.ka-transport-student-avatar{width:32px;height:32px}.ka-transport-student-main>strong{font-size:12px}.ka-transport-remove{min-width:60px!important;padding-inline:7px!important}
          }
          @media(max-width:360px){
            .ka-transport-action-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
            .ka-transport-service-hero{grid-template-columns:42px minmax(0,1fr)}.ka-transport-service-hero__icon{width:42px;height:42px}.ka-transport-service-hero__count{grid-column:2;justify-self:start}
            .ka-transport-info-grid{grid-template-columns:1fr}.ka-transport-info-item:nth-child(odd){border-right:0}.ka-transport-info-item:nth-last-child(-n+2){border-bottom:1px solid var(--ka-border)}.ka-transport-info-item:last-child{border-bottom:0}
            .ka-transport-detail-actions>.ka-btn,.ka-transport-report-actions>.ka-btn{font-size:10.5px!important}
            .ka-transport-student-row{grid-template-columns:30px minmax(0,1fr) auto!important;gap:6px!important;padding-inline:7px!important}.ka-transport-student-avatar{width:29px;height:29px;font-size:13px}.ka-transport-remove{min-width:52px!important;font-size:9px!important;padding-inline:6px!important}.ka-transport-remove span:first-child{display:none}
          }
          '''.strip()
          if marker not in c:
              css.write_text(c.rstrip('\n') + '\n\n' + block + '\n', encoding='utf-8')

          sw = Path('service-worker.js')
          w = sw.read_text(encoding='utf-8')
          if "CACHE_ADI='oy-cache-v813'" not in w:
              raise SystemExit('Beklenen v813 cache bulunamadı')
          sw.write_text(w.replace("CACHE_ADI='oy-cache-v813'", "CACHE_ADI='oy-cache-v814'", 1), encoding='utf-8')

          test = Path('tests/transport-concept-redesign.test.js')
          test.write_text("""const fs=require('fs');\nconst assert=require('assert');\nconst js=fs.readFileSync('js/modules/transport.js','utf8');\nconst css=fs.readFileSync('css/design-system.css','utf8');\nconst sw=fs.readFileSync('service-worker.js','utf8');\nfor(const token of ['ka-transport-service-hero','ka-transport-info-grid','ka-transport-students-card','ka-transport-student-avatar','ka-transport-chip--president','ka-transport-action-grid']) assert(js.includes(token),`Yeni taşıma markup eksik: ${token}`);\nfor(const token of ['Taşıma — premium açık/koyu konsept v4','[data-theme=\\\"dark\\\"] .ka-transport-service-hero','grid-template-columns:repeat(4,minmax(0,1fr))','ka-transport-remove']) assert(css.includes(token),`Yeni taşıma tema kuralı eksik: ${token}`);\nassert(!js.includes('style=\\\"'),'Transport redesign yeni inline style üretmemeli.');\nassert(/CACHE_ADI='oy-cache-v(\\d+)'/.test(sw)&&Number(sw.match(/CACHE_ADI='oy-cache-v(\\d+)'/)[1])>=814,'Transport redesign cache artışı eksik.');\nconsole.log('Taşıma açık/koyu konsept redesign başarılı.');\n""",encoding='utf-8')
          PY
      - name: Verify transport regressions
        run: |
          node tests/transport-concept-redesign.test.js
          node tests/transport-mobile-layout-v3.test.js
          node tests/transport-button-layout.test.js
          node tests/transport-separate-pages.test.js
          node tests/transport-service-parity.test.js
          node tests/transport-bus-seat-detail.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node scripts/check-client-architecture.mjs
          git diff --check
      - name: Commit verified redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/transport.js css/design-system.css service-worker.js tests/transport-concept-redesign.test.js
          git commit -m 'Apply transport light dark concept redesign [skip ci]'
          git push origin HEAD:work/transport-concept-redesign-20260831
