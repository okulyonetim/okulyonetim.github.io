name: Temporary PDF page label patch

on:
  push:
    branches:
      - agent/document-viewer-page-label-20260829
    paths:
      - '.github/workflows/temp-document-viewer-page-label.yml'
      - 'tests/apply-document-viewer-page-label.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/document-viewer-page-label-20260829

      - name: Apply guarded PDF page label patch
        run: python3 tests/apply-document-viewer-page-label.py

      - name: Verify document viewer smoke test
        run: node tests/document-viewer-smoke.test.js

      - name: Commit clean patch result
        run: |
          rm .github/workflows/temp-document-viewer-page-label.yml tests/apply-document-viewer-page-label.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/design-system.css tests/document-viewer-smoke.test.js .github/workflows/temp-document-viewer-page-label.yml tests/apply-document-viewer-page-label.py
          git commit -m "fix(documents): restore PDF page labels"
          git push origin HEAD:agent/document-viewer-page-label-20260829
