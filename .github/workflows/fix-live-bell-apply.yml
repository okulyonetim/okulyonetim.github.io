name: Fix live bell apply contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-bell-apply.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and repair apply workflow
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT="44068d23a1965e7cab37e8e66d2b21bbbd17b34d"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          export BASE_SHA="$(git rev-parse HEAD)"
          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('.github/workflows/live-bell-mobile-timeline.yml')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'EXPECTED="[0-9a-f]{40}"',f'EXPECTED="{os.environ["BASE_SHA"]}"',s,count=1)
          if n!=1: raise SystemExit('base guard replacement failed')
          needle="          test_path.write_text(test,encoding='utf-8')"
          extra=r'''          stale_flow="assert(dash.includes('function bellModel')&&dash.includes('class=\\\"ka-tabs\\\"')&&dash.includes('ka-tab kh-bell-node')&&dash.includes(\"current?'current active'\"),'Gün içi akış tek yatay kaydırılabilir satır olmalı ve aktif segment merkezi pulse sınıfını taşımalı.');"
          timeline_flow="assert(dash.includes('function bellModel')&&dash.includes('function bellTimeline(live)')&&dash.includes('kh-bell-timeline')&&dash.includes('kh-bell-progress-v2'),'Gün içi akış yatay kaydırma ve pulse yerine mobil zaman çizgisi ve gerçek ilerleme göstergesi kullanmalı.');"
          if stale_flow not in test:
              raise SystemExit('stale bell flow assertion not found')
          test=test.replace(stale_flow,timeline_flow,1)
          test_path.write_text(test,encoding='utf-8')'''
          if needle not in s: raise SystemExit('test write anchor missing')
          s=s.replace(needle,extra,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/fix-live-bell-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: repair live bell apply checks"
          git push origin main
