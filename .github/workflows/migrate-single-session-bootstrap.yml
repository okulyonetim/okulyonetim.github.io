name: migrate-single-session-bootstrap
on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-single-session-bootstrap.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply single session bootstrap
        run: python scripts/migrate-single-session-bootstrap.py
      - name: Syntax checks
        run: |
          node --check js/app-loader.js
          node --check js/auth.js
      - name: Shell and architecture checks
        run: |
          node tests/classic-shell-v2-smoke.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Cleanup temporary migration files
        run: rm -f scripts/migrate-single-session-bootstrap.py .github/workflows/migrate-single-session-bootstrap.yml
      - name: Commit production migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'perf(bootstrap): dedupe session startup work'
          git push
