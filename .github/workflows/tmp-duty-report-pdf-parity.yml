name: Temporary Duty Report PDF Parity
on:
  push:
    branches: [fix/duty-report-pdf-parity]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/duty-report-pdf-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply duty report PDF/preview parity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/modules/management.js')
          s=p.read_text()

          old="function dutyReportLogoUrl(){try{return new URL('assets/logo.png',globalThis.location.href).href}catch(_){return'assets/logo.png'}}\nfunction dutyReportPrincipal(okul){const teacher=arr('ogretmenler').find(o=>o.id===okul?.mudurId);return teacher?{ad:teacherName(teacher),telefon:teacher.telefon||''}:{ad:String(okul?.mudurAdi||okul?.mudur||'').trim()||'—',telefon:String(okul?.mudurTelefon||'').trim()}}"
          new=r'''function dutyReportLogoUrl(){try{return new URL('assets/logo.png',globalThis.location.href).href}catch(_){return'assets/logo.png'}}
          async function dutyReportLogoDataUrl(){try{const response=await fetch(dutyReportLogoUrl(),{cache:'force-cache'});if(!response.ok)throw new Error('logo');const blob=await response.blob();return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||dutyReportLogoUrl()));reader.onerror=reject;reader.readAsDataURL(blob)})}catch(_){return dutyReportLogoUrl()}}
          function dutyReportPrintCss(){return `<style>
          .ka-report .ka-duty-report{--ka-duty-table-height:188mm;width:100%;height:287mm;min-height:287mm;color:#111;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;background:#fff;overflow:hidden}.ka-report .ka-duty-report--landscape{height:200mm;min-height:200mm;--ka-duty-table-height:132mm}.ka-report .ka-duty-report[data-duty-density="dense"]{--ka-duty-table-height:190mm}.ka-report .ka-duty-report[data-duty-density="roomy"]{--ka-duty-table-height:184mm}.ka-report .ka-duty-report--landscape[data-duty-density="dense"]{--ka-duty-table-height:134mm}.ka-report .ka-duty-report--landscape[data-duty-density="roomy"]{--ka-duty-table-height:129mm}
          .ka-report .ka-duty-report-banner{position:relative;flex:0 0 auto;min-height:14mm;margin:0 0 .7mm;padding:.7mm 0;display:flex;align-items:center;justify-content:center;border-bottom:1.2px solid #17684f;text-align:center;overflow:hidden}.ka-report .ka-duty-report-logo{position:absolute;left:0;top:50%;transform:translateY(-50%);width:10mm;height:10mm;object-fit:contain}.ka-report .ka-duty-report-banner h1{width:calc(100% - 12mm);margin:0 0 0 12mm!important;padding:0 .6mm!important;color:#155c46!important;font-size:12.8pt!important;font-weight:850!important;line-height:1!important;letter-spacing:-.035em!important;text-align:center!important;white-space:nowrap!important}.ka-report .ka-duty-report--landscape .ka-duty-report-banner h1{font-size:14pt!important}
          .ka-report .ka-duty-report-table{flex:0 0 var(--ka-duty-table-height);width:100%!important;height:var(--ka-duty-table-height)!important;table-layout:fixed!important;margin:0!important;border-collapse:collapse!important;border:1px solid #68736e!important}.ka-report .ka-duty-report-table th{padding:.08mm .28mm!important;background:#17684f!important;border:1px solid #5e6b66!important;color:#fff!important;font-size:9.5pt!important;line-height:.94!important;font-weight:800!important;text-align:center!important;white-space:nowrap!important;overflow:hidden!important}.ka-report .ka-duty-report-table td{padding:.03mm .25mm!important;border:1px solid #8d9692!important;background:#fff!important;color:#111!important;font-size:8.7pt!important;line-height:.93!important;vertical-align:middle!important;text-align:center!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}.ka-report .ka-duty-report-table tbody tr:nth-child(even) td{background:#fff!important}.ka-report .ka-duty-report-table td:first-child{text-align:left!important;font-weight:650!important}.ka-report .ka-duty-report-table tbody tr.ka-duty-report-weekend td{background:#f6eeee!important;color:#444!important;font-weight:600!important}.ka-report .ka-duty-report-table tbody tr.ka-duty-report-holiday td{background:#fff7dc!important;color:#534600!important;font-weight:750!important}.ka-report .ka-duty-report-holiday td:not(:first-child){text-align:center!important}
          .ka-report .ka-duty-report-phones{flex:0 0 auto;display:flex;align-items:center;gap:3mm;flex-wrap:wrap;margin:1.15mm 0 0;padding:.45mm 0;border-top:.45px solid #555;border-bottom:.45px solid #777;font-size:7pt;line-height:1}.ka-report .ka-duty-report-phones>strong{font-size:7.4pt}.ka-report .ka-duty-report-phones span{white-space:nowrap}.ka-report .ka-duty-report-phones b{font-weight:800}
          .ka-report .ka-duty-report-tasks{flex:1 1 auto;min-height:0;margin:1.15mm 0 0!important;padding:0!important;color:#111;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden}.ka-report .ka-duty-report-tasks h2{margin:0 0 .25mm!important;color:#111!important;font-size:9pt!important;line-height:1!important;font-weight:850!important}.ka-report .ka-duty-report-tasks ol{margin:0!important;padding-left:4.2mm!important;font-size:7.2pt!important;line-height:1!important}.ka-report .ka-duty-report-tasks li{margin:0!important;padding:0!important;color:#111!important;font-size:7.2pt!important;line-height:1!important}.ka-report .ka-duty-report-note{margin-top:.55mm;padding-top:.45mm;border-top:.35px solid #aaa;font-size:6.4pt;line-height:1.05}.ka-report .ka-duty-report-note p{margin:0 0 .2mm!important}.ka-report .ka-duty-report-footer{flex:0 0 auto;margin-top:auto;padding-top:.7mm;border-top:.45px solid #aaa;color:#111;display:flex;justify-content:flex-end;align-items:flex-end}.ka-report .ka-duty-report-signature{width:44mm;display:flex;flex-direction:column;align-items:center;text-align:center;font-size:10.5pt!important;line-height:1.02}.ka-report .ka-duty-report-signature strong{margin-top:.15mm;font-size:10.5pt!important;font-weight:850}.ka-report .ka-duty-report-signature span{display:block;font-size:10.5pt!important}.ka-report .ka-duty-report-signature span:last-child{margin-top:.05mm;font-weight:700}.ka-report .ka-duty-report--landscape .ka-duty-report-signature{width:48mm}
          </style>`}
          function dutyReportPrincipal(okul){const principalId=okul?.mudurId||okul?.mudirId,teachers=arr('ogretmenler'),fallbackName=String(okul?.mudurAdSoyad||okul?.mudurAdi||okul?.mudirAdi||okul?.mudur||okul?.mudir||'').trim(),byId=principalId?teachers.find(o=>o.id===principalId):null,byName=!byId&&fallbackName?teachers.find(o=>teacherName(o).localeCompare(fallbackName,'tr',{sensitivity:'base'})===0):null,byRole=!byId&&!byName?teachers.find(o=>{const role=String(o.unvan||o.gorev||o.gorevi||'').toLocaleLowerCase('tr');return role.includes('müdür')&&!role.includes('yardımc')}):null,teacher=byId||byName||byRole;return teacher?{ad:teacherName(teacher),telefon:teacher.telefon||String(okul?.mudurTelefon||'').trim()}:{ad:fallbackName||'—',telefon:String(okul?.mudurTelefon||'').trim()}}'''
          if old not in s: raise SystemExit('duty principal anchor not found')
          s=s.replace(old,new,1)

          anchor="async function createDutyReport(month,yon,gecerlilikTarihi=''){if(!globalThis.ReportEngine)await AppLoader.loadScript('js/modules/report-engine.js');const [ys,ms]=String(month).split('-')"
          repl="async function createDutyReport(month,yon,gecerlilikTarihi=''){if(!globalThis.ReportEngine)await AppLoader.loadScript('js/modules/report-engine.js');const logoSrc=await dutyReportLogoDataUrl(),[ys,ms]=String(month).split('-')"
          if anchor not in s: raise SystemExit('createDutyReport anchor not found')
          s=s.replace(anchor,repl,1)
          if 'src="${esc(dutyReportLogoUrl())}"' not in s: raise SystemExit('logo source anchor not found')
          s=s.replace('src="${esc(dutyReportLogoUrl())}"','src="${esc(logoSrc)}"',1)
          oldopt="compact:true,fontSize:7,kenarBosluk:5})}"
          newopt="compact:true,fontSize:7,kenarBosluk:5,extraHead:dutyReportPrintCss()})}"
          if oldopt not in s: raise SystemExit('report options anchor not found')
          s=s.replace(oldopt,newopt,1)
          p.write_text(s)

          p=Path('css/design-system.css'); c=p.read_text()
          c=c.replace('.ka-report .ka-duty-report-table tbody tr:nth-child(even) td{background:#f7f7f7!important}','.ka-report .ka-duty-report-table tbody tr:nth-child(even) td{background:#fff!important}')
          c=c.replace('.ka-report .ka-duty-report-table tbody tr.ka-duty-report-weekend td{background:#e6e6e6!important;color:#666!important;font-weight:600!important}.ka-report .ka-duty-report-holiday td{background:#fff4cf!important;color:#6b5200!important;font-weight:800!important}', '.ka-report .ka-duty-report-table tbody tr.ka-duty-report-weekend td{background:#f6eeee!important;color:#444!important;font-weight:600!important}.ka-report .ka-duty-report-holiday td{background:#fff7dc!important;color:#534600!important;font-weight:750!important}')
          p.write_text(c)

          p=Path('tests/duty-report-full-parity.test.js'); t=p.read_text()
          old_test="assert(css.includes('.ka-duty-report-table tbody tr.ka-duty-report-weekend td{background:#e6e6e6!important'));"
          new_test='''assert(css.includes('.ka-duty-report-table tbody tr:nth-child(even) td{background:#fff!important'),'Nöbet raporunda zebra satır deseni olmamalı.');
          assert(css.includes('.ka-duty-report-table tbody tr.ka-duty-report-weekend td{background:#f6eeee!important')&&css.includes('.ka-duty-report-holiday td{background:#fff7dc!important'),'Yalnız hafta sonu ve tatil satırları hafif dolgulu olmalı.');
          assert(src.includes('function dutyReportPrintCss()')&&src.includes('extraHead:dutyReportPrintCss()'),'Native PDF çıktısı nöbet raporu stilini HTML içine gömmeli.');
          assert(src.includes('async function dutyReportLogoDataUrl()')&&src.includes('src="${esc(logoSrc)}"'),'Logo native PDF için gömülebilir veri adresine çevrilmeli.');
          assert(src.includes('mudurAdSoyad')&&src.includes("role.includes('müdür')&&!role.includes('yardımc')"),'Müdür adı ayar, öğretmen kimliği veya müdür rolünden bulunabilmeli.');'''
          if old_test not in t: raise SystemExit('duty test anchor not found')
          p.write_text(t.replace(old_test,new_test,1))

          for path in [Path('service-worker.js'), *Path('tests').glob('*.js')]:
              txt=path.read_text()
              if 'oy-cache-v939' in txt:
                  path.write_text(txt.replace('oy-cache-v939','oy-cache-v940'))

          Path('.github/workflows/tmp-duty-report-pdf-parity.yml').unlink()
          PY
          node --check js/modules/management.js
          node tests/duty-report-full-parity.test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: align duty report PDF with preview"
          git push origin HEAD:fix/duty-report-pdf-parity
