name: Temp Duty Redesign
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-duty-redesign.yml'
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply canonical duty redesign
        run: |
          python .github/temp-duty-redesign.py
          python .github/temp-duty-redesign-fix.py
      - name: Verify
        run: |
          set -e
          node --check js/modules/management.js
          node tests/classic-duty-v2-smoke.test.js
          node tests/management-separate-pages.test.js
          node tests/report-engine-a4-smoke.test.js
          node tests/report-native-print-routing-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node scripts/check-client-architecture.mjs
          git diff --check
      - name: Commit verified redesign and remove helpers
        run: |
          set -e
          rm .github/temp-duty-redesign.py .github/temp-duty-redesign-fix.py .github/workflows/temp-duty-redesign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign duty program and restore full duty report"
          git pull --rebase origin main
          git push origin HEAD:main
