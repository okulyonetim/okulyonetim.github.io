name: Calendar Month View Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-calendar-month-view.mjs'
      - 'tests/calendar-month-view.test.js'
      - '.github/workflows/calendar-month-view-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded calendar migration
        run: node scripts/apply-calendar-month-view.mjs
      - name: Verify monthly calendar contract
        run: node tests/calendar-month-view.test.js
      - name: Verify bundles and architecture
        run: node scripts/build-client-bundles.mjs && node tests/module-bundles-smoke.test.js && node scripts/check-client-architecture.mjs
      - name: Commit production migration and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/communication.js
          git diff --cached --quiet || git commit -m 'feat(calendar): add monthly calendar and upcoming view'
          git rm scripts/apply-calendar-month-view.mjs .github/workflows/calendar-month-view-migration.yml
          git commit -m 'chore(calendar): remove completed migration helpers'
          git push origin HEAD:main
