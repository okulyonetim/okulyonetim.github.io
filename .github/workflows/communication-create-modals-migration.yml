name: Communication Create Modals Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-communication-create-modals.mjs'
      - '.github/workflows/communication-create-modals-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded communication UI migration
        run: node scripts/migrate-communication-create-modals.mjs
      - name: Verify communication contracts
        run: |
          node tests/communication-separate-pages.test.js
          node tests/communication-local-first-contract.test.js
          node tests/communication-admin-actions.test.js
          node tests/no-module-internal-tabs.test.js
          node scripts/build-client-bundles.mjs
          node scripts/check-client-architecture.mjs
      - name: Commit production migration and cleanup
        run: |
          rm scripts/migrate-communication-create-modals.mjs .github/workflows/communication-create-modals-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/communication.js scripts/migrate-communication-create-modals.mjs .github/workflows/communication-create-modals-migration.yml
          git commit -m 'feat(communication): restore announcement and poll creation'
          git push
