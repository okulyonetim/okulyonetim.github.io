name: Shell Parity One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-architecture.yml'

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified shell parity
        run: |
          set -euo pipefail
          cat .github/one-shot/ui-shell-0{0,1,2,3,4}.b64 | tr -d '\r\n ' | base64 -d | gzip -d > /tmp/shell-parity.patch
          git apply --check /tmp/shell-parity.patch
          git apply /tmp/shell-parity.patch
          git diff --check
      - name: Verify shell parity
        run: |
          node tests/classic-shell-v2-smoke.test.js
          node tests/web-mobile-engine-separation.test.js
          node tests/module-bundles-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit shell parity application files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/design-system.css tests/classic-shell-v2-smoke.test.js tests/web-mobile-engine-separation.test.js
          git commit -m 'Port reference mobile header and bottom navigation'
          git push origin HEAD:main
