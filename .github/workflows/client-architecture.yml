name: Attendance Visible Parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-architecture.yml'

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified attendance visible parity
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -dc > /tmp/attendance.patch
          git apply --check /tmp/attendance.patch
          git apply /tmp/attendance.patch
          git diff --check
      - name: Verify attendance visible parity
        run: |
          node --check js/modules/tools.js
          node tests/student-tool-routing-smoke.test.js
          node tests/tools-separate-pages.test.js
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/web-mobile-engine-separation.test.js
          node tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit attendance visible parity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/tools.js css/design-system.css tests/student-tool-routing-smoke.test.js
          git commit -m 'Port reference student attendance visible workspace'
          git push origin HEAD:main
