name: Written Exams Parity One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-architecture.yml'

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified Written Exams visible parity
        run: |
          gzip -dc .github/one-shot/written.patch.gz > /tmp/written.patch
          git apply --check /tmp/written.patch
          git apply /tmp/written.patch
          git diff --check
      - name: Verify Written Exams visible parity
        run: |
          node scripts/build-client-bundles.mjs
          node tests/academic-separate-pages.test.js
          node tests/module-bundles-smoke.test.js
          node tests/no-module-internal-tabs.test.js
          node tests/web-mobile-engine-separation.test.js
          node tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit Written Exams visible parity application files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/design-system.css js/modules/academic.js tests/academic-separate-pages.test.js
          git diff --cached --check
          git commit -m 'Port reference Written Exams visible workspace'
          git push origin HEAD:main
