name: Trial Exams Parity One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/one-shot/trial-visible.part-*'
      - '.github/workflows/client-architecture.yml'

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified Trial Exams visible parity
        shell: bash
        run: |
          set -euo pipefail
          cat .github/one-shot/trial-visible.part-* > /tmp/trial-visible.b64
          base64 -d /tmp/trial-visible.b64 > /tmp/trial-visible.patch.gz
          gzip -t /tmp/trial-visible.patch.gz
          gzip -dc /tmp/trial-visible.patch.gz > /tmp/trial-visible.patch
          echo "8ac56bd9b6b648234bdcd51c5dffb89b2ab40c3c4bb2d8fed0b6d877e6daf21b  /tmp/trial-visible.patch" | sha256sum -c -
          git apply --check /tmp/trial-visible.patch
          git apply /tmp/trial-visible.patch
          git diff --check
      - name: Verify Trial Exams visible parity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-client-bundles.mjs
          node --check js/modules/academic.js
          node tests/academic-separate-pages.test.js
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/no-module-internal-tabs.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/report-engine-a4-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit Trial Exams visible parity application files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/academic.js css/design-system.css tests/academic-separate-pages.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Port reference Trial Exams and live counter visible workspace'
          git push origin HEAD:main
