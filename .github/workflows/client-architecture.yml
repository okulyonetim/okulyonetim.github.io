name: Apply rubric CSS redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-architecture.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply central CSS redesign from validated parent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          marker='/* ===== RUBRIC / EXAM WORKSPACE REDESIGN 2026-09-05 ===== */'
          css=Path('css/design-system.css')
          current=css.read_text(encoding='utf-8')
          if marker in current:
              raise SystemExit('Rubric redesign marker already exists')
          prev=subprocess.check_output(['git','show','HEAD^:.github/workflows/client-architecture.yml'],text=True)
          needle='          '+marker
          start=prev.index(needle)
          end=prev.index('\n          CSS',start)
          raw=prev[start:end]
          lines=raw.splitlines()
          block='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          updated=current.rstrip()+'\n\n'+block+'\n'
          if updated.count('{') != updated.count('}'):
              raise SystemExit('CSS brace balance check failed')
          css.write_text(updated,encoding='utf-8')
          PY
      - name: Verify rubric contracts
        run: |
          node tests/rubric-tools-v2-smoke.test.js
          node tests/rubric-settings-v2-smoke.test.js
          node tests/rubric-legacy-retirement-readiness.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit central CSS only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/design-system.css
          git diff --cached --check
          git commit -m 'style: redesign rubric workspace and exam menu'
          git push
