name: Exam Results Parity One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/one-shot/results-visible.part-*'
      - '.github/workflows/client-architecture.yml'

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified Exam Results visible parity
        shell: bash
        run: |
          set -euo pipefail
          cat .github/one-shot/results-visible.part-* > /tmp/results-visible.b64
          base64 -d /tmp/results-visible.b64 > /tmp/results-visible.patch.gz
          gzip -t /tmp/results-visible.patch.gz
          gzip -dc /tmp/results-visible.patch.gz > /tmp/results-visible.patch
          echo "ed63345b725bc02b39b15a6f0847db87ecb3e55491b1bea5dfd3be27fc0780db  /tmp/results-visible.patch" | sha256sum -c -
          git apply --check /tmp/results-visible.patch
          git apply /tmp/results-visible.patch
          git diff --check
      - name: Verify Exam Results visible parity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-client-bundles.mjs
          node --check js/modules/academic.js
          node tests/academic-separate-pages.test.js
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/no-module-internal-tabs.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/report-engine-a4-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit Exam Results visible parity application files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/academic.js css/design-system.css tests/academic-separate-pages.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Port reference Exam Results list and detail workspace'
          git push origin HEAD:main
