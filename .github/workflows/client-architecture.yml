name: Teacher Dashboard Startup Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-architecture.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply canonical teacher dashboard startup fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/app-loader.js')
          s=p.read_text()
          old="function moduleLevel(name){const direct=rawPermissionLevel('module.'+name),{role}=permissionSession();if(direct)return direct;return role?.yetkiler&&Object.keys(role.yetkiler).length?'hidden':'edit'}"
          new="function moduleLevel(name){const direct=rawPermissionLevel('module.'+name),{user,role}=permissionSession();if(direct)return direct;if(name==='dashboard'&&user?.uid)return'read';return role?.yetkiler&&Object.keys(role.yetkiler).length?'hidden':'edit'}"
          assert old in s, 'moduleLevel source changed'
          s=s.replace(old,new,1)
          old2="async function ensureInitialModule(){if(initialRequested)return;initialRequested=true;const cfg=appConfig();let name=cfg.defaultModule||'dashboard';if(moduleMeta(name).visible===false||moduleLevel(name)==='hidden')name=cfg.modules.find(m=>m.visible!==false&&moduleLevel(m.key)!=='hidden')?.key||'dashboard';setActiveModule(name);document.getElementById('v2ModuleTitle').textContent=moduleMeta(name).label||name;await load(name).catch(e=>console.warn('[InitialModule]',e?.message||e))}"
          new2="async function ensureInitialModule(){if(initialRequested)return true;initialRequested=true;const cfg=appConfig();let name=cfg.defaultModule||'dashboard';if(moduleMeta(name).visible===false||moduleLevel(name)==='hidden')name=cfg.modules.find(m=>m.visible!==false&&moduleLevel(m.key)!=='hidden')?.key||'dashboard';const open=async target=>{setActiveModule(target);const title=document.getElementById('v2ModuleTitle');if(title)title.textContent=moduleMeta(target).label||target;await load(target);return true};try{return await open(name)}catch(e){console.warn('[InitialModule]',e?.message||e);if(name!=='dashboard'&&moduleMeta('dashboard').visible!==false&&moduleLevel('dashboard')!=='hidden'){try{return await open('dashboard')}catch(fallbackError){console.warn('[InitialDashboard]',fallbackError?.message||fallbackError)}}initialRequested=false;const root=document.getElementById('v2ModuleRoot');if(root)root.innerHTML='<section class=\"ka-card\"><div class=\"ka-card__body\"><strong>Ana sayfa açılamadı.</strong><div class=\"ka-muted\">Uygulama verileri hazır olduğunda yeniden deneyin.</div></div></section>';return false}}"
          assert old2 in s, 'ensureInitialModule source changed'
          p.write_text(s.replace(old2,new2,1))
          PY
          git diff --check
      - name: Verify teacher dashboard startup and architecture contracts
        run: |
          node --check js/app-loader.js
          grep -F "if(name==='dashboard'&&user?.uid)return'read'" js/app-loader.js
          grep -F "initialRequested=false;const root=document.getElementById('v2ModuleRoot')" js/app-loader.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit teacher dashboard startup fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app-loader.js
          git commit -m 'Fix teacher dashboard startup for legacy roles'
          git push origin HEAD:main
