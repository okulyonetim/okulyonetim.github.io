name: Visible Home Parity One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-architecture.yml'

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified visible home parity
        run: |
          set -euo pipefail
          cat .github/one-shot/ui-home-0{0,1,2,3,4,5,6}.b64 | tr -d '\r\n ' | base64 -d | gzip -d > /tmp/ui-parity.patch
          git apply -p1 --check /tmp/ui-parity.patch
          git apply -p1 /tmp/ui-parity.patch
          git diff --check
      - name: Verify visible home parity
        run: |
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-quick-actions.test.js
          node tests/dashboard-reminders-smoke.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/web-mobile-engine-separation.test.js
          node tests/module-bundles-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit visible parity and clean staging
        run: |
          set -euo pipefail
          git show c20257c80d61f68d78e6b943c4fe1367c11a4c4d:.github/workflows/client-architecture.yml > .github/workflows/client-architecture.yml
          rm -rf .github/one-shot
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A css/design-system.css js/modules/dashboard.js js/modules/school-live-status.js tests/dashboard-card-routes-smoke.test.js tests/classic-shell-v2-smoke.test.js .github
          git commit -m 'Port reference home, live bell and weather surfaces'
          git push origin HEAD:main
