name: Duty Lesson Parity One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-architecture.yml'

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified Duty and Lesson Schedule visible parity
        run: |
          cat .github/one-shot/program-00 .github/one-shot/program-01 .github/one-shot/program-02 .github/one-shot/program-03 .github/one-shot/program-04a .github/one-shot/program-04b .github/one-shot/program-05 .github/one-shot/program-06 .github/one-shot/program-07 .github/one-shot/program-08 .github/one-shot/program-09 .github/one-shot/program-10 .github/one-shot/program-11 .github/one-shot/program-12 > /tmp/program.b64
          base64 -d /tmp/program.b64 > /tmp/program.patch.gz
          gzip -dc /tmp/program.patch.gz > /tmp/program.patch
          git apply --check /tmp/program.patch
          git apply /tmp/program.patch
          git diff --check
      - name: Verify Duty and Lesson Schedule visible parity
        run: |
          node scripts/build-client-bundles.mjs
          node tests/classic-duty-v2-smoke.test.js
          node tests/classic-schedule-v2-smoke.test.js
          node tests/academic-separate-pages.test.js
          node tests/management-separate-pages.test.js
          node tests/module-bundles-smoke.test.js
          node tests/no-module-internal-tabs.test.js
          node tests/web-mobile-engine-separation.test.js
          node tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit Duty and Lesson Schedule visible parity application files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/design-system.css js/modules/academic.js js/modules/management.js tests/classic-duty-v2-smoke.test.js tests/classic-schedule-v2-smoke.test.js
          git diff --cached --check
          git commit -m 'Port reference mobile Duty and Lesson Schedule surfaces'
          git push origin HEAD:main
