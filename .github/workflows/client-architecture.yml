name: Client Architecture

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'service-worker.js'
      - 'firestore.rules'
      - 'android/app/src/main/java/com/koruk/okul/**'
      - 'scripts/build-client-bundles.mjs'
      - 'scripts/check-client-architecture.mjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/client-architecture.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'service-worker.js'
      - 'firestore.rules'
      - 'android/app/src/main/java/com/koruk/okul/**'
      - 'scripts/build-client-bundles.mjs'
      - 'scripts/check-client-architecture.mjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/client-architecture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply requested puantaj and diploma layout changes
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/puantaj-report-polish'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected pattern: {label}')
              return text.replace(old, new, 1)

          p=Path('js/modules/management.js')
          s=p.read_text(encoding='utf-8')
          old="function ptDonemBasligi(){const bas=ptParseIso(ptState.baslangic),bit=ptParseIso(ptState.bitis);if(!bas||!bit)return'Dönem seçilmedi';if(bas.getFullYear()===bit.getFullYear()&&bas.getMonth()===bit.getMonth())return`${AYISIM[bas.getMonth()]} ${bas.getFullYear()}`;return`${ptTarih(bas)} – ${ptTarih(bit)}`}"
          s=must_replace(s,old,old+"\nfunction ptPuantajAyBasligi(){const bas=ptParseIso(ptState.baslangic),bit=ptParseIso(ptState.bitis);if(!bas||!bit)return'';const ilk=AYISIM[bas.getMonth()].toLocaleUpperCase('tr'),son=AYISIM[bit.getMonth()].toLocaleUpperCase('tr');return ilk===son?ilk:`${ilk} - ${son}`}",'month helper')
          s=must_replace(s,"let blanks='';for(let i=2;i<=10;i++)blanks+=`<tr><td>${i}</td><td class=\"name\"></td><td></td>${'<td></td>'.repeat(gunler.length+10)}</tr>`;","let blanks='';for(let i=2;i<=10;i++)blanks+=`<tr><td>${i}</td><td class=\"name\"></td><td></td>${'<td></td>'.repeat(gunler.length)}${'<td class=\"summary-cell\"></td>'.repeat(10)}</tr>`;",'blank summary cells')
          s=must_replace(s,".payroll th{height:105px;padding:0 0 4px;background:#f2f2f2;vertical-align:bottom;font-size:7pt}.payroll th>span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}.payroll th.no{width:4.5mm}.payroll th.name{width:34mm;text-align:left}.payroll th.tc{width:17mm}.payroll th.day{width:5mm}.payroll th.summary{width:5.5mm}.payroll td{height:6mm;padding:1px 2px;font-size:7.5pt;font-weight:700}",".payroll th{height:118px;padding:0 0 4px;background:#fff;vertical-align:bottom;font-size:7pt}.payroll th>span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}.payroll th.no{width:4.5mm}.payroll th.name{width:34mm;text-align:left}.payroll th.tc{width:17mm}.payroll th.day{width:5mm}.payroll th.summary{width:6mm;background:#e8f0ee;font-size:5.8pt;padding:2px 0}.payroll th.summary>span{line-height:1;max-height:110px}.payroll td{height:6mm;padding:1px 2px;font-size:7.5pt;font-weight:700}.payroll td.summary-cell{background:#e8f0ee}",'summary styling')
          s=must_replace(s,"const period=ptDonemBasligi().toLocaleUpperCase('tr'),year=ptParseIso(ptState.baslangic)?.getFullYear()||''","const period=ptPuantajAyBasligi(),year=ptParseIso(ptState.baslangic)?.getFullYear()||''",'period source')
          s=must_replace(s,"AY: ${esc(period.replace(String(year),'').trim())}","AY: ${esc(period)}",'period output')
          s=must_replace(s,"<td>${sayim.X}</td><td>${sayim.H}</td><td>${sayim.T}</td><td>${sayim.Y}</td><td>${sayim.M}</td><td>${sayim.R}</td><td>${sayim['CÇ']}</td><td>${sayim['PÇ']}</td><td>${sayim.UBGT}</td><td>${toplam}</td>","<td class=\"summary-cell\">${sayim.X}</td><td class=\"summary-cell\">${sayim.H}</td><td class=\"summary-cell\">${sayim.T}</td><td class=\"summary-cell\">${sayim.Y}</td><td class=\"summary-cell\">${sayim.M}</td><td class=\"summary-cell\">${sayim.R}</td><td class=\"summary-cell\">${sayim['CÇ']}</td><td class=\"summary-cell\">${sayim['PÇ']}</td><td class=\"summary-cell\">${sayim.UBGT}</td><td class=\"summary-cell\">${toplam}</td>",'summary data cells')
          p.write_text(s,encoding='utf-8')

          p=Path('js/modules/personnel-documents.js')
          s=p.read_text(encoding='utf-8')
          s=must_replace(s,".pd-info{width:auto!important;margin:0 0 8mm;border-collapse:collapse!important}.pd-info td{border:0!important;background:#fff!important;color:#000!important;font-size:12pt!important;padding:1.2mm 0!important;vertical-align:top!important}.pd-info td:first-child{font-weight:700;padding-right:6mm!important;white-space:nowrap}.pd-info td:nth-child(2){padding-right:4mm!important}",".pd-info{width:auto!important;margin:0 0 8mm;border-collapse:collapse!important;table-layout:auto!important}.pd-info td{border:0!important;background:#fff!important;color:#000!important;font-size:12pt!important;padding:1.2mm 0!important;vertical-align:top!important}.pd-info td:first-child{width:45mm!important;max-width:45mm!important;font-weight:700;padding-right:2mm!important;white-space:nowrap}.pd-info td:nth-child(2){width:4mm!important;padding-right:2mm!important;text-align:center!important}.pd-info td:nth-child(3){width:auto!important;white-space:nowrap!important}",'diploma spacing')
          p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=must_replace(s,"const CACHE_ADI='oy-cache-v937';","const CACHE_ADI='oy-cache-v938';",'cache version')
          p.write_text(s,encoding='utf-8')

          for p in Path('tests').rglob('*.js'):
              s=p.read_text(encoding='utf-8')
              if 'oy-cache-v937' in s:
                  p.write_text(s.replace('oy-cache-v937','oy-cache-v938'),encoding='utf-8')

          p=Path('tests/personnel-payroll-signature-parity.test.js')
          s=p.read_text(encoding='utf-8')
          marker="assert(!classic.includes('decoratePuantaj')&&!classic.includes('puantajTablosu'),'Classic parite puantajı DOM yamalarıyla yeniden sahiplenmemeli.');"
          extra="assert(management.includes('function ptPuantajAyBasligi()')&&management.includes('return ilk===son?ilk:`${ilk} - ${son}`'),'Puantaj AY alanı tarih aralığı yerine ay adlarını üretmeli.');\nassert(management.includes('.payroll th{height:118px;padding:0 0 4px;background:#fff'),'Tarih sütunları renksiz/beyaz kalmalı.');\nassert(management.includes('.payroll th.summary{width:6mm;background:#e8f0ee')&&management.includes('.payroll td.summary-cell{background:#e8f0ee}'),'Tarihlerden sonraki özet sütunlarının tamamı tek ortak renkte olmalı.');\nassert(management.includes('writing-mode:vertical-rl')&&management.includes('transform:rotate(180deg)'),'Özet başlıkların dikey metin yönü korunmalı.');\n"+marker
          s=must_replace(s,marker,extra,'payroll regression')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/personnel-documents-focus-smoke.test.js')
          s=p.read_text(encoding='utf-8')
          marker="assert(src.includes('ReportEngine.printReport(title,body'),'Resmî çıktı merkezi ReportEngine üzerinden kalmalı.');"
          s=must_replace(s,marker,marker+"\nassert(src.includes('.pd-info td:first-child{width:45mm!important;max-width:45mm!important')&&src.includes('.pd-info td:nth-child(2){width:4mm!important;padding-right:2mm!important'),'Diploma talep çıktısında etiket, iki nokta ve veri alanı birbirine yakın tutulmalı.');",'diploma regression')
          p.write_text(s,encoding='utf-8')
          PY
          git checkout origin/main -- .github/workflows/client-architecture.yml
          node --check js/modules/management.js
          node --check js/modules/personnel-documents.js
          node tests/personnel-payroll-signature-parity.test.js
          node tests/personnel-documents-focus-smoke.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/management.js js/modules/personnel-documents.js service-worker.js tests .github/workflows/client-architecture.yml
          git commit -m "fix: polish puantaj and diploma print layouts"
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check all client JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build client bundles
        run: node scripts/build-client-bundles.mjs
      - name: Upload consolidation source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: consolidation-source-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            index.html
            service-worker.js
            css/design-system.css
            js/**
            scripts/**
            tests/**
            package.json
      - name: Verify module bundle contracts
        run: node tests/module-bundles-smoke.test.js
      - name: Enforce V2 module local-first boundary
        run: node tests/modules-local-first-boundary.test.js
      - name: Verify service worker shell
        run: node tests/service-worker-precache-smoke.test.js
      - name: Check login security syntax
        run: node --check js/core/login-security.js
      - name: Verify profile security
        run: node tests/profile-page-redesign.test.js
      - name: Verify admin user statistics and login locations
        run: node tests/user-statistics-admin-view.test.js
      - name: Check meeting schedule syntax
        run: node --check js/modules/meeting-schedule.js
      - name: Check dashboard syntax
        run: node --check js/modules/dashboard.js
      - name: Verify meeting schedule
        run: node tests/meeting-schedule-v1-smoke.test.js
      - name: Verify Diploma form focus
        run: node tests/personnel-documents-focus-smoke.test.js
      - name: Verify lazy Firebase Storage startup
        run: node tests/lazy-firebase-storage-smoke.test.js
      - name: Verify Android iOS web responsive shell
        run: node tests/web-mobile-engine-separation.test.js
      - name: Verify rebuilt classic shell
        run: node tests/classic-shell-v2-smoke.test.js
      - name: Verify classic People layouts
        run: node tests/classic-people-v2-smoke.test.js
      - name: Verify Classes mobile parity and seating
        run: node tests/classes-mobile-parity-smoke.test.js
      - name: Verify classic Duty layout
        run: node tests/classic-duty-v2-smoke.test.js
      - name: Verify classic Lesson Schedule
        run: node tests/classic-schedule-v2-smoke.test.js
      - name: Verify dashboard card routes
        run: node tests/dashboard-card-routes-smoke.test.js
      - name: Verify dashboard direct quick actions
        run: node tests/dashboard-quick-actions.test.js
      - name: Verify monthly calendar view
        run: node tests/calendar-month-view.test.js
      - name: Verify quick-note launcher
        run: node tests/quick-note-launcher.test.js
      - name: Verify communication admin actions
        run: node tests/communication-admin-actions.test.js
      - name: Verify transport separate-page routing
        run: node tests/transport-separate-pages.test.js
      - name: Forbid module internal tab navigation
        run: node tests/no-module-internal-tabs.test.js
      - name: Verify report A4 preview and print
        run: node tests/report-engine-a4-smoke.test.js
      - name: Verify report native/web routing
        run: node tests/report-native-print-routing-smoke.test.js
      - name: Verify Android PrintPlugin
        run: node tests/android-print-plugin-smoke.test.js
      - name: Verify Android pull-to-refresh guard
        run: node tests/android-pull-refresh-guard.test.js
      - name: Verify offline activation stability
        run: node tests/service-worker-no-forced-reload.test.js
      - name: Verify dashboard reminder engine
        run: node tests/dashboard-reminders-smoke.test.js
      - name: Verify teacher list core contract
        run: node tests/teacher-list-core-contract.test.js
      - name: Verify teacher list local-first service
        run: node tests/teacher-list-local-first-service.test.js
      - name: Verify canonical student tool routing
        run: node tests/student-tool-routing-smoke.test.js
      - name: Verify People separate page routing
        run: node tests/people-separate-pages.test.js
      - name: Verify Academic separate page routing
        run: node tests/academic-separate-pages.test.js
      - name: Verify Management separate page routing
        run: node tests/management-separate-pages.test.js
      - name: Verify Communication separate page routing
        run: node tests/communication-separate-pages.test.js
      - name: Verify Settings separate page routing
        run: node tests/settings-separate-pages.test.js
      - name: Verify Tools separate page routing
        run: node tests/tools-separate-pages.test.js
      - name: Verify communication local-first contract
        run: node tests/communication-local-first-contract.test.js
      - name: Verify retired legacy roots
        run: node tests/retired-legacy-roots-smoke.test.js
      - name: Verify root JavaScript inventory
        run: node tests/root-js-inventory-smoke.test.js
      - name: Verify native widget platform adapter
        run: node tests/widget-platform-adapter-smoke.test.js
      - name: Verify V2 teblig-tebellug form
        run: node tests/teblig-v2-smoke.test.js
      - name: Verify Documents V2 document viewer
        run: node tests/documents-viewer-v2-smoke.test.js
      - name: Verify document viewer engine
        run: node tests/document-viewer-smoke.test.js
      - name: Verify lazy document libraries
        run: node tests/lazy-document-libs-smoke.test.js
      - name: Verify V2 payroll change form
        run: node tests/payroll-change-v2-smoke.test.js
      - name: Verify V2 AI assistant
        run: node tests/assistant-v2-smoke.test.js
      - name: Verify V2 legislation engine
        run: node tests/legislation-engine-v2-smoke.test.js
      - name: Verify consolidated map adapter
        run: node tests/map-consolidation-smoke.test.js
      - name: Verify rubric/project Tools bridge
        run: node tests/rubric-tools-v2-smoke.test.js
      - name: Verify local-first rubric settings
        run: node tests/rubric-settings-v2-smoke.test.js
      - name: Verify rubric legacy retirement readiness
        run: node tests/rubric-legacy-retirement-readiness.test.js
      - name: Verify PWA background push
        run: node tests/pwa-push-smoke.test.js
      - name: Run complete client regression suite
        run: node scripts/run-client-tests.mjs
      - name: Audit client architecture
        run: node scripts/check-client-architecture.mjs
      - name: Show generated bundle sizes
        run: cat dist/js/manifest.json
