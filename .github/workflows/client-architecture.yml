name: Students Single Render One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-architecture.yml'

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified Students single-render patch
        run: |
          set -euo pipefail
          cat .github/one-shot/students-0{0,1,2,3}.b64 | tr -d '\r\n ' | base64 -d | gzip -d > /tmp/students.patch
          git apply -p1 --check /tmp/students.patch
          git apply -p1 /tmp/students.patch
          git diff --check
      - name: Verify Students visible parity and single ownership
        run: |
          node tests/classic-people-v2-smoke.test.js
          node tests/people-separate-pages.test.js
          node tests/classes-mobile-parity-smoke.test.js
          node tests/student-tool-routing-smoke.test.js
          node tests/module-bundles-smoke.test.js
          node tests/web-mobile-engine-separation.test.js
          node tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit Students single-render application files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/people.js js/modules/people-classic-ui.js js/modules/classes-mobile-parity.js tests/classic-people-v2-smoke.test.js
          git commit -m 'Use canonical modern Students renderer as the single visible owner'
          git push origin HEAD:main
