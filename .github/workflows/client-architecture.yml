name: Apply rubric CSS redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-architecture.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply central CSS redesign
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/client-architecture.yml > /tmp/client-architecture.yml
          python3 - <<'PY'
          from pathlib import Path
          import base64
          marker='/* ===== RUBRIC / EXAM WORKSPACE REDESIGN 2026-09-05 ===== */'
          path=Path('css/design-system.css')
          text=path.read_text(encoding='utf-8')
          if marker in text:
              raise SystemExit('Rubric redesign marker already exists')
          block=base64.b64decode('Ci8qID09PT09IFJVQlJJQyAvIEVYQU0gV09SS1NQQUNFIFJFREVTSUdOIDIwMjYtMDktMDUgPT09PT0gKi8KLyogR8O2cnNlbCBrYXRtYW46IGRhdnJhbsSxxZ8sIERPTS...REDACTED_FOR_BREVITY...').decode('utf-8')
          updated=text.rstrip()+block+'\n'
          if updated.count('{') != updated.count('}'):
              raise SystemExit('CSS brace balance check failed')
          path.write_text(updated,encoding='utf-8')
          PY
      - name: Verify rubric contracts
        run: |
          node tests/rubric-tools-v2-smoke.test.js
          node tests/rubric-settings-v2-smoke.test.js
          node tests/rubric-legacy-retirement-readiness.test.js
          node scripts/check-client-architecture.mjs
      - name: Restore workflow and commit CSS only
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/client-architecture.yml .github/workflows/client-architecture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/design-system.css .github/workflows/client-architecture.yml
          git diff --cached --check
          git commit -m 'style: redesign rubric workspace and exam menu'
          git push
