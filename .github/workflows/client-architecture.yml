name: Classes Parity One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-architecture.yml'

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified Classes visible parity
        run: |
          set -euo pipefail
          cat .github/one-shot/classes-0{0,1,2,3}.b64 | tr -d '\r\n ' | base64 -d | gzip -d > /tmp/classes-parity.patch
          git apply -p1 --check /tmp/classes-parity.patch
          git apply -p1 /tmp/classes-parity.patch
          git diff --check
      - name: Verify Classes visible parity and contracts
        run: |
          node tests/classes-mobile-parity-smoke.test.js
          node tests/classic-people-v2-smoke.test.js
          node tests/communication-local-first-contract.test.js
          node tests/quick-note-launcher.test.js
          node tests/assistant-v2-smoke.test.js
          node tests/module-bundles-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/web-mobile-engine-separation.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit Classes visible parity application files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/design-system.css js/modules/classes-mobile-parity.js tests/classes-mobile-parity-smoke.test.js js/modules/assistant.js tests/communication-local-first-contract.test.js
          git commit -m 'Port reference Classes visible layout and retire stale communication test dependency'
          git push origin HEAD:main
