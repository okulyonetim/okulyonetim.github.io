name: Rubric Project Visible Parity One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/one-shot/rubric-part-*.txt'
      - '.github/workflows/client-architecture.yml'

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified Rubric and Project visible parity
        run: |
          cat .github/one-shot/rubric-part-*.txt | base64 -d | gzip -dc > /tmp/rubric-visible.patch
          git apply --check /tmp/rubric-visible.patch
          git apply /tmp/rubric-visible.patch
          git diff --check
      - name: Verify Rubric and Project visible parity
        run: |
          node --check js/modules/rubric-tools.js
          node --check js/modules/rubric-tools-engine.js
          node tests/rubric-tools-v2-smoke.test.js
          node tests/rubric-settings-v2-smoke.test.js
          node tests/rubric-legacy-retirement-readiness.test.js
          node tests/tools-separate-pages.test.js
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/no-module-internal-tabs.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/web-mobile-engine-separation.test.js
          node tests/report-engine-a4-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit Rubric and Project visible parity application files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/design-system.css js/modules/rubric-tools.js js/modules/rubric-tools-engine.js tests/rubric-tools-v2-smoke.test.js tests/rubric-legacy-retirement-readiness.test.js
          git commit -m 'Port reference Rubric and Project visible workspaces without observer patches'
          git push origin HEAD:main
