name: Annual Plan Parity One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-architecture.yml'

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified Annual Plan visible parity
        run: |
          cat .github/one-shot/annual-00 .github/one-shot/annual-01 .github/one-shot/annual-02 .github/one-shot/annual-03 .github/one-shot/annual-04 > /tmp/annual.b64
          base64 -d /tmp/annual.b64 > /tmp/annual.patch.gz
          gzip -dc /tmp/annual.patch.gz > /tmp/annual.patch
          git apply --check /tmp/annual.patch
          git apply /tmp/annual.patch
          git diff --check
      - name: Verify Annual Plan visible parity
        run: |
          node scripts/build-client-bundles.mjs
          node tests/academic-separate-pages.test.js
          node tests/classic-schedule-v2-smoke.test.js
          node tests/module-bundles-smoke.test.js
          node tests/no-module-internal-tabs.test.js
          node tests/web-mobile-engine-separation.test.js
          node tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit Annual Plan visible parity application files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/design-system.css js/modules/academic.js tests/academic-separate-pages.test.js
          git diff --cached --check
          git commit -m 'Port reference full-screen Annual Plan workspace'
          git push origin HEAD:main
