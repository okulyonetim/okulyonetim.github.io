# temporary verified migration workflow
name: User statistics redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/user-statistics-redesign.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12

      - name: Verify staged base
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="9eb68ff057324706b2966f1cfc6be6843e1d3953"
          git merge-base --is-ancestor "$EXPECTED" HEAD

      - name: Patch helper matcher
        run: python scripts/tmp-patch-user-stat-helper.py

      - name: Apply admin statistics redesign
        run: python scripts/tmp-user-statistics-redesign.py

      - name: Align central cache contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); t=p.read_text(encoding='utf-8'); t=re.sub(r'css/design-system\.css\?v=\d+', 'css/design-system.css?v=866', t); p.write_text(t,encoding='utf-8')
          p=Path('service-worker.js'); t=p.read_text(encoding='utf-8'); t=re.sub(r"const CACHE_ADI='oy-cache-v\d+'", "const CACHE_ADI='oy-cache-v866'", t); t=re.sub(r'\./css/design-system\.css\?v=\d+', './css/design-system.css?v=866', t); p.write_text(t,encoding='utf-8')
          for p in Path('tests').glob('*.test.js'):
              t=p.read_text(encoding='utf-8').replace('css/design-system.css?v=865','css/design-system.css?v=866').replace("oy-cache-v865","oy-cache-v866")
              p.write_text(t,encoding='utf-8')
          PY

      - name: Validate statistics and architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check js/modules/settings.js
          node --check js/auth.js
          node --check service-worker.js
          node tests/user-statistics-admin-view.test.js
          node tests/settings-separate-pages.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/profile-page-redesign.test.js
          node tests/notification-popover-redesign.test.js
          node tests/search-page-redesign.test.js
          node tests/web-mobile-engine-separation.test.js

      - name: Commit verified admin statistics redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/settings.js js/auth.js css/design-system.css index.html service-worker.js tests/*.test.js
          git commit -m "feat: redesign admin user statistics"
          git push origin main
