name: migrate-dashboard-runtime-stability
on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-dashboard-runtime-stability.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply dashboard runtime stability fixes
        run: python scripts/migrate-dashboard-runtime-stability.py
      - name: Syntax checks
        run: |
          node --check js/modules/dashboard.js
          node --check js/auth.js
          node --check js/app-loader.js
      - name: Dashboard checks
        run: |
          node tests/dashboard-card-routes-smoke.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/dashboard-reminders-smoke.test.js
      - name: Architecture checks
        run: node scripts/check-client-architecture.mjs
      - name: Cleanup temporary migration files
        run: rm -f scripts/migrate-dashboard-runtime-stability.py .github/workflows/migrate-dashboard-runtime-stability.yml
      - name: Commit production migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(dashboard): stabilize auth ticker and live bell'
          git push
