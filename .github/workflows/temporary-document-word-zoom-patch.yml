name: Temporary Document Word Zoom Patch

on:
  push:
    branches:
      - agent/document-viewer-fit-zoom

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/document-viewer-fit-zoom
          fetch-depth: 0

      - name: Word tam sayfa ve zoom düzeltmesini uygula
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('js/dokuman-okuyucu.js')
          s = p.read_text(encoding='utf-8')

          old_style = ".dv3word{padding:10px;display:flex;justify-content:center}.dv3word .docx-wrapper{padding:10px!important;background:#cfd3d7!important}"
          new_style = ".dv3wordtools{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px;background:#20262d;border-bottom:1px solid #46505b}.dv3wordtools button{min-width:40px}.dv3word{padding:10px;display:block;min-width:100%;overflow:visible}.dv3wordstage{transform-origin:top left;width:max-content;min-width:100%}.dv3word .docx-wrapper{padding:10px!important;background:#cfd3d7!important;align-items:flex-start!important;justify-content:flex-start!important;min-width:max-content!important}.dv3word section.docx{margin-left:0!important;margin-right:0!important}"
          if old_style not in s:
              raise SystemExit('Word CSS hedefi bulunamadı')
          s = s.replace(old_style, new_style, 1)

          old_state = "let A=null,pdf=null,wb=null;"
          new_state = "let A=null,pdf=null,wb=null,wordZoom=1;"
          if old_state not in s:
              raise SystemExit('Viewer state hedefi bulunamadı')
          s = s.replace(old_state, new_state, 1)

          old_render = "async function renderDocx(buf){status('Word belgesi hazırlanıyor…');try{await docxReady();A.body.innerHTML='<div class=\"dv3word\"><div id=\"dv3word\"></div></div>';await docx.renderAsync(buf,A.body.querySelector('#dv3word'),null,{inWrapper:true,breakPages:true,ignoreWidth:false,ignoreHeight:false,ignoreFonts:false,renderHeaders:true,renderFooters:true,renderFootnotes:true,ignoreLastRenderedPageBreak:false,useBase64URL:true});}catch(e){fail('Word belgesi görüntülenemedi.',e.message);}}"
          new_render = "function wordZoomUygula(z){if(!A)return;const st=A.body.querySelector('#dv3wordStage');if(!st)return;wordZoom=Math.max(0.25,Math.min(3,z));st.style.zoom=wordZoom;const l=A.body.querySelector('#dv3wordZoomLabel');if(l)l.textContent=Math.round(wordZoom*100)+'%';}function wordSigdir(){if(!A)return;const st=A.body.querySelector('#dv3wordStage'),sayfa=A.body.querySelector('#dv3word section.docx');if(!st||!sayfa)return;st.style.zoom=1;const uygunW=Math.max(240,A.body.clientWidth-24),uygunH=Math.max(240,A.body.clientHeight-72),w=sayfa.offsetWidth||sayfa.scrollWidth||1,h=sayfa.offsetHeight||sayfa.scrollHeight||1;wordZoomUygula(Math.max(0.25,Math.min(1,uygunW/w,uygunH/h)));A.body.scrollTo({left:0,top:0,behavior:'auto'});}async function renderDocx(buf){status('Word belgesi hazırlanıyor…');try{await docxReady();A.body.innerHTML='<div class=\"dv3wordtools\"><button class=\"dv3btn\" id=\"dv3wordMinus\">−</button><button class=\"dv3btn\" id=\"dv3wordFit\">Sığdır</button><span id=\"dv3wordZoomLabel\" style=\"min-width:48px;text-align:center;font-weight:700\">100%</span><button class=\"dv3btn\" id=\"dv3wordPlus\">+</button></div><div class=\"dv3word\"><div class=\"dv3wordstage\" id=\"dv3wordStage\"><div id=\"dv3word\"></div></div></div>';await docx.renderAsync(buf,A.body.querySelector('#dv3word'),null,{inWrapper:true,breakPages:true,ignoreWidth:false,ignoreHeight:false,ignoreFonts:false,renderHeaders:true,renderFooters:true,renderFootnotes:true,ignoreLastRenderedPageBreak:false,useBase64URL:true});A.body.querySelector('#dv3wordMinus').onclick=()=>wordZoomUygula(wordZoom-0.15);A.body.querySelector('#dv3wordPlus').onclick=()=>wordZoomUygula(wordZoom+0.15);A.body.querySelector('#dv3wordFit').onclick=wordSigdir;requestAnimationFrame(()=>requestAnimationFrame(wordSigdir));}catch(e){fail('Word belgesi görüntülenemedi.',e.message);}}"
          if old_render not in s:
              raise SystemExit('renderDocx hedefi bulunamadı')
          s = s.replace(old_render, new_render, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('tests/document-viewer-smoke.test.js')
          ts = t.read_text(encoding='utf-8')
          marker = "assert(src.includes('docx.renderAsync'), 'DOCX için docx-preview kullanılmalı.');\n"
          extra = "assert(src.includes('wordSigdir'), 'Word görüntüleyicide tam sayfaya sığdırma bulunmalı.');\nassert(src.includes('dv3wordZoomLabel'), 'Word görüntüleyicide zoom göstergesi bulunmalı.');\nassert(src.includes('wordZoomUygula'), 'Word görüntüleyicide yakınlaştırma/uzaklaştırma bulunmalı.');\nassert(src.includes('align-items:flex-start!important'), 'Geniş Word sayfasının sol kenarı kesilmemeli.');\n"
          if extra not in ts:
              if marker not in ts:
                  raise SystemExit('Test ekleme noktası bulunamadı')
              ts = ts.replace(marker, marker + extra, 1)
          t.write_text(ts, encoding='utf-8')

          # Eski cache'in belge görüntüleyiciyi tutmaması için sürüm bump.
          sw = Path('service-worker.js')
          if sw.exists():
              w = sw.read_text(encoding='utf-8')
              import re
              m = re.search(r"(CACHE_NAME\s*=\s*['\"][^'\"]*?v)(\d+)(['\"])", w)
              if m:
                  yeni = str(int(m.group(2)) + 1)
                  w = w[:m.start(2)] + yeni + w[m.end(2):]
                  sw.write_text(w, encoding='utf-8')
          PY

          node --check js/dokuman-okuyucu.js
          node tests/document-viewer-smoke.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-document-word-zoom-patch.yml
          git add js/dokuman-okuyucu.js tests/document-viewer-smoke.test.js service-worker.js
          git commit -m "Word görüntüleyicide tam sayfa ve zoom desteği ekle [skip ci]"
          git push origin HEAD:agent/document-viewer-fit-zoom
