name: Audit live exam runtime

on:
  push:
    branches:
      - audit/live-exam-runtime-20260901

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployed GitHub Pages assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://sedonet23.github.io/okul'
          TS="$(date +%s)"
          curl -fsSL -D /tmp/plain.headers "$BASE/index.html" -o /tmp/plain.html
          curl -fsSL -D /tmp/fresh.headers "$BASE/index.html?audit=$TS" -o /tmp/fresh.html
          curl -fsSL "$BASE/css/design-system.css" -o /tmp/plain.css
          curl -fsSL "$BASE/js/app-loader.js" -o /tmp/plain-loader.js
          curl -fsSL "$BASE/js/modules/academic.js" -o /tmp/plain-academic.js
          echo '--- PLAIN INDEX HEADERS ---'
          sed -n '1,25p' /tmp/plain.headers
          echo '--- CACHE-BUSTED INDEX HEADERS ---'
          sed -n '1,25p' /tmp/fresh.headers
          echo '--- PLAIN LIVE MARKERS ---'
          grep -F 'css/design-system.css?v=834' /tmp/plain.html
          grep -F 'js/app-loader.js?v=834' /tmp/plain.html
          grep -F 'ACADEMIC EXAM MOBILE VISIBILITY — CANONICAL' /tmp/plain.css
          grep -F "define('academic',[FIREBASE_STORAGE_SDK,'js/modules/report-engine.js','js/modules/academic.js?v=834'])" /tmp/plain-loader.js
          grep -F 'function prioritizeExamRecords(out,count)' /tmp/plain-academic.js
          echo '--- FRESH INDEX MARKERS ---'
          grep -F 'css/design-system.css?v=834' /tmp/fresh.html
          grep -F 'js/app-loader.js?v=834' /tmp/fresh.html
          cmp -s /tmp/plain.html /tmp/fresh.html
          echo 'PLAIN_AND_FRESH_RUNTIME_V834_OK'
