name: Agent PDF Menu Patch
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths: ['.github/workflows/agent-pdf-menu-patch.yml']

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pdf-menu-and-student-absence
          fetch-depth: 0
      - name: PDF menü ve öğrenci devamsızlığı düzenlemesini uygula
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/dokumanlar.js')
          s=p.read_text()
          old="""function dokumanYukleModalAc() {\n  const kategoriSecenekleri = DOKUMAN_KATEGORILER"""
          new="""function dokumanYukleModalAc() {\n  const pdfIslemModu = window._dokPdfIslemModu || '';\n  window._dokPdfIslemModu = '';\n  const kategoriSecenekleri = DOKUMAN_KATEGORILER"""
          assert old in s
          s=s.replace(old,new,1)
          old="""  modalAc('📁 Döküman Ekle', body, () => dokumanKaydet(), null);\n  const kb = document.getElementById('modalKaydetBtn');\n  if (kb) kb.textContent = '💾 Kaydet';\n}"""
          new="""  const modalBaslik = pdfIslemModu === 'resim' ? '🖼 Resimden PDF' : pdfIslemModu === 'birlestir' ? '🔗 PDF Birleştirme' : '📁 Döküman Ekle';\n  modalAc(modalBaslik, body, () => dokumanKaydet(), null);\n  const gorunumAyarla = (id, goster) => { const el=document.getElementById(id); if(el) el.style.display=goster?'':'none'; };\n  if (pdfIslemModu === 'resim' || pdfIslemModu === 'birlestir') {\n    gorunumAyarla('dok_sekme_dosya', false);\n    gorunumAyarla('dok_sekme_url', false);\n    gorunumAyarla('dok_sekme_resim', pdfIslemModu === 'resim');\n    gorunumAyarla('dok_sekme_birlestir', pdfIslemModu === 'birlestir');\n    dokumanSekmeAc(pdfIslemModu);\n  } else {\n    gorunumAyarla('dok_sekme_resim', false);\n    gorunumAyarla('dok_sekme_birlestir', false);\n    gorunumAyarla('dok_panel_resim', false);\n    gorunumAyarla('dok_panel_birlestir', false);\n    dokumanSekmeAc('dosya');\n  }\n  const kb = document.getElementById('modalKaydetBtn');\n  if (kb) kb.textContent = '💾 Kaydet';\n}"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('js/dokuman-pdf-tools.js')
          s=p.read_text()
          anchor="window.dokumanHazirPdfOnizle = dokumanHazirPdfOnizle;\n"
          add=anchor+"""\nfunction _pdfAraciModalAc(mod){\n  window._dokPdfIslemModu = mod;\n  if (typeof dokumanYukleModalAc === 'function') dokumanYukleModalAc();\n  else if (typeof toast === 'function') toast('PDF aracı yüklenemedi.');\n}\nwindow.pdfResimdenAc = function(){ _pdfAraciModalAc('resim'); };\nwindow.pdfBirlestirAc = function(){ _pdfAraciModalAc('birlestir'); };\nwindow.pdfIslemleriAc = function(){\n  const html = `\n    <div style=\"display:flex;flex-direction:column;gap:8px;\">\n      <button class=\"btn btn-ghost\" style=\"justify-content:flex-start;\" onclick=\"modalKapat();pdfResimdenAc()\">🖼 Resimden PDF Oluştur</button>\n      <button class=\"btn btn-ghost\" style=\"justify-content:flex-start;\" onclick=\"modalKapat();pdfBirlestirAc()\">🔗 PDF Birleştir</button>\n    </div>`;\n  if (typeof modalAc === 'function') {\n    modalAc('📄 PDF İşlemleri', html, null, null);\n    const b=document.getElementById('modalKaydetBtn'); if(b) b.style.display='none';\n  }\n};\n"""
          assert anchor in s
          s=s.replace(anchor,add,1)
          p.write_text(s)

          p=Path('js/alt-navigasyon.js')
          s=p.read_text()
          old="""      {anahtar:'g1_yoklama',ad:'Öğrenci Yoklama', ikon:'liste', modul:'yoklama', aksiyon:function(){ if(typeof yoklamaAc==='function') yoklamaAc(); }},\n      {anahtar:'g1_ogrListeOlusturucu'"""
          new="""      {anahtar:'g1_yoklama',ad:'Öğrenci Yoklama', ikon:'liste', modul:'yoklama', aksiyon:function(){ if(typeof yoklamaAc==='function') yoklamaAc(); }},\n      {anahtar:'g1_ogrenciDevamsizlik',ad:'Öğrenci Devamsızlığı', ikon:'takvim', modul:'yoklama', aksiyon:function(){ if(typeof yoklamaAc==='function') yoklamaAc(); }},\n      {anahtar:'g1_ogrListeOlusturucu'"""
          assert old in s
          s=s.replace(old,new,1)
          old="""      {anahtar:'g7_dokumanlar',ad:'Dökümanlar', ikon:'klasor', modul:'dokumanlar', aksiyon:git('dokumanlar')},\n      {anahtar:'g7_evrak'"""
          new="""      {anahtar:'g7_dokumanlar',ad:'Dökümanlar', ikon:'klasor', modul:'dokumanlar', aksiyon:git('dokumanlar')},\n      {anahtar:'g7_pdfIslemleri',ad:'PDF İşlemleri', ikon:'dosya', modul:'dokumanlar', aksiyon:function(){ if(typeof pdfIslemleriAc==='function') pdfIslemleriAc(); }},\n      {anahtar:'g7_evrak'"""
          assert old in s
          s=s.replace(old,new,1)
          anchor="""    });\n  }\n  _ozellikKatalogunuSenkronla();"""
          extra="""    });\n    window.OzellikKatalogu.kaydet({\n      id:'pdf_resimden', ad:'Resimden PDF Oluştur', tip:'aksiyon', modul:'dokumanlar', ikon:'dosya',\n      ac:function(){ if(typeof pdfResimdenAc==='function') pdfResimdenAc(); }\n    });\n    window.OzellikKatalogu.kaydet({\n      id:'pdf_birlestir', ad:'PDF Birleştir', tip:'aksiyon', modul:'dokumanlar', ikon:'dosya',\n      ac:function(){ if(typeof pdfBirlestirAc==='function') pdfBirlestirAc(); }\n    });\n  }\n  _ozellikKatalogunuSenkronla();"""
          assert anchor in s
          s=s.replace(anchor,extra,1)
          p.write_text(s)

          Path('tests/pdf-menu-navigation-smoke.test.js').write_text("""const fs=require('fs');\nconst assert=require('assert');\nconst nav=fs.readFileSync('js/alt-navigasyon.js','utf8');\nconst docs=fs.readFileSync('js/dokumanlar.js','utf8');\nconst pdf=fs.readFileSync('js/dokuman-pdf-tools.js','utf8');\nassert(nav.includes("g7_pdfIslemleri"));\nassert(nav.includes("id:'pdf_resimden'"));\nassert(nav.includes("id:'pdf_birlestir'"));\nassert(nav.includes("g1_ogrenciDevamsizlik"));\nassert(nav.includes("ad:'Öğrenci Devamsızlığı'"));\nassert(pdf.includes('window.pdfIslemleriAc'));\nassert(pdf.includes('window.pdfResimdenAc'));\nassert(pdf.includes('window.pdfBirlestirAc'));\nassert(docs.includes("gorunumAyarla('dok_sekme_resim', false)"));\nassert(docs.includes("gorunumAyarla('dok_sekme_birlestir', false)"));\nconsole.log('PDF menü ve öğrenci devamsızlığı navigasyon smoke testleri başarılı.');\n""")

          p=Path('.github/workflows/frontend-smoke.yml')
          s=p.read_text()
          path_anchor="      - 'tests/dokuman-pdf-tools-smoke.test.js'\n"
          assert path_anchor in s
          s=s.replace(path_anchor,path_anchor+"      - 'tests/pdf-menu-navigation-smoke.test.js'\n",1)
          step_anchor="""      - name: Döküman PDF araçları regresyon testi\n        run: node tests/dokuman-pdf-tools-smoke.test.js\n"""
          assert step_anchor in s
          s=s.replace(step_anchor,step_anchor+"\n      - name: PDF menü ve öğrenci devamsızlığı navigasyon testi\n        run: node tests/pdf-menu-navigation-smoke.test.js\n",1)
          p.write_text(s)

          temp=Path('.github/workflows/pdf-menu-patch.yml')
          if temp.exists(): temp.unlink()
          PY
          node --check js/dokumanlar.js
          node --check js/dokuman-pdf-tools.js
          node --check js/alt-navigasyon.js
          node tests/pdf-menu-navigation-smoke.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PDF araçlarını ayrı menüye taşı ve öğrenci devamsızlığını bağımsızlaştır"
          git push origin HEAD:agent/pdf-menu-and-student-absence
