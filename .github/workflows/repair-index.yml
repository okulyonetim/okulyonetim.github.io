name: Repair index and wire UI refinements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[auto-index-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index and wire refinement assets
        shell: bash
        run: |
          git checkout b5afe0e7ca1a6a213efcda752fec19ab82b220da -- index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='  <link rel="stylesheet" href="css/nobet-sinif-modern-fixes.css?v=2">\n'
          if 'css/nobet-sinif-modern-fixes.css' not in s:
              s=s.replace('  <link rel="stylesheet" href="css/sinif-oturma.css">\n','  <link rel="stylesheet" href="css/sinif-oturma.css">\n'+css)
          js='\n<script src="js/nobet-rapor.js?v=4"></script>\n<script src="js/nobet-rapor-border-fix.js?v=2"></script>'
          if 'js/nobet-rapor.js' not in s:
              s=s.replace('<script src="js/nobet.js"></script>','<script src="js/nobet.js"></script>'+js)
          p.write_text(s,encoding='utf-8')
          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8')
          import re
          w=re.sub(r"const CACHE_ADI='oy-cache-v\\d+';", "const CACHE_ADI='oy-cache-v647';", w, count=1)
          sw.write_text(w,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "fix: restore index and load nobet seating refinements [auto-index-repair]"
          git push
