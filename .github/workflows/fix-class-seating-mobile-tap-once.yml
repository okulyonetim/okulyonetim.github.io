name: Fix class seating mobile tap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-class-seating-mobile-tap-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused mobile tap fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/modules/class-seating.js')
          s=p.read_text()

          old="const CLICK_LIMIT=7;\n"
          new="const CLICK_LIMIT=7;\nconst TOUCH_CLICK_LIMIT=18;\nconst pointerClickLimit=type=>(type==='touch'||type==='pen'||(!type&&navigator.maxTouchPoints>0))?TOUCH_CLICK_LIMIT:CLICK_LIMIT;\n"
          if old not in s: raise SystemExit('click limit anchor not found')
          s=s.replace(old,new,1)

          old="  let sx=0,sy=0,ox=0,oy=0,startTarget=null,moving=false,group=[];"
          new="  let sx=0,sy=0,ox=0,oy=0,startTarget=null,moving=false,dragging=false,pointerType='',group=[];"
          if old not in s: raise SystemExit('drag state anchor not found')
          s=s.replace(old,new,1)

          old="    startTarget=e.target;\n    moving=true;"
          new="    startTarget=e.target;\n    pointerType=e.pointerType||'';\n    dragging=false;\n    moving=true;"
          if old not in s: raise SystemExit('pointerdown anchor not found')
          s=s.replace(old,new,1)

          old="  el.addEventListener('pointermove',e=>{\n    if(!moving||locked)return;\n    const dx=(e.clientX-sx)/(baseZoom*userZoom);\n    const dy=(e.clientY-sy)/(baseZoom*userZoom);"
          new="  el.addEventListener('pointermove',e=>{\n    if(!moving||locked)return;\n    const screenDx=e.clientX-sx,screenDy=e.clientY-sy,clickLimit=pointerClickLimit(pointerType);\n    if(!dragging&&Math.hypot(screenDx,screenDy)<clickLimit)return;\n    dragging=true;\n    const dx=screenDx/(baseZoom*userZoom);\n    const dy=screenDy/(baseZoom*userZoom);"
          if old not in s: raise SystemExit('pointermove anchor not found')
          s=s.replace(old,new,1)

          old="    const dist=Math.hypot((e.clientX||sx)-sx,(e.clientY||sy)-sy);\n    const dragSeat=startTarget?.closest?.('[data-so-seat]');\n    if(dist>=CLICK_LIMIT&&dragSeat){\n      dragSeat.dataset.soSuppressClick='true';\n      setTimeout(()=>{if(dragSeat.isConnected)delete dragSeat.dataset.soSuppressClick},0);\n    }\n    if(!locked&&dist>=CLICK_LIMIT){"
          new="    const dist=Math.hypot((e.clientX||sx)-sx,(e.clientY||sy)-sy);\n    const clickLimit=pointerClickLimit(pointerType),dragged=dragging||dist>=clickLimit;\n    const dragSeat=startTarget?.closest?.('[data-so-seat]');\n    if(dragged&&dragSeat){\n      dragSeat.dataset.soSuppressClick='true';\n      setTimeout(()=>{if(dragSeat.isConnected)delete dragSeat.dataset.soSuppressClick},400);\n    }\n    if(!locked&&dragged){"
          if old not in s: raise SystemExit('pointerup drag anchor not found')
          s=s.replace(old,new,1)

          old="    }else if(dist<CLICK_LIMIT){"
          new="    }else if(!dragged){"
          if old not in s: raise SystemExit('tap branch anchor not found')
          s=s.replace(old,new,1)

          old="    group=[];\n  };\n  el.addEventListener('pointerup',up);"
          new="    group=[];\n    dragging=false;\n    pointerType='';\n  };\n  el.addEventListener('pointerup',up);"
          if old not in s: raise SystemExit('pointer reset anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tests/classes-mobile-parity-smoke.test.js')
          t=p.read_text()
          anchor="assert(seating.includes(\"seat.addEventListener('click'\")&&seating.includes('chooseStudent(seat)'),'Sıradaki artı/isim alanına dokunma öğrenci seçiciyi açmalı.');\n"
          extra="assert(seating.includes('const TOUCH_CLICK_LIMIT=18')&&seating.includes('navigator.maxTouchPoints>0')&&seating.includes('if(!dragging&&Math.hypot(screenDx,screenDy)<clickLimit)return')&&seating.includes('const clickLimit=pointerClickLimit(pointerType),dragged=dragging||dist>=clickLimit'),'Mobil dokunma titreşimi masa dokunmasını sürükleme olarak yutmamalı.');\n"
          if anchor not in t: raise SystemExit('test anchor not found')
          t=t.replace(anchor,anchor+extra,1)
          p.write_text(t)

          p=Path('service-worker.js')
          sw=p.read_text()
          old="const CACHE_ADI='oy-cache-v885';"
          if old not in sw: raise SystemExit('cache anchor not found')
          p.write_text(sw.replace(old,"const CACHE_ADI='oy-cache-v886';",1))
          PY
      - name: Verify focused behavior
        run: |
          node --check js/modules/class-seating.js
          node tests/classes-mobile-parity-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
      - name: Commit focused fix
        run: |
          git rm .github/workflows/fix-class-seating-mobile-tap-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/class-seating.js tests/classes-mobile-parity-smoke.test.js service-worker.js
          git commit -m 'fix: open student picker on mobile table tap'
          git push origin HEAD:main
