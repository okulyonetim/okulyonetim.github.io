name: migrate-legacy-teacher-focus
on:
  push:
    branches: [main]
    paths: ['scripts/migrate-legacy-teacher-focus.py']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Apply legacy teacher focus migration
        run: python scripts/migrate-legacy-teacher-focus.py
      - name: Syntax checks
        run: node --check js/modules/dashboard.js
      - name: Dashboard checks
        run: |
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-reminders-smoke.test.js
          node tests/dashboard-quick-actions.test.js
      - name: Architecture checks
        run: node scripts/check-client-architecture.mjs
      - name: Cleanup temporary migration files
        run: rm -f scripts/migrate-legacy-teacher-focus.py .github/workflows/migrate-legacy-teacher-focus.yml
      - name: Commit production migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/dashboard.js css/design-system.css tests/dashboard-card-routes-smoke.test.js service-worker.js
          git add -u scripts/migrate-legacy-teacher-focus.py .github/workflows/migrate-legacy-teacher-focus.yml
          git commit -m 'feat(dashboard): restore legacy teacher lesson focus'
          git push
