name: Performance Chart Patch
permissions:
  contents: write
on:
  push:
    branches: [agent/performance-lazy-chart]
    paths: ['.github/workflows/perf-chart-patch.yml']

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-lazy-chart
      - name: Chart.js kullanım anına taşı
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/sinav-sonuclari.js')
          s=p.read_text()
          anchor="let _ssOgrenciGrafik = null; // Chart.js örneği — yeniden çizerken eskisini yok etmek için"
          helper=anchor+"""\nlet _ssChartYukleme = null;\nfunction _ssChartYukle(){\n  if (typeof Chart !== 'undefined') return Promise.resolve();\n  if (_ssChartYukleme) return _ssChartYukleme;\n  _ssChartYukleme = new Promise((resolve,reject)=>{\n    const mevcut=Array.from(document.scripts).find(x=>/chart(?:\\.umd)?(?:\\.min)?\\.js/i.test(x.src||''));\n    if(mevcut){ mevcut.addEventListener('load',resolve,{once:true}); mevcut.addEventListener('error',reject,{once:true}); return; }\n    const sc=document.createElement('script');\n    sc.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js';\n    sc.onload=resolve; sc.onerror=()=>reject(new Error('Grafik kütüphanesi yüklenemedi.'));\n    document.head.appendChild(sc);\n  }).catch(e=>{ _ssChartYukleme=null; throw e; });\n  return _ssChartYukleme;\n}"""
          assert anchor in s
          s=s.replace(anchor,helper,1)
          old="function _ssOgrenciSonuclariCiz(ogrenciId){\n  _ssOgrenciBirListeCiz('ssOgrenciDenemeListesi', 'Deneme Sonuçları', '📊', denemeSinavListesi, ogrenciId);\n  _ssOgrenciBirListeCiz('ssOgrenciTestListesi', 'Test Sonuçları', '📝', testSinavListesi, ogrenciId);"
          new="async function _ssOgrenciSonuclariCiz(ogrenciId){\n  _ssOgrenciBirListeCiz('ssOgrenciDenemeListesi', 'Deneme Sonuçları', '📊', denemeSinavListesi, ogrenciId);\n  _ssOgrenciBirListeCiz('ssOgrenciTestListesi', 'Test Sonuçları', '📝', testSinavListesi, ogrenciId);\n  try { await _ssChartYukle(); } catch(e) { console.warn('[Sınav Sonuçları] Chart.js yüklenemedi:', e); }"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          tag='<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>\n'
          assert tag in s
          p.write_text(s.replace(tag,'',1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/sinav-sonuclari.js
          git commit -m "Chart.js kütüphanesini sonuç ekranında lazy-load yap"
          git push origin HEAD:agent/performance-lazy-chart
