name: Temporary Settings Owner Consolidation Gate V2
on:
  push:
    branches: [work/popover-settings-accordion-20260831]
    paths: ['.github/workflows/temp-settings-owner-consolidation-v2.yml']
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Consolidate Settings ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/modules/settings.js'); s=p.read_text(encoding='utf-8')
          old="const defs={okulBilgileri:COL.okulBilgileri,dersSaatleri:COL.dersSaatleri}"
          if s.count(old)!=1: raise SystemExit(f'settings defs {s.count(old)}')
          s=s.replace(old,"const defs={okulBilgileri:COL.okulBilgileri,dersSaatleri:COL.dersSaatleri,dersListesi:COL.dersListesi,bransListesi:COL.bransListesi}",1)
          s=s.replace("['lesson-hours','Ders Saatleri','Zil saatleri, öğle arası ve tatil modu']","['lesson-hours','Ders Saatleri','Zil saatleri, öğle arası ve tatil modu'],['lesson-list','Ders Listesi','Ders, kısaltma ve haftalık saat yönetimi'],['branch-list','Branş Listesi','Merkezi öğretmen branşları']",1)
          s=s.replace("if(!groups.some(g=>g.key===settingsAccordion))settingsAccordion=groups[0]?.key||'';","if(settingsAccordion&&!groups.some(g=>g.key===settingsAccordion))settingsAccordion=groups[0]?.key||'';",1)
          anchor="function bindSettingsAccordion(out){out.querySelectorAll('[data-settings-accordion-toggle]').forEach(b=>b.addEventListener('click',()=>{const key=b.dataset.settingsAccordionToggle||'';settingsAccordion=settingsAccordion===key?'':key;render()}))}\n"
          if s.count(anchor)!=1: raise SystemExit(f'accordion anchor {s.count(anchor)}')
          helpers=r'''function referenceListsEditable(){return window.PermissionService?.can?.('settings.app.edit','edit')??(typeof window.duzenleyebilir==='function'&&window.duzenleyebilir('sistemAyarlari'))}
          async function ensureReferenceListService(){if(!window.ReferenceListService?.prepare)await window.AppLoader?.loadScript?.('js/modules/classic-parity.js');if(!window.ReferenceListService?.prepare)throw new Error('Referans liste servisi hazır değil.');await window.ReferenceListService.prepare();return window.ReferenceListService}
          function referenceListHours(values={}){return `<div class="ka-grid">${[1,2,3,4,5,6,7,8].map(i=>`<label class="ka-field"><span class="ka-field__label">${i}. Sınıf</span><input type="number" min="0" max="10" data-reference-hour="${i}" value="${esc(values?.[i]||values?.[String(i)]||'')}" placeholder="—"></label>`).join('')}</div>`}
          function referenceList(kind){const lesson=kind==='lesson',list=arr(lesson?'dersListesi':'bransListesi').slice().sort((a,b)=>String(a.ad||'').localeCompare(String(b.ad||''),'tr')),edit=referenceListsEditable();return `<section class="ka-stack" data-settings-reference-list="${kind}"><div class="ka-row ka-row--between"><div><h3>${lesson?'Ders Listesi':'Branş Listesi'}</h3><div class="ka-muted">${lesson?'Ders adı, kısaltma ve sınıf seviyesine göre haftalık ders saati':'Öğretmen kayıtlarında kullanılan merkezi branş listesi'}</div></div><div class="ka-row">${lesson&&edit?'<button class="ka-btn ka-btn--secondary ka-btn--sm" type="button" data-reference-excel>📥 Excel</button>':''}${edit?'<button class="ka-btn ka-btn--sm" type="button" data-reference-add>+ Ekle</button>':''}</div></div><div class="ka-stack">${list.length?list.map(x=>`<article class="ka-card"><div class="ka-card__body ka-row ka-row--between"><div><strong>${esc(x.ad||'')}</strong>${lesson?`<div class="ka-muted">${esc(x.kisaltma||'')}${x.haftalikSaatler?` · ${Object.entries(x.haftalikSaatler).sort((a,b)=>Number(a[0])-Number(b[0])).map(([level,h])=>`${level}. sınıf: ${h}s`).join(' · ')}`:''}</div>`:''}</div>${edit?`<button class="ka-btn ka-btn--secondary ka-btn--sm" type="button" data-reference-edit="${esc(x.id)}">Düzenle</button>`:''}</div></article>`).join(''):'<div class="ka-empty">Henüz kayıt yok.</div>'}</div></section>`}
          function closeReferenceListModal(){document.querySelector('[data-settings-reference-modal]')?.remove()}
          async function openReferenceListEdit(kind,id=''){let service;try{service=await ensureReferenceListService()}catch(e){toast?.(e?.message||e);return}const current=arr(kind==='lesson'?'dersListesi':'bransListesi').find(x=>x.id===id)||{},ov=document.createElement('div');ov.className='ka-modal-backdrop';ov.dataset.settingsReferenceModal='';ov.innerHTML=`<form class="ka-modal"><div class="ka-modal__header"><h2>${id?'Düzenle':'Yeni Ekle'}</h2><button type="button" class="ka-icon-button" data-reference-close>×</button></div><div class="ka-modal__body ka-stack"><label class="ka-field"><span class="ka-field__label">${kind==='lesson'?'Ders Adı':'Branş Adı'}</span><input name="ad" value="${esc(current.ad||'')}" required autofocus></label>${kind==='lesson'?`<label class="ka-field"><span class="ka-field__label">Kısaltma</span><input name="kisaltma" maxlength="5" value="${esc(current.kisaltma||'')}"></label><div><strong>Haftalık Ders Saati</strong><div class="ka-muted">Sınıf seviyesine göre norm hesabında kullanılır.</div></div>${referenceListHours(current.haftalikSaatler||{})}`:''}</div><div class="ka-modal__footer">${id?'<button type="button" class="ka-btn ka-btn--danger" data-reference-delete>Sil</button>':''}<button type="button" class="ka-btn ka-btn--secondary" data-reference-close>Vazgeç</button><button type="submit" class="ka-btn">Kaydet</button></div></form>`;document.body.appendChild(ov);ov.querySelectorAll('[data-reference-close]').forEach(b=>b.onclick=closeReferenceListModal);ov.addEventListener('click',e=>{if(e.target===ov)closeReferenceListModal()});ov.querySelector('form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),ad=String(fd.get('ad')||'').trim(),list=arr(kind==='lesson'?'dersListesi':'bransListesi');if(!ad)return;if(list.some(x=>x.id!==id&&String(x.ad||'').localeCompare(ad,'tr',{sensitivity:'base'})===0))return toast?.('Bu kayıt zaten var.');try{if(kind==='lesson'){const hours={};ov.querySelectorAll('[data-reference-hour]').forEach(x=>{const n=Number(x.value);if(Number.isFinite(n)&&n>0)hours[x.dataset.referenceHour]=n});await service.lessonSave(id,{ad,kisaltma:String(fd.get('kisaltma')||'').trim().toLocaleUpperCase('tr'),haftalikSaatler:hours})}else await service.branchSave(id,{ad});closeReferenceListModal();render();toast?.('Kaydedildi.')}catch(err){toast?.(err?.message==='yetkisiz'?'Bu işlem için yetkiniz yok.':'Kayıt yapılamadı: '+(err?.message||err))}};ov.querySelector('[data-reference-delete]')?.addEventListener('click',async()=>{if(!confirm('Bu kayıt silinsin mi?'))return;try{kind==='lesson'?await service.lessonRemove(id):await service.branchRemove(id);closeReferenceListModal();render();toast?.('Silindi.')}catch(err){toast?.('Silinemedi: '+(err?.message||err))}})}
          async function importReferenceLessons(out){try{if(!window.ClassicExcelParity?.importLessons)await window.AppLoader?.loadScript?.('js/modules/classic-excel-parity.js');if(!window.ClassicExcelParity?.importLessons)throw new Error('Excel içe aktarma servisi hazır değil.');let input=out.querySelector('[data-reference-excel-input]');if(!input){input=document.createElement('input');input.type='file';input.accept='.xlsx,.xls';input.hidden=true;input.dataset.referenceExcelInput='';out.appendChild(input);input.addEventListener('change',async()=>{const file=input.files?.[0];input.value='';if(!file)return;try{await window.ClassicExcelParity.importLessons(file);render()}catch(e){toast?.('İçe aktarma hatası: '+(e?.message||e))}})}input.click()}catch(e){toast?.(e?.message||e)}}
          function bindReferenceList(out,kind){out.querySelector('[data-reference-add]')?.addEventListener('click',()=>openReferenceListEdit(kind));out.querySelectorAll('[data-reference-edit]').forEach(b=>b.addEventListener('click',()=>openReferenceListEdit(kind,b.dataset.referenceEdit)));out.querySelector('[data-reference-excel]')?.addEventListener('click',()=>importReferenceLessons(out))}
          '''
          s=s.replace(anchor,anchor+helpers,1)
          s=s.replace("active==='lesson-hours'?lessonHours():active==='school'?school()","active==='lesson-hours'?lessonHours():active==='lesson-list'?referenceList('lesson'):active==='branch-list'?referenceList('branch'):active==='school'?school()",1)
          s=s.replace("if(active==='lesson-hours')bindLessonHours(out);","if(active==='lesson-hours')bindLessonHours(out);if(active==='lesson-list')bindReferenceList(out,'lesson');if(active==='branch-list')bindReferenceList(out,'branch');",1)
          s=s.replace("'data.dersSaatleri','data.ogretmenler'","'data.dersSaatleri','data.dersListesi','data.bransListesi','data.ogretmenler'",1)
          s=s.replace("['home','account','appearance','sync','lesson-hours','school','users','statistics','roles','app','reminders','storage']","['home','account','appearance','sync','lesson-hours','lesson-list','branch-list','school','users','statistics','roles','app','reminders','storage']",1)
          p.write_text(s,encoding='utf-8')

          p=Path('js/modules/classic-parity.js'); s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"\nfunction closeListModal\(\).*?\nfunction enhanceProfile","\nfunction enhanceProfile",s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'classic settings block {n}')
          s=s.replace('enhanceTeacherBranchOptions();enhanceSettings();enhanceProfile()','enhanceTeacherBranchOptions();enhanceProfile()',1)
          old="function handleClick(e){const settings=e.target.closest?.('[data-classic-settings-card]');if(settings){e.preventDefault();e.stopImmediatePropagation();openSettingsList(settings.dataset.classicSettingsCard);return}const report="
          if s.count(old)!=1: raise SystemExit(f'classic click {s.count(old)}')
          s=s.replace(old,"function handleClick(e){const report=",1)
          s=s.replace('global.ClassicParity={init,enhance,openSettingsList,printTeacherReport,ReferenceListService};init();','global.ClassicParity={init,enhance,printTeacherReport,ReferenceListService};init();',1)
          p.write_text(s,encoding='utf-8')

          p=Path('js/modules/classic-excel-parity.js'); s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"\nfunction enhanceSettings\(\).*?\nfunction enhance\(\)\{scheduled=false;enhanceClasses\(\);enhanceAcademic\(\);enhanceSettings\(\)\}","\nfunction enhance(){scheduled=false;enhanceClasses();enhanceAcademic()}",s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'excel settings enhancer {n}')
          p.write_text(s,encoding='utf-8')

          p=Path('css/design-system.css'); s=p.read_text(encoding='utf-8')
          s=s.replace('.ka-notification-popover{padding:0!important;overflow:hidden!important}.ka-notification-popover{max-width:300px!important}.ka-notification-row__copy strong,.ka-notification-row__copy small{overflow-wrap:anywhere}', '.ka-notification-popover{padding:0!important;overflow:hidden!important;max-width:300px!important}.ka-notification-row__copy strong,.ka-notification-row__copy small{overflow-wrap:anywhere}',1)
          s=s.replace('.ka-profile-popover{padding:0!important;border-radius:20px!important;overflow:hidden!important;background:var(--ka-card-raised-bg)!important}.ka-profile-popover{max-width:226px!important}', '.ka-profile-popover{padding:0!important;border-radius:20px!important;overflow:hidden!important;background:var(--ka-card-raised-bg)!important;max-width:226px!important}',1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/settings-separate-pages.test.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("for(const page of ['school','lesson-hours','users'","for(const page of ['school','lesson-hours','lesson-list','branch-list','users'",1)
          anchor="assert(!settings.includes('ka-grid ka-settings-home'),'Eski düz Settings kart grid ana görünümü geri dönmemeli.');"
          if s.count(anchor)!=1: raise SystemExit(f'settings contract anchor {s.count(anchor)}')
          s=s.replace(anchor,anchor+"\nassert(settings.includes(\"['lesson-list','Ders Listesi'\")&&settings.includes(\"['branch-list','Branş Listesi'\")&&settings.includes(\"active==='lesson-list'?referenceList('lesson')\")&&settings.includes('function openReferenceListEdit(kind,id=')&&settings.includes('ClassicExcelParity.importLessons(file)'),'Ders/Branş listesi görünür yönetimi canonical SettingsModule içinde kalmalı.');",1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/classic-people-v2-smoke.test.js'); s=p.read_text(encoding='utf-8')
          old="for(const marker of ['Sınıf Excel','Program Excel','Yazılı Excel','data-classic-settings-list=\"lesson\"']) assert(excel.includes(marker),`Klasik Excel görünür aksiyonu eksik: ${marker}`);"
          if s.count(old)!=1: raise SystemExit(f'excel contract {s.count(old)}')
          s=s.replace(old,"for(const marker of ['Sınıf Excel','Program Excel','Yazılı Excel']) assert(excel.includes(marker),`Klasik Excel görünür aksiyonu eksik: ${marker}`);\nassert(!excel.includes('function enhanceSettings()'),'Classic Excel Settings DOM’una ikinci kez buton enjekte etmemeli.');",1)
          old="for(const label of ['Ders Listesi','Branş Listesi','Haftalık Ders Saati','Toplam sınav','7 gün içinde','Aktif sayaç']) assert(parity.includes(label),`Toplu klasik parite öğesi eksik: ${label}`);"
          if s.count(old)!=1: raise SystemExit(f'parity contract {s.count(old)}')
          s=s.replace(old,"for(const label of ['Toplam sınav','7 gün içinde','Aktif sayaç']) assert(parity.includes(label),`Toplu klasik parite öğesi eksik: ${label}`);\nassert(!parity.includes('function enhanceSettings()')&&!parity.includes('data-classic-settings-card'),'Classic parity Settings ana ekranına ikinci renderer olarak müdahale etmemeli.');",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check js/core/shell-ui.js
          node --check js/modules/settings.js
          node --check js/modules/classic-parity.js
          node --check js/modules/classic-excel-parity.js
          node tests/settings-separate-pages.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/classic-people-v2-smoke.test.js
          node tests/web-mobile-engine-separation.test.js
          node tests/module-bundles-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit validated result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/settings.js js/modules/classic-parity.js js/modules/classic-excel-parity.js css/design-system.css tests/settings-separate-pages.test.js tests/classic-people-v2-smoke.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Make Settings the single owner of its accordion UI'
          git push
