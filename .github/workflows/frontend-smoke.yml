name: Frontend Smoke Tests

on:
  push:
    branches: ['main']
    paths:
      - 'service-worker.js'
      - 'css/dashboard-home.css'
      - 'js/ui-stability-fixes.js'
      - 'js/dashboard-home.js'
      - 'tests/dashboard-home-smoke.test.js'
      - 'tests/service-worker-precache-smoke.test.js'
      - '.github/workflows/frontend-smoke.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'css/dashboard-home.css'
      - 'css/dashboard-yeni.css'
      - 'css/web-shell-fix.css'
      - 'css/web-sidebar-v2.css'
      - 'css/tasima-takip.css'
      - 'js/ozellik-katalogu.js'
      - 'js/push.js'
      - 'js/dokuman-okuyucu.js'
      - 'js/dokuman-pdf-tools.js'
      - 'js/pdf-export-libs.js'
      - 'js/map-libs.js'
      - 'js/native-report-preview.js'
      - 'js/ui-stability-fixes.js'
      - 'js/dashboard-home.js'
      - 'js/dashboard-v2-init.js'
      - 'js/web-sidebar-v2.js'
      - 'js/role-ui-hardening.js'
      - 'js/excel-visual-fidelity.js'
      - 'js/excel-visual-fidelity-v3.js'
      - 'js/akademik-takvim.js'
      - 'js/yillik-plan.js'
      - 'js/sinav-sonuclari.js'
      - 'js/harita.js'
      - 'js/kullanici-yonetimi.js'
      - 'js/app.js'
      - 'js/alt-navigasyon.js'
      - 'js/nav-duzeni-editor.js'
      - 'js/raporlama.js'
      - 'js/puantaj.js'
      - 'js/tasima-takip.js'
      - 'js/dilekce.js'
      - 'js/sinavlar.js'
      - 'js/sinif-oturma.js'
      - 'js/kontrol-listeleri.js'
      - 'js/ogretmen-liste-olusturucu.js'
      - 'js/teblig-tebellug.js'
      - 'js/cizelgeler.js'
      - 'js/kriter-dagitim.js'
      - 'js/proje-degerlendirme.js'
      - 'optik/index.html'
      - 'optik/js/app.js'
      - 'optik/js/disaAktar.js'
      - 'firebase-messaging-sw.js'
      - '.github/workflows/build-apk.yml'
      - 'android/app/src/main/java/com/koruk/okul/MainActivity.java'
      - 'android/app/src/main/java/com/koruk/okul/PrintPlugin.java'
      - 'tests/dashboard-home-smoke.test.js'
      - 'tests/pwa-push-smoke.test.js'
      - 'tests/android-deeplink-smoke.test.js'
      - 'tests/document-viewer-smoke.test.js'
      - 'tests/dokuman-pdf-tools-smoke.test.js'
      - 'tests/lazy-document-libs-smoke.test.js'
      - 'tests/lazy-chart-smoke.test.js'
      - 'tests/lazy-pdf-export-smoke.test.js'
      - 'tests/lazy-leaflet-smoke.test.js'
      - 'tests/native-report-preview-smoke.test.js'
      - 'tests/android-print-plugin-smoke.test.js'
      - 'tests/yillik-plan-preview-smoke.test.js'
      - 'tests/optik-save-bridge-smoke.test.js'
      - 'tests/report-native-print-routing-smoke.test.js'
      - 'tests/global-zoom-smoke.test.js'
      - 'tests/navigation-customization-smoke.test.js'
      - 'tests/feature-catalog-smoke.test.js'
      - 'tests/web-responsive-smoke.test.js'
      - 'tests/web-sidebar-v2-smoke.test.js'
      - 'tests/service-worker-precache-smoke.test.js'
      - 'tests/excel-visual-fidelity-v3-smoke.test.js'
      - '.github/workflows/frontend-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax kontrolü
        run: |
          node --check service-worker.js
          node --check js/ozellik-katalogu.js
          node --check js/app.js
          node --check js/push.js
          node --check js/dokuman-okuyucu.js
          node --check js/dokuman-pdf-tools.js
          node --check js/pdf-export-libs.js
          node --check js/map-libs.js
          node --check js/native-report-preview.js
          node --check js/ui-stability-fixes.js
          node --check js/dashboard-home.js
          node --check js/dashboard-v2-init.js
          node --check js/web-sidebar-v2.js
          node --check js/role-ui-hardening.js
          node --check js/excel-visual-fidelity.js
          node --check js/excel-visual-fidelity-v3.js
          node --check js/akademik-takvim.js
          node --check js/yillik-plan.js
          node --check js/sinav-sonuclari.js
          node --check js/harita.js
          node --check js/kullanici-yonetimi.js
          node --check js/alt-navigasyon.js
          node --check js/nav-duzeni-editor.js
          node --check js/raporlama.js
          node --check js/puantaj.js
          node --check js/tasima-takip.js
          node --check js/dilekce.js
          node --check js/sinavlar.js
          node --check js/sinif-oturma.js
          node --check js/kontrol-listeleri.js
          node --check js/ogretmen-liste-olusturucu.js
          node --check js/teblig-tebellug.js
          node --check js/cizelgeler.js
          node --check js/kriter-dagitim.js
          node --check js/proje-degerlendirme.js
          node --check optik/js/app.js
          node --check optik/js/disaAktar.js
      - name: Temiz mobil ana sayfa testi
        run: node tests/dashboard-home-smoke.test.js
      - name: Web responsive regresyon testi
        run: node tests/web-responsive-smoke.test.js
      - name: Web sidebar v2 regresyon testi
        run: node tests/web-sidebar-v2-smoke.test.js
      - name: Merkezi özellik kataloğu regresyon testi
        run: node tests/feature-catalog-smoke.test.js
      - name: Navigasyon özelleştirme regresyon testi
        run: node tests/navigation-customization-smoke.test.js
      - name: Global zoom regresyon testi
        run: node tests/global-zoom-smoke.test.js
      - name: PWA / push regresyon testi
        run: node tests/pwa-push-smoke.test.js
      - name: Service Worker precache performans testi
        run: node tests/service-worker-precache-smoke.test.js
      - name: Android deep-link regresyon testi
        run: node tests/android-deeplink-smoke.test.js
      - name: Belge görüntüleyici regresyon testi
        run: node tests/document-viewer-smoke.test.js
      - name: Döküman PDF araçları regresyon testi
        run: node tests/dokuman-pdf-tools-smoke.test.js
      - name: Lazy belge kütüphaneleri regresyon testi
        run: node tests/lazy-document-libs-smoke.test.js
      - name: Chart lazy-load regresyon testi
        run: node tests/lazy-chart-smoke.test.js
      - name: PDF dışa aktarma lazy-load regresyon testi
        run: node tests/lazy-pdf-export-smoke.test.js
      - name: Leaflet lazy-load regresyon testi
        run: node tests/lazy-leaflet-smoke.test.js
      - name: Native rapor önizleme regresyon testi
        run: node tests/native-report-preview-smoke.test.js
      - name: Android yazdırma regresyon testi
        run: node tests/android-print-plugin-smoke.test.js
      - name: Yıllık plan önizleme regresyon testi
        run: node tests/yillik-plan-preview-smoke.test.js
      - name: Optik PDF kayıt köprüsü regresyon testi
        run: node tests/optik-save-bridge-smoke.test.js
      - name: Rapor native yazdırma yönlendirme regresyon testi
        run: node tests/report-native-print-routing-smoke.test.js
      - name: Excel görsel sadakat v3 regresyon testi
        run: node tests/excel-visual-fidelity-v3-smoke.test.js
