name: Frontend Smoke Tests

on:
  pull_request:
    paths:
      - 'service-worker.js'
      - 'js/push.js'
      - 'js/dokuman-okuyucu.js'
      - 'js/yillik-plan.js'
      - 'js/app.js'
      - 'js/raporlama.js'
      - 'js/puantaj.js'
      - 'js/tasima-takip.js'
      - 'js/dilekce.js'
      - 'js/sinavlar.js'
      - 'js/sinif-oturma.js'
      - 'js/kontrol-listeleri.js'
      - 'js/ogretmen-liste-olusturucu.js'
      - 'js/teblig-tebellug.js'
      - 'js/cizelgeler.js'
      - 'js/kriter-dagitim.js'
      - 'js/proje-degerlendirme.js'
      - 'optik/index.html'
      - 'optik/js/app.js'
      - 'optik/js/disaAktar.js'
      - 'firebase-messaging-sw.js'
      - '.github/workflows/build-apk.yml'
      - 'android/app/src/main/java/com/koruk/okul/MainActivity.java'
      - 'android/app/src/main/java/com/koruk/okul/PrintPlugin.java'
      - 'tests/pwa-push-smoke.test.js'
      - 'tests/android-deeplink-smoke.test.js'
      - 'tests/document-viewer-smoke.test.js'
      - 'tests/android-print-plugin-smoke.test.js'
      - 'tests/yillik-plan-preview-smoke.test.js'
      - 'tests/optik-save-bridge-smoke.test.js'
      - 'tests/report-native-print-routing-smoke.test.js'
      - '.github/workflows/frontend-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/word-scroll-dark-title-fix

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Belge görüntüleyici cache sürümünü yükselt
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          if "oy-cache-v433" in s:
              s=s.replace("oy-cache-v433","oy-cache-v434",1)
              p.write_text(s,encoding='utf-8')
          PY
          if ! git diff --quiet -- service-worker.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add service-worker.js
            git commit -m "chore: refresh document viewer cache"
            git push origin HEAD:agent/word-scroll-dark-title-fix
          fi

      - name: JavaScript syntax kontrolü
        run: |
          node --check service-worker.js
          node --check js/push.js
          node --check js/dokuman-okuyucu.js
          node --check js/yillik-plan.js
          node --check optik/js/disaAktar.js

      - name: PWA / push regresyon testi
        run: node tests/pwa-push-smoke.test.js

      - name: Android deep-link regresyon testi
        run: node tests/android-deeplink-smoke.test.js

      - name: Belge görüntüleyici regresyon testi
        run: node tests/document-viewer-smoke.test.js

      - name: Android yazdırma regresyon testi
        run: node tests/android-print-plugin-smoke.test.js

      - name: Yıllık plan önizleme regresyon testi
        run: node tests/yillik-plan-preview-smoke.test.js

      - name: Optik PDF kayıt köprüsü regresyon testi
        run: node tests/optik-save-bridge-smoke.test.js

      - name: Rapor native yazdırma yönlendirme regresyon testi
        run: node tests/report-native-print-routing-smoke.test.js
