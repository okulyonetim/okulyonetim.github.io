name: Frontend Smoke Tests

on:
  pull_request:
    paths:
      - 'service-worker.js'
      - 'js/push.js'
      - 'js/dokuman-okuyucu.js'
      - 'js/yillik-plan.js'
      - 'js/app.js'
      - 'optik/index.html'
      - 'optik/js/app.js'
      - 'optik/js/disaAktar.js'
      - 'firebase-messaging-sw.js'
      - '.github/workflows/build-apk.yml'
      - 'android/app/src/main/java/com/koruk/okul/MainActivity.java'
      - 'android/app/src/main/java/com/koruk/okul/PrintPlugin.java'
      - 'tests/pwa-push-smoke.test.js'
      - 'tests/android-deeplink-smoke.test.js'
      - 'tests/document-viewer-smoke.test.js'
      - 'tests/android-print-plugin-smoke.test.js'
      - 'tests/yillik-plan-preview-smoke.test.js'
      - 'tests/optik-save-bridge-smoke.test.js'
      - '.github/workflows/frontend-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax kontrolü
        run: |
          node --check service-worker.js
          node --check js/push.js
          node --check js/dokuman-okuyucu.js
          node --check js/yillik-plan.js
          node --check optik/js/disaAktar.js

      - name: PWA / push regresyon testi
        run: node tests/pwa-push-smoke.test.js

      - name: Android deep-link regresyon testi
        run: node tests/android-deeplink-smoke.test.js

      - name: Belge görüntüleyici regresyon testi
        run: node tests/document-viewer-smoke.test.js

      - name: Android yazdırma regresyon testi
        run: node tests/android-print-plugin-smoke.test.js

      - name: Yıllık plan önizleme regresyon testi
        run: node tests/yillik-plan-preview-smoke.test.js

      - name: Optik PDF kayıt köprüsü regresyon testi
        run: node tests/optik-save-bridge-smoke.test.js
