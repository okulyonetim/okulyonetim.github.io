name: Duty report A4 parity fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/duty-report-a4-parity.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify expected main ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'd85543f9f97123012eb4cd98c99f21414fb22287'
      - name: Restore full A4 duty roster report
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          mgmt=Path('js/modules/management.js')
          s=mgmt.read_text(encoding='utf-8')
          start=s.find('const DUTY_TASKS=[')
          end=s.find('function bindDuty()',start)
          if start<0 or end<0:
              raise SystemExit('Duty report source block not found')
          new=r'''const DUTY_TASKS=[
  'Ders başlamadan 30 dk önce okula gelinmesi ve ders bitiminden on beş dakika sonra okulun terk edilmesi.',
  'Nöbete başlandığında ilk olarak okul bölümlerinin gezilmesi ve nöbet defterinin sabah bölümünün doldurulması.',
  'Nöbet süresince sorumlu olunan alanların düzenli olarak kontrol edilmesi.',
  'Hava şartlarına göre öğrencilerin koridor ve bahçe düzeninin takip edilmesi, sınıf nöbetçilerinin kontrol edilmesi.',
  'Olumsuz durumların nöbetçi müdür yardımcısına bildirilmesi.',
  'Taşıma çizelgesinin her gün servis şoförlerine imzalatılması.',
  'Yemekhane ve paydos saatlerinde öğrencilerin güvenli geçiş ve çıkışlarının sağlanması.',
  'Bahçe ve ortak alan temizliğinin takip edilmesi.',
  'Törenlerin yapılması için gerekli düzenin sağlanması.',
  'Okula gelen yabancılara yardımcı olunması ve gerekli durumların nöbet defterine yazılması.',
  'Derse geç girilen durumların yönetime bildirilmesi.',
  'Boş geçen derslerin yönetime veya nöbetçi müdür yardımcısına bildirilmesi.',
  'Ders bitiminde okulun boşaltılmasının takip edilmesi.',
  'Gün sonunda nöbet defterinin ilgili bölümünün doldurulması.'
];
const DUTY_REPORT_COLUMNS=[
  {label:'BAHÇE',aliases:['Bahçe']},
  {label:'OKUL BİNASI',aliases:['Okul Binası']},
  {label:'GİRİŞ - BAHÇE',aliases:['Giriş - Bahçe','Giriş-Bahçe']}
];
function dutyReportPlace(places,aliases){const wanted=new Set(aliases.map(norm));return places.find(p=>wanted.has(norm(p.ad||'')))||null}
function dutyReportFirstWorkday(y,m,tatiller=arr('resmiTatiller')){const total=new Date(y,m+1,0).getDate();for(let d=1;d<=total;d++){const day=new Date(y,m,d).getDay(),iso=NobetService.tarihISO(y,m,d);if(day!==0&&day!==6&&!(tatiller||[]).some(t=>t.tarih===iso))return iso}return NobetService.tarihISO(y,m,1)}
function dutyReportLongDate(y,m,d){return new Date(y,m,d).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long'})}
function dutyReportDisplayDate(iso){if(!iso)return'';const d=new Date(iso+'T00:00:00');return Number.isNaN(d.getTime())?iso:d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}
function dutyReportDocumentDate(){return new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}
function dutyReportLogoUrl(){try{return new URL('assets/logo.png',globalThis.location.href).href}catch(_){return'assets/logo.png'}}
function dutyReportPrincipal(okul){const teacher=arr('ogretmenler').find(o=>o.id===okul?.mudurId);return teacher?{ad:teacherName(teacher),telefon:teacher.telefon||''}:{ad:String(okul?.mudurAdi||okul?.mudur||'').trim()||'—',telefon:String(okul?.mudurTelefon||'').trim()}}
function dutyReportModal(){const selected=`${dutyYear}-${String(dutyMonth+1).padStart(2,'0')}`,first=dutyReportFirstWorkday(dutyYear,dutyMonth),ov=modal('Nöbet Raporu',`<label class="ka-field"><span class="ka-field__label">Ay</span><input type="month" data-month value="${selected}"></label><label class="ka-field"><span class="ka-field__label">Geçerlilik Tarihi</span><input type="date" data-validity value="${first}"></label><label class="ka-field"><span class="ka-field__label">Sayfa yönü</span><select data-orientation><option value="dikey">Dikey A4</option><option value="yatay">Yatay A4</option></select></label>`,'Önizle');const monthInput=ov.querySelector('[data-month]'),validity=ov.querySelector('[data-validity]');monthInput.addEventListener('change',()=>{const [ys,ms]=String(monthInput.value||'').split('-'),y=Number(ys),m=Number(ms)-1;if(y&&m>=0)validity.value=dutyReportFirstWorkday(y,m)});ov.querySelector('[data-save]').onclick=async()=>{await createDutyReport(monthInput.value,ov.querySelector('[data-orientation]').value,validity.value);ov.remove()}}
async function createDutyReport(month,yon,gecerlilikTarihi=''){if(!globalThis.ReportEngine)await AppLoader.loadScript('js/modules/report-engine.js');const [ys,ms]=String(month).split('-'),y=Number(ys),m=Number(ms)-1;if(!y||m<0)return;const places=NobetService.yerSirali(arr('nobetYerleri')),atamalar=arr('nobetAtamalari'),amirler=arr('nobetciAmirleri'),tatiller=arr('resmiTatiller'),okulRows=arr('okulBilgileri'),okul=okulRows.find(x=>x.id==='ayarlar')||okulRows[0]||{},okulAdi=okul.okulAdi||okul.ad||'KORUK İLK - ORTAOKULU',okulBaslik=String(okulAdi).replace(/\s*[-–]\s*/g,' - ').replace(/\s+/g,' ').trim(),mudur=dutyReportPrincipal(okul),columns=DUTY_REPORT_COLUMNS.map(c=>({...c,place:dutyReportPlace(places,c.aliases)})),gunSayisi=new Date(y,m+1,0).getDate(),rows=[];for(let g=1;g<=gunSayisi;g++){const iso=NobetService.tarihISO(y,m,g),dt=new Date(y,m,g),haftasonu=dt.getDay()===0||dt.getDay()===6,tatil=tatiller.find(t=>t.tarih===iso),tarihMetin=dutyReportLongDate(y,m,g);if(tatil){const aciklama=String(tatil.aciklama||tatil.ad||tatil.adi||'RESMİ TATİL').trim(),gunAy=dt.toLocaleDateString('tr-TR',{day:'numeric',month:'long'}).toLocaleUpperCase('tr'),etiket=aciklama.toLocaleUpperCase('tr').includes(gunAy)?aciklama.toLocaleUpperCase('tr'):`${gunAy} ${aciklama.toLocaleUpperCase('tr')}`;rows.push(`<tr class="ka-duty-report-holiday"><td>${esc(tarihMetin)}</td><td colspan="4">${esc(etiket)}</td></tr>`);continue}if(haftasonu){rows.push(`<tr class="ka-duty-report-weekend"><td>${esc(tarihMetin)}</td><td colspan="4"></td></tr>`);continue}const cells=columns.map(c=>{const a=c.place?atamalar.find(x=>x.tarih===iso&&x.yerId===c.place.id):null;return`<td>${esc(String(a?.ogretmenAdSoyad||'').toLocaleUpperCase('tr'))}</td>`}).join(''),amir=amirler.find(a=>a.tarih===iso);rows.push(`<tr><td>${esc(tarihMetin)}</td>${cells}<td>${esc(String(amir?.ad||'').toLocaleUpperCase('tr'))}</td></tr>`)}const monthName=new Date(y,m,1).toLocaleDateString('tr-TR',{month:'long'}).toLocaleUpperCase('tr'),validity=gecerlilikTarihi||dutyReportFirstWorkday(y,m,tatiller),validityText=dutyReportDisplayDate(validity),documentDate=dutyReportDocumentDate(),chiefPhones=[];amirler.filter(a=>String(a.tarih||'').startsWith(`${ys}-${ms}`)&&a.ad).forEach(a=>{const teacher=a.ogretmenId?arr('ogretmenler').find(o=>o.id===a.ogretmenId):null,name=String(a.ad||'').trim(),phone=String(a.telefon||teacher?.telefon||'').trim();if(name&&!chiefPhones.some(x=>x.ad.localeCompare(name,'tr',{sensitivity:'base'})===0))chiefPhones.push({ad:name,telefon:phone})});const phones=[];if(mudur.ad&&mudur.ad!=='—')phones.push(mudur);chiefPhones.forEach(x=>{if(!phones.some(p=>p.ad.localeCompare(x.ad,'tr',{sensitivity:'base'})===0))phones.push(x)});const phonesHtml=phones.length?`<section class="ka-duty-report-phones"><strong>TELEFONLAR</strong>${phones.map(p=>`<span><b>${esc(String(p.ad).toLocaleUpperCase('tr'))}</b> ${esc(p.telefon||'—')}</span>`).join('')}</section>`:'',orientation=yon==='yatay'?'landscape':'portrait',body=`<section class="ka-duty-report ka-duty-report--${orientation}"><header class="ka-duty-report-banner"><img class="ka-duty-report-logo" src="${esc(dutyReportLogoUrl())}" alt=""><h1>${esc(okulBaslik.toLocaleUpperCase('tr'))} ${y} YILI ${esc(monthName)} AYI ÖĞRETMEN NÖBET ÇİZELGESİ</h1></header><table class="ka-duty-report-table"><colgroup><col class="ka-duty-report-col-date"><col class="ka-duty-report-col-garden"><col class="ka-duty-report-col-building"><col class="ka-duty-report-col-entry"><col class="ka-duty-report-col-chief"></colgroup><thead><tr><th>TARİH / GÜN</th>${columns.map(c=>`<th>${esc(c.label)}</th>`).join('')}<th>NÖBETÇİ AMİR</th></tr></thead><tbody>${rows.join('')}</tbody></table>${phonesHtml}<section class="ka-duty-report-tasks"><h2>NÖBETÇİ ÖĞRETMENİN GÖREVLERİ</h2><ol>${DUTY_TASKS.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section><footer class="ka-duty-report-footer"><div class="ka-duty-report-footer-copy"><p>Bu çizelge ${esc(validityText)} tarihinden itibaren geçerlidir.</p><p>Öğretmen arkadaşların okuldaki eğitim öğretim hizmetlerinin verimli geçmesi için yukarıda sayılan talimatlara göre nöbet hizmetlerini yerine getirmelerini rica ederim.</p></div><div class="ka-duty-report-signature"><span>${esc(documentDate)}</span><strong>${esc(String(mudur.ad||'—').toLocaleUpperCase('tr'))}</strong><span>Okul Müdürü</span></div></footer></section>`;return ReportEngine.printReport('Öğretmen Nöbet Çizelgesi',body,{fileName:`Nobet_Cizelgesi_${ys}_${ms}`,yon:yon==='yatay'?'yatay':'dikey',okulAdi,logoGoster:false,tarihGoster:false,baslikGoster:false,compact:true,fontSize:7,kenarBosluk:5})}
'''
          mgmt.write_text(s[:start]+new+s[end:],encoding='utf-8')

          css=Path('css/design-system.css')
          c=css.read_text(encoding='utf-8')
          cstart=c.find('/* Duty report — exact uploaded roster anatomy, canonical ReportEngine output. */')
          cend=c.find('/* Announcements page — canonical communication redesign. */',cstart)
          if cstart<0 or cend<0:
              raise SystemExit('Duty report CSS block not found')
          block=r'''/* Duty report — full A4 roster anatomy for portrait and landscape output. */
.ka-report .ka-duty-report{width:100%;color:#111;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;gap:0;background:#fff;overflow:hidden}
.ka-report .ka-duty-report--portrait{min-height:287mm}.ka-report .ka-duty-report--landscape{min-height:200mm}
.ka-report .ka-duty-report-banner{display:grid;grid-template-columns:10mm minmax(0,1fr) 10mm;align-items:center;gap:2mm;min-height:11mm;padding:0 0 1.2mm;margin:0 0 1.4mm;border-bottom:1.15px solid #17684f;text-align:center}
.ka-report .ka-duty-report-logo{width:9mm;height:9mm;object-fit:contain}.ka-report .ka-duty-report-banner h1{grid-column:2;margin:0!important;color:#155c46!important;font-size:7.3pt!important;font-weight:850!important;line-height:1.08!important;letter-spacing:.01em}.ka-report .ka-duty-report-banner img+h1{grid-column:2}
.ka-report .ka-duty-report-table{width:100%!important;table-layout:fixed!important;margin:0!important;border-collapse:collapse!important;border-spacing:0!important}.ka-report .ka-duty-report--portrait .ka-duty-report-table{height:187mm}.ka-report .ka-duty-report--landscape .ka-duty-report-table{height:122mm}
.ka-report .ka-duty-report-table th{padding:.45mm .75mm!important;background:#173f60!important;border:1px solid #294f6b!important;color:#fff!important;font-size:5.6pt!important;line-height:1!important;font-weight:800!important;text-align:center!important;white-space:nowrap!important}.ka-report .ka-duty-report-table td{padding:.22mm .75mm!important;border:1px solid #aeb7bb!important;background:#fff!important;color:#111!important;font-size:5.45pt!important;line-height:1!important;vertical-align:middle!important;text-align:center!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}.ka-report .ka-duty-report-table tbody tr:nth-child(even) td{background:#f7f7f7!important}.ka-report .ka-duty-report-table td:first-child{text-align:left!important;font-weight:650!important}.ka-report .ka-duty-report-weekend td{background:#e6e6e6!important;color:#666!important;font-weight:600!important}.ka-report .ka-duty-report-holiday td{background:#fff4cf!important;color:#6b5200!important;font-weight:800!important}.ka-report .ka-duty-report-holiday td:not(:first-child){text-align:center!important;letter-spacing:.01em!important}
.ka-report .ka-duty-report--portrait .ka-duty-report-col-date{width:22%}.ka-report .ka-duty-report--portrait .ka-duty-report-col-garden{width:20%}.ka-report .ka-duty-report--portrait .ka-duty-report-col-building{width:20%}.ka-report .ka-duty-report--portrait .ka-duty-report-col-entry{width:18%}.ka-report .ka-duty-report--portrait .ka-duty-report-col-chief{width:20%}.ka-report .ka-duty-report--landscape .ka-duty-report-col-date{width:18%}.ka-report .ka-duty-report--landscape .ka-duty-report-col-garden{width:20%}.ka-report .ka-duty-report--landscape .ka-duty-report-col-building{width:20%}.ka-report .ka-duty-report--landscape .ka-duty-report-col-entry{width:18%}.ka-report .ka-duty-report--landscape .ka-duty-report-col-chief{width:24%}
.ka-report .ka-duty-report--landscape .ka-duty-report-table th{font-size:5.4pt!important}.ka-report .ka-duty-report--landscape .ka-duty-report-table td{font-size:5.25pt!important}
.ka-report .ka-duty-report-phones{display:flex;align-items:center;gap:3.2mm;flex-wrap:wrap;margin:1.1mm 0 0;padding:.75mm 0;border-top:.45px solid #555;border-bottom:.45px solid #777;font-size:4.8pt;line-height:1.05}.ka-report .ka-duty-report-phones>strong{font-size:5pt}.ka-report .ka-duty-report-phones span{white-space:nowrap}.ka-report .ka-duty-report-phones b{font-weight:800}
.ka-report .ka-duty-report-tasks{margin:1.2mm 0 0!important;padding:0!important;color:#111}.ka-report .ka-duty-report-tasks h2{margin:0 0 .7mm!important;color:#111!important;font-size:6.2pt!important;line-height:1.05!important;font-weight:850!important}.ka-report .ka-duty-report-tasks ol{margin:0!important;padding-left:4.2mm!important;font-size:4.65pt!important;line-height:1.08!important}.ka-report .ka-duty-report-tasks li{margin:0!important;padding:0!important;color:#111!important;font-size:4.65pt!important;line-height:1.08!important}.ka-report .ka-duty-report--landscape .ka-duty-report-tasks ol{columns:2;column-gap:8mm}.ka-report .ka-duty-report--landscape .ka-duty-report-tasks li{break-inside:avoid;page-break-inside:avoid}
.ka-report .ka-duty-report-footer{margin-top:auto;padding-top:1.1mm;border-top:.45px solid #777;color:#111;font-size:4.65pt;line-height:1.1;display:grid;grid-template-columns:minmax(0,1fr) 35mm;gap:5mm;align-items:end}.ka-report .ka-duty-report-footer-copy p{margin:0 0 .6mm!important}.ka-report .ka-duty-report-signature{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.08}.ka-report .ka-duty-report-signature strong{margin-top:.5mm;font-size:5pt}.ka-report .ka-duty-report-signature span{display:block}.ka-report .ka-duty-report--landscape .ka-duty-report-footer{grid-template-columns:minmax(0,1fr) 45mm}
@media print{.ka-report .ka-duty-report{break-inside:avoid;page-break-inside:avoid}.ka-report .ka-duty-report-table tr,.ka-report .ka-duty-report-tasks,.ka-report .ka-duty-report-footer{break-inside:avoid;page-break-inside:avoid}}
'''
          css.write_text(c[:cstart]+block+c[cend:],encoding='utf-8')

          loader=Path('js/app-loader.js')
          l=loader.read_text(encoding='utf-8')
          if "/* Koruk Asistan — AppLoader v40" not in l or "define('management',['js/modules/report-engine.js','js/modules/management.js']);" not in l:
              raise SystemExit('AppLoader management registry contract changed')
          l=l.replace('/* Koruk Asistan — AppLoader v40','/* Koruk Asistan — AppLoader v41',1)
          l=l.replace("define('management',['js/modules/report-engine.js','js/modules/management.js']);","define('management',['js/modules/report-engine.js','js/modules/management.js?v=871']);",1)
          loader.write_text(l,encoding='utf-8')

          index=Path('index.html')
          i=index.read_text(encoding='utf-8')
          if 'css/design-system.css?v=870' not in i or 'js/app-loader.js?v=859' not in i:
              raise SystemExit('Index cache pins changed')
          i=i.replace('css/design-system.css?v=870','css/design-system.css?v=871',1).replace('js/app-loader.js?v=859','js/app-loader.js?v=860',1)
          index.write_text(i,encoding='utf-8')

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8')
          for token in ["const CACHE_ADI='oy-cache-v870';","'./css/design-system.css?v=870'","'./js/app-loader.js?v=859'","'./js/modules/management.js'"]:
              if token not in w: raise SystemExit('Service worker pin missing: '+token)
          w=w.replace("const CACHE_ADI='oy-cache-v870';","const CACHE_ADI='oy-cache-v871';",1)
          w=w.replace("'./css/design-system.css?v=870'","'./css/design-system.css?v=871'",1)
          w=w.replace("'./js/app-loader.js?v=859'","'./js/app-loader.js?v=860'",1)
          w=w.replace("'./js/modules/management.js'","'./js/modules/management.js?v=871','./js/modules/management.js'",1)
          sw.write_text(w,encoding='utf-8')

          # Cache generation assertions elsewhere intentionally pin current deploy generation.
          for p in Path('tests').glob('*.js'):
              t=p.read_text(encoding='utf-8')
              n=t.replace('css/design-system.css?v=870','css/design-system.css?v=871').replace('oy-cache-v870','oy-cache-v871').replace('js/app-loader.js?v=859','js/app-loader.js?v=860')
              if n!=t:p.write_text(n,encoding='utf-8')

          duty=Path('tests/duty-report-full-parity.test.js')
          duty.write_text(r'''const fs=require('fs');
const assert=require('assert');
const src=fs.readFileSync('js/modules/management.js','utf8');
const css=fs.readFileSync('css/design-system.css','utf8');
const report=fs.readFileSync('js/modules/report-engine.js','utf8');
assert(src.includes('const DUTY_REPORT_COLUMNS=['),'Nöbet raporu sabit referans sütunlarını kullanmalı.');
for(const header of ['BAHÇE','OKUL BİNASI','GİRİŞ - BAHÇE','NÖBETÇİ AMİR']) assert(src.includes(header),`Nöbet raporu sütunu eksik: ${header}`);
for(const marker of ['ka-duty-report-banner','ka-duty-report-weekend','ka-duty-report-holiday','ka-duty-report-phones','ka-duty-report-tasks','ka-duty-report-footer','ka-duty-report-signature']) assert(src.includes(marker)||css.includes(marker),`Tam nöbet raporu anatomisi eksik: ${marker}`);
assert(src.includes('for(let g=1;g<=gunSayisi;g++)'),'Rapor ayın tüm günlerini üretmeli.');
assert(!src.includes('if(haftasonu||tatil)continue;'),'Hafta sonu ve tatil günleri rapordan atılmamalı.');
assert(src.includes('colspan="4"'),'Hafta sonu/tatil satırları üç nöbet alanı + amir sütununu kaplamalı.');
assert(src.includes('Geçerlilik Tarihi')&&src.includes('dutyReportFirstWorkday'),'Rapor geçerlilik tarihi seçimini korumalı.');
assert(src.includes('dutyReportDocumentDate()'),'İmza tarihi raporun oluşturulduğu tarihi kullanmalı.');
const taskBlock=src.slice(src.indexOf('const DUTY_TASKS=['),src.indexOf('];',src.indexOf('const DUTY_TASKS=['))+2);
assert((taskBlock.match(/^\s*'/gm)||[]).length===14,'Tam nöbet talimatı 14 maddeden oluşmalı.');
for(const text of ['Ders başlamadan 30 dk önce okula gelinmesi','Taşıma çizelgesinin her gün servis şoförlerine imzalatılması','Törenlerin yapılması için gerekli düzenin sağlanması','Gün sonunda nöbet defterinin ilgili bölümünün doldurulması']) assert(taskBlock.includes(text),`Nöbet görevi eksik: ${text}`);
assert(src.includes('ka-duty-report--${orientation}'),'Dikey/yatay rapor ayrı orientation sınıfı üretmeli.');
assert(css.includes('.ka-duty-report--portrait{min-height:287mm}')&&css.includes('.ka-duty-report--landscape{min-height:200mm}'),'Rapor her iki A4 yönünde kullanılabilir alanın tamamına yayılmalı.');
assert(css.includes('.ka-duty-report--portrait .ka-duty-report-table{height:187mm}')&&css.includes('.ka-duty-report--landscape .ka-duty-report-table{height:122mm}'),'Çizelge dikey ve yatay A4 alanını yönüne göre doldurmalı.');
assert(css.includes('margin-top:auto')&&css.includes('columns:2'),'Alt onay alanı sayfanın altına oturmalı; yatay görevler iki sütuna sıkıştırılmalı.');
assert(report.includes("const page=o.yon==='yatay'?'A4 landscape':'A4 portrait'")&&report.includes('@page{size:${page};margin:0}'),'Merkezi ReportEngine gerçek A4 portrait/landscape sayfa boyutunu korumalı.');
assert(src.includes('kenarBosluk:5'),'Nöbet raporu A4 yüzeyini küçük ve sabit kenar boşluğuyla kullanmalı.');
console.log('Tam A4 nöbet çizelgesi portrait/landscape parity sözleşmesi başarılı.');
''',encoding='utf-8')
          PY
      - name: Validate duty report and report engine
        run: |
          set -euo pipefail
          node --check js/modules/management.js
          node --check js/app-loader.js
          node --check service-worker.js
          node tests/duty-report-full-parity.test.js
          node tests/report-engine-a4-smoke.test.js
          node tests/report-native-print-routing-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/classic-duty-v2-smoke.test.js
          npm run build:client
          node scripts/check-client-architecture.mjs
      - name: Commit verified fix and remove temporary workflow
        run: |
