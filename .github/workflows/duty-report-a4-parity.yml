name: Duty report A4 parity fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/duty-report-a4-parity.yml'
      - '.github/temp-duty-report-a4.py'
      - '.github/temp-duty-test-fix.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify expected baseline
        run: git merge-base --is-ancestor d85543f9f97123012eb4cd98c99f21414fb22287 HEAD
      - name: Apply duty report patch
        run: |
          python3 .github/temp-duty-report-a4.py
          python3 .github/temp-duty-test-fix.py
      - name: Validate duty report and report engine
        run: |
          set -euo pipefail
          node --check js/modules/management.js
          node --check js/app-loader.js
          node --check service-worker.js
          node tests/duty-report-full-parity.test.js
          node tests/report-engine-a4-smoke.test.js
          node tests/report-native-print-routing-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/classic-duty-v2-smoke.test.js
          npm run build:client
          node scripts/check-client-architecture.mjs
      - name: Commit verified fix and remove temporary files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/duty-report-a4-parity.yml .github/temp-duty-report-a4.py .github/temp-duty-test-fix.py
          git add js/modules/management.js css/design-system.css js/app-loader.js index.html service-worker.js tests
          git commit -m 'fix: restore full A4 duty roster report'
          git push origin HEAD:main
