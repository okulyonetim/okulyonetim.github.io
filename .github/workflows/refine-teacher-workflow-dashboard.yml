name: Refine Teacher Workflow Dashboard

on:
  push:
    paths:
      - '.github/workflows/refine-teacher-workflow-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply guarded dashboard refinement
        run: python3 scripts/refine-teacher-workflow-dashboard.py

      - name: Build and verify
        run: |
          node scripts/build-client-bundles.mjs
          node --check js/modules/dashboard.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-quick-actions.test.js
          node tests/dashboard-reminders-smoke.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/no-module-internal-tabs.test.js
          node scripts/check-client-architecture.mjs

      - name: Commit production refinement
        run: |
          rm -f .github/workflows/refine-teacher-workflow-dashboard.yml scripts/refine-teacher-workflow-dashboard.py
          git config user.name 'sedonet23'
          git config user.email 'sedonet23@gmail.com'
          git add -A
          git commit -m 'feat(dashboard): streamline teacher daily workflow'
          git push origin HEAD:main

# guarded migration retry: reminder contract aligned
