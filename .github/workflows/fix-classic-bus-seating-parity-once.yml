name: Fix classic bus seating parity once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-classic-bus-seating-parity-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact classic bus seating parity
        run: python .github/scripts/fix-classic-bus-seating.py
      - name: Verify focused transport package
        run: |
          node --check js/modules/transport.js
          node tests/transport-seating-visual-editor.test.js
          node tests/transport-seating-classic-parity.test.js
          node tests/transport-mobile-layout-v3.test.js
          node tests/transport-button-layout.test.js
          node tests/transport-concept-redesign.test.js
          node tests/transport-separate-pages.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit verified package and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-classic-bus-seating-parity-once.yml .github/scripts/fix-classic-bus-seating.py
          git add js/modules/transport.js css/design-system.css index.html js/app-loader.js service-worker.js tests/transport-seating-classic-parity.test.js
          git commit -m "fix: match classic mobile bus seating"
          git push origin main
