name: Fix classic bus seating parity once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-classic-bus-seating-parity-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact classic bus seating parity
        run: python .github/scripts/fix-classic-bus-seating.py
      - name: Preserve canonical Transport loader contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/app-loader.js')
          s=p.read_text()
          s=s.replace("define('transport',['js/modules/report-engine.js','js/modules/transport.js?v=890']);","define('transport',['js/modules/report-engine.js','js/modules/transport.js']);")
          p.write_text(s)
          t=Path('tests/transport-seating-classic-parity.test.js')
          q=t.read_text()
          q=q.replace("assert(loader.includes(\"js/modules/transport.js?v=890\"),'Transport modülü cache-busted yüklenmeli.');","assert(loader.includes(\"define('transport',['js/modules/report-engine.js','js/modules/transport.js'])\"),'Transport canonical lazy-loader sözleşmesini korumalı.');")
          t.write_text(q)
          PY
      - name: Check transport syntax
        run: node --check js/modules/transport.js
      - name: Test visual seating editor
        run: node tests/transport-seating-visual-editor.test.js
      - name: Test classic mobile parity
        run: node tests/transport-seating-classic-parity.test.js
      - name: Test transport mobile layout
        run: node tests/transport-mobile-layout-v3.test.js
      - name: Test transport button layout
        run: node tests/transport-button-layout.test.js
      - name: Test transport concept
        run: node tests/transport-concept-redesign.test.js
      - name: Test transport separate pages
        run: node tests/transport-separate-pages.test.js
      - name: Test local-first boundary
        run: node tests/modules-local-first-boundary.test.js
      - name: Test service worker
        run: node tests/service-worker-precache-smoke.test.js
      - name: Check client architecture
        run: node scripts/check-client-architecture.mjs
      - name: Commit verified package and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-classic-bus-seating-parity-once.yml .github/scripts/fix-classic-bus-seating.py
          git add js/modules/transport.js css/design-system.css index.html js/app-loader.js service-worker.js tests/transport-seating-classic-parity.test.js
          git commit -m "fix: match classic mobile bus seating"
          git push origin main
