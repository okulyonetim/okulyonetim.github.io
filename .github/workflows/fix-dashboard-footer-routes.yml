name: Fix Dashboard Footer Routes

on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-footer-routes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded footer route fix
        run: python3 scripts/fix-dashboard-footer-routes.py
      - name: Verify routing and architecture
        run: |
          node scripts/build-client-bundles.mjs
          node --check js/modules/dashboard.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-quick-actions.test.js
          node tests/no-module-internal-tabs.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-dashboard-footer-routes.yml scripts/fix-dashboard-footer-routes.py
          git config user.name 'sedonet23'
          git config user.email 'sedonet23@gmail.com'
          git add -A
          git commit -m 'fix(dashboard): route footer actions to exact pages'
          git push origin HEAD:main
