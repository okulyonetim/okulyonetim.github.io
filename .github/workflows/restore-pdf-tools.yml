name: Restore PDF tools entry points
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore PDF tool buttons
        shell: python
        run: |
          from pathlib import Path
          p=Path('js/modules/tools.js')
          s=p.read_text(encoding='utf-8')
          shell_old='function shell(){return `<section class="ka-stack" data-tools-module><div class="ka-row ka-row--between"><div><h2>Araçlar</h2><p class="ka-muted">Okul yönetimi yardımcı araçları cihaz verisinden çalışır.</p></div><span id="toolsCount" class="ka-badge"></span></div><div id="toolsContent" class="ka-stack"></div></section>`}'
          shell_new='function shell(){return `<section class="ka-stack" data-tools-module><div class="ka-row ka-row--between"><div><h2>Araçlar</h2><p class="ka-muted">Okul yönetimi yardımcı araçları cihaz verisinden çalışır.</p></div><span id="toolsCount" class="ka-badge"></span></div><div class="ka-grid" data-pdf-tools-entry><button class="ka-btn" type="button" data-open-pdf-tool="images">🖼️ Resimden PDF Oluştur</button><button class="ka-btn ka-btn--secondary" type="button" data-open-pdf-tool="merge">🔗 PDF Birleştir</button></div><div id="toolsContent" class="ka-stack"></div></section>`}'
          bind_old='function bind(){}'
          bind_new='''async function openPdfTool(mode='images'){
            try{
              if(!global.ReportEngine?.openPdfTools) await global.AppLoader?.loadScript?.('js/modules/report-engine.js');
              if(!global.ReportEngine?.openPdfTools) throw new Error('PDF araçları hazır değil.');
              global.ReportEngine.openPdfTools(mode==='merge'?'merge':'images');
            }catch(e){ global.toast?.('PDF araçları açılamadı: '+(e?.message||e)); }
          }
          function bind(){
            document.querySelectorAll('[data-open-pdf-tool]').forEach(btn=>{
              btn.onclick=()=>openPdfTool(btn.dataset.openPdfTool||'images');
            });
          }'''
          if 'data-open-pdf-tool' not in s:
            if shell_old not in s or bind_old not in s:
              raise SystemExit('Expected Tools shell/bind patterns were not found; no changes made.')
            s=s.replace(shell_old,shell_new,1).replace(bind_old,bind_new,1)
            p.write_text(s,encoding='utf-8')
          else:
            print('PDF tool entry points already present; no source change needed.')
      - name: Validate
        run: |
          node --check js/modules/tools.js
          node tests/report-engine-a4-smoke.test.js
          node tests/report-native-print-routing-smoke.test.js
          node tests/module-bundles-smoke.test.js
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/tools.js .github/workflows/restore-pdf-tools.yml
          git diff --cached --quiet || git commit -m "Restore image-to-PDF and PDF merge entry points"
          git rm -f .github/workflows/restore-pdf-tools.yml
          git commit -m "Remove temporary PDF restore workflow"
          git push origin main
