name: Remove Mevzuat Feature

on:
  push:
    branches:
      - feat/remove-mevzuat

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/remove-mevzuat
      - name: Apply retirement
        run: python3 scripts/remove-mevzuat.py
      - name: Verify retirement
        run: |
          node tests/legislation-engine-v2-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/attendance-holiday-stale-teacher-regression.test.js
          node tests/attendance-schedule-scroll-regression.test.js
          node --check js/core/shell-ui.js
      - name: Commit retirement
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: remove Mevzuat feature"
          git push origin HEAD:feat/remove-mevzuat
