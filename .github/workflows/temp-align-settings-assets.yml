name: Temporary Align Settings Assets
on:
  push:
    branches:
      - fix/settings-android-freeze-address-notes-20260908
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/settings-android-freeze-address-notes-20260908
      - name: Align canonical asset versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'css/design-system.css?v=901' not in s:
              raise SystemExit('Expected design-system reference not found')
          p.write_text(s.replace('css/design-system.css?v=901','css/design-system.css?v=912',1))
          Path('.github/workflows/temp-align-settings-assets.yml').unlink(missing_ok=True)
          PY
          node tests/android-pull-refresh-guard.test.js
          node tests/app-update-flow.test.js
          node tests/settings-android-stability.test.js
      - name: Commit final source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align settings asset cache versions'
          git push
