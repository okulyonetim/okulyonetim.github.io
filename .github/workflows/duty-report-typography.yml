name: Duty report typography refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/duty-report-typography.yml'

permissions:
  contents: write

jobs:
  duty-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify current baseline
        run: git merge-base --is-ancestor 2983c12424ec467c0920b5fb5917151ff227d8c4 HEAD
      - name: Apply typography rebalance
        run: python3 .github/temp-duty-report-typography.py
      - name: Validate report and architecture
        run: |
          set -euo pipefail
          node --check js/modules/management.js
          node --check js/modules/report-engine.js
          node --check service-worker.js
          node tests/duty-report-full-parity.test.js
          node tests/classic-duty-v2-smoke.test.js
          node tests/management-separate-pages.test.js
          node tests/report-engine-a4-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/web-mobile-engine-separation.test.js
          npm run build:client
          node tests/module-bundles-smoke.test.js
          test "$(find css -maxdepth 1 -type f -name '*.css' -printf '%f\n' | sort)" = 'design-system.css'
          grep -q 'css/design-system.css?v=874' index.html
          grep -q "oy-cache-v874" service-worker.js
          grep -q "./css/design-system.css?v=874" service-worker.js
          ! grep -q 'db.collection(' js/modules/management.js
          ! grep -q 'firebase.firestore' js/modules/management.js
      - name: Commit verified typography refinement and remove temporary files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/design-system.css index.html service-worker.js tests/duty-report-full-parity.test.js
          git rm .github/temp-duty-report-typography.py .github/workflows/duty-report-typography.yml
          git commit -m 'fix: rebalance duty report typography'
          git push origin HEAD:main
