name: Apply compact dashboard redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dashboard-redesign-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply dashboard visual package
        env:
          DASHBOARD_CSS_B64: ''
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          css_path=Path('css/design-system.css')
          css=css_path.read_text()
          marker='/* ===== DASHBOARD COMPACT MOBILE REDESIGN V1 ===== */'
          block=base64.b64decode(os.environ['DASHBOARD_CSS_B64']).decode()
          if marker not in css:
              css += block
          css_path.write_text(css)
          index=Path('index.html')
          index.write_text(index.read_text().replace('css/design-system.css?v=878','css/design-system.css?v=880'))
          sw=Path('service-worker.js')
          sw.write_text(sw.read_text().replace("const CACHE_ADI='oy-cache-v879'","const CACHE_ADI='oy-cache-v880'").replace("'./css/design-system.css?v=878'","'./css/design-system.css?v=880'"))
          test=Path('tests/dashboard-card-routes-smoke.test.js')
          txt=test.read_text()
          old="assert(css.includes('padding-left:max(12px,var(--ka-safe-left))')&&css.includes('padding-right:max(12px,var(--ka-safe-right))')&&css.includes('gap:20px!important'),'Mobil ana sayfa kartları kenarlardan güvenli boşluk ve kartlar arasında belirgin dikey mesafe bırakmalı.');"
          new="assert(css.includes('DASHBOARD COMPACT MOBILE REDESIGN V1')&&css.includes('padding-left:max(10px,var(--ka-safe-left))')&&css.includes('padding-right:max(10px,var(--ka-safe-right))')&&css.includes('gap:12px!important'),'Mobil ana sayfa yeni kompakt tasarımda güvenli kenar boşluğu ve daha sıkı dikey ritim kullanmalı.');"
          if old not in txt:
              raise SystemExit('Dashboard mobile spacing assertion bulunamadı; patch durduruldu.')
          test.write_text(txt.replace(old,new))
          PY
      - name: Verify focused dashboard package
        run: |
          node --check js/modules/dashboard.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-quick-actions.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit verified package and remove one-time workflow
        run: |
          rm .github/workflows/dashboard-redesign-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/design-system.css index.html service-worker.js tests/dashboard-card-routes-smoke.test.js .github/workflows/dashboard-redesign-once.yml
          git commit -m 'feat: redesign compact mobile dashboard'
          git push origin main
