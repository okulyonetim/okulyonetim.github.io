name: Build and publish Koruk Asistan usage guide PDF

on:
  push:
    branches:
      - main
    paths:
      - 'js/modules/guide-data.js'
      - 'scripts/guide-build.py'
      - 'scripts/guide_pdf.py'
      - 'assets/guide/*.webp'
      - 'assets/icon-192.png'
      - '.github/workflows/build-guide-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: koruk-guide-pdf-main
  cancel-in-progress: false

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node.js ortamını hazırla
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Türkçe fontları kur
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: PDF bağımlılıklarını kur
        run: python -m pip install --upgrade pip reportlab Pillow
      - name: Kılavuz içeriğini ve ekran görüntülerini test et
        run: node tests/guide-system.test.js
      - name: Ekran görüntülü PDF'yi üret
        run: python3 scripts/guide-build.py pdf
      - name: Oluşan PDF'yi doğrula
        run: |
          test -s assets/guide/Koruk_Asistan_Kullanim_Kilavuzu.pdf
          file assets/guide/Koruk_Asistan_Kullanim_Kilavuzu.pdf
          python - <<'PY'
          from pathlib import Path
          p = Path("assets/guide/Koruk_Asistan_Kullanim_Kilavuzu.pdf")
          data = p.read_bytes()
          assert data.startswith(b"%PDF-"), "PDF başlığı geçersiz"
          assert len(data) > 50000, f"PDF beklenenden küçük: {len(data)} bayt"
          print(f"PDF doğrulandı: {len(data)} bayt")
          PY
      - name: PDF'yi main dalına kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/guide/Koruk_Asistan_Kullanim_Kilavuzu.pdf
          if git diff --cached --quiet; then
            echo "PDF güncel; commit gerekmiyor."
            exit 0
          fi
          git commit -m "Ekran görüntülü kullanım kılavuzu PDF'sini güncelle"
          git pull --rebase origin main
          git push origin HEAD:main
