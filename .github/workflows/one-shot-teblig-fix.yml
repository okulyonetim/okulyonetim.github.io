name: One-shot Teblig Fix
on:
  push:
    paths: ['.github/workflows/one-shot-teblig-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - shell: python
        run: |
          from pathlib import Path
          p=Path('js/modules/documents.js'); s=p.read_text(encoding='utf-8')
          bad='TEBLİĞ-TEBELLÜĞ İMZA SİRKÜSÜ</th><tr><th>TARİH</th>'
          good='TEBLİĞ-TEBELLÜĞ İMZA SİRKÜSÜ</th></tr><tr><th>TARİH</th>'
          if bad not in s: raise SystemExit('expected report row boundary not found')
          p.write_text(s.replace(bad,good,1),encoding='utf-8')
      - run: |
          node tests/teblig-v2-smoke.test.js
          node -e "new Function(require('fs').readFileSync('js/modules/documents.js','utf8')); console.log('documents syntax ok')"
      - run: |
          git config user.name "sedat-koruk-automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-teblig-fix.yml
          git add js/modules/documents.js
          git commit -m "fix: close teblig report title row"
          git push origin HEAD:main
