name: Fix People Transport Route

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-people-transport-route.mjs'
      - '.github/workflows/fix-people-transport-route.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded route fix
        run: node scripts/fix-people-transport-route.mjs
      - name: Verify architecture contracts
        run: |
          node tests/no-module-internal-tabs.test.js
          node tests/transport-separate-pages.test.js
          node tests/people-separate-pages.test.js
          node scripts/build-client-bundles.mjs
          node scripts/check-client-architecture.mjs
      - name: Commit fix and cleanup helpers
        run: |
          rm scripts/fix-people-transport-route.mjs .github/workflows/fix-people-transport-route.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/people.js scripts/fix-people-transport-route.mjs .github/workflows/fix-people-transport-route.yml
          git commit -m 'fix(people): route class seating without legacy tabs'
          git push
