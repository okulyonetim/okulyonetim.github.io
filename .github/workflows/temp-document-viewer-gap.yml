name: Temporary document viewer gap patch

on:
  push:
    branches:
      - agent/document-viewer-gap-20260829
    paths:
      - '.github/workflows/temp-document-viewer-gap.yml'
      - 'tests/apply-document-viewer-gap.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/document-viewer-gap-20260829

      - name: Apply guarded central design patch
        run: python3 tests/apply-document-viewer-gap.py

      - name: Verify document viewer smoke test
        run: node tests/document-viewer-smoke.test.js

      - name: Commit clean patch result
        run: |
          rm .github/workflows/temp-document-viewer-gap.yml tests/apply-document-viewer-gap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/design-system.css tests/document-viewer-smoke.test.js .github/workflows/temp-document-viewer-gap.yml tests/apply-document-viewer-gap.py
          git commit -m "fix(documents): restore centralized PDF page spacing"
          git push origin HEAD:agent/document-viewer-gap-20260829
