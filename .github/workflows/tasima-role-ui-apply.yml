name: One-time Tasima Role UI Apply
on:
  push:
    paths:
      - '.github/workflows/tasima-role-ui-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply transport role UI
        run: |
          git fetch origin "$GITHUB_SHA"
          if ! grep -q 'TASIMA ROLE UI v1' js/tasima.js; then
            printf '\n\n' >> js/tasima.js
            git show "$GITHUB_SHA:tmp/tasima-role-adapter.js" >> js/tasima.js
          fi
          if ! grep -q 'TASIMA MODERN ROLE UI v1' css/styles.css; then
            printf '\n\n' >> css/styles.css
            git show "$GITHUB_SHA:tmp/tasima-role-ui.css" >> css/styles.css
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          old="const CACHE_ADI='oy-cache-v648';"
          new="const CACHE_ADI='oy-cache-v649';"
          if old not in s:
              raise SystemExit('Beklenen service worker v648 bulunamadı; işlem durduruldu.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check js/tasima.js
      - name: Commit once to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tasima.js css/styles.css service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: role-aware transport and seating preview UI"
          git push origin main
