name: One-time Tasima Role UI Apply
on:
  push:
    paths:
      - '.github/workflows/tasima-role-ui-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply role-aware transport UI
        shell: python
        run: |
          from pathlib import Path

          js_path = Path('js/tasima.js')
          css_path = Path('css/styles.css')
          sw_path = Path('service-worker.js')

          js = js_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          sw = sw_path.read_text(encoding='utf-8')

          JS_MARK = '/* === TASIMA ROLE UI v1 === */'
          if JS_MARK not in js:
              js += r'''

/* === TASIMA ROLE UI v1 === */
(function(){
  'use strict';

  function tasimaDuzenlemeYetkiliMi(){
    try{
      if (typeof AKTIF_KULLANICI !== 'undefined' && AKTIF_KULLANICI?.admin) return true;
      if (typeof duzenleyebilir === 'function') return !!duzenleyebilir('tasima');
    }catch(_){ }
    return false;
  }
  window.tasimaDuzenlemeYetkiliMi = tasimaDuzenlemeYetkiliMi;
  window.tasimaSaltOkumaMi = function(){ return !tasimaDuzenlemeYetkiliMi(); };

  function tasimaModalSinifiTemizle(){
    const ov = document.getElementById('modalOverlay');
    if(!ov) return;
    ov.classList.remove('tasima-yonetim-modal','tasima-oturma-modal','tasima-oturma-readonly');
  }

  function tasimaModalIsaretle(sinif){
    const ov = document.getElementById('modalOverlay');
    if(!ov) return;
    tasimaModalSinifiTemizle();
    ov.classList.add(sinif);
  }

  function tasimaSayfaRolunuUygula(){
    const tab = document.getElementById('tab-tasima');
    if(!tab) return;
    const salt = !tasimaDuzenlemeYetkiliMi();
    tab.classList.toggle('tasima-readonly', salt);
    tab.classList.add('tasima-modern-ui');

    if(salt){
      const yazmaKaliplari = [
        'servisModalAc(',
        'servisOgrenciEkleModalAc(',
        'servisOgrenciExcelIceAktarModalAc(',
        'servisOgrenciExceliIceAktar(',
        'servisListeOlusturModalAc('
      ];
      tab.querySelectorAll('button,[role="button"],a').forEach(el=>{
        const oc = el.getAttribute('onclick') || '';
        if(yazmaKaliplari.some(k=>oc.includes(k))) el.hidden = true;
      });
    }else{
      tab.querySelectorAll('[data-tasima-role-hidden="1"]').forEach(el=>{
        el.hidden = false;
        el.removeAttribute('data-tasima-role-hidden');
      });
    }
  }

  function tasimaDetayRolunuUygula(servisId){
    const body = document.getElementById('detayBody');
    const ov = document.getElementById('detayOverlay');
    if(!body || !ov) return;
    const salt = !tasimaDuzenlemeYetkiliMi();
    body.classList.add('tasima-detay-body');
    ov.classList.add('tasima-detay-overlay');
    ov.classList.toggle('tasima-readonly', salt);

    const duzenle = document.getElementById('detayDuzenleBtn');
    const rapor = document.getElementById('detayRaporBtn');
    if(duzenle) duzenle.hidden = salt;
    if(rapor) rapor.hidden = salt;

    body.querySelectorAll('.detay-card-actions').forEach(el=>el.hidden = salt);
    body.querySelectorAll('.btn-takip-cizelge,.btn-denetim-formu').forEach(el=>el.hidden = salt);
    if(salt){
      body.querySelectorAll('button,[role="button"],a').forEach(el=>{
        const oc = el.getAttribute('onclick') || '';
        if(/servisOgrenci|servisListeOlustur|servisModalAc/.test(oc)) el.hidden = true;
      });
    }

    const bilgiKart = body.querySelector('.detay-card');
    if(bilgiKart && !bilgiKart.querySelector('.tasima-oturma-preview-btn')){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tasima-oturma-preview-btn';
      btn.innerHTML = '<span class="tasima-oturma-preview-ikon">💺</span><span><strong>Servis Oturma Planı</strong><small>'+(salt?'Önizlemeyi aç':'Planı görüntüle ve yönet')+'</small></span><span class="tasima-preview-ok">›</span>';
      btn.addEventListener('click', function(){
        if(typeof servisOturmaModalAc === 'function') servisOturmaModalAc(servisId);
      });
      bilgiKart.appendChild(btn);
    }
  }

  function tasimaOturmaRolunuUygula(){
    const ov = document.getElementById('modalOverlay');
    const wrap = document.querySelector('#modalOverlay .so-modal-wrap');
    if(!ov || !wrap) return;
    const salt = !tasimaDuzenlemeYetkiliMi();
    tasimaModalIsaretle('tasima-oturma-modal');
    ov.classList.toggle('tasima-oturma-readonly', salt);
    wrap.classList.toggle('so-readonly-preview', salt);

    if(salt){
      wrap.querySelectorAll('.so-sablon-grup,.so-duzenle-satir,#soDuzenleToolbar,.so-alt-butonlar,.sye-ozel-olusturucu').forEach(el=>el.hidden=true);
      const kaydet = document.getElementById('modalKaydetBtn');
      const sil = document.getElementById('modalSilBtn');
      if(kaydet) kaydet.hidden = true;
      if(sil) sil.hidden = true;

      if(!wrap.querySelector('.tasima-readonly-banner')){
        const b = document.createElement('div');
        b.className = 'tasima-readonly-banner';
        b.innerHTML = '<span>👁️</span><span><strong>Oturma Planı Önizleme</strong><small>Bu görünüm salt okunurdur.</small></span>';
        const hero = wrap.querySelector('#soHeroKart');
        if(hero?.parentNode) hero.parentNode.insertBefore(b, hero.nextSibling);
        else wrap.prepend(b);
      }
    }
  }

  function wrapFn(ad, factory){
    const fn = window[ad];
    if(typeof fn !== 'function' || fn.__tasimaRoleWrapped) return false;
    const yeni = factory(fn);
    yeni.__tasimaRoleWrapped = true;
    window[ad] = yeni;
    return true;
  }

  function engelliYazmaFonksiyonlariniSar(){
    const yazmaFns = [
      'servisModalAc','servisOgrenciEkleModalAc','servisOgrenciExcelIceAktarModalAc',
      'soSablonSec','soDuzenlemeToggle','soDuzenlemeKaydet','soDuzenlemeVazgec',
      'soTumunuTemizle','soYuvaAktifEt','soKoltukTikla','soKaydet',
      'sozelSiraEkle','sozelSonSiraSil','sozelTumunuSil'
    ];
    yazmaFns.forEach(ad=>wrapFn(ad, eski=>function(){
      if(!tasimaDuzenlemeYetkiliMi()) return;
      return eski.apply(this, arguments);
    }));
  }

  function anaFonksiyonlariSar(){
    wrapFn('renderServisler', eski=>function(){
      const r = eski.apply(this, arguments);
      requestAnimationFrame(tasimaSayfaRolunuUygula);
      return r;
    });

    wrapFn('servisDetayAc', eski=>function(id){
      const r = eski.apply(this, arguments);
      requestAnimationFrame(()=>tasimaDetayRolunuUygula(id));
      setTimeout(()=>tasimaDetayRolunuUygula(id),80);
      return r;
    });

    ['servisModalAc','servisOgrenciEkleModalAc','servisOgrenciExcelIceAktarModalAc','servisListeOlusturModalAc'].forEach(ad=>{
      wrapFn(ad, eski=>function(){
        if(!tasimaDuzenlemeYetkiliMi() && ad!=='servisListeOlusturModalAc') return;
        const r = eski.apply(this, arguments);
        requestAnimationFrame(()=>tasimaModalIsaretle('tasima-yonetim-modal'));
        return r;
      });
    });

    wrapFn('servisOturmaModalAc', eski=>function(servisId){
      const r = eski.apply(this, arguments);
      requestAnimationFrame(tasimaOturmaRolunuUygula);
      setTimeout(tasimaOturmaRolunuUygula,90);
      return r;
    });

    wrapFn('modalKapat', eski=>function(){
      const r = eski.apply(this, arguments);
      setTimeout(tasimaModalSinifiTemizle,0);
      return r;
    });
  }

  function kur(){
    anaFonksiyonlariSar();
    engelliYazmaFonksiyonlariniSar();
    tasimaSayfaRolunuUygula();
  }

  let deneme=0;
  const t=setInterval(()=>{
    kur();
    if(++deneme>120) clearInterval(t);
  },250);
  document.addEventListener('DOMContentLoaded', kur);
  window.addEventListener('load', ()=>setTimeout(kur,100));

  const obs=new MutationObserver(()=>{
    tasimaSayfaRolunuUygula();
    const ov=document.getElementById('modalOverlay');
    if(ov && !ov.classList.contains('active') && !ov.classList.contains('show')) tasimaModalSinifiTemizle();
  });
  document.addEventListener('DOMContentLoaded',()=>obs.observe(document.body,{subtree:true,childList:true}));
})();
'''
              js_path.write_text(js, encoding='utf-8')

          CSS_MARK = '/* === TASIMA MODERN ROLE UI v1 === */'
          if CSS_MARK not in css:
              css += r'''

/* === TASIMA MODERN ROLE UI v1 === */
:root{
  --tm-brand:#08765b;--tm-brand-2:#0d9a72;--tm-brand-soft:#e7f5ef;
  --tm-surface:#ffffff;--tm-surface-2:#f5f8f7;--tm-border:#d7e2de;
  --tm-text:#17362d;--tm-muted:#6d8179;--tm-shadow:0 10px 28px rgba(17,73,57,.08);
}
[data-theme="dark"]{
  --tm-brand:#1aa17b;--tm-brand-2:#2bc59a;--tm-brand-soft:#123a2f;
  --tm-surface:#0e1b17;--tm-surface-2:#12241e;--tm-border:#2a463d;
  --tm-text:#f4fbf8;--tm-muted:#a8bbb4;--tm-shadow:0 12px 30px rgba(0,0,0,.24);
}
#tab-tasima.tasima-modern-ui{box-sizing:border-box;max-width:100%;overflow-x:hidden}
#tab-tasima.tasima-modern-ui #servislerListesi{display:grid;gap:12px}
#tab-tasima.tasima-modern-ui #servislerListesi .evrak-row{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;max-width:100%;
  padding:15px 14px;border:1px solid var(--tm-border);border-radius:18px;
  background:linear-gradient(145deg,var(--tm-surface),var(--tm-surface-2));
  box-shadow:var(--tm-shadow);overflow:hidden;color:var(--tm-text)
}
#tab-tasima.tasima-modern-ui #servislerListesi .evrak-row::before{
  content:'🚌';display:grid;place-items:center;flex:0 0 44px;width:44px;height:44px;border-radius:14px;
  background:var(--tm-brand-soft);font-size:23px
}
#tab-tasima.tasima-modern-ui #servislerListesi .evrak-body{min-width:0;flex:1}
#tab-tasima.tasima-modern-ui #servislerListesi .evrak-title{font-size:15px;font-weight:800;color:var(--tm-text);line-height:1.3}
#tab-tasima.tasima-modern-ui #servislerListesi .evrak-meta{margin-top:5px;color:var(--tm-muted);font-size:12px;line-height:1.55;white-space:normal}
#tab-tasima.tasima-modern-ui .filtre-btn{border-radius:999px!important;min-height:40px;padding:8px 14px!important;border:1px solid var(--tm-border)!important;background:var(--tm-surface)!important;color:var(--tm-muted)!important}
#tab-tasima.tasima-modern-ui .filtre-btn.active{background:var(--tm-brand)!important;border-color:var(--tm-brand)!important;color:#fff!important;box-shadow:0 7px 18px rgba(8,118,91,.18)}
#tab-tasima.tasima-readonly .btn[hidden],#tab-tasima.tasima-readonly button[hidden]{display:none!important}

.tasima-detay-body>div{padding:12px!important;display:grid;gap:12px}
.tasima-detay-body .detay-card{border:1px solid var(--tm-border)!important;border-radius:20px!important;background:linear-gradient(145deg,var(--tm-surface),var(--tm-surface-2))!important;box-shadow:var(--tm-shadow)!important;padding:15px!important;color:var(--tm-text)!important}
.tasima-detay-body .detay-card h4{margin:0 0 12px!important;color:var(--tm-text)!important;font-size:15px!important}
.tasima-detay-body .detay-row{border-color:var(--tm-border)!important;color:var(--tm-text)!important;line-height:1.55}
.tasima-detay-body .detay-row-muted{color:var(--tm-muted)!important}
.tasima-detay-body .detay-card-actions[hidden]{display:none!important}
.tasima-oturma-preview-btn{width:100%;margin-top:13px;min-height:60px;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;text-align:left;border:1px solid color-mix(in srgb,var(--tm-brand) 45%,var(--tm-border));border-radius:15px;background:var(--tm-brand-soft);color:var(--tm-text);padding:9px 12px;cursor:pointer}
.tasima-oturma-preview-ikon{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--tm-surface);font-size:20px}
.tasima-oturma-preview-btn strong{display:block;font-size:13.5px}.tasima-oturma-preview-btn small{display:block;margin-top:2px;color:var(--tm-muted);font-size:11px}.tasima-preview-ok{font-size:25px;color:var(--tm-brand)}

#modalOverlay.tasima-yonetim-modal .modal,#modalOverlay.tasima-yonetim-modal .modal-box,#modalOverlay.tasima-yonetim-modal .modal-content{
  width:min(94vw,620px)!important;max-width:620px!important;max-height:min(90dvh,780px)!important;border-radius:24px!important;border:1px solid var(--tm-border)!important;background:var(--tm-surface)!important;color:var(--tm-text)!important;box-shadow:0 24px 70px rgba(0,0,0,.28)!important;overflow:hidden
}
#modalOverlay.tasima-yonetim-modal .modal-body{background:var(--tm-surface)!important;padding:16px!important;overflow-y:auto!important}
#modalOverlay.tasima-yonetim-modal .form-group{margin-bottom:14px!important}
#modalOverlay.tasima-yonetim-modal label{display:block!important;margin-bottom:6px!important;color:var(--tm-muted)!important;font-size:11px!important;font-weight:800!important;letter-spacing:.35px!important;text-transform:uppercase}
#modalOverlay.tasima-yonetim-modal input,#modalOverlay.tasima-yonetim-modal select,#modalOverlay.tasima-yonetim-modal textarea{width:100%!important;min-height:48px!important;border:1px solid var(--tm-border)!important;border-radius:14px!important;background:var(--tm-surface-2)!important;color:var(--tm-text)!important;padding:11px 13px!important;box-shadow:none!important;font-size:14px!important}
#modalOverlay.tasima-yonetim-modal textarea{min-height:92px!important;resize:vertical}
#modalOverlay.tasima-yonetim-modal .form-row{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px!important}
#modalOverlay.tasima-yonetim-modal .modal-footer{position:sticky!important;bottom:0!important;background:var(--tm-surface)!important;border-top:1px solid var(--tm-border)!important;padding:12px!important;gap:10px!important}
#modalOverlay.tasima-yonetim-modal #modalKaydetBtn{background:var(--tm-brand)!important;border-color:var(--tm-brand)!important;color:#fff!important;font-weight:800!important}

#modalOverlay.tasima-oturma-modal .modal,#modalOverlay.tasima-oturma-modal .modal-box,#modalOverlay.tasima-oturma-modal .modal-content{width:min(96vw,720px)!important;max-width:720px!important;max-height:92dvh!important;border-radius:24px!important;border:1px solid var(--tm-border)!important;background:var(--tm-surface)!important;color:var(--tm-text)!important;overflow:hidden}
#modalOverlay.tasima-oturma-modal .modal-body{padding:12px!important;background:var(--tm-surface)!important;overflow-y:auto!important}
#modalOverlay.tasima-oturma-modal .so-modal-wrap{width:100%;max-width:100%;overflow-x:hidden}
#modalOverlay.tasima-oturma-modal .so-sablon-grup,#modalOverlay.tasima-oturma-modal .so-alt-panel{border:1px solid var(--tm-border);border-radius:16px;background:var(--tm-surface-2);padding:11px}
#modalOverlay.tasima-oturma-modal .so-arac-wrap{border:1px solid var(--tm-border);border-radius:20px;background:var(--tm-surface-2);padding:12px;margin:12px 0;overflow:auto}
#modalOverlay.tasima-oturma-readonly .tasima-readonly-banner{display:flex;align-items:center;gap:10px;margin:10px 0 12px;padding:11px 12px;border:1px solid color-mix(in srgb,var(--tm-brand) 45%,var(--tm-border));border-radius:14px;background:var(--tm-brand-soft);color:var(--tm-text)}
#modalOverlay.tasima-oturma-readonly .tasima-readonly-banner>span:first-child{font-size:20px}.tasima-readonly-banner strong,.tasima-readonly-banner small{display:block}.tasima-readonly-banner small{margin-top:2px;color:var(--tm-muted);font-size:11px}
#modalOverlay.tasima-oturma-readonly .so-sablon-grup[hidden],#modalOverlay.tasima-oturma-readonly .so-duzenle-satir[hidden],#modalOverlay.tasima-oturma-readonly #soDuzenleToolbar[hidden],#modalOverlay.tasima-oturma-readonly .so-alt-butonlar[hidden]{display:none!important}
#modalOverlay.tasima-oturma-readonly .sye-koltuk{cursor:default!important;pointer-events:none!important;transform:none!important}
#modalOverlay.tasima-oturma-readonly .so-arac-wrap{padding:16px 8px;background:linear-gradient(180deg,var(--tm-surface-2),var(--tm-surface));}
#modalOverlay.tasima-oturma-readonly #modalKaydetBtn[hidden],#modalOverlay.tasima-oturma-readonly #modalSilBtn[hidden]{display:none!important}

@media(max-width:600px){
  #tab-tasima.tasima-modern-ui{width:100%!important;padding-left:10px!important;padding-right:10px!important}
  #tab-tasima.tasima-modern-ui #servislerListesi .evrak-row{padding:13px 12px;border-radius:16px}
  #modalOverlay.tasima-yonetim-modal .modal,#modalOverlay.tasima-yonetim-modal .modal-box,#modalOverlay.tasima-yonetim-modal .modal-content{width:calc(100vw - 20px)!important;max-height:calc(100dvh - 28px)!important;border-radius:21px!important}
  #modalOverlay.tasima-yonetim-modal .form-row{grid-template-columns:1fr!important;gap:0!important}
  #modalOverlay.tasima-oturma-modal .modal,#modalOverlay.tasima-oturma-modal .modal-box,#modalOverlay.tasima-oturma-modal .modal-content{width:calc(100vw - 12px)!important;max-height:calc(100dvh - 18px)!important;border-radius:20px!important}
  #modalOverlay.tasima-oturma-modal .modal-body{padding:10px!important}
  .tasima-detay-body>div{padding:10px!important}
}
'''
              css_path.write_text(css, encoding='utf-8')

          if "const CACHE_ADI='oy-cache-v648';" not in sw:
              raise SystemExit('Beklenen service worker sürümü v648 bulunamadı; güvenli güncelleme durduruldu.')
          sw = sw.replace("const CACHE_ADI='oy-cache-v648';", "const CACHE_ADI='oy-cache-v649';", 1)
          sw_path.write_text(sw, encoding='utf-8')
      - name: Syntax check
        run: node --check js/tasima.js
      - name: Commit once to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tasima.js css/styles.css service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: role-aware transport and seating preview UI"
          git push origin main
