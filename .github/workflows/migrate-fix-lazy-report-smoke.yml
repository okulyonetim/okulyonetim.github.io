name: migrate-fix-lazy-report-smoke

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-fix-lazy-report-smoke.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python scripts/migrate-fix-lazy-report-smoke.py
      - name: Classic shell smoke
        run: node tests/classic-shell-v2-smoke.test.js
      - name: Dashboard smoke
        run: node tests/dashboard-card-routes-smoke.test.js
      - name: Architecture check
        run: node scripts/check-client-architecture.mjs
      - name: Cleanup migration files
        run: rm -f scripts/migrate-fix-lazy-report-smoke.py .github/workflows/migrate-fix-lazy-report-smoke.yml
      - name: Commit production
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'test(shell): align lazy report dependency contract'
          git push
