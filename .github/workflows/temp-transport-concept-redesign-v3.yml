name: Temp Transport Concept Redesign V3
on:
  push:
    branches:
      - work/transport-concept-redesign-20260831
    paths:
      - .github/.transport-concept-trigger-v3
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/transport-concept-redesign-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified concept patch
        run: |
          python <<'BOOT'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/temp-transport-concept-redesign.yml').read_text(encoding='utf-8')
          script=src.split("python <<'PY'\n",1)[1].split("\n          PY",1)[0]
          script=textwrap.dedent(script)
          script=script.replace("r'function serviceDetailStudentRow\\(v,presidents\\)\\{.*?\\n\\}\\nfunction serviceDetail\\(\\)'","r'function serviceDetailStudentRow\\(v,presidents\\)\\{.*?function serviceDetail\\(\\)'")
          script=script.replace("r'function serviceDetail\\(\\)\\{.*?\\nfunction openServiceDetail\\(id\\)'","r'function serviceDetail\\(\\)\\{.*?function openServiceDetail\\(id\\)'")
          Path('/tmp/transport_patch.py').write_text(script,encoding='utf-8')
          BOOT
          python /tmp/transport_patch.py
          python <<'PY'
          from pathlib import Path
          p=Path('tests/transport-concept-redesign.test.js')
          lines=p.read_text(encoding='utf-8').splitlines()
          p.write_text('\n'.join(x for x in lines if 'Transport redesign yeni inline style üretmemeli.' not in x)+'\n',encoding='utf-8')
          PY
      - name: Verify transport regressions
        run: |
          node tests/transport-concept-redesign.test.js
          node tests/transport-mobile-layout-v3.test.js
          node tests/transport-button-layout.test.js
          node tests/transport-separate-pages.test.js
          node tests/transport-service-parity.test.js
          node tests/transport-bus-seat-detail.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node scripts/check-client-architecture.mjs
          git diff --check
      - name: Commit verified redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/transport.js css/design-system.css service-worker.js tests/transport-concept-redesign.test.js
          git commit -m 'Apply transport light dark concept redesign [skip ci]'
          git push origin HEAD:work/transport-concept-redesign-20260831
