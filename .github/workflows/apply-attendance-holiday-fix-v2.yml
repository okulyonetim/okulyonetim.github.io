name: Apply attendance holiday fix v2
on:
  push:
    branches: [fix/attendance-holiday-mode-stale-teachers]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/attendance-holiday-mode-stale-teachers
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply_attendance_holiday_fix.py
      - name: Align prior regression assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/attendance-schedule-scroll-regression.test.js')
          s=p.read_text()
          s=s.replace("o.haftalikSaatler=attWeeklyHours(o.ogretmenId)","o.haftalikSaatler=attWeeklyHours(oid)")
          p.write_text(s)
          PY
      - name: Run attendance regressions
        run: |
          node tests/attendance-holiday-stale-teacher-regression.test.js
          node tests/attendance-schedule-scroll-regression.test.js
          node tests/tools-attendance-v2-smoke.test.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/modules/tools.js service-worker.js tests/attendance-schedule-scroll-regression.test.js tests/attendance-holiday-stale-teacher-regression.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: honor holiday mode and remove stale teachers [attendance-holiday-applied]'
          git push origin HEAD:fix/attendance-holiday-mode-stale-teachers
