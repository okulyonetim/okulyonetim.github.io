name: Fix class seating picker layer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-class-seating-picker-layer-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused picker layer fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          seating_path=Path('js/modules/class-seating.js')
          src=seating_path.read_text(encoding='utf-8')
          start=src.index('function chooseStudent(seat){')
          end=src.index('\nfunction setSelected', start)
          block=src[start:end]
          old='  document.body.appendChild(ov);'
          new='  (overlay||document.body).appendChild(ov);'
          if block.count(old)!=1:
              raise SystemExit(f'chooseStudent append target count={block.count(old)}')
          block=block.replace(old,new,1)
          src=src[:start]+block+src[end:]
          seating_path.write_text(src,encoding='utf-8')

          test_path=Path('tests/classes-mobile-parity-smoke.test.js')
          test=test_path.read_text(encoding='utf-8')
          marker='assert(seating.includes("seat.addEventListener(\'click\'")&&seating.includes(\'chooseStudent(seat)\'),\'Sıradaki artı/isim alanına dokunma öğrenci seçiciyi açmalı.\');'
          addition="assert(seating.includes('(overlay||document.body).appendChild(ov)'),\'Öğrenci seçici tam ekran oturma katmanının üstünde açılmalı.\');"
          if addition not in test:
              if marker not in test:
                  raise SystemExit('test insertion marker missing')
              test=test.replace(marker,marker+'\n'+addition,1)
              test_path.write_text(test,encoding='utf-8')

          sw_path=Path('service-worker.js')
          sw=sw_path.read_text(encoding='utf-8')
          if "const CACHE_ADI='oy-cache-v886';" not in sw:
              raise SystemExit('expected cache v886 missing')
          sw=sw.replace("const CACHE_ADI='oy-cache-v886';","const CACHE_ADI='oy-cache-v887';",1)
          sw_path.write_text(sw,encoding='utf-8')
          PY
      - name: Verify focused behavior
        run: |
          node --check js/modules/class-seating.js
          node tests/classes-mobile-parity-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
      - name: Commit focused fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/class-seating.js tests/classes-mobile-parity-smoke.test.js service-worker.js
          git commit -m 'fix: show class seating student picker above editor'
          git push origin HEAD:main
