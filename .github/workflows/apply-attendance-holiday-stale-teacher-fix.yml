name: Apply attendance holiday mode and stale teacher fix

on:
  push:
    branches:
      - fix/attendance-holiday-mode-stale-teachers

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/attendance-holiday-mode-stale-teachers
          fetch-depth: 0
      - name: Patch attendance holiday integration and stale teachers
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[attendance-holiday-applied\]'; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          path=Path('js/modules/tools.js')
          text=path.read_text()

          def repl(old,new,label):
            global text
            if old not in text:
              raise SystemExit(f'Expected block not found: {label}')
            text=text.replace(old,new,1)

          repl(
          "async function prepareAttendance(){if(!global.SyncEngine||!global.COL)return;const types=['devamsizlikCizelgesi','ogretmenler','dersProgrami','resmiTatiller','ogretmenIzinleri'].filter(t=>COL[t]);for(const type of types)SyncEngine.register(type,COL[type]);if(types.length){await SyncEngine.localHydrate(types);SyncEngine.schedule(100);}}",
          "async function prepareAttendance(){if(!global.SyncEngine||!global.COL)return;const types=['devamsizlikCizelgesi','ogretmenler','dersProgrami','resmiTatiller','ogretmenIzinleri','dersSaatleri'].filter(t=>COL[t]);for(const type of types)SyncEngine.register(type,COL[type]);if(types.length){await SyncEngine.localHydrate(types);SyncEngine.schedule(100);}}",
          'prepareAttendance')

          old="const ATT_DAY_KEYS={Pazartesi:'pzt','Salı':'sal','Çarşamba':'car',Perşembe:'per',Cuma:'cum'};\nfunction attCanEdit(){return typeof global.duzenleyebilir==='function'&&global.duzenleyebilir('personel')}"
          new="""const ATT_DAY_KEYS={Pazartesi:'pzt','Salı':'sal','Çarşamba':'car',Perşembe:'per',Cuma:'cum'};
function attDateKey(v){if(!v)return'';if(typeof v==='string')return v.slice(0,10);if(v?.toDate)v=v.toDate();const d=v instanceof Date?v:new Date(v);if(Number.isNaN(d.getTime()))return'';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function attHolidayRows(){const result=[],seen=new Set(),add=(t,ad='Tatil')=>{const key=attDateKey(t);if(!key||seen.has(key))return;seen.add(key);result.push({tarih:key,ad})};arr('resmiTatiller').forEach(x=>add(x?.tarih||x?.date||x,x?.ad||x?.aciklama||'Resmî Tatil'));const cfg=arr('dersSaatleri').find(x=>x.id==='ayarlar')||arr('dersSaatleri')[0]||{};let ranges=Array.isArray(cfg.tatilAraliklari)?cfg.tatilAraliklari:[];if(!ranges.length&&cfg.tatilModu&&cfg.tatilBaslangicTarihi&&cfg.okulAcilisTarihi){const end=new Date(`${cfg.okulAcilisTarihi}T12:00:00`);end.setDate(end.getDate()-1);ranges=[{ad:'Tatil Modu',baslangicTarihi:cfg.tatilBaslangicTarihi,bitisTarihi:attDateKey(end)}]}ranges.forEach(r=>{const bas=attDateKey(r?.baslangicTarihi||r?.baslangic),bit=attDateKey(r?.bitisTarihi||r?.bitis)||bas;if(!bas||!bit||bit<bas)return;const d=new Date(`${bas}T12:00:00`),last=new Date(`${bit}T12:00:00`);for(;d<=last;d.setDate(d.getDate()+1))add(d,r?.ad||'Planlı Tatil')});return result}
function attCanEdit(){return typeof global.duzenleyebilir==='function'&&global.duzenleyebilir('personel')}"""
          repl(old,new,'attendance holiday helper')

          repl(
          "function attSortedTeachers(doc){return Object.values(doc?.ogretmenler||{}).sort((a,b)=>attRolePriority(a.gorev)-attRolePriority(b.gorev)||String(a.adSoyad||'').localeCompare(String(b.adSoyad||''),'tr'))}",
          "function attSortedTeachers(doc){const activeIds=new Set(arr('ogretmenler').map(x=>String(x.id||''))),rows=Object.values(doc?.ogretmenler||{}),visible=activeIds.size?rows.filter(x=>activeIds.has(String(x.ogretmenId||''))):rows;return visible.sort((a,b)=>attRolePriority(a.gorev)-attRolePriority(b.gorev)||String(a.adSoyad||'').localeCompare(String(b.adSoyad||''),'tr'))}",
          'active teacher filtering')

          repl(
          "async function attCreateMonth(){if(!attCanEdit())return global.toast?.('Bu işlem için yetkiniz yok.');const rows=attTeacherRowsFromStore();if(!rows.length)return global.toast?.('Öğretmen listesi boş.');const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,map=global.DevamsizlikCizelgesiService.excelSatirlarindanAyOlustur(rows,y,m,arr('ogretmenler'),arr('resmiTatiller'),arr('ogretmenIzinleri'));try{await global.DevamsizlikCizelgesiService.ayOlustur(y,m,map);global.toast?.('Devamsızlık çizelgesi oluşturuldu.')}catch(e){global.toast?.(e?.message||'Çizelge oluşturulamadı.')}}",
          "async function attCreateMonth(){if(!attCanEdit())return global.toast?.('Bu işlem için yetkiniz yok.');const rows=attTeacherRowsFromStore();if(!rows.length)return global.toast?.('Öğretmen listesi boş.');const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,map=global.DevamsizlikCizelgesiService.excelSatirlarindanAyOlustur(rows,y,m,arr('ogretmenler'),attHolidayRows(),arr('ogretmenIzinleri'));try{await global.DevamsizlikCizelgesiService.ayOlustur(y,m,map);global.toast?.('Devamsızlık çizelgesi oluşturuldu.')}catch(e){global.toast?.(e?.message||'Çizelge oluşturulamadı.')}}",
          'create month holidays')

          old_auto="async function attAutoRefresh(){const doc=monthDoc();if(!doc||!attCanEdit())return;if(!global.confirm?.('Elle değiştirilmemiş günler güncel izin, resmi tatil ve ders programına göre yeniden hesaplanacak. Elle yaptığınız değişiklikler korunacak. Devam edilsin mi?'))return;const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,teacherIds=new Set(arr('ogretmenler').map(t=>String(t.id||'')));try{for(const original of Object.values(doc.ogretmenler||{})){const o=structuredClone(original);if(teacherIds.has(String(o.ogretmenId||'')))o.haftalikSaatler=attWeeklyHours(o.ogretmenId);const fresh=global.DevamsizlikCizelgesiService.ogretmenAyiniOtomatikUret(o,y,m,arr('resmiTatiller'),arr('ogretmenIzinleri')),manual=o.elleGunler||{},merged={...(o.gunler||{})};for(const g of Object.keys(fresh))if(!manual[g])merged[g]=fresh[g];for(let g=1;g<=global.DevamsizlikCizelgesiService.gunSayisi(y,m);g++)if(!manual[g]&&!(g in fresh))delete merged[g];o.gunler=merged;await global.DevamsizlikCizelgesiService.ogretmenVerisiGuncelle(y,m,o.ogretmenId,o)}global.toast?.('Otomatik günler ders programından tazelendi.')}catch(e){global.toast?.(e?.message||'Otomatik doldurma başarısız.')}}"
          new_auto="async function attAutoRefresh(){const doc=monthDoc();if(!doc||!attCanEdit())return;if(!global.confirm?.('Elle değiştirilmemiş günler güncel izin, planlı tatil, resmî tatil ve ders programına göre yeniden hesaplanacak. Silinmiş personeller çizelgeden kaldırılacak. Devam edilsin mi?'))return;const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,teacherIds=new Set(arr('ogretmenler').map(t=>String(t.id||''))),holidays=attHolidayRows();try{for(const [rowId,original] of Object.entries(doc.ogretmenler||{})){const o=structuredClone(original),oid=String(o.ogretmenId||rowId||'');if(!teacherIds.has(oid)){await global.DevamsizlikCizelgesiService.ogretmenSil(y,m,rowId);continue}o.haftalikSaatler=attWeeklyHours(oid);const fresh=global.DevamsizlikCizelgesiService.ogretmenAyiniOtomatikUret(o,y,m,holidays,arr('ogretmenIzinleri')),manual=o.elleGunler||{},merged={...(o.gunler||{})};for(const g of Object.keys(fresh))if(!manual[g])merged[g]=fresh[g];for(let g=1;g<=global.DevamsizlikCizelgesiService.gunSayisi(y,m);g++)if(!manual[g]&&!(g in fresh))delete merged[g];o.gunler=merged;await global.DevamsizlikCizelgesiService.ogretmenVerisiGuncelle(y,m,oid,o)}global.toast?.('Otomatik günler ders programı ve Tatil Modu ile tazelendi.')}catch(e){global.toast?.(e?.message||'Otomatik doldurma başarısız.')}}"
          repl(old_auto,new_auto,'auto refresh')

          repl(
          "const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,auto=global.DevamsizlikCizelgesiService.otomatikKodUret(o,y,m,day,arr('resmiTatiller'),arr('ogretmenIzinleri'))",
          "const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,auto=global.DevamsizlikCizelgesiService.otomatikKodUret(o,y,m,day,attHolidayRows(),arr('ogretmenIzinleri'))",
          'cell modal holiday calculation')

          repl(
          "else map=global.DevamsizlikCizelgesiService.excelSatirlarindanAyOlustur(rows,y,m,teachers,arr('resmiTatiller'),arr('ogretmenIzinleri'));",
          "else map=global.DevamsizlikCizelgesiService.excelSatirlarindanAyOlustur(rows,y,m,teachers,attHolidayRows(),arr('ogretmenIzinleri'));",
          'excel holiday calculation')

          repl(
          "'data.dersProgrami','data.resmiTatiller','data.ogretmenIzinleri'",
          "'data.dersProgrami','data.resmiTatiller','data.ogretmenIzinleri','data.dersSaatleri'",
          'subscribe holiday settings')

          path.write_text(text)

          sw=Path('service-worker.js')
          sw_text=sw.read_text()
          if "const CACHE_ADI='oy-cache-v934';" not in sw_text:
            raise SystemExit('Expected cache version v934 not found')
          sw.write_text(sw_text.replace("const CACHE_ADI='oy-cache-v934';","const CACHE_ADI='oy-cache-v935';",1))

          previous=Path('tests/attendance-schedule-scroll-regression.test.js')
          if previous.exists():
            p=previous.read_text().replace("oy-cache-v934","oy-cache-v935")
            previous.write_text(p)

          test=Path('tests/attendance-holiday-stale-teacher-regression.test.js')
          test.write_text("""const fs=require('fs');\nconst assert=require('assert');\nconst src=fs.readFileSync('js/modules/tools.js','utf8');\nconst sw=fs.readFileSync('service-worker.js','utf8');\nnew Function(src);\nassert(src.includes("'dersSaatleri'"),'Attendance prepare Tatil Modu ayarlarını hydrate etmeli.');\nassert(src.includes('function attHolidayRows()'),'Planlı tatil tarihlerini resmî tatillerle birleştiren yardımcı bulunmalı.');\nassert(src.includes('cfg.tatilAraliklari'),'Yeni Tatil Modu aralıkları kullanılmalı.');\nassert(src.includes('cfg.tatilBaslangicTarihi')&&src.includes('cfg.okulAcilisTarihi'),'Eski Tatil Modu alanları desteklenmeli.');\nassert(src.includes('attHolidayRows(),arr(\\'ogretmenIzinleri\\')'),'Otomatik hesaplama planlı tatilleri kullanmalı.');\nassert(src.includes("activeIds.has(String(x.ogretmenId||''))"),'Silinmiş öğretmenler çizelge görünümünden filtrelenmeli.');\nassert(src.includes('DevamsizlikCizelgesiService.ogretmenSil(y,m,rowId)'),'Otomatik tazeleme silinmiş öğretmeni aylık kayıttan temizlemeli.');\nassert(src.includes("'data.dersSaatleri'"),'Tatil ayarı değişikliği çizelgeyi yeniden render etmeli.');\nassert(sw.includes("const CACHE_ADI='oy-cache-v935';"),'Yeni attendance kodu yeni PWA cache sürümüyle dağıtılmalı.');\nconsole.log('Devamsızlık Tatil Modu + silinmiş öğretmen regresyon testi başarılı.');\n""")
          PY
          node tests/attendance-holiday-stale-teacher-regression.test.js
          node tests/attendance-schedule-scroll-regression.test.js
          node tests/tools-attendance-v2-smoke.test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/modules/tools.js service-worker.js tests/attendance-schedule-scroll-regression.test.js tests/attendance-holiday-stale-teacher-regression.test.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: honor holiday mode and remove stale teachers [attendance-holiday-applied]'
          git push origin HEAD:fix/attendance-holiday-mode-stale-teachers
