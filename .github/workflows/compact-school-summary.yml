name: compact-school-summary
on:
  push:
    paths:
      - 'scripts/compact-school-summary.py'
jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply compact school summary
        run: python3 scripts/compact-school-summary.py
      - name: Syntax checks
        run: node --check js/modules/dashboard.js
      - name: Dashboard checks
        run: |
          node tests/dashboard-card-routes-smoke.test.js
          node tests/dashboard-reminders-smoke.test.js
          node tests/dashboard-quick-actions.test.js
      - name: Architecture checks
        run: node scripts/check-client-architecture.mjs
      - name: Cleanup temporary migration files
        run: rm scripts/compact-school-summary.py .github/workflows/compact-school-summary.yml
      - name: Commit production migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/design-system.css tests/dashboard-reminders-smoke.test.js service-worker.js scripts/compact-school-summary.py .github/workflows/compact-school-summary.yml
          git commit -m 'refactor(dashboard): compact school summary cards'
          git push
