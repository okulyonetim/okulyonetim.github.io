name: Apply UI stability v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ui-stability-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonical files and test
        shell: bash
        run: |
          set -u
          python - <<'PY'
          from pathlib import Path
          import re
          def sub1(text,pat,repl,label):
              out,n=re.subn(pat,repl,text,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'{label}: expected 1 got {n}')
              return out
          def rep1(text,old,new,label):
              n=text.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 got {n}')
              return text.replace(old,new,1)

          # Dashboard: smooth ticker, current-session timer + total timer, hydrate before subscriptions.
          p=Path('js/modules/dashboard.js');d=p.read_text(encoding='utf-8')
          d=sub1(d,r"function stabilizeNewsTicker\(root=document\)\{.*?\}\nfunction trialTotalMin","""function stabilizeNewsTicker(root=document){
const news=root.querySelector?.('.kh-news'),loop=news?.querySelector('.kh-news-loop');
if(!news||!loop||news.dataset.tickerReady==='1')return;
const measure=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
 if(!news.isConnected||!loop.isConnected||news.dataset.tickerReady==='1')return;
 const width=Math.ceil(loop.getBoundingClientRect().width);if(width<=0)return;
 news.style.setProperty('--kh-news-distance',`-${width}px`);
 news.style.setProperty('--kh-ticker-time',`${Math.max(28,width/30)}s`);
 news.dataset.tickerReady='1';news.classList.add('is-ready');
}));
if(document.fonts?.ready)document.fonts.ready.then(measure).catch(measure);else measure();
}
function trialTotalMin""",'ticker stabilizer')
          d=sub1(d,r"function trialTimerState\(d,nowMs=Date\.now\(\)\)\{.*?\n\}\nfunction trialFmt","""function trialTimerState(d,nowMs=Date.now()){
const mins=trialTotalMin(d),total=Math.max(0,mins*60),multi=d?.oturumTuru==='İki Oturum',manualActive=d?.sayacDurumu?.aktif===true,manualRaw=manualActive&&d?.sayacDurumu?.baslatmaTarihi?new Date(d.sayacDurumu.baslatmaTarihi).getTime():0,manualStart=Number.isFinite(manualRaw)?manualRaw:0,start=manualStart||trialStartMs(d),end=start&&total?start+total*1000:0,base={multi,total,start,end,secondsUntilStart:0};
if(!start||total<=0)return{...base,run:false,status:'ready',remaining:Math.max(0,total),label:total>0?'Başlangıç bekleniyor':'Süre eksik',progress:0,sessionRemaining:Math.max(0,total),sessionTotal:Math.max(0,total),sessionProgress:0};
const until=(start-nowMs)/1000;if(until>0)return{...base,run:false,status:'scheduled',remaining:total,label:'Başlamayı bekliyor',progress:0,sessionRemaining:total,sessionTotal:total,sessionProgress:0,secondsUntilStart:until};
const elapsed=Math.max(0,(nowMs-start)/1000),remaining=Math.max(0,total-elapsed),progress=Math.max(0,Math.min(100,elapsed/total*100));
if(remaining<=0)return{...base,run:false,status:'done',remaining:0,label:'Tamamlandı',progress:100,sessionRemaining:0,sessionTotal:0,sessionProgress:100};
if(multi){
 const verbal=Math.max(0,(Number(d.sozelSuresiDk)||0)*60),pause=Math.max(0,(Number(d.araSureDk)||0)*60),numeric=Math.max(0,(Number(d.sayisalSuresiDk)||0)*60);
 let status='active',label='Sözel oturum',sessionTotal=verbal,sessionElapsed=elapsed;
 if(elapsed>=verbal&&elapsed<verbal+pause){status='break';label='Ara';sessionTotal=pause;sessionElapsed=elapsed-verbal}
 else if(elapsed>=verbal+pause){label='Sayısal oturum';sessionTotal=numeric;sessionElapsed=elapsed-verbal-pause}
 const sessionRemaining=Math.max(0,sessionTotal-sessionElapsed),sessionProgress=sessionTotal>0?Math.max(0,Math.min(100,sessionElapsed/sessionTotal*100)):100;
 return{...base,run:true,status,label,remaining,progress,sessionRemaining,sessionTotal,sessionProgress};
}
return{...base,run:true,status:'active',remaining,label:'Sınav sürüyor',progress,sessionRemaining:remaining,sessionTotal:total,sessionProgress:progress};
}
function trialFmt""",'trial state')
          d=sub1(d,r"function trialCounterSection\(\)\{.*?\nfunction schoolClassLevel","""function trialCounterSection(){const list=trialLiveRows().slice(0,1);if(!list.length)return'';return`<section class="kh-trial-live" data-home-section="trial-counter">${list.map(({exam:x,state:st})=>{const finish=x.oturumTuru==='İki Oturum'?(x.sayisalBitis||x.bitisSaati||'—'):(x.bitisSaati||'—'),classes=x.sinflar||x.siniflar||'—',pct=Math.round(st.sessionProgress||0),multi=st.multi===true,timeLabel=multi?'OTURUM KALAN':'SINAV KALAN';return`<button type="button" class="kh-trial-live__card ${st.status==='break'?'is-break':''}" data-dash-route="academic" data-dash-page="trial" data-dash-title="Deneme Sınavları" data-dash-trial-open="${esc(x.id)}"><span class="kh-trial-live__head"><span class="kh-trial-live__badge"><i></i> AKTİF DENEME SINAVI</span><span class="kh-trial-live__detail">Detaylar ›</span></span><span class="kh-trial-live__title">${esc(x.ad||x.baslik||'Deneme sınavı')}</span><span class="kh-trial-live__session" data-dash-trial-label="${esc(x.id)}">${esc(st.label)}</span><span class="kh-trial-live__times"><span class="kh-trial-live__time is-session"><small>${timeLabel}</small><strong data-dash-trial-session-timer="${esc(x.id)}">${esc(trialFmt(st.sessionRemaining))}</strong></span>${multi?`<span class="kh-trial-live__time is-total"><small>TOPLAM SINAV KALAN</small><strong data-dash-trial-total-timer="${esc(x.id)}">${esc(trialFmt(st.remaining))}</strong></span>`:''}</span><span class="kh-trial-live__progress-head"><small>${st.status==='break'?'ARA İLERLEMESİ':'OTURUM İLERLEMESİ'}</small><b data-dash-trial-progress-label="${esc(x.id)}">%${pct}</b></span><progress class="kh-trial-live__progress" data-dash-trial-session-progress="${esc(x.id)}" max="100" value="${pct}">${pct}%</progress><span class="kh-trial-live__meta"><span><small>◷ BİTİŞ</small><b>${esc(finish)}</b></span><span><small>▣ TARİH</small><b>${esc(date(x.tarih))}</b></span><span><small>👥 SINIFLAR</small><b>${esc(classes)}</b></span></span></button>`}).join('')}</section>`}
function refreshTrialTimers(root=document){const live=trialLiveRows().slice(0,1),cards=[...root.querySelectorAll?.('[data-dash-trial-open]')||[]],wanted=live.map(x=>String(x.exam.id)).join('|'),shown=cards.map(x=>String(x.dataset.dashTrialOpen||'')).join('|');if(wanted!==shown){if(mounted)queueRender();return}cards.forEach(card=>{const item=live.find(x=>String(x.exam.id)===String(card.dataset.dashTrialOpen));if(item)card.classList.toggle('is-break',item.state.status==='break')});root.querySelectorAll?.('[data-dash-trial-session-timer]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialSessionTimer));if(item)el.textContent=trialFmt(item.state.sessionRemaining)});root.querySelectorAll?.('[data-dash-trial-total-timer]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialTotalTimer));if(item)el.textContent=trialFmt(item.state.remaining)});root.querySelectorAll?.('[data-dash-trial-label]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialLabel));if(item)el.textContent=item.state.label});root.querySelectorAll?.('[data-dash-trial-session-progress]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialSessionProgress));if(item)el.value=Math.round(item.state.sessionProgress||0)});root.querySelectorAll?.('[data-dash-trial-progress-label]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialProgressLabel));if(item)el.textContent=`%${Math.round(item.state.sessionProgress||0)}`})}

function schoolClassLevel""",'home trial card')
          d=rep1(d,'root.innerHTML=shell();bindPresentation(root);subscribe();await prepareReminderData();if(!mounted)return false;render();','root.innerHTML=shell();bindPresentation(root);await prepareReminderData();if(!mounted)return false;subscribe();render();','dashboard hydration')
          p.write_text(d,encoding='utf-8')

          # Academic: hydrate first and redesign only the written page renderer. Existing form/data behavior stays untouched.
          p=Path('js/modules/academic.js');a=p.read_text(encoding='utf-8')
          a=rep1(a,'root.innerHTML=shell();bind();subscribe();await prepareLocal();render();','root.innerHTML=shell();bind();await prepareLocal();if(!mounted)return false;subscribe();render();','academic hydration')
          a=sub1(a,r"function written\(\)\{.*?\nfunction canControl","""function written(){
const list=arr('sinavlar').filter(s=>match([s.ders,s.sinif,s.siniflar,s.donem,s.yaziliSirasi,s.tur,s.tarih,s.yayinevi,s.notlar])).sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||'')),todayCount=list.filter(s=>examDayDiff(s.tarih)===0).length,soon=list.filter(s=>{const d=examDayDiff(s.tarih);return d!==null&&d>=0&&d<=7}).length;
const add=canEditExams()?'<button class="ka-btn ka-written-add" type="button" data-written-new data-ka-permission="academic.exams.edit" data-ka-write="academic.exams.edit">＋ Yazılı Ekle</button>':'';
return{count:list.length,html:`<section class="ka-stack ka-written-page"><article class="ka-written-hero"><div class="ka-written-hero__intro"><span class="ka-written-hero__icon">✓</span><div><small>YAZILI SINAV TAKVİMİ</small><h2>Yazılı Sınavlar</h2><p>Sınav tarihlerini, sınıfları ve ayrıntıları tek ekrandan yönetin.</p></div></div>${add}</article><div class="ka-written-summary"><article><b>${list.length}</b><span>Toplam sınav</span></article><article class="is-soon"><b>${soon}</b><span>7 gün içinde</span></article><article class="is-today"><b>${todayCount}</b><span>Bugün</span></article></div><section class="ka-written-register"><div class="ka-written-register__head"><div><small>SINAV KAYITLARI</small><h3>Planlanan yazılılar</h3></div><span>${list.length} kayıt</span></div><div class="ka-written-list">${list.length?list.map(s=>{const editable=SinavlarService?.sinavDuzenlenebilirMi?.(s),d=examDayDiff(s.tarih),status=d===0?'Bugün':d!==null&&d>0&&d<=7?`${d} gün kaldı`:date(s.tarih),classes=s.siniflar||s.sinif||'Sınıf belirtilmemiş',meta=[date(s.tarih),s.dersSaati?`${s.dersSaati}. ders`:null,s.ogretmenId?teacherName(s.ogretmenId):null,s.senaryoNo?`${s.senaryoNo}. Senaryo`:null,s.yayinevi||null].filter(Boolean);return`<article class="ka-written-card ${d===0?'is-today':d!==null&&d>0&&d<=7?'is-soon':''}"><div class="ka-written-card__icon">✓</div><div class="ka-written-card__main"><div class="ka-written-card__head"><div><strong>${esc(s.ders||'Yazılı sınav')} <span>— ${esc(classes)}</span></strong><div class="ka-written-card__chips"><span>${esc(s.donem||'Dönem')}</span><span>${esc(s.yaziliSirasi||s.tur||'Yazılı')}</span></div></div><span class="ka-written-date ${d===0?'is-today':d!==null&&d>0&&d<=7?'is-soon':''}">${esc(status)}</span></div><div class="ka-written-meta">${meta.map(v=>`<span>${esc(v)}</span>`).join('')}</div>${s.notlar?`<div class="ka-written-note">${esc(s.notlar)}</div>`:''}${editable?`<div class="ka-written-card__actions"><button class="ka-btn ka-btn--secondary ka-btn--sm" type="button" data-written-edit="${esc(s.id)}">Düzenle</button></div>`:''}</div></article>`}).join(''):'<div class="ka-empty ka-written-empty"><strong>Henüz yazılı sınavı eklenmedi.</strong><span>Yeni bir sınav oluşturmak için “Yazılı Ekle” butonunu kullanın.</span></div>'}</div></section></section>`}}
function canControl""",'written renderer')
          p.write_text(a,encoding='utf-8')

          # Central design system only.
          p=Path('css/design-system.css');c=p.read_text(encoding='utf-8')
          c=rep1(c,'.ka-route-switching{visibility:hidden!important}','.ka-route-switching{pointer-events:none}','route flash css')
          c=rep1(c,'padding-inline:12px;contain:paint;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 12px,#000 calc(100% - 12px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 12px,#000 calc(100% - 12px),transparent 100%)','padding-inline:12px;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 12px,#000 calc(100% - 12px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 12px,#000 calc(100% - 12px),transparent 100%)','ticker viewport containment')
          c=rep1(c,'backface-visibility:hidden;contain:layout paint','backface-visibility:hidden','ticker track containment')
          home='''/* DENEME AUTO TIMER — CANONICAL 2026 */
.kh-trial-live{width:100%;min-width:0}.kh-trial-live__card{width:100%;display:block;padding:16px;border:1px solid color-mix(in srgb,var(--ka-primary) 32%,var(--ka-border));border-radius:21px;background:radial-gradient(circle at 92% 4%,color-mix(in srgb,var(--ka-warning) 10%,transparent),transparent 31%),linear-gradient(145deg,color-mix(in srgb,var(--ka-primary) 8%,var(--ka-card-bg)),var(--ka-card-bg));color:var(--ka-text);box-shadow:var(--ka-shadow-md);text-align:left;cursor:pointer}.kh-trial-live__card.is-break{border-color:color-mix(in srgb,var(--ka-warning) 48%,var(--ka-border));background:linear-gradient(145deg,color-mix(in srgb,var(--ka-warning) 9%,var(--ka-card-bg)),var(--ka-card-bg))}.kh-trial-live__head{display:flex;align-items:center;justify-content:space-between;gap:10px}.kh-trial-live__badge{display:inline-flex;align-items:center;gap:7px;color:var(--ka-primary);font-size:9.5px;font-weight:900;letter-spacing:.075em}.kh-trial-live__badge i{width:7px;height:7px;border-radius:50%;background:var(--ka-success);box-shadow:0 0 0 5px color-mix(in srgb,var(--ka-success) 12%,transparent)}.kh-trial-live__card.is-break .kh-trial-live__badge{color:var(--ka-warning)}.kh-trial-live__detail{color:var(--ka-primary);font-size:10.5px;font-weight:850}.kh-trial-live__title{display:block;margin-top:10px;font-size:19px;font-weight:900;line-height:1.2}.kh-trial-live__session{display:inline-flex;margin-top:6px;padding:5px 8px;border-radius:999px;background:var(--ka-primary-soft);color:var(--ka-primary);font-size:10px;font-weight:850}.kh-trial-live__card.is-break .kh-trial-live__session{background:color-mix(in srgb,var(--ka-warning) 13%,var(--ka-card-bg));color:var(--ka-warning)}.kh-trial-live__times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}.kh-trial-live__time{display:grid;gap:4px;padding:11px 12px;border:1px solid var(--ka-border);border-radius:14px;background:color-mix(in srgb,var(--ka-muted-bg) 72%,var(--ka-card-bg))}.kh-trial-live__times .kh-trial-live__time:only-child{grid-column:1/-1}.kh-trial-live__time small{color:var(--ka-text-muted);font-size:8px;font-weight:900;letter-spacing:.07em}.kh-trial-live__time strong{font-family:var(--ka-font-mono);font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}.kh-trial-live__time.is-session strong{color:var(--ka-primary)}.kh-trial-live__card.is-break .kh-trial-live__time.is-session strong{color:var(--ka-warning)}.kh-trial-live__progress-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px}.kh-trial-live__progress-head small{color:var(--ka-text-muted);font-size:8px;font-weight:900;letter-spacing:.07em}.kh-trial-live__progress-head b{color:var(--ka-primary);font-size:10px}.kh-trial-live__card.is-break .kh-trial-live__progress-head b{color:var(--ka-warning)}.kh-trial-live__progress{display:block;width:100%;height:8px;margin-top:6px;border:0;border-radius:999px;overflow:hidden;background:var(--ka-border);appearance:none;-webkit-appearance:none}.kh-trial-live__progress::-webkit-progress-bar{background:var(--ka-border);border-radius:999px}.kh-trial-live__progress::-webkit-progress-value{background:linear-gradient(90deg,var(--ka-primary),color-mix(in srgb,var(--ka-primary) 58%,var(--ka-warning)));border-radius:999px}.kh-trial-live__progress::-moz-progress-bar{background:linear-gradient(90deg,var(--ka-primary),color-mix(in srgb,var(--ka-primary) 58%,var(--ka-warning)));border-radius:999px}.kh-trial-live__card.is-break .kh-trial-live__progress::-webkit-progress-value{background:var(--ka-warning)}.kh-trial-live__card.is-break .kh-trial-live__progress::-moz-progress-bar{background:var(--ka-warning)}.kh-trial-live__meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:13px}.kh-trial-live__meta>span{display:grid;gap:3px;padding:9px 8px;border:1px solid var(--ka-border);border-radius:12px;background:color-mix(in srgb,var(--ka-muted-bg) 68%,var(--ka-card-bg));text-align:center}.kh-trial-live__meta small{color:var(--ka-text-muted);font-size:7.5px;font-weight:850}.kh-trial-live__meta b{font-size:10.5px;overflow-wrap:anywhere}
[data-theme="dark"] .kh-trial-live__card{background:radial-gradient(circle at 92% 4%,color-mix(in srgb,var(--ka-warning) 7%,transparent),transparent 31%),linear-gradient(145deg,color-mix(in srgb,var(--ka-primary) 13%,var(--ka-card-bg)),var(--ka-card-bg));box-shadow:0 14px 30px rgba(0,0,0,.28)}
@media(max-width:640px){.kh-trial-live__card{padding:14px}.kh-trial-live__title{font-size:18px}.kh-trial-live__time{padding:10px}.kh-trial-live__time strong{font-size:17px}.kh-trial-live__meta>span{padding:8px 5px}}
'''
          c=sub1(c,r"/\* DENEME AUTO TIMER — CANONICAL 2026 \*/.*?(?=\.ka-trial-add)",home,'home trial css')
          written='''/* Written Exams visible workspace */
.ka-written-page{width:min(100%,960px);margin-inline:auto;gap:13px}.ka-written-hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px;border:1px solid color-mix(in srgb,var(--ka-primary) 24%,var(--ka-border));border-radius:21px;background:linear-gradient(135deg,color-mix(in srgb,var(--ka-primary) 10%,var(--ka-card-bg)),var(--ka-card-bg) 62%,color-mix(in srgb,var(--ka-warning) 7%,var(--ka-card-bg)));box-shadow:var(--ka-shadow-sm)}.ka-written-hero::after{content:"";position:absolute;width:155px;height:155px;right:-78px;bottom:-105px;border-radius:50%;background:color-mix(in srgb,var(--ka-primary) 9%,transparent);pointer-events:none}.ka-written-hero__intro{position:relative;z-index:1;display:flex;align-items:center;gap:12px;min-width:0}.ka-written-hero__icon{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:15px;background:var(--ka-primary);color:var(--ka-text-inverse);font-size:24px;font-weight:950;box-shadow:0 8px 18px color-mix(in srgb,var(--ka-primary) 20%,transparent)}.ka-written-hero__intro small{display:block;margin-bottom:3px;color:var(--ka-primary);font-size:8.5px;font-weight:900;letter-spacing:.1em}.ka-written-hero h2{margin:0;font-size:22px;line-height:1.1}.ka-written-hero p{margin:5px 0 0;color:var(--ka-text-muted);font-size:11.5px;line-height:1.45}.ka-written-add{position:relative;z-index:1;flex:0 0 auto;min-height:43px;border-radius:14px;box-shadow:0 8px 18px color-mix(in srgb,var(--ka-primary) 18%,transparent)}.ka-written-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.ka-written-summary article{position:relative;overflow:hidden;min-height:76px;padding:12px 13px;border:1px solid var(--ka-border);border-radius:16px;background:var(--ka-card-bg);box-shadow:var(--ka-shadow-sm);display:flex;flex-direction:column;justify-content:center}.ka-written-summary article::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ka-primary)}.ka-written-summary article.is-soon::before{background:var(--ka-warning)}.ka-written-summary b{font-size:23px;line-height:1;font-variant-numeric:tabular-nums}.ka-written-summary article.is-soon b{color:var(--ka-warning)}.ka-written-summary article.is-today b{color:var(--ka-primary)}.ka-written-summary span{margin-top:6px;color:var(--ka-text-muted);font-size:9.5px;font-weight:850;text-transform:uppercase;letter-spacing:.035em}.ka-written-register{display:grid;gap:9px}.ka-written-register__head{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 3px}.ka-written-register__head small{display:block;color:var(--ka-text-muted);font-size:8.5px;font-weight:850;letter-spacing:.08em}.ka-written-register__head h3{margin:2px 0 0;font-size:16px}.ka-written-register__head>span{color:var(--ka-text-muted);font-size:9.5px;font-weight:800}.ka-written-list{display:grid;gap:8px}.ka-written-card{display:grid;grid-template-columns:44px minmax(0,1fr);gap:11px;align-items:start;padding:13px;border:1px solid var(--ka-border);border-radius:17px;background:var(--ka-card-bg);box-shadow:var(--ka-shadow-sm)}.ka-written-card.is-today{border-color:color-mix(in srgb,var(--ka-primary) 38%,var(--ka-border))}.ka-written-card.is-soon{border-color:color-mix(in srgb,var(--ka-warning) 38%,var(--ka-border))}.ka-written-card__icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--ka-primary) 18%,var(--ka-border));border-radius:14px;background:var(--ka-primary-soft);color:var(--ka-primary);font-size:21px;font-weight:950}.ka-written-card__main{min-width:0}.ka-written-card__head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.ka-written-card__head>div{min-width:0}.ka-written-card__head strong{display:block;font-size:13.5px;line-height:1.35}.ka-written-card__head strong span{color:var(--ka-text-muted);font-weight:750}.ka-written-card__chips{display:flex;gap:5px;flex-wrap:wrap;margin-top