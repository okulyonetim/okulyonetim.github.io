name: Communication UI Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-communication-ui-patch.mjs'
      - '.github/workflows/communication-ui-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded communication UI migration
        run: node scripts/apply-communication-ui-patch.mjs
      - name: Verify communication contract
        run: node tests/communication-local-first-contract.test.js
      - name: Verify client architecture
        run: |
          node scripts/build-client-bundles.mjs
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit production migration
        run: |
          if git diff --quiet -- js/modules/communication.js; then
            echo 'No production diff generated.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/communication.js
          git commit -m 'feat(communication): restore announcement poll and news actions'
          git push
