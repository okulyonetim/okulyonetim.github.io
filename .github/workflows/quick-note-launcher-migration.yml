name: Quick Note Launcher Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-quick-note-launcher.mjs'
      - 'tests/quick-note-launcher.test.js'
      - '.github/workflows/quick-note-launcher-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded quick-note launcher migration
        run: node scripts/apply-quick-note-launcher.mjs
      - name: Verify quick-note launcher contract
        run: node tests/quick-note-launcher.test.js
      - name: Verify bundles and architecture
        run: node scripts/build-client-bundles.mjs && node tests/module-bundles-smoke.test.js && node scripts/check-client-architecture.mjs
      - name: Commit production migration and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/shell-ui.js
          git diff --cached --quiet || git commit -m 'feat(notes): add quick-note launcher and checklist editor'
          git rm scripts/apply-quick-note-launcher.mjs .github/workflows/quick-note-launcher-migration.yml
          git commit -m 'chore(notes): remove completed quick-note migration helpers'
          git push origin HEAD:main
