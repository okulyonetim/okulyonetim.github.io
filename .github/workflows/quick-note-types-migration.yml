name: Quick Note Types Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-quick-note-types.mjs'
      - '.github/workflows/quick-note-types-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded legacy quick-note migration
        run: node scripts/migrate-quick-note-types.mjs
      - name: Verify quick-note and architecture contracts
        run: |
          node tests/quick-note-launcher.test.js
          node tests/communication-local-first-contract.test.js
          node tests/no-module-internal-tabs.test.js
          node scripts/build-client-bundles.mjs
          node scripts/check-client-architecture.mjs
      - name: Commit production migration and cleanup
        run: |
          rm scripts/migrate-quick-note-types.mjs .github/workflows/quick-note-types-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/shell-ui.js js/modules/communication.js tests/quick-note-launcher.test.js scripts/migrate-quick-note-types.mjs .github/workflows/quick-note-types-migration.yml
          git commit -m 'feat(notes): restore drawing image and table quick notes'
          git push
