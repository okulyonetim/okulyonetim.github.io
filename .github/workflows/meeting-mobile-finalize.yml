name: One-time Meeting Mobile Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meeting-mobile-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write verified meeting files
        env:
          JS_GZ_B64: ""
          TEST_GZ_B64: ""
          SW_GZ_B64: ""
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          files = {
            'js/modules/meeting-schedule.js': os.environ['JS_GZ_B64'],
            'tests/meeting-schedule-v1-smoke.test.js': os.environ['TEST_GZ_B64'],
            'service-worker.js': os.environ['SW_GZ_B64'],
          }
          for name, payload in files.items():
              Path(name).write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
      - name: Verify meeting files
        run: |
          node --check js/modules/meeting-schedule.js
          node --check service-worker.js
      - name: Commit finalized mobile meeting UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/meeting-schedule.js tests/meeting-schedule-v1-smoke.test.js service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: polish mobile meeting table controls'
          git push origin HEAD:main
