name: One-time Meeting Mobile Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meeting-mobile-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch verified meeting files
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('js/modules/meeting-schedule.js')
          s=p.read_text()
          def replace(old,new,expected=1):
              global s
              n=s.count(old)
              if n!=expected:
                  raise SystemExit(f'replacement mismatch {n}!={expected}: {old[:100]!r}')
              s=s.replace(old,new)

          replace('<select aria-label="${index+1}. satır ders"','<select class="ka-meeting-detail-control" aria-label="${index+1}. satır ders"')
          replace('<select aria-label="${index+1}. satır sınıf düzeyi"','<select class="ka-meeting-detail-control" aria-label="${index+1}. satır sınıf düzeyi"')
          replace('<input aria-label="${index+1}. satır konu veya gündem"','<input class="ka-meeting-detail-control" aria-label="${index+1}. satır konu veya gündem"')
          replace("if(row.tumSiniflar)return'<span class=\"ka-badge\">Tüm Sınıflar</span>';","if(row.tumSiniflar)return'<span class=\"ka-meeting-class-summary\"><strong>Tüm</strong><small>sınıflar</small></span>';" )
          replace("return names.length?names.map(n=>`<span class=\"ka-badge\">${esc(n)} ×</span>`).join(''):'<span class=\"ka-meeting-class-placeholder\">Sınıf seçiniz</span>';","return names.length?`<span class=\"ka-meeting-class-summary\"><strong>${names.length} sınıf</strong><small>seçildi</small></span>`:'<span class=\"ka-meeting-class-placeholder\">Sınıf seçiniz</span>';" )
          replace("  const list=eligibleClasses(row),selected=row.tumSiniflar?[]:row.sinifIdler.filter(Boolean),open=openClassRowId===row.uid;\n  return `<button type=\"button\" class=\"ka-input\" data-meeting-class-menu=\"${esc(row.uid)}\" aria-expanded=\"${open?'true':'false'}\" aria-label=\"Sınıf seçimi\">${classSelectionTags(row)} <span aria-hidden=\"true\">⌄</span></button>`;",
          "  const selectedNames=row.tumSiniflar?[]:row.sinifIdler.map(id=>classes().find(s=>s.id===id)).filter(Boolean).map(className),open=openClassRowId===row.uid;\n  const label=row.tumSiniflar?'Tüm sınıflar seçili':selectedNames.length?`${selectedNames.join(', ')} seçili`:'Sınıf seçiniz';\n  return `<button type=\"button\" class=\"ka-input ka-meeting-class-control\" data-meeting-class-menu=\"${esc(row.uid)}\" aria-expanded=\"${open?'true':'false'}\" aria-label=\"${esc(label)}\" title=\"${esc(label)}\">${classSelectionTags(row)}<span class=\"ka-meeting-cell-chevron\" aria-hidden=\"true\">⌄</span></button>`;")
          replace('<td class="ka-meeting-col-date"><input aria-label="${index+1}. satır tarih"','<td class="ka-meeting-col-date"><input class="ka-meeting-date-control" aria-label="${index+1}. satır tarih"')
          replace('<td class="ka-meeting-col-time"><input aria-label="${index+1}. satır saat"','<td class="ka-meeting-col-time"><input class="ka-meeting-time-control" aria-label="${index+1}. satır saat"')
          replace('class="ka-btn ka-btn--ghost ka-btn--sm ka-meeting-delete" data-meeting-remove-row','class="ka-btn ka-btn--ghost ka-btn--sm ka-meeting-delete ka-meeting-row-delete" data-meeting-remove-row')
          replace('class="ka-card__body ka-stack"><div class="ka-row ka-row--between"><div><h3>${editMode?', 'class="ka-card__body ka-stack"><div class="ka-row ka-row--between ka-meeting-form-head"><div><h3>${editMode?')
          replace('class="ka-grid ka-meeting-date-grid"><label class="ka-field"><span class="ka-field__label">Toplantı Türü</span>', 'class="ka-grid ka-meeting-common-grid"><label class="ka-field"><span class="ka-field__label">Toplantı Türü</span>')
          replace('<div class="ka-row ka-row--between"><div><h3>Toplantı Detayları (Satırlar)</h3>', '<div class="ka-row ka-row--between ka-meeting-detail-head"><div><h3>Toplantı Detayları (Satırlar)</h3>')
          replace('<div class="ka-table-wrap"><table class="ka-table"><thead>', '<div class="ka-table-wrap ka-meeting-table-wrap"><table class="ka-table ka-meeting-table"><thead>')
          replace('<th class="ka-meeting-col-actions">İşlemler</th>', '<th class="ka-meeting-col-actions">İşlem</th>')
          replace('<small class="ka-muted">ⓘ Sınıf seçimi isteğe bağlıdır. Birden fazla sınıf seçebilir veya boş bırakabilirsiniz.</small>', '<div class="ka-meeting-info">ⓘ Sınıf seçimi isteğe bağlıdır. Birden fazla sınıf seçebilir veya boş bırakabilirsiniz.</div>')
          replace('<div class="ka-row"><button type="button" class="ka-btn ka-btn--secondary ka-grow" data-meeting-reset ${saving?\'disabled\':\'\'}>${editMode?\'Vazgeç\':\'Temizle\'}</button><button type="button" class="ka-btn ka-grow" data-meeting-save-all ${saving?\'disabled\':\'\'}>💾 ${saving?\'Kaydediliyor…\':`Tümünü Kaydet (${rows.length})`}</button></div>', '<div class="ka-meeting-form-actions"><button type="button" class="ka-btn ka-btn--secondary" data-meeting-reset ${saving?\'disabled\':\'\'}>${editMode?\'Vazgeç\':\'Temizle\'}</button><button type="button" class="ka-btn" data-meeting-save-all ${saving?\'disabled\':\'\'}>💾 ${saving?\'Kaydediliyor…\':`Tümünü Kaydet (${rows.length})`}</button></div>')
          p.write_text(s)

          p=Path('tests/meeting-schedule-v1-smoke.test.js')
          s=p.read_text()
          def trepl(old,new,expected=1):
              global s
              n=s.count(old)
              if n!=expected:
                  raise SystemExit(f'test replacement mismatch {n}!={expected}: {old[:100]!r}')
              s=s.replace(old,new)

          trepl("assert(page.includes('<div class=\"ka-table-wrap\"><table class=\"ka-table\">')&&page.includes('<thead><tr><th class=\"ka-meeting-col-detail\">Ders / Konu</th>')&&page.includes('data-meeting-class-panel-row'),'Toplantı satırları mobilde de kart değil gerçek tablo satırı olmalı.');",
          "assert(page.includes('ka-meeting-class-summary')&&page.includes('${names.length} sınıf')&&page.includes('<small>seçildi</small>'),'Mobil sınıf hücresi uzun chipler yerine kompakt seçim özeti göstermeli.');\nassert(page.includes('ka-meeting-detail-control')&&page.includes('ka-meeting-date-control')&&page.includes('ka-meeting-time-control'),'Tablo hücreleri mobil geometri için özel kontrol sınıfları taşımalı.');\nassert(page.includes('<div class=\"ka-table-wrap ka-meeting-table-wrap\"><table class=\"ka-table ka-meeting-table\">')&&page.includes('<thead><tr><th class=\"ka-meeting-col-detail\">Ders / Konu</th>')&&page.includes('data-meeting-class-panel-row'),'Toplantı satırları mobilde de kart değil gerçek tablo satırı olmalı.');")
          trepl("for(const selector of ['.ka-meeting-page{','.ka-meeting-chip{','.ka-meeting-item{','.ka-meeting-report{']) assert(design.includes(selector),`Merkezi toplantı stili eksik: ${selector}`);",
          "for(const selector of ['.ka-meeting-page{','.ka-meeting-chip{','.ka-meeting-item{','.ka-meeting-report{','.ka-meeting-table{','.ka-meeting-detail-control{','.ka-meeting-class-summary{']) assert(design.includes(selector),`Merkezi toplantı stili eksik: ${selector}`);\nassert(design.includes('.ka-meeting-table{width:100%;table-layout:fixed'),'Toplantı tablosu mobilde sütunların ezilmesini önleyen fixed layout kullanmalı.');\nassert(design.includes('.ka-meeting-col-detail{width:32%')&&design.includes('.ka-meeting-col-date{width:22%'),'Toplantı tablosu ders ve tarih için kontrollü sütun oranları tanımlamalı.');\nassert(design.includes('.ka-meeting-report-button{position:static'),'Rapor düğmesi mobil alt navigasyonun üzerine sticky olarak binmemeli.');")
          trepl("assert(runtimeCache&&Number(runtimeCache[1])>=855,'Toplu toplantı formu yeni PWA cache sürümüyle yayınlanmalı.');", "assert(runtimeCache&&Number(runtimeCache[1])>=856,'Toplu toplantı formu yeni PWA cache sürümüyle yayınlanmalı.');")
          p.write_text(s)

          p=Path('service-worker.js')
          s=p.read_text()
          if s.count("const CACHE_ADI='oy-cache-v855';") != 1:
              raise SystemExit('cache line mismatch')
          p.write_text(s.replace("const CACHE_ADI='oy-cache-v855';","const CACHE_ADI='oy-cache-v856';"))
          PY
      - name: Verify meeting files
        run: |
          node --check js/modules/meeting-schedule.js
          node --check service-worker.js
          node tests/meeting-schedule-v1-smoke.test.js
      - name: Commit finalized mobile meeting UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/meeting-schedule.js tests/meeting-schedule-v1-smoke.test.js service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: polish mobile meeting table controls'
          git push origin HEAD:main
