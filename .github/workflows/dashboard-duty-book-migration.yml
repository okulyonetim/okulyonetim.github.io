name: Dashboard Duty Book Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/migrations/dashboard-duty-book.js'
      - '.github/workflows/dashboard-duty-book-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded dashboard duty-book migration
        run: node .github/migrations/dashboard-duty-book.js
      - name: Verify dashboard duty and architecture
        run: |
          node tests/dashboard-quick-actions.test.js
          node tests/classic-duty-v2-smoke.test.js
          node scripts/build-client-bundles.mjs
          node scripts/check-client-architecture.mjs
      - name: Commit production migration and cleanup
        run: |
          rm -f .github/migrations/dashboard-duty-book.js .github/workflows/dashboard-duty-book-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat(dashboard): restore teacher duty book toggle'
          git push
