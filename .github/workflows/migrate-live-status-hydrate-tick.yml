name: migrate-live-status-hydrate-tick

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-live-status-hydrate-tick.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python scripts/migrate-live-status-hydrate-tick.py
      - name: Syntax checks
        run: node --check js/modules/school-live-status.js
      - name: Classic shell smoke
        run: node tests/classic-shell-v2-smoke.test.js
      - name: Dashboard smoke
        run: node tests/dashboard-card-routes-smoke.test.js
      - name: Architecture check
        run: node scripts/check-client-architecture.mjs
      - name: Cleanup migration files
        run: rm -f scripts/migrate-live-status-hydrate-tick.py .github/workflows/migrate-live-status-hydrate-tick.yml
      - name: Commit production
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(live-status): refresh immediately after local hydrate'
          git push
