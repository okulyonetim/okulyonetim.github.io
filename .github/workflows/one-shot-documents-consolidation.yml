name: One Shot Documents Consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-documents-consolidation.yml'
      - '.github/one-shot/documents-patch-*.b64'

permissions:
  contents: write

jobs:
  consolidate:
    if: github.repository == 'sedonet23/okul' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reassemble and verify Documents patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/one-shot/documents-patch-0{0,1,2,3,4}.b64 | tr -d '\r\n ' > /tmp/documents-consolidation.b64
          base64 -d /tmp/documents-consolidation.b64 > /tmp/documents-consolidation.patch.gz
          gzip -t /tmp/documents-consolidation.patch.gz
          gzip -dc /tmp/documents-consolidation.patch.gz > /tmp/documents-consolidation.patch
          git apply --check /tmp/documents-consolidation.patch
          git apply /tmp/documents-consolidation.patch
          git diff --check

      - name: Verify consolidated Documents module
        shell: bash
        run: |
          set -euo pipefail
          test ! -e js/modules/classic-documents-parity.js
          node --check js/modules/documents.js
          node --check js/modules/school-live-status.js
          node --check js/core/shell-ui.js
          node scripts/build-client-bundles.mjs
          node tests/documents-viewer-v2-smoke.test.js
          node tests/document-viewer-smoke.test.js
          node tests/lazy-document-libs-smoke.test.js
          node tests/teblig-v2-smoke.test.js
          node tests/module-bundles-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/report-engine-a4-smoke.test.js
          node tests/report-native-print-routing-smoke.test.js
          node tests/retired-legacy-roots-smoke.test.js
          node tests/root-js-inventory-smoke.test.js
          node scripts/check-client-architecture.mjs

      - name: Commit Documents consolidation and remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/one-shot/documents-patch-0{0,1,2,3,4}.b64
          rmdir .github/one-shot 2>/dev/null || true
          rm -f .github/workflows/one-shot-documents-consolidation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Consolidate Documents workspace into canonical module'
          git push origin HEAD:main
