name: Retire Duplicate Student Pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/retire-duplicate-student-pages.mjs'
      - '.github/workflows/retire-duplicate-student-pages.yml'

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retire duplicate StudentPages implementations
        run: node scripts/retire-duplicate-student-pages.mjs
      - name: Verify canonical routing and teacher list contracts
        run: |
          node tests/student-tool-routing-smoke.test.js
          node tests/teacher-list-core-contract.test.js
          node tests/teacher-list-local-first-service.test.js
      - name: Verify client architecture
        run: |
          node scripts/build-client-bundles.mjs
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit retirement
        run: |
          if git diff --quiet -- js/modules/tools.js; then
            echo 'No production diff generated.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/tools.js
          git commit -m 'refactor(tools): retire duplicate student list and gradebook UIs'
          git push
