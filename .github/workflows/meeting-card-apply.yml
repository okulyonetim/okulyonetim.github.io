name: One-time Meeting Card Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meeting-card-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply verified meeting card patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/meeting-card.patch
          git apply --check /tmp/meeting-card.patch
          git apply /tmp/meeting-card.patch
      - name: Verify meeting card layout
        run: |
          node --check js/modules/meeting-schedule.js
          node tests/meeting-schedule-v1-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
      - name: Commit card layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/meeting-card-apply.yml
          git add js/modules/meeting-schedule.js css/design-system.css tests/meeting-schedule-v1-smoke.test.js service-worker.js
          git commit -m 'fix: switch meeting rows to mobile cards'
          git push origin HEAD:main
