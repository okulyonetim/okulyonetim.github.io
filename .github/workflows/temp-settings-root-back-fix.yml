name: Temporary settings root back fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix canonical shell navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/core/shell-ui.js')
          s=p.read_text()
          old="if(!handled&&navStack.length>1){navStack.pop();handled=await restoreView(navStack[navStack.length-1])}"
          new="if(!handled&&current?.kind==='route'&&current.name==='settings'&&global.SettingsModule?.currentPage?.()==='home'&&navStack.length===1){openMenu();renderMenuGrid();handled=true}if(!handled&&navStack.length>1){navStack.pop();handled=await restoreView(navStack[navStack.length-1])}"
          assert old in s, 'target not found'
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate
        run: |
          node --check js/core/shell-ui.js
          grep -q "current.name==='settings'.*currentPage.*==='home'.*navStack.length===1" js/core/shell-ui.js
      - name: Commit canonical fix and remove workflow
        run: |
          rm -f .github/workflows/temp-settings-root-back-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: return from settings root before exit prompt"
          git push
