name: Apply minimal class seating fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/class-seating-minimal-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused seating changes
        env:
          APPLY_PY_B64: ''
        run: |
          echo "$APPLY_PY_B64" | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
      - name: Verify focused seating behavior
        run: |
          node --check js/modules/class-seating.js
          node tests/classes-mobile-parity-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/report-engine-a4-smoke.test.js
      - name: Commit focused change
        shell: bash
        run: |
          git rm .github/workflows/class-seating-minimal-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/class-seating.js service-worker.js tests/classes-mobile-parity-smoke.test.js
          git commit -m 'feat: improve class seating assignment controls'
          git push origin HEAD:main
