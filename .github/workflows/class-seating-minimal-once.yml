name: Apply minimal class seating fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/class-seating-minimal-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused seating changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/modules/class-seating.js')
          s=p.read_text()

