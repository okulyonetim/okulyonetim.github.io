name: Schedule redesign PDF style hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path

          p=Path('js/core/schedule-report-redesign.js')
          s=p.read_text()
          s=s.replace('print-color-adjust:economy!important;-webkit-print-color-adjust:economy!important','print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important')
          s=s.replace('@media print{.ka-report .ka-sr-report *{print-color-adjust:economy!important;-webkit-print-color-adjust:economy!important}}','@media print{.ka-report .ka-sr-report *{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}}')
          anchor='.ka-report .ka-sr-sheet{table-layout:fixed;height:auto!important}'
          extra=(anchor+
            '.ka-report .ka-sr-sheet{border:1.25pt solid #66766f!important;outline:1.25pt solid #66766f!important;outline-offset:-1px}'
            '.ka-report .ka-sr-sheet thead>tr:first-child>th.scope{border-right:1.1pt solid #66766f!important}'
            '.ka-report .ka-sr-sheet thead>tr:first-child>th.ka-sr-day-a,.ka-report .ka-sr-sheet thead>tr:first-child>th.ka-sr-day-b{border-right:1.1pt solid #66766f!important}'
            '.ka-report .ka-sr-sheet thead>tr:nth-child(2)>th:nth-child(7n){border-right:1.1pt solid #66766f!important}'
            '.ka-report .ka-sr-sheet tbody>tr>th.scope{border-right:1.1pt solid #66766f!important}'
            '.ka-report .ka-sr-sheet tbody>tr>td:nth-of-type(7n){border-right:1.1pt solid #66766f!important}')
          if anchor not in s:
              raise SystemExit('Sheet style anchor not found')
          s=s.replace(anchor,extra,1)
          p.write_text(s)

          z=Path('js/core/schedule-report-column-zebra.js')
          zs=z.read_text()
          zs=zs.replace("background:#f4f8f6!important","background:#edf4f0!important;print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important")
          zs=zs.replace("background:#fff!important","background:#fff!important;print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important")
          zs=zs.replace("background:#eaf2ee!important","background:#e2ede7!important;print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important")
          zs=zs.replace("background:#f7faf8!important","background:#f8faf9!important;print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important")
          z.write_text(zs)

          f=Path('js/firebase-init.js')
          fs=f.read_text().replace('schedule-report-redesign.js?v=920','schedule-report-redesign.js?v=938').replace('schedule-report-column-zebra.js?v=922','schedule-report-column-zebra.js?v=938')
          f.write_text(fs)

          sw=Path('service-worker.js')
          ss=sw.read_text().replace("const CACHE_ADI='oy-cache-v937'","const CACHE_ADI='oy-cache-v938'").replace('schedule-report-redesign.js?v=920','schedule-report-redesign.js?v=938').replace('schedule-report-column-zebra.js?v=922','schedule-report-column-zebra.js?v=938')
          sw.write_text(ss)

          Path('.github/workflows/schedule-redesign-pdf-style-hotfix.yml').unlink()
      - run: |
          grep -F "print-color-adjust:exact" js/core/schedule-report-redesign.js
          grep -F "tbody>tr>td:nth-of-type(7n)" js/core/schedule-report-redesign.js
          grep -F "schedule-report-redesign.js?v=938" js/firebase-init.js service-worker.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/schedule-report-redesign.js js/core/schedule-report-column-zebra.js js/firebase-init.js service-worker.js .github/workflows/schedule-redesign-pdf-style-hotfix.yml
          git commit -m "fix: keep schedule zebra in PDF and strengthen day boundaries"
          git push
