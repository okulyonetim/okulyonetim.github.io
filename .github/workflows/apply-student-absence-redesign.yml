name: Apply student absence class filter redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-student-absence-redesign.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch student absence view
        env:
          NEW_SEGMENT_B64: ''
          TEST_B64: ''
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          p=Path('js/modules/tools.js')
          text=p.read_text(encoding='utf-8')
          start='function absenceRow(s){'
          end='async function renderAttendance(){'
          if text.count(start)!=1 or text.count(end)!=1:
              raise SystemExit('attendance patch markers are not unique')
          a=text.index(start);b=text.index(end,a)
          segment=base64.b64decode(os.environ['NEW_SEGMENT_B64']).decode('utf-8')
          p.write_text(text[:a]+segment+'\n'+text[b:],encoding='utf-8')
          sw=Path('service-worker.js')
          s=sw.read_text(encoding='utf-8')
          old="const CACHE_ADI='oy-cache-v896';"
          new="const CACHE_ADI='oy-cache-v897';"
          if s.count(old)!=1: raise SystemExit('unexpected service worker cache version')
          sw.write_text(s.replace(old,new),encoding='utf-8')
          Path('tests/student-attendance-absence-filter.test.js').write_text(base64.b64decode(os.environ['TEST_B64']).decode('utf-8'),encoding='utf-8')
          PY
      - name: Focused regression tests
        run: |
          node --check js/modules/tools.js
          node --test tests/student-attendance-absence-filter.test.js
          node tests/student-tool-routing-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-student-absence-redesign.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: add class filter to student absence view'
          git push
