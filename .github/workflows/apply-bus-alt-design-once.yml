name: Apply bus alternative design once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-bus-alt-design-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply alternative bus seating design
        run: python .github/scripts/apply-bus-alt-design.py
      - name: Test alternative bus seating design
        run: node tests/transport-seating-alt-design.test.js
      - name: Test bus shell visibility
        run: node tests/transport-bus-shell-visible.test.js
      - name: Test classic seating parity
        run: node tests/transport-seating-classic-parity.test.js
      - name: Test visual seating editor
        run: node tests/transport-seating-visual-editor.test.js
      - name: Test transport mobile layout
        run: node tests/transport-mobile-layout-v3.test.js
      - name: Test transport separate pages
        run: node tests/transport-separate-pages.test.js
      - name: Test local-first boundary
        run: node tests/modules-local-first-boundary.test.js
      - name: Test service worker
        run: node tests/service-worker-precache-smoke.test.js
      - name: Check client architecture
        run: node scripts/check-client-architecture.mjs
      - name: Commit verified design and remove one-time files
        run: |
          rm -f .github/workflows/apply-bus-alt-design-once.yml .github/scripts/apply-bus-alt-design.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: apply alternative bus seating design'
          git push origin HEAD:main
