name: Fix mobile news ticker sticky hover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-news-ticker-sticky-hover.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify base main
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="2878c8bdcca296f8c29e2178438a5f49198ddcb4"
          test "$(git rev-parse HEAD^)" = "$EXPECTED"

      - name: Fix touch ticker pause and bump cache
        shell: python
        run: |
          from pathlib import Path

          css_path=Path('css/design-system.css')
          css=css_path.read_text(encoding='utf-8')
          ready_old='.ka-home .kh-news.is-ready .kh-news-track{animation:khTicker var(--kh-ticker-time,28s) linear infinite}'
          ready_new='.ka-home .kh-news.is-ready .kh-news-track{animation:khTicker var(--kh-ticker-time,28s) linear infinite;animation-play-state:running}'
          hover_old='.ka-home .kh-news:hover .kh-news-track{animation-play-state:paused}'
          hover_new='@media(hover:hover) and (pointer:fine){.ka-home .kh-news:hover .kh-news-track{animation-play-state:paused}}'
          if css.count(ready_old)!=1:
              raise SystemExit(f'news ready rule count={css.count(ready_old)}')
          if css.count(hover_old)!=1:
              raise SystemExit(f'news hover pause rule count={css.count(hover_old)}')
          css=css.replace(ready_old,ready_new,1).replace(hover_old,hover_new,1)
          css_path.write_text(css,encoding='utf-8')

          test_path=Path('tests/dashboard-card-routes-smoke.test.js')
          test=test_path.read_text(encoding='utf-8')
          anchor="assert(css.includes('.ka-home .kh-news-viewport{overflow:hidden;white-space:nowrap;min-width:0;padding-inline:12px')&&css.includes('mask-image:linear-gradient(to right,transparent 0,#000 12px'),'Haber şeridi etikete yapışmamalı ve kırpılan başlık kenarda yumuşatılmalı.');"
          added="assert(css.includes('.ka-home .kh-news.is-ready .kh-news-track{animation:khTicker var(--kh-ticker-time,28s) linear infinite;animation-play-state:running}')&&css.includes('@media(hover:hover) and (pointer:fine){.ka-home .kh-news:hover .kh-news-track{animation-play-state:paused}}'),'Haber bandı dokunmatik cihazlarda sticky hover nedeniyle durmamalı; duraklatma yalnız gerçek hover cihazlarında çalışmalı.');"
          if anchor not in test:
              raise SystemExit('news smoke anchor missing')
          if added not in test:
              test=test.replace(anchor,anchor+'\n'+added,1)
          test_path.write_text(test,encoding='utf-8')

          index_path=Path('index.html')
          index=index_path.read_text(encoding='utf-8')
          if 'css/design-system.css?v=860' not in index:
              raise SystemExit('index css v860 not found')
          index=index.replace('css/design-system.css?v=860','css/design-system.css?v=861',1)
          index_path.write_text(index,encoding='utf-8')

          sw_path=Path('service-worker.js')
          sw=sw_path.read_text(encoding='utf-8')
          if "const CACHE_ADI='oy-cache-v860'" not in sw:
              raise SystemExit('service worker v860 not found')
          sw=sw.replace("const CACHE_ADI='oy-cache-v860'","const CACHE_ADI='oy-cache-v861'",1)
          if './css/design-system.css?v=860' not in sw:
              raise SystemExit('service worker css v860 precache not found')
          sw=sw.replace('./css/design-system.css?v=860','./css/design-system.css?v=861',1)
          sw_path.write_text(sw,encoding='utf-8')

          trial_path=Path('tests/trial-counter-scroll-stability.test.js')
          trial=trial_path.read_text(encoding='utf-8')
          if "css/design-system.css?v=860')&&index.includes('js/app-loader.js?v=859" not in trial:
              raise SystemExit('trial css v860 contract not found')
          trial=trial.replace("css/design-system.css?v=860')&&index.includes('js/app-loader.js?v=859","css/design-system.css?v=861')&&index.includes('js/app-loader.js?v=859",1)
          if "const CACHE_ADI='oy-cache-v860'" not in trial:
              raise SystemExit('trial cache v860 contract not found')
          trial=trial.replace("const CACHE_ADI='oy-cache-v860'","const CACHE_ADI='oy-cache-v861'",1)
          trial_path.write_text(trial,encoding='utf-8')

      - name: Validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check js/modules/dashboard.js
          node --check service-worker.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/trial-counter-scroll-stability.test.js
          node tests/web-mobile-engine-separation.test.js

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/design-system.css index.html service-worker.js tests/dashboard-card-routes-smoke.test.js tests/trial-counter-scroll-stability.test.js
          git commit -m "fix: keep news ticker running on touch"
          git push origin main
