name: Duty Tools Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-duty-tools.py'
      - '.github/workflows/duty-tools-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded duty migration
        run: python scripts/migrate-duty-tools.py
      - name: Verify management and architecture
        run: |
          node tests/management-separate-pages.test.js
          node tests/module-bundles-smoke.test.js
          node tests/no-module-internal-tabs.test.js
          node scripts/build-client-bundles.mjs
          node scripts/check-client-architecture.mjs
      - name: Commit production migration and cleanup
        run: |
          rm scripts/migrate-duty-tools.py .github/workflows/duty-tools-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/management.js tests/management-separate-pages.test.js scripts/migrate-duty-tools.py .github/workflows/duty-tools-migration.yml
          git commit -m 'feat(duty): restore Excel import and place management'
          git push
