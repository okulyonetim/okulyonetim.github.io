name: One-time Meeting Card Apply V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meeting-card-apply-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply verified card layout
        env:
          JSBLOCK_B64: 
          CSSSECTION_B64: 
          TEST_B64: 
        run: |
          python - <<'PY'
          import base64,gzip,os,re
          from pathlib import Path
          def unpack(name): return gzip.decompress(base64.b64decode(os.environ[name])).decode('utf-8')
          p=Path('js/modules/meeting-schedule.js'); s=p.read_text()
          s,n=re.subn(r'function classSelectionTags\(row\)\{.*?(?=function groupSummary\(group\)\{)',unpack('JSBLOCK_B64'),s,flags=re.S); assert n==1,n; p.write_text(s)
          p=Path('css/design-system.css'); s=p.read_text(); m='/* TOPLANTI ÇİZELGESİ */'; assert m in s; p.write_text(s[:s.index(m)]+unpack('CSSSECTION_B64'))
          Path('tests/meeting-schedule-v1-smoke.test.js').write_text(unpack('TEST_B64'))
          p=Path('service-worker.js'); s=p.read_text(); s,n=re.subn(r"const CACHE_ADI='oy-cache-v\d+';","const CACHE_ADI='oy-cache-v858';",s,count=1); assert n==1; p.write_text(s)
          PY
      - name: Verify
        run: |
          node --check js/modules/meeting-schedule.js
          node tests/meeting-schedule-v1-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/meeting-card-apply.yml .github/workflows/meeting-card-apply-v2.yml
          git add js/modules/meeting-schedule.js css/design-system.css tests/meeting-schedule-v1-smoke.test.js service-worker.js
          git commit -m 'fix: switch meeting rows to mobile cards'
          git push origin HEAD:main
