name: Quality Fix Patch

on:
  push:
    branches:
      - fix/student-search-holiday-ranges-20260908
    paths:
      - .github/workflows/quality-fix-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/student-search-holiday-ranges-20260908
          fetch-depth: 0
      - name: Apply guarded quality fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path=Path('js/core/platform/widget-adapter.js')
          src=path.read_text(encoding='utf-8')

          src=src.replace("return a.tatilNotu||'Okul tatilde';","return a.tatilModuNotu||a.tatilNotu||'Okul tatilde';",1)

          marker="const addDays=(iso,days)=>{const d=new Date(`${iso}T12:00:00`);if(Number.isNaN(d.getTime()))return'';d.setDate(d.getDate()+days);return localISO(d)};"
          guard="function canEditHolidaySettings(){return global.AKTIF_KULLANICI?.admin===true||(typeof global.duzenleyebilir==='function'&&global.duzenleyebilir('sistemAyarlari'))||global.PermissionService?.can?.('sistemAyarlari','edit')===true}"
          if guard not in src:
              assert marker in src, 'holiday permission marker missing'
              src=src.replace(marker,marker+'\n'+guard,1)

          readonly="if(!canEditHolidaySettings()){Object.assign(cfg,patch);lastHolidayDate=today;global.KorukWidgetAdapter?.schedule?.(80);return true}"
          sync_marker="holidaySyncing=true;\n  try{await global.DeviceData.set('dersSaatleri'"
          if readonly not in src:
              assert sync_marker in src, 'holiday runtime sync marker missing'
              src=src.replace(sync_marker,readonly+'\n  holidaySyncing=true;\n  try{await global.DeviceData.set(\'dersSaatleri\'',1)

          save_old="async function saveHolidayRanges(card){const cfg=holidaySettings()||{},ranges=collectHolidayRanges(card),patch=holidayLegacyPatch(ranges);"
          save_new="async function saveHolidayRanges(card){if(!canEditHolidaySettings())throw new Error('Tatil ayarlarını düzenleme yetkiniz yok.');const cfg=holidaySettings()||{},ranges=collectHolidayRanges(card),patch=holidayLegacyPatch(ranges);"
          if save_new not in src:
              assert save_old in src, 'holiday save guard marker missing'
              src=src.replace(save_old,save_new,1)

          m=re.search(r"function buildHolidayCard\(cfg\)\{.*?return wrap\}",src,re.S)
          assert m, 'holiday card builder missing'
          block=m.group(0)
          permission_ui="if(!canEditHolidaySettings()){wrap.querySelectorAll('input,textarea,select,button').forEach(el=>el.disabled=true);wrap.querySelectorAll('[data-quality-holiday-add],[data-quality-holiday-save],[data-quality-holiday-remove]').forEach(el=>el.remove());wrap.querySelector('.ka-card__body')?.insertAdjacentHTML('beforeend','<div class=\"ka-muted\">Bu alan salt okunur. Tatil planını düzenlemek için sistem ayarları yetkisi gerekir.</div>')}"
          if permission_ui not in block:
              block=block.replace('return wrap}',permission_ui+'return wrap}',1)
              src=src[:m.start()]+block+src[m.end():]

          src=src.replace("btn.className='ka-btn ka-btn--secondary';btn.type='button';btn.dataset.qualityStudentDelete='';btn.textContent='Öğrenciyi Sil';","btn.className='ka-btn ka-btn--danger';btn.type='button';btn.dataset.qualityStudentDelete='';btn.textContent='Öğrenciyi Sil';",1)

          store_hook="global.AppStore?.subscribe?.('data.dersSaatleri',()=>{syncHolidayMode();enhance()});"
          start_marker="function start(){installSearchFocusGuard();enhance();const mo=new MutationObserver(enhance);"
          if store_hook not in src:
              assert start_marker in src, 'quality fixes start marker missing'
              src=src.replace(start_marker,"function start(){installSearchFocusGuard();enhance();"+store_hook+"const mo=new MutationObserver(enhance);",1)

          path.write_text(src,encoding='utf-8')

          sw=Path('service-worker.js')
          sw_text=sw.read_text(encoding='utf-8')
          sw_text2=sw_text.replace("const CACHE_ADI='oy-cache-v906';","const CACHE_ADI='oy-cache-v907';",1)
          if sw_text2==sw_text:
              assert "const CACHE_ADI='oy-cache-v907';" in sw_text, 'service worker cache marker missing'
          sw.write_text(sw_text2,encoding='utf-8')

          test=Path('tests/quality-fixes-smoke.test.js')
          test.write_text("""const fs=require('fs');
          const assert=require('assert');
          const src=fs.readFileSync('js/core/platform/widget-adapter.js','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');
          new Function(src);
          for(const text of ['tatilAraliklari','baslangicTarihi','bitisTarihi','data-quality-holiday-add','data-quality-holiday-save','Tatil tarih aralıkları birbiriyle çakışamaz'])assert(src.includes(text),`Çoklu tatil özelliği eksik: ${text}`);
          assert(src.includes('canEditHolidaySettings')&&src.includes('Tatil ayarlarını düzenleme yetkiniz yok.')&&src.includes('Bu alan salt okunur.'),'Tatil ayarı yetki koruması eksik.');
          assert(src.includes('Object.assign(cfg,patch)')&&src.includes("AppStore?.subscribe?.('data.dersSaatleri'"),'Tatil modu tarih geçişi runtime senkronu eksik.');
          assert(src.includes('data-quality-student-delete')&&src.includes('SiniflarService.veliSil(id)'),'Öğrenci düzenleme silme işlemi eksik.');
          assert(src.includes('name=\\\"adres\\\"')&&src.includes('data-quality-student-address'),'Öğrenci adres alanı/ayrıntı koruması eksik.');
          for(const text of ['queueMicrotask','setSelectionRange','data-exact-search','peopleSearch'])assert(src.includes(text),`Mobil arama odağı koruması eksik: ${text}`);
          const cache=sw.match(/const CACHE_ADI='oy-cache-v(\\d+)'/);assert(cache&&Number(cache[1])>=907,'Yeni düzeltmeler için service worker cache sürümü güncellenmedi.');
          console.log('Öğrenci silme + adres + arama odağı + çoklu tatil sözleşmesi başarılı.');
          """,encoding='utf-8')
          PY
      - name: Run targeted regression
        run: node tests/quality-fixes-smoke.test.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/platform/widget-adapter.js service-worker.js tests/quality-fixes-smoke.test.js
          git commit -m "fix: harden student search and holiday scheduling"
          git push origin HEAD:fix/student-search-holiday-ranges-20260908
