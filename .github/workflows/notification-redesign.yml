name: Notification popover redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notification-redesign.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - name: Verify staged base
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="e4959b1a7af5a27b9e1488d3a334153434f101c4"
          git merge-base --is-ancestor "$EXPECTED" HEAD

      - name: Apply notification redesign
        run: python scripts/tmp-notification-redesign.py

      - name: Align existing loader smoke contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/classic-shell-v2-smoke.test.js')
          text=p.read_text(encoding='utf-8')
          old="define('dashboard',['js/modules/school-live-status.js','js/modules/communication.js?v=838','js/modules/dashboard.js'])"
          new="define('dashboard',['js/modules/school-live-status.js','js/modules/communication.js?v=838','js/modules/dashboard.js?v=859'])"
          if old not in text:
              raise SystemExit('stale dashboard loader assertion not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Validate notification and runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check js/core/shell-ui.js
          node --check service-worker.js
          node tests/notification-popover-redesign.test.js
          node tests/profile-page-redesign.test.js
          node tests/classic-shell-v2-smoke.test.js
          node tests/trial-counter-scroll-stability.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/web-mobile-engine-separation.test.js

      - name: Commit verified notification redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/shell-ui.js css/design-system.css index.html service-worker.js tests/*.test.js
          git commit -m "feat: redesign notification popover"
          git push origin main
