name: Performance Doc Libs Patch
permissions:
  contents: write
on:
  push:
    branches: [agent/performance-lazy-doc-libs]
    paths: ['.github/workflows/perf-doc-libs-patch.yml']

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-lazy-doc-libs
      - name: PDF Excel Mammoth kütüphanelerini kullanım anına taşı
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Belge görüntüleyici: PDF.js / ExcelJS / SheetJS ihtiyaç anında yüklenir.
          p=Path('js/dokuman-okuyucu.js')
          s=p.read_text()
          anchor="const JSZIP='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';"
          add="""const JSZIP='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';\nconst PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';\nconst EXCELJS='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';\nconst SHEETJS='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';"""
          assert anchor in s
          s=s.replace(anchor,add,1)
          anchor2="async function docxReady(){await load(JSZIP,()=>typeof JSZip!=='undefined');await load(DOCX,()=>typeof docx!=='undefined'&&typeof docx.renderAsync==='function');}"
          add2=anchor2+"\nasync function pdfReady(){await load(PDFJS,()=>typeof pdfjsLib!=='undefined');}\nasync function excelJsReady(){try{await load(EXCELJS,()=>typeof ExcelJS!=='undefined');return true;}catch(_){return false;}}\nasync function sheetJsReady(){await load(SHEETJS,()=>typeof XLSX!=='undefined');}"
          assert anchor2 in s
          s=s.replace(anchor2,add2,1)
          old="async function pdfAc(){if(typeof pdfjsLib==='undefined')return fail('PDF.js bulunamadı.');status('PDF hazırlanıyor…');try{"
          new="async function pdfAc(){status('PDF hazırlanıyor…');try{await pdfReady();"
          assert old in s
          s=s.replace(old,new,1)
          old="async function xlsxAc(buf){status('Excel hazırlanıyor…');try{buf=buf||await getBuf();if(typeof ExcelJS!=='undefined'){"
          new="async function xlsxAc(buf){status('Excel hazırlanıyor…');try{buf=buf||await getBuf();const excelOk=await excelJsReady();if(excelOk&&typeof ExcelJS!=='undefined'){"
          assert old in s
          s=s.replace(old,new,1)
          old="if(typeof XLSX==='undefined')throw new Error('Excel bileşeni bulunamadı');const x=XLSX.read(buf,{type:'array',cellDates:true,cellStyles:true});"
          new="await sheetJsReady();if(typeof XLSX==='undefined')throw new Error('Excel bileşeni bulunamadı');const x=XLSX.read(buf,{type:'array',cellDates:true,cellStyles:true});"
          assert old in s
          s=s.replace(old,new,1)
          old="if(typeof XLSX==='undefined')throw new Error('SheetJS bulunamadı');const x=XLSX.read(buf,{type:'array',cellDates:true,cellStyles:true});"
          new="await sheetJsReady();if(typeof XLSX==='undefined')throw new Error('SheetJS bulunamadı');const x=XLSX.read(buf,{type:'array',cellDates:true,cellStyles:true});"
          assert old in s
          s=s.replace(old,new,1)
          old="async function textAc(csv){status('Dosya okunuyor…');try{const r=await fetch(A.url,{cache:'no-store'}),txt=await r.text();if(csv&&typeof XLSX!=='undefined'){"
          new="async function textAc(csv){status('Dosya okunuyor…');try{const r=await fetch(A.url,{cache:'no-store'}),txt=await r.text();if(csv)await sheetJsReady();if(csv&&typeof XLSX!=='undefined'){"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # 2) Yıllık Plan: Mammoth sadece Word içe aktarma açıldığında yüklenir.
          p=Path('js/yillik-plan.js')
          s=p.read_text()
          anchor="let _yplIceAktarSatirlar = null; // [[hücre, hücre, ...], ...] — ayrıştırılan ham tablo (0. satır: başlıklar)"
          helper=anchor+"""\nlet _yplMammothYukleme = null;\nfunction _yplMammothYukle(){\n  if (typeof mammoth !== 'undefined') return Promise.resolve();\n  if (_yplMammothYukleme) return _yplMammothYukleme;\n  _yplMammothYukleme = new Promise((resolve,reject)=>{\n    const mevcut = Array.from(document.scripts).find(s=>/mammoth(?:\\.browser)?(?:\\.min)?\\.js/i.test(s.src||''));\n    if (mevcut){ mevcut.addEventListener('load',resolve,{once:true}); mevcut.addEventListener('error',reject,{once:true}); return; }\n    const sc=document.createElement('script');\n    sc.src='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';\n    sc.onload=resolve; sc.onerror=()=>reject(new Error('Word okuma kütüphanesi yüklenemedi.'));\n    document.head.appendChild(sc);\n  }).catch(e=>{ _yplMammothYukleme=null; throw e; });\n  return _yplMammothYukleme;\n}"""
          assert anchor in s
          s=s.replace(anchor,helper,1)
          old="function yillikPlanWordIceAktarAc(){\n  if (typeof mammoth === 'undefined'){ toast('Word okuma kütüphanesi yüklenemedi.'); return; }"
          new="async function yillikPlanWordIceAktarAc(){\n  try { await _yplMammothYukle(); } catch(e) { toast(e.message || 'Word okuma kütüphanesi yüklenemedi.'); return; }"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # 3) İlk açılıştan dört ağır CDN çıkarılır; artık ilgili modüller kendileri yükler.
          p=Path('index.html')
          s=p.read_text()
          tags=[
            '<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>\n',
            '<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>\n',
            '<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>\n',
            '<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>\n',
          ]
          for tag in tags:
            assert tag in s, tag
            s=s.replace(tag,'',1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/dokuman-okuyucu.js js/yillik-plan.js
          git commit -m "PDF Excel ve Mammoth kütüphanelerini lazy-load yap"
          git push origin HEAD:agent/performance-lazy-doc-libs
