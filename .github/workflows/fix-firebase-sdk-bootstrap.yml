name: Fix Firebase SDK bootstrap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-firebase-sdk-bootstrap.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Firebase SDK readiness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/app-loader.js')
          s=p.read_text(encoding='utf-8')
          old="""function startupHataYuzeyiGoster(){document.documentElement.classList.add('ka-auth-resolved');const warning=document.getElementById('configWarning');if(warning){warning.classList.remove('ka-hidden');warning.hidden=false}const login=document.getElementById('girisEkrani');if(login){login.hidden=false;login.classList.add('active')}}
function startPlatform(){if(startupDone)return true;if(!serviceWorkerBound&&'serviceWorker'in navigator){serviceWorkerBound=true;window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}),{once:true})}document.documentElement.classList.add('ka-auth-resolved');if(typeof window.firebase==='undefined'){if(!firebaseRetryBound){firebaseRetryBound=true;Promise.resolve(window.KorukFirebaseSdkReady).then(ok=>{firebaseRetryBound=false;if(ok)startPlatform();else startupHataYuzeyiGoster()}).catch(()=>{firebaseRetryBound=false;startupHataYuzeyiGoster()})}return false}try{if(typeof firebaseyiBaslat!=='function'||!firebaseyiBaslat()){startupHataYuzeyiGoster();return false}if(typeof authDinleyiciKur!=='function'){startupHataYuzeyiGoster();return false}authDinleyiciKur();startupDone=true;return true}catch(e){console.error('[AppLoader]',e);startupHataYuzeyiGoster();return false}}
"""
          new="""function startupHataYuzeyiGoster(){document.documentElement.classList.add('ka-auth-resolved');const warning=document.getElementById('configWarning');if(warning){warning.classList.remove('ka-hidden');warning.hidden=false}const login=document.getElementById('girisEkrani');if(login){login.hidden=false;login.classList.add('active')}}
const FIREBASE_BOOT_SDKS=[
  ['https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',()=>typeof window.firebase!=='undefined'],
  ['https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js',()=>typeof window.firebase?.firestore==='function'],
  ['https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js',()=>typeof window.firebase?.auth==='function']
];
const firebaseBootReady=()=>FIREBASE_BOOT_SDKS.every(([,test])=>test());
function firebaseBootStatus(mesaj){const el=document.getElementById('girisHataMetni');if(el){el.textContent=mesaj;el.style.display=mesaj?'':'none'}}
function firebaseSdkTekYukle(src,test,deneme=1){
  if(test())return Promise.resolve(true);
  return new Promise((resolve,reject)=>{
    let done=false,timer=null;
    const finish=(ok,err)=>{if(done)return;done=true;clearTimeout(timer);ok?resolve(true):reject(err||new Error('firebase-sdk-load:'+src))};
    let script=[...document.scripts].find(x=>String(x.src||'').split('?')[0]===src);
    if(!script||deneme>1){script=document.createElement('script');script.src=src+(deneme>1?`?kaRetry=${Date.now()}-${deneme}`:'');script.async=true;document.head.appendChild(script)}
    script.addEventListener('load',()=>test()?finish(true):finish(false,new Error('firebase-sdk-service-missing:'+src)),{once:true});
    script.addEventListener('error',()=>finish(false,new Error('firebase-sdk-load:'+src)),{once:true});
    timer=setTimeout(()=>finish(false,new Error('firebase-sdk-timeout:'+src)),7000);
  }).catch(err=>{if(deneme<3){firebaseBootStatus(`Firebase bileşeni yüklenemedi — tekrar deneniyor (${deneme+1}/3)`);return firebaseSdkTekYukle(src,test,deneme+1)}throw err});
}
async function firebaseSdkleriniHazirla(){
  for(const [src,test] of FIREBASE_BOOT_SDKS){if(test())continue;firebaseBootStatus('Firebase bağlantısı hazırlanıyor…');await firebaseSdkTekYukle(src,test)}
  return firebaseBootReady();
}
function startPlatform(){
  if(startupDone)return true;
  if(!serviceWorkerBound&&'serviceWorker'in navigator){serviceWorkerBound=true;window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}),{once:true})}
  document.documentElement.classList.add('ka-auth-resolved');
  if(!firebaseBootReady()){
    if(!firebaseRetryBound){firebaseRetryBound=true;firebaseSdkleriniHazirla().then(ok=>{firebaseRetryBound=false;if(ok)startPlatform();else startupHataYuzeyiGoster()}).catch(e=>{firebaseRetryBound=false;console.error('[Firebase SDK bootstrap]',e);firebaseBootStatus('Firebase bileşenleri yüklenemedi. Bağlantı tekrar denenecek.');setTimeout(startPlatform,5000)})}
    return false;
  }
  try{if(typeof firebaseyiBaslat!=='function'||!firebaseyiBaslat()){startupHataYuzeyiGoster();return false}if(typeof authDinleyiciKur!=='function'){startupHataYuzeyiGoster();return false}authDinleyiciKur();startupDone=true;firebaseBootStatus('');return true}catch(e){console.error('[AppLoader]',e);startupHataYuzeyiGoster();return false}
}
"""
          if old not in s:
              raise SystemExit('startPlatform target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          sw=Path('service-worker.js')
          t=sw.read_text(encoding='utf-8')
          if "const CACHE_ADI='oy-cache-v790';" not in t:
              raise SystemExit('cache version mismatch')
          sw.write_text(t.replace("const CACHE_ADI='oy-cache-v790';","const CACHE_ADI='oy-cache-v791';",1),encoding='utf-8')
          PY
          node --check js/app-loader.js
          node --check js/auth.js
      - name: Architecture check
        run: node scripts/check-client-architecture.mjs
      - name: Cleanup and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-firebase-sdk-bootstrap.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add js/app-loader.js service-worker.js .github/workflows/fix-firebase-sdk-bootstrap.yml
          git commit -m 'repair Firebase SDK bootstrap and retries'
          git push
