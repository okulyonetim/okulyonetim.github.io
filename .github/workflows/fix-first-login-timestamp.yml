name: fix-first-login-timestamp
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix first-login Firestore sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal fix
        shell: python
        run: |
          from pathlib import Path
          import re

          core=Path('js/core/core.js')
          s=core.read_text(encoding='utf-8')
          if 'function timestampValue(v)' not in s:
              marker='function remoteTimestamp'
              pos=s.find(marker)
              if pos<0:
                  raise SystemExit('remoteTimestamp not found')
              end=s.find('}',pos)
              if end<0:
                  raise SystemExit('remoteTimestamp end not found')
              end+=1
              helper="\nfunction timestampValue(v){\n  if(v==null)return 0;\n  if(typeof v==='number')return Number.isFinite(v)?v:0;\n  try{\n    const d=v?.toDate?v.toDate():new Date(v);\n    const n=d.getTime();\n    return Number.isFinite(n)?n:0;\n  }catch(_){return 0}\n}\n"
              s=s[:end]+helper+s[end:]
          core.write_text(s,encoding='utf-8')

          idx=Path('index.html'); h=idx.read_text(encoding='utf-8'); h2=re.sub(r'js/core/core\.js\?v=\d+', 'js/core/core.js?v=1039', h, count=1)
          if h2==h: raise SystemExit('index core version not found')
          idx.write_text(h2,encoding='utf-8')

          sw=Path('service-worker.js'); w=sw.read_text(encoding='utf-8'); w=w.replace("const CACHE_ADI='oy-cache-v1235';","const CACHE_ADI='oy-cache-v1236';",1); w=w.replace("./js/core/core.js?v=1037","./js/core/core.js?v=1039",1); sw.write_text(w,encoding='utf-8')

          # Surface swallowed allSettled rejections without changing sync behavior.
          if "AppStore.set('ui.syncError'" not in s or 'fetchRemoteBatch' in s:
              # Find the Promise.allSettled result variable and append a compact error report.
              patterns=[
                r'const results=await Promise\.allSettled\(([^;]+)\);',
                r'const results=await Promise\.allSettled\(([^\n]+)\);'
              ]
              for p in patterns:
                  m=re.search(p,s)
                  if m:
                      old=m.group(0)
                      if 'ui.syncError' not in old:
                          new=old+"\nconst syncErrors=results.filter(x=>x.status==='rejected').map(x=>String(x.reason?.message||x.reason||'sync-error'));if(syncErrors.length)AppStore.set('ui.syncError',syncErrors.join(' | '));"
                          s=s.replace(old,new,1); core.write_text(s,encoding='utf-8'); break

          # Keep app-loader reference consistent with the current main version only if it is the core reference block.
          # Do not change unrelated asset versions.

          Path('.github/workflows/fix-first-login-timestamp.yml').unlink()

      - name: Verify syntax and focused contract
        run: |
          node --check js/core/core.js
          node --check js/firebase-init.js
          grep -q "function timestampValue(v)" js/core/core.js
          grep -q "core.js?v=1039" index.html
          grep -q "core.js?v=1039" service-worker.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/core.js index.html service-worker.js .github/workflows/fix-first-login-timestamp.yml
          git commit -m 'Fix first-login Firestore sync'
          git push origin main
