name: fix-first-login-timestamp
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix first-login Firestore sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal fix
        shell: python
        run: |
          from pathlib import Path
          import re

          core=Path('js/core/core.js')
          s=core.read_text(encoding='utf-8')
          if 'function timestampValue(v)' not in s:
              helper="""
function timestampValue(v){
  if(v==null)return 0;
  if(typeof v==='number')return Number.isFinite(v)?v:0;
  try{
    const d=v?.toDate?v.toDate():new Date(v);
    const n=d.getTime();
    return Number.isFinite(n)?n:0;
  }catch(_){return 0}
}
"""
              pattern=r'function remoteTimestamp\(row\)\{[\s\S]*?\n\}'
              m=re.search(pattern,s)
              if not m:
                  raise SystemExit('remoteTimestamp function not found')
              s=s[:m.end()]+helper+s[m.end():]
              core.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h2=re.sub(r'js/core/core\.js\?v=\d+', 'js/core/core.js?v=1039', h, count=1)
          if h2==h: raise SystemExit('index core version not found')
          idx.write_text(h2,encoding='utf-8')

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8')
          if "const CACHE_ADI='oy-cache-v1235';" in w:
              w=w.replace("const CACHE_ADI='oy-cache-v1235';","const CACHE_ADI='oy-cache-v1236';",1)
          w=w.replace("./js/core/core.js?v=1037","./js/core/core.js?v=1039",1)
          sw.write_text(w,encoding='utf-8')

          # Expose allSettled failures without changing the synchronization flow.
          s=core.read_text(encoding='utf-8')
          marker='Promise.allSettled('
          pos=s.find(marker)
          if pos>=0 and "AppStore.set('ui.syncError'" not in s:
              semi=s.find(';',pos)
              if semi>pos:
                  statement=s[pos:semi+1]
                  if statement.startswith('Promise.allSettled('):
                      # Only attach reporting when the existing call is assigned to a variable.
                      line_start=s.rfind('\n',0,pos)+1
                      line=s[line_start:semi+1]
                      m=re.search(r'const\s+(\w+)\s*=\s*Promise\.allSettled\([^;]+;?',line)
                      if m:
                          var=m.group(1)
                          report=f"const syncErrors={var}.filter(x=>x.status==='rejected').map(x=>String(x.reason?.message||x.reason||'sync-error'));if(syncErrors.length)AppStore.set('ui.syncError',syncErrors.join(' | '));"
                          insert=semi+1
                          s=s[:insert]+report+s[insert:]
                          core.write_text(s,encoding='utf-8')

          Path('.github/workflows/fix-first-login-timestamp.yml').unlink()

      - name: Verify
        run: |
          node --check js/core/core.js
          node --check js/firebase-init.js
          grep -q "function timestampValue(v)" js/core/core.js
          grep -q "core.js?v=1039" index.html
          grep -q "core.js?v=1039" service-worker.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/core.js index.html service-worker.js .github/workflows/fix-first-login-timestamp.yml
          git commit -m 'Fix first-login Firestore sync'
          git push origin main
