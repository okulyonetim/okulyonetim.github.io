name: Apply teacher active leave range fix

on:
  push:
    branches:
      - fix/teacher-active-leave-range

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/teacher-active-leave-range
          fetch-depth: 0
      - name: Patch active leave calculation and add regression test
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[teacher-leave-range-applied\]'; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/modules/people-classic-ui.js')
          text = path.read_text()
          old = "function teacherOnLeave(id){const today=new Date().toISOString().slice(0,10);return [...arr('ogretmenIzinleri'),...arr('personelIzinler')].some(x=>(x.ogretmenId===id||x.personelId===id)&&(!x.baslangicTarihi||x.baslangicTarihi<=today)&&(!x.bitisTarihi||x.bitisTarihi>=today))}"
          new = "function localDateKey(value=new Date()){const d=value instanceof Date?value:new Date(value);if(Number.isNaN(d.getTime()))return'';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}\nfunction leaveDateKey(value){if(!value)return'';if(typeof value==='string'){const m=value.match(/^(\\d{4}-\\d{2}-\\d{2})/);if(m)return m[1]}if(value?.toDate)return localDateKey(value.toDate());return localDateKey(value)}\nfunction leaveRecordActiveOn(x,today){const start=leaveDateKey(x?.baslangicTarihi||x?.baslangic);if(!start)return false;const end=leaveDateKey(x?.bitisTarihi||x?.bitis)||start;return start<=today&&today<=end}\nfunction teacherOnLeave(id){const today=localDateKey();return [...arr('ogretmenIzinleri'),...arr('personelIzinler')].some(x=>(x.ogretmenId===id||x.personelId===id)&&leaveRecordActiveOn(x,today))}"
          if old not in text:
              raise SystemExit('teacherOnLeave source not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('tests/teacher-active-leave-range.test.js')
          test.write_text("""const fs=require('fs');\nconst assert=require('assert');\nconst vm=require('vm');\n\nconst source=fs.readFileSync('js/modules/people-classic-ui.js','utf8');\nconst helperStart=source.indexOf('function localDateKey(');\nconst helperEnd=source.indexOf('function teacherCard(',helperStart);\nassert(helperStart>=0&&helperEnd>helperStart,'İzin tarih yardımcıları people-classic-ui içinde bulunmalı.');\nconst helpers=source.slice(helperStart,helperEnd);\nconst sandbox={Date};\nvm.createContext(sandbox);\nvm.runInContext(helpers+';this.leaveRecordActiveOn=leaveRecordActiveOn;',sandbox);\nconst active=sandbox.leaveRecordActiveOn;\n\nassert.strictEqual(active({baslangic:'2026-07-02',bitis:'2026-07-03'},'2026-07-02'),true,'Eski alan adlarında başlangıç günü izinli olmalı.');\nassert.strictEqual(active({baslangic:'2026-07-02',bitis:'2026-07-03'},'2026-07-03'),true,'Eski alan adlarında bitiş günü izinli olmalı.');\nassert.strictEqual(active({baslangic:'2026-07-02',bitis:'2026-07-03'},'2026-09-13'),false,'Geçmiş izin kartta aktif görünmemeli.');\nassert.strictEqual(active({baslangicTarihi:'2026-09-14',bitisTarihi:'2026-09-15'},'2026-09-13'),false,'Gelecek izin henüz aktif görünmemeli.');\nassert.strictEqual(active({baslangicTarihi:'2026-09-13',bitisTarihi:'2026-09-15'},'2026-09-13'),true,'Yeni alan adlarında tarih aralığı kapsayıcı olmalı.');\nassert.strictEqual(active({baslangic:'2026-09-13'},'2026-09-13'),true,'Bitiş tarihi olmayan kayıt yalnız başlangıç gününde aktif olmalı.');\nassert.strictEqual(active({baslangic:'2026-09-13'},'2026-09-14'),false,'Bitiş tarihi olmayan kayıt süresiz izin üretmemeli.');\nassert.strictEqual(active({},'2026-09-13'),false,'Tarihsiz kayıt süresiz izin üretmemeli.');\n\nconsole.log('Öğretmen aktif izin rozeti tarih aralığı regresyon testi başarılı.');\n""")
          PY
          node tests/teacher-active-leave-range.test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/modules/people-classic-ui.js tests/teacher-active-leave-range.test.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: limit teacher leave badge to active dates [teacher-leave-range-applied]'
          git push origin HEAD:fix/teacher-active-leave-range
