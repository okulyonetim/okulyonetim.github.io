name: Apply class seating redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/class-seating-redesign-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply class seating redesign
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          old=subprocess.check_output(['git','show','HEAD^:.github/workflows/class-seating-redesign-once.yml'],text=True)
          start=old.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=old.index("\n          PY",start)
          raw=old[start:end]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())
          compile(code,'class-seating-redesign.py','exec')
          exec(code,{'__name__':'__main__'})
          PY
      - name: Verify focused class seating package
        run: |
          node --check js/modules/class-seating.js
          node --check js/modules/transport.js
          node tests/class-seating-redesign-smoke.test.js
          node tests/classes-mobile-parity-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/report-engine-a4-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit verified package
        shell: bash
        run: |
          git rm .github/workflows/class-seating-redesign-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/class-seating.js js/modules/transport.js js/app-loader.js css/design-system.css index.html service-worker.js tests/class-seating-redesign-smoke.test.js .github/workflows/client-architecture.yml
          git commit -m 'feat: redesign class seating planner'
          git push origin HEAD:main
