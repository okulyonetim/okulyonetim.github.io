        <div class="ka-card__body ka-stack">${step('Masa','masa','table')}${step('Öğretmen Masası','teacher','ogretmen-masasi')}${step('Kapı','door','kapi')}${step('Pencere','window','pencere')}${step('Yazı Tahtası','board','yazi-tahtasi')}</div>
