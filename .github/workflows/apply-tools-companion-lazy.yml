name: Apply tools companion lazy optimization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lazy load Tools route companions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          loader=Path('js/app-loader.js')
          s=loader.read_text(encoding='utf-8')
          old="define('tools',['js/modules/tools.js','js/modules/teacher-list.js','js/modules/map-ui.js','js/modules/rubric-settings.js','js/modules/rubric-tools.js']);"
          new="define('tools',['js/modules/tools.js','js/modules/rubric-settings.js','js/modules/rubric-tools.js']);"
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('AppLoader v46','AppLoader v47',1)
          loader.write_text(s,encoding='utf-8')

          shell=Path('js/core/shell-ui.js')
          ui=shell.read_text(encoding='utf-8')
          marker="function applySubpage(name,page,title){"
          assert marker in ui
          helper="""async function ensureToolsPageDependencies(page){
            const files=[];
            if(['student-list','homework','grades'].includes(page))files.push('js/modules/teacher-list.js');
            if(page==='map')files.push('js/modules/map-ui.js');
            if(!files.length)return true;
            if(!global.AppLoader?.loadScript)throw new Error('Tools companion loader hazır değil.');
            for(const src of files)await global.AppLoader.loadScript(src);
            return true;
          }
          """.replace('          ','').lstrip()
          assert 'function ensureToolsPageDependencies(page)' not in ui
          ui=ui.replace(marker,helper+marker,1)
          route_old="setBottomActive(bottom);const reuseModule=moduleRouteMounted(name);global.AppLoader?.setActiveModule?.(name);\n  setTitle(title||meta.label||name);if(!reuseModule)await global.AppLoader?.load?.(name);"
          route_new="setBottomActive(bottom);const reuseModule=moduleRouteMounted(name);global.AppLoader?.setActiveModule?.(name);\n  setTitle(title||meta.label||name);if(name==='tools'&&page)await ensureToolsPageDependencies(page);if(!reuseModule)await global.AppLoader?.load?.(name);"
          assert route_old in ui
          ui=ui.replace(route_old,route_new,1)
          shell.write_text(ui,encoding='utf-8')

          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          assert 'js/core/shell-ui.js?v=879' in html
          assert 'js/app-loader.js?v=895' in html
          html=html.replace('js/core/shell-ui.js?v=879','js/core/shell-ui.js?v=880',1)
          html=html.replace('js/app-loader.js?v=895','js/app-loader.js?v=896',1)
          index.write_text(html,encoding='utf-8')

          swp=Path('service-worker.js')
          sw=swp.read_text(encoding='utf-8')
          assert "const CACHE_ADI='oy-cache-v902';" in sw
          assert "'./js/app-loader.js?v=895'" in sw
          assert "'./js/core/shell-ui.js?v=879'" in sw
          sw=sw.replace("const CACHE_ADI='oy-cache-v902';","const CACHE_ADI='oy-cache-v903';",1)
          sw=sw.replace("'./js/app-loader.js?v=895'","'./js/app-loader.js?v=896'",1)
          sw=sw.replace("'./js/core/shell-ui.js?v=879'","'./js/core/shell-ui.js?v=880'",1)
          swp.write_text(sw,encoding='utf-8')

          bundles=Path('tests/module-bundles-smoke.test.js')
          b=bundles.read_text(encoding='utf-8')
          loader_decl="const loader=fs.readFileSync('js/app-loader.js','utf8');"
          assert loader_decl in b
          if "const shellUi=fs.readFileSync('js/core/shell-ui.js','utf8');" not in b:
              b=b.replace(loader_decl,loader_decl+"\nconst shellUi=fs.readFileSync('js/core/shell-ui.js','utf8');",1)
          old_assert="assert(registry('tools').includes(\"'js/modules/map-ui.js'\"),'Tools interaktif harita motorunu module path üzerinden lazy-load edilmeli.');"
          new_assert="assert(!registry('tools').includes(\"'js/modules/map-ui.js'\")&&!registry('tools').includes(\"'js/modules/teacher-list.js'\"),'Tools varsayılan bundle rota-özel companion dosyalarını eager yüklememeli.');\nassert(shellUi.includes(\"if(page==='map')files.push('js/modules/map-ui.js')\"),'Harita motoru yalnız Harita rotasında lazy yüklenmeli.');\nassert(shellUi.includes(\"if(['student-list','homework','grades'].includes(page))files.push('js/modules/teacher-list.js')\"),'Öğretmen liste/ödev/not companionı yalnız ilgili rotalarda lazy yüklenmeli.');"
          assert old_assert in b
          b=b.replace(old_assert,new_assert,1)
          bundles.write_text(b,encoding='utf-8')

          perf=Path('tests/runtime-performance-smoke.test.js')
          p=perf.read_text(encoding='utf-8')
          if "const shellUi=fs.readFileSync('js/core/shell-ui.js','utf8');" not in p:
              p=p.replace("const loader=fs.readFileSync('js/app-loader.js','utf8');", "const loader=fs.readFileSync('js/app-loader.js','utf8');\nconst shellUi=fs.readFileSync('js/core/shell-ui.js','utf8');",1)
          anchor="assert(dashboard.includes(\"d?.okuyanlar?.[user().uid||'']\"),'Duyuru okundu görünümü local-first kayıttan hesaplanmalı.');"
          add="\nassert(loader.includes(\"define('tools',['js/modules/tools.js','js/modules/rubric-settings.js','js/modules/rubric-tools.js'])\"),'Tools başlangıcı rota-özel teacher-list/map companionlarını eager yüklememeli.');\nassert(shellUi.includes('async function ensureToolsPageDependencies(page)'),'Tools rota companionları ShellUI tarafından ihtiyaç anında hazırlanmalı.');"
          assert anchor in p
          p=p.replace(anchor,anchor+add,1)
          perf.write_text(p,encoding='utf-8')

          map_test=Path('tests/map-consolidation-smoke.test.js')
          m=map_test.read_text(encoding='utf-8')
          map_loader="const loader=fs.readFileSync('js/app-loader.js','utf8');"
          assert map_loader in m
          if "const shell=fs.readFileSync('js/core/shell-ui.js','utf8');" not in m:
              m=m.replace(map_loader,map_loader+"\nconst shell=fs.readFileSync('js/core/shell-ui.js','utf8');",1)
          old_map="assert(loader.includes(\"'js/modules/map-ui.js'\"),'Tools registry HaritaUI motorunu module path üzerinden yüklemeli.');"
          new_map="assert(!loader.match(/define\\('tools',\\[[^\\]]*map-ui\\.js/),'Harita motoru varsayılan Tools bundle içinde eager olmamalı.');\nassert(shell.includes(\"if(page==='map')files.push('js/modules/map-ui.js')\"),'Shell HaritaUI motorunu yalnız Harita rotasında module path üzerinden yüklemeli.');"
          assert old_map in m
          map_test.write_text(m.replace(old_map,new_map,1),encoding='utf-8')

          teacher_test=Path('tests/teacher-list-local-first-service.test.js')
          t=teacher_test.read_text(encoding='utf-8')
          teacher_loader="const loader=fs.readFileSync('js/app-loader.js','utf8');"
          assert teacher_loader in t
          if "const shell=fs.readFileSync('js/core/shell-ui.js','utf8');" not in t:
              t=t.replace(teacher_loader,teacher_loader+"\nconst shell=fs.readFileSync('js/core/shell-ui.js','utf8');",1)
          old_teacher="assert(loader.includes(\"'js/modules/teacher-list.js'\")&&loader.includes(\"'js/modules/map-ui.js'\"),'Tools loader öğretmen liste servisini ve harita modülünü lazy-load etmeli.');"
          new_teacher="assert(!loader.match(/define\\('tools',\\[[^\\]]*teacher-list\\.js/)&&!loader.match(/define\\('tools',\\[[^\\]]*map-ui\\.js/),'Tools varsayılan bundle rota-özel öğretmen liste ve harita companionlarını eager yüklememeli.');\nassert(shell.includes(\"if(['student-list','homework','grades'].includes(page))files.push('js/modules/teacher-list.js')\")&&shell.includes(\"if(page==='map')files.push('js/modules/map-ui.js')\"),'Shell öğretmen liste ve harita companionlarını ilgili rotalarda lazy-load etmeli.');"
          assert old_teacher in t
          teacher_test.write_text(t.replace(old_teacher,new_teacher,1),encoding='utf-8')
          PY
      - name: Syntax checks
        run: |
          node --check js/app-loader.js
          node --check js/core/shell-ui.js
          node --check service-worker.js
      - name: Full client regression suite
        run: node scripts/run-client-tests.mjs
      - name: Client architecture audit
        run: node scripts/check-client-architecture.mjs
      - name: Commit verified optimization
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app-loader.js js/core/shell-ui.js index.html service-worker.js tests/module-bundles-smoke.test.js tests/runtime-performance-smoke.test.js tests/map-consolidation-smoke.test.js tests/teacher-list-local-first-service.test.js
          git commit -m 'perf: lazy load tools route companions'
          git push origin main
