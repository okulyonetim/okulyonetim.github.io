name: Finalize trial live card navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-trial-live-card.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize trial add action and direct counter navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          academic=Path('js/modules/academic.js')
          text=academic.read_text(encoding='utf-8')
          old='<button class="ka-btn ka-trial-add" type="button" data-trial-new data-ka-permission="academic.exams.edit" data-ka-write="academic.exams.edit">＋ Deneme Sınavı Ekle</button>'
          new='<button class="ka-btn ka-trial-add" type="button" data-trial-new>＋ Deneme Sınavı Ekle</button>'
          if old not in text: raise SystemExit('trial add button marker missing')
          academic.write_text(text.replace(old,new,1),encoding='utf-8')

          dash=Path('js/modules/dashboard.js')
          text=dash.read_text(encoding='utf-8')
          old='class="kh-trial-live__card" data-dash-route="academic" data-dash-page="trial" data-dash-title="Deneme Sınavları"'
          new='class="kh-trial-live__card" data-dash-route="academic" data-dash-page="trial" data-dash-title="Deneme Sınavları" data-dash-trial-open="${esc(x.id)}"'
          if old not in text: raise SystemExit('trial live card route marker missing')
          text=text.replace(old,new,1)
          old_handler="root.querySelectorAll('[data-dash-route]').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();return window.ShellUI?.routeModule?.(btn.dataset.dashRoute,{bottom:'menu',page:btn.dataset.dashPage||'',title:btn.dataset.dashTitle||''})}));"
          new_handler="root.querySelectorAll('[data-dash-route]').forEach(btn=>btn.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();const ok=await window.ShellUI?.routeModule?.(btn.dataset.dashRoute,{bottom:'menu',page:btn.dataset.dashPage||'',title:btn.dataset.dashTitle||''});if(ok===false)return false;const trialId=btn.dataset.dashTrialOpen;if(trialId)requestAnimationFrame(()=>window.AcademicModule?.openTrialCounter?.(trialId));return ok}));"
          if old_handler not in text: raise SystemExit('dashboard route handler marker missing')
          dash.write_text(text.replace(old_handler,new_handler,1),encoding='utf-8')

          test=Path('tests/dashboard-card-routes-smoke.test.js')
          text=test.read_text(encoding='utf-8')
          old="assert(dash.includes(\"addEventListener('click',e=>{e.preventDefault();e.stopPropagation();return window.ShellUI?.routeModule\"),'Dashboard özel rota tıklaması üst karta yayılmamalı.');"
          new="assert(dash.includes(\"addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();const ok=await window.ShellUI?.routeModule\"),'Dashboard özel rota tıklaması üst karta yayılmamalı.');"
          if old not in text: raise SystemExit('dashboard route smoke marker missing')
          text=text.replace(old,new,1)
          test.write_text(text,encoding='utf-8')

          test=Path('tests/trial-auto-timer.test.js')
          text=test.read_text(encoding='utf-8')
          marker="assert(dash.includes('wanted!==shown')&&dash.includes('queueRender()'),'Ana sayfa kartı sınav başında eklenip bitişte otomatik kaldırılmalı.');"
          add=marker+"\nassert(dash.includes('data-dash-trial-open')&&dash.includes('AcademicModule?.openTrialCounter?.(trialId)'),'Ana sayfadaki aktif deneme kartı sayaç detayını doğrudan açmalı.');\nassert(academic.includes('<button class=\\\"ka-btn ka-trial-add\\\" type=\\\"button\\\" data-trial-new>'),'Deneme ekleme butonu sonradan PermissionService DOM filtresiyle gizlenmemeli; servis yetki kontrolü korunmalı.');"
          if marker not in text: raise SystemExit('trial regression marker missing')
          test.write_text(text.replace(marker,add,1),encoding='utf-8')

          sw=Path('service-worker.js')
          text=sw.read_text(encoding='utf-8')
          if "const CACHE_ADI='oy-cache-v830';" not in text: raise SystemExit('cache v830 marker missing')
          sw.write_text(text.replace("const CACHE_ADI='oy-cache-v830';","const CACHE_ADI='oy-cache-v831';",1),encoding='utf-8')
          PY

          node --check js/modules/academic.js
          node --check js/modules/dashboard.js
          node --test tests/trial-auto-timer.test.js
          node --test tests/academic-separate-pages.test.js
          node --test tests/dashboard-card-routes-smoke.test.js
          node --test tests/modules-local-first-boundary.test.js
          node --test tests/service-worker-precache-smoke.test.js
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalize-trial-live-card.yml
          git add js/modules/academic.js js/modules/dashboard.js tests/dashboard-card-routes-smoke.test.js tests/trial-auto-timer.test.js service-worker.js .github/workflows/finalize-trial-live-card.yml
          git commit -m "fix: expose trial add action and open live counter"
          git push origin HEAD:main
