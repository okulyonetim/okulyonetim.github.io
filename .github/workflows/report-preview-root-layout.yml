name: Report preview root layout
on:
  push:
    branches: [fix/report-preview-root-layout]
    paths:
      - '.github/workflows/report-preview-root-layout.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-preview-root-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply canonical report preview refactor
        run: python .github/scripts/report_preview_root_layout.py
      - name: Validate report preview contracts
        run: |
          node --check js/modules/report-engine.js
          node tests/report-preview-print-layout-regression.test.js
          node tests/report-engine-a4-smoke.test.js
          node tests/report-native-print-routing-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
      - name: Commit canonical refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/report-engine.js css/design-system.css index.html service-worker.js tests/report-preview-print-layout-regression.test.js
          git commit -m 'fix: rebuild canonical report preview layout' || exit 0
          git push origin HEAD:fix/report-preview-root-layout
