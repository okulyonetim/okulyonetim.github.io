name: Temporary native settings integration

on:
  push:
    branches: [ fix/admin-info-flat-sections-20260908-v2 ]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'chore: run native settings integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-info-flat-sections-20260908-v2
      - name: Integrate native settings architecture
        run: python3 scripts/tmp_native_settings_integration.py
      - name: Validate
        run: |
          node -c js/modules/settings.js
          node -c js/core/shell-ui.js
          node tests/admin-info-mobile-notes.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit integrated source
        run: |
          git config user.name sedonet23
          git config user.email sedonet23@gmail.com
          git add js/modules/settings.js js/core/shell-ui.js css/design-system.css js/firebase-init.js service-worker.js scripts/check-client-architecture.mjs tests/admin-info-mobile-notes.test.js js/core/settings-admin-extension.js
          git commit -m "refactor: integrate admin and holiday settings natively"
          git push origin HEAD:fix/admin-info-flat-sections-20260908-v2
