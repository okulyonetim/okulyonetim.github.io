name: Temporary Dashboard Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, '[dashboard-fix]') && !startsWith(github.event.head_commit.message, '[temp]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dashboard fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('js/modules/dashboard.js')
          s = p.read_text(encoding='utf-8')

          pattern = r'function absencesSection\(\)\{.*?\}\nfunction upcomingRows\(\)\{.*?\}\nfunction reminderIcon'
          replacement = r'''function leaveReminderMatches(r){
            const d=String(r?.tarih||'').slice(0,10),text=norm(`${r?.title||r?.baslik||''} ${r?.subtitle||r?.altBaslik||r?.aciklama||''}`);
            if(!d||!text)return false;
            return [...arr('ogretmenIzinleri'),...arr('personelIzinler')].some(x=>{
              const start=String(x?.baslangic||x?.baslangicTarihi||x?.tarih||'').slice(0,10),end=String(x?.bitis||x?.bitisTarihi||x?.tarih||start).slice(0,10);
              if(!start||d<start||d>end)return false;
              const id=x?.ogretmenId||x?.personelId;
              const name=String(x?.ogretmenAdi||x?.personelAdi||(x?.ogretmenId?teacherLabel({ogretmenId:x.ogretmenId}):'')).trim();
              const type=String(x?.tur||x?.izinTuru||x?.raporTuru||'').trim();
              if(!name||!text.includes(norm(name)))return false;
              return !type||text.includes(norm(type))||text.includes('izin')||text.includes('rapor');
            });
          }
          function absencesSection(){if(!isAdmin())return'';const today=isoToday(),active=arr('ogretmenIzinleri').filter(x=>{const a=String(x.baslangic||x.baslangicTarihi||x.tarih||'').slice(0,10),b=String(x.bitis||x.bitisTarihi||x.tarih||a).slice(0,10);return a&&a<=today&&(!b||b>=today)});if(!active.length)return'';const calendar='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>';return `<section class="kh-section" data-home-section="absences"><div class="kh-section-head"><div class="kh-section-title">${calendar}<span>Bugün İzinli Öğretmenler</span></div><button type="button" class="kh-more" data-dash-route="management" data-dash-page="leaves" data-dash-title="İzinler">Tümü ›</button></div><div class="kh-card">${active.map(x=>`<div class="kh-row"><div class="kh-row-main"><b>${esc(x.ogretmenAdi||teacherLabel(x))}</b></div><span class="kh-chip amber">İZİNLİ</span></div>`).join('')}</div></section>`}
          function upcomingRows(){const calendarRoute={route:'communication',page:'calendar',routeTitle:'Takvim'},exams=upcoming([...arr('sinavlar'),...arr('denemeSinavlari')],'tarih',14).map(x=>({icon:'📝',title:x.ad||x.ders||x.sinavAdi||'Sınav',when:`${date(x.tarih)}${x.saat?` · ${x.saat}`:''}`,kind:'Sınav',sortKey:eventSortKey(x.tarih,x.saat),...calendarRoute}));const reminders=upcoming(arr('hatirlaticilar'),'tarih',14).filter(x=>!x.tamamlandi&&!leaveReminderMatches({title:x.baslik,subtitle:x.aciklama,tarih:x.tarih})).map(x=>({icon:'🔔',title:x.baslik||'Hatırlatıcı',when:`${date(x.tarih)}${x.saat?` · ${x.saat}`:''}`,kind:'Hatırlatıcı',sortKey:eventSortKey(x.tarih,x.saat),...calendarRoute}));const _tid=teacherId();const tasks=upcoming(arr('gorevler'),'sonTarih',14).filter(x=>!isDone(x)&&(!_tid||(x.sorumluOgretmenIdler||[]).includes(_tid))).map(x=>({icon:'✓',title:x.baslik||'Görev',when:date(x.sonTarih),kind:'Görev',sortKey:eventSortKey(x.sonTarih,x.saat),...calendarRoute}));const specialDays=upcoming(arr('belirliGunler').filter(x=>!(x.kontroller||[])[0]),'tarihBaslangic',14).map(x=>({icon:'🎉',title:x.ad||'Belirli Gün / Hafta',when:date(x.tarihBaslangic),kind:'Belirli Gün / Hafta',sortKey:eventSortKey(x.tarihBaslangic),...calendarRoute}));return[...exams,...reminders,...tasks,...specialDays,...meetingUpcomingRows(14)].sort((a,b)=>a.sortKey.localeCompare(b.sortKey,'tr')).slice(0,8)}
          function reminderIcon'''

          ns, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Dashboard hedef bloğu bulunamadı; dosya değiştirilmedi.')
          p.write_text(ns, encoding='utf-8')

          css = Path('css/dashboard-home-illustrations.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* ===== ANA SAYFA BUGÜN İZİNLİ ÖĞRETMENLER — SATIR İÇ BOŞLUĞU ===== */'
          if marker not in c:
              c += '\n\n' + marker + '''\n.ka-home .kh-section[data-home-section="absences"] .kh-row{\n  padding:18px 20px!important;\n  min-height:74px!important;\n  box-sizing:border-box!important;\n}\n.ka-home .kh-section[data-home-section="absences"] .kh-row-main{\n  min-width:0!important;\n  padding:0!important;\n}\n.ka-home .kh-section[data-home-section="absences"] .kh-row-main b{\n  display:block!important;\n  line-height:1.25!important;\n}\n'''
              css.write_text(c, encoding='utf-8')
          print('Dashboard leave fixes applied.')
          PY
      - name: Verify syntax
        run: node --check js/modules/dashboard.js
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/dashboard.js css/dashboard-home-illustrations.css .github/workflows/temp-dashboard-fix.yml
          git commit -m '[dashboard-fix] Ana sayfa izin görünümü' --no-verify
          git rm .github/workflows/temp-dashboard-fix.yml
          git commit --amend --no-edit --no-verify
          git push