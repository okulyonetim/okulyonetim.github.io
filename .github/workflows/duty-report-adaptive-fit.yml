name: Adaptive duty report fit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/duty-report-adaptive-fit.yml'
      - '.github/temp-duty-report-fit.py'

permissions:
  contents: write

jobs:
  duty-report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current baseline
        run: git merge-base --is-ancestor b52c3e718a031fd75d1aa2c1e8811fceb78c7fad HEAD
      - name: Apply adaptive duty report patch
        run: python3 .github/temp-duty-report-fit.py
      - name: Validate duty report and architecture
        run: |
          set -euo pipefail
          node --check js/modules/management.js
          node --check js/app-loader.js
          node --check service-worker.js
          node tests/duty-report-full-parity.test.js
          node tests/classic-duty-v2-smoke.test.js
          node tests/management-separate-pages.test.js
          node tests/report-engine-a4-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/web-mobile-engine-separation.test.js
          npm run build:client
          node tests/module-bundles-smoke.test.js
          test "$(find css -maxdepth 1 -type f -name '*.css' -printf '%f\n' | sort)" = 'design-system.css'
          grep -q 'css/design-system.css?v=873' index.html
          grep -q 'js/app-loader.js?v=873' index.html
          grep -q "js/modules/management.js?v=873" js/app-loader.js
          grep -q "oy-cache-v873" service-worker.js
          grep -q "./css/design-system.css?v=873" service-worker.js
          grep -q "./js/app-loader.js?v=873" service-worker.js
          grep -q "./js/modules/management.js?v=873" service-worker.js
          ! grep -q 'db.collection(' js/modules/management.js
          ! grep -q 'onSnapshot' js/modules/management.js
      - name: Commit verified report fit and remove temporary files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/duty-report-adaptive-fit.yml .github/temp-duty-report-fit.py
          git add js/modules/management.js css/design-system.css js/app-loader.js index.html service-worker.js tests/duty-report-full-parity.test.js
          git commit -m 'fix: fit duty report to full A4 page'
          git push origin HEAD:main
