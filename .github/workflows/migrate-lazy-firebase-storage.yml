name: migrate-lazy-firebase-storage

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-lazy-firebase-storage.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python scripts/migrate-lazy-firebase-storage.py
      - name: Syntax checks
        run: |
          node --check js/firebase-init.js
          node --check js/app-loader.js
      - name: Lazy Storage smoke
        run: node tests/lazy-firebase-storage-smoke.test.js
      - name: Communication and document checks
        run: |
          node tests/communication-local-first-contract.test.js
          node tests/documents-viewer-v2-smoke.test.js
          node tests/module-bundles-smoke.test.js
      - name: Architecture check
        run: node scripts/check-client-architecture.mjs
      - name: Cleanup migration files
        run: rm -f scripts/migrate-lazy-firebase-storage.py .github/workflows/migrate-lazy-firebase-storage.yml
      - name: Commit production
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'perf(startup): lazy-load Firebase Storage SDK'
          git push
