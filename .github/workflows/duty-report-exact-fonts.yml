name: Duty report exact print fonts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/duty-report-exact-fonts.yml'

permissions:
  contents: write

jobs:
  duty-report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '31a0990bc4ed67aca378f0c09a2620900de2e99e'
      - name: Apply exact print typography
        run: python3 .github/temp-duty-exact-fonts.py
      - name: Validate report and architecture
        run: |
          set -euo pipefail
          node tests/duty-report-full-parity.test.js
          node tests/report-engine-a4-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/module-bundles-smoke.test.js
          node --check js/modules/management.js
          node --check service-worker.js
          npm run build:client
      - name: Commit verified typography and remove temporary files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/duty-report-exact-fonts.yml .github/temp-duty-exact-fonts.py
          git add css/design-system.css index.html service-worker.js tests
          git commit -m 'fix: set duty report print font sizes'
          git push origin HEAD:main
