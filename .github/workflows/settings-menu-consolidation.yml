# temporary verified workflow; removed after the one-shot consolidation
name: Settings menu consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/settings-menu-consolidation.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12

      - name: Verify expected main ancestry
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="9cc27f19ebcb17c593d082c707863d53b843d1e2"
          git merge-base --is-ancestor "$EXPECTED" HEAD

      - name: Consolidate Settings menu shortcuts
        run: python scripts/tmp-consolidate-settings-menu.py

      - name: Validate syntax and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app-loader.js
          node --check js/core/shell-ui.js
          node --check js/modules/settings.js
          node tests/settings-menu-consolidation.test.js
          node tests/settings-separate-pages.test.js
          node tests/user-statistics-admin-view.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/web-mobile-engine-separation.test.js

      - name: Verify local-first and menu ownership boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'db[[:space:]]*\.[[:space:]]*collection|firebase[[:space:]]*\.[[:space:]]*firestore' js/core/shell-ui.js
          ! grep -Eq 'db[[:space:]]*\.[[:space:]]*collection|firebase[[:space:]]*\.[[:space:]]*firestore' js/modules/settings.js
          grep -F "['Ayarlar','⚙️','settings']" js/app-loader.js
          grep -F "['Veriler','🗄️','settings','data']" js/app-loader.js

      - name: Commit verified consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app-loader.js js/core/shell-ui.js tests/settings-menu-consolidation.test.js
          git commit -m "fix: consolidate duplicate settings menu links"
          git push origin main
