name: Annual Plan Admin Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-annual-plan-admin.py'
      - '.github/workflows/annual-plan-admin-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded annual-plan admin migration
        run: python scripts/migrate-annual-plan-admin.py
      - name: Verify academic and architecture
        run: |
          node tests/academic-separate-pages.test.js
          node tests/module-bundles-smoke.test.js
          node tests/no-module-internal-tabs.test.js
          node scripts/build-client-bundles.mjs
          node scripts/check-client-architecture.mjs
      - name: Commit production migration and cleanup
        run: |
          rm scripts/migrate-annual-plan-admin.py .github/workflows/annual-plan-admin-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/academic.js css/design-system.css tests/academic-separate-pages.test.js scripts/migrate-annual-plan-admin.py .github/workflows/annual-plan-admin-migration.yml
          git commit -m 'feat(plans): restore annual-plan management CRUD'
          git push
