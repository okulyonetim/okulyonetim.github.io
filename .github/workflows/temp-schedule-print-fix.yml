name: Temp Schedule Print Fix
on:
  push:
    branches: [work/schedule-print-fix-20260831]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/schedule-print-fix-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply fix
        run: python .github/schedule-print-fix.py
      - name: Verify
        run: |
          set -e
          node --check js/modules/academic.js
          node tests/schedule-print-action.test.js
          node tests/schedule-report-visible-parity.test.js
          node tests/report-engine-a4-smoke.test.js
          node tests/report-native-print-routing-smoke.test.js
          node tests/academic-separate-pages.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node scripts/check-client-architecture.mjs
          git diff --check
      - name: Commit verified fix
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/academic.js service-worker.js tests/schedule-print-action.test.js
          git commit -m "fix: restore schedule sheet print action"
          git push origin HEAD:work/schedule-print-fix-20260831
