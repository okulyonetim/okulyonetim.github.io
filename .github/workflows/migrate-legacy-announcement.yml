name: migrate-legacy-announcement

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-legacy-announcement.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply legacy announcement migration
        run: python3 scripts/migrate-legacy-announcement.py
      - name: Syntax checks
        run: |
          node --check js/modules/dashboard.js
          node --check js/core/shell-ui.js
      - name: Dashboard smoke
        run: node tests/dashboard-card-routes-smoke.test.js
      - name: Architecture smoke suite
        run: |
          for f in tests/*smoke.test.js; do echo "== $f =="; node "$f"; done
      - name: Cleanup temporary migration files
        run: |
          rm -f scripts/migrate-legacy-announcement.py
          rm -f .github/workflows/migrate-legacy-announcement.yml
      - name: Commit production migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(dashboard): restore legacy announcement card'
          git push origin main
