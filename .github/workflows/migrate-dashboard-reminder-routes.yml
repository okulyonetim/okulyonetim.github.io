name: Migrate Dashboard Reminder Routes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-dashboard-reminder-routes.cjs'
      - '.github/workflows/migrate-dashboard-reminder-routes.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded reminder route migration
        run: node scripts/migrate-dashboard-reminder-routes.cjs
      - name: Verify dashboard reminder routes
        run: |
          node tests/dashboard-reminders-smoke.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/no-module-internal-tabs.test.js
          node scripts/check-client-architecture.mjs
      - name: Commit production fix
        run: |
          git config user.name "sedonet23"
          git config user.email "sedonet23@gmail.com"
          git add js/modules/dashboard.js tests/dashboard-reminders-smoke.test.js
          git rm scripts/migrate-dashboard-reminder-routes.cjs .github/workflows/migrate-dashboard-reminder-routes.yml
          git commit -m "fix(dashboard): route reminder rows to exact pages"
          git push
