name: One Shot Academic Consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-academic-consolidation.yml'

permissions:
  contents: write

jobs:
  consolidate:
    if: github.repository == 'sedonet23/okul' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified academic consolidation
        env:
          PATCH_B64: ''
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/academic-consolidation.patch
          git apply --check /tmp/academic-consolidation.patch
          git apply /tmp/academic-consolidation.patch
          git diff --check
      - name: Verify consolidated Academic module
        run: |
          node -c js/modules/academic.js
          node tests/academic-separate-pages.test.js
          node tests/module-bundles-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/classic-shell-v2-smoke.test.js
          node scripts/build-client-bundles.mjs
          node scripts/check-client-architecture.mjs
      - name: Commit consolidated Academic module
        run: |
          git config user.name 'sedonet23'
          git config user.email 'sedonet23@gmail.com'
          git add css/design-system.css js/app-loader.js js/modules/academic.js js/modules/academic-calendar-parity.js scripts/build-client-bundles.mjs service-worker.js tests/academic-separate-pages.test.js tests/classic-shell-v2-smoke.test.js tests/module-bundles-smoke.test.js tests/service-worker-precache-smoke.test.js
          git commit -m 'Consolidate academic calendar into canonical module'
          git push
