name: One Shot Academic Consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-academic-consolidation.yml'
      - '.github/one-shot/academic-patch-*.b64'

permissions:
  contents: write

jobs:
  consolidate:
    if: github.repository == 'sedonet23/okul' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reassemble and verify academic patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/one-shot/academic-patch-0{0,1,2,3,4}.b64 | tr -d '\r\n ' > /tmp/academic-consolidation.b64
          base64 -d /tmp/academic-consolidation.b64 > /tmp/academic-consolidation.patch.gz
          gzip -t /tmp/academic-consolidation.patch.gz
          gzip -dc /tmp/academic-consolidation.patch.gz > /tmp/academic-consolidation.patch
          git apply --check /tmp/academic-consolidation.patch
          git apply /tmp/academic-consolidation.patch
          git diff --check

      - name: Verify consolidated Academic module
        shell: bash
        run: |
          set -euo pipefail
          test ! -e js/modules/academic-calendar-parity.js
          node --check js/modules/academic.js
          node scripts/build-client-bundles.mjs
          node tests/academic-separate-pages.test.js
          node tests/module-bundles-smoke.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/classic-shell-v2-smoke.test.js
          node scripts/check-client-architecture.mjs

      - name: Commit consolidated Academic module and remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/one-shot/academic-patch-0{0,1,2,3,4}.b64
          rmdir .github/one-shot 2>/dev/null || true
          rm -f .github/workflows/one-shot-academic-consolidation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Consolidate academic calendar into Academic module'
          git push origin HEAD:main
