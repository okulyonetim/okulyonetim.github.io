name: Fix Servis Oturma Route

on:
  push:
    paths:
      - ".github/servis-oturma-fix.trigger"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix transport page route
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("js/modules/transport.js")
          s = p.read_text(encoding="utf-8")
          old = "function openPage(page,title=''){const allowed=['services','foodDaily','foodWeekly','foodMonthly','food'];"
          new = "function openPage(page,title=''){const allowed=['services','busSeats','classSeats','foodDaily','foodWeekly','foodMonthly','food'];"
          if old not in s:
              raise SystemExit("Target route definition not found")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/transport.js
          git commit -m "Fix Servis Oturma page route" || exit 0
          git push
      - name: Remove temporary fixer
        if: always()
        run: |
          git rm -f .github/servis-oturma-fix.trigger .github/workflows/fix-servis-oturma.yml || true
          git commit -m "Remove temporary Servis Oturma fixer" || exit 0
          git push || true
