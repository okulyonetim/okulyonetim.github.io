name: Dashboard Quick Actions Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-dashboard-quick-actions.mjs'
      - 'tests/dashboard-quick-actions.test.js'
      - '.github/workflows/dashboard-quick-actions-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded Dashboard quick actions migration
        run: node scripts/apply-dashboard-quick-actions.mjs
      - name: Verify Dashboard quick actions
        run: node tests/dashboard-quick-actions.test.js
      - name: Verify bundles and architecture
        run: node scripts/build-client-bundles.mjs && node tests/module-bundles-smoke.test.js && node scripts/check-client-architecture.mjs
      - name: Commit production migration and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/dashboard.js
          git diff --cached --quiet || git commit -m 'fix(dashboard): route quick actions directly to target pages'
          git rm scripts/apply-dashboard-quick-actions.mjs .github/workflows/dashboard-quick-actions-migration.yml
          git commit -m 'chore(dashboard): remove completed migration helpers'
          git push origin HEAD:main
