name: Temporary full application audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build client bundles
        id: build
        continue-on-error: true
        run: node scripts/build-client-bundles.mjs
      - name: Check JavaScript syntax
        id: syntax
        continue-on-error: true
        shell: bash
        run: |
          set +e
          failed=0
          while IFS= read -r -d '' f; do
            case "$f" in
              js/vendor/*|node_modules/*|dist/*) continue ;;
            esac
            node --check "$f" >/tmp/check.out 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "::error file=$f::JavaScript syntax check failed"
              cat /tmp/check.out
              failed=1
            fi
          done < <(find js scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          exit $failed
      - name: Run every repository test
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          failed=0
          total=0
          passed=0
          for f in $(find tests -maxdepth 1 -type f -name '*.test.js' | sort); do
            total=$((total+1))
            echo "===== TEST: $f ====="
            node "$f" >/tmp/test.out 2>&1
            rc=$?
            if [ $rc -eq 0 ]; then
              passed=$((passed+1))
              tail -n 3 /tmp/test.out || true
            else
              echo "::error file=$f::Test failed"
              cat /tmp/test.out
              failed=1
            fi
          done
          echo "AUDIT_TEST_SUMMARY total=$total passed=$passed failed=$((total-passed))"
          exit $failed
      - name: Run architecture audit
        id: architecture
        continue-on-error: true
        run: node scripts/check-client-architecture.mjs
      - name: Validate JSON files
        id: json
        continue-on-error: true
        shell: bash
        run: |
          set +e
          failed=0
          while IFS= read -r -d '' f; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" >/tmp/json.out 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "::error file=$f::Invalid JSON"
              cat /tmp/json.out
              failed=1
            fi
          done < <(find . -path './node_modules' -prune -o -path './dist' -prune -o -type f -name '*.json' -print0)
          exit $failed
      - name: Final audit result
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          ARCH: ${{ steps.architecture.outcome }}
          JSON: ${{ steps.json.outcome }}
        shell: bash
        run: |
          echo "AUDIT_OUTCOMES build=$BUILD syntax=$SYNTAX tests=$TESTS architecture=$ARCH json=$JSON"
          if [ "$BUILD" != success ] || [ "$SYNTAX" != success ] || [ "$TESTS" != success ] || [ "$ARCH" != success ] || [ "$JSON" != success ]; then
            exit 1
          fi
