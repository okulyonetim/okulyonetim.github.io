name: Apply Maarif multiclass modal navigation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-maarif-multiclass-modal-back.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply patch
        run: python3 scripts/tmp-maarif-multiclass-modal-back.py

      - name: Syntax and focused regression checks
        run: |
          node --check js/modules/rubric-settings.js
          node --check js/core/shell-ui.js
          node tests/maarif-multiclass-modal-navigation.test.js
          node tests/maarif-matrix-visible-parity.test.js
          node tests/cizelge-modern-pages-redesign.test.js
          node tests/management-separate-pages.test.js
          node tests/service-worker-precache-smoke.test.js

      - name: Full client regression suite
        run: node scripts/run-client-tests.mjs

      - name: Client architecture audit
        run: node scripts/check-client-architecture.mjs

      - name: Commit verified fix
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-maarif-multiclass-modal-back.yml scripts/tmp-maarif-multiclass-modal-back.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/rubric-settings.js js/core/shell-ui.js css/design-system.css index.html service-worker.js tests/maarif-multiclass-modal-navigation.test.js .github/workflows scripts
          git diff --cached --check
          git commit -m 'fix: restore maarif multi-class schedule flow'
          git push origin main
