name: Fix Communication Smoke Contract

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-communication-smoke-contract.mjs'
      - '.github/workflows/fix-communication-smoke-contract.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update smoke contract
        run: node scripts/fix-communication-smoke-contract.mjs
      - name: Verify smoke contract
        run: node tests/module-bundles-smoke.test.js
      - name: Commit test fix and cleanup
        run: |
          rm scripts/fix-communication-smoke-contract.mjs .github/workflows/fix-communication-smoke-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/module-bundles-smoke.test.js scripts/fix-communication-smoke-contract.mjs .github/workflows/fix-communication-smoke-contract.yml
          git commit -m 'test(communication): align announcement delete contract'
          git push
