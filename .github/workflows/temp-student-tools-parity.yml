name: Temporary Student Tools Parity Gate

on:
  push:
    branches:
      - work/student-list-gradebook-parity-20260830

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/student-list-gradebook-parity-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct and apply candidate patch
        run: |
          cat .github/staging/student-tools-parity/part* \
            | sed 's/HsTp4skraftj8/HsTp4sqrtj8/' \
            > /tmp/student-tools-parity.patch.xz.b64
          echo '93f199663e9dda170d05ca6bb960f780e92f5b5e8066cb063c6d31dbd8a4e8d7  /tmp/student-tools-parity.patch.xz.b64' | sha256sum -c -
          base64 -d /tmp/student-tools-parity.patch.xz.b64 | xz -d > /tmp/student-tools-parity.patch
          echo '91ca5f2fd721792e25b5dcf8aedc264bf08f373e22f63b596760aedc0af82cac  /tmp/student-tools-parity.patch' | sha256sum -c -
          git apply --check /tmp/student-tools-parity.patch
          git apply /tmp/student-tools-parity.patch
      - name: Verify full client architecture
        run: |
          node --check js/modules/teacher-list.js
          node scripts/build-client-bundles.mjs
          for test in \
            module-bundles-smoke.test.js \
            modules-local-first-boundary.test.js \
            service-worker-precache-smoke.test.js \
            lazy-firebase-storage-smoke.test.js \
            web-mobile-engine-separation.test.js \
            classic-shell-v2-smoke.test.js \
            classic-people-v2-smoke.test.js \
            classes-mobile-parity-smoke.test.js \
            classic-duty-v2-smoke.test.js \
            classic-schedule-v2-smoke.test.js \
            dashboard-card-routes-smoke.test.js \
            dashboard-quick-actions.test.js \
            calendar-month-view.test.js \
            quick-note-launcher.test.js \
            communication-admin-actions.test.js \
            transport-separate-pages.test.js \
            no-module-internal-tabs.test.js \
            report-engine-a4-smoke.test.js \
            report-native-print-routing-smoke.test.js \
            android-print-plugin-smoke.test.js \
            dashboard-reminders-smoke.test.js \
            teacher-list-core-contract.test.js \
            teacher-list-local-first-service.test.js \
            student-tool-routing-smoke.test.js \
            people-separate-pages.test.js \
            academic-separate-pages.test.js \
            management-separate-pages.test.js \
            communication-separate-pages.test.js \
            settings-separate-pages.test.js \
            tools-separate-pages.test.js \
            communication-local-first-contract.test.js \
            retired-legacy-roots-smoke.test.js \
            root-js-inventory-smoke.test.js \
            widget-platform-adapter-smoke.test.js \
            teblig-v2-smoke.test.js \
            documents-viewer-v2-smoke.test.js \
            document-viewer-smoke.test.js \
            lazy-document-libs-smoke.test.js \
            payroll-change-v2-smoke.test.js \
            assistant-v2-smoke.test.js \
            legislation-engine-v2-smoke.test.js \
            map-consolidation-smoke.test.js \
            rubric-tools-v2-smoke.test.js \
            rubric-settings-v2-smoke.test.js \
            rubric-legacy-retirement-readiness.test.js \
            pwa-push-smoke.test.js
          do
            echo "==> $test"
            node "tests/$test"
          done
          node scripts/check-client-architecture.mjs
          cat dist/js/manifest.json
      - name: Commit validated runtime changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/teacher-list.js css/design-system.css
          git commit -m 'Port reference student list and gradebook visible workspaces'
          git push origin HEAD:work/student-list-gradebook-parity-20260830
