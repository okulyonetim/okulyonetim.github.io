name: migrate-legacy-quick-actions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-legacy-quick-actions.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply legacy quick actions migration
        run: python3 scripts/migrate-legacy-quick-actions.py
      - name: Syntax checks
        run: |
          node --check js/modules/dashboard.js
          node --check js/core/shell-ui.js
      - name: Dashboard smoke
        run: node tests/dashboard-card-routes-smoke.test.js
      - name: Architecture checks
        run: |
          node tests/dashboard-quick-actions.test.js
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node scripts/check-client-architecture.mjs
      - name: Cleanup temporary migration files
        run: |
          rm -f scripts/migrate-legacy-quick-actions.py
          rm -f .github/workflows/migrate-legacy-quick-actions.yml
      - name: Commit production migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(dashboard): restore legacy quick actions layout'
          git push origin main
