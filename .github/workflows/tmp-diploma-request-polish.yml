name: Temporary Diploma Request Polish
on:
  push:
    branches: [fix/diploma-request-plain-paragraphs]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply diploma request output polish') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/diploma-request-plain-paragraphs
      - name: Apply requested output changes
        shell: python
        run: |
          from pathlib import Path

          path = Path('js/modules/personnel-documents.js')
          s = path.read_text(encoding='utf-8')
          old = '.pd-info{width:auto!important;margin:0 0 8mm;border-collapse:collapse!important;table-layout:auto!important}.pd-info td{border:0!important;background:#fff!important;color:#000!important;font-size:12pt!important;padding:1.2mm 0!important;vertical-align:top!important}'
          new = '.pd-info{width:auto!important;margin:0 0 8mm;border-collapse:collapse!important;table-layout:auto!important;background:#fff!important}.pd-info tr,.pd-info tr:nth-child(odd),.pd-info tr:nth-child(even){background:#fff!important;box-shadow:none!important}.pd-info td{border:0!important;background:#fff!important;color:#000!important;font-size:12pt!important;padding:1.2mm 0!important;vertical-align:top!important}'
          if old not in s:
              raise SystemExit('Expected pd-info CSS not found')
          s = s.replace(old, new, 1)
          old_body = '<p class="pd-p">${esc(govde)}</p><p class="pd-p">Gereğini arz ederim.</p>'
          new_body = '<p class="pd-p pd-indent">${esc(govde)}</p><p class="pd-p pd-indent">Gereğini arz ederim.</p>'
          if old_body not in s:
              raise SystemExit('Expected request paragraphs not found')
          s = s.replace(old_body, new_body, 1)
          path.write_text(s, encoding='utf-8')

          sw = Path('service-worker.js')
          w = sw.read_text(encoding='utf-8')
          if "oy-cache-v938" not in w:
              raise SystemExit('Expected cache v938 not found')
          sw.write_text(w.replace('oy-cache-v938', 'oy-cache-v939', 1), encoding='utf-8')

          for test in Path('tests').glob('*.js'):
              t = test.read_text(encoding='utf-8')
              if 'oy-cache-v938' in t:
                  test.write_text(t.replace('oy-cache-v938', 'oy-cache-v939'), encoding='utf-8')

          test = Path('tests/personnel-documents-focus-smoke.test.js')
          t = test.read_text(encoding='utf-8')
          anchor = "assert(src.includes('.pd-info td:first-child{width:45mm!important;max-width:45mm!important')&&src.includes('.pd-info td:nth-child(2){width:4mm!important;padding-right:2mm!important'),'Diploma talep çıktısında etiket, iki nokta ve veri alanı birbirine yakın tutulmalı.');"
          extra = "\nassert(src.includes('.pd-info tr,.pd-info tr:nth-child(odd),.pd-info tr:nth-child(even){background:#fff!important;box-shadow:none!important'),'Diploma talep bilgi tablosunda zebra/renklendirme olmamalı.');\nassert(src.includes('<p class=\"pd-p pd-indent\">${esc(govde)}</p><p class=\"pd-p pd-indent\">Gereğini arz ederim.</p>'),'Talep metni ve Gereğini arz ederim satırı paragraf girintili olmalı.');"
          if anchor not in t:
              raise SystemExit('Expected personnel-documents test anchor not found')
          t = t.replace(anchor, anchor + extra, 1)
          test.write_text(t, encoding='utf-8')

          Path('.github/workflows/tmp-diploma-request-polish.yml').unlink()
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply diploma request output polish"
          git push origin HEAD:fix/diploma-request-plain-paragraphs
