name: Apply academic single render

on:
  push:
    branches:
      - work/academic-single-render-20260901
    paths:
      - '.github/workflows/apply-academic-single-render.yml'
      - 'scripts/apply-academic-single-render.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical changes
        run: python scripts/apply-academic-single-render.py
      - name: Verify
        run: |
          git diff --check
          node --check js/modules/academic.js
          node --check js/core/shell-ui.js
          node --test tests/academic-separate-pages.test.js
          node --test tests/classic-shell-v2-smoke.test.js
          node --test tests/modules-local-first-boundary.test.js
          node --test tests/service-worker-precache-smoke.test.js
      - name: Commit canonical files
        run: |
          rm -f .github/workflows/apply-academic-single-render.yml scripts/apply-academic-single-render.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make academic exam pages single-render canonical views'
          git push origin HEAD:work/academic-single-render-20260901
