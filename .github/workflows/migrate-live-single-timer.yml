name: migrate-live-single-timer
on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-live-single-timer.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply single live-status timer
        run: python scripts/migrate-live-single-timer.py
      - name: Syntax checks
        run: |
          node --check js/modules/dashboard.js
          node --check js/modules/school-live-status.js
      - name: Dashboard and architecture checks
        run: |
          node tests/dashboard-card-routes-smoke.test.js
          node tests/classic-shell-v2-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Cleanup temporary migration files
        run: rm -f scripts/migrate-live-single-timer.py .github/workflows/migrate-live-single-timer.yml
      - name: Commit production migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(dashboard): use single live-status timer' || exit 0
          git push
