name: migrate-live-card-stable-sub

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-live-card-stable-sub.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python scripts/migrate-live-card-stable-sub.py
      - name: Syntax
        run: node --check js/modules/dashboard.js
      - name: Dashboard smoke
        run: node tests/dashboard-card-routes-smoke.test.js
      - name: Architecture
        run: node scripts/check-client-architecture.mjs
      - name: Cleanup
        run: rm -f scripts/migrate-live-card-stable-sub.py .github/workflows/migrate-live-card-stable-sub.yml
      - name: Commit production
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(dashboard): keep live-card reminder suffix stable'
          git push
