name: Apply UI stability v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ui-stability-v4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          set -u
          git show e73d79ae8bfa67732f63501b691bc951b285844a:scripts/apply-ui-stability-v3.py > /tmp/apply-ui.py
          python /tmp/apply-ui.py
          python -c 'from pathlib import Path; p=Path("js/modules/dashboard.js"); s=p.read_text(); old="data-dash-trial-session-timer=\"${esc(x.id)}\""; new=old+" data-dash-trial-timer=\"${esc(x.id)}\""; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
          git diff --check
          node --check js/modules/dashboard.js
          node --check js/modules/academic.js
          status=0
          for test_file in tests/trial-auto-timer.test.js tests/dashboard-card-routes-smoke.test.js tests/academic-separate-pages.test.js tests/classic-shell-v2-smoke.test.js tests/modules-local-first-boundary.test.js tests/sinav-islemleri-owner-rules.test.js tests/service-worker-precache-smoke.test.js; do
            if [ "$status" -eq 0 ]; then
              node --test "$test_file" || status=$?
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            git restore js/modules/dashboard.js js/modules/academic.js css/design-system.css service-worker.js tests/trial-auto-timer.test.js
            rm -f .github/workflows/apply-ui-stability-v4.yml
            git add -A
            git commit -m "chore: remove failed UI stability v4 workflow"
            git push origin HEAD:main
            exit "$status"
          fi
          rm -f .github/workflows/apply-ui-stability-v4.yml
          git add -A
          git commit -m "feat: redesign written exams and stabilize dashboard UI"
          git push origin HEAD:main
