name: Apply exam UI and stability refinements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-exam-ui-stability.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and verify
        shell: bash
        run: |
          set -u
          python - <<'PY'
          from pathlib import Path
          import re
          def sub1(text,pattern,repl,label):
              out,n=re.subn(pattern,repl,text,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'{label}: {n}')
              return out
          def rep1(text,old,new,label):
              n=text.count(old)
              if n!=1: raise SystemExit(f'{label}: {n}')
              return text.replace(old,new,1)
          p=Path('js/modules/dashboard.js');d=p.read_text(encoding='utf-8')
          d=sub1(d,r"function stabilizeNewsTicker\(root=document\)\{.*?\}\nfunction trialTotalMin","function stabilizeNewsTicker(root=document){const news=root.querySelector?.('.kh-news'),loop=news?.querySelector('.kh-news-loop');if(!news||!loop||news.dataset.tickerReady==='1')return;const measure=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{if(!news.isConnected||!loop.isConnected||news.dataset.tickerReady==='1')return;const width=Math.ceil(loop.getBoundingClientRect().width);if(width<=0)return;news.style.setProperty('--kh-news-distance',`-${width}px`);news.style.setProperty('--kh-ticker-time',`${Math.max(28,width/30)}s`);news.dataset.tickerReady='1';news.classList.add('is-ready')}));if(document.fonts?.ready)document.fonts.ready.then(measure).catch(measure);else measure()}\nfunction trialTotalMin",'ticker')
          d=sub1(d,r"function trialTimerState\(d,nowMs=Date\.now\(\)\)\{.*?\n\}\nfunction trialFmt","function trialTimerState(d,nowMs=Date.now()){const mins=trialTotalMin(d),total=Math.max(0,mins*60),multi=d?.oturumTuru==='İki Oturum',manualActive=d?.sayacDurumu?.aktif===true,manualRaw=manualActive&&d?.sayacDurumu?.baslatmaTarihi?new Date(d.sayacDurumu.baslatmaTarihi).getTime():0,manualStart=Number.isFinite(manualRaw)?manualRaw:0,start=manualStart||trialStartMs(d),end=start&&total?start+total*1000:0,base={multi,total,start,end,secondsUntilStart:0};if(!start||total<=0)return{...base,run:false,status:'ready',remaining:Math.max(0,total),label:total>0?'Başlangıç bekleniyor':'Süre eksik',progress:0,sessionRemaining:Math.max(0,total),sessionTotal:Math.max(0,total),sessionProgress:0};const until=(start-nowMs)/1000;if(until>0)return{...base,run:false,status:'scheduled',remaining:total,label:'Başlamayı bekliyor',progress:0,sessionRemaining:total,sessionTotal:total,sessionProgress:0,secondsUntilStart:until};const elapsed=Math.max(0,(nowMs-start)/1000),remaining=Math.max(0,total-elapsed),progress=Math.max(0,Math.min(100,elapsed/total*100));if(remaining<=0)return{...base,run:false,status:'done',remaining:0,label:'Tamamlandı',progress:100,sessionRemaining:0,sessionTotal:0,sessionProgress:100};if(multi){const verbal=Math.max(0,(Number(d.sozelSuresiDk)||0)*60),pause=Math.max(0,(Number(d.araSureDk)||0)*60),numeric=Math.max(0,(Number(d.sayisalSuresiDk)||0)*60);let status='active',label='Sözel oturum',sessionTotal=verbal,sessionElapsed=elapsed;if(elapsed>=verbal&&elapsed<verbal+pause){status='break';label='Ara';sessionTotal=pause;sessionElapsed=elapsed-verbal}else if(elapsed>=verbal+pause){label='Sayısal oturum';sessionTotal=numeric;sessionElapsed=elapsed-verbal-pause}const sessionRemaining=Math.max(0,sessionTotal-sessionElapsed),sessionProgress=sessionTotal>0?Math.max(0,Math.min(100,sessionElapsed/sessionTotal*100)):100;return{...base,run:true,status,label,remaining,progress,sessionRemaining,sessionTotal,sessionProgress}}return{...base,run:true,status:'active',remaining,label:'Sınav sürüyor',progress,sessionRemaining:remaining,sessionTotal:total,sessionProgress:progress}}\nfunction trialFmt",'trial-state')
          d=sub1(d,r"function trialCounterSection\(\)\{.*?\nfunction schoolClassLevel","function trialCounterSection(){const list=trialLiveRows().slice(0,1);if(!list.length)return'';return`<section class=\"kh-trial-live\" data-home-section=\"trial-counter\">${list.map(({exam:x,state:st})=>{const finish=x.oturumTuru==='İki Oturum'?(x.sayisalBitis||x.bitisSaati||'—'):(x.bitisSaati||'—'),classes=x.sinflar||x.siniflar||'—',sessionPct=Math.round(st.sessionProgress||0),multi=st.multi===true,timeLabel=multi?'OTURUM KALAN':'SINAV KALAN';return`<button type=\"button\" class=\"kh-trial-live__card ${st.status==='break'?'is-break':''}\" data-dash-route=\"academic\" data-dash-page=\"trial\" data-dash-title=\"Deneme Sınavları\" data-dash-trial-open=\"${esc(x.id)}\"><span class=\"kh-trial-live__head\"><span class=\"kh-trial-live__badge\"><i></i> AKTİF DENEME SINAVI</span><span class=\"kh-trial-live__detail\">Detaylar ›</span></span><span class=\"kh-trial-live__title\">${esc(x.ad||x.baslik||'Deneme sınavı')}</span><span class=\"kh-trial-live__session\" data-dash-trial-label=\"${esc(x.id)}\">${esc(st.label)}</span><span class=\"kh-trial-live__times\"><span class=\"kh-trial-live__time is-session\"><small>${timeLabel}</small><strong data-dash-trial-session-timer=\"${esc(x.id)}\">${esc(trialFmt(st.sessionRemaining))}</strong></span>${multi?`<span class=\"kh-trial-live__time is-total\"><small>TOPLAM SINAV KALAN</small><strong data-dash-trial-total-timer=\"${esc(x.id)}\">${esc(trialFmt(st.remaining))}</strong></span>`:''}</span><span class=\"kh-trial-live__progress-head\"><small>${st.status==='break'?'ARA İLERLEMESİ':'OTURUM İLERLEMESİ'}</small><b data-dash-trial-progress-label=\"${esc(x.id)}\">%${sessionPct}</b></span><progress class=\"kh-trial-live__progress\" data-dash-trial-session-progress=\"${esc(x.id)}\" max=\"100\" value=\"${sessionPct}\">${sessionPct}%</progress><span class=\"kh-trial-live__meta\"><span><small>◷ BİTİŞ</small><b>${esc(finish)}</b></span><span><small>▣ TARİH</small><b>${esc(date(x.tarih))}</b></span><span><small>👥 SINIFLAR</small><b>${esc(classes)}</b></span></span></button>`}).join('')}</section>`}function refreshTrialTimers(root=document){const live=trialLiveRows().slice(0,1),cards=[...root.querySelectorAll?.('[data-dash-trial-open]')||[]],wanted=live.map(x=>String(x.exam.id)).join('|'),shown=cards.map(x=>String(x.dataset.dashTrialOpen||'')).join('|');if(wanted!==shown){if(mounted)queueRender();return}cards.forEach(card=>{const item=live.find(x=>String(x.exam.id)===String(card.dataset.dashTrialOpen));if(item)card.classList.toggle('is-break',item.state.status==='break')});root.querySelectorAll?.('[data-dash-trial-session-timer]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialSessionTimer));if(item)el.textContent=trialFmt(item.state.sessionRemaining)});root.querySelectorAll?.('[data-dash-trial-total-timer]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialTotalTimer));if(item)el.textContent=trialFmt(item.state.remaining)});root.querySelectorAll?.('[data-dash-trial-label]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialLabel));if(item)el.textContent=item.state.label});root.querySelectorAll?.('[data-dash-trial-session-progress]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialSessionProgress));if(item)el.value=Math.round(item.state.sessionProgress||0)});root.querySelectorAll?.('[data-dash-trial-progress-label]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialProgressLabel));if(item)el.textContent=`%${Math.round(item.state.sessionProgress||0)}`})}\n\nfunction schoolClassLevel",'trial-card')
          d=rep1(d,'root.innerHTML=shell();bindPresentation(root);subscribe();await prepareReminderData();if(!mounted)return false;render();','root.innerHTML=shell();bindPresentation(root);await prepareReminderData();if(!mounted)return false;subscribe();render();','dashboard-hydrate')
          d=d.replace(' data-news-signature=\"${esc(signature)}\" style=\"--kh-ticker-time:${Math.max(22,items.length*8)}s\"',' data-news-signature=\"${esc(signature)}\"',1)
          p.write_text(d,encoding='utf-8')
          p=Path('js/modules/academic.js');a=p.read_text(encoding='utf-8');a=rep1(a,'root.innerHTML=shell();bind();subscribe();await prepareLocal();render();','root.innerHTML=shell();bind();await prepareLocal();if(!mounted)return false;subscribe();render();','academic-hydrate');p.write_text(a,encoding='utf-8')
          p=Path('js/core/shell-ui.js');s=p.read_text(encoding='utf-8');s=sub1(s,r"function hideRouteTransitionFrame\(\)\{.*?\}","function hideRouteTransitionFrame(){const root=$('#v2ModuleRoot');if(!root)return;root.classList.add('ka-route-switching');requestAnimationFrame(()=>root.classList.remove('ka-route-switching'))}",'route-frame');p.write_text(s,encoding='utf-8')
          p=Path('css/design-system.css');c=p.read_text(encoding='utf-8');c=rep1(c,'.ka-route-switching{visibility:hidden!important}','.ka-route-switching{pointer-events:none}','route-css')
          news='.ka-home .kh-news{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;min-height:42px;overflow:hidden;border:1px solid var(--ka-border);border-radius:15px;background:var(--ka-card-bg);box-shadow:var(--ka-shadow-sm)}.ka-home .kh-news-label{height:100%;display:flex;align-items:center;gap:5px;padding:0 10px;border:0;background:var(--ka-primary);color:var(--ka-text-inverse);font-size:9.5px;font-weight:900;letter-spacing:.04em;z-index:2;cursor:pointer}.ka-home .kh-news-label svg{width:15px;height:15px}.ka-home .kh-news-viewport{overflow:hidden;white-space:nowrap;min-width:0;padding-inline:12px;isolation:isolate}.ka-home .kh-news-track{display:flex;align-items:center;gap:0;width:max-content;animation:none;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden}.ka-home .kh-news.is-ready .kh-news-track{animation:khTicker var(--kh-ticker-time,32s) linear infinite}.ka-home .kh-news-loop{display:flex;align-items:center;gap:28px;flex:none;padding-right:28px}.ka-home .kh-news:hover .kh-news-track{animation-play-state:paused}.ka-home .kh-news-item{border:0;background:none;padding:0;color:var(--ka-text);font:inherit;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer}.ka-home .kh-news-dot{color:var(--ka-primary);font-weight:900}@keyframes khTicker{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--kh-news-distance,-50%),0,0)}}@media(prefers-reduced-motion:reduce){.ka-home .kh-news-track,.ka-home .kh-news.is-ready .kh-news-track{animation:none;transform:none;will-change:auto}.ka-home .kh-news-viewport{overflow-x:auto}}'
          c=sub1(c,r"\.ka-home \.kh-news\{.*?@keyframes khTicker\{from\{transform:translate3d\(0,0,0\)\}to\{transform:translate3d\(var\(--kh-news-distance,-50%\),0,0\)\}\}",news,'news-css')
          home='/* DENEME AUTO TIMER — CANONICAL 2026 */.kh-trial-live{width:100%;min-width:0}.kh-trial-live__card{width:100%;display:block;padding:16px;border:1px solid color-mix(in srgb,var(--ka-primary) 32%,var(--ka-border));border-radius:21px;background:radial-gradient(circle at 92% 4%,color-mix(in srgb,var(--ka-warning) 10%,transparent),transparent 31%),linear-gradient(145deg,color-mix(in srgb,var(--ka-primary) 8%,var(--ka-card-bg)),var(--ka-card-bg));color:var(--ka-text);box-shadow:var(--ka-shadow-md);text-align:left;cursor:pointer}.kh-trial-live__card.is-break{border-color:color-mix(in srgb,var(--ka-warning) 48%,var(--ka-border));background:linear-gradient(145deg,color-mix(in srgb,var(--ka-warning) 9%,var(--ka-card-bg)),var(--ka-card-bg))}.kh-trial-live__head{display:flex;align-items:center;justify-content:space-between;gap:10px}.kh-trial-live__badge{display:inline-flex;align-items:center;gap:7px;color:var(--ka-primary);font-size:9.5px;font-weight:900;letter-spacing:.075em}.kh-trial-live__badge i{width:7px;height:7px;border-radius:50%;background:var(--ka-success);box-shadow:0 0 0 5px color-mix(in srgb,var(--ka-success) 12%,transparent)}.kh-trial-live__card.is-break .kh-trial-live__badge{color:var(--ka-warning)}.kh-trial-live__detail{color:var(--ka-primary);font-size:10.5px;font-weight:850}.kh-trial-live__title{display:block;margin-top:10px;font-size:19px;font-weight:900}.kh-trial-live__session{display:inline-flex;margin-top:6px;padding:5px 8px;border-radius:999px;background:var(--ka-primary-soft);color:var(--ka-primary);font-size:10px;font-weight:850}.kh-trial-live__card.is-break .kh-trial-live__session{background:color-mix(in srgb,var(--ka-warning) 13%,var(--ka-card-bg));color:var(--ka-warning)}.kh-trial-live__times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}.kh-trial-live__time{display:grid;gap:4px;padding:11px 12px;border:1px solid var(--ka-border);border-radius:14px;background:color-mix(in srgb,var(--ka-muted-bg) 72%,var(--ka-card-bg))}.kh-trial-live__times .kh-trial-live__time:only-child{grid-column:1/-1}.kh-trial-live__time small{color:var(--ka-text-muted);font-size:8px;font-weight:900;letter-spacing:.07em}.kh-trial-live__time strong{font-family:var(--ka-font-mono);font-size:19px;font-variant-numeric:tabular-nums}.kh-trial-live__time.is-session strong{color:var(--ka-primary)}.kh-trial-live__card.is-break .kh-trial-live__time.is-session strong{color:var(--ka-warning)}.kh-trial-live__progress-head{display:flex;align-items:center;justify-content:space-between;margin-top:13px}.kh-trial-live__progress-head small{color:var(--ka-text-muted);font-size:8px;font-weight:900;letter-spacing:.07em}.kh-trial-live__progress-head b{color:var(--ka-primary);font-size:10px}.kh-trial-live__progress{display:block;width:100%;height:8px;margin-top:6px;border:0;border-radius:999px;overflow:hidden;background:var(--ka-border);appearance:none;-webkit-appearance:none}.kh-trial-live__progress::-webkit-progress-bar{background:var(--ka-border)}.kh-trial-live__progress::-webkit-progress-value{background:linear-gradient(90deg,var(--ka-primary),var(--ka-warning));border-radius:999px}.kh-trial-live__progress::-moz-progress-bar{background:linear-gradient(90deg,var(--ka-primary),var(--ka-warning));border-radius:999px}.kh-trial-live__card.is-break .kh-trial-live__progress::-webkit-progress-value{background:var(--ka-warning)}.kh-trial-live__card.is-break .kh-trial-live__progress::-moz-progress-bar{background:var(--ka-warning)}.kh-trial-live__meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:13px}.kh-trial-live__meta>span{display:grid;gap:3px;padding:9px 8px;border:1px solid var(--ka-border);border-radius:12px;background:color-mix(in srgb,var(--ka-muted-bg) 68%,var(--ka-card-bg));text-align:center}.kh-trial-live__meta small{color:var(--ka-text-muted);font-size:7.5px;font-weight:850}.kh-trial-live__meta b{font-size:10.5px;overflow-wrap:anywhere}[data-theme=\"dark\"] .kh-trial-live__card{background:linear-gradient(145deg,color-mix(in srgb,var(--ka-primary) 12%,var(--ka-card-bg)),var(--ka-card-bg));box-shadow:0 14px 30px rgba(0,0,0,.28)}@media(max-width:640px){.kh-trial-live__card{padding:14px}.kh-trial-live__time{padding:10px}.kh-trial-live__time strong{font-size:17px}.kh-trial-live__meta>span{padding:8px 5px}}'
          c=sub1(c,r"/\* DENEME AUTO TIMER — CANONICAL 2026 \*/.*?(?=\.ka-trial-add)",home,'home-trial-css');p.write_text(c,encoding='utf-8')
          p=Path('service-worker.js');w=p.read_text(encoding='utf-8');w=rep1(w,"const CACHE_ADI='oy-cache-v831';","const CACHE_ADI='oy-cache-v832';",'sw');p.write_text(w,encoding='utf-8')
          p=Path('tests/trial-auto-timer.test.js');t=p.read_text(encoding='utf-8');t=rep1(t,"for(const token of ['.kh-trial-live__card','.kh-trial-live__ring','.ka-trial-counter__overview','[data-theme=\"dark\"] .kh-trial-live__card'])","for(const token of ['.kh-trial-live__card','.kh-trial-live__progress','.ka-trial-counter__overview','[data-theme=\"dark\"] .kh-trial-live__card'])",'test-css');p.write_text(t,encoding='utf-8')
          PY
          git diff --check
          node --check js/modules/dashboard.js
          node --check js/modules/academic.js
          node --check js/core/shell-ui.js
          test_status=0
          node --test tests/trial-auto-timer.test.js || test_status=$?
          if [ "$test_status" -eq 0 ]; then node --test tests/dashboard-card-routes-smoke.test.js || test_status=$?; fi
          if [ "$test_status" -eq 0 ]; then node --test tests/academic-separate-pages.test.js || test_status=$?; fi
          if [ "$test_status" -eq 0 ]; then node --test tests/classic-shell-v2-smoke.test.js || test_status=$?; fi
          if [ "$test_status" -eq 0 ]; then node --test tests/modules-local-first-boundary.test.js || test_status=$?; fi
          if [ "$test_status" -eq 0 ]; then node --test tests/service-worker-precache-smoke.test.js || test_status=$?; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$test_status" -ne 0 ]; then
            git restore js/modules/dashboard.js js/modules/academic.js js/core/shell-ui.js css/design-system.css service-worker.js tests/trial-auto-timer.test.js
            rm -f .github/workflows/apply-exam-ui-stability.yml
            git add -A
            git commit -m "chore: remove failed UI stability workflow"
            git push origin HEAD:main
            exit "$test_status"
          fi
          rm -f .github/workflows/apply-exam-ui-stability.yml
          git add js/modules/dashboard.js js/modules/academic.js js/core/shell-ui.js css/design-system.css service-worker.js tests/trial-auto-timer.test.js .github/workflows/apply-exam-ui-stability.yml
          git commit -m "fix: stabilize navigation and refine live exam card"
          git push origin HEAD:main
