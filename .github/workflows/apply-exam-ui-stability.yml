es .kh-trial-live__time:only-child{grid-column:1/-1}.kh-trial-live__time small{color:var(--ka-text-muted);font-size:8px;font-weight:900;letter-spacing:.07em}.kh-trial-live__time strong{font-family:var(--ka-font-mono);font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.025em}.kh-trial-live__time.is-session strong{color:var(--ka-primary)}.kh-trial-live__card.is-break .kh-trial-live__time.is-session strong{color:var(--ka-warning)}.kh-trial-live__time.is-total strong{color:var(--ka-text)}.kh-trial-live__progress-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px}.kh-trial-live__progress-head small{color:var(--ka-text-muted);font-size:8px;font-weight:900;letter-spacing:.07em}.kh-trial-live__progress-head b{color:var(--ka-primary);font-size:10px}.kh-trial-live__card.is-break .kh-trial-live__progress-head b{color:var(--ka-warning)}.kh-trial-live__progress{display:block;width:100%;height:8px;margin-top:6px;border:0;border-radius:999px;overflow:hidden;background:var(--ka-border);appearance:none;-webkit-appearance:none}.kh-trial-live__progress::-webkit-progress-bar{background:var(--ka-border);border-radius:999px}.kh-trial-live__progress::-webkit-progress-value{border-radius:999px;background:linear-gradient(90deg,var(--ka-primary),color-mix(in srgb,var(--ka-primary) 72%,var(--ka-warning)))}.kh-trial-live__progress::-moz-progress-bar{border-radius:999px;background:linear-gradient(90deg,var(--ka-primary),color-mix(in srgb,var(--ka-primary) 72%,var(--ka-warning)))}.kh-trial-live__card.is-break .kh-trial-live__progress::-webkit-progress-value{background:var(--ka-warning)}.kh-trial-live__card.is-break .kh-trial-live__progress::-moz-progress-bar{background:var(--ka-warning)}.kh-trial-live__meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:13px}.kh-trial-live__meta>span{display:grid;gap:3px;padding:9px 8px;border:1px solid var(--ka-border);border-radius:12px;background:color-mix(in 