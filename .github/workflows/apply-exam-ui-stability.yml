          addition = marker + "\nassert(dash.includes('sessionRemaining')&&dash.includes('data-dash-trial-session-timer')&&dash.includes('data-dash-trial-total-timer'),'Çoklu oturumda mevcut oturum ve toplam sınav kalan süreleri ayrı gösterilmeli.');"
          test = replace_once(test, marker, addition, 'trial session regression')
          p.write_text(test, encoding='utf-8')
          PY

          git diff --check
          node --check js/modules/dashboard.js
          node --check js/modules/academic.js
          node --check js/core/shell-ui.js

          test_status=0
          node --test tests/trial-auto-timer.test.js || test_status=$?
          if [ "$test_status" -eq 0 ]; then node --test tests/dashboard-card-routes-smoke.test.js || test_status=$?; fi
          if [ "$test_status" -eq 0 ]; then node --test tests/academic-separate-pages.test.js || test_status=$?; fi
          if [ "$test_status" -eq 0 ]; then node --test tests/classic-shell-v2-smoke.test.js || test_status=$?; fi
          if [ "$test_status" -eq 0 ]; then node --test tests/modules-local-first-boundary.test.js || test_status=$?; fi
          if [ "$test_status" -eq 0 ]; then node --test tests/sinav-islemleri-owner-rules.test.js || test_status=$?; fi
          if [ "$test_status" -eq 0 ]; then node --test tests/service-worker-precache-smoke.test.js || test_status=$?; fi

          if [ "$test_status" -eq 0 ]; then
            node <<'NODE' || test_status=$?
          const fs=require('fs'),assert=require('assert');
          const dash=fs.readFileSync('js/modules/dashboard.js','utf8');
          const academic=fs.readFileSync('js/modules/academic.js','utf8');
          const shell=fs.readFileSync('js/core/shell-ui.js','utf8');
          const css=fs.readFileSync('css/design-system.css','utf8');
          assert(dash.includes("news.dataset.tickerReady==='1'"));
          assert(dash.includes('data-dash-trial-session-progress'));
          assert(dash.includes('data-dash-trial-total-timer'));
          assert(academic.includes('ka-written-register'));
          assert(!css.includes('.ka-route-switching{visibility:hidden!important}'));
          assert(css.includes('.ka-route-switching{pointer-events:none}'));
          assert(!css.includes('.kh-trial-live__ring{'));
          assert(css.includes('.kh-trial-live__progress{'));
          assert(shell.includes("requestAnimationFrame(()=>root.classList.remove('ka-route-switching'))"));
          console.log('UI stability regression checks passed.');
          NODE
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$test_status" -ne 0 ]; then
            git restore js/modules/dashboard.js js/modules/academic.js js/core/shell-ui.js css/design-system.css service-worker.js tests/trial-auto-timer.test.js
            rm -f .github/workflows/apply-exam-ui-stability.yml
            git add -A
            git commit -m "chore: remove failed exam UI workflow"
            git push origin HEAD:main
            exit "$test_status"
          fi

          rm -f .github/workflows/apply-exam-ui-stability.yml
          git add js/modules/dashboard.js js/modules/academic.js js/core/shell-ui.js css/design-system.css service-worker.js tests/trial-auto-timer.test.js .github/workflows/apply-exam-ui-stability.yml
          git commit -m "feat: refine exam surfaces and UI stability"
