name: Apply exam UI and stability refinements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-exam-ui-stability.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical UI and verify
        shell: bash
        run: |
          set -u
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=re.S):
              out, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')
              return out

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, got {count}')
              return text.replace(old, new, 1)

          # ---------- Dashboard: live exam card + ticker + initial hydration stability ----------
          p = Path('js/modules/dashboard.js')
          dash = p.read_text(encoding='utf-8')

          dash = sub_once(
              dash,
              r'function stabilizeNewsTicker\(root=document\)\{.*?\}\nfunction trialTotalMin',
              '''function stabilizeNewsTicker(root=document){
  const news=root.querySelector?.('.kh-news'),loop=news?.querySelector('.kh-news-loop');
  if(!news||!loop||news.dataset.tickerReady==='1')return;
  const measure=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(!news.isConnected||!loop.isConnected||news.dataset.tickerReady==='1')return;
    const width=Math.ceil(loop.getBoundingClientRect().width);if(width<=0)return;
    news.style.setProperty('--kh-news-distance',`-${width}px`);
    news.style.setProperty('--kh-ticker-time',`${Math.max(28,width/30)}s`);
    news.dataset.tickerReady='1';
    news.classList.add('is-ready');
  }));
  if(document.fonts?.ready)document.fonts.ready.then(measure).catch(measure);else measure();
}
function trialTotalMin''',
              'dashboard ticker stabilizer'
          )

          dash = sub_once(
              dash,
              r'function trialTimerState\(d,nowMs=Date\.now\(\)\)\{.*?\n\}\nfunction trialFmt',
              '''function trialTimerState(d,nowMs=Date.now()){
const mins=trialTotalMin(d),total=Math.max(0,mins*60),multi=d?.oturumTuru==='İki Oturum',manualActive=d?.sayacDurumu?.aktif===true,manualRaw=manualActive&&d?.sayacDurumu?.baslatmaTarihi?new Date(d.sayacDurumu.baslatmaTarihi).getTime():0,manualStart=Number.isFinite(manualRaw)?manualRaw:0,start=manualStart||trialStartMs(d),end=start&&total?start+total*1000:0;
const base={multi,total,start,end,secondsUntilStart:0};
if(!start||total<=0)return{...base,run:false,status:'ready',remaining:Math.max(0,total),label:total>0?'Başlangıç bekleniyor':'Süre eksik',progress:0,sessionRemaining:Math.max(0,total),sessionTotal:Math.max(0,total),sessionProgress:0};
const until=(start-nowMs)/1000;if(until>0)return{...base,run:false,status:'scheduled',remaining:total,label:'Başlamayı bekliyor',progress:0,sessionRemaining:total,sessionTotal:total,sessionProgress:0,secondsUntilStart:until};
const elapsed=Math.max(0,(nowMs-start)/1000),remaining=Math.max(0,total-elapsed),progress=Math.max(0,Math.min(100,elapsed/total*100));
if(remaining<=0)return{...base,run:false,status:'done',remaining:0,label:'Tamamlandı',progress:100,sessionRemaining:0,sessionTotal:0,sessionProgress:100};
if(multi){
  const verbal=Math.max(0,(Number(d.sozelSuresiDk)||0)*60),pause=Math.max(0,(Number(d.araSureDk)||0)*60),numeric=Math.max(0,(Number(d.sayisalSuresiDk)||0)*60);
  let status='active',label='Sözel oturum',sessionTotal=verbal,sessionElapsed=elapsed;
  if(elapsed>=verbal&&elapsed<verbal+pause){status='break';label='Ara';sessionTotal=pause;sessionElapsed=elapsed-verbal}
  else if(elapsed>=verbal+pause){status='active';label='Sayısal oturum';sessionTotal=numeric;sessionElapsed=elapsed-verbal-pause}
  const sessionRemaining=Math.max(0,sessionTotal-sessionElapsed),sessionProgress=sessionTotal>0?Math.max(0,Math.min(100,sessionElapsed/sessionTotal*100)):100;
  return{...base,run:true,status,label,remaining,progress,sessionRemaining,sessionTotal,sessionProgress};
}
return{...base,run:true,status:'active',remaining,label:'Sınav sürüyor',progress,sessionRemaining:remaining,sessionTotal:total,sessionProgress:progress};
}
function trialFmt''',
              'dashboard trial state'
          )

          dash = sub_once(
              dash,
              r'function trialCounterSection\(\)\{.*?\nfunction schoolClassLevel',
              '''function trialCounterSection(){
  const list=trialLiveRows().slice(0,1);if(!list.length)return'';
  return `<section class="kh-trial-live" data-home-section="trial-counter">${list.map(({exam:x,state:st})=>{const finish=x.oturumTuru==='İki Oturum'?(x.sayisalBitis||x.bitisSaati||'—'):(x.bitisSaati||'—'),classes=x.sinflar||x.siniflar||'—',sessionPct=Math.round(st.sessionProgress||0),multi=st.multi===true,timeLabel=multi?'OTURUM KALAN':'SINAV KALAN';return`<button type="button" class="kh-trial-live__card ${st.status==='break'?'is-break':''}" data-dash-route="academic" data-dash-page="trial" data-dash-title="Deneme Sınavları" data-dash-trial-open="${esc(x.id)}" data-dash-trial-status="${esc(st.status)}"><span class="kh-trial-live__head"><span class="kh-trial-live__badge"><i></i> AKTİF DENEME SINAVI</span><span class="kh-trial-live__detail">Detaylar ›</span></span><span class="kh-trial-live__title">${esc(x.ad||x.baslik||'Deneme sınavı')}</span><span class="kh-trial-live__session" data-dash-trial-label="${esc(x.id)}">${esc(st.label)}</span><span class="kh-trial-live__times"><span class="kh-trial-live__time is-session"><small>${timeLabel}</small><strong data-dash-trial-session-timer="${esc(x.id)}">${esc(trialFmt(st.sessionRemaining))}</strong></span>${multi?`<span class="kh-trial-live__time is-total"><small>TOPLAM SINAV KALAN</small><strong data-dash-trial-total-timer="${esc(x.id)}">${esc(trialFmt(st.remaining))}</strong></span>`:''}</span><span class="kh-trial-live__progress-head"><small>${st.status==='break'?'ARA İLERLEMESİ':'OTURUM İLERLEMESİ'}</small><b data-dash-trial-progress-label="${esc(x.id)}">%${sessionPct}</b></span><progress class="kh-trial-live__progress" data-dash-trial-session-progress="${esc(x.id)}" max="100" value="${sessionPct}">${sessionPct}%</progress><span class="kh-trial-live__meta"><span><small>◷ BİTİŞ</small><b>${esc(finish)}</b></span><span><small>▣ TARİH</small><b>${esc(date(x.tarih))}</b></span><span><small>👥 SINIFLAR</small><b>${esc(classes)}</b></span></span></button>`}).join('')}</section>`;
}
function refreshTrialTimers(root=document){
  const live=trialLiveRows().slice(0,1),cards=[...root.querySelectorAll?.('[data-dash-trial-open]')||[]],wanted=live.map(x=>String(x.exam.id)).join('|'),shown=cards.map(x=>String(x.dataset.dashTrialOpen||'')).join('|');
  if(wanted!==shown){if(mounted)queueRender();return}
  cards.forEach(card=>{const item=live.find(x=>String(x.exam.id)===String(card.dataset.dashTrialOpen));if(!item)return;card.classList.toggle('is-break',item.state.status==='break');card.dataset.dashTrialStatus=item.state.status||''});
  root.querySelectorAll?.('[data-dash-trial-session-timer]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialSessionTimer));if(item)el.textContent=trialFmt(item.state.sessionRemaining)});
  root.querySelectorAll?.('[data-dash-trial-total-timer]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialTotalTimer));if(item)el.textContent=trialFmt(item.state.remaining)});
  root.querySelectorAll?.('[data-dash-trial-label]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialLabel));if(item)el.textContent=item.state.label});
  root.querySelectorAll?.('[data-dash-trial-session-progress]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialSessionProgress));if(item)el.value=Math.round(item.state.sessionProgress||0)});
  root.querySelectorAll?.('[data-dash-trial-progress-label]').forEach(el=>{const item=live.find(x=>String(x.exam.id)===String(el.dataset.dashTrialProgressLabel));if(item)el.textContent=`%${Math.round(item.state.sessionProgress||0)}`});
}

function schoolClassLevel''',
              'dashboard live trial card'
          )

          dash = replace_once(
              dash,
              'root.innerHTML=shell();bindPresentation(root);subscribe();await prepareReminderData();if(!mounted)return false;render();',
              'root.innerHTML=shell();bindPresentation(root);await prepareReminderData();if(!mounted)return false;subscribe();render();',
              'dashboard hydrate-before-subscribe'
          )
          dash = dash.replace(' data-news-signature="${esc(signature)}" style="--kh-ticker-time:${Math.max(22,items.length*8)}s"', ' data-news-signature="${esc(signature)}"', 1)
          p.write_text(dash, encoding='utf-8')

          # ---------- Academic: written exam visual hierarchy + initial hydration stability ----------
          p = Path('js/modules/academic.js')
          academic = p.read_text(encoding='utf-8')
          academic = sub_once(
              academic,
              r'function written\(\)\{.*?\nfunction canControl',
              '''function written(){
  const list=arr('sinavlar').filter(s=>match([s.ders,s.sinif,s.siniflar,s.donem,s.yaziliSirasi,s.tur,s.tarih,s.yayinevi,s.notlar])).sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||'')),todayCount=list.filter(s=>examDayDiff(s.tarih)===0).length,soon=list.filter(s=>{const d=examDayDiff(s.tarih);return d!==null&&d>=0&&d<=7}).length;
  const add=canEditExams()?'<button class="ka-btn ka-written-add" type="button" data-written-new data-ka-permission="academic.exams.edit" data-ka-write="academic.exams.edit">＋ Yazılı Ekle</button>':'';
  return{count:list.length,html:`<section class="ka-stack ka-written-page"><article class="ka-written-hero"><div class="ka-written-hero__intro"><span class="ka-written-hero__icon">✓</span><div><small class="ka-written-hero__eyebrow">YAZILI SINAV TAKVİMİ</small><h2>Yazılı Sınavlar</h2><p>Sınav tarihlerini, sınıfları ve ayrıntıları tek ekrandan yönetin.</p></div></div>${add}</article><div class="ka-written-summary"><article class="is-total"><b>${list.length}</b><span>Toplam sınav</span></article><article class="is-soon"><b>${soon}</b><span>7 gün içinde</span></article><article class="is-today"><b>${todayCount}</b><span>Bugün</span></article></div><section class="ka-written-register"><div class="ka-written-register__head"><div><small>SINAV KAYITLARI</small><h3>Planlanan yazılılar</h3></div><span>${list.length} kayıt</span></div><div class="ka-written-list">${list.length?list.map(s=>{const editable=SinavlarService?.sinavDuzenlenebilirMi?.(s),d=examDayDiff(s.tarih),status=d===0?'Bugün':d!==null&&d>0&&d<=7?`${d} gün kaldı`:date(s.tarih),classes=s.siniflar||s.sinif||'Sınıf belirtilmemiş',details=[date(s.tarih),s.dersSaati?`${s.dersSaati}. ders`:null,s.ogretmenId?teacherName(s.ogretmenId):null,s.senaryoNo?`${s.senaryoNo}. Senaryo`:null,s.yayinevi||null].filter(Boolean);return`<article class="ka-written-card ${d===0?'is-today':d!==null&&d>0&&d<=7?'is-soon':''}"><div class="ka-written-card__icon">✓</div><div class="ka-written-card__main"><div class="ka-written-card__head"><div><strong>${esc(s.ders||'Yazılı sınav')} <span>— ${esc(classes)}</span></strong><div class="ka-written-card__chips"><span>${esc(s.donem||'Dönem')}</span><span>${esc(s.yaziliSirasi||s.tur||'Yazılı')}</span></div></div><span class="ka-written-date ${d===0?'is-today':d!==null&&d>0&&d<=7?'is-soon':''}">${esc(status)}</span></div><div class="ka-written-card__line">${details.map(v=>`<span>${esc(v)}</span>`).join('')}</div>${s.notlar?`<div class="ka-written-note">${esc(s.notlar)}</div>`:''}${editable?`<div class="ka-written-card__actions"><button class="ka-btn ka-btn--secondary ka-btn--sm" type="button" data-written-edit="${esc(s.id)}">Düzenle</button></div>`:''}</div></article>`}).join(''):'<div class="ka-empty ka-written-empty"><strong>Henüz yazılı sınavı eklenmedi.</strong><span>Yeni bir sınav oluşturmak için “Yazılı Ekle” butonunu kullanın.</span></div>'}</div></section></section>`}
}
function canControl''',
              'academic written workspace'
          )
          academic = replace_once(
              academic,
              'root.innerHTML=shell();bind();subscribe();await prepareLocal();render();',
              'root.innerHTML=shell();bind();await prepareLocal();if(!mounted)return false;subscribe();render();',
              'academic hydrate-before-subscribe'
          )
          p.write_text(academic, encoding='utf-8')

          # ---------- Shell: remove the intentional hidden-frame blink ----------
          p = Path('js/core/shell-ui.js')
          shell = p.read_text(encoding='utf-8')
          shell = sub_once(
              shell,
              r'function hideRouteTransitionFrame\(\)\{.*?\}',
              "function hideRouteTransitionFrame(){const root=$('#v2ModuleRoot');if(!root)return;root.classList.add('ka-route-switching');requestAnimationFrame(()=>root.classList.remove('ka-route-switching'))}",
              'route transition frame'
          )
          p.write_text(shell, encoding='utf-8')

          # ---------- Design system: ticker, written exams, live card, route stability ----------
          p = Path('css/design-system.css')
          css = p.read_text(encoding='utf-8')
          css = replace_once(css, '.ka-route-switching{visibility:hidden!important}', '.ka-route-switching{pointer-events:none}', 'route switching css')

          css = sub_once(
              css,
              r'\.ka-home \.kh-news\{.*?@keyframes khTicker\{from\{transform:translate3d\(0,0,0\)\}to\{transform:translate3d\(var\(--kh-news-distance,-50%\),0,0\)\}\}',
              '''.ka-home .kh-news{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;min-height:42px;overflow:hidden;border:1px solid var(--ka-border);border-radius:15px;background:var(--ka-card-bg);box-shadow:var(--ka-shadow-sm)}
.ka-home .kh-news-label{height:100%;display:flex;align-items:center;gap:5px;padding:0 10px;border:0;background:var(--ka-primary);color:var(--ka-text-inverse);font-size:9.5px;font-weight:900;letter-spacing:.04em;z-index:2;cursor:pointer}
.ka-home .kh-news-label svg{width:15px;height:15px}
.ka-home .kh-news-viewport{overflow:hidden;white-space:nowrap;min-width:0;padding-inline:12px;isolation:isolate}
.ka-home .kh-news-track{display:flex;align-items:center;gap:0;width:max-content;animation:none;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden}.ka-home .kh-news.is-ready .kh-news-track{animation:khTicker var(--kh-ticker-time,32s) linear infinite}
.ka-home .kh-news-loop{display:flex;align-items:center;gap:28px;flex:none;padding-right:28px}
.ka-home .kh-news:hover .kh-news-track{animation-play-state:paused}
.ka-home .kh-news-item{border:0;background:none;padding:0;color:var(--ka-text);font:inherit;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer}
.ka-home .kh-news-dot{color:var(--ka-primary);font-weight:900}
@keyframes khTicker{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--kh-news-distance,-50%),0,0)}}
@media(prefers-reduced-motion:reduce){.ka-home .kh-news-track,.ka-home .kh-news.is-ready .kh-news-track{animation:none;transform:none;will-change:auto}.ka-home .kh-news-viewport{overflow-x:auto}}''',
              'news ticker css'
          )

          written_css = r'''/* Written Exams visible workspace */
.ka-written-page{width:min(100%,960px);margin-inline:auto;gap:14px}.ka-written-hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:19px 20px;border:1px solid color-mix(in srgb,var(--ka-primary) 24%,var(--ka-border));border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--ka-primary) 10%,var(--ka-card-bg)),var(--ka-card-bg) 58%,color-mix(in srgb,var(--ka-warning) 8%,var(--ka-card-bg)));box-shadow:var(--ka-shadow-sm);color:var(--ka-text)}.ka-written-hero::after{content:"";position:absolute;width:170px;height:170px;right:-80px;bottom:-112px;border-radius:50%;background:color-mix(in srgb,var(--ka-primary) 10%,transparent);pointer-events:none}.ka-written-hero__intro{position:relative;z-index:1;display:flex;align-items:center;gap:13px;min-width:0}.ka-written-hero__icon{width:50px;height:50px;flex:0 0 50px;display:grid;place-items:center;border-radius:16px;background:var(--ka-primary);color:var(--ka-text-inverse);font-size:25px;font-weight:950;box-shadow:0 9px 20px color-mix(in srgb,var(--ka-primary) 22%,transparent)}.ka-written-hero__eyebrow{display:block;margin-bottom:3px;color:var(--ka-primary);font-size:9px;font-weight:900;letter-spacing:.1em}.ka-written-hero h2{margin:0;font-size:23px;line-height:1.1}.ka-written-hero p{margin:5px 0 0;color:var(--ka-text-muted);font-size:12px;line-height:1.45}.ka-written-add{position:relative;z-index:1;flex:0 0 auto;min-height:44px;border-radius:14px;box-shadow:0 9px 20px color-mix(in srgb,var(--ka-primary) 18%,transparent)}
.ka-written-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.ka-written-summary article{position:relative;overflow:hidden;min-height:82px;padding:13px 14px;border:1px solid var(--ka-border);border-radius:17px;background:var(--ka-card-bg);box-shadow:var(--ka-shadow-sm);display:flex;flex-direction:column;justify-content:center}.ka-written-summary article::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ka-primary)}.ka-written-summary article.is-soon::before{background:var(--ka-warning)}.ka-written-summary b{font-size:25px;line-height:1;color:var(--ka-text);font-variant-numeric:tabular-nums}.ka-written-summary article.is-soon b{color:var(--ka-warning)}.ka-written-summary article.is-today b{color:var(--ka-primary)}.ka-written-summary span{margin-top:7px;color:var(--ka-text-muted);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.04em}
.ka-written-register{display:grid;gap:10px}.ka-written-register__head{display:flex;align-items:end;justify-content:space-between;gap:12px;padding:2px 3px}.ka-written-register__head small{display:block;color:var(--ka-text-muted);font-size:9px;font-weight:850;letter-spacing:.08em}.ka-written-register__head h3{margin:2px 0 0;font-size:17px}.ka-written-register__head>span{color:var(--ka-text-muted);font-size:10px;font-weight:800}.ka-written-list{display:grid;gap:9px}.ka-written-card{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:start;padding:14px;border:1px solid var(--ka-border);border-radius:18px;background:var(--ka-card-bg);box-shadow:var(--ka-shadow-sm);transition:border-color var(--ka-transition-fast),box-shadow var(--ka-transition-fast),transform var(--ka-transition-fast)}.ka-written-card:hover{border-color:var(--ka-border-strong);box-shadow:var(--ka-shadow-md)}.ka-written-card.is-today{border-color:color-mix(in srgb,var(--ka-primary) 38%,var(--ka-border))}.ka-written-card.is-soon{border-color:color-mix(in srgb,var(--ka-warning) 34%,var(--ka-border))}.ka-written-card__icon{width:46px;height:46px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--ka-primary) 18%,var(--ka-border));border-radius:15px;background:var(--ka-primary-soft);color:var(--ka-primary);font-size:23px;font-weight:950}.ka-written-card__main{min-width:0}.ka-written-card__head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.ka-written-card__head>div{min-width:0}.ka-written-card__head strong{display:block;font-size:14px;line-height:1.35}.ka-written-card__head strong span{color:var(--ka-text-muted);font-weight:750}.ka-written-card__chips{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px}.ka-written-card__chips span{padding:4px 7px;border-radius:999px;background:var(--ka-primary-soft);color:var(--ka-primary);font-size:9px;font-weight:850}.ka-written-card__chips span+span{background:color-mix(in srgb,var(--ka-warning) 12%,var(--ka-card-bg));color:color-mix(in srgb,var(--ka-warning) 78%,var(--ka-text))}.ka-written-date{flex:0 0 auto;padding:6px 9px;border-radius:999px;background:var(--ka-muted-bg);color:var(--ka-text-muted);font-size:9px;font-weight:900}.ka-written-date.is-soon{background:color-mix(in srgb,var(--ka-warning) 13%,var(--ka-card-bg));color:var(--ka-warning)}.ka-written-date.is-today{background:var(--ka-primary-soft);color:var(--ka-primary)}.ka-written-card__line{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-top:9px;color:var(--ka-text-muted);font-size:10.5px;font-weight:700;line-height:1.45}.ka-written-card__line span+span::before{content:"•";display:inline-block;margin:0 7px;color:var(--ka-border-strong)}.ka-written-note{margin-top:10px;padding:9px 10px;border-left:3px solid var(--ka-warning);border-radius:0 10px 10px 0;background:color-mix(in srgb,var(--ka-warning) 8%,var(--ka-card-bg));color:var(--ka-text-muted);font-size:11px;line-height:1.45}.ka-written-card__actions{display:flex;justify-content:flex-start;margin-top:10px}.ka-written-card__actions .ka-btn{min-height:36px;border-radius:11px}.ka-written-empty{display:grid;gap:5px;padding:24px;text-align:center}.ka-written-empty span{color:var(--ka-text-muted);font-size:11px}
