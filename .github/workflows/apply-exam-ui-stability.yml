          css = sub_once(css, r'/\* DENEME AUTO TIMER — CANONICAL 2026 \*/.*?(?=\.ka-trial-add)', home_trial_css, 'dashboard trial css')
          p.write_text(css, encoding='utf-8')

          # ---------- PWA cache bump ----------
