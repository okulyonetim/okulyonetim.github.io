name: Run shell UX patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-shell-ux-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and run canonical patch
        shell: bash
        run: |
          awk '/python3 - <<'\''PY'\''/{flag=1;next} /^[[:space:]]+PY$/{if(flag){exit}} flag{sub(/^          /,"");print}' .github/workflows/apply-shell-ux-upgrade.yml > /tmp/shell_patch.py
          test -s /tmp/shell_patch.py
          python3 -c "from pathlib import Path;p=Path('/tmp/shell_patch.py');s=p.read_text(encoding='utf-8');s=s.replace('new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)','new, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)',1);s=s.replace('r\"function selectedSet\\(el\\)\\{.*?(?=function openTextQuickNote\\(\\))\"','r\"function selectedSet.*?(?=function openTextQuickNote)\"',1);p.write_text(s,encoding='utf-8')"
          python3 /tmp/shell_patch.py

      - name: Validate JavaScript and focused regressions
        shell: bash
        run: |
          node --check js/core/shell-ui.js
          node --test tests/quick-note-launcher.test.js tests/classic-shell-v2-smoke.test.js tests/sinav-islemleri-owner-rules.test.js tests/ders-programi-role-rules.test.js
          node scripts/check-client-architecture.mjs

      - name: Commit canonical changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-shell-ux-upgrade.yml .github/workflows/run-shell-ux-patch.yml
          git config user.name 'koruk-asistan-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/core/shell-ui.js .github/workflows/apply-shell-ux-upgrade.yml .github/workflows/run-shell-ux-patch.yml
          git commit -m 'feat: personalize profile search and navigation UX'
          git push origin HEAD:main
