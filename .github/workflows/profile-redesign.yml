name: Profile page redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-redesign.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6

      - name: Verify staged base
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="be38d2289792c1a9b91c6aade1ddae197d42877c"
          test "$(git rev-parse HEAD~3)" = "$EXPECTED"

      - name: Prepare patch helper
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/tmp-profile-redesign.py')
          s=p.read_text(encoding='utf-8')
          old='shell,count=pattern.subn(replacement,shell,count=1)'
          new="replacement=replacement.replace(chr(92)+chr(34),chr(34))\nshell,count=pattern.subn(lambda _m: replacement,shell,count=1)"
          if old not in s: raise SystemExit('shell replacement anchor missing')
          s=s.replace(old,new,1)
          old='css,count=profile_pattern.subn(profile_css,css,count=1)'
          new="profile_css=profile_css.replace(chr(92)+chr(34),chr(34))\ncss,count=profile_pattern.subn(lambda _m: profile_css,css,count=1)"
          if old not in s: raise SystemExit('css replacement anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

      - name: Apply profile redesign
        run: python scripts/tmp-profile-redesign.py

      - name: Validate profile and runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check js/core/shell-ui.js
          node --check service-worker.js
          node tests/profile-page-redesign.test.js
          node tests/trial-counter-scroll-stability.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node tests/web-mobile-engine-separation.test.js

      - name: Commit verified profile redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/shell-ui.js css/design-system.css index.html service-worker.js tests/profile-page-redesign.test.js tests/trial-counter-scroll-stability.test.js tests/classic-shell-v2-smoke.test.js
          git commit -m "feat: redesign profile page and improve contrast"
          git push origin main
