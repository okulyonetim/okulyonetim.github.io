name: Apply attendance scroll and schedule sync fix v2

on:
  push:
    branches:
      - fix/attendance-scroll-schedule-sync

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/attendance-scroll-schedule-sync
          fetch-depth: 0
      - name: Patch attendance from current main
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[attendance-sync-applied\]'; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/modules/tools.js'); s=p.read_text()
          pairs=[
          ("  _aktifIzinKaydi(izinKayitlari,ogretmenId,iso){return(izinKayitlari||[]).find(k=>k.ogretmenId===ogretmenId&&k.baslangic<=iso&&iso<=k.bitis)||null;},",
           "  _izinTarihAnahtari(v){if(!v)return'';if(typeof v==='string')return v.slice(0,10);if(v?.toDate)v=v.toDate();const d=v instanceof Date?v:new Date(v);if(Number.isNaN(d.getTime()))return'';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;},\n  _aktifIzinKaydi(izinKayitlari,ogretmenId,iso){return(izinKayitlari||[]).find(k=>{if(String(k.ogretmenId||k.personelId||'')!==String(ogretmenId||''))return false;const bas=this._izinTarihAnahtari(k.baslangicTarihi||k.baslangic),bit=this._izinTarihAnahtari(k.bitisTarihi||k.bitis)||bas;return !!bas&&bas<=iso&&iso<=bit})||null;},"),
          ("let mounted=false,active='checklists',unsubs=[],attendanceDate=new Date();",
           "let mounted=false,active='checklists',unsubs=[],attendanceDate=new Date(),attendanceScrollLeft=0;"),
          ("function attWeeklyHours(teacherId){const out={pzt:0,sal:0,car:0,per:0,cum:0};arr('dersProgrami').filter(d=>String(d.ogretmenId||'')===String(teacherId||'')).forEach(d=>{const key=ATT_DAY_KEYS[String(d.gun||'').trim()];if(key)out[key]++});return out}",
           "function attWeeklyHours(teacherId){const out={pzt:0,sal:0,car:0,per:0,cum:0};let rows=arr('dersProgrami').filter(d=>String(d.ogretmenId||'')===String(teacherId||''));const unique=global.KorukScheduleDataIntegrity?.dedupeRows?.(rows);if(Array.isArray(unique?.rows))rows=unique.rows;rows.forEach(d=>{const key=ATT_DAY_KEYS[String(d.gun||'').trim()];if(key)out[key]++});return out}"),
          ("async function attAutoRefresh(){const doc=monthDoc();if(!doc||!attCanEdit())return;if(!global.confirm?.('Elle değiştirilmemiş günler güncel izin, resmi tatil ve haftalık ders saatlerine göre yeniden hesaplanacak. Elle yaptığınız değişiklikler korunacak. Devam edilsin mi?'))return;const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1;try{for(const original of Object.values(doc.ogretmenler||{})){const o=structuredClone(original),fresh=global.DevamsizlikCizelgesiService.ogretmenAyiniOtomatikUret(o,y,m,arr('resmiTatiller'),arr('ogretmenIzinleri')),manual=o.elleGunler||{},merged={...(o.gunler||{})};for(const g of Object.keys(fresh))if(!manual[g])merged[g]=fresh[g];for(let g=1;g<=global.DevamsizlikCizelgesiService.gunSayisi(y,m);g++)if(!manual[g]&&!(g in fresh))delete merged[g];o.gunler=merged;await global.DevamsizlikCizelgesiService.ogretmenVerisiGuncelle(y,m,o.ogretmenId,o)}global.toast?.('Otomatik günler tazelendi.')}catch(e){global.toast?.(e?.message||'Otomatik doldurma başarısız.')}}",
           "async function attAutoRefresh(){const doc=monthDoc();if(!doc||!attCanEdit())return;if(!global.confirm?.('Elle değiştirilmemiş günler güncel izin, resmi tatil ve ders programına göre yeniden hesaplanacak. Elle yaptığınız değişiklikler korunacak. Devam edilsin mi?'))return;const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,teacherIds=new Set(arr('ogretmenler').map(t=>String(t.id||'')));try{for(const original of Object.values(doc.ogretmenler||{})){const o=structuredClone(original);if(teacherIds.has(String(o.ogretmenId||'')))o.haftalikSaatler=attWeeklyHours(o.ogretmenId);const fresh=global.DevamsizlikCizelgesiService.ogretmenAyiniOtomatikUret(o,y,m,arr('resmiTatiller'),arr('ogretmenIzinleri')),manual=o.elleGunler||{},merged={...(o.gunler||{})};for(const g of Object.keys(fresh))if(!manual[g])merged[g]=fresh[g];for(let g=1;g<=global.DevamsizlikCizelgesiService.gunSayisi(y,m);g++)if(!manual[g]&&!(g in fresh))delete merged[g];o.gunler=merged;await global.DevamsizlikCizelgesiService.ogretmenVerisiGuncelle(y,m,o.ogretmenId,o)}global.toast?.('Otomatik günler ders programından tazelendi.')}catch(e){global.toast?.(e?.message||'Otomatik doldurma başarısız.')}}"),
          ("function renderAttendance(){const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,doc=monthDoc(),teachers=attSortedTeachers(doc),content=document.getElementById('toolsContent'),count=document.getElementById('toolsCount');if(count)count.textContent=`${teachers.length} personel`;if(!content)return;content.innerHTML=`<section class=\"ka-stack ka-attendance-page\" data-attendance-page>${attToolbarHtml(doc,y,m)}${doc&&teachers.length?attTableHtml(doc,y,m,true)+attLegendHtml():`<div class=\"ka-card ka-attendance-empty\"><div class=\"ka-card__body ka-stack\"><strong>${ATT_MONTHS[m-1]} ${y} için henüz çizelge oluşturulmamış.</strong><span class=\"ka-muted\">Öğretmen listesinden otomatik oluşturabilir veya Excel dosyasından içe aktarabilirsiniz.</span>${attCanEdit()?'<button class=\"ka-btn\" type=\"button\" data-att-create>Öğretmen Listesinden Oluştur</button>':''}</div></div>`}</section>`;bindAttendance()}",
           "function renderAttendance(){const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,doc=monthDoc(),teachers=attSortedTeachers(doc),content=document.getElementById('toolsContent'),count=document.getElementById('toolsCount');if(count)count.textContent=`${teachers.length} personel`;if(!content)return;const oldGrid=content.querySelector('.ka-attendance-grid-wrap');if(oldGrid)attendanceScrollLeft=oldGrid.scrollLeft;content.innerHTML=`<section class=\"ka-stack ka-attendance-page\" data-attendance-page>${attToolbarHtml(doc,y,m)}${doc&&teachers.length?attTableHtml(doc,y,m,true)+attLegendHtml():`<div class=\"ka-card ka-attendance-empty\"><div class=\"ka-card__body ka-stack\"><strong>${ATT_MONTHS[m-1]} ${y} için henüz çizelge oluşturulmamış.</strong><span class=\"ka-muted\">Öğretmen listesinden otomatik oluşturabilir veya Excel dosyasından içe aktarabilirsiniz.</span>${attCanEdit()?'<button class=\"ka-btn\" type=\"button\" data-att-create>Öğretmen Listesinden Oluştur</button>':''}</div></div>`}</section>`;bindAttendance();const nextGrid=content.querySelector('.ka-attendance-grid-wrap');if(nextGrid){const restore=()=>{if(!nextGrid.isConnected)return;nextGrid.scrollLeft=Math.min(attendanceScrollLeft,Math.max(0,nextGrid.scrollWidth-nextGrid.clientWidth))};restore();global.requestAnimationFrame?.(restore)}}"),
          ("function bindAttendance(){const content=document.getElementById('toolsContent');if(!content)return;content.querySelector('[data-att-year]')?.addEventListener('change',e=>{attendanceDate=new Date(Number(e.target.value),attendanceDate.getMonth(),1);renderAttendance()});content.querySelector('[data-att-month]')?.addEventListener('change',e=>{attendanceDate=new Date(attendanceDate.getFullYear(),Number(e.target.value)-1,1);renderAttendance()});content.querySelector('[data-att-create]')?.addEventListener('click',attCreateMonth);content.querySelector('[data-att-auto]')?.addEventListener('click',attAutoRefresh);content.querySelector('[data-att-print]')?.addEventListener('click',attPrint);const file=content.querySelector('[data-att-file]');content.querySelector('[data-att-import]')?.addEventListener('click',()=>file?.click());file?.addEventListener('change',async e=>{const f=e.target.files?.[0];if(f)await attImportExcel(f);e.target.value=''});content.querySelectorAll('[data-att-cell]').forEach(b=>b.addEventListener('click',()=>openAttCellModal(b.dataset.attTeacher,Number(b.dataset.attDay))));content.querySelectorAll('[data-att-hours]').forEach(b=>b.addEventListener('click',()=>openAttHoursModal(b.dataset.attHours)));content.querySelectorAll('[data-att-note]').forEach(b=>b.addEventListener('click',()=>openAttNoteModal(b.dataset.attNote)))}",
           "function bindAttendance(){const content=document.getElementById('toolsContent');if(!content)return;const grid=content.querySelector('.ka-attendance-grid-wrap');grid?.addEventListener('scroll',()=>{attendanceScrollLeft=grid.scrollLeft},{passive:true});content.querySelector('[data-att-year]')?.addEventListener('change',e=>{attendanceScrollLeft=0;attendanceDate=new Date(Number(e.target.value),attendanceDate.getMonth(),1);renderAttendance()});content.querySelector('[data-att-month]')?.addEventListener('change',e=>{attendanceScrollLeft=0;attendanceDate=new Date(attendanceDate.getFullYear(),Number(e.target.value)-1,1);renderAttendance()});content.querySelector('[data-att-create]')?.addEventListener('click',attCreateMonth);content.querySelector('[data-att-auto]')?.addEventListener('click',attAutoRefresh);content.querySelector('[data-att-print]')?.addEventListener('click',attPrint);const file=content.querySelector('[data-att-file]');content.querySelector('[data-att-import]')?.addEventListener('click',()=>file?.click());file?.addEventListener('change',async e=>{const f=e.target.files?.[0];if(f)await attImportExcel(f);e.target.value=''});content.querySelectorAll('[data-att-cell]').forEach(b=>b.addEventListener('click',()=>openAttCellModal(b.dataset.attTeacher,Number(b.dataset.attDay))));content.querySelectorAll('[data-att-hours]').forEach(b=>b.addEventListener('click',()=>openAttHoursModal(b.dataset.attHours)));content.querySelectorAll('[data-att-note]').forEach(b=>b.addEventListener('click',()=>openAttNoteModal(b.dataset.attNote)))}")]
          for old,new in pairs:
            if old not in s: raise SystemExit('Source block not found: '+old[:90])
            s=s.replace(old,new,1)
          p.write_text(s)
          sw=Path('service-worker.js'); w=sw.read_text()
          if "const CACHE_ADI='oy-cache-v933';" not in w: raise SystemExit('Expected cache v933 not found')
          sw.write_text(w.replace("const CACHE_ADI='oy-cache-v933';","const CACHE_ADI='oy-cache-v934';",1))
          Path('tests/attendance-schedule-scroll-regression.test.js').write_text("""const fs=require('fs');const assert=require('assert');const src=fs.readFileSync('js/modules/tools.js','utf8');const sw=fs.readFileSync('service-worker.js','utf8');new Function(src);assert(src.includes('o.haftalikSaatler=attWeeklyHours(o.ogretmenId)'));assert(src.includes('KorukScheduleDataIntegrity?.dedupeRows?.(rows)'));assert(src.includes('attendanceScrollLeft=oldGrid.scrollLeft'));assert(src.includes('nextGrid.scrollLeft=Math.min(attendanceScrollLeft'));assert(src.includes("addEventListener('scroll',()=>{attendanceScrollLeft=grid.scrollLeft}"));assert(src.includes('k.baslangicTarihi||k.baslangic')&&src.includes('k.bitisTarihi||k.bitis'));assert(sw.includes("const CACHE_ADI='oy-cache-v934';"));console.log('Attendance schedule/scroll regression OK');\n""")
          PY
          node tests/attendance-schedule-scroll-regression.test.js
          node tests/tools-attendance-v2-smoke.test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/modules/tools.js service-worker.js tests/attendance-schedule-scroll-regression.test.js
          git commit -m 'fix: sync attendance from lesson schedule and preserve scroll [attendance-sync-applied]'
          git push origin HEAD:fix/attendance-scroll-schedule-sync
