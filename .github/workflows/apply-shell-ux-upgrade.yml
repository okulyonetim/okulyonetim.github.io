name: Apply shell UX upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-shell-ux-upgrade.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply shell UX upgrade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical shell UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/core/shell-ui.js')
          text = path.read_text(encoding='utf-8')

          def sub_once(pattern, replacement, label):
              global text
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')
              text = new

          old_same = "function sameView(a,b){return !!a&&!!b&&a.kind===b.kind&&a.name===b.name&&a.bottom===b.bottom&&a.page===b.page&&a.title===b.title}"
          new_same = "function sameView(a,b){return !!a&&!!b&&a.kind===b.kind&&a.name===b.name&&a.bottom===b.bottom&&a.page===b.page&&a.title===b.title&&a.section===b.section}"
          if old_same not in text:
              raise SystemExit('sameView contract not found')
          text = text.replace(old_same, new_same, 1)

          profile_block = r'''function linkedTeacher(){const u=user(),id=u.bagliOgretmenId||u.ogretmenId;return id?arr('ogretmenler').find(x=>String(x.id)===String(id))||null:null}
function teacherProfileId(){const u=user(),t=linkedTeacher();return String(u.bagliOgretmenId||u.ogretmenId||t?.id||'')}
function profileInfo(){const u=user(),t=linkedTeacher(),name=t?[t.ad,t.soyad].filter(Boolean).join(' '):profileName(u),role=t?.brans||profileRole(u),photo=t?.profilFotoUrl||t?.fotoUrl||u.profilFotoUrl||u.fotoUrl||'',username=u.kullaniciAdi?`@${u.kullaniciAdi}`:(u.email||''),phone=t?.telefon||u.telefon||'',email=t?.eposta||t?.email||u.email||'';return{u,t,name,role,photo,username,phone,email}}
const PROFILE_TASK_TYPES=[['sosyalKulupler','Sosyal Kulüpler','♡'],['sok','ŞÖK','🛡️'],['zumre','Zümre','👥'],['belirliGunler','Belirli Gün & Haftalar','📅'],['rehberlik','Rehberlik','🧭'],['maarifRapor','Maarif Model','🏅'],['bepPlani','Yıllık / BEP Planı','📋'],['digerEvrak','Diğer Evraklar','📁']];
const PROFILE_DAY_ORDER=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
function profileDate(v){if(!v)return'';try{const d=v?.toDate?v.toDate():new Date(String(v).length===10?`${v}T00:00:00`:v);return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short',year:'numeric'})}catch(_){return String(v)}}
function profileTeacherIds(row){const ids=[];if(row?.ogretmenId)ids.push(row.ogretmenId);if(row?.sorumluOgretmenId)ids.push(row.sorumluOgretmenId);for(const k of ['ogretmenIdler','sorumluOgretmenIdler'])if(Array.isArray(row?.[k]))ids.push(...row[k]);return [...new Set(ids.filter(Boolean).map(String))]}
function profileTaskTitle(type,row){if(type==='sosyalKulupler')return row.ad||row.kulupAdi||'Sosyal Kulüp';if(type==='zumre')return row.ad||row.brans||row.konu||'Zümre';if(type==='sok')return row.ad||row.sinif||row.konu||'ŞÖK';if(type==='bepPlani')return row.ogrenciAdi||row.ad||row.brans||'Yıllık / BEP Planı';if(type==='rehberlik')return row.ad||row.sinif||row.konu||'Rehberlik';if(type==='maarifRapor')return row.ad||row.ders||row.sinif||'Maarif Model';if(type==='belirliGunler')return row.ad||row.baslik||row.konu||'Belirli Gün / Hafta';return row.ad||row.baslik||row.konu||'Kayıt'}
function profileTaskMeta(row){return [row.brans,row.sinif,row.ders,row.tarih||row.baslangicTarihi||row.baslangic].filter(Boolean).map(String).join(' · ')}
function profileOwnTasks(){const tid=teacherProfileId();if(!tid)return[];const out=[];for(const [type,label,icon] of PROFILE_TASK_TYPES)for(const row of arr(type)){if(profileTeacherIds(row).includes(tid))out.push({type,label,icon,row,title:profileTaskTitle(type,row),meta:profileTaskMeta(row)})}return out.sort((a,b)=>String(a.label).localeCompare(String(b.label),'tr',{sensitivity:'base'})||String(a.title).localeCompare(String(b.title),'tr',{sensitivity:'base'}))}
function profileOwnExams(){const uid=String(user().uid||'');if(!uid)return[];const own=x=>String(x?.sahipUid||x?.olusturanUid||x?.olusturanKullaniciId||'')===uid;return [...arr('sinavlar').filter(own).map(x=>({...x,__kind:'Yazılı'})),...arr('denemeSinavlari').filter(own).map(x=>({...x,__kind:'Deneme'}))].sort((a,b)=>String(b.tarih||b.sinavTarihi||'').localeCompare(String(a.tarih||a.sinavTarihi||''))||String(a.ders||a.baslik||'').localeCompare(String(b.ders||b.baslik||''),'tr',{sensitivity:'base'}))}
function renderProfile({remember=true}={}){closeHeaderPopover();closeMenu();setBottomActive('profile');if(remember)rememberView({kind:'profile'});setTitle('Profilim');const {u,t,name,role,photo,phone,email}=profileInfo(),root=$('#v2ModuleRoot');if(!root)return;const initials=name.split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toLocaleUpperCase('tr'),tid=teacherProfileId();root.innerHTML=`<section class="ka-profile-page"><article class="ka-card"><div class="ka-card__body ka-stack"><div class="ka-row"><span class="ka-avatar">${photo?`<img src="${esc(photo)}" alt="${esc(name)}">`:esc(initials||'K')}</span><div class="ka-grow"><span class="ka-badge">ÖĞRETMEN PROFİLİ</span><h2>${esc(name)}</h2><p class="ka-muted">${esc(role)}</p></div></div><div class="ka-row ka-wrap">${phone?`<span class="ka-badge">☎ ${esc(phone)}</span>`:''}${email?`<span class="ka-badge">✉ ${esc(email)}</span>`:''}${tid?'<span class="ka-badge ka-badge--success">Öğretmen hesabı bağlı</span>':'<span class="ka-badge ka-badge--warning">Öğretmen bağlantısı yok</span>'}</div></div></article><div class="ka-row ka-row--between"><div><h3>Kişisel Alanım</h3><p class="ka-muted">Buradaki ekranlar yalnızca bağlı öğretmene ait kayıtları gösterir.</p></div></div><div class="ka-profile-grid"><button type="button" data-profile-section="schedule">📅<span>Ders Programım</span></button><button type="button" data-profile-section="duty">🛡️<span>Nöbetlerim</span></button><button type="button" data-profile-section="exams">📝<span>Sınavlarım</span></button><button type="button" data-profile-section="tasks">🗂️<span>Diğer Görevlerim</span></button></div><article class="ka-card"><div class="ka-card__body"><p class="ka-muted">Ders programı ve nöbetler öğretmen kimliğine; sınavlar oluşturan kullanıcıya; ŞÖK, zümre, belirli gün ve haftalar, rehberlik, Maarif Model ve yıllık/BEP kayıtları ise öğretmen atamasına göre süzülür.</p></div></article><button type="button" class="ka-logout-button" data-profile-logout>↪ Oturumu Kapat</button></section>`;$$('[data-profile-section]',root).forEach(b=>b.addEventListener('click',()=>renderProfileSection(b.dataset.profileSection)));root.querySelector('[data-profile-logout]')?.addEventListener('click',()=>global.cikisYap?.())}
function profileSectionTop(title,subtitle){return`<div class="ka-row"><button type="button" class="ka-icon-button" data-profile-back aria-label="Profile dön">${SVG.back}</button><div class="ka-grow"><h2>${esc(title)}</h2><p class="ka-muted">${esc(subtitle)}</p></div></div>`}
function profileScheduleHtml(){const tid=teacherProfileId();if(!tid)return'<div class="ka-empty">Bu hesaba bağlı öğretmen bulunamadı.</div>';const rows=arr('dersProgrami').filter(x=>String(x.ogretmenId||'')===tid).sort((a,b)=>{const ai=PROFILE_DAY_ORDER.indexOf(a.gun),bi=PROFILE_DAY_ORDER.indexOf(b.gun);return(ai<0?99:ai)-(bi<0?99:bi)||(Number(a.saat)||0)-(Number(b.saat)||0)||String(a.ders||'').localeCompare(String(b.ders||''),'tr',{sensitivity:'base'})});if(!rows.length)return'<div class="ka-empty">Bu öğretmene ait ders programı kaydı bulunamadı.</div>';const groups=new Map();for(const r of rows){const k=r.gun||'Diğer';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}return[...groups.entries()].map(([gun,list])=>`<article class="ka-card"><div class="ka-card__header ka-row ka-row--between"><strong>${esc(gun)}</strong><span class="ka-badge">${list.length} ders</span></div><div class="ka-card__body ka-stack">${list.map(r=>`<div class="ka-row ka-row--between"><div><strong>${Number(r.saat)||'—'}. Ders · ${esc(r.ders||'Ders')}</strong><div class="ka-muted">${esc(r.sinif||'Sınıf belirtilmemiş')}</div></div></div>`).join('')}</div></article>`).join('')}
function profileDutyHtml(){const tid=teacherProfileId();if(!tid)return'<div class="ka-empty">Bu hesaba bağlı öğretmen bulunamadı.</div>';const yerler=new Map(arr('nobetYerleri').map(x=>[String(x.id),x.ad||'Nöbet Yeri'])),today=new Date().toISOString().slice(0,10),rows=arr('nobetAtamalari').filter(x=>String(x.ogretmenId||'')===tid).sort((a,b)=>{const af=String(a.tarih||'')>=today,bf=String(b.tarih||'')>=today;if(af!==bf)return af?-1:1;return af?String(a.tarih||'').localeCompare(String(b.tarih||'')):String(b.tarih||'').localeCompare(String(a.tarih||''))});if(!rows.length)return'<div class="ka-empty">Bu öğretmene ait nöbet kaydı bulunamadı.</div>';return rows.slice(0,80).map(r=>`<article class="ka-card ka-list-card"><div class="ka-card__body ka-row ka-row--between"><div><strong>${esc(profileDate(r.tarih)||'Tarih yok')}</strong><div class="ka-muted">${esc(yerler.get(String(r.yerId))||r.yerAdi||'Nöbet yeri')}</div></div>${String(r.tarih||'')>=today?'<span class="ka-badge ka-badge--success">Yaklaşan</span>':'<span class="ka-badge">Geçmiş</span>'}</div></article>`).join('')}
function profileExamHtml(){const rows=profileOwnExams();if(!rows.length)return'<div class="ka-empty">Bu kullanıcı tarafından oluşturulmuş sınav bulunamadı.</div>';return rows.map(r=>{const title=r.sinavAdi||r.baslik||r.ders||`${r.__kind} Sınavı`,meta=[r.ders,r.sinif,Array.isArray(r.siniflar)?r.siniflar.join(', '):'',profileDate(r.tarih||r.sinavTarihi)].filter(Boolean).join(' · ');return`<article class="ka-card ka-list-card"><div class="ka-card__body ka-row"><span class="ka-avatar">${r.__kind==='Deneme'?'🧪':'📝'}</span><div class="ka-grow"><strong>${esc(title)}</strong><div class="ka-muted">${esc(meta||r.__kind)}</div></div><span class="ka-badge">${esc(r.__kind)}</span></div></article>`}).join('')}
function profileTasksHtml(){const rows=profileOwnTasks();if(!rows.length)return'<div class="ka-empty">Bu öğretmene atanmış ŞÖK, zümre, belirli gün/hafta, rehberlik, Maarif Model veya yıllık/BEP kaydı bulunamadı.</div>';const groups=new Map();for(const x of rows){if(!groups.has(x.label))groups.set(x.label,[]);groups.get(x.label).push(x)}return[...groups.entries()].map(([label,list])=>`<article class="ka-card"><div class="ka-card__header ka-row ka-row--between"><strong>${esc(label)}</strong><span class="ka-badge">${list.length}</span></div><div class="ka-card__body ka-stack">${list.map(x=>`<div class="ka-row"><span class="ka-avatar">${x.icon}</span><div class="ka-grow"><strong>${esc(x.title)}</strong>${x.meta?`<div class="ka-muted">${esc(x.meta)}</div>`:''}</div></div>`).join('')}</div></article>`).join('')}
function renderProfileSection(kind,{remember=true}={}){closeHeaderPopover();closeMenu();setBottomActive('profile');if(remember)rememberView({kind:'profile-section',section:kind});const root=$('#v2ModuleRoot');if(!root)return;const cfg={schedule:['Ders Programım','Yalnızca öğretmenin kendi dersleri',profileScheduleHtml],duty:['Nöbetlerim','Yalnızca öğretmenin kendi nöbet atamaları',profileDutyHtml],exams:['Sınavlarım','Yalnızca bu kullanıcı tarafından oluşturulan sınavlar',profileExamHtml],tasks:['Diğer Görevlerim','Öğretmene atanmış kişisel çizelge ve görev kayıtları',profileTasksHtml]}[kind]||['Profilim','Kişisel alan',()=>'<div class="ka-empty">Bölüm bulunamadı.</div>'];setTitle(cfg[0]);root.innerHTML=`<section class="ka-page ka-stack">${profileSectionTop(cfg[0],cfg[1])}${cfg[2]()}</section>`;root.querySelector('[data-profile-back]')?.addEventListener('click',()=>{if(navStack.length>1)navStack.pop();renderProfile({remember:false})})}'''
          sub_once(r"function linkedTeacher\(\)\{.*?(?=function currentTheme\(\))", profile_block + "\n", 'profile block')

          search_block = r'''function searchPressedSet(root,name){return new Set($$(`[data-search-filter="${name}"][aria-pressed="true"]`,root).map(b=>b.dataset.searchValue).filter(Boolean))}
function searchFilterState(root){return{category:root.querySelector('[data-search-category][aria-pressed="true"]')?.dataset.searchCategory||'all',classes:searchPressedSet(root,'classes'),services:searchPressedSet(root,'services'),clubs:searchPressedSet(root,'clubs'),gender:root.querySelector('[data-search-gender][aria-pressed="true"]')?.dataset.searchGender||''}}
function searchRows(q,f={category:'all',classes:new Set(),services:new Set(),clubs:new Set(),gender:''}){const n=norm(q),rows=[],category=f.category||'all',advanced=!!(f.classes?.size||f.services?.size||f.clubs?.size||f.gender),accept=(cat,hay)=>!advanced&&(category==='all'||category===cat)&&(!n||norm(hay).includes(n)),studentAccept=(x,hay)=>{if(category!=='all'&&category!=='student')return false;if(f.classes?.size&&!f.classes.has(String(x.sinifId||'')))return false;if(f.services?.size&&!f.services.has(String(x.servisId||'')))return false;if(f.clubs?.size&&!f.clubs.has(String(x.kulupId||'')))return false;if(f.gender&&norm(x.cinsiyet)!==norm(f.gender))return false;return!n||norm(hay).includes(n)},push=(cat,type,icon,title,meta,route,page,hay)=>{if(accept(cat,hay)&&pageAllowed(route,page))rows.push({type,icon,title,meta,route,page})};for(const x of arr('ogretmenler')){const title=x.adSoyad||[x.ad,x.soyad].filter(Boolean).join(' ')||'Öğretmen';push('teacher','Öğretmen','👩‍🏫',title,x.brans||x.unvan||'','people','teachers',`${title} ${x.brans||''} ${x.unvan||''} ${x.telefon||''} ${x.email||x.eposta||''}`)}const classes=arr('siniflar'),services=arr('servisler'),clubs=arr('sosyalKulupler');for(const x of arr('veliler')){const title=x.ogrenciAdi||x.adSoyad||x.ad||'Öğrenci',sinif=classes.find(s=>String(s.id)===String(x.sinifId)),servis=services.find(s=>String(s.id)===String(x.servisId)),kulup=clubs.find(k=>String(k.id)===String(x.kulupId)),meta=[sinif?.ad,x.cinsiyet,x.veliAdi,servis?.guzergah||servis?.servisAdi,kulup?.ad].filter(Boolean).join(' · '),hay=`${title} ${meta} ${x.telefon||x.telefon1||''} ${x.ogrenciNo||''}`;if(studentAccept(x,hay))rows.push({type:'Öğrenci',icon:'👨‍🎓',title,meta,route:'people',page:'students'})}for(const x of arr('personel')){const title=x.adSoyad||[x.ad,x.soyad].filter(Boolean).join(' ')||'Personel';push('staff','Personel','🧑‍💼',title,x.gorev||x.unvan||'','management','staff',`${title} ${x.gorev||''} ${x.unvan||''} ${x.telefon||''} ${x.tc||''}`)}for(const x of services){const title=x.guzergah||x.servisAdi||x.plaka||'Servis',meta=[x.plaka,x.soforAdi].filter(Boolean).join(' · ');push('service','Servis','🚌',title,meta,'transport','services',`${title} ${meta} ${x.telefon||x.soforTelefon||''}`)}for(const x of arr('evrakTakibi')){const title=x.evrakAdi||x.baslik||x.konu||'Evrak';push('document','Evrak','📄',title,x.durum||'','documents','evrak',`${title} ${x.durum||''} ${x.tur||''} ${x.aciklama||''}`)}for(const x of arr('notlar')){const title=x.baslik||'Not',meta=String(x.icerik||'').slice(0,90);push('note','Not','📝',title,meta,'communication','notes',`${title} ${x.icerik||''} ${(x.etiketler||[]).join?.(' ')||''}`)}for(const [type,label,icon,route,page] of SEARCH_CHART_TYPES)for(const x of arr(type)){const title=x.ad||x.baslik||x.isAdi||x.konu||label,meta=[label,x.tarih||x.baslangic||x.bitis].filter(Boolean).join(' · ');push('chart',label,icon,title,meta,route,page,`${title} ${meta} ${x.aciklama||x.not||''}`)}return rows.sort((a,b)=>String(a.title||'').localeCompare(String(b.title||''),'tr',{sensitivity:'base'})||String(a.type||'').localeCompare(String(b.type||''),'tr',{sensitivity:'base'})).slice(0,160)}
function renderSearchResults(root,q){const out=root.querySelector('[data-shell-search-results]'),count=root.querySelector('[data-search-count]'),rows=searchRows(q,searchFilterState(root));if(count)count.textContent=`${rows.length} sonuç`;if(!out)return;out.innerHTML=rows.length?rows.map((r,i)=>`<button type="button" class="ka-card ka-search-result" data-search-result="${i}"><span aria-hidden="true">${r.icon}</span><div class="ka-grow"><div class="ka-row ka-row--between"><strong>${esc(r.title)}</strong><span class="ka-badge">Aç</span></div><div class="ka-row"><small class="ka-muted">${esc([r.type,r.meta].filter(Boolean).join(' · '))}</small></div></div></button>`).join(''):'<div class="ka-empty">Eşleşen kayıt bulunamadı.</div>';$$('[data-search-result]',out).forEach(b=>b.addEventListener('click',()=>{const r=rows[Number(b.dataset.searchResult)];if(r)routeModule(r.route,{bottom:'menu',page:r.page||'',title:r.type})}))}
function searchFilterButtons(name,items){return items.length?items.map(x=>`<button type="button" class="ka-tab" data-search-filter="${name}" data-search-value="${esc(String(x.value))}" aria-pressed="false">${esc(x.label)}</button>`).join(''):'<span class="ka-muted">Kayıt yok</span>'}
function renderSearch({remember=true}={}){closeHeaderPopover();closeMenu();setBottomActive('search');if(remember)rememberView({kind:'search'});setTitle('Arama');const root=$('#v2ModuleRoot');if(!root)return;const classes=[...arr('siniflar')].sort((a,b)=>String(a.ad||'').localeCompare(String(b.ad||''),'tr',{sensitivity:'base'})),services=[...arr('servisler')].sort((a,b)=>String(a.guzergah||a.servisAdi||'').localeCompare(String(b.guzergah||b.servisAdi||''),'tr',{sensitivity:'base'})),clubs=[...arr('sosyalKulupler')].sort((a,b)=>String(a.ad||'').localeCompare(String(b.ad||''),'tr',{sensitivity:'base'}));root.innerHTML=`<section class="ka-search-page"><div><h2>Arama</h2><p class="ka-muted">Tüm kayıtlarda ara</p></div><div class="ka-search-box">${SVG.search}<input type="search" data-shell-search-input placeholder="İsim, sınıf, telefon, servis, evrak…" autocomplete="off" aria-label="Tüm kayıtlarda ara"></div><div class="ka-tabs" data-search-categories role="group" aria-label="Arama kategorileri">${SEARCH_CATEGORIES.map(([k,l],i)=>`<button type="button" class="ka-tab ${i===0?'active':''}" data-search-category="${k}" aria-pressed="${i===0?'true':'false'}">${l}</button>`).join('')}</div><details class="ka-card" data-search-advanced><summary class="ka-card__body ka-row ka-row--between"><strong>⚙️ Gelişmiş Filtreler</strong><span class="ka-badge" data-search-filter-count>Filtre yok</span></summary><div class="ka-card__body ka-stack"><div class="ka-stack"><span class="ka-field__label">Sınıflar</span><div class="ka-row ka-wrap">${searchFilterButtons('classes',classes.map(x=>({value:x.id,label:x.ad||'Sınıf'})))}</div></div><div class="ka-stack"><span class="ka-field__label">Servisler</span><div class="ka-row ka-wrap">${searchFilterButtons('services',services.map(x=>({value:x.id,label:x.guzergah||x.servisAdi||x.plaka||'Servis'})))}</div></div><div class="ka-stack"><span class="ka-field__label">Sosyal Kulüpler</span><div class="ka-row ka-wrap">${searchFilterButtons('clubs',clubs.map(x=>({value:x.id,label:x.ad||'Kulüp'})))}</div></div><div class="ka-stack"><span class="ka-field__label">Cinsiyet</span><div class="ka-tabs" role="group" aria-label="Cinsiyet filtresi"><button type="button" class="ka-tab active" data-search-gender="" aria-pressed="true">Tümü</button><button type="button" class="ka-tab" data-search-gender="Kız" aria-pressed="false">Kız</button><button type="button" class="ka-tab" data-search-gender="Erkek" aria-pressed="false">Erkek</button></div></div><div class="ka-row ka-wrap"><button type="button" class="ka-btn ka-btn--secondary ka-btn--sm" data-search-reset>Filtreleri Sıfırla</button><button type="button" class="ka-btn ka-btn--secondary ka-btn--sm" data-search-print>🖨️ Yazdır</button></div></div></details><div class="ka-row ka-row--between"><strong>Arama Sonuçları</strong><span class="ka-badge" data-search-count></span></div><div class="ka-stack" data-shell-search-results></div></section>`;const input=root.querySelector('[data-shell-search-input]'),updateBadge=()=>{const f=searchFilterState(root),n=f.classes.size+f.services.size+f.clubs.size+(f.gender?1:0),b=root.querySelector('[data-search-filter-count]');if(b)b.textContent=n?`${n} filtre`:'Filtre yok'},refresh=()=>{updateBadge();renderSearchResults(root,input?.value||'')};input?.addEventListener('input',refresh);$$('[data-search-category]',root).forEach(b=>b.addEventListener('click',()=>{$$('[data-search-category]',root).forEach(x=>{const on=x===b;x.setAttribute('aria-pressed',on?'true':'false');x.classList.toggle('active',on)});refresh()}));$$('[data-search-filter]',root).forEach(b=>b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on?'true':'false');b.classList.toggle('active',on);refresh()}));$$('[data-search-gender]',root).forEach(b=>b.addEventListener('click',()=>{$$('[data-search-gender]',root).forEach(x=>{const on=x===b;x.setAttribute('aria-pressed',on?'true':'false');x.classList.toggle('active',on)});refresh()}));root.querySelector('[data-search-reset]')?.addEventListener('click',()=>{$$('[data-search-filter]',root).forEach(x=>{x.setAttribute('aria-pressed','false');x.classList.remove('active')});$$('[data-search-gender]',root).forEach(x=>{const on=!x.dataset.searchGender;x.setAttribute('aria-pressed',on?'true':'false');x.classList.toggle('active',on)});refresh()});root.querySelector('[data-search-print]')?.addEventListener('click',()=>window.print());refresh()}
function closeQuickNote(){document.getElementById('kaQuickNoteModal')?.remove();requestAnimationFrame(()=>{if(!document.getElementById('kaQuickNoteModal')&&!document.querySelector('#kaMenuLayer.open'))document.body.classList.remove('ka-layer-open')})}
function quickNoteCloseAndRestore(){const back=global.__kaQuickNoteReturnAction||'home';closeQuickNote();setBottomActive(back);global.__kaQuickNoteReturnAction=''}'''
          sub_once(r"function selectedSet\(el\)\{.*?(?=function openTextQuickNote\(\))", search_block + "\n", 'search and quick-note close block')

          quick_launcher = r'''function openQuickNote(){closeHeaderPopover();closeMenu();global.__kaQuickNoteReturnAction=activeAction&&activeAction!=='note'?activeAction:'home';setBottomActive('note');closeQuickNote();const ov=document.createElement('div');ov.id='kaQuickNoteModal';ov.className='ka-modal-backdrop ka-sheet-backdrop';ov.innerHTML=`<section class="ka-modal ka-quick-note ka-quick-note-launcher"><div class="ka-modal__header"><div><h3>Hızlı Not</h3><p class="ka-muted">Ne eklemek istiyorsunuz?</p></div><button type="button" class="ka-icon-button" data-note-close aria-label="Kapat">${SVG.close}</button></div><div class="ka-modal__body"><div class="ka-quick-note-grid"><button type="button" data-quick-kind="text"><span>📝</span><strong>Metin Notu</strong><small>Başlık ve metin</small></button><button type="button" data-quick-kind="check"><span>☑️</span><strong>Yapılacaklar</strong><small>Kontrol edilebilir görev listesi</small></button><button type="button" data-quick-kind="draw"><span>✏️</span><strong>Çizim</strong><small>El yazısı ve serbest çizim</small></button><button type="button" data-quick-kind="image"><span>🖼️</span><strong>Görsel Not</strong><small>Fotoğraf ve açıklama</small></button><button type="button" data-quick-kind="table"><span>▦</span><strong>Tablo Notu</strong><small>Satır ve sütunlarla kayıt</small></button></div><button type="button" class="ka-quick-note-all" data-quick-kind="all"><span>📚</span><div><strong>Notlarımı Görüntüle</strong><small>Tüm notlarınıza ulaşın</small></div><b>›</b></button></div></section>`;document.body.appendChild(ov);document.body.classList.add('ka-layer-open');ov.querySelector('[data-note-close]')?.addEventListener('click',quickNoteCloseAndRestore);ov.querySelector('[data-quick-kind="text"]')?.addEventListener('click',openTextQuickNote);ov.querySelector('[data-quick-kind="check"]')?.addEventListener('click',openChecklistQuickNote);ov.querySelector('[data-quick-kind="draw"]')?.addEventListener('click',openDrawingQuickNote);ov.querySelector('[data-quick-kind="image"]')?.addEventListener('click',openImageQuickNote);ov.querySelector('[data-quick-kind="table"]')?.addEventListener('click',openTableQuickNote);ov.querySelector('[data-quick-kind="all"]')?.addEventListener('click',()=>{quickNoteCloseAndRestore();routeModule('communication',{bottom:'menu',page:'notes',title:'Notlarım'})})}'''
          sub_once(r"function openQuickNote\(\)\{.*?(?=function home\(\{remember=true\}=\{\}\))", quick_launcher + "\n", 'quick note launcher')

          old_restore = "function restoreView(view){if(!view)return false;if(view.kind==='profile'){renderProfile({remember:false});return true}if(view.kind==='search'){renderSearch({remember:false});return true}if(view.kind==='route')return routeModule(view.name,{bottom:view.bottom||'menu',page:view.page||'',title:view.title||'',remember:false});return false}"
          new_restore = "function restoreView(view){if(!view)return false;if(view.kind==='profile'){renderProfile({remember:false});return true}if(view.kind==='profile-section'){renderProfileSection(view.section,{remember:false});return true}if(view.kind==='search'){renderSearch({remember:false});return true}if(view.kind==='route')return routeModule(view.name,{bottom:view.bottom||'menu',page:view.page||'',title:view.title||'',remember:false});return false}"
          if old_restore not in text:
              raise SystemExit('restoreView contract not found')
          text = text.replace(old_restore, new_restore, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript and focused regressions
        shell: bash
        run: |
          node --check js/core/shell-ui.js
          node --test tests/quick-note-launcher.test.js tests/classic-shell-v2-smoke.test.js tests/sinav-islemleri-owner-rules.test.js tests/ders-programi-role-rules.test.js
          node scripts/check-client-architecture.mjs

      - name: Commit canonical changes and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-shell-ux-upgrade.yml
          git config user.name 'koruk-asistan-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/core/shell-ui.js .github/workflows/apply-shell-ux-upgrade.yml
