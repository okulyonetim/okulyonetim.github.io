name: Fix PDF route
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch PDF route
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/core/shell-ui.js')
          s = p.read_text(encoding='utf-8')
          anchor = "  if(name==='documents'&&page==='evrak'&&global.EvrakTakipPage?.open){"
          block = """  if(name==='documents'&&(page==='pdf-images'||page==='pdf-merge')&&global.ReportEngine?.openPdfTools){
    global.DocumentsModule?.unmount?.();
    if(title)setTitle(title);
    try{
      global.ReportEngine.openPdfTools(page==='pdf-merge'?'merge':'images');
      if(remember)rememberView({kind:'route',name,bottom,page,title:title||meta.label||name,parentMenu});
      return true;
    }catch(e){
      console.error('[Shell/pdf-tools]',e);
      global.toast?.('PDF aracı açılamadı.');
      return false;
    }
  }
"""
          if block.strip() not in s:
              if anchor not in s:
                  raise SystemExit('PDF route anchor not found')
              p.write_text(s.replace(anchor, block + anchor, 1), encoding='utf-8')
      - name: Validate
        run: node --check js/core/shell-ui.js
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/shell-ui.js
          git diff --cached --quiet || git commit -m "fix: open PDF tools directly"
          git push