name: Restore visual bus seating editor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-bus-seating-editor-once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore editor
        run: python3 .github/scripts/restore_bus_seating.py
      - name: Verify focused contracts
        run: |
          node --check js/modules/transport.js
          node tests/transport-seating-visual-editor.test.js
          node tests/transport-separate-pages.test.js
          node tests/transport-concept-redesign.test.js
          node tests/transport-mobile-layout-v3.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node scripts/build-client-bundles.mjs
          node tests/module-bundles-smoke.test.js
      - name: Commit canonical restore
        run: |
          rm .github/workflows/restore-bus-seating-editor-once.yml .github/scripts/restore_bus_seating.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/transport.js css/design-system.css tests/transport-seating-visual-editor.test.js service-worker.js .github/workflows/restore-bus-seating-editor-once.yml .github/scripts/restore_bus_seating.py
          git commit -m 'fix: restore visual bus seating editor'
          git push origin HEAD:main
