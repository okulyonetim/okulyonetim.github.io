name: migrate-lazy-optional-tools
on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-lazy-optional-tools.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Move optional tools out of startup path
        run: python scripts/migrate-lazy-optional-tools.py
      - name: Syntax checks
        run: |
          node --check js/app-loader.js
          node --check js/core/shell-ui.js
          node --check js/modules/assistant.js
          node --check js/modules/payroll-change.js
          node --check js/modules/legislation.js
          node --check js/modules/legislation-ui.js
          node --check js/modules/rubric-settings.js
          node --check js/modules/rubric-tools.js
      - name: Shell and architecture checks
        run: |
          node tests/classic-shell-v2-smoke.test.js
          node tests/dashboard-card-routes-smoke.test.js
          node scripts/check-client-architecture.mjs
      - name: Cleanup temporary migration files
        run: rm -f scripts/migrate-lazy-optional-tools.py .github/workflows/migrate-lazy-optional-tools.yml
      - name: Commit production migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'perf(startup): lazy-load optional tools'
          git push
