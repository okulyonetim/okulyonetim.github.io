name: migrate-legacy-calendar

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-legacy-calendar.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply legacy calendar migration
        run: |
          python3 scripts/migrate-legacy-calendar.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/dashboard-card-routes-smoke.test.js')
          s=p.read_text(encoding='utf-8')
          old="assert(dash.includes(\"routeButton('Takvimi aç','communication','calendar','Takvim','›')\"),'Takvim footer düğmesi doğrudan Takvim alt sayfasına gitmeli.');"
          new="assert(dash.includes('class=\\\"kh-more\\\" data-dash-route=\\\"communication\\\" data-dash-page=\\\"calendar\\\" data-dash-title=\\\"Takvim\\\"'),'Takvim referanstaki ay başlığı düğmesinden doğrudan Takvim alt sayfasına gitmeli.');"
          if old not in s: raise SystemExit('calendar legacy route assertion not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Syntax checks
        run: |
          node --check js/modules/dashboard.js
          node --check js/core/shell-ui.js
      - name: Dashboard checks
        run: |
          node tests/dashboard-card-routes-smoke.test.js
          node tests/calendar-month-view.test.js
      - name: Architecture checks
        run: |
          node tests/module-bundles-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node scripts/check-client-architecture.mjs
      - name: Cleanup temporary migration files
        run: |
          rm -f scripts/migrate-legacy-calendar.py
          rm -f .github/workflows/migrate-legacy-calendar.yml
      - name: Commit production migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(dashboard): restore legacy interactive calendar'
          git push origin main
