name: One-shot Attendance V2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-attendance-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore attendance grid parity
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('js/modules/tools.js')
          s=p.read_text(encoding='utf-8')
          if 'data-attendance-page' in s:
              raise SystemExit('attendance V2 already present')

          old="  HAFTAICI_ANAHTARLARI:['pzt','sal','car','per','cum'],"
          if old not in s:
              raise SystemExit('attendance service weekday marker not found')
          s=s.replace(old,old+"\n  GUN_KISA_ADLARI:['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'],",1)

          old_auto="  ogretmenAyiniOtomatikUret(ogretmen,yil,ay,resmiTatiller,izinKayitlari){const gunler={};for(let gun=1;gun<=this.gunSayisi(yil,ay);gun++){const kod=this.otomatikKodUret(ogretmen,yil,ay,gun,resmiTatiller,izinKayitlari);if(kod!==null)gunler[gun]=kod;}return gunler;},\n  ayOlustur(yil,ay,ogretmenlerMap){if(!this._yetkiKontrol())return Promise.reject(new Error('yetkisiz'));return DevamsizlikCizelgesiRepository.aySetle(yil,ay,{ogretmenler:ogretmenlerMap});},"
          new_auto="""  ogretmenAyiniOtomatikUret(ogretmen,yil,ay,resmiTatiller,izinKayitlari){const gunler={};for(let gun=1;gun<=this.gunSayisi(yil,ay);gun++){const kod=this.otomatikKodUret(ogretmen,yil,ay,gun,resmiTatiller,izinKayitlari);if(kod!==null)gunler[gun]=kod;}return gunler;},
  excelSatirlarindanAyOlustur(satirlar,yil,ay,mevcutOgretmenler,resmiTatiller,izinKayitlari){const map={};for(const satir of satirlar||[]){const eslesen=this._adaGoreOgretmenBul(mevcutOgretmenler,satir.adSoyad),ogretmenId=satir.ogretmenId||eslesen?.id||`disaridan_${this._slug(satir.adSoyad)}`,ogretmen={ogretmenId,adSoyad:satir.adSoyad,gorev:satir.gorev||eslesen?.unvan||'',haftalikSaatler:{pzt:Number(satir.pzt)||0,sal:Number(satir.sal)||0,car:Number(satir.car)||0,per:Number(satir.per)||0,cum:Number(satir.cum)||0}};ogretmen.gunler=this.ogretmenAyiniOtomatikUret(ogretmen,yil,ay,resmiTatiller,izinKayitlari);map[ogretmenId]=ogretmen;}return map;},
  _adaGoreOgretmenBul(ogretmenler,adSoyad){const norm=v=>String(v||'').trim().toLocaleUpperCase('tr-TR').replace(/\\s+/g,' '),hedef=norm(adSoyad);return(ogretmenler||[]).find(o=>norm(`${o.ad||''} ${o.soyad||''}`)===hedef||norm(o.adSoyad)===hedef)||null;},
  _slug(v){return String(v||'').toLocaleLowerCase('tr-TR').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');},
  ayOlustur(yil,ay,ogretmenlerMap){if(!this._yetkiKontrol())return Promise.reject(new Error('yetkisiz'));return DevamsizlikCizelgesiRepository.aySetle(yil,ay,{ogretmenler:ogretmenlerMap});},"""
          if old_auto not in s:
              raise SystemExit('attendance service auto marker not found')
          s=s.replace(old_auto,new_auto,1)

          old_end="  ogretmeniYenidenOlustur(ogretmen,yil,ay,resmiTatiller,izinKayitlari){if(!this._yetkiKontrol())return Promise.reject(new Error('yetkisiz'));const veri={...ogretmen,gunler:this.ogretmenAyiniOtomatikUret(ogretmen,yil,ay,resmiTatiller,izinKayitlari)};return DevamsizlikCizelgesiRepository.ogretmenVerisiSetle(yil,ay,ogretmen.ogretmenId,veri);},\n  ogretmenSil(yil,ay,ogretmenId){if(!this._yetkiKontrol())return Promise.reject(new Error('yetkisiz'));return DevamsizlikCizelgesiRepository.ogretmenSil(yil,ay,ogretmenId);}"
          new_end="""  ogretmeniYenidenOlustur(ogretmen,yil,ay,resmiTatiller,izinKayitlari){if(!this._yetkiKontrol())return Promise.reject(new Error('yetkisiz'));const veri={...ogretmen,gunler:this.ogretmenAyiniOtomatikUret(ogretmen,yil,ay,resmiTatiller,izinKayitlari)};return DevamsizlikCizelgesiRepository.ogretmenVerisiSetle(yil,ay,ogretmen.ogretmenId,veri);},
  ogretmenVerisiGuncelle(yil,ay,ogretmenId,veri){if(!this._yetkiKontrol())return Promise.reject(new Error('yetkisiz'));return DevamsizlikCizelgesiRepository.ogretmenVerisiSetle(yil,ay,ogretmenId,veri);},
  ogretmenSil(yil,ay,ogretmenId){if(!this._yetkiKontrol())return Promise.reject(new Error('yetkisiz'));return DevamsizlikCizelgesiRepository.ogretmenSil(yil,ay,ogretmenId);}"""
          if old_end not in s:
              raise SystemExit('attendance service end marker not found')
          s=s.replace(old_end,new_end,1)

          old_prepare="async function prepareAttendance(){if(!global.SyncEngine||!global.COL?.devamsizlikCizelgesi)return;SyncEngine.register('devamsizlikCizelgesi',COL.devamsizlikCizelgesi);await SyncEngine.localHydrate(['devamsizlikCizelgesi']);SyncEngine.schedule(100);}"
          new_prepare="async function prepareAttendance(){if(!global.SyncEngine||!global.COL)return;const types=['devamsizlikCizelgesi','ogretmenler','dersProgrami','resmiTatiller','ogretmenIzinleri'].filter(t=>COL[t]);for(const type of types)SyncEngine.register(type,COL[type]);if(types.length){await SyncEngine.localHydrate(types);SyncEngine.schedule(100);}}"
          if old_prepare not in s:
              raise SystemExit('prepareAttendance marker not found')
          s=s.replace(old_prepare,new_prepare,1)

          new_ui=r'''function monthDoc(){const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1;return arr('devamsizlikCizelgesi').find(x=>x.id===`${y}-${m}`)||null}
const ATT_MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const ATT_CODES={D:'Devamsız',İ:'İzinli',Y:'Yarım Gün',R:'Raporlu',T:'Tatil','+':'Görevlendirme (+)'};
const ATT_DAY_KEYS={Pazartesi:'pzt','Salı':'sal','Çarşamba':'car',Perşembe:'per',Cuma:'cum'};
function attCanEdit(){return typeof global.duzenleyebilir==='function'&&global.duzenleyebilir('personel')}
function attRolePriority(role){const r=String(role||'').trim().toLocaleUpperCase('tr-TR');if(r==='MÜDÜR'||r==='OKUL MÜDÜRÜ')return 0;if(r==='MÜDÜR YARDIMCISI')return 1;return 2}
function attSortedTeachers(doc){return Object.values(doc?.ogretmenler||{}).sort((a,b)=>attRolePriority(a.gorev)-attRolePriority(b.gorev)||String(a.adSoyad||'').localeCompare(String(b.adSoyad||''),'tr'))}
function attDayName(y,m,g){const names=global.DevamsizlikCizelgesiService?.GUN_KISA_ADLARI||['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];return names[new Date(y,m-1,g).getDay()]}
function attWeekend(y,m,g){return global.DevamsizlikCizelgesiService?.haftaSonuMu?.(y,m,g)??[0,6].includes(new Date(y,m-1,g).getDay())}
function attStateClass(value,weekend){if(weekend&&(value===undefined||value===null||value===''))return'is-weekend';if(value==='D')return'is-code-d';if(value==='İ')return'is-code-i';if(value==='Y')return'is-code-y';if(value==='R')return'is-code-r';if(value==='T')return'is-code-t';if(value==='+')return'is-code-plus';if(value!==undefined&&value!==null&&value!==''&&!isNaN(Number(value)))return'is-present';return'is-empty'}
function attTotals(o){let saat=0,devam=0,devamsiz=0;Object.values(o?.gunler||{}).forEach(v=>{if(v!==''&&v!==null&&v!==undefined&&!isNaN(Number(v))){saat+=Number(v)||0;devam++}else if(['D','R','İ'].includes(v))devamsiz++});return{saat,devam,devamsiz}}
function attTableHtml(doc,y,m,interactive=true){const days=Array.from({length:global.DevamsizlikCizelgesiService?.gunSayisi?.(y,m)||new Date(y,m,0).getDate()},(_,i)=>i+1),rows=attSortedTeachers(doc),edit=interactive&&attCanEdit();return `<div class="ka-attendance-grid-wrap"><table class="ka-attendance-personnel-table"><thead><tr><th class="ka-att-no" rowspan="2">No</th><th class="ka-att-name" rowspan="2">Adı Soyadı</th><th class="ka-att-role" rowspan="2">Görevi</th>${days.map(g=>`<th class="ka-att-day-head ${attWeekend(y,m,g)?'is-weekend':''}">${g}</th>`).join('')}<th rowspan="2">Toplam<br>Saat</th><th rowspan="2">Toplam<br>Devam</th><th rowspan="2">Toplam<br>Devamsız</th><th class="ka-att-note-head" rowspan="2">Açıklama</th></tr><tr>${days.map(g=>`<th class="ka-att-day-head ka-att-day-name ${attWeekend(y,m,g)?'is-weekend':''}">${esc(attDayName(y,m,g))}</th>`).join('')}</tr></thead><tbody>${rows.map((o,i)=>{const totals=attTotals(o);return `<tr><td class="ka-att-no">${i+1}</td><td class="ka-att-name">${edit?`<button type="button" class="ka-att-name-btn" data-att-hours="${esc(o.ogretmenId||'')}">${esc(o.adSoyad||o.ad||o.ogretmenId||'')}</button>`:`<strong>${esc(o.adSoyad||o.ad||o.ogretmenId||'')}</strong>`}</td><td class="ka-att-role">${esc(o.gorev||'')}</td>${days.map(g=>{const v=o.gunler?.[g],weekend=attWeekend(y,m,g),cls=attStateClass(v,weekend),label=v===undefined||v===null||v===''?'':v;return `<td class="ka-att-day-cell ${cls}">${interactive?`<button type="button" class="ka-att-cell ${cls}" data-att-cell data-att-teacher="${esc(o.ogretmenId||'')}" data-att-day="${g}" ${edit?'':'disabled'}>${esc(label)}</button>`:`<span>${esc(label)}</span>`}</td>`}).join('')}<td class="ka-att-total">${totals.saat}</td><td class="ka-att-total">${totals.devam}</td><td class="ka-att-total">${totals.devamsiz}</td><td class="ka-att-note">${edit?`<button type="button" data-att-note="${esc(o.ogretmenId||'')}">${esc(o.aciklama||'—')}</button>`:esc(o.aciklama||'')}</td></tr>`}).join('')}</tbody></table></div>`}
function attLegendHtml(){const items=[['is-present','Devam (ders saati)'],['is-code-d','D – Devamsız'],['is-code-i','İ – İzinli'],['is-code-y','Y – Yarım Gün'],['is-code-r','R – Raporlu'],['is-code-t','T – Tatil'],['is-code-plus','+ – Görevlendirme (+)'],['is-weekend','Hafta Sonu']];return `<div class="ka-attendance-legend">${items.map(([cls,label])=>`<span class="ka-attendance-legend-item"><i class="${cls}"></i>${esc(label)}</span>`).join('')}</div>`}
function attYearOptions(y){const now=new Date().getFullYear(),years=[now-1,now,now+1,y].filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a-b);return years.map(v=>`<option value="${v}" ${v===y?'selected':''}>${v}</option>`).join('')}
function attToolbarHtml(doc,y,m){return `<div class="ka-attendance-toolbar"><label class="ka-field"><span class="ka-field__label">Yıl</span><select data-att-year>${attYearOptions(y)}</select></label><label class="ka-field"><span class="ka-field__label">Ay</span><select data-att-month>${ATT_MONTHS.map((name,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${name}</option>`).join('')}</select></label><button class="ka-btn ka-btn--secondary" type="button" data-att-import>Excel'den İçe Aktar</button><input type="file" accept=".xlsx,.xlsm,.xls" data-att-file hidden><button class="ka-btn ka-attendance-print" type="button" data-att-print ${doc?'':'disabled'}>Yazdır</button><button class="ka-btn ka-attendance-auto" type="button" data-att-auto ${doc?'':'disabled'}>Otomatik Doldur/Tazele</button></div>`}
function renderAttendance(){const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,doc=monthDoc(),teachers=attSortedTeachers(doc),content=document.getElementById('toolsContent'),count=document.getElementById('toolsCount');if(count)count.textContent=`${teachers.length} personel`;if(!content)return;content.innerHTML=`<section class="ka-stack ka-attendance-page" data-attendance-page>${attToolbarHtml(doc,y,m)}${doc&&teachers.length?attTableHtml(doc,y,m,true)+attLegendHtml():`<div class="ka-card ka-attendance-empty"><div class="ka-card__body ka-stack"><strong>${ATT_MONTHS[m-1]} ${y} için henüz çizelge oluşturulmamış.</strong><span class="ka-muted">Öğretmen listesinden otomatik oluşturabilir veya Excel dosyasından içe aktarabilirsiniz.</span>${attCanEdit()?'<button class="ka-btn" type="button" data-att-create>Öğretmen Listesinden Oluştur</button>':''}</div></div>`}</section>`;bindAttendance()}
function attWeeklyHours(teacherId){const out={pzt:0,sal:0,car:0,per:0,cum:0};arr('dersProgrami').filter(d=>String(d.ogretmenId||'')===String(teacherId||'')).forEach(d=>{const key=ATT_DAY_KEYS[String(d.gun||'').trim()];if(key)out[key]++});return out}
function attTeacherRowsFromStore(){return arr('ogretmenler').map(o=>{const h=attWeeklyHours(o.id);return{ogretmenId:o.id,adSoyad:`${o.ad||''} ${o.soyad||''}`.trim(),gorev:o.unvan||'',...h}})}
async function attCreateMonth(){if(!attCanEdit())return global.toast?.('Bu işlem için yetkiniz yok.');const rows=attTeacherRowsFromStore();if(!rows.length)return global.toast?.('Öğretmen listesi boş.');const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,map=global.DevamsizlikCizelgesiService.excelSatirlarindanAyOlustur(rows,y,m,arr('ogretmenler'),arr('resmiTatiller'),arr('ogretmenIzinleri'));try{await global.DevamsizlikCizelgesiService.ayOlustur(y,m,map);global.toast?.('Devamsızlık çizelgesi oluşturuldu.')}catch(e){global.toast?.(e?.message||'Çizelge oluşturulamadı.')}}
async function attAutoRefresh(){const doc=monthDoc();if(!doc||!attCanEdit())return;if(!global.confirm?.('Elle değiştirilmemiş günler güncel izin, resmi tatil ve haftalık ders saatlerine göre yeniden hesaplanacak. Elle yaptığınız değişiklikler korunacak. Devam edilsin mi?'))return;const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1;try{for(const original of Object.values(doc.ogretmenler||{})){const o=structuredClone(original),fresh=global.DevamsizlikCizelgesiService.ogretmenAyiniOtomatikUret(o,y,m,arr('resmiTatiller'),arr('ogretmenIzinleri')),manual=o.elleGunler||{},merged={...(o.gunler||{})};for(const g of Object.keys(fresh))if(!manual[g])merged[g]=fresh[g];for(let g=1;g<=global.DevamsizlikCizelgesiService.gunSayisi(y,m);g++)if(!manual[g]&&!(g in fresh))delete merged[g];o.gunler=merged;await global.DevamsizlikCizelgesiService.ogretmenVerisiGuncelle(y,m,o.ogretmenId,o)}global.toast?.('Otomatik günler tazelendi.')}catch(e){global.toast?.(e?.message||'Otomatik doldurma başarısız.')}}
function closeAttModal(){document.querySelector('[data-att-modal]')?.remove()}
function openAttModal(title,body){closeAttModal();const ov=document.createElement('div');ov.className='ka-modal-backdrop';ov.dataset.attModal='';ov.innerHTML=`<section class="ka-modal ka-attendance-modal"><header class="ka-modal__header"><h3>${esc(title)}</h3><button class="ka-icon-button" type="button" data-att-close>×</button></header><div class="ka-modal__body ka-stack">${body}</div></section>`;document.body.appendChild(ov);ov.querySelector('[data-att-close]').onclick=closeAttModal;ov.onclick=e=>{if(e.target===ov)closeAttModal()};return ov}
async function attSaveTeacherRow(o){const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1;await global.DevamsizlikCizelgesiService.ogretmenVerisiGuncelle(y,m,o.ogretmenId,o)}
function openAttCellModal(id,day){const doc=monthDoc(),o=doc?.ogretmenler?.[id];if(!o||!attCanEdit())return;const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,auto=global.DevamsizlikCizelgesiService.otomatikKodUret(o,y,m,day,arr('resmiTatiller'),arr('ogretmenIzinleri')),current=o.gunler?.[day],defaultHours=current!==undefined&&current!==''&&!isNaN(Number(current))?Number(current):(!isNaN(Number(auto))?Number(auto):0),options=[[String(defaultHours),`Devam (${defaultHours} saat)`,'is-present'],['D','D – Devamsız','is-code-d'],['İ','İ – İzinli','is-code-i'],['Y','Y – Yarım Gün','is-code-y'],['R','R – Raporlu','is-code-r'],['T','T – Tatil','is-code-t'],['+','+ – Görevlendirme','is-code-plus']];const ov=openAttModal(`${o.adSoyad||'Personel'} · ${day} ${ATT_MONTHS[m-1]}`,`<div class="ka-attendance-code-grid">${options.map(([code,label,cls])=>`<button type="button" class="ka-attendance-code-btn ${cls}" data-att-code="${esc(code)}">${esc(label)}</button>`).join('')}</div><label class="ka-field"><span class="ka-field__label">Manuel ders saati</span><div class="ka-row"><input type="number" min="0" max="20" step="1" value="${defaultHours}" data-att-manual-hour><button class="ka-btn ka-btn--secondary" type="button" data-att-manual-save>Kaydet</button></div></label><button class="ka-btn ka-btn--ghost" type="button" data-att-reset-day>Otomatik değere dön</button>`);const save=async value=>{const next=structuredClone(o);next.gunler={...(next.gunler||{}),[day]:value};next.elleGunler={...(next.elleGunler||{}),[day]:true};try{await attSaveTeacherRow(next);closeAttModal();global.toast?.('Kaydedildi.')}catch(e){global.toast?.(e?.message||'Kaydedilemedi.')}};ov.querySelectorAll('[data-att-code]').forEach(b=>b.onclick=()=>save(isNaN(Number(b.dataset.attCode))?b.dataset.attCode:Number(b.dataset.attCode)));ov.querySelector('[data-att-manual-save]').onclick=()=>save(Math.max(0,Number(ov.querySelector('[data-att-manual-hour]').value)||0));ov.querySelector('[data-att-reset-day]').onclick=async()=>{const next=structuredClone(o),manual={...(next.elleGunler||{})};delete manual[day];next.elleGunler=manual;next.gunler={...(next.gunler||{})};if(auto===null)delete next.gunler[day];else next.gunler[day]=auto;try{await attSaveTeacherRow(next);closeAttModal();global.toast?.('Otomatik değer geri yüklendi.')}catch(e){global.toast?.(e?.message||'Kaydedilemedi.')}}}
function openAttHoursModal(id){const doc=monthDoc(),o=doc?.ogretmenler?.[id];if(!o||!attCanEdit())return;const h=o.haftalikSaatler||{},days=[['pzt','Pazartesi'],['sal','Salı'],['car','Çarşamba'],['per','Perşembe'],['cum','Cuma']],ov=openAttModal(`${o.adSoyad||'Personel'} · Haftalık Ders Saatleri`,days.map(([k,label])=>`<label class="ka-field"><span class="ka-field__label">${label}</span><input type="number" min="0" max="20" step="1" data-att-week="${k}" value="${Number(h[k])||0}"></label>`).join('')+'<button class="ka-btn" type="button" data-att-week-save>Kaydet</button>');ov.querySelector('[data-att-week-save]').onclick=async()=>{const next=structuredClone(o),weekly={};days.forEach(([k])=>weekly[k]=Math.max(0,Number(ov.querySelector(`[data-att-week="${k}"]`).value)||0));next.haftalikSaatler=weekly;next.gunler={...(next.gunler||{})};next.elleGunler={...(next.elleGunler||{})};const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1;for(let g=1;g<=global.DevamsizlikCizelgesiService.gunSayisi(y,m);g++){const dow=global.DevamsizlikCizelgesiService.haftaGunu(y,m,g);if(dow>=1&&dow<=5){const key=global.DevamsizlikCizelgesiService.HAFTAICI_ANAHTARLARI[dow-1];next.gunler[g]=weekly[key];next.elleGunler[g]=true}}try{await attSaveTeacherRow(next);closeAttModal();global.toast?.('Haftalık ders saatleri güncellendi.')}catch(e){global.toast?.(e?.message||'Kaydedilemedi.')}}}
function openAttNoteModal(id){const doc=monthDoc(),o=doc?.ogretmenler?.[id];if(!o||!attCanEdit())return;const ov=openAttModal(`${o.adSoyad||'Personel'} · Açıklama`,`<label class="ka-field"><span class="ka-field__label">Açıklama</span><textarea rows="4" data-att-note-input>${esc(o.aciklama||'')}</textarea></label><button class="ka-btn" type="button" data-att-note-save>Kaydet</button>`);ov.querySelector('[data-att-note-save]').onclick=async()=>{const next=structuredClone(o);next.aciklama=ov.querySelector('[data-att-note-input]').value.trim();try{await attSaveTeacherRow(next);closeAttModal();global.toast?.('Açıklama kaydedildi.')}catch(e){global.toast?.(e?.message||'Kaydedilemedi.')}}}
async function attPrint(){const doc=monthDoc();if(!doc)return;if(!global.ReportEngine?.printReport)await global.AppLoader?.loadScript?.('js/modules/report-engine.js').catch(()=>{});if(!global.ReportEngine?.printReport)return global.toast?.('Rapor motoru hazır değil.');const y=attendanceDate.getFullYear(),m=attendanceDate.getMonth()+1,days=Array.from({length:global.DevamsizlikCizelgesiService.gunSayisi(y,m)},(_,i)=>i+1),rows=attSortedTeachers(doc),body=`<table class="ka-attendance-print-table"><thead><tr><th>No</th><th>Adı Soyadı</th><th>Görevi</th>${days.map(g=>`<th>${g}<br>${esc(attDayName(y,m,g))}</th>`).join('')}<th>Saat</th><th>Devam</th><th>Devamsız</th><th>Açıklama</th></tr></thead><tbody>${rows.map((o,i)=>{const t=attTotals(o);return `<tr><td>${i+1}</td><td>${esc(o.adSoyad||'')}</td><td>${esc(o.gorev||'')}</td>${days.map(g=>`<td>${esc(o.gunler?.[g]??'')}</td>`).join('')}<td>${t.saat}</td><td>${t.devam}</td><td>${t.devamsiz}</td><td>${esc(o.aciklama||'')}</td></tr>`}).join('')}</tbody></table>`;global.ReportEngine.printReport(`${ATT_MONTHS[m-1]} ${y} Devamsızlık Çizelgesi`,body,{fileName:`Devamsizlik_Cizelgesi_${y}_${String(m).padStart(2,'0')}`,yon:'yatay',compact:true,kenarBosluk:5,fontSize:7,tarihGoster:false})}
