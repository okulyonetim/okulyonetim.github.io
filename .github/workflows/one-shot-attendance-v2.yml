name: One-shot Attendance V2
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-attendance-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recover and run attendance patch
        shell: bash
        run: |
          git show HEAD^:.github/workflows/one-shot-attendance-v2.yml > /tmp/attendance-old.yml
          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/attendance-old.yml').read_text(encoding='utf-8')
          start=text.index('      - name: Restore attendance grid parity\n')
          run_marker='        run: |\n'
          pos=text.index(run_marker,start)+len(run_marker)
          end=text.index('      - name: Validate attendance package\n',pos)
          lines=text[pos:end].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          old='s,n=re.subn(pattern,new_ui+"\\nfunction render(){if(!mounted)return;",s,count=1,flags=re.S)'
          new='s,n=re.subn(pattern,lambda _m:new_ui+"\\nfunction render(){if(!mounted)return;",s,count=1,flags=re.S)'
          if old in code:
              code=code.replace(old,new,1)
          old2='s,n=re.subn(r"function bindAttendance\\(\\)\\{.*?\\nfunction bind\\(\\)\\{\\}",new_bind,s,count=1,flags=re.S)'
          new2='s,n=re.subn(r"function bindAttendance\\(\\)\\{.*?\\nfunction bind\\(\\)\\{\\}",lambda _m:new_bind,s,count=1,flags=re.S)'
          if old2 in code:
              code=code.replace(old2,new2,1)
          Path('/tmp/attendance-patch.py').write_text(code,encoding='utf-8')
          PY
          python /tmp/attendance-patch.py
      - name: Validate attendance package
        run: |
          node --check js/modules/tools.js
          node tests/tools-attendance-v2-smoke.test.js
          node tests/tools-separate-pages.test.js
          node tests/modules-local-first-boundary.test.js
      - name: Commit attendance package
        run: |
          git config user.name "sedonet23"
          git config user.email "sedonet23@gmail.com"
          git rm .github/workflows/one-shot-attendance-v2.yml
          git add js/modules/tools.js css/design-system.css tests/tools-attendance-v2-smoke.test.js service-worker.js
          git commit -m "feat: restore attendance grid parity"
          git push origin HEAD:main
