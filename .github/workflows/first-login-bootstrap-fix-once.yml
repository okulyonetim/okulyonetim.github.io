name: First login bootstrap fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply bootstrap sync fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/core/core.js'); s=p.read_text()
          a="function requestedSyncNames(types,options={}){if(types?.length)return[...types];return options?.force||options?.manual?ALL_SYNC_TYPES.slice():AUTO_SYNC_TYPES.slice()}"
          b="function requestedSyncNames(types,options={}){if(types?.length)return[...types];return options?.force||options?.manual||options?.bootstrap?ALL_SYNC_TYPES.slice():AUTO_SYNC_TYPES.slice()}"
          if a not in s: raise SystemExit('requestedSyncNames pattern not found')
          s=s.replace(a,b,1)
          a="scheduleSync(250);AppStore.set('meta.booted'"
          b="scheduleSync(250,{bootstrap:true});AppStore.set('meta.booted'"
          if a not in s: raise SystemExit('bootstrap schedule pattern not found')
          s=s.replace(a,b,1)
          p.write_text(s)
          for fn in ['index.html','service-worker.js']:
            p=Path(fn); s=p.read_text()
            s=re.sub(r'(js/core/core\.js\?v=)(\d+)([^0-9])',lambda m:m.group(1)+str(int(m.group(2))+1)+m.group(3),s,count=1)
            if fn=='service-worker.js': s=re.sub(r'(oy-cache-v)(\d+)',lambda m:m.group(1)+str(int(m.group(2))+1),s,count=1)
            p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          node --check js/core/core.js
          node - <<'NODE'
          const fs=require('fs'),a=require('assert'); const s=fs.readFileSync('js/core/core.js','utf8');
          a(s.includes('options?.force||options?.manual||options?.bootstrap?ALL_SYNC_TYPES.slice():AUTO_SYNC_TYPES.slice()'));
          a(s.includes('scheduleSync(250,{bootstrap:true})'));
          console.log('bootstrap sync validation passed');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/core.js index.html service-worker.js
          git rm .github/workflows/first-login-bootstrap-fix-once.yml
          git commit -m 'Fix initial bootstrap sync for core collections'
          git push origin main
