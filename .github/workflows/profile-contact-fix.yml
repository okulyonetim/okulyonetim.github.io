name: Profile Contact Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-contact-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify expected parent
        run: test "$(git rev-parse HEAD^)" = 'fa26cc03242aa7067e2dceec7669491382db3a1b'
      - name: Apply profile fix
        run: python3 scripts/tmp-profile-contact-fix.py
      - name: Check syntax
        run: |
          node --check js/core/shell-ui.js
          node --check service-worker.js
      - name: Run non-emulator smoke tests
        run: |
          set -euo pipefail
          for f in tests/*.test.js; do
            case "$f" in
              *-rules.test.js|*/firestore-regression-extra.test.js) echo "--- $f (Firestore emulator test; dedicated workflow)"; continue ;;
            esac
            echo "--- $f"
            node "$f"
          done
      - name: Audit architecture
        run: npm run audit:client
      - name: Commit fix and cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/profile-contact-fix.yml scripts/tmp-profile-contact-fix.py
          git add js/core/shell-ui.js index.html service-worker.js tests
          git commit -m 'fix: remove duplicate profile contact details'
          git push origin HEAD:main
