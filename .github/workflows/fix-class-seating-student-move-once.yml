name: Fix class seating student move

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-class-seating-student-move-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused student move fix
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 -d | python3
      - name: Verify focused behavior
        run: |
          node --check js/modules/class-seating.js
          node tests/classes-mobile-parity-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/report-engine-a4-smoke.test.js
      - name: Commit focused fix
        shell: bash
        run: |
          git rm .github/workflows/fix-class-seating-student-move-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/class-seating.js service-worker.js tests/classes-mobile-parity-smoke.test.js
          git commit -m 'fix: allow moving seated students'
          git push origin HEAD:main
