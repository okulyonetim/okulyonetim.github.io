name: Fix class seating student move

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-class-seating-student-move-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused student move fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/modules/class-seating.js')
          s=p.read_text()

          old="""function clearStudentAssignments(){
  const seats=$$('[data-so-seat]',canvas);
  let cleared=0;
  seats.forEach(seat=>{
    if(seat.dataset.studentId||seat.dataset.name||seat.dataset.empty!=='true')cleared++;
    delete seat.dataset.studentId;
    seat.dataset.name='';
    seat.dataset.empty='true';
    seat.textContent='+';
    seat.style.color='rgba(107,91,58,.45)';
  });
  if(cleared){dirty=true;refreshPool();}
  return cleared;
}
"""
          new="""function clearSeatStudent(seat){
  if(!seat)return false;
  const had=!!(seat.dataset.studentId||seat.dataset.name||seat.dataset.empty!=='true');
  delete seat.dataset.studentId;
  seat.dataset.name='';
  seat.dataset.empty='true';
  seat.textContent='+';
  seat.style.color='rgba(107,91,58,.45)';
  return had;
}
function clearStudentAssignments(){
  const seats=$$('[data-so-seat]',canvas);
  let cleared=0;
  seats.forEach(seat=>{if(clearSeatStudent(seat))cleared++;});
  if(cleared){dirty=true;refreshPool();}
  return cleared;
}
"""
          if old not in s: raise SystemExit('clearStudentAssignments anchor not found')
          s=s.replace(old,new,1)

          old="""  const used=assigned();
  const current=seat.dataset.studentId||'';
  const available=students().filter(v=>v.id===current||!used.has(v.id));
"""
          new="""  const used=assigned();
  const current=seat.dataset.studentId||'';
  const available=students();
"""
          if old not in s: raise SystemExit('available students anchor not found')
          s=s.replace(old,new,1)

          old="""      ${available.length
        ?available.map(v=>`<button type=\"button\" class=\"ka-btn ka-btn--secondary\" data-student=\"${esc(v.id)}\">${v.id===current?'✓ ':''}${esc(v.ogrenciAdi)}</button>`).join('')
        :'<div class=\"ka-empty\">Atanacak öğrenci kalmadı.</div>'}
"""
          new="""      ${available.length
        ?available.map(v=>`<button type=\"button\" class=\"ka-btn ka-btn--secondary\" data-student=\"${esc(v.id)}\">${v.id===current?'✓ ':used.has(v.id)?'↔ ':''}${esc(v.ogrenciAdi)}</button>`).join('')
        :'<div class=\"ka-empty\">Bu sınıfta öğrenci bulunmuyor.</div>'}
"""
          if old not in s: raise SystemExit('picker list anchor not found')
          s=s.replace(old,new,1)

          old="""  $$('[data-student]',ov).forEach(b=>b.onclick=()=>{
    const v=students().find(x=>x.id===b.dataset.student);
    if(!v)return;
    seat.dataset.studentId=v.id;
"""
          new="""  $$('[data-student]',ov).forEach(b=>b.onclick=()=>{
    const v=students().find(x=>x.id===b.dataset.student);
    if(!v)return;
    $$('[data-so-seat]',canvas).forEach(other=>{
      if(other!==seat&&other.dataset.studentId===v.id)clearSeatStudent(other);
    });
    seat.dataset.studentId=v.id;
"""
          if old not in s: raise SystemExit('student move anchor not found')
          s=s.replace(old,new,1)

          old="""    }else if(dist<CLICK_LIMIT){
      const seat=startTarget?.closest?.('[data-so-seat]');
      if(!seat&&startTarget?.closest?.('[data-so-teacher-name]')){
        const span=startTarget.closest('[data-so-teacher-name]');
"""
          new="""    }else if(dist<CLICK_LIMIT){
      const seat=startTarget?.closest?.('[data-so-seat]');
      if(seat){
        seat.dataset.soSuppressClick='true';
        setTimeout(()=>{if(seat.isConnected)delete seat.dataset.soSuppressClick},350);
        chooseStudent(seat);
      }else if(startTarget?.closest?.('[data-so-teacher-name]')){
        const span=startTarget.closest('[data-so-teacher-name]');
"""
          if old not in s: raise SystemExit('pointer tap anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('service-worker.js')
          sw=p.read_text()
          if "const CACHE_ADI='oy-cache-v883';" not in sw: raise SystemExit('cache anchor not found')
          p.write_text(sw.replace("const CACHE_ADI='oy-cache-v883';","const CACHE_ADI='oy-cache-v884';",1))

          p=Path('tests/classes-mobile-parity-smoke.test.js')
          t=p.read_text()
          anchor="assert(seating.includes('global.SinifOturma={ac:open'),'Legacy public SinifOturma.ac API geri gelmeli.');"
          extra="""assert(seating.includes('const available=students();')&&seating.includes("other.dataset.studentId===v.id")&&seating.includes('clearSeatStudent(other)'),'Öğrenci seçici yerleşmiş öğrencileri de göstermeli ve seçileni eski sıradan yeni sıraya taşımalı.');
assert(seating.includes('setTimeout(()=>{if(seat.isConnected)delete seat.dataset.soSuppressClick},350)')&&seating.includes('chooseStudent(seat);'),'Dokunma pointer-capture altında da sıra adı/artı öğrenci seçiciyi açmalı.');"""
          if anchor not in t: raise SystemExit('test anchor not found')
          p.write_text(t.replace(anchor,anchor+'\n'+extra,1))
          PY
      - name: Verify focused behavior
        run: |
          node --check js/modules/class-seating.js
          node tests/classes-mobile-parity-smoke.test.js
          node tests/modules-local-first-boundary.test.js
          node tests/service-worker-precache-smoke.test.js
          node tests/report-engine-a4-smoke.test.js
      - name: Commit focused fix
        shell: bash
        run: |
          git rm .github/workflows/fix-class-seating-student-move-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/modules/class-seating.js service-worker.js tests/classes-mobile-parity-smoke.test.js
          git commit -m 'fix: allow moving seated students'
          git push origin HEAD:main
