<script>
(function(){

gs.push(grp('Tasarım',[['old','Mevcut'],['new','V3']],function(){return NEW?'new':'old'},function(v){NEW=v==='new';document.getElementById('v3css').disabled=!NEW;document.documentElement.classList.toggle('ka-v3',NEW);if(NEW)T.apply();document.documentElement.style.cssText=NEW?document.documentElement.style.cssText:'';rate()}));

var ac=document.createElement('span');ac.className='g';ac.textContent='Vurgu ';Object.keys(T.presets).forEach(function(k){var x=document.createElement('button');x.className='sw';x.title=k;x.style.background=T.presets[k];x.onclick=function(){T.set({accent:k});rate()};ac.appendChild(x)});var rs=document.createElement('button');rs.textContent='Sıfırla';rs.onclick=function(){T.reset();rate();mark()};ac.appendChild(rs);bar.appendChild(ac);

 P.forEach(function(p){var r=T.contrast(col('var('+p[1]+')'),col('var('+p[2]+')'));h+='<tr><td>'+p[0]+'</td><td>'+r.toFixed(2)+':1</td><td><span class="p '+(r>=4.5?'ok':'no')+'">'+(r>=4.5?'AA ✓':'AA ✗')+'</span></td></tr>'});document.getElementById('ct').innerHTML=h;mark()}

function menuOpen(){ml.hidden=false;requestAnimationFrame(function(){ml.classList.add('open')})}

if(!NEW){document.getElementById('v3css').disabled=true;document.documentElement.classList.remove('ka-v3')}else{T.apply()}
