<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Koruk Asistan · Ders Sahnesi</title>
<style>
:root{--bg:#071b16;--surface:#0d2a22;--surface2:#12382d;--text:#eef7f3;--muted:#9db7ad;--accent:#b8d86a;--line:#285344}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#164c3a 0,#071b16 48%);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}
.scene{width:min(760px,100%);min-height:560px;background:linear-gradient(160deg,#10352b,#081d18);border:1px solid #234d40;border-radius:30px;overflow:hidden;position:relative;box-shadow:0 24px 70px #0008}
.head{position:relative;z-index:5;padding:25px 25px 8px}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}.title{font-size:28px;font-weight:750;margin:7px 0}.meta{color:var(--muted);font-size:14px}
.art{position:absolute;inset:110px 0 100px;overflow:hidden}
.floor{position:absolute;left:7%;right:7%;bottom:10%;height:2px;background:#3b6659}
.board{position:absolute;left:15%;top:18%;width:42%;height:27%;border:2px solid #477166;border-radius:10px;background:#0b211b;box-shadow:0 0 45px #0005}
.board:after{content:"BİLİŞİM TEKNOLOJİLERİ";position:absolute;left:8%;top:22%;color:#cfe4da;font-size:clamp(10px,2vw,15px);letter-spacing:.04em;animation:write 1.2s both}
.board:before{content:"";position:absolute;left:8%;right:8%;bottom:23%;height:3px;background:var(--accent);transform-origin:left;animation:progress 6s linear infinite}
.teacher{position:absolute;right:20%;bottom:13%;width:54px;height:130px;animation:teach 3.2s ease-in-out infinite}
.teacher .head{padding:0;position:absolute;left:16px;top:0;width:24px;height:24px;border-radius:50%;background:#d5a07b}
.teacher .body{position:absolute;left:9px;top:27px;width:38px;height:64px;border-radius:15px 15px 8px 8px;background:#315f51}
.teacher .arm{position:absolute;left:-8px;top:36px;width:55px;height:9px;border-radius:8px;background:#d5a07b;transform-origin:right;animation:arm 1.6s ease-in-out infinite}
.student{position:absolute;bottom:13%;width:26px;height:60px}.student:before{content:"";position:absolute;left:5px;top:0;width:16px;height:16px;border-radius:50%;background:#d5a07b}.student:after{content:"";position:absolute;left:2px;top:20px;width:22px;height:38px;border-radius:8px;background:#416f60}
.s1{left:16%;animation:bob 2.2s ease-in-out infinite}.s2{left:27%;animation:bob 2.6s .3s ease-in-out infinite}.s3{left:39%;animation:bob 2.4s .7s ease-in-out infinite}
.desk{position:absolute;bottom:10%;width:70px;height:7px;border-radius:4px;background:#355b50}.d1{left:13%}.d2{left:25%}.d3{left:37%}
.time{position:absolute;right:18px;top:16px;border:1px solid #31594c;background:#0a241d;padding:8px 12px;border-radius:99px;font-size:12px;color:var(--accent)}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:17px 24px;background:linear-gradient(transparent,#071b16 22%);display:flex;justify-content:space-between;align-items:end;z-index:5}.remaining{font-size:15px}.status{font-size:12px;color:var(--muted)}
.controls{position:absolute;top:18px;right:18px;display:flex;gap:6px;z-index:10}.controls button{border:1px solid #31594c;background:#0b241d;color:#dcece6;border-radius:10px;padding:7px 10px;cursor:pointer}.controls button.active{background:var(--accent);color:#101b14;border-color:var(--accent)}
@keyframes write{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes progress{from{transform:scaleX(.12)}to{transform:scaleX(1)}}@keyframes teach{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes arm{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
body.break .board{opacity:.35;transform:translateY(-8px);transition:.7s}body.break .teacher{transform:translateX(30px);opacity:.25;transition:.7s}body.break .student{animation:walk 3s linear infinite}body.break .student.s1{left:78%}body.break .student.s2{left:66%}body.break .student.s3{left:54%}body.break .remaining:after{content:" · Teneffüs"}body.weekend .board,body.weekend .desk{opacity:.18}body.weekend .teacher,body.weekend .student{opacity:.08}body.weekend .art:after{content:"OKUL SAKİN";position:absolute;inset:35% 0;text-align:center;font-size:clamp(22px,5vw,40px);font-weight:750;letter-spacing:.08em;color:#7eaaa0;opacity:.7}body.weekend .remaining:after{content:" · Hafta sonu"}@keyframes walk{from{transform:translateX(-80px)}to{transform:translateX(120px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="scene">
<div class="controls"><button class="active" data-mode="lesson">Ders</button><button data-mode="break">Teneffüs</button><button data-mode="weekend">Hafta sonu</button></div>
<header class="head"><div class="eyebrow">KORUK ASİSTAN · CANLI SAHNE</div><div class="title">Bilişim Teknolojileri ve Yazılım</div><div class="meta">5-A · 3. Ders · 40 dakika</div><div class="time">09:40</div></header>
<div class="art">
<div class="board"></div><div class="teacher"><i class="head"></i><i class="body"></i><i class="arm"></i></div>
<div class="desk d1"></div><div class="desk d2"></div><div class="desk d3"></div>
<div class="student s1"></div><div class="student s2"></div><div class="student s3"></div><div class="floor"></div>
</div>
<footer class="bottom"><div><div class="remaining">Ders devam ediyor</div><div class="status">Sahne, okul durumuna göre değişir.</div></div><strong id="clock">24:18</strong></footer>
</section>
<script>
const buttons=[...document.querySelectorAll('[data-mode]')];const body=document.body;
buttons.forEach(b=>b.onclick=()=>{buttons.forEach(x=>x.classList.remove('active'));b.classList.add('active');body.className=b.dataset.mode;});
let sec=1458;setInterval(()=>{if(body.classList.contains('weekend'))return;sec=Math.max(0,sec-1);const m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');document.querySelector('#clock').textContent=m+':'+s},1000);
</script>
</body>
</html>
