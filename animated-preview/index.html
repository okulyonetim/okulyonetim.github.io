<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Koruk Asistan — SVG + GSAP</title><script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;background:#07160f;color:#f5f0df;font-family:Inter,system-ui,sans-serif}body{overflow-x:hidden}.app{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(#0b2017,#07160f);padding-bottom:30px}header{padding:18px;display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:13px;background:#dcebd0;position:relative}.logo:before,.logo:after{content:"";position:absolute;width:16px;height:25px;background:#3f7950;border-radius:100% 0 100% 0;top:8px}.logo:before{left:8px;transform:rotate(-35deg)}.logo:after{right:8px;transform:rotate(35deg) scaleX(-1)}.brand b{display:block;font-size:18px}.brand span{font-size:11px;color:#9fb7aa}.actions{margin-left:auto;display:flex;gap:7px}.round{width:36px;height:36px;border-radius:50%;border:1px solid #b8d7c326;background:#0d2b20;display:grid;place-items:center}.badge{position:absolute;background:#d75e52;color:white;border-radius:9px;font:700 9px system-ui;padding:2px 5px;margin:-25px 0 0 17px}.intro{padding:4px 18px 14px}.eyebrow{font-size:10px;letter-spacing:.18em;color:#9fc1ad}.intro h1{margin:6px 0 3px;font-size:30px}.intro p{margin:0;color:#8fa99c;font-size:13px}.scene{margin:0 14px;border-radius:27px;padding:12px;background:linear-gradient(145deg,#285a44,#0b251a);border:1px solid #b9ddca2b;box-shadow:0 25px 60px #0007;overflow:hidden}.scene svg{display:block;width:100%}.chalk{font-family:"Segoe Print","Comic Sans MS",cursive}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 14px}.controls button{border:1px solid #83a99655;background:#0c2b20;color:#edf4e9;border-radius:14px;padding:13px 6px;font-size:16px;font-family:"Segoe Print","Comic Sans MS",cursive}.controls button.active{background:#dcebd2;color:#16382b;border-color:#dcebd2}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:12px 14px}.stat{padding:14px 15px;border-radius:19px;color:#18382c;box-shadow:0 8px 18px #0003}.stat:nth-child(1){background:#dcebcf}.stat:nth-child(2){background:#efdcd2}.stat:nth-child(3){background:#f2dfa9}.stat:nth-child(4){background:#d3e8dc}.num{font:800 29px "Segoe Print","Comic Sans MS",cursive}.label{font-size:11px}.info{margin:13px 18px;text-align:center;color:#8fa99c;font-size:12px;line-height:1.5}</style></head><body><div class="app"><header><div class="logo"></div><div class="brand"><b>Koruk Asistan</b><span>Koruk İlk-Ortaokulu</span></div><div class="actions"><div class="round">⌕</div><div class="round">♧<span class="badge">3</span></div><div class="round">●</div></div></header><div class="intro"><div class="eyebrow">SVG + GSAP · CANLI SAHNE</div><h1 id="sceneTitle">Bilişim Teknolojileri</h1><p id="sceneInfo">5-A · 3. Ders · 40 dakika</p></div><section class="scene"><svg viewBox="0 0 700 430"><rect x="15" y="15" width="670" height="400" rx="28" fill="#123d2e"/><rect x="28" y="28" width="644" height="374" rx="22" fill="#0c2c20"/><g id="blackboard"><rect x="62" y="48" width="576" height="194" rx="15" fill="#70482c"/><rect x="75" y="61" width="550" height="168" rx="8" fill="#0b3022"/><path d="M92 82H608M92 108H608M92 134H608M92 160H608M92 186H608M92 212H608" stroke="#dcead91c"/><text id="chalkText" class="chalk" x="105" y="113" fill="#f6efdc" font-size="38">Bilişim Teknolojileri</text><line id="chalkLine" x1="106" y1="137" x2="455" y2="137" stroke="#f3ecd8" stroke-width="3"/><text id="lessonInfo" class="chalk" x="106" y="174" fill="#f1e7cf" font-size="20">5-A · 3. Ders · 40 dk</text><text id="chalkSub" class="chalk" x="106" y="205" fill="#e5b84c" font-size="17">Şu an ders zamanı</text></g><g id="clock"><circle cx="578" cy="93" r="27" fill="#f4ead6" stroke="#d1bea0" stroke-width="3"/><line id="hourHand" x1="578" y1="93" x2="578" y2="78" stroke="#17382c" stroke-width="3"/><line id="minuteHand" x1="578" y1="93" x2="590" y2="93" stroke="#17382c" stroke-width="3"/></g><g id="book"><path d="M490 110 Q525 95 558 111 L558 177 Q525 162 490 177 Z" fill="#f5ecd8"/><path d="M558 111 Q592 95 620 108 L620 175 Q592 162 558 177 Z" fill="#e8deca"/><line x1="558" y1="111" x2="558" y2="177" stroke="#817765" stroke-width="3"/></g><g id="pencil"><rect x="494" y="193" width="112" height="12" rx="6" fill="#e5b84d"/><polygon points="606,193 624,199 606,205" fill="#e6c78f"/></g><g><rect x="28" y="270" width="644" height="132" rx="20" fill="#174633"/><rect x="65" y="330" width="180" height="43" rx="7" fill="#71482d"/><rect x="455" y="330" width="180" height="43" rx="7" fill="#71482d"/></g><g id="notebook"><rect x="280" y="314" width="145" height="76" rx="5" fill="#f5ecd8" stroke="#c6b994"/><path d="M295 335H410M295 350H410M295 365H410" stroke="#94a9a0" opacity=".5"/><line x1="302" y1="321" x2="302" y2="382" stroke="#d4776f" stroke-width="3"/><text x="370" y="329" fill="#53665d" font-size="11" class="chalk">Koruk</text></g><g id="students"><g id="student1"><circle cx="105" cy="298" r="12" fill="#9debb9"/><path d="M93 310Q105 302 117 310V348H93Z" fill="#77cfa0"/></g><g id="student2"><circle cx="180" cy="296" r="11" fill="#efc29f"/><path d="M169 307Q180 300 191 307V347H169Z" fill="#9fc3e6"/></g><g id="student3"><circle cx="430" cy="298" r="12" fill="#9debb9"/><path d="M418 310Q430 302 442 310V348H418Z" fill="#e3bd6c"/></g><g id="student4"><circle cx="505" cy="296" r="11" fill="#e8c09f"/><path d="M494 307Q505 300 516 307V347H494Z" fill="#d7a7c7"/></g></g><g id="teacher"><ellipse cx="350" cy="337" rx="34" ry="7" fill="#0004"/><circle cx="350" cy="265" r="16" fill="#f0c4a2"/><path d="M334 261Q350 240 366 261" fill="#4b3025"/><rect x="336" y="281" width="28" height="54" rx="13" fill="#dbe9d5"/><line x1="337" y1="293" x2="308" y2="315" stroke="#dbe9d5" stroke-width="8"/><line id="teacherArm" x1="362" y1="293" x2="407" y2="250" stroke="#dbe9d5" stroke-width="8"/></g><g id="door"><rect x="585" y="276" width="58" height="112" rx="5" fill="#70472c"/><circle cx="632" cy="333" r="4" fill="#e5b84d"/></g></svg></section><div class="controls"><button class="active" data-mode="lesson">Ders</button><button data-mode="break">Teneffüs</button><button data-mode="weekend">Hafta Sonu</button></div><div class="stats"><div class="stat"><div class="num" data-value="12">0</div><div class="label">Öğretmen</div></div><div class="stat"><div class="num" data-value="86">0</div><div class="label">Öğrenci</div></div><div class="stat"><div class="num" data-value="8">0</div><div class="label">Sınıf</div></div><div class="stat"><div class="num" data-value="5">0</div><div class="label">Servis</div></div></div><div class="info">Bu testte sahnenin parçaları SVG, hareket motoru GSAP. Butonlarla okul durumunu değiştirip animasyonları görebilirsin.</div></div><script>
const title=document.getElementById("sceneTitle"),info=document.getElementById("sceneInfo"),chalkText=document.getElementById("chalkText"),lessonInfo=document.getElementById("lessonInfo"),chalkSub=document.getElementById("chalkSub");
gsap.to("#sunbeam",{opacity:.15,scale:1.04,transformOrigin:"left center",duration:4,repeat:-1,yoyo:true,ease:"sine.inOut"});gsap.to("#book",{rotation:4,y:-5,transformOrigin:"center center",duration:2,repeat:-1,yoyo:true,ease:"sine.inOut"});
gsap.to("#pencil",{x:-12,y:5,rotation:-8,transformOrigin:"center center",duration:1.5,repeat:-1,yoyo:true,ease:"sine.inOut"});
gsap.to("#notebook",{y:-4,rotation:2,transformOrigin:"center center",duration:3,repeat:-1,yoyo:true,ease:"sine.inOut"});
gsap.to("#hourHand",{rotation:360,transformOrigin:"578px 93px",duration:24,repeat:-1,ease:"none"});
gsap.to("#minuteHand",{rotation:360,transformOrigin:"578px 93px",duration:6,repeat:-1,ease:"none"});
["#student1","#student2","#student3","#student4"].forEach((id,i)=>gsap.to(id,{y:-5-(i%2)*3,duration:1.6+i*.25,repeat:-1,yoyo:true,delay:i*.2,ease:"sine.inOut"}));
gsap.to("#teacherArm",{rotation:14,transformOrigin:"362px 293px",duration:.8,repeat:-1,yoyo:true,ease:"sine.inOut"});
function writeText(el){gsap.fromTo(el,{opacity:0,clipPath:"inset(0 100% 0 0)"},{opacity:1,clipPath:"inset(0 0% 0 0)",duration:1,ease:"power2.out"})}
function reset(){gsap.to("#students",{x:0,opacity:1,duration:.6});gsap.to("#teacher",{x:0,opacity:1,duration:.6});gsap.to("#door",{rotation:0,duration:.5});gsap.to("#blackboard",{opacity:1,duration:.5})}
function mode(m){document.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));reset();if(m==="lesson"){title.textContent="Bilişim Teknolojileri";info.textContent="5-A · 3. Ders · 40 dakika";chalkText.textContent="Bilişim Teknolojileri";lessonInfo.textContent="5-A · 3. Ders · 40 dk";chalkSub.textContent="Şu an ders zamanı"}if(m==="break"){title.textContent="Teneffüs";info.textContent="Zil çaldı · Koridor hareketli";chalkText.textContent="Teneffüs";lessonInfo.textContent="Bir sonraki ders hazırlanıyor";chalkSub.textContent="Öğrenciler hareket halinde";gsap.to("#students",{x:85,duration:1.2,stagger:.08});gsap.to("#teacher",{x:-35,duration:1});gsap.to("#door",{rotation:-38,duration:.8})}if(m==="weekend"){title.textContent="Okul sakin";info.textContent="Hafta sonu · Ders ve zil akışı kapalı";chalkText.textContent="Okul Sakin";lessonInfo.textContent="Hafta sonu";chalkSub.textContent="Yeni hafta için okul hazırlanıyor";gsap.to("#students",{opacity:.08,duration:1});gsap.to("#teacher",{opacity:.08,duration:1});gsap.to("#blackboard",{opacity:.7,duration:1})}writeText(chalkText);writeText(lessonInfo)}
document.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>mode(b.dataset.mode)));
document.querySelectorAll(".num").forEach(el=>{const t=+el.dataset.value;let n=0;const f=()=>{n=Math.min(t,n+Math.max(1,Math.ceil(t/25)));el.textContent=n;if(n<t)requestAnimationFrame(f)};f()});
</script></body></html>
