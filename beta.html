<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <script>document.documentElement.classList.add('ka-beta')</script>
  <script>
  /* Web arayüzü önizlemesi (yalnız telefon/dar ekran, yalnız bayrak açıkken): adrese ?web=1 eklenince sayfa 1280px genişlikte çizilir ve sol menülü web arayüzü açılır;
     ?web=0 ile kapanır. Bayrak bu tarayıcıda hatırlanır (localStorage "ka-web-preview"). Bayrak yoksa hiçbir şey değişmez. */
  (()=>{try{const q=new URLSearchParams(location.search).get('web');if(q==='1')localStorage.setItem('ka-web-preview','1');else if(q==='0')localStorage.removeItem('ka-web-preview');
  if(localStorage.getItem('ka-web-preview')!=='1'||matchMedia('(min-width:1100px)').matches)return;
  const m=document.querySelector('meta[name="viewport"]');if(m)m.setAttribute('content','width=1280,minimum-scale=0.1,maximum-scale=4,user-scalable=yes,viewport-fit=cover')}catch(_){}})();
  </script>
  <meta name="theme-color" content="#ffc400" data-ka-theme-color>
  <script>
  (()=>{try{let t=localStorage.getItem('ka-theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;const m=document.querySelector('meta[data-ka-theme-color]');if(m)m.content=t==='dark'?'#080808':'#f6f6f4'}catch(_){document.documentElement.setAttribute('data-theme','light')}})();
  </script>
  <script>
  (()=>{const KEY='ka-theme',root=document.documentElement,apply=(theme,persist=true)=>{const t=theme==='dark'?'dark':'light';root.setAttribute('data-theme',t);root.style.colorScheme=t;if(persist){try{localStorage.setItem('ka-theme',t)}catch(_){}}const meta=document.querySelector('meta[data-ka-theme-color]');if(meta){let c='';try{c=getComputedStyle(root).getPropertyValue('--ka-app-bg').trim()}catch(_){}meta.content=c||(t==='dark'?'#080808':'#f6f6f4')}document.querySelectorAll('[data-ka-theme-toggle]').forEach(btn=>{if(!btn.querySelector('svg'))btn.textContent=t==='dark'?'☀️':'🌙';btn.setAttribute('aria-pressed',t==='dark'?'true':'false');btn.setAttribute('aria-label',t==='dark'?'Açık temaya geç':'Koyu temaya geç');btn.title=t==='dark'?'Açık temaya geç':'Koyu temaya geç'});try{window.dispatchEvent(new CustomEvent('koruk:theme-change',{detail:{theme:t}}))}catch(_){}return t};const initial=root.getAttribute('data-theme')==='dark'?'dark':'light';window.KorukTheme={touched:false,get:()=>root.getAttribute('data-theme')||'light',set:t=>{window.KorukTheme.touched=true;return apply(t,true)},toggle:()=>{window.KorukTheme.touched=true;return apply(root.getAttribute('data-theme')==='dark'?'light':'dark',true)}};document.addEventListener('DOMContentLoaded',()=>{apply(initial,false);document.addEventListener('click',e=>{if(e.__kaTheme)return;const btn=e.target.closest?.('[data-ka-theme-toggle]');if(!btn)return;e.__kaTheme=1;e.preventDefault();e.stopPropagation();const sh=window.ShellUI;if(sh&&typeof sh.toggleTheme==='function')sh.toggleTheme();else window.KorukTheme.toggle()},{capture:true})},{once:true})})();
  </script>

  <meta name="apple-mobile-web-app-capable" content="yes">

<body>
  <section id="configWarning" class="ka-page ka-stack ka-hidden" role="alert"><div class="ka-card"><div class="ka-card__header"><h2>Bağlantı yapılandırması açılamadı</h2></div><div class="ka-card__body"><p class="ka-muted">Firebase başlatılamadı. Yapılandırma ve bağlantı bilgileri kontrol edilmelidir.</p></div></div></section>
  <section id="girisEkrani" class="ka-login-page"><div class="ka-login-card ka-card"><div class="ka-login-brand"><img src="assets/icon-192.png" width="72" height="72" alt="Koruk İlk-Ortaokulu"><div><h1>Koruk Asistan</h1><p class="ka-muted">Koruk İlk-Ortaokulu</p></div></div><form class="ka-card__body ka-stack" onsubmit="girisFormGonder(event)"><p class="ka-muted">Devam etmek için kullanıcı adı ve şifrenizle giriş yapın.</p><label class="ka-field"><span class="ka-field__label">Kullanıcı Adı</span><input id="girisKullaniciAdi" autocomplete="username" required></label><label class="ka-field"><span class="ka-field__label">Şifre</span><input id="girisSifre" type="password" autocomplete="current-password" required></label><p id="girisHataMetni" class="ka-muted"></p><button id="girisBtn" class="ka-btn ka-btn--lg" type="submit">Giriş Yap</button></form></div></section>
  <section id="onayBekleniyorEkrani" class="ka-login-page ka-hidden" hidden><div class="ka-login-card ka-card"><div class="ka-card__header"><h2>Hesap Onayı Bekleniyor</h2></div><div class="ka-card__body ka-stack"><p id="onayBekleniyorMetin" class="ka-muted">Hesabınız için yönetici onayı bekleniyor.</p><button class="ka-btn ka-btn--secondary" type="button" onclick="cikisYap()">Çıkış Yap</button></div></div></section>
  <main id="app" class="ka-app-shell" hidden>
    <header class="ka-app-header"><button class="ka-brand-home" type="button" data-ka-home-trigger aria-label="Ana sayfaya git"><img class="ka-school-logo" src="assets/icon-192.png" width="40" height="40" alt="Koruk İlk-Ortaokulu"><span class="ka-app-brand"><strong>KORUK İLK-ORTAOKULU</strong><span class="ka-school-meta"><span class="ka-school-meta-label">Koruk Asistan</span><i class="ka-school-meta-sep" aria-hidden="true"></i><span class="ka-weather-chip" data-ka-weather hidden>🌤️ —°</span></span></span></button><div class="ka-header-actions"><span id="v2SyncStatus" class="ka-hidden" aria-hidden="true"></span><span class="ka-sync-dot ka-hidden" title="Senkron durumu" aria-hidden="true"></span><button class="ka-icon-button" type="button" data-ka-header-search aria-label="Ara" title="Ara"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="m20 20-4-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button><button class="ka-icon-button" type="button" data-ka-guide-help aria-label="Nasıl kullanılır?" title="Nasıl kullanılır?"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2.9-1.2 1.8M12 17h.01" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button><button class="ka-header-notification ka-icon-button" type="button" data-ka-header-notification aria-label="Bildirimler"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span data-ka-notification-count hidden></span></button></div></header>
    <section class="ka-app-content"><div class="ka-shell-backbar" data-ka-shell-backbar hidden><button class="ka-shell-back" type="button" data-ka-shell-back aria-label="Önceki sayfaya dön" title="Geri">‹<span>Geri</span></button></div><div class="ka-module-heading ka-hidden" aria-hidden="true"><h2 id="v2ModuleTitle">Ana Sayfa</h2></div><p id="v2ModuleStatus" class="ka-hidden" aria-hidden="true"></p><div id="v2ModuleRoot"></div></section>
    <nav class="ka-app-nav ka-bottom-nav" data-ka-bottom-nav aria-label="Alt gezinme"></nav>
  </main>
