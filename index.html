<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ffc400" data-ka-theme-color>
  <script>
  (()=>{try{let t=localStorage.getItem('ka-theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;const m=document.querySelector('meta[data-ka-theme-color]');if(m)m.content=t==='dark'?'#080808':'#f6f6f4'}catch(_){document.documentElement.setAttribute('data-theme','light')}})();
  </script>
  <script>
  (()=>{const KEY='ka-theme',root=document.documentElement,apply=(theme,persist=true)=>{const t=theme==='dark'?'dark':'light';root.setAttribute('data-theme',t);root.style.colorScheme=t;if(persist){try{localStorage.setItem(KEY,t)}catch(_){}}const meta=document.querySelector('meta[data-ka-theme-color]');if(meta)meta.content=t==='dark'?'#080808':'#f6f6f4';document.querySelectorAll('[data-ka-theme-toggle]').forEach(btn=>{btn.textContent=t==='dark'?'☀️':'🌙';btn.setAttribute('aria-pressed',t==='dark'?'true':'false');btn.setAttribute('aria-label',t==='dark'?'Açık temaya geç':'Koyu temaya geç');btn.title=t==='dark'?'Açık temaya geç':'Koyu temaya geç'});try{window.dispatchEvent(new CustomEvent('koruk:theme-change',{detail:{theme:t}}))}catch(_){}return t};const initial=root.getAttribute('data-theme')==='dark'?'dark':'light';window.KorukTheme={get:()=>root.getAttribute('data-theme')||'light',set:t=>apply(t,true),toggle:()=>apply(root.getAttribute('data-theme')==='dark'?'light':'dark',true)};document.addEventListener('DOMContentLoaded',()=>{apply(initial,false);document.addEventListener('click',e=>{const btn=e.target.closest?.('[data-ka-theme-toggle]');if(btn){e.preventDefault();e.stopPropagation();window.KorukTheme.toggle()}},{capture:true})},{once:true})})();
  </script>
