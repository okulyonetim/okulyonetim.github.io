  <script>
  (()=>{try{let t=localStorage.getItem('ka-theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;const m=document.querySelector('meta[data-ka-theme-color]');if(m)m.content=t==='dark'?'#0d1713':'#17684f'}catch(_){document.documentElement.setAttribute('data-theme','light')}})();
  </script>

<body>
  <section id="configWarning" class="ka-page ka-stack ka-hidden" role="alert"><div class="ka-card"><div class="ka-card__header"><h2>Bağlantı yapılandırması açılamadı</h2></div><div class="ka-card__body"><p class="ka-muted">Firebase başlatılamadı. Yapılandırma ve bağlantı bilgileri kontrol edilmelidir.</p></div></div></section>
  <section id="girisEkrani" class="ka-login-page"><div class="ka-login-card ka-card"><div class="ka-login-brand"><img src="assets/icon-192.png" width="72" height="72" alt="Koruk İlk-Ortaokulu"><div><h1>Koruk Asistan</h1><p class="ka-muted">Koruk İlk-Ortaokulu</p></div></div><form class="ka-card__body ka-stack" onsubmit="girisFormGonder(event)"><p class="ka-muted">Devam etmek için kullanıcı adı ve şifrenizle giriş yapın.</p><label class="ka-field"><span class="ka-field__label">Kullanıcı Adı</span><input id="girisKullaniciAdi" autocomplete="username" required></label><label class="ka-field"><span class="ka-field__label">Şifre</span><input id="girisSifre" type="password" autocomplete="current-password" required></label><p id="girisHataMetni" class="ka-muted"></p><button id="girisBtn" class="ka-btn ka-btn--lg" type="submit">Giriş Yap</button></form></div></section>
  <section id="onayBekleniyorEkrani" class="ka-login-page ka-hidden" hidden><div class="ka-login-card ka-card"><div class="ka-card__header"><h2>Hesap Onayı Bekleniyor</h2></div><div class="ka-card__body ka-stack"><p id="onayBekleniyorMetin" class="ka-muted">Hesabınız için yönetici onayı bekleniyor.</p><button class="ka-btn ka-btn--secondary" type="button" onclick="cikisYap()">Çıkış Yap</button></div></div></section>

path d="M8 8h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span>Hızlı Not</span></button></nav>
