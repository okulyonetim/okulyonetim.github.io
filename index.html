  <script>
  const KaDataPage=(()=>{
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const arr=t=>{const v=window.AppStore?.data?.(t);return Array.isArray(v)?v:[]};
    const canManage=()=>window.AKTIF_KULLANICI?.admin===true||window.PermissionService?.can?.('settings.app.edit','edit')===true;
    const norm=v=>String(v??'').toLocaleUpperCase('tr').replace(/\./g,'').replace(/\s+/g,' ').trim();
    const DRIVE_CLIENT_ID='738103486583-c4r0acm0h4msqn04ntu5dkvgl545jvnt.apps.googleusercontent.com',DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file',DRIVE_FOLDER='Okul Yönetim Paneli Yedekleri';
    let driveTokenClient=null,driveToken='';
    const native=()=>!!window.Capacitor?.isNativePlatform?.();
    async function ensureModules(){await window.AppLoader?.load?.('people');await window.AppLoader?.load?.('transport')}
    function loadScript(src,test){if(test())return Promise.resolve();return new Promise((ok,no)=>{const old=[...document.scripts].find(s=>s.src===src);if(old){old.addEventListener('load',ok,{once:true});old.addEventListener('error',no,{once:true});return}const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
    const ensureXlsx=()=>loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',()=>!!window.XLSX);
    const ensureGis=()=>loadScript('https://accounts.google.com/gsi/client',()=>!!window.google?.accounts?.oauth2);
    async function workbook(file){await ensureXlsx();return XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true})}
    function aoa(wb){const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null})}
    function findHeader(rows,tests){return rows.findIndex(r=>Array.isArray(r)&&tests.every(test=>r.some(c=>test(norm(c)))))}
    function col(header,...names){for(const name of names){const i=header.indexOf(name);if(i>=0)return i}return-1}
    function splitName(value){const p=String(value||'').trim().split(/\s+/).filter(Boolean);if(p.length<2)return{ad:p[0]||'',soyad:''};return{soyad:p.pop(),ad:p.join(' ')}}
    async function backupPayload(){const current=window.AppStore?.state?.data||{},defs=window.SyncEngine?.definitions?.()||[],types=new Set([...Object.keys(window.COL||{}),...Object.keys(current),...defs.map(x=>x.type).filter(Boolean)]),uid=window.KorukLocalFirst?.uid?.()||'',data={};for(const type of types){const live=current[type];if(Array.isArray(live)){data[type]=live;continue}if(uid&&window.KorukLocalFirst?.cached){const cached=await window.KorukLocalFirst.cached(uid,type,[]);if(Array.isArray(cached)&&cached.length)data[type]=cached}}return{format:'koruk-local-first-backup',version:2,createdAt:new Date().toISOString(),data}}
    async function importTeachers(file){if(!canManage())throw new Error('Bu işlem için yetkiniz yok.');const rows=aoa(await workbook(file)),hi=findHeader(rows,[x=>x==='AD'||x==='AD SOYAD']);if(hi<0)throw new Error('AD / AD SOYAD başlığı bulunamadı.');const h=rows[hi].map(norm),cAS=col(h,'AD SOYAD'),cA=col(h,'AD'),cS=col(h,'SOYAD'),cB=col(h,'BRANŞ','BRANS'),cT=col(h,'TELEFON'),cE=col(h,'E-POSTA','EPOSTA','E POSTA'),cSS=col(h,'SORUMLU SINIF','SORUMLU SINIFI'),cU=col(h,'ÜNVAN','UNVAN'),cD=col(h,'DERECE'),cK=col(h,'KADEME');let added=0,updated=0;const list=arr('ogretmenler').slice();for(let i=hi+1;i<rows.length;i++){const r=rows[i]||[];let ad='',soyad='';if(cAS>=0&&r[cAS])({ad,soyad}=splitName(r[cAS]));else{ad=String(r[cA]||'').trim();soyad=String(r[cS]||'').trim()}if(!ad)continue;const d=parseInt(r[cD]),k=parseInt(r[cK]),data={ad,soyad,unvan:cU>=0?String(r[cU]||'').trim():'',brans:cB>=0?String(r[cB]||'').trim():'',derece:Number.isFinite(d)?d:null,kademe:Number.isFinite(k)?k:null,telefon:cT>=0?String(r[cT]||'').trim():'',eposta:cE>=0?String(r[cE]||'').trim():'',sorumluSinif:cSS>=0?String(r[cSS]||'').trim():''},m=list.find(o=>String(o.ad||'').localeCompare(ad,'tr',{sensitivity:'base'})===0&&String(o.soyad||'').localeCompare(soyad,'tr',{sensitivity:'base'})===0);if(m){await window.OgretmenService.kaydet(m.id,data);Object.assign(m,data);updated++}else{const created=await window.OgretmenService.kaydet(null,data);list.push({...data,id:created?.id||''});added++}}return`${added} eklendi, ${updated} güncellendi.`}
    async function parseStudents(file,targetClassId='',service=null){const rows=aoa(await workbook(file)),hi=findHeader(rows,[x=>['ÖĞRENCİ ADI','OGRENCI ADI','AD SOYAD','AD'].includes(x)]);if(hi<0)throw new Error('Öğrenci Adı / Ad Soyad başlığı bulunamadı.');const h=rows[hi].map(norm),cO=col(h,'ÖĞRENCİ ADI','OGRENCI ADI','AD SOYAD','AD'),cN=col(h,'ÖĞRENCİ NO','OGRENCI NO','NO','NUMARA'),cC=col(h,'CİNSİYET','CINSIYET'),cV=col(h,'VELİ ADI','VELI ADI','VELİ AD SOYAD','VELI AD SOYAD','VELİ','VELI'),cY=col(h,'YAKINLIK','YAKINLIK DERECESİ','YAKINLIK DERECESI'),cT1=col(h,'TELEFON 1','TELEFON1','TEL 1','TEL1','TELEFON'),cT2=col(h,'TELEFON 2','TELEFON2','TEL 2','TEL2'),cT3=col(h,'TELEFON 3','TELEFON3','TEL 3','TEL3'),cA=col(h,'ADRES'),cS=col(h,'SINIF','SINIF ADI'),cSV=col(h,'SERVİS','SERVIS','SERVİS ADI','SERVIS ADI'),cNO=col(h,'NOTLAR','NOT'),classes=arr('siniflar'),services=arr('servisler'),out=[];for(let i=hi+1;i<rows.length;i++){const r=rows[i]||[],name=String(r[cO]||'').trim();if(!name)continue;let sinifId=targetClassId;if(!sinifId&&cS>=0){const sa=String(r[cS]||'').trim();sinifId=classes.find(x=>String(x.ad||'').localeCompare(sa,'tr',{sensitivity:'base'})===0)?.id||''}let servisId=service?.id||'',servisAdi=service?.ad||'';if(!service&&cSV>=0){const sv=String(r[cSV]||'').trim(),obj=services.find(x=>String(x.guzergah||x.servisAdi||'').localeCompare(sv,'tr',{sensitivity:'base'})===0);if(obj){servisId=obj.id;servisAdi=obj.guzergah||obj.servisAdi||sv}}out.push({ogrenciAdi:name,ogrenciNo:cN>=0?String(r[cN]||'').trim():'',cinsiyet:cC>=0?String(r[cC]||'').trim():'',veliAdi:cV>=0?String(r[cV]||'').trim():'',yakinlik:cY>=0?String(r[cY]||'').trim():'',telefon:cT1>=0?String(r[cT1]||'').trim():'',telefon1:cT1>=0?String(r[cT1]||'').trim():'',telefon2:cT2>=0?String(r[cT2]||'').trim():'',telefon3:cT3>=0?String(r[cT3]||'').trim():'',adres:cA>=0?String(r[cA]||'').trim():'',sinifId,servisId,servisAdi,notlar:cNO>=0?String(r[cNO]||'').trim():''})}return out}
    async function importStudents(file,classId){if(!canManage())throw new Error('Bu işlem için yetkiniz yok.');const rows=await parseStudents(file,classId),r=await window.SiniflarService.ogrenciVeliListesiIceAktar(rows,arr('veliler'));return`${r.eklenen||0} eklendi, ${r.guncellenen||0} güncellendi.`}
    async function importServiceStudents(file,serviceId){if(!canManage())throw new Error('Bu işlem için yetkiniz yok.');const s=arr('servisler').find(x=>x.id===serviceId);if(!s)throw new Error('Servis seçilmedi.');const rows=await parseStudents(file,'',{id:s.id,ad:s.guzergah||s.servisAdi||''}),r=await window.SiniflarService.ogrenciVeliListesiIceAktar(rows,arr('veliler'));return`${r.eklenen||0} eklendi, ${r.guncellenen||0} güncellendi.`}
    async function downloadTemplate(type){if(!canManage())throw new Error('Bu işlem için yetkiniz yok.');await ensureXlsx();const defs={teachers:[['AD','SOYAD','ÜNVAN','BRANŞ','DERECE','KADEME','TELEFON','E-POSTA','SORUMLU SINIF'],['Ayşe','Yılmaz','Öğretmen','Fen Bilimleri',6,2,'05xxxxxxxxx','ornek@okul.k12.tr','7-A']],students:[['ÖĞRENCİ ADI','ÖĞRENCİ NO','CİNSİYET','VELİ ADI','YAKINLIK','TELEFON 1','TELEFON 2','TELEFON 3','ADRES','SINIF','SERVİS','NOTLAR'],['Ali Veli','123','Erkek','Veli Veli','Anne','05xxxxxxxxx','','','Adres','7-A','','']],service:[['ÖĞRENCİ ADI','ÖĞRENCİ NO','SINIF'],['Ali Veli','123','7-A']]},ws=XLSX.utils.aoa_to_sheet(defs[type]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Veriler');XLSX.writeFile(wb,`koruk-${type}-sablon.xlsx`)}
    async function backup(){if(!canManage())throw new Error('Bu işlem için yetkiniz yok.');const blob=new Blob([JSON.stringify(await backupPayload(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`koruk-yedek-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    async function restore(file){if(!canManage())throw new Error('Bu işlem için yetkiniz yok.');const p=JSON.parse(await file.text());if(p?.format!=='koruk-local-first-backup'||!p.data||typeof p.data!=='object')throw new Error('Geçerli Koruk yedeği değil.');let count=0;for(const[type,rows]of Object.entries(p.data)){if(!window.COL?.[type]||!Array.isArray(rows))continue;for(const item of rows){if(!item?.id)continue;const d={...item};delete d.id;await window.DeviceData.set(type,COL[type],item.id,d,{merge:true});count++}}window.SyncEngine?.schedule?.(80);return`${count} kayıt cihaz verisine geri yüklendi.`}
    async function driveAccess(){if(native())throw new Error('Google Drive yedekleme APK içinde desteklenmiyor. Web sürümünü kullanın.');await ensureGis();if(!driveTokenClient)driveTokenClient=google.accounts.oauth2.initTokenClient({client_id:DRIVE_CLIENT_ID,scope:DRIVE_SCOPE,callback:()=>{}});return new Promise((ok,no)=>{driveTokenClient.callback=r=>{if(r?.error)return no(new Error(r.error));driveToken=r.access_token||'';driveToken?ok(driveToken):no(new Error('Drive erişim belirteci alınamadı.'))};driveTokenClient.requestAccessToken({prompt:driveToken?'':'consent'})})}
    async function driveFolder(){const q=encodeURIComponent(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`),r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,{headers:{Authorization:`Bearer ${driveToken}`}}),j=await r.json();if(!r.ok)throw new Error(j?.error?.message||`Drive klasör arama hatası (${r.status})`);if(j.files?.[0]?.id)return j.files[0].id;const c=await fetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{Authorization:`Bearer ${driveToken}`,'Content-Type':'application/json'},body:JSON.stringify({name:DRIVE_FOLDER,mimeType:'application/vnd.google-apps.folder'})}),cj=await c.json();if(!c.ok||!cj.id)throw new Error(cj?.error?.message||`Drive klasör oluşturma hatası (${c.status})`);return cj.id}
    async function driveBackup(){if(!canManage())throw new Error('Bu işlem için yetkiniz yok.');await driveAccess();const folder=await driveFolder(),boundary='korukBackupBoundary',name=`koruk-yedek-${new Date().toISOString().slice(0,10)}.json`,json=JSON.stringify(await backupPayload(),null,2),meta=JSON.stringify({name,parents:[folder],mimeType:'application/json'}),body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${json}\r\n--${boundary}--`,r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:`Bearer ${driveToken}`,'Content-Type':`multipart/related; boundary=${boundary}`},body}),j=await r.json();if(!r.ok)throw new Error(j?.error?.message||`Drive yükleme hatası (${r.status})`);localStorage.setItem('oySonDriveYedek',new Date().toISOString());return name}
    async function open(){if(!canManage()){window.toast?.('Veri aktarma ve yedekleme için sistem ayarlarını düzenleme yetkisi gerekir.');return false}await ensureModules();const root=document.getElementById('v2ModuleRoot');if(!root)return false;const classes=arr('siniflar').slice().sort((a,b)=>String(a.ad||'').localeCompare(String(b.ad||''),'tr',{numeric:true})),services=arr('servisler').slice().sort((a,b)=>String(a.guzergah||a.servisAdi||'').localeCompare(String(b.guzergah||b.servisAdi||''),'tr')),lastDrive=localStorage.getItem('oySonDriveYedek');root.innerHTML=`<section class="ka-stack" data-data-page><article class="ka-card"><div class="ka-card__body ka-stack"><div><strong>Veri Aktarma Merkezi</strong><div class="ka-muted">Excel dosyaları önce cihaz verisine işlenir; Firestore senkronizasyonu arka planda gerçekleşir.</div></div><div class="ka-row"><span class="ka-badge">Local-first</span><span class="ka-badge">Offline uyumlu yazma</span></div></div></article><article class="ka-card"><div class="ka-card__body ka-stack"><strong>Öğretmenler</strong><div class="ka-muted">AD/AD SOYAD, Branş, Telefon, E-posta, Sorumlu Sınıf, Ünvan, Derece ve Kademe sütunları desteklenir.</div><div class="ka-row"><button class="ka-btn ka-btn--secondary" type="button" data-template="teachers">Şablon İndir</button><label class="ka-btn">Excel Seç<input type="file" accept=".xlsx,.xls" data-import="teachers" hidden></label></div></div></article><article class="ka-card"><div class="ka-card__body ka-stack"><strong>Öğrenci / Veli</strong><label class="ka-field"><span class="ka-field__label">Hedef sınıf</span><select id="dataClass"><option value="">Excel sütunundan belirle</option>${classes.map(x=>`<option value="${esc(x.id)}">${esc(x.ad)}</option>`).join('')}</select></label><div class="ka-row"><button class="ka-btn ka-btn--secondary" type="button" data-template="students">Şablon İndir</button><label class="ka-btn">Excel Seç<input type="file" accept=".xlsx,.xls" data-import="students" hidden></
