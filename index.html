    async function importTeachers(file){if(!canManage())throw new Error('Bu işlem için yetkiniz yok.');const rows=aoa(await workbook(file)),hi=findHeader(rows,[x=>x==='AD'||x==='AD SOYAD']);if(hi<0)throw new Error('AD / AD SOYAD başlığı bulunamadı.');const h=rows[hi].map(norm),cAS=col(h,'AD SOYAD'),cA=col(h,'AD'),cS=col(h,'SOYAD'),cB=col(h,'BRANŞ','BRANS'),cT=col(h,'TELEFON'),cE=col(h,'E-POSTA','EPOSTA','E POSTA'),cSS=col(h,'SORUMLU SINIF','SORUMLU SINIFI'),cU=col(h,'ÜNVAN','UNVAN'),cD=col(h,'DERECE'),cK=col(h,'KADEME');let added=0,updated=0;const list=arr('ogretmenler').slice();for(let i=hi+1;i<rows.length;i++){const r=rows[i]||[];let ad='',soyad='';if(cAS>=0&&r[cAS])({ad,soyad}=splitName(r[cAS]));else{ad=String(r[cA]||'').trim();soyad=String(r[cS]||'').trim()}if(!ad)continue;const d=parseInt(r[cD]),k=parseInt(r[cK]),data={ad,soyad,unvan:cU>=0?String(r[cU]||'').trim():'',brans:cB>=0?String(r[cB]||'').trim():'',derece:Number.isFinite(d)?d:null,kademe:Number.isFinite(k)?k:null,telefon:cT>=0?String(r[cT]||'').trim():'',eposta:cE>=0?String(r[cE]||'').trim():'',sorumluSinif:cSS>=0?String(r[cSS]||'').trim():''},m=list.find(o=>String(o.ad||'').localeCompare(ad,'tr',{sensitivity:'base'})===0&&String(o.soyad||'').localeCompare(soyad,'tr',{sensitivity:'base'})===0);if(m){await window.OgretmenService.kaydet(m.id,data);Object.assign(m,data);updated++}else{const created=await window.OgretmenService.kaydet(null,data);list.push({...data,id:created?.id||''});added++}}return`${added} eklendi, ${updated} güncellendi.`}
    async function parseStudents(file,targetClassId='',service=null){const rows=aoa(await workbook(file)),hi=findHeader(rows,[x=>['ÖĞRENCİ ADI','OGRENCI ADI','AD SOYAD','AD'].includes(x)]);if(hi<0)throw new Error('Öğrenci Adı / Ad Soyad başlığı bulunamadı.');const h=rows[hi].map(norm),cO=col(h,'ÖĞRENCİ ADI','OGRENCI ADI','AD SOYAD','AD'),cN=col(h,'ÖĞRENCİ NO','OGRENCI NO','NO','NUMARA'),cC=col(h,'CİNSİYET','CINSIYET'),cV=col(h,'VELİ ADI','VELI ADI','VELİ AD SOYAD','VELI AD SOYAD','VELİ','VELI'),cY=col(h,'YAKINLIK','YAKINLIK DERECESİ','YAKINLIK DERECESI'),cT1=col(h,'TELEFON 1','TELEFON1','TEL 1','TEL1','TELEFON'),cT2=col(h,'TELEFON 2','TELEFON2','TEL 2','TEL2'),cT3=col(h,'TELEFON 3','TELEFON3','TEL 3','TEL3'),cA=col(h,'ADRES'),cS=col(h,'SINIF','SINIF ADI'),cSV=col(h,'SERVİS','SERVIS','SERVİS ADI','SERVIS ADI'),cNO=col(h,'NOTLAR','NOT'),classes=arr('siniflar'),services=arr('servisler'),out=[];for(let i=hi+1;i<rows.length;i++){const r=rows[i]||[],name=String(r[cO]||'').trim();if(!name)continue;let sinifId=targetClassId;if(!sinifId&&cS>=0){const sa=String(r[cS]||'').trim();sinifId=classes.find(x=>String(x.ad||'').localeCompare(sa,'tr',{sensitivity:'base'})===0)?.id||''}let servisId=service?.id||'',servisAdi=service?.ad||'';if(!service&&cSV>=0){const sv=String(r[cSV]||'').trim(),obj=services.find(x=>String(x.guzergah||x.servisAdi||'').localeCompare(sv,'tr',{sensitivity:'base'})===0);if(obj){servisId=obj.id;servisAdi=obj.guzergah||obj.servisAdi||sv}}out.push({ogrenciAdi:name,ogrenciNo:cN>=0?String(r[cN]||'').trim():'',cinsiyet:cC>=0?String(r[cC]||'').trim():'',veliAdi:cV>=0?String(r[cV]||'').trim():'',yakinlik:cY>=0?String(r[cY]||'').trim():'',telefon:cT1>=0?String(r[cT1]||'').trim():'',telefon1:cT1>=0?String(r[cT1]||'').trim():'',telefon2:cT2>=0?String(r[cT2]||'').trim():'',telefon3:cT3>=0?String(r[cT3]||'').trim():'',adres:cA>=0?String(r[cA]||'').trim():'',sinifId,servisId,servisAdi,notlar:cNO>=0?String(r[cNO]||'').trim():''})}return out}

    async function restore(file){if(!canManage())throw new Error('Bu işlem için yetkiniz yok.');const p=JSON.parse(await file.text());if(p?.format!=='koruk-local-first-backup'||!p.data||typeof p.data!=='object')throw new Error('Geçerli Koruk yedeği değil.');const uid=window.KorukLocalFirst?.uid?.()||'';if(!uid)throw new Error('Aktif kullanıcı bulunamadı.');const sync=p?.sync&&typeof p.sync==='object'?p.sync:{},collections=sync.collections&&typeof sync.collections==='object'?sync.collections:{},queued=new Set((Array.isArray(sync.queue)?sync.queue:[]).map(op=>op?.qid).filter(Boolean));let count=0,localOnly=0;for(const[type,rows]of Object.entries(p.data)){if(!Array.isArray(rows))continue;const safe=rows.filter(x=>x&&x.id);await window.KorukLocalFirst.cache(uid,type,safe);window.AppStore?.setData?.(type,safe);const collection=collectionForType(type,collections);if(collection){for(const item of safe){const d={...item};delete d.id;await window.KorukLocalFirst.queue(uid,{kind:'set-doc',collection,id:item.id,data:d,merge:true});count++}}else{localOnly+=safe.length}}for(const[type,tomb]of Object.entries(sync.tombstones||{})){if(!tomb||typeof tomb!=='object')continue;for(const id of Object.keys(tomb)){await window.KorukLocalFirst.tombstone(uid,type,id,true)}}for(const op of Array.isArray(sync.queue)?sync.queue:[]){if(op?.kind&&op?.collection&&!queued.has('restored:'+op.qid)){await window.KorukLocalFirst.queue(uid,op);if(op.qid)queued.add('restored:'+op.qid)}}for(const[name,value]of Object.entries(sync.meta||{})){if(value!=null)await window.KorukLocalFirst.meta(uid,name,value)}const pending=await window.KorukLocalFirst.pending(uid);window.AppStore?.set?.('ui.pendingWrites',pending.length);window.SyncEngine?.schedule?.(80);return`${count+localOnly} kayıt cihaz verisine geri yüklendi (${localOnly} yalnız cihaz); ${pending.length} senkron işlemi kuyruğa alındı.`}

    async function driveFolder(){const q=encodeURIComponent(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`),r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,{headers:{Authorization:`Bearer ${driveToken}`}}),j=await r.json();if(!r.ok)throw new Error(j?.error?.message||`Drive klasör arama hatası (${r.status})`);if(j.files?.[0]?.id)return j.files[0].id;const c=await fetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{Authorization:`Bearer ${driveToken}`,'Content-Type':'application/json'},body:JSON.stringify({name:DRIVE_FOLDER,mimeType:'application/vnd.google-apps.folder'})}),cj=await c.json();if(!c.ok||!cj.id)throw new Error(cj?.error?.message||`Drive klasör oluşturma hatası (${c.status})`);return cj.id}
    async function driveBackup(){if(!canManage())throw new Error('Bu işlem için yetkiniz yok.');await driveAccess();const folder=await driveFolder(),boundary='korukBackupBoundary',name=`koruk-yedek-${new Date().toISOString().slice(0,10)}.json`,json=JSON.stringify(await backupPayload(),null,2),meta=JSON.stringify({name,parents:[folder],mimeType:'application/json'}),body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${json}\r\n--${boundary}--`,r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:`Bearer ${driveToken}`,'Content-Type':`multipart/related; boundary=${boundary}`},body}),j=await r.json();if(!r.ok)throw new Error(j?.error?.message||`Drive yükleme hatası (${r.status})`);const uid=window.KorukLocalFirst?.uid?.()||'';if(uid&&window.KorukLocalFirst?.meta)await window.KorukLocalFirst.meta(uid,'lastDriveBackup',new Date().toISOString());return name}
    async function open(){if(!canManage()){window.toast?.('Veri aktarma ve yedekleme için sistem ayarlarını düzenleme yetkisi gerekir.');return false}await ensureModules();const root=document.getElementById('v2ModuleRoot');if(!root)return false;const classes=arr('siniflar').slice().sort((a,b)=>String(a.ad||'').localeCompare(String(b.ad||''),'tr',{numeric:true})),services=arr('servisler').slice().sort((a,b)=>String(a.guzergah||a.servisAdi||'').localeCompare(String(b.guzergah||b.servisAdi||''),'tr')),uid=window.KorukLocalFirst?.uid?.()||'',lastDrive=uid&&window.KorukLocalFirst?.meta?await window.KorukLocalFirst.meta(uid,'lastDriveBackup'):null;root.innerHTML=`<section class="ka-stack" data-data-page><article class="ka-card"><div class="ka-card__body ka-stack"><div><strong>Veri Aktarma Merkezi</strong><div class="ka-muted">Excel dosyaları önce cihaz verisine işlenir; Firestore senkronizasyonu arka planda gerçekleşir.</div></div><div class="ka-row"><span class="ka-badge">Local-first</span><span class="ka-badge">Offline uyumlu yazma</span></div></div></article><article class="ka-card"><div class="ka-card__body ka-stack"><strong>Öğretmenler</strong><div class="ka-muted">AD/AD SOYAD, Branş, Telefon, E-posta, Sorumlu Sınıf, Ünvan, Derece ve Kademe sütunları desteklenir.</div><div class="ka-row"><button class="ka-btn ka-btn--secondary" type="button" data-template="teachers">Şablon İndir</button><label class="ka-btn">Excel Seç<input type="file" accept=".xlsx,.xls" data-import="teachers" hidden></label></div></div></article><article class="ka-card"><div class="ka-card__body ka-stack"><strong>Öğrenci / Veli</strong><label class="ka-field"><span class="ka-field__label">Hedef sınıf</span><select id="dataClass"><option value="">Excel sütunundan belirle</option>${classes.map(x=>`<option value="${esc(x.id)}">${esc(x.ad)}</option>`).join('')}</select></label><div class="ka-row"><button class="ka-btn ka-btn--secondary" type="button" data-template="students">Şablon İndir</button><label class="ka-btn">Excel Seç<input type="file" accept=".xlsx,.xls" data-import="students" hidden></label></div></div></article><article class="ka-card"><div class="ka-card__body ka-stack"><strong>Servis Öğrencileri</strong><label class="ka-field"><span class="ka-field__label">Servis</span><select id="dataService"><option value="">Servis seçiniz…</option>${services.map(x=>`<option value="${esc(x.id)}">${esc(x.guzergah||x.servisAdi||'—')}</option>`).join('')}</select></label><div class="ka-row"><button class="ka-btn ka-btn--secondary" type="button" data-template="service">Şablon İndir</button><label class="ka-btn">Excel Seç<input type="file" accept=".xlsx,.xls" data-import="service" hidden></label></div></div></article><article class="ka-card"><div class="ka-card__body ka-stack"><strong>Yedekleme</strong><div class="ka-muted">AppStore, IndexedDB cache’leri, bekleyen senkron kuyruğu ve tombstone kayıtları birlikte yedeklenir.</div><div class="ka-row"><button class="ka-btn ka-btn--secondary" type="button" data-backup>JSON Yedekle</button><label class="ka-btn">Yedeği Geri Yükle<input type="file" accept="application/json,.json" data-restore hidden></label>${native()?'':`<button class="ka-btn" type="button" data-drive-backup>Google Drive'a Yedekle</button>`}</div>${native()?'<div class="ka-muted">Google Drive yedekleme APK içinde kapalıdır; JSON yedeği kullanılabilir.</div>':`<div class="ka-muted" data-drive-status>${lastDrive?`Son Drive yedeği: ${esc(new Date(lastDrive).toLocaleString('tr-TR'))}`:'Henüz Google Drive yedeği alınmadı.'}</div>`}</div></article></section>`;root.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>downloadTemplate(b.dataset.template).catch(e=>toast?.('Şablon oluşturulamadı: '+e.message)));root.querySelectorAll('[data-import]').forEach(input=>input.onchange=async()=>{const f=input.files?.[0];if(!f)return;input.disabled=true;try{let msg='';if(input.dataset.import==='teachers')msg=await importTeachers(f);else if(input.dataset.import==='students')msg=await importStudents(f,root.querySelector('#dataClass')?.value||'');else{const sid=root.querySelector('#dataService')?.value||'';if(!sid)throw new Error('Önce servis seçin.');msg=await importServiceStudents(f,sid)}toast?.('İçe aktarma tamamlandı: '+msg)}catch(e){console.error('[DataPage/import]',e);toast?.('İçe aktarma hatası: '+(e?.message||e))}finally{input.value='';input.disabled=false}});root.querySelector('[data-backup]').onclick=async()=>{try{await backup();toast?.('JSON yedeği hazırlandı.')}catch(e){toast?.(e?.message||String(e))}};root.querySelector('[data-restore]').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(!confirm('Yedek kayıtları mevcut cihaz verisiyle birleştirerek geri yüklemek istiyor musunuz?')){e.target.value='';return}try{toast?.(await restore(f))}catch(err){toast?.('Yedek geri yüklenemedi: '+(err?.message||err))}finally{e.target.value=''}};const dbtn=root.querySelector('[data-drive-backup]');if(dbtn)dbtn.onclick=async()=>{const st=root.querySelector('[data-drive-status]');dbtn.disabled=true;if(st)st.textContent='Google Drive yetkilendirmesi bekleniyor…';try{const name=await driveBackup();if(st)st.textContent=`Son Drive yedeği: ${new Date().toLocaleString('tr-TR')} ✓`;toast?.(`Yedek Google Drive'a kaydedildi: ${name}`)}catch(e){if(st)st.textContent='Drive yedekleme başarısız: '+(e?.message||e);toast?.('Drive yedekleme hatası: '+(e?.message||e))}finally{dbtn.disabled=false}};const titleEl=document.getElementById('v2ModuleTitle');if(titleEl)titleEl.textContent='Veriler';return true}
    return{open}
  })();window.KaDataPage=KaDataPage;
  </script>
