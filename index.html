<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ffc400" data-ka-theme-color>
  <script>
  (()=>{try{let t=localStorage.getItem('ka-theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;const m=document.querySelector('meta[data-ka-theme-color]');if(m)m.content=t==='dark'?'#080808':'#f6f6f4'}catch(_){document.documentElement.setAttribute('data-theme','light')}})();
  </script>
  <script>
  (()=>{const KEY='ka-theme',root=document.documentElement,apply=(theme,persist=true)=>{const t=theme==='dark'?'dark':'light';root.setAttribute('data-theme',t);root.style.colorScheme=t;if(persist){try{localStorage.setItem('ka-theme',t)}catch(_){}}const meta=document.querySelector('meta[data-ka-theme-color]');if(meta)meta.content=t==='dark'?'#080808':'#f6f6f4';document.querySelectorAll('[data-ka-theme-toggle]').forEach(btn=>{btn.textContent=t==='dark'?'☀️':'🌙';btn.setAttribute('aria-pressed',t==='dark'?'true':'false');btn.setAttribute('aria-label',t==='dark'?'Açık temaya geç':'Koyu temaya geç');btn.title=t==='dark'?'Açık temaya geç':'Koyu temaya geç'});try{window.dispatchEvent(new CustomEvent('koruk:theme-change',{detail:{theme:t}}))}catch(_){}return t};const initial=root.getAttribute('data-theme')==='dark'?'dark':'light';window.KorukTheme={get:()=>root.getAttribute('data-theme')||'light',set:t=>apply(t,true),toggle:()=>apply(root.getAttribute('data-theme')==='dark'?'light':'dark',true)};document.addEventListener('DOMContentLoaded',()=>{apply(initial,false);document.addEventListener('click',e=>{const btn=e.target.closest?.('[data-ka-theme-toggle]');if(btn){e.preventDefault();e.stopPropagation();window.KorukTheme.toggle()}},{capture:true})},{once:true})})();
  </script>

<body>
  <section id="configWarning" class="ka-page ka-stack ka-hidden" role="alert"><div class="ka-card"><div class="ka-card__header"><h2>Bağlantı yapılandırması açılamadı</h2></div><div class="ka-card__body"><p class="ka-muted">Firebase başlatılamadı. Yapılandırma ve bağlantı bilgileri kontrol edilmelidir.</p></div></div></section>
  <section id="girisEkrani" class="ka-login-page"><div class="ka-login-card ka-card"><div class="ka-login-brand"><img src="assets/icon-192.png" width="72" height="72" alt="Koruk İlk-Ortaokulu"><div><h1>Koruk Asistan</h1><p class="ka-muted">Koruk İlk-Ortaokulu</p></div></div><form class="ka-card__body ka-stack" onsubmit="girisFormGonder(event)"><p class="ka-muted">Devam etmek için kullanıcı adı ve şifrenizle giriş yapın.</p><label class="ka-field"><span class="ka-field__label">Kullanıcı Adı</span><input id="girisKullaniciAdi" autocomplete="username" required></label><label class="ka-field"><span class="ka-field__label">Şifre</span><input id="girisSifre" type="password" autocomplete="current-password" required></label><p id="girisHataMetni" class="ka-muted"></p><button id="girisBtn" class="ka-btn ka-btn--lg" type="submit">Giriş Yap</button></form></div></section>
  <section id="onayBekleniyorEkrani" class="ka-login-page ka-hidden" hidden><div class="ka-login-card ka-card"><div class="ka-card__header"><h2>Hesap Onayı Bekleniyor</h2></div><div class="ka-card__body ka-stack"><p id="onayBekleniyorMetin" class="ka-muted">Hesabınız için yönetici onayı bekleniyor.</p><button class="ka-btn ka-btn--secondary" type="button" onclick="cikisYap()">Çıkış Yap</button></div></div></section>
  <main id="app" class="ka-app-shell" hidden>
    <header class="ka-app-header"><button class="ka-brand-home" type="button" data-ka-home-trigger aria-label="Ana sayfaya git"><img class="ka-school-logo" src="assets/icon-192.png" width="40" height="40" alt="Koruk İlk-Ortaokulu"><span class="ka-app-brand"><strong>KORUK İLK-ORTAOKULU</strong><span class="ka-school-meta"><span class="ka-school-meta-label">Koruk Asistan</span><i class="ka-school-meta-sep" aria-hidden="true"></i><span class="ka-weather-chip" data-ka-weather hidden>🌤️ —°</span></span></span></button><div class="ka-header-actions"><span id="v2SyncStatus" class="ka-hidden" aria-hidden="true"></span><span class="ka-sync-dot ka-hidden" title="Senkron durumu" aria-hidden="true"></span><button class="ka-icon-button" type="button" data-ka-theme-toggle aria-label="Açık/koyu tema" title="Açık/koyu tema">🌙</button><button class="ka-header-notification ka-icon-button" type="button" data-ka-header-notification aria-label="Bildirimler"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span data-ka-notification-count hidden></span></button><button class="ka-header-profile ka-avatar" type="button" data-ka-header-profile aria-label="Profilim">K</button></div></header>
    <section class="ka-app-content"><div class="ka-shell-backbar" data-ka-shell-backbar hidden><button class="ka-shell-back" type="button" data-ka-shell-back aria-label="Önceki sayfaya dön" title="Geri">‹<span>Geri</span></button></div><div class="ka-module-heading ka-hidden" aria-hidden="true"><h2 id="v2ModuleTitle">Ana Sayfa</h2></div><p id="v2ModuleStatus" class="ka-hidden" aria-hidden="true"></p><div id="v2ModuleRoot"></div></section>
    <section id="kaMenuLayer" class="ka-menu-layer" hidden aria-label="Menü"></section>
    <nav class="ka-app-nav ka-bottom-nav" aria-label="Alt navigasyon"><button class="ka-bottom-item active" type="button" data-ka-shell-action="home" aria-current="page"><span class="ka-bottom-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></span><span>Ana Sayfa</span></button><button class="ka-bottom-item" type="button" data-ka-shell-action="profile"><span class="ka-bottom-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span>Profilim</span></button><button class="ka-bottom-item ka-bottom-menu" type="button" data-ka-shell-action="menu" aria-label="Menü"><span class="ka-bottom-menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="4" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="14" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></svg></span></button><button class="ka-bottom-item" type="button" data-ka-shell-action="search"><span class="ka-bottom-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span>Arama</span></button><button class="ka-bottom-item" type="button" data-ka-shell-action="note"><span class="ka-bottom-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span>Hızlı Not</span></button></nav>
